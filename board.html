<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>춘장게임즈 게시판</title>
<meta name="description" content="춘장게임즈 게임을 해 보고 하고 싶은 말을 남기는 곳.">
<meta property="og:type" content="website">
<meta property="og:title" content="춘장게임즈 게시판">
<meta property="og:description" content="게임 해 보고 하고 싶은 말을 남겨 주세요.">
<meta property="og:url" content="https://myunghoho-bot.github.io/chunjang-games/board.html">
<meta property="og:image" content="https://myunghoho-bot.github.io/chunjang-games/img/og.jpg">
<meta name="theme-color" content="#b5241c">
<link rel="icon" href="bowl.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="wrap">
  <a class="sign" href="./">
    <img class="bowl" src="bowl.svg" alt="" width="104" height="90">
    <div>
      <h1>춘장게임즈</h1>
      <p>머릿속 상상을 그대로 만든 게임</p>
    </div>
  </a>
  <nav class="nav" aria-label="춘장게임즈 안내">
    <a href="./">게임 고르기</a>
    <a href="history.html">역사관</a>
    <a href="board.html" aria-current="page">게시판</a>
    <p class="visits" id="visits" hidden></p>
  </nav>
</header>

<main class="wrap">
  <div class="hist-head">
    <h2>게시판</h2>
    <p class="lead">게임 해 보고 하고 싶은 말을 남겨 주세요. 어른이 확인한 글만 여기에 보여요.</p>
  </div>

  <form class="board-form" id="form" autocomplete="off">
    <label for="name">이름</label>
    <input id="name" name="name" maxlength="20" required placeholder="별명도 좋아요">
    <label for="body">하고 싶은 말</label>
    <textarea id="body" name="body" maxlength="500" required placeholder="어떤 게임이 재밌었어요? 이런 게임도 만들어 주세요!"></textarea>
    <div class="hp" aria-hidden="true"><input id="website" name="website" tabindex="-1"></div>
    <div class="row">
      <button type="submit" id="send">글 남기기</button>
      <p class="hint">진짜 이름, 학교, 전화번호, 사는 곳은 쓰지 마세요.</p>
    </div>
  </form>
  <p class="notice" id="notice" role="status"></p>
  <p class="pending" id="pending"></p>

  <section class="posts" aria-labelledby="posts-title">
    <h3 id="posts-title">남긴 글</h3>
    <div id="list"><p class="empty">불러오는 중이에요.</p></div>
  </section>
</main>

<footer class="wrap">
  <p>게임 아이디어는 춘장게임즈가 내고, 코드는 Claude와 같이 만들었어요.</p>
</footer>

<script src="counter.js"></script>
<script src="board-config.js"></script>
<script>
const $ = id => document.getElementById(id);
const ready = BOARD.url && BOARD.key;
const headers = () => {
  const h = { apikey: BOARD.key, 'Content-Type': 'application/json' };
  if (BOARD.key.startsWith('eyJ')) h.Authorization = 'Bearer ' + BOARD.key; // 예전 anon 키
  return h;
};
const api = (path, opt = {}) => fetch(BOARD.url.replace(/\/$/, '') + '/rest/v1/' + path, { headers: headers(), ...opt });

function say(msg, err) {
  $('notice').textContent = msg;
  $('notice').className = 'notice' + (err ? ' err' : '');
}

function showPosts(posts) {
  const list = $('list');
  list.textContent = '';
  if (!posts.length) {
    list.innerHTML = '<p class="empty">아직 보이는 글이 없어요. 첫 글을 남겨 주세요!</p>';
    return;
  }
  posts.forEach(p => {
    const art = document.createElement('article');
    art.className = 'post';
    const head = document.createElement('header');
    const who = document.createElement('span');
    who.textContent = p.name;
    const when = document.createElement('time');
    when.dateTime = p.created_at;
    when.textContent = new Date(p.created_at).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', timeZone: 'Asia/Seoul' });
    head.append(who, when);
    const body = document.createElement('p');
    body.textContent = p.body;
    art.append(head, body);
    list.appendChild(art);
  });
}

function load() {
  api('posts?select=id,created_at,name,body&order=created_at.desc&limit=100')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(showPosts)
    .catch(() => { $('list').innerHTML = '<p class="empty">글을 못 불러왔어요. 조금 뒤에 다시 와 주세요.</p>'; });
  api('rpc/pending_count', { method: 'POST', body: '{}' })
    .then(r => (r.ok ? r.json() : 0))
    .then(n => { $('pending').textContent = n > 0 ? '어른 확인을 기다리는 글이 ' + n + '개 있어요.' : ''; })
    .catch(() => {});
}

if (!ready) {
  [...$('form').elements].forEach(e => { e.disabled = true; });
  say('게시판은 준비 중이에요. 곧 열려요!');
  $('list').innerHTML = '<p class="empty">게시판이 열리면 여기에 글이 보여요.</p>';
} else {
  load();
  $('form').addEventListener('submit', ev => {
    ev.preventDefault();
    if ($('website').value) return;               // 사람 눈에 안 보이는 칸을 채웠으면 광고 로봇
    let last = 0;
    try { last = Number(localStorage.getItem('chunjang-board-last')) || 0; } catch (e) {}
    if (Date.now() - last < 60000) { say('글은 1분에 하나씩만 쓸 수 있어요.', true); return; }
    const name = $('name').value.trim(), body = $('body').value.trim();
    if (!name || !body) { say('이름과 하고 싶은 말을 둘 다 써 주세요.', true); return; }
    $('send').disabled = true;
    api('posts', { method: 'POST', headers: { ...headers(), Prefer: 'return=minimal' }, body: JSON.stringify({ name, body }) })
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        try { localStorage.setItem('chunjang-board-last', String(Date.now())); } catch (e) {}
        $('body').value = '';
        say('글이 들어갔어요! 어른이 확인하면 여기에 보여요.');
        load();
      })
      .catch(() => say('글을 못 보냈어요. 조금 뒤에 다시 해 주세요.', true))
      .finally(() => { $('send').disabled = false; });
  });
}
</script>
</body>
</html>
