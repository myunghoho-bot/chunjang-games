<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>새플링 2D</title>
<style>
:root{--bg:#f3f5f2;--panel:#ffffff;--ink:#1d2621;--sub:#5b6a61;--line:#d5ddd7;--accent:#1f8a5b;--warn:#c0572b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1210;--panel:#151c19;--ink:#e3ece6;--sub:#94a69b;--line:#26322c;--accent:#4fd18f;--warn:#ff8a5c}}
:root[data-theme="dark"]{--bg:#0d1210;--panel:#151c19;--ink:#e3ece6;--sub:#94a69b;--line:#26322c;--accent:#4fd18f;--warn:#ff8a5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Malgun Gothic",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
.stat{color:var(--sub)}.stat b{color:var(--ink)}
.btn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
.btn.on,.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;display:flex;min-height:0}
#wrap{flex:1;position:relative;min-width:0;background:#0a1420;touch-action:none}
#cv{display:block;width:100%;height:100%}
#tools{position:absolute;left:8px;top:8px;right:60px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#tools>*{pointer-events:auto}
.tb{background:rgba(20,28,25,.85);color:#e8f0ea;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:13px}
.tb.on{background:#1f8a5b;border-color:#4fd18f}
#palette{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;overflow-x:auto}
.pc{flex:none;background:rgba(20,28,25,.88);color:#e8f0ea;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:4px;cursor:pointer;text-align:center;font-size:12px;width:78px}
.pc.on{border-color:#4fd18f;box-shadow:0 0 0 1px #4fd18f}
.pc canvas{display:block;margin:0 auto;width:60px;height:44px}
#pad{position:absolute;left:16px;bottom:70px;display:none;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;z-index:3}
#pad button{font-size:18px;padding:0;touch-action:none}
#hud{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(10,16,20,.85);color:#e8f0ea;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 12px;font-size:13px;display:none;max-width:90%;text-align:center;z-index:3}
#cam{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
#brushBox{display:none;align-items:center;gap:4px;background:rgba(20,28,25,.85);color:#e8f0ea;border-radius:8px;padding:4px 8px;font-size:12px}
aside{width:340px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:8px 0;color:var(--sub);cursor:pointer;font:inherit}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--accent)}
.pane{flex:1;overflow:auto;padding:10px 12px;display:none}.pane.on{display:block}
#p-tree{padding:6px 0 6px 6px}
#tree{display:block;cursor:pointer}
.sp{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.sp .n{flex:1}.sp .c{color:var(--sub)}.sp .st{color:var(--sub);font-size:12px}.sub{color:var(--sub);font-size:12px}
.log div{padding:3px 0;border-bottom:1px solid var(--line)}.log .t{color:var(--sub);margin-right:6px}
.gene{display:flex;justify-content:space-between;padding:2px 0}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:4px}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.trend{font-size:12px;color:var(--sub)}
#p-civ h3{margin:4px 0 2px;font-size:15px}#p-civ h4{margin:10px 0 4px;font-size:13px}
#p-civ table{width:100%;border-collapse:collapse;font-size:12px}
#p-civ th,#p-civ td{text-align:left;padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:top}
#p-civ th{color:var(--sub);font-weight:600}
.pet{padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}
.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,8,8,.8);padding:16px;z-index:5}
.card{background:var(--panel);color:var(--ink);border-radius:12px;padding:18px;max-width:640px;width:100%;max-height:100%;overflow:auto}
.card h2{margin:0 0 6px}
.envs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.env{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}.env.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.env small{color:var(--sub)}
.ed{display:flex;flex-wrap:wrap;gap:14px}
.ed canvas{width:220px;height:170px;background:#16301f;border-radius:10px;flex:none}
.sl{flex:1;min-width:230px}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.part{border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;user-select:none}
.part.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sl label{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}
.sl input[type=range]{width:100%}
#intro{position:absolute;inset:0;display:none;background:#02040a;z-index:6}
#intro canvas{width:100%;height:100%;display:block}
#introTxt{position:absolute;left:0;right:0;top:16px;text-align:center;color:#e8eefc;font-size:17px;font-weight:700}
#toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);background:var(--panel);color:var(--ink);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;display:none;max-width:90%;z-index:7}
@media (max-width:760px){main{flex-direction:column}aside{width:100%;height:42%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>새플링 2D</h1>
  <span class="stat">시간 <b id="time">0</b></span>
  <span class="stat">최고 단계 <b id="stage">-</b></span>
  <span class="stat">동물 <b id="na">0</b> · 식물 <b id="np">0</b></span>
  <span class="stat">산소 <b id="o2">0</b>%</span>
  <span id="speed"></span>
  <button class="btn" id="farBtn" style="display:none">먼 미래로 (1조 년)</button>
  <button class="btn" id="newWorld">새 세상</button>
</header>
<main>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="tools"></div>
    <div id="palette"></div>
    <div id="cam"><button class="tb" id="zin">+</button><button class="tb" id="zout">−</button><button class="tb" id="fit">전체</button><button class="tb" id="follow">따라가기</button><button class="tb" id="drive">내가 조종하기</button></div>
    <div id="pad"><span></span><button class="tb" data-d="u">▲</button><span></span><button class="tb" data-d="l">◀</button><button class="tb" id="padE" style="font-size:14px">E</button><button class="tb" data-d="r">▶</button><span></span><button class="tb" data-d="d">▼</button><span></span></div>
    <div id="hud"></div>
    <div id="toast"></div>
    <div class="modal" id="startM"><div class="card">
      <h2>원시 수프 고르기</h2>
      <div class="sub">미생물 몇 마리만 심고, 그다음은 지켜보기만 해요. 언제든 위쪽 "창조"로 내가 만든 생물을 풀어놓을 수도 있어요.</div>
      <div class="envs" id="envs"></div>
      <button class="btn pri" id="go">미생물 심기</button> <button class="btn" id="reroll">지형 다시 뽑기</button> <button class="btn" id="sbxBtn">샌드박스 모드 (내가 처음부터 다 만들기)</button> <span class="sub" id="seedTxt"></span>
    </div></div>
    <div class="modal" id="edM"><div class="card">
      <h2 id="edTitle">창조</h2>
      <div class="ed"><canvas id="edCv"></canvas><div class="sl" id="edSl"></div></div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input id="edName" class="btn" style="flex:1;min-width:140px" maxlength="16" placeholder="이름">
        <button class="btn" id="edRand">아무렇게나</button><button class="btn" id="edCancel">취소</button><button class="btn pri" id="edOk">만들기</button>
      </div>
    </div></div>
    <div class="modal" id="ending"><div class="card" id="endCard"></div></div>
    <div id="intro"><canvas id="introCv"></canvas><div id="introTxt"></div></div>
  </div>
  <aside>
    <div class="tabs"><button data-p="species" class="on">종 목록</button><button data-p="tree">계통도</button><button data-p="info">종 정보</button><button data-p="civ">문명</button><button data-p="log">사건</button></div>
    <div class="pane on" id="p-species"></div>
    <div class="pane" id="p-tree"><canvas id="tree"></canvas></div>
    <div class="pane" id="p-info">종을 누르거나, 보기 도구로 생물을 눌러 보세요.</div>
    <div class="pane" id="p-civ"></div>
    <div class="pane log" id="p-log"></div>
  </aside>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
// ===================== 데이터 표 (기능 추가는 여기부터) =====================
// 동물 유전자 (돌연변이·종 정보·창조가 이 표를 씀)
const AG=[
  {k:'size',  n:'크기',       min:1.5,max:24, step:.35, init:2.2},
  {k:'speed', n:'속도',       min:.2, max:3,  step:.07, init:.8},
  {k:'sense', n:'감각 범위',   min:10, max:160,step:3,   init:30},
  {k:'diet',  n:'먹이 (풀 → 고기)',min:0,max:1,step:.03,init:.1},
  {k:'legs',  n:'다리',       min:0,  max:8,  step:.12, init:0},
  {k:'arms',  n:'팔',         min:0,  max:1,  step:.03, init:0},
  {k:'fins',  n:'물결막',    min:0,  max:1,  step:.03, init:.6},
  {k:'eyes',  n:'눈',         min:0,  max:1,  step:.03, init:.1},
  {k:'armor', n:'껍데기',      min:0,  max:1,  step:.03, init:0},
  {k:'spikes',n:'가시',       min:0,  max:1,  step:.03, init:0},
  {k:'social',n:'무리 짓기',   min:0,  max:1,  step:.03, init:0},
  {k:'dig',   n:'땅 파기',     min:0,  max:1,  step:.03, init:0},
  {k:'intel', n:'지능',       min:0,  max:1,  step:.006,init:0},
  {k:'heat',  n:'좋아하는 온도',min:0, max:1,  step:.02, init:.5},
  {k:'hue',   n:'색깔',       min:0,  max:360,step:6,   init:170, wrap:true},
  {k:'pattern',n:'무늬',      min:0,  max:2,  step:.08, init:0},
];
// 식물 유전자
const PG=[
  {k:'max',   n:'다 자란 크기', min:1,  max:16, step:.25, init:1.6},
  {k:'grow',  n:'자라는 속도',  min:.1, max:2,  step:.05, init:1.4},
  {k:'range', n:'씨앗 거리',    min:6,  max:120,step:3,   init:22},
  {k:'seeds', n:'씨앗 수',      min:.2, max:2,  step:.05, init:1.8},
  {k:'moist', n:'좋아하는 물기',min:0,  max:1,  step:.02, init:.5},
  {k:'heat',  n:'좋아하는 온도',min:0,  max:1,  step:.02, init:.5},
  {k:'thorns',n:'가시',        min:0,  max:1,  step:.03, init:0},
  {k:'aqua',  n:'물속에서 자람',min:0,  max:1,  step:.03, init:1},
  {k:'hue',   n:'색깔',        min:50, max:170,step:3,   init:150},
];
const GK=AG.map(d=>d.k),NG=GK.length;
// 창조: 있다/없다로 켜고 끄는 몸 부위 (켜면 on 값, 끄면 off 값)
const PARTS=[
  {k:'legs',n:'다리',on:4,off:0},{k:'arms',n:'팔',on:1,off:0},{k:'eyes',n:'눈',on:.6,off:0},{k:'fins',n:'물결막',on:1,off:0},
  {k:'armor',n:'껍데기',on:.8,off:0},{k:'spikes',n:'가시',on:.8,off:0},{k:'social',n:'무리 짓기',on:.7,off:0},{k:'dig',n:'땅 파기',on:.8,off:0},
];
const ED_SLIDERS=['size','speed','diet','hue','pattern'];
// 원시 수프 (예전처럼 고름)
const ENVS=[
  {id:'pond',n:'웅덩이',  d:'따뜻하고 해초가 많아요',  temp:.06,algae:240,heat:.55},
  {id:'vent',n:'열수구',  d:'뜨거운 바다에서 시작해요',temp:.15,algae:150,heat:.8},
  {id:'sea', n:'얕은 바다',d:'골고루 무난해요',        temp:0,  algae:180,heat:.5},
];
// 진화 단계 (종마다 따로 판정). a=종 평균 유전자, sp.land=땅에 사는 비율
const STAGES=[
  {n:'원핵생물',          test:()=>true},
  {n:'광합성 · 산소',      test:(a,w)=>w.o2>2.5},
  {n:'진핵생물',          test:(a,w)=>a.size>3.5&&w.o2>2.5},
  {n:'다세포 생물',        test:a=>a.size>5&&(a.legs>=1||a.fins>.5)},
  {n:'동물 · 포식',        test:a=>(a.eyes>.3&&a.speed>.9)||a.diet>.45},
  {n:'육상 진출 · 바다의 강자',test:(a,w,sp)=>sp.land>.3&&a.legs>=1.5||sp.land<.1&&a.size>9&&a.eyes>.45},
  {n:'신경계 · 사회성',    test:a=>a.intel>.35&&a.social>.5},
  {n:'지적생명체',        test:a=>a.intel>.8},
];
// 이때까지 안 나오면 핵심 진화로 꼭 나옴 (억 년)
const LANDP_T=8,LANDA_T=12,INTEL_T=30,INTEL2_T=32;
const INTEL_SEED={
  land:{size:9,speed:1.3,legs:4,arms:1,eyes:.6,dig:.85,social:.85,intel:.88,diet:.5,sense:100,fins:.1},
  fish:{size:12,speed:1.4,legs:0,arms:.7,fins:1,eyes:.8,social:.7,intel:.88,diet:.5,sense:110},
};
const BREED_FEAT=[
  {n:'방울눈',d:'눈이 동그랗게 커졌어요',ch:{eyes:.2}},{n:'꼬마',d:'몸이 작고 귀여워졌어요',ch:{size:-2}},
  {n:'튼튼',d:'몸이 튼튼해졌어요',ch:{size:2,armor:.1}},{n:'날쌘',d:'아주 빨라졌어요',ch:{speed:.3}},
  {n:'순둥이',d:'아주 순해졌어요',ch:{diet:-.2,social:.15}},{n:'영리한',d:'말귀를 잘 알아들어요',ch:{intel:.08,sense:15}},
  {n:'복슬',d:'가시가 보들보들한 털이 됐어요',ch:{spikes:-.3}},{n:'반짝이',d:'몸 색이 반짝반짝 예뻐졌어요',ch:{},hue:90},
];
const SPEEDS=[0,1,10,100,1000];
const MAXA=800,MAXP=2600,TICK=.0004; // 동물·식물 최대 수, 1틱 = 0.0004억 년
const SPECIATE=.3;
// ===================== 지도 =====================
const TW=200,TH=130,TS=8,WW=TW*TS,WH=TH*TS;let WL=.42,M0=null; // M0 = 처음 물기 (사막이 돼도 기억해 둠)
const H=new Float32Array(TW*TH),M=new Float32Array(TW*TH),T=new Float32Array(TW*TH);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(s){s>>>=0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function noise(sd,gw,gh){const r=rng(sd),a=new Float32Array((gw+2)*(gh+2));for(let i=0;i<a.length;i++)a[i]=r();
  return(x,y)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy),W2=gw+2,v=(xx,yy)=>a[clamp(yy,0,gh+1)*W2+clamp(xx,0,gw+1)];
    const t=v(x0,y0)+(v(x0+1,y0)-v(x0,y0))*sx,b=v(x0,y0+1)+(v(x0+1,y0+1)-v(x0,y0+1))*sx;return t+(b-t)*sy}}
let seed=Date.now()%100000,tempOff=0;
function genWorld(){
  const mk=sd=>{const ns=[];let f=1;for(let o=0;o<5;o++){ns.push([noise(sd+o*101,Math.ceil(4*f)+1,Math.ceil(3*f)+1),f]);f*=2}
    return(x,y)=>{let s=0,amp=1,tot=0;for(const [n,ff] of ns){s+=n(x*4*ff,y*3*ff)*amp;tot+=amp;amp*=.5}return s/tot}};
  const fh=mk(seed),fm=mk(seed+7777);let mn=9,mx=-9;
  for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const i=y*TW+x,nx=x/TW,ny=y/TH,edge=Math.max(Math.abs(nx-.5)*2,Math.abs(ny-.5)*2);
    const v=fh(nx,ny)-Math.pow(edge,3)*.45;H[i]=v;if(v<mn)mn=v;if(v>mx)mx=v;M[i]=fm(nx,ny)}
  let a=9,b=-9;for(let i=0;i<M.length;i++){if(M[i]<a)a=M[i];if(M[i]>b)b=M[i]}
  for(let i=0;i<H.length;i++){H[i]=(H[i]-mn)/(mx-mn)*.95;M[i]=(M[i]-a)/(b-a)}
  M0=M.slice();
  calcTemp();
}
let terrDirty=true;
function calcTemp(x0=0,y0=0,x1=TW-1,y1=TH-1){const all=x0===0&&y0===0&&x1===TW-1&&y1===TH-1;for(let y=Math.max(0,y0);y<=Math.min(TH-1,y1);y++)for(let x=Math.max(0,x0);x<=Math.min(TW-1,x1);x++){const i=y*TW+x;T[i]=clamp(1.05+tempOff+(W.dry||0)*.45-Math.abs(y/TH-.5)*1.9-Math.max(0,H[i]-WL)*1.1,0,1)}if(all)terrDirty=true;else invalidateTiles(x0,y0,x1,y1)}
const tIdx=(x,y)=>clamp(y/TS|0,0,TH-1)*TW+clamp(x/TS|0,0,TW-1);
const isWater=i=>H[i]<WL;
const isSnow=i=>H[i]>=WL&&(H[i]>.86||T[i]<.1);
const TYPE_N=i=>isWater(i)?(H[i]<WL-.08?'깊은 바다':'얕은 물'):isSnow(i)?'눈 덮인 땅':H[i]>.74?'바위산':H[i]<WL+.03?'모래밭':M[i]<.3&&(T[i]>.55||(W.dry||0)>.5)?'사막':M[i]>.65?'숲 땅':T[i]<.3?'툰드라':'풀밭';
// ===== 지형 그림: 지도를 100px 조각으로 나눠, 확대한 만큼 촘촘하게 다시 그림 (확대해도 안 깨짐) =====
const CW=100,CCX=Math.ceil(WW/CW),CCY=Math.ceil(WH/CW);
const chunkCache=new Map(),queued=new Set();let genQueue=[];
function hash2(x,y){let h=(x*374761393+y*668265263+seed*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}

  drawAnimal(cx,I.me,z,I.me.age*.05+I.me.ph);
  cx.strokeStyle='#ffe066';cx.lineWidth=.8;cx.beginPath();cx.arc(I.me.x,I.me.y,9,0,6.283);cx.stroke(); // 나 표시
  // 방 이름
  cx.font='bold 6px sans-serif';cx.textAlign='center';
  for(const r of I.R){if(r.kind==='door'||r.kind==='hall2'||r.kind==='street'||!inV(r.x,r.y,r.w,r.h))continue;const lb=r.kind==='zoo'&&r.sp?'🛡 '+r.label:r.label;
    cx.fillStyle='rgba(0,0,0,.55)';const w=cx.measureText(lb).width+6;cx.fillRect(r.x+r.w/2-w/2,r.y+2,w,9);cx.fillStyle='#fff';cx.fillText(lb,r.x+r.w/2,r.y+9)}
  cx.fillStyle='#ffd166';if(!UP){cx.fillText('🛡 동물 보호소',205,193+1);cx.fillText('땅속 거리 →',350,126)}
  // 작은 지도 (거리에 있을 때): 섬 모양 거리 + 내 위치
  if(I.up||I.me.x>420){const B=I.bb,S=Math.min(170*d/(B.x1-B.x0),120*d/(B.y1-B.y0)),mx=cv.width-(B.x1-B.x0)*S-10*d,my=10*d;
    cx.setTransform(1,0,0,1,0,0);cx.fillStyle='rgba(10,12,20,.75)';cx.fillRect(mx-6*d,my-6*d,(B.x1-B.x0)*S+12*d,(B.y1-B.y0)*S+12*d);
    cx.fillStyle='#5a6070';for(const r of I.R)if(r.kind==='street'||r.kind==='plaza'||r.kind==='aqua'||r.kind==='space')cx.fillRect(mx+(r.x-B.x0)*S,my+(r.y-B.y0)*S,Math.max(1,r.w*S),Math.max(1,r.h*S));
    cx.fillStyle='#ffd27a';for(const e of I.up?I.exits:[])cx.fillRect(mx+(e.x-B.x0)*S-2*d,my+(e.y-B.y0)*S-2*d,4*d,4*d);
    const hb=I.bld.find(b=>b.mine);if(hb){cx.fillStyle='#7dff9a';cx.fillRect(mx+(hb.x-B.x0)*S-2*d,my+(hb.y-B.y0)*S-2*d,5*d,5*d)}
    cx.fillStyle='#ffe066';cx.beginPath();cx.arc(mx+(I.me.x-B.x0)*S,my+(I.me.y-B.y0)*S,3*d,0,6.283);cx.fill()}
}
function loop(){
  try{
    if(intro)drawIntro();
    else{
      if(W.player){const now=performance.now();W.rtSec=(W.rtSec||0)+Math.min(.1,(now-(W.rtLast||now))/1000);W.rtLast=now}else W.rtLast=0;
      if(!W.player&&W.speed&&$('startM').style.display==='none'&&!ed&&$('ending').style.display!=='flex'){const t0=performance.now();for(let i=0;i<W.speed;i++){step();if(performance.now()-t0>24)break}}
      if(W.inside){insideFrame();drawInside()}else{driveFrame();draw()}
    }
    edLoop();if(++frame%15===0)renderUI();
  }catch(err){console.error(err)}
  requestAnimationFrame(loop);
}
resize();genWorld();renderTerrain();fitCam();$('seedTxt').textContent='지형 번호 '+seed;$('startM').style.display='flex';markSpeed();buildTools();loop();
</script>
