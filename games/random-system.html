<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜덤 행성계 타임라인</title>
<style>
:root {
  --bg: #07080c; --panel: #13151b; --card: #1b1e26; --card2: #171a21; --line: #2a2e38;
  --ink: #e9e5db; --dim: #8d919b; --acc: #e3bb62;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Malgun Gothic", "맑은 고딕", sans-serif; overflow: hidden; user-select: none; }
#app { display: flex; height: 100%; }
#side { width: 318px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#sideHead { padding: 10px 12px 9px; border-bottom: 1px solid var(--line); }
#sysName { font-size: 15px; font-weight: bold; }
#sysSub { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
#count { font-size: 12.5px; margin-top: 6px; }
#count b { color: var(--acc); }
#list { flex: 1; overflow-y: auto; padding: 6px 6px 24px; min-height: 0; }
#list::-webkit-scrollbar { width: 8px; } #list::-webkit-scrollbar-thumb { background: #2c303a; border-radius: 4px; }
.card { display: flex; gap: 4px; align-items: center; background: var(--card); border: 1px solid transparent; border-radius: 6px; margin-bottom: 5px; padding: 2px 6px 2px 0; cursor: pointer; }
.card:hover { border-color: #3a3f4c; }
.card.sel { border-color: var(--acc); }
.card canvas { flex: none; display: block; }
.card .tx { flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.45; }
.card .nm { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .ty { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.dead { background: #16181e; }
.card.dead .nm { color: #9a9ca3; text-decoration: line-through; text-decoration-color: #6a6c73; }
.secT { font-size: 11.5px; color: var(--dim); margin: 12px 4px 5px; border-top: 1px solid var(--line); padding-top: 8px; }
.det { font-size: 11.5px; line-height: 1.55; background: var(--card2); border: 1px solid var(--acc); border-top: none; margin: -7px 0 6px; padding: 7px 9px 8px; border-radius: 0 0 6px 6px; }
.det .dtx b { color: #cfd2d8; font-weight: normal; }
.det .hist { color: var(--dim); margin-top: 4px; max-height: 120px; overflow-y: auto; }
.det button { margin-top: 6px; }
#main { flex: 1; position: relative; min-width: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#top { position: absolute; left: 16px; top: 10px; pointer-events: none; text-shadow: 0 1px 3px #000; }
#yearLbl { font-size: 11.5px; color: var(--dim); }
#year { font-size: 27px; font-weight: bold; letter-spacing: 0.3px; }
#phase { font-size: 13px; color: var(--acc); margin-top: 1px; }
#log { position: absolute; right: 10px; top: 10px; width: 292px; max-height: 44%; overflow-y: auto; font-size: 11.5px; }
#log::-webkit-scrollbar { width: 6px; } #log::-webkit-scrollbar-thumb { background: #2c303a; }
.ev { background: rgba(19, 21, 27, 0.86); border-left: 3px solid #888; padding: 3px 7px 4px; margin-bottom: 3px; cursor: pointer; line-height: 1.4; }
.ev:hover { background: rgba(32, 35, 44, 0.95); }
.ev .yr { color: var(--dim); font-size: 10.5px; }
.ev.newest { background: rgba(40, 36, 24, 0.92); }
#bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 12px 9px; background: linear-gradient(rgba(7, 8, 12, 0), rgba(7, 8, 12, 0.94) 32%); }
.tlwrap { position: relative; }
#tl { width: 100%; height: 30px; display: block; cursor: pointer; }
#tip { position: absolute; bottom: 34px; background: #20232c; border: 1px solid #3a3f4c; padding: 4px 8px; font-size: 11.5px; border-radius: 4px; white-space: nowrap; pointer-events: none; display: none; }
.row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; margin-top: 7px; }
.sep { width: 10px; }
.grow { flex: 1; }
button { background: #222630; color: var(--ink); border: 1px solid #353a47; border-radius: 4px; padding: 5px 10px; font-family: inherit; font-size: 12.5px; cursor: pointer; }
button:hover { background: #2c313d; }
button.on { background: #383222; border-color: #7b6a3a; color: #f1d892; }
button.pri { background: #3b3420; border-color: #8a7438; color: #f4dc98; }
#newPop { position: absolute; right: 12px; bottom: 78px; width: 250px; background: #1a1d25; border: 1px solid #3a3f4c; border-radius: 6px; padding: 11px 12px 12px; display: none; font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
#newPop .pt { font-weight: bold; margin-bottom: 8px; }
#newPop label { display: block; margin-bottom: 7px; color: var(--dim); }
#newPop select, #newPop input { display: block; width: 100%; margin-top: 3px; background: #101217; color: var(--ink); border: 1px solid #353a47; border-radius: 4px; padding: 4px 6px; font-family: inherit; font-size: 12.5px; }
#newPop .btns { display: flex; gap: 6px; margin-top: 10px; }
#help { position: absolute; left: 16px; bottom: 82px; font-size: 11px; color: #6b6f79; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="sideHead">
      <div id="sysName"></div>
      <div id="sysSub"></div>
      <div id="count"></div>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main">
    <canvas id="cv"></canvas>
    <div id="top"><div id="yearLbl">별 나이</div><div id="year"></div><div id="phase"></div></div>
    <div id="log"></div>
    <div id="help">행성을 누르면 자세히 보기 · 휠: 확대 · 끌기: 화면 이동 · 스페이스: 재생/멈춤</div>
    <div id="bar">
      <div class="tlwrap"><canvas id="tl"></canvas><div id="tip"></div></div>
      <div class="row">
        <button id="bStart">처음</button>
        <button id="bPlay">멈춤</button>
        <button id="bSpeed">속도 x1</button>
        <span class="sep"></span>
        <button id="tOrbit" class="on">궤도선</button>
        <button id="tTrail">궤도 흔적</button>
        <button id="tName" class="on">이름</button>
        <button id="tTemp">온도</button>
        <button id="tHZ">생명 가능 지대</button>
        <button id="bFit">화면 맞추기</button>
        <span class="grow"></span>
        <button id="bNew" class="pri">새 행성계</button>
      </div>
    </div>
    <div id="newPop">
      <div class="pt">새 행성계 만들기</div>
      <label>별 종류
        <select id="optStar">
          <option value="rand">무작위</option>
          <option value="M">적색왜성 (M형)</option>
          <option value="K">주황색 별 (K형)</option>
          <option value="G">노란 별 (G형, 태양 같은 별)</option>
          <option value="F">흰 별 (F형)</option>
          <option value="A">청백색 별 (A형)</option>
        </select>
      </label>
      <label>처음 행성 수
        <select id="optN"></select>
      </label>
      <label>행성계 번호 또는 별 이름
        <input id="optSeed" placeholder="비우면 무작위 (예: 푸트롬스키의 별)">
      </label>
      <div class="btns"><button id="bMake" class="pri">만들기</button><button id="bCancel">닫기</button></div>
    </div>
  </main>
</div>
<script>
'use strict';
// =====================================================================
// 랜덤 행성계 타임라인 — 행성 1~12개가 무작위로 생기고, 서로 흔들고 부딪히며 줄어든다.
// 시뮬레이션은 새 행성계를 만들 때 처음부터 끝까지 한 번에 계산해 두고(frames), 재생은 그걸 보여 준다.
// =====================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const expLerp = (a, b, t) => a * Math.pow(b / a, clamp(t, 0, 1));
function mulberry32(s) {
  return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let rnd = Math.random; // 시뮬레이션용 (행성계 번호로 정해짐)
const U = (a, b) => a + (b - a) * rnd();
const LU = (a, b) => Math.exp(U(Math.log(a), Math.log(b)));
const RI = (a, b) => Math.floor(U(a, b + 1));
function gauss() { let u = 0; while (u === 0) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rnd()); }
// 그림용 고정 난수 (같은 행성은 항상 같은 무늬)
function hash(a, b, c) {
  let h = (a | 0) ^ Math.imul((b | 0) + 0x632be5ab, 0x85ebca6b) ^ Math.imul((c | 0) + 0x9e3779b9, 0xc2b2ae35);
  h ^= h >>> 16; h = Math.imul(h, 0x7feb352d); h ^= h >>> 15; h = Math.imul(h, 0x846ca68b); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ===== 별 =====
const STAR_TYPES = [
  { id: 'M', name: '적색왜성', cls: 'M형', m: [0.15, 0.44], w: 0.26 },
  { id: 'K', name: '주황색 별', cls: 'K형', m: [0.5, 0.8], w: 0.22 },
  { id: 'G', name: '노란 별', cls: 'G형', m: [0.82, 1.12], w: 0.25 },
  { id: 'F', name: '흰 별', cls: 'F형', m: [1.12, 1.45], w: 0.15 },
  { id: 'A', name: '청백색 별', cls: 'A형', m: [1.5, 2.2], w: 0.12 },
];
const CATS = [['HD ', 10000, 240000], ['Gliese ', 100, 999], ['Kepler-', 100, 1999], ['TOI-', 100, 5999], ['K2-', 10, 399], ['HIP ', 1000, 99999], ['WASP-', 10, 199], ['LHS ', 1000, 9999]];
const MSUN_E = 333000;     // 태양 질량 = 지구 질량의 33만 배
const AU_RS = 0.00465;     // 태양 반지름(AU)
const LETTERS = 'bcdefghijklm';
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI'];

let SYS = null;

// 별의 일생: 나이(년) → 질량·반지름·밝기·온도·시기
function starAt(y) {
  const s = SYS.star, t = s.tMS, x = y / t;
  let M = s.M, Rr, L, ph;
  const Rend = s.R0 * 1.4, Lend = s.L0 * 1.4;
  if (x <= 1) {
    Rr = s.R0 * (0.9 + 0.5 * x); L = s.L0 * (0.72 + 0.68 * Math.pow(x, 1.1)); ph = 'ms';
    if (y < 1e6) { const u = 1 - y / 1e6; Rr *= 1 + 1.5 * u; L *= 1 + 1.2 * u; }
  } else if (s.giant) {
    const x1 = 1.07, x2 = 1.12, x3 = 1.13, x4 = 1.132;
    if (x < x1) { const u = (x - 1) / (x1 - 1); Rr = expLerp(Rend, Rend * 2.5, u); L = expLerp(Lend, Lend * 1.9, u); ph = 'sub'; }
    else if (x < x2) { const k = Math.pow((x - x1) / (x2 - x1), 2.2); Rr = expLerp(Rend * 2.5, s.Rtip, k); L = expLerp(Lend * 1.9, s.Ltip, k); M = s.M * (1 - s.rgLoss * k); ph = 'rgb'; }
    else if (x < x3) { const k = sm((x - x2) / (x3 - x2) / 0.1); Rr = expLerp(s.Rtip, s.Rhb, k); L = expLerp(s.Ltip, s.Lhb, k); M = s.M * (1 - s.rgLoss); ph = 'hb'; }
    else if (x < x4) { const k = Math.pow((x - x3) / (x4 - x3), 1.6); Rr = expLerp(s.Rhb, s.Ragb, k); L = expLerp(s.Lhb, s.Lagb, k); M = lerp(s.M * (1 - s.rgLoss), s.Mwd, k); ph = 'agb'; }
    else { const d = y - t * x4, k = Math.min(1, d / 3e4); Rr = expLerp(s.Ragb, 0.013, k); L = expLerp(s.Lagb, 100 * Math.pow(1 + d / 1e5, -1.25), k); M = s.Mwd; ph = d < 6e4 ? 'pn' : (d > 1e11 ? 'cold' : 'wd'); }
  } else {
    const x1 = 1.1;
    if (x < x1) { const u = (x - 1) / (x1 - 1); Rr = expLerp(Rend, Rend * 0.75, u); L = expLerp(Lend, Lend * 20, u); ph = 'blue'; }
    else { const d = y - t * x1, k = Math.min(1, d / 1e7); Rr = expLerp(Rend * 0.75, 0.018, k); L = expLerp(Lend * 20, 0.03 * Math.pow(1 + d / 1e7, -1.2), k); ph = d > 1e11 ? 'cold' : 'wd'; }
  }
  const T = 5772 * Math.pow(L / (Rr * Rr), 0.25);
  return { M, R: Rr * AU_RS, Rs: Rr, L, T, ph };
}
const GIANT_PH = { sub: 1, rgb: 1, hb: 1, agb: 1 };

// 시간 막대: [나이(년), x1 속도로 걸리는 초]
function makeNodes(s) {
  const t = s.tMS, base = [[0, 0], [1e6, 8], [1e7, 22], [1e8, 54], [1e9, 76]];
  const n = base.filter(q => q[0] < t * 0.6);
  let p = n[n.length - 1][1];
  if (t * 0.5 > 2e9) { p += 26; n.push([t * 0.5, p]); }
  p += 24; n.push([t, p]);
  if (s.giant) {
    const x4 = t * 1.132;
    n.push([t * 1.07, p + 10], [t * 1.12, p + 24], [t * 1.13, p + 31], [x4, p + 43], [x4 + 1e6, p + 52], [x4 + 1e9, p + 64], [x4 + 1e12, p + 74]);
  } else {
    const x1 = t * 1.1;
    n.push([x1, p + 16], [x1 + 1e7, p + 24], [x1 + 1e10, p + 40], [x1 + 1e13, p + 52]);
  }
  return n;
}
function yearAt(P) {
  const N = SYS.nodes;
  if (P <= 0) return 0;
  for (let i = 1; i < N.length; i++) {
    const y0 = N[i - 1][0], p0 = N[i - 1][1], y1 = N[i][0], p1 = N[i][1];
    if (P <= p1) { const u = (P - p0) / (p1 - p0); return y0 <= 0 ? y1 * u : y0 * Math.pow(y1 / y0, u); }
  }
  return N[N.length - 1][0];
}
function pAt(y) {
  const N = SYS.nodes;
  if (y <= 0) return 0;
  for (let i = 1; i < N.length; i++) {
    const y0 = N[i - 1][0], p0 = N[i - 1][1], y1 = N[i][0], p1 = N[i][1];
    if (y <= y1) { const u = y0 <= 0 ? y / y1 : Math.log(y / y0) / Math.log(y1 / y0); return p0 + (p1 - p0) * u; }
  }
  return N[N.length - 1][1];
}

// ===== 행성 =====
function radiusOf(comp, m) { // 지구 반지름 배
  if (comp === 'gas' || m > 130) return m < 130 ? 1.21 * Math.pow(m / 2, 0.589) : 11.2 * Math.pow(m / 318, -0.04);
  if (comp === 'ice') return Math.min(1.21 * Math.pow(m / 2, 0.589), 9);
  if (comp === 'icy') return 1.12 * Math.pow(m, 0.3);
  return Math.pow(m, 0.27);
}
function typeName(p, m, T) {
  if (p.comp === 'gas') return T > 1000 ? '뜨거운 가스 거인' : '가스 거인';
  if (p.comp === 'ice') return '얼음 거인';
  if (p.comp === 'icy') return m < 0.1 ? '작은 얼음 행성' : '얼음 행성';
  return m < 0.15 ? '작은 암석 행성' : m < 2 ? '암석 행성' : '슈퍼지구';
}
function growth(p, y) {
  if (y <= 0) return 0.05;
  const ly = Math.log(Math.max(y, 1e4)), l4 = Math.log(1e4);
  if (p.comp === 'gas' || p.comp === 'ice') {
    if (y < p.tCore) return 0.05 + 0.1 * sm((ly - l4) / (Math.log(p.tCore) - l4));
    return 0.15 + 0.85 * sm((ly - Math.log(p.tCore)) / (Math.log(p.tGas) - Math.log(p.tCore)));
  }
  return 0.05 + 0.95 * sm((ly - l4) / (Math.log(p.tForm) - l4));
}
function moonCap(p) { return p.comp === 'gas' ? 8 : p.comp === 'ice' ? 6 : p.m > 0.3 ? 2 : 1; }
function logAt(log, f) { let v = log[0][1]; for (const q of log) { if (q[0] <= f) v = q[1]; else break; } return v; }

// 화면용 공전 속도 (진짜보다 훨씬 빠르게, 바깥 행성은 느리게)
let W0 = TAU / 2.7;
function omega(a) { return clamp(W0 * Math.pow(Math.max(a, 1e-5) / SYS.aRef, -0.95), TAU / 200, TAU / 1.2); }

// 라플라스 계수 b^(j)_{3/2}(α)
const LAP = new Map();
function lap(j, al) {
  const q = Math.round(al * 2000), key = j * 100000 + q;
  let v = LAP.get(key); if (v !== undefined) return v;
  const a = q / 2000, N = 160; let s = 0;
  for (let i = 0; i < N; i++) { const ps = (i + 0.5) / N * TAU; s += Math.cos(j * ps) / Math.pow(1 - 2 * a * Math.cos(ps) + a * a, 1.5); }
  v = s / N * 2; LAP.set(key, v); return v;
}
// 궤도끼리 당기는 힘(세속 섭동)을 화면에서 보이는 빠르기로: 목성만 한 행성 옆 작은 행성은 약 10초에 한 바퀴 흔들림
let SEC_F = 1;
function calibSec() { SEC_F = (TAU / 10) / (W0 / 4 * 9.55e-4 * 0.49 * lap(1, 0.7)); }
function buildA(L, fM, Mst) {
  const n = L.length, A = new Float64Array(n * n), Ms = Mst * MSUN_E;
  for (let i = 0; i < n; i++) {
    const ai = L[i].s.a * fM, ni = omega(ai) * SEC_F / 4;
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const aj = L[j].s.a * fM;
      let al = ai < aj ? ai / aj : aj / ai; al = Math.min(al, 0.9);
      const ab = aj > ai ? al : 1, c = ni * (L[j].s.md / Ms) * al * ab;
      A[i * n + i] += c * lap(1, al); A[i * n + j] = -c * lap(2, al);
    }
    const d = A[i * n + i];
    if (d > 6) { const k = 6 / d; for (let j = 0; j < n; j++) A[i * n + j] *= k; }
  }
  return A;
}
function kepXY(a, e, w, M) {
  let E = e < 0.8 ? M : Math.PI;
  for (let i = 0; i < 10; i++) { const d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E)); E -= d; if (Math.abs(d) < 1e-7) break; }
  const xo = a * (Math.cos(E) - e), yo = a * Math.sqrt(Math.max(0, 1 - e * e)) * Math.sin(E), c = Math.cos(w), s = Math.sin(w);
  return [xo * c - yo * s, xo * s + yo * c];
}
function meanFromAngle(th, e, w) {
  const f = th - w;
  const E = 2 * Math.atan(Math.sqrt((1 - e) / (1 + e)) * Math.tan(f / 2));
  let M = E - e * Math.sin(E); M %= TAU; if (M < 0) M += TAU; return M;
}
function segMin(ax0, ay0, ax1, ay1, bx0, by0, bx1, by1) {
  const rx0 = ax0 - bx0, ry0 = ay0 - by0, dx = (ax1 - bx1) - rx0, dy = (ay1 - by1) - ry0, dd = dx * dx + dy * dy;
  const t = dd > 1e-14 ? clamp(-(rx0 * dx + ry0 * dy) / dd, 0, 1) : 0;
  return Math.hypot(rx0 + dx * t, ry0 + dy * t);
}

// 온도 (켈빈)
function baseTemp(p, aa, e, L) {
  return 278.6 * Math.pow(L, 0.25) * Math.pow(1 - p.alb, 0.25) / Math.sqrt(Math.max(aa, 1e-4)) * Math.pow(Math.max(1e-3, 1 - e * e), -0.125) * p.gh;
}
// 온도와 '왜 뜨거운지': 별빛 + 온실 효과에 가스 거인 속의 열 / 갓 생긴 행성의 열 / 충돌 열이 더해짐
function tempInfo(p, aa, e, L, y, P) {
  const Tb = baseTemp(p, aa, e, L), parts = [];

$('bNew').onclick = () => { const p = $('newPop'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; };
$('bCancel').onclick = () => { $('newPop').style.display = 'none'; };
// 이름(한국어 등)을 넣으면 그 글자로 번호를 정함 → 같은 이름은 늘 같은 행성계
function textSeed(t) { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return 1 + (h >>> 0) % 999999999; }
$('bMake').onclick = () => {
  const sv = $('optSeed').value.trim(), isNum = /^\d+$/.test(sv);
  const seed = isNum ? (+sv % 1000000000) : sv ? textSeed(sv) : (1 + Math.floor(Math.random() * 999999));
  newSystem(seed, { star: $('optStar').value, n: $('optN').value });
  if (sv && !isNum) { SYS.star.custom = sv.slice(0, 24); saveNames(); headText(); LKEY = ''; LOGN = -1; }
  $('newPop').style.display = 'none'; $('optSeed').value = '';
};
{ const o = $('optN'); o.innerHTML = '<option value="rand">무작위 (1~12개)</option>' + Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${i + 1}개</option>`).join(''); }

// 화면 누르기 / 끌기 / 확대
let dragging = null;
cv.addEventListener('mousedown', ev => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = null, bd = 16;
  for (const [id, sx, sy, sr] of SYS._scr || []) { const d = Math.hypot(sx - x, sy - y) - sr; if (d < bd) { bd = d; best = id; } }
  if (best === null && Math.hypot(x - CX(), y - CY()) < (SYS._spx || 6) + 8) best = 'star';
  if (best !== null) { SEL = SEL === best ? -1 : best; LKEY = ''; scrollToSel(); return; }
  dragging = { x: ev.clientX, y: ev.clientY, px: panX, py: panY, moved: false };
});
window.addEventListener('mousemove', ev => { if (!dragging) return; panX = dragging.px + ev.clientX - dragging.x; panY = dragging.py + ev.clientY - dragging.y; if (Math.abs(ev.clientX - dragging.x) + Math.abs(ev.clientY - dragging.y) > 4) dragging.moved = true; });
cv.addEventListener('click', () => { if (dragging === null) return; });
cv.addEventListener('wheel', ev => { ev.preventDefault(); Z = clamp(Z * Math.exp(-ev.deltaY * 0.0012), 0.15, 40); }, { passive: false });
function scrollToSel() { setTimeout(() => { const el = listEl.querySelector('.card.sel'); if (el) el.scrollIntoView({ block: 'nearest' }); }, 150); }
window.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.code === 'Space') { ev.preventDefault(); $('bPlay').onclick(); }
  else if (ev.code === 'ArrowRight') setP(PP + 5);
  else if (ev.code === 'ArrowLeft') setP(PP - 5);
});

// ===== 저장 =====
const KEY = 'rndOrbitTL1';
function loadSave() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function writeSave(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { } }
function saveSet() { const o = loadSave(); o.tg = TG; o.spd = spd; writeSave(o); }
function saveNames() {
  const o = loadSave(); o.names = o.names || {};
  const nm = {}; for (const p of SYS.pl) if (p.custom) nm[p.id] = p.custom; if (SYS.star.custom) nm.star = SYS.star.custom;
  o.names[SYS.seed] = nm; writeSave(o);
}
function newSystem(seed, opt) {
  const t0 = performance.now();
  makeSystem(seed, opt);
  const o = loadSave(), nm = (o.names || {})[seed] || {};
  for (const p of SYS.pl) p.custom = nm[p.id] || null;
  SYS.star.custom = nm.star || null;
  o.last = { seed, star: opt.star, n: opt.n }; writeSave(o);
  SYS.buildMs = performance.now() - t0;
  PP = 0; playing = true; SEL = -1; FX = []; LOGN = -1; LKEY = ''; Z = 1; panX = 0; panY = 0; snapView = true;
  updPlay(); headText();
}

// ===== 메인 루프 =====
let lastT = performance.now();
function loop(now) {
  try {
    const dtr = Math.min(0.1, (now - lastT) / 1000); lastT = now;
    if (playing) {
      const np = Math.min(SYS.TOTAL, PP + dtr * SPEEDS[spd]);
      fireBetween(PP, np); PP = np;
      if (PP >= SYS.TOTAL) { playing = false; updPlay(); }
    }
    draw(now); drawTL(); updUI(now);
  } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

// 시험용: 여러 행성계를 만들어 보고 결과 세기
window.__stats = function (n = 40, opt = { star: 'rand', n: 'rand' }) {
  const keep = SYS, out = { sys: 0, start: 0, end: 0, ms: 0 };
  const cnt = {};
  for (let s = 1; s <= n; s++) {
    const t0 = performance.now(); const S = makeSystem(s * 7919, opt); out.ms += performance.now() - t0;
    out.sys++; out.start += S.pl.length; out.end += S.pl.filter(p => S.F - 3 < p.deathF).length;
    for (const e of S.events) cnt[e.t] = (cnt[e.t] || 0) + 1;
  }
  SYS = keep; out.ms = Math.round(out.ms / n); out.cnt = cnt; return out;
};

// 시험용: 왼쪽 목록 + 궤도 화면을 한 장으로 확인 서버에 보냄
window.__cap = async function () {
  const now = performance.now(); draw(now); drawTL(); lastUI = 0; LKEY = ''; updUI(now + 1000); lastCard = 0; updUI(now + 2000);
  const sw = 318, out = document.createElement('canvas'); out.width = sw + W; out.height = H;
  const o = out.getContext('2d'); o.fillStyle = '#13151b'; o.fillRect(0, 0, sw, H);
  o.fillStyle = '#e9e5db'; o.font = 'bold 15px Malgun Gothic'; o.fillText($('sysName').textContent, 12, 22);
  o.font = '12px Malgun Gothic'; o.fillText($('count').textContent, 12, 44);
  let yy = 60;
  for (const cd of CARDS) {
    o.fillStyle = (cd.p ? SEL === cd.p.id : SEL === 'star') ? '#3a3424' : '#1b1e26'; o.fillRect(4, yy - 2, 308, 80);
    o.drawImage(cd.c, 4, yy, CW, CH); o.fillStyle = '#e9e5db'; o.font = '11px Malgun Gothic';
    cd.tx.innerText.split('\n').forEach((l, i) => o.fillText(l.slice(0, 26), 132, yy + 16 + i * 15));
    yy += 84; if (yy > H - 80) break;
  }
  o.drawImage(cv, 0, 0, cv.width, cv.height, sw, 0, W, H); o.drawImage(tl, 0, 0, tl.width, tl.height, sw + 12, H - 62, TW, 30);
  o.fillStyle = '#e9e5db'; o.font = 'bold 26px Malgun Gothic'; o.fillText($('year').textContent, sw + 16, 52);
  o.font = '13px Malgun Gothic'; o.fillStyle = '#e3bb62'; o.fillText($('phase').textContent, sw + 16, 72);
  const r = await fetch('/shot', { method: 'POST', body: out.toDataURL('image/png') }); return r.status;
};

(function init() {
  const o = loadSave();
  if (o.tg) for (const k in TG) if (k in o.tg) TG[k] = !!o.tg[k];
  if (typeof o.spd === 'number') spd = clamp(o.spd, 0, SPEEDS.length - 1);
  $('bSpeed').textContent = '속도 x' + SPEEDS[spd];
  for (const [id, k] of [['tOrbit', 'orbit'], ['tTrail', 'trail'], ['tName', 'name'], ['tTemp', 'temp'], ['tHZ', 'hz']]) $(id).classList.toggle('on', TG[k]);
  resize();
  const last = o.last;
  if (last && last.seed) newSystem(last.seed, { star: last.star || 'rand', n: last.n || 'rand' });
  else newSystem(1 + Math.floor(Math.random() * 999999), { star: 'rand', n: 'rand' });
  requestAnimationFrame(loop);
})();
</script>
<script src="../track.js" defer></script>
