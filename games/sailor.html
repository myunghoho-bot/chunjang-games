}
/* 망원경 */
function drawScope(g, cpos){
  const s=W.scope;
  let cx=Wd*0.72, cy=Ht*0.40;
  if(s.kind==='bio' && cpos){ cx=cpos.x; cy=cpos.y; }
  cx=clamp(cx, Wd*0.25, Wd*0.75); cy=clamp(cy, Ht*0.2, Ht*0.7);
  const r=Math.min(Wd,Ht)*0.26*Math.min(1,s.t*4+0.3);
  g.save();
  g.fillStyle='rgba(3,7,12,.88)';
  g.beginPath(); g.rect(0,0,Wd,Ht);
  g.moveTo(cx+r,cy);                      /* 이어지는 선이 생기지 않게 붓을 옮긴다 */
  g.arc(cx,cy,r,0,Math.PI*2,true); g.fill('evenodd');
  g.beginPath(); g.arc(cx,cy,r,0,7); g.clip();
  /* 확대해서 보여주기 */
  g.translate(cx,cy);
  const sh=Math.sin(W.t*9)*1.6*(S.fat/100+0.2);
  g.translate(sh, Math.cos(W.t*7)*1.4);
  if(s.kind==='bio'){
    const sc=r/110;
    g.save(); g.scale(sc,sc); drawCreature(g, s.id, 1.5, W.t); g.restore();
  }else{
    g.save(); g.translate(0, r*0.25);
    drawShipSide(g, s.id, r*1.5, {dir:-1, sail:3, crew:2, flag:'#333'});
    g.restore();
  }
  g.restore();
  /* 망원경 테두리 */
  g.strokeStyle='#c9a253'; g.lineWidth=5;
  g.beginPath(); g.arc(cx,cy,r,0,7); g.stroke();
  g.strokeStyle='rgba(220,240,255,.35)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(cx-r*0.5,cy); g.lineTo(cx+r*0.5,cy);
  g.moveTo(cx,cy-r*0.5); g.lineTo(cx,cy+r*0.5); g.stroke();
  W._scopePos={cx,cy,r};
}
/* 망원경으로 알아낸 이름표 */
function drawScopeName(g){
  const s=W.scope, p=W._scopePos; if(!s||!s.ok||!p) return;
  const obj = s.kind==='bio'? BI(s.id) : SH(s.id);
  const cx=p.cx*PIX;
  let cy=(p.cy+p.r)*PIX+10;
  if(cy+40 > Ht-136) cy = Math.max(56, (p.cy-p.r)*PIX-50);   /* 대사창에 가리면 위로 */
  woodPanel(g, cx-140, cy, 280, 40);
  g.fillStyle='#4a3722'; g.font='bold 18px "Malgun Gothic"'; g.textAlign='center';
  g.fillText(obj.n, cx, cy+27); g.textAlign='left';
}

/* 전투 화면 */
function drawBattleScene(g){
  const b=W.battle, y0=Ht*0.50;
  drawSky(g,y0,W.storm>0);
  drawSeaBack(g,y0,W.rough);
  const gap = 0.10 + b.dist/100*0.30;
  const myX = Wd*(0.5-gap), foX = Wd*(0.5+gap);
  const L1 = Wd*0.26*(spec().len/34);
  const L2 = Wd*0.26*(SH(b.type).len/34);
  g.save(); g.translate(myX,y0+8+Math.sin(W.t*1.3)*3); g.rotate(Math.sin(W.t*0.9)*0.02);
  drawShipSide(g,S.ship,L1,{dir:1,sail:2,crew:5,tired:S.fat,flag:flagColor(),dmg:S.hull/100,fire:1});
  g.restore();
  g.save(); g.translate(foX,y0+8+Math.sin(W.t*1.5+1)*3); g.rotate(Math.sin(W.t*1.1)*0.02);
  drawShipSide(g,b.type,L2,{dir:-1,sail:2,crew:4,flag:'#1a1a1a',dmg:b.hull/b.hullMax,fire:1});
  g.restore();
  /* 포탄 */
  const U=Ht/180;
  for(const s of b.shots){
    const x=Wd*(s.x0+(s.x1-s.x0)*s.t);
    const y=y0-U*6-Math.sin(s.t*Math.PI)*Ht*0.10;
    g.fillStyle='#20242a'; g.beginPath(); g.arc(x,y,U,0,7); g.fill();
    if(s.t>0.95){
      g.fillStyle= s.hit?'rgba(255,180,80,.85)':'rgba(230,240,255,.8)';
      g.beginPath(); g.arc(x,s.hit?y:y0+U, U*(s.hit?4:3),0,7); g.fill();
    }
  }
  for(const s of b.smoke){
    g.fillStyle='rgba(220,220,220,'+(0.6*(1-s.t))+')';
    g.beginPath(); g.arc(Wd*s.x + s.t*U*5*(s.x<0.5?1:-1), y0-U*5, U*(2.5+s.t*6),0,7); g.fill();
  }
  if(b.boardT>0){ g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(0,0,Wd,Ht); }
  if(W.scope) drawScope(g,null);
}
/* 전투 정보(또렷한 글씨) */
function drawBattlePanel(g){
  const b=W.battle; if(!b) return;
  const w=460,h=76,bx=Wd/2-w/2,by=60;
  woodPanel(g,bx,by,w,h);
  g.fillStyle='#4a3722'; g.font='bold 16px "Malgun Gothic"'; g.textAlign='center';
  g.fillText('적: '+SH(b.type).n+'  ('+SH(b.type).c+')', Wd/2, by+26);
  g.fillStyle='#c3ac7e'; g.fillRect(Wd/2-130,by+34,260,13);
  g.fillStyle='#a8452f'; g.fillRect(Wd/2-130,by+34,260*clamp(b.hull/b.hullMax,0,1),13);
  g.strokeStyle='#6b4a28'; g.lineWidth=1.5; g.strokeRect(Wd/2-130,by+34,260,13);
  g.fillStyle='#4a3722'; g.font='13px "Malgun Gothic"';
  g.fillText('거리 '+R(b.dist)+'   ·   장전 '+(b.myRe>0?b.myRe.toFixed(1)+'초':'준비!')+'   ·   포탄 '+S.ball, Wd/2, by+64);
  if(b.boardT>0){
    g.fillStyle='#ffd98a'; g.font='bold 34px "Malgun Gothic"';
    g.fillText('백병전!', Wd/2, Ht/2);
  }
  g.textAlign='left';
}
/* 화면 위에 또렷하게 얹는 것들 (대항해시대식 나무 액자 UI) */
function drawOverlay(g){
  drawTopBar(g);
  drawCompassPanel(g);
  drawStatusPanel(g);
  drawMsgWindow(g);
  if(S.scene==='port') drawPortPlate(g);
  else if(S.scene==='battle') drawBattlePanel(g);
  if(S.scene==='sail' && W.foe && W.foe.hostile && W._foeLabel){
    g.fillStyle='#b41e14'; g.font='bold 16px "Malgun Gothic"'; g.textAlign='center';
    g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=3;
    const tx='해적선 접근 '+R(W.foe.close*100)+'%';
    g.strokeText(tx, W._foeLabel.x*PIX, W._foeLabel.y*PIX);
    g.fillText(tx, W._foeLabel.x*PIX, W._foeLabel.y*PIX);
    g.textAlign='left';
  }
  if(W.scope) drawScopeName(g);
}

  return '<span class="bar"><i style="width:'+p+'%;background:'+col+'"></i></span>';
}

function openTavern(){

       (m.scur?' · 괴혈병 -'+m.scur:'')+' · '+m.hrs+'시간</div>'+
       '<button onclick="A.eat('+i+')" '+(S.gold<m.p?'disabled':'')+'>'+m.p+'골드 먹기</button></div>';

  passHours(m.hrs);

  autosave(); openTavern();
};

  {k:'water', n:'물',   p:2,  d:'없으면 아주 위험하다.'},

function openMarket(){
  let h=head('🧺 시장', P(S.at).n+'의 시장. 돈 '+R(S.gold)+'골드');
  h+='<div class="row">';
  SUPPLY.forEach((s,i)=>{

  });

  h+='<div class="card"><div class="t">🧑‍✈️ 선원 뽑기</div><div class="d">사람이 많으면 백병전에 세다. 대신 밥을 더 먹는다.<br>지금 '+S.crew+'명 (최대 '+spec().crew+')</div>'+
     '<button onclick="A.hire(1)" '+(S.gold<14||S.crew>=spec().crew?'disabled':'')+'>14골드 한 명</button> '+
     '<button onclick="A.hire(5)" '+(S.gold<70||S.crew>=spec().crew?'disabled':'')+'>70골드 다섯 명</button></div>';
  h+='</div>';
  openModal(h);
}
A.buySup=(i,n)=>{
  const s=SUPPLY[i], cost=s.p*n;
  if(S.gold<cost){ toast('돈이 모자란다','bad'); return; }
  S.gold-=cost; S[s.k]+=n; toast(s.n+' '+n+'개를 샀다','good'); autosave(); openMarket();
};
A.repair=()=>{
  const need=R(100-S.hull), cost=need*3;
  if(need<=0||S.gold<cost) return;
  S.gold-=cost; S.hull=100; toast('배를 말끔히 고쳤다','good'); autosave(); openMarket();
};
A.hire=n=>{
  const cost=n*14;
  if(S.gold<cost||S.crew>=spec().crew) return;
  S.gold-=cost; S.crew=Math.min(spec().crew,S.crew+n);
  toast('선원 '+n+'명을 뽑았다','good'); autosave(); openMarket();
};

/* 무역 */
function openTrade(){
  const sp=spec();
  let h=head('⚖️ 무역', P(S.at).n+'의 값. 싸게 사서 먼 곳에 비싸게 팔면 된다. 짐칸 '+cargoCount()+'/'+sp.cargo+' · 돈 '+R(S.gold)+'골드');
  h+='<table><tr><th>물건</th><th>이 항구 값</th><th>내가 가진 것</th><th>사기</th><th>팔기</th></tr>';
  for(const g of GOODS){
    const pr=goodPrice(g.n,S.at), have=S.cargo[g.n]||0;
    const cheap = pr < g.base*0.8, dear = pr > g.base*1.4;
    h+='<tr><td>'+g.n+(cheap?' <span style="color:#8fd0a0">싸다</span>':(dear?' <span style="color:#e8a08a">비싸다</span>':''))+
       '</td><td class="price">'+pr+'</td><td>'+have+'</td>'+
       '<td><button onclick="A.buyG(\''+g.n+'\',1)">1</button> <button onclick="A.buyG(\''+g.n+'\',10)">10</button></td>'+
       '<td><button onclick="A.sellG(\''+g.n+'\',1)" '+(have?'':'disabled')+'>1</button> '+
       '<button onclick="A.sellG(\''+g.n+'\',999)" '+(have?'':'disabled')+'>전부</button></td></tr>';
  }
  h+='</table>';
  h+='<h3>이 항구에서 나는 것</h3><div class="sub">'+P(S.at).sell.join(', ')+' — 여기서 사면 싸다.</div>';
  openModal(h);
}
A.buyG=(n,q)=>{
  const pr=goodPrice(n,S.at), sp=spec();
  q=Math.min(q, sp.cargo-cargoCount(), Math.floor(S.gold/pr));
  if(q<=0){ toast('짐칸이나 돈이 모자란다','bad'); return; }
  S.gold-=pr*q; S.cargo[n]=(S.cargo[n]||0)+q;
  toast(n+' '+q+'개를 '+(pr*q)+'골드에 샀다','good'); autosave(); openTrade();
};
A.sellG=(n,q)=>{
  let pr=goodPrice(n,S.at); const have=S.cargo[n]||0;
  if(perk('joao')) pr=R(pr*1.15);
  q=Math.min(q,have); if(q<=0) return;
  S.gold+=pr*q; S.cargo[n]=have-q; if(!S.cargo[n]) delete S.cargo[n];
  toast(n+' '+q+'개를 '+(pr*q)+'골드에 팔았다','good'); autosave(); openTrade();
};

/* 조선소 */
function openYard(){
  const cur=spec(), reg=P(S.at).reg;
  let h=head('🔨 조선소', '이 항구에서 만드는 배들. 지금 배: '+cur.n+' (팔면 '+R(cur.price*0.5)+'골드) · 돈 '+R(S.gold)+'골드');
  h+='<div class="row">';
  let any=false;
  for(const s of SHIPS){
    if(!s.buy.includes(reg) || s.id===S.ship) continue;
    any=true;
    const cost=Math.max(0, R(s.price - cur.price*0.5));
    h+='<div class="card"><canvas class="yc" data-ship="'+s.id+'" width="300" height="120" style="width:100%;height:96px;background:#0e1b27;border-radius:8px"></canvas>'+
       '<div class="t">'+s.n+' <span style="color:#9fb8cc;font-size:12px">'+s.c+'</span></div>'+
       '<div class="d">'+s.info+'<br>속도 '+s.kn+'노트 · 튼튼함 '+s.hull+' · 대포 '+s.guns+' · 선원 '+s.crew+' · 짐칸 '+s.cargo+'</div>'+
       '<button onclick="A.buyShip(\''+s.id+'\')" '+(S.gold<cost?'disabled':'')+'>'+cost+'골드에 사기</button></div>';
  }
  if(!any) h+='<div class="card"><div class="d">여기서는 살 만한 배가 없다. 다른 나라 항구로 가 보자.</div></div>';
  h+='</div>';
  openModal(h);
  document.querySelectorAll('.yc').forEach(cn=>{
    pixelInto(cn, g=>{
      g.save(); g.translate(150,86);
      drawShipSide(g, cn.dataset.ship, 250, {dir:1,sail:3,flag:CAP().flag});
      g.restore();
    });
  });
}
A.buyShip=id=>{
  const s=SH(id), cost=Math.max(0,R(s.price-spec().price*0.5));
  if(S.gold<cost) return;
  const nm = prompt('새 배의 이름을 지어 줘!', S.shipName) || s.n+'호';
  S.gold-=cost; S.ship=id; S.shipName=nm; S.hull=100;
  S.crew=Math.min(s.crew, Math.max(S.crew, R(s.crew*0.6)));
  const over=cargoCount()-s.cargo;
  if(over>0){ S.cargo={}; toast('짐칸이 작아 화물을 내려놓았다','bad'); }
  dexAdd('ship', id);
  toast(s.n+' 「'+nm+'」 를 샀다!','good'); autosave(); openYard();
};

/* 도감 */
let DEXTAB='bio';
function openDex(tab){
  if(typeof tab==='string') DEXTAB=tab;
  const nb=Object.keys(S.dex.bio).length, ns=Object.keys(S.dex.ship).length;
  let h=head('📖 항해 도감', '망원경으로 본 것이 여기에 쌓인다. 생물 '+nb+'/'+BIO.length+' · 배 '+ns+'/'+SHIPS.length);
  h+='<div class="tabs"><button onclick="A.dex(\'bio\')" class="'+(DEXTAB==='bio'?'g':'')+'">🐋 바다 생물</button>'+
     '<button onclick="A.dex(\'ship\')" class="'+(DEXTAB==='ship'?'g':'')+'">⛵ 배</button></div>';
  h+='<div class="gridx">';
  const list = DEXTAB==='bio'? BIO : SHIPS;
  for(const o of list){
    const got = S.dex[DEXTAB][o.id];
    h+='<div class="dexc '+(got?'':'q')+'" onclick="A.dexInfo(\''+o.id+'\')">'+
       '<canvas class="dc" data-id="'+o.id+'" data-got="'+(got?1:0)+'" width="300" height="150"></canvas>'+
       '<div class="n">'+(got? o.n : '???')+'</div>'+
       '<div class="r">'+(DEXTAB==='bio'? '★'.repeat(o.rare) : o.c)+'</div></div>';
  }
  h+='</div>';
  openModal(h);
  paintDexCards();
}
function paintDexCards(){
  document.querySelectorAll('.dc').forEach(cn=>{
    const id=cn.dataset.id, got=cn.dataset.got==='1';
    pixelInto(cn, g=>{
      g.save(); g.translate(150,80);
      if(!got) g.globalAlpha=0.001;
      if(DEXTAB==='bio'){ g.scale(1.25,1.25); drawCreature(g,id,1,W.t); }
      else { g.translate(0,32); drawShipSide(g,id,230,{dir:1,sail:3,flag:CAP().flag}); }
      g.restore();
    });
    if(!got){
      const g=cn.getContext('2d');
      g.fillStyle='#25384a'; g.font='bold 40px serif'; g.textAlign='center';
      g.fillText('?',150,95); g.textAlign='left';
    }
  });
}
A.dex = t => openDex(t);
A.dexInfo = id => {
  const got=S.dex[DEXTAB][id];
  if(!got){ toast('아직 못 본 것이다. 바다에서 망원경으로 찾아보자',''); return; }
  const o = DEXTAB==='bio'? BI(id) : SH(id);
  let h=head('📖 '+o.n, DEXTAB==='bio'? ('희귀도 '+'★'.repeat(o.rare)+' · 본 횟수 '+got+'번') : (o.c+' · 본 횟수 '+got+'번'));
  h+='<canvas id="big" width="900" height="380" style="width:100%;background:#0e1b27;border-radius:10px"></canvas>';
  h+='<div class="card" style="margin-top:10px"><div class="d" style="font-size:15px">'+o.info+'</div>';
  if(DEXTAB==='ship') h+='<div class="d">길이 약 '+o.len+'m · 속도 '+o.kn+'노트 · 대포 '+o.guns+'문 · 선원 '+o.crew+'명 · 짐칸 '+o.cargo+'</div>';
  h+='</div><div class="row"><button onclick="A.dex(\''+DEXTAB+'\')">← 도감으로</button></div>';
  openModal(h);
  const g=$('#big').getContext('2d');
  g.save(); g.translate(450,DEXTAB==='bio'?190:270);
  if(DEXTAB==='bio'){ g.scale(2.6,2.6); drawCreature(g,id,1,W.t); }
  else drawShipSide(g,id,760,{dir:1,sail:3,crew:5,flag:'#c33'});
  g.restore();
};

/* 지도 */
let MAPHOVER=null;
function openMap(){
  const conn=neighbors(S.at);
  let h=head('🗺️ 해도', S.scene==='sail'? '지금 '+P(S.at).n+' → '+P(S.to).n+'로 가는 중.' :
    '가고 싶은 항구를 눌러라. 파란 점만 갈 수 있다(항로로 이어진 곳).');
  h+='<div id="mapwrap"><canvas id="mapcv" width="1000" height="600"></canvas></div>';
  if(S.scene==='port'){
    h+='<div class="row">';
    for(const id of conn){
      const d=legDist(S.at,id);
      h+='<div class="card"><div class="t">'+P(id).n+'</div><div class="d">'+P(id).c+' · '+d+'km · 약 '+
         (d/(kmh(myKnots())*24)).toFixed(1)+'일<br>'+P(id).say+'</div>'+
         '<button onclick="A.sail(\''+id+'\')">여기로 출항</button></div>';
    }
    h+='</div>';
  }
  openModal(h);
  const cn=$('#mapcv'), g=cn.getContext('2d');
  const paint=()=>drawMapInto(g,1000,600,MAPHOVER);
  paint();
  cn.onmousemove=e=>{
    const r=cn.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*1000, y=(e.clientY-r.top)/r.height*600;
    let hit=null;
    for(const p of PORTS){ if(Math.hypot(mapX(p.lon)-x, mapY(p.lat)-y)<14) hit=p.id; }
    if(hit!==MAPHOVER){ MAPHOVER=hit; paint(); }
    cn.style.cursor = hit? 'pointer':'crosshair';
  };
  cn.onclick=()=>{
    if(!MAPHOVER || S.scene!=='port') return;
    if(MAPHOVER===S.at){ toast('여기가 지금 있는 항구다',''); return; }
    if(!conn.includes(MAPHOVER)){ toast('여기서 바로 갈 수 있는 항로가 없다. 이어진 항구를 거쳐 가자','bad'); return; }
    startSail(MAPHOVER);
  };
  cn._paint=paint;
}
A.sail = id => startSail(id);

/* =====================================================================
   조작
   ===================================================================== */
const KEY={};
window.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='escape'){ closeModal(); return; }
  const open = $('#modal').classList.contains('on');
  if(open) return;
  if(k===' '||k==='spacebar'){ e.preventDefault();
    if(S.scene==='battle') fireCannon(); else if(S.scene==='sail') tryScope();
    return;
  }
  if(k==='arrowleft'){
    if(S.scene==='sail'){ S.sail=clamp(S.sail-1,0,3); toast(['돛을 내렸다','돛 1단','돛 2단','돛을 활짝'][S.sail],''); }
    if(S.scene==='battle') W.battle.dist=clamp(W.battle.dist+9,10,100);
  }
  if(k==='arrowright'){
    if(S.scene==='sail'){ S.sail=clamp(S.sail+1,0,3); toast(['돛을 내렸다','돛 1단','돛 2단','돛을 활짝'][S.sail],''); }
    if(S.scene==='battle') W.battle.dist=clamp(W.battle.dist-9,10,100);
  }
  if(k==='f' && S.scene==='sail'){ S.warp = S.warp===1?3:(S.warp===3?8:1); renderButtons(); }
  if(k==='t'){
    S.dot=!S.dot; applyDot();
    toast(S.dot? '옛날 게임 도트 그림으로 바꿨다':'매끈한 2D 그림으로 바꿨다','');
  }
  if(k==='v' && S.scene==='sail'){
    S.view = S.view==='stern'?'deck':(S.view==='deck'?'side':'stern');
    toast({stern:'배 뒤에서 보기',deck:'갑판에서 앞을 보기',side:'옆에서 보기'}[S.view],'');
  }
  if(k==='c' && S.scene==='sail' && W.foe){ startBattle(W.foe); }
  if(k==='b' && S.scene==='battle') tryBoard();
  if(k==='r' && S.scene==='battle') tryFlee();
  if(k==='m'){ openMap(); }
  if(k==='d'){ openDex(); }
  if(S.scene==='port'){
    if(k==='1') openTavern();
    if(k==='2') openInn();
    if(k==='3') openMarket();
    if(k==='4') openTrade();
    if(k==='5') openYard();
  }
});

/* =====================================================================
   메인 루프
   ===================================================================== */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  try{
    W.t += dt;
    msgStep(dt);
    const open = $('#modal').classList.contains('on');
    if(W.scope) scopeStep(dt);
    if(!open){
      if(S.scene==='sail') sailStep(dt);
      else if(S.scene==='battle') battleStep(dt);
    }
    ctx.clearRect(0,0,Wd,Ht);
    const g = beginPixel();
    if(S.scene==='port') drawPortScene(g);
    else if(S.scene==='sail') drawSailScene(g);
    else drawBattleScene(g);
    endPixel();
    drawOverlay(ctx);
    if(++hudTick%6===0) renderHUD();
  }catch(err){
    console.error(err);
  }
}

/* =====================================================================
   시작
   ===================================================================== */
function applyDot(){
  PIX = S.dot? 4 : 1;
  PIXART = !!S.dot;
}
function startGame(fresh, capId){
  if(fresh || !load()) S = newGame(capId);
  applyDot();
  if(!S.view || S.view==='deck') S.view='stern';
  if(!S.cap) S.cap='gama';
  S.dex.ship[S.ship]=S.dex.ship[S.ship]||1;
  if(S.scene==='battle'){ S.scene='sail'; W.battle=null; }
  resize(); renderHUD(); renderButtons(); renderKeys();
  closeModal();
  MSGQ.length=0; MSG=null;
  say('나는 '+CAP().n+'. 오늘부터 네가 내 배의 선원이다. '+P(S.at).n+'에서 출발한다!');
  say('바다에서 처음 보는 것이 있으면 망원경으로 잘 기록해라. 그게 네 일이다.');
}
function titleScreen(){
  const has = !!localStorage.getItem(SAVEKEY);
  let h='<h2>⚓ 선원 게임 — 1500년대 대항해</h2>'+
    '<div class="sub">너는 배 한 척을 맡은 선원이다. 갑판에서 앞을 보며 바다를 건너고, 처음 보는 생물과 배를 망원경으로 기록해 도감을 채우고, '+
    '항구에 닿으면 식당과 여관에서 지친 몸을 쉬게 하자.</div>'+
    '<div class="row">'+
    '<div class="card"><div class="t">🔭 도감 채우기</div><div class="d">바다에서 뭔가 보이면 <b>스페이스</b>로 망원경. 처음 보는 것이면 도감에 적히고 상금을 받는다. 생물 17가지, 배 10가지.</div></div>'+
    '<div class="card"><div class="t">😴 피로도</div><div class="d">항해할수록 선원들이 지친다. 지치면 배가 느려지고 망원경도 흔들린다. 항구의 <b>식당</b>과 <b>여관</b>에서 쉬어야 한다.</div></div>'+
    '<div class="card"><div class="t">💥 적 배</div><div class="d">해적선은 다가와서 싸움을 건다. 대포로 쏘거나, 붙어서 백병전을 하거나, 돛을 활짝 펴고 도망칠 수 있다.</div></div>'+
    '<div class="card"><div class="t">⚖️ 무역과 배</div><div class="d">싼 항구에서 사서 비싼 항구에 팔면 돈이 모인다. 그 돈으로 카락·갤리온·정크선·판옥선·거북선까지 살 수 있다.</div></div>'+
    '</div>'+
    '<h3>누구의 선원이 될래?</h3><div class="sub">고른 사람에 따라 시작하는 나라·항구·배와 잘하는 것이 다르다.</div>'+
    '<div class="row">';
  for(const c of CAPS){
    h+='<div class="card" style="min-width:210px">'+
       '<canvas class="cap" data-cap="'+c.id+'" data-ship="'+c.ship+'" data-flag="'+c.flag+'" width="330" height="170" '+
       'style="width:100%;height:120px;background:#0e1b27;border-radius:8px"></canvas>'+
       '<div class="t">'+c.n+'</div>'+
       '<div class="d"><b>'+c.c+' · '+P(c.port).n+'</b>에서 시작 · '+SH(c.ship).n+'<br>'+
       '<span style="color:#8fd0a0">'+c.perkN+'</span> — '+c.perkD+'<br><span style="color:#9fb8cc">'+c.info+'</span></div>'+
       '<button onclick="A.start(1,\''+c.id+'\')">이 사람의 선원이 되기</button></div>';
  }
  h+='</div><div class="row">'+
    (has? '<button class="g" onclick="A.start(0)">▶ 하던 것 이어서 하기</button>':'')+
    '</div><div class="sub">괴혈병 조심! 과일을 안 먹고 오래 다니면 선원들이 아프다.</div>';
  $('#box').innerHTML=h; $('#modal').classList.add('on');
  document.querySelectorAll('.cap').forEach(cn=>{
    pixelInto(cn, g2=>{
      g2.fillStyle='#0e1b27'; g2.fillRect(0,0,330,170);
      g2.save(); g2.translate(232,150);
      drawShipSide(g2, cn.dataset.ship, 190, {dir:1,sail:3,crew:2,flag:cn.dataset.flag});
      g2.restore();
      g2.save(); g2.translate(78,86);
      drawPortrait(g2, cn.dataset.cap, 150);
      g2.restore();
    });
  });
}
A.start = (fresh, cap) => { startGame(!!fresh, cap); };

/* 켜기 */
S = newGame();
resize();
renderHUD(); renderButtons(); renderKeys();
titleScreen();
requestAnimationFrame(loop);

</script>
