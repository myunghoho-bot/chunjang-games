<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선원 게임 — 1500년대 대항해</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#08131d;
  font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:#f6ead0;
  -webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ── 위쪽 정보줄 ── */
#hud{display:none}
#hud2{position:fixed;left:0;right:0;top:0;padding:6px 10px;display:flex;gap:8px;flex-wrap:wrap;
  align-items:center;font-size:14px;pointer-events:none;z-index:5}
.chip{background:#1b2b3ccc;border:1px solid #47617a;border-radius:8px;padding:3px 9px;white-space:nowrap}
.chip b{color:#ffd98a}
.bar{width:96px;height:9px;background:#0d1a26;border:1px solid #47617a;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:-1px}
.bar i{display:block;height:100%;width:0}
#btns{position:fixed;right:14px;bottom:136px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;
  justify-content:flex-end;max-width:60vw}
button{font-family:inherit;font-size:14px;color:#3f2c18;background:#e6d5ac;
  border:2px solid #5b4026;border-bottom-width:4px;border-radius:4px;padding:6px 12px;cursor:pointer;
  box-shadow:0 2px 0 #3f2c18}
button:hover{background:#f4e7c6}
button:active{border-bottom-width:2px;transform:translateY(2px)}
button.g{background:#bcd6a8}button.r{background:#e6b6a2}button.b{background:#b6cbe6}
button:disabled{background:#9a8f78;color:#5b5245;cursor:default}

/* ── 아래 조작 안내 ── */
#keys{position:fixed;left:14px;bottom:136px;font-size:13px;color:#3f2c18;background:#e6d5ac;
  border:2px solid #5b4026;border-radius:4px;padding:5px 10px;z-index:5;line-height:1.7;
  box-shadow:0 2px 0 #3f2c18}
#keys kbd{background:#7a5a34;border:1px solid #3f2c18;border-bottom-width:2px;border-radius:3px;
  padding:0 5px;color:#ffe9b8}
#toast{display:none}

/* ── 큰 창(항구·도감·지도) ── */
#modal{position:fixed;inset:0;background:#04070bcc;display:none;z-index:20;
  align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#box{background:#e6d5ac;color:#3f2c18;border:6px solid #5b4026;outline:3px solid #3f2c18;
  border-radius:4px;max-width:1080px;width:100%;
  max-height:94vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 40px #000a}
#box h2{margin:0 0 4px;font-size:22px;color:#5b2a10}
#box h3{margin:14px 0 6px;font-size:17px;color:#5b2a10}
.sub{color:#6b5433;font-size:13px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.card{background:#f0e2bc;border:2px solid #7a5a34;border-radius:3px;padding:10px 12px;min-width:180px;flex:1}
.card .t{font-weight:bold;color:#5b2a10}
.card .d{font-size:13px;color:#4a3722;margin:3px 0 7px;line-height:1.45}
.price{color:#8a4a10;font-weight:bold}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #b09668;padding:5px 6px;text-align:center}
th{color:#5b2a10}
.tabs{display:flex;gap:6px;margin:6px 0 10px}
.tabs button{padding:5px 14px}
.gridx{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:8px}
.dexc{background:#f0e2bc;border:2px solid #7a5a34;border-radius:3px;padding:6px;text-align:center;cursor:pointer}
.dexc.q{opacity:.55;filter:grayscale(1)}
.dexc canvas{width:100%;height:78px;display:block;background:#12212f;border-radius:2px}
.dexc .n{font-size:13px;margin-top:4px;color:#5b2a10;font-weight:bold}
.dexc .r{font-size:11px;color:#7a5a34}
.close{position:sticky;top:0;float:right}
#mapwrap{position:relative}
#mapcv{width:100%;background:#e8d7ae;border-radius:10px;display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="keys"></div>
<div id="toast"></div>
<div id="btns"></div>
<div id="modal"><div id="box"></div></div>

<script>
"use strict";
/* =====================================================================
   선원 게임 — 1500년대 대항해
   한 파일짜리 게임. 캔버스에 전부 직접 그린다(그림에 이모티콘 안 씀).
   ===================================================================== */

/* ── 작은 도우미들 ── */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const ri  = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const R = n => Math.round(n);

const cv = $('#cv'), ctx = cv.getContext('2d');
let Wd = 1200, Ht = 700, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  Wd = Math.max(320, window.innerWidth||1200);
  Ht = Math.max(240, window.innerHeight||700);
  cv.width = R(Wd*DPR); cv.height = R(Ht*DPR);
  cv.style.width = Wd+'px'; cv.style.height = Ht+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

/* ── 그림 방식 ──
   PIX=1 : 매끈한 2D (기본)
   PIX=4 : 작은 화면에 그린 뒤 크게 늘리는 옛날 게임 도트 (T키로 바꿈) */
let PIX = 1;
const oc = document.createElement('canvas');
const octx = oc.getContext('2d');
let _W=0,_H=0;
const smooth2D = () => (PIX<=1 && !PIXART);
function beginPixel(){
  if(smooth2D()){ ctx.setTransform(DPR,0,0,DPR,0,0); return ctx; }
  const bw=Math.ceil(Wd/PIX), bh=Math.ceil(Ht/PIX);
  if(oc.width!==bw||oc.height!==bh){ oc.width=bw; oc.height=bh; }
  _W=Wd; _H=Ht; Wd=bw; Ht=bh;
  octx.setTransform(1,0,0,1,0,0);
  octx.clearRect(0,0,bw,bh);
  return octx;
}
/* 옛날 게임처럼 쓸 수 있는 색을 확 줄인다(팔레트) */
const PAL = [
  [8,10,18],[18,22,38],[26,38,66],[42,64,104],[74,110,160],[122,164,208],[184,220,240],[236,246,252],
  [240,168,96],[216,104,64],[248,224,160],[140,60,40],
  [10,30,48],[16,52,78],[26,80,112],[40,120,160],[80,168,192],[160,220,232],
  [42,26,16],[74,48,32],[107,74,40],[138,106,60],[176,138,80],[216,184,120],
  [246,239,221],[222,212,184],[176,164,136],
  [141,47,38],[192,67,47],[224,106,74],
  [31,74,46],[47,107,79],[90,138,80],[134,168,106],
  [230,195,154],[201,161,121],[138,106,74],
  [255,255,255],[200,204,208],[128,136,144],[64,72,80],[16,20,24],
  [216,178,74],[240,214,138],
];
const palCache = new Int16Array(32768).fill(-1);
function nearestPal(r,gg,b){
  let best=0,bd=1e9;
  for(let i=0;i<PAL.length;i++){
    const p=PAL[i], dr=r-p[0], dg=gg-p[1], db=b-p[2];
    const d=dr*dr*0.5+dg*dg*0.7+db*db*0.3;
    if(d<bd){ bd=d; best=i; }
  }
  return best;
}
let PIXART = false;
function quantize(){
  const img=octx.getImageData(0,0,oc.width,oc.height), d=img.data;
  for(let i=0;i<d.length;i+=4){
    const key=((d[i]>>3)<<10)|((d[i+1]>>3)<<5)|(d[i+2]>>3);
    let idx=palCache[key];
    if(idx<0){ idx=nearestPal(d[i],d[i+1],d[i+2]); palCache[key]=idx; }
    const c=PAL[idx]; d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=255;
  }
  octx.putImageData(img,0,0);
}
function endPixel(){
  if(smooth2D()) return;
  Wd=_W; Ht=_H;
  if(PIXART){ try{ quantize(); }catch(e){ PIXART=false; } }
  ctx.imageSmoothingEnabled=false;
  ctx.mozImageSmoothingEnabled=false;
  ctx.drawImage(oc,0,0,oc.width,oc.height,0,0,Wd,Ht);
}
/* 작은 캔버스(도감 카드 등) */
function pixelInto(cn, fn){
  const g0=cn.getContext('2d');
  g0.clearRect(0,0,cn.width,cn.height);
  if(smooth2D()){ fn(g0); return; }
  const w=cn.width,h=cn.height,s=3;
  const t=document.createElement('canvas');
  t.width=Math.max(1,Math.ceil(w/s)); t.height=Math.max(1,Math.ceil(h/s));
  const tg=t.getContext('2d'); tg.scale(1/s,1/s); fn(tg);
  const g=cn.getContext('2d'); g.clearRect(0,0,w,h);
  g.imageSmoothingEnabled=false;
  g.drawImage(t,0,0,t.width,t.height,0,0,w,h);
}

/* =====================================================================
   1. 자료 — 항구 / 무역품 / 배 / 바다 생물
   ===================================================================== */

/* 지도는 가로 1000 세로 600 (경도·위도를 그대로 편 옛날식 해도) */
const mapX = lon => (lon+180)/360*1000;
const mapY = lat => (90-lat)/180*600;

const PORTS = [
  {id:'lisboa', n:'리스본',   c:'포르투갈', lon:-9.1,  lat:38.7, reg:'eu', sell:['모직물'], say:'인도로 가는 배가 모두 여기서 떠난다.'},
  {id:'sevilla',n:'세비야',   c:'스페인',   lon:-6.0,  lat:37.4, reg:'eu', sell:['모직물'], say:'아메리카에서 온 은이 쌓이는 강 항구.'},
  {id:'venezia',n:'베네치아', c:'베네치아', lon:12.3,  lat:45.4, reg:'eu', sell:['유리구슬'], say:'후추 한 줌이 금 한 줌 값이던 도시.'},
  {id:'istanbul',n:'이스탄불',c:'오스만',   lon:29.0,  lat:41.0, reg:'eu', sell:['양탄자'], say:'동방으로 가는 옛 길의 문.'},
  {id:'casa',   n:'카사블랑카',c:'모로코',  lon:-7.6,  lat:33.6, reg:'af', sell:['양탄자'], say:'북아프리카의 첫 기항지.'},
  {id:'elmina', n:'엘미나',   c:'기니 만',  lon:-1.3,  lat:5.1,  reg:'af', sell:['상아'],   say:'적도의 더위와 소나기가 기다린다.'},
  {id:'cape',   n:'희망봉',   c:'남아프리카',lon:18.4, lat:-33.9,reg:'af', sell:['상아'],   say:'폭풍의 곶. 여길 돌면 인도가 열린다.'},
  {id:'mozam',  n:'모잠비크', c:'동아프리카',lon:40.7, lat:-15.0,reg:'af', sell:['상아'],   say:'다우선들이 오가는 따뜻한 바다.'},
  {id:'goa',    n:'고아',     c:'인도',     lon:73.8,  lat:15.5, reg:'in', sell:['후추'],   say:'후추와 계피가 산처럼 쌓인 항구.'},
  {id:'malacca',n:'말라카',   c:'말레이',   lon:102.2, lat:2.2,  reg:'in', sell:['정향'],   say:'좁은 해협의 목. 배가 다 지나간다.'},
  {id:'macao',  n:'마카오',   c:'명나라',   lon:113.5, lat:22.2, reg:'ea', sell:['비단','도자기'], say:'비단과 도자기를 사려면 여기.'},
  {id:'manila', n:'마닐라',   c:'필리핀',   lon:120.9, lat:14.6, reg:'ea', sell:['도자기'], say:'아메리카로 가는 갈레온이 출발한다.'},
  {id:'nagasaki',n:'나가사키',c:'일본',     lon:129.9, lat:32.7, reg:'ea', sell:['은'],     say:'은이 많이 나는 항구.'},
  {id:'busan',  n:'부산',     c:'조선',     lon:129.0, lat:35.1, reg:'ea', sell:['도자기'], say:'판옥선과 거북선을 볼 수 있는 곳.'},
  {id:'habana', n:'아바나',   c:'카리브',   lon:-82.4, lat:23.1, reg:'am', sell:['설탕'],   say:'보물선이 모여 함께 출발하는 항구.'},
  {id:'veracruz',n:'베라크루스',c:'멕시코', lon:-96.1, lat:19.2, reg:'am', sell:['은'],     say:'은 수레가 산에서 내려온다.'},
  {id:'lima',   n:'리마',     c:'페루',     lon:-77.0, lat:-12.0,reg:'am', sell:['은'],     say:'태평양 쪽 은의 항구.'},
  {id:'rio',    n:'리우',     c:'브라질',   lon:-43.2, lat:-22.9,reg:'am', sell:['설탕'],   say:'설탕과 브라질나무의 해안.'},
  {id:'plymouth',n:'플리머스',c:'잉글랜드', lon:-4.1,  lat:50.4, reg:'eu', sell:['모직물'], say:'사략선들이 조용히 떠나는 항구.'},
];
const P = id => PORTS.find(p=>p.id===id);

/* 항로(이어진 항구끼리만 갈 수 있다) */
const LINKS = [
  ['lisboa','sevilla'],['lisboa','casa'],['sevilla','casa'],['sevilla','venezia'],
  ['venezia','istanbul'],['casa','elmina'],['elmina','cape'],['cape','mozam'],
  ['mozam','goa'],['goa','malacca'],['malacca','macao'],['macao','manila'],
  ['macao','nagasaki'],['nagasaki','busan'],['sevilla','habana'],['habana','veracruz'],
  ['habana','rio'],['rio','cape'],['rio','lima'],['lima','manila'],['lisboa','habana'],
  ['plymouth','lisboa'],['plymouth','sevilla'],
];

/* 누구의 선원이 될까 — 대항해시대 4 주인공들 */
const CAPS = [
  {id:'rafael', n:'라파엘 카스트로', c:'포르투갈', port:'lisboa', ship:'caravel', gold:430, flag:'#1f6b3a',
   perkN:'모험가', perkD:'도감에 처음 기록할 때 상금을 두 배로 받는다.',
   info:'포르투갈 편 주인공. 리스본에서 카라벨을 몰고 바다로 나선다.'},
  {id:'joao', n:'조안 페레로', c:'스페인', port:'sevilla', ship:'caravel', gold:420, flag:'#c8a02a',
   perkN:'교역왕', perkD:'물건을 팔 때 값을 15% 더 받는다.',
   info:'스페인 편 주인공. 장사로 돈을 모아 큰 배를 사 모은다.'},
  {id:'alvezas', n:'알 베자스', c:'오스만', port:'istanbul', ship:'galley', gold:330, flag:'#8a1f2a',
   perkN:'지중해의 사자', perkD:'대포가 잘 맞고 백병전에 아주 세다.',
   info:'오스만 편 주인공. 노 젓는 갤리로 지중해를 누빈다.'},
  {id:'lihuamei', n:'리화매', c:'명나라', port:'macao', ship:'junk', gold:230, flag:'#c8442e',
   perkN:'바다의 여장부', perkD:'배가 아주 튼튼해서 잘 안 부서진다.',
   info:'명나라 편 주인공. 아버지의 정크선을 물려받은 여자 선장.'},
  {id:'tial', n:'티알 도세', c:'남쪽 바다', port:'malacca', ship:'dhow', gold:340, flag:'#2a7a5a',
   perkN:'남해의 딸', perkD:'싸움에서 이기면 전리품을 두 배로 얻는다.',
   info:'동남아시아 편 주인공. 좁은 해협을 손바닥처럼 안다.'},
];
const CAP = () => CAPS.find(c=>c.id===S.cap) || CAPS[0];
const perk = id => S.cap===id;
function neighbors(id){
  const out=[];
  for(const [a,b] of LINKS){ if(a===id) out.push(b); if(b===id) out.push(a); }
  return out;
}
/* 지도 1픽셀 ≒ 40km */
function legDist(a,b){
  const A=P(a), B=P(b);
  const dx=mapX(A.lon)-mapX(B.lon), dy=mapY(A.lat)-mapY(B.lat);
  return R(Math.sqrt(dx*dx+dy*dy)*40);
}

/* 무역품 — 기본값과 항구별 값 배수 */
const GOODS = [
  {n:'후추',    base:60, w:1},
  {n:'정향',    base:90, w:1},
  {n:'비단',    base:120,w:1},
  {n:'도자기',  base:80, w:1},
  {n:'은',      base:150,w:1},
  {n:'설탕',    base:40, w:1},
  {n:'상아',    base:70, w:1},
  {n:'모직물',  base:30, w:1},
  {n:'양탄자',  base:55, w:1},
  {n:'유리구슬',base:25, w:1},
];
/* 지역별 값 배수: 그 지역에서 나는 건 싸고, 먼 지역에선 비싸다 */
const PRICE = {
  '후추':    {in:.45, ea:.8, af:1.1, eu:2.1, am:2.3},
  '정향':    {in:.5,  ea:.85,af:1.2, eu:2.4, am:2.5},
  '비단':    {ea:.5,  in:.9, af:1.4, eu:2.0, am:2.2},
  '도자기':  {ea:.45, in:.9, af:1.3, eu:1.9, am:2.1},
  '은':      {am:.55, ea:.7, af:1.2, in:1.3, eu:1.6},
  '설탕':    {am:.5,  af:.9, in:1.1, ea:1.3, eu:1.7},
  '상아':    {af:.5,  eu:1.6,in:1.3, ea:1.5, am:1.7},
  '모직물':  {eu:.5,  af:1.2,in:1.5, ea:1.7, am:1.4},
  '양탄자':  {af:.6,  eu:1.4,in:1.1, ea:1.6, am:1.8},
  '유리구슬':{eu:.5,  af:1.9,in:1.5, ea:1.4, am:1.7},
};
function goodPrice(gname, portId){
  const g = GOODS.find(x=>x.n===gname), p = P(portId);
  const m = (PRICE[gname]||{})[p.reg] || 1;
  const wob = 0.85 + ((hashStr(portId+gname+S.day/7|0)%30)/100); /* 항구마다 조금씩 흔들린다 */
  return Math.max(4, R(g.base*m*wob));
}
function hashStr(s){ s=''+s; let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }

/* 배 — 1500년대에 실제로 있던 배들 */
const SHIPS = [
  {id:'caravel', n:'카라벨',  c:'포르투갈', len:22, kn:8,  hull:100, guns:4,  crew:16, cargo:40,  price:0,
   buy:['eu','af'], info:'포르투갈이 아프리카 해안을 더듬어 내려갈 때 쓴 작고 날쌘 탐험선. 삼각돛이라 바람을 비스듬히 받고도 앞으로 나간다.'},

function newGame(capId){
  const cap = CAPS.find(c=>c.id===capId) || CAPS[0];
  const g = {

    sail:2, warp:1, view:'stern', dot:false,
    cargo:{},              /* 무역품 이름 → 개수 */
    dex:{bio:{}, ship:{}},
    seen:0, fights:0, sunk:0,
    tip:0,
  };
  g.gold = cap.gold;
  g.at = cap.port;
  g.ship = cap.ship;

  g.shipName = {rafael:'바다제비호', joao:'산타 마리아호', alvezas:'초승달호',
                lihuamei:'화매호', tial:'남풍호'}[cap.id] || '바다제비호';
  return g;
}
function save(){ try{ localStorage.setItem(SAVEKEY, JSON.stringify(S)); toast('저장했어!','good'); }catch(e){} }
function autosave(){ try{ localStorage.setItem(SAVEKEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVEKEY);
    if(!raw) return false;
    const o = JSON.parse(raw);
    if(!o || !o.ship) return false;
    S = Object.assign(newGame(), o);
    S.dex = Object.assign({bio:{},ship:{}}, S.dex||{});
    return true;
  }catch(e){ return false; }
}

/* ── 색 섞기 ── */
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
const rgb = c => 'rgb('+R(c[0])+','+R(c[1])+','+R(c[2])+')';
const rgba = (c,a) => 'rgba('+R(c[0])+','+R(c[1])+','+R(c[2])+','+a+')';

const SKYK = [
  {h:0,   t:[10,16,34],   b:[18,30,54]},
  {h:5,   t:[26,34,66],   b:[96,74,96]},
  {h:7,   t:[112,152,202],b:[244,186,142]},
  {h:11,  t:[86,148,220], b:[190,226,246]},
  {h:16,  t:[84,144,214], b:[196,222,240]},
  {h:18.5,t:[68,78,150],  b:[250,152,92]},
  {h:20,  t:[22,28,62],   b:[82,62,92]},
  {h:24,  t:[10,16,34],   b:[18,30,54]},
];
function skyCol(h){
  for(let i=0;i<SKYK.length-1;i++){
    const a=SKYK[i], b=SKYK[i+1];
    if(h>=a.h && h<=b.h){
      const t=(h-a.h)/(b.h-a.h);
      return {t:mix(a.t,b.t,t), b:mix(a.b,b.b,t)};
    }
  }
  return {t:SKYK[0].t, b:SKYK[0].b};
}
const isNight = () => (S.hour<6 || S.hour>19.5);
function dayAmt(){ /* 0(밤)~1(대낮) */
  const h=S.hour;
  if(h<5||h>20) return 0;
  if(h<7) return (h-5)/2;
  if(h>18.5) return (20-h)/1.5;
  return 1;
}

/* 별 자리는 고정 */
const STARS = [];
for(let i=0;i<160;i++) STARS.push([Math.random(), Math.random()*0.6, Math.random()*1.4+0.4]);
const CLOUDS = [];
for(let i=0;i<9;i++) CLOUDS.push({x:Math.random(), y:Math.random()*0.3+0.05, s:rnd(.6,1.6), v:rnd(.2,.6)});

/* ── 하늘 ── */
function drawSky(g, y0, storm){
  const sc = skyCol(S.hour);
  let top=sc.t, bot=sc.b;
  if(storm){ top=mix(top,[52,56,64],.75); bot=mix(bot,[92,98,108],.75); }
  const gr = g.createLinearGradient(0,0,0,y0);
  gr.addColorStop(0, rgb(top)); gr.addColorStop(1, rgb(bot));
  g.fillStyle=gr; g.fillRect(-Wd*0.3,-Ht*0.3,Wd*1.6,y0+Ht*0.3+8);

  const night = 1-dayAmt();
  if(night>0.25 && !storm){
    g.fillStyle='#fff';
    for(const s of STARS){
      const a=(night-0.25)/0.75 * (0.35+0.65*Math.abs(Math.sin(W.t*0.7+s[0]*30)));
      g.globalAlpha=a*0.9;
      g.fillRect(s[0]*Wd, s[1]*y0, s[2], s[2]);
    }
    g.globalAlpha=1;
    /* 달 */
    const mr=Ht*0.032, mx=Wd*0.78, my=y0*0.22;
    g.fillStyle='#f4efd8'; g.beginPath(); g.arc(mx,my,mr,0,7); g.fill();
    g.fillStyle=rgba(top,1); g.beginPath(); g.arc(mx+mr*0.45,my-mr*0.3,mr*0.88,0,7); g.fill();
  }
  if(dayAmt()>0.05 && !storm){
    /* 해 */
    const p=(S.hour-5)/15;
    const sx=Wd*(0.1+p*0.8), sy=y0*(0.72-Math.sin(p*Math.PI)*0.6);
    const gg=g.createRadialGradient(sx,sy,Ht*0.01,sx,sy,Ht*0.13);
    gg.addColorStop(0,'rgba(255,250,215,.95)'); gg.addColorStop(1,'rgba(255,220,150,0)');
    g.fillStyle=gg; g.beginPath(); g.arc(sx,sy,Ht*0.13,0,7); g.fill();
    g.fillStyle='#fff6cf'; g.beginPath(); g.arc(sx,sy,Ht*0.028,0,7); g.fill();
  }
  /* 구름 */
  const U=Ht/180;
  for(const c of CLOUDS){
    const x=((c.x + W.t*c.v*0.006)%1.3-0.15)*Wd, y=c.y*y0, s=c.s*(storm?1.5:1)*U;
    g.fillStyle = storm ? 'rgba(60,64,72,.85)' : rgba(mix([255,255,255],bot,.25), 0.55);
    g.beginPath();
    g.ellipse(x,y,11*s,3.6*s,0,0,7); g.ellipse(x+7*s,y-2*s,8*s,3*s,0,0,7);
    g.ellipse(x-8*s,y+0.8*s,7*s,2.6*s,0,0,7); g.fill();
  }
}

/* ── 바다 ── */
function seaY(x, y0, rough){
  return y0 + Math.sin(x*0.011 + W.t*1.6)*3*rough
            + Math.sin(x*0.023 - W.t*2.3)*2*rough
            + Math.sin(x*0.005 + W.t*0.9)*5*rough;
}
function drawSeaBack(g, y0, rough){
  const d = dayAmt();
  const surf = mix([16,34,58], [34,104,148], d);
  const deep = mix([4,10,20],  [10,40,72],  d);
  const gr = g.createLinearGradient(0,y0,0,Ht);
  gr.addColorStop(0, rgb(surf)); gr.addColorStop(1, rgb(deep));
  g.fillStyle=gr;
  g.beginPath(); g.moveTo(0,Ht); g.lineTo(0,y0);
  for(let x=0;x<=Wd;x+=8) g.lineTo(x, seaY(x,y0,rough));
  g.lineTo(Wd,Ht); g.closePath(); g.fill();
  /* 물속 빛줄기 */
  if(d>0.2){
    g.save(); g.globalAlpha=0.06*d; g.fillStyle='#cfefff';
    for(let i=0;i<7;i++){
      const x=(i*197 + W.t*8)%(Wd+300)-150;
      g.beginPath(); g.moveTo(x,y0); g.lineTo(x+40,y0); g.lineTo(x+140,Ht); g.lineTo(x+20,Ht); g.fill();
    }
    g.restore();
  }
}
function drawSeaFront(g, y0, rough){
  /* 배 앞쪽으로 지나가는 파도 마루 */
  const d=dayAmt();
  g.save();
  const U=Ht/180;
  g.strokeStyle=rgba(mix([120,150,180],[200,235,255],d), .5); g.lineWidth=Math.max(1,U*0.4);
  for(let k=0;k<4;k++){
    const off = y0 + U*3 + k*U*4;
    g.beginPath();
    for(let x=0;x<=Wd;x+=Wd*0.01){
      const yy = off + Math.sin(x*0.02 + W.t*(2+k*0.7) + k)*U*0.8*rough;
      x?g.lineTo(x,yy):g.moveTo(x,yy);
    }
    g.globalAlpha=0.5-k*0.09; g.stroke();
  }
  g.restore();
}

function hullPath(g, L, p){
  const half=L/2, h=L*p.h, d=L*p.d;
  const fl=L*p.fl, fh=L*p.fh, sl=L*p.sl, sh=L*p.sh, bk=L*p.beak;
  g.beginPath();
  g.moveTo(-half, -h-sh);
  g.lineTo(-half+sl*0.86, -h-sh);
  g.lineTo(-half+sl, -h);
  g.lineTo(half-fl, -h);
  if(fh>0.001*L){ g.lineTo(half-fl, -h-fh); g.lineTo(half-fl*0.35, -h-fh); }
  if(p.junkbow){                       /* 정크선은 뱃머리가 뭉툭하게 잘려 있다 */
    g.lineTo(half, -h-fh*0.6);
    g.lineTo(half, d*0.4);
  }else{
    g.lineTo(half+bk, -h-fh*0.6);
    g.quadraticCurveTo(half+bk*0.5, -h*0.35, half-L*0.015, d*0.45);
  }
  if(p.flat){                          /* 조선 배는 배 밑이 평평하다 */
    g.lineTo(half-L*0.06, d);
    g.lineTo(-half+L*0.06, d);
  }else{
    g.quadraticCurveTo(half*0.55, d*1.05, half*0.1, d);
    g.lineTo(-half+L*0.12, d);
  }
  g.quadraticCurveTo(-half-L*(p.pear?0.02:0.005), d*0.8, -half, -h-sh);
  g.closePath();
}

function drawFlag(g,x,y,w,h,col,t,dir){
  g.save(); g.translate(x,y);
  g.fillStyle=col; g.beginPath(); g.moveTo(0,0);
  for(let i=0;i<=6;i++){
    const u=i/6;
    g.lineTo(dir*u*w, Math.sin(t*5+u*5)*2.4*u);
  }
  for(let i=6;i>=0;i--){
    const u=i/6;
    g.lineTo(dir*u*w, h + Math.sin(t*5+u*5)*2.4*u);
  }
  g.closePath(); g.fill(); g.restore();
}

/* 네모돛 */
function drawSqSail(g, mx, top, spanW, sailH, furl, t, dir){
  const yw = spanW;
  g.strokeStyle='#4a3520'; g.lineWidth=Math.max(1.5,spanW*0.045);
  g.beginPath(); g.moveTo(mx-yw/2, top); g.lineTo(mx+yw/2, top); g.stroke();
  if(furl<=0.02){ /* 돛을 말아 올린 모습 */
    g.fillStyle='#ddd3bb';
    g.beginPath(); g.ellipse(mx, top+2, yw*0.46, Math.max(2,sailH*0.08), 0,0,7); g.fill();
    return;
  }
  const hh = sailH*(0.55+0.45*furl);
  const sway = dir*hh*0.05*Math.sin(t*0.8);
  const gr=g.createLinearGradient(mx-yw/2,0,mx+yw/2,0);
  gr.addColorStop(0,'#cec3a6'); gr.addColorStop(.45,'#f4eddb'); gr.addColorStop(1,'#d5caac');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(mx-yw/2, top+1);
  g.lineTo(mx-yw*0.56+sway, top+hh);
  g.quadraticCurveTo(mx+sway, top+hh+hh*0.17, mx+yw*0.56+sway, top+hh);
  g.lineTo(mx+yw/2, top+1);
  g.closePath(); g.fill();
  g.strokeStyle='rgba(120,100,70,.35)'; g.lineWidth=1;
  for(const u of [-0.22,0.22]){
    g.beginPath(); g.moveTo(mx+yw*u, top+2); g.lineTo(mx+yw*u*1.1+sway, top+hh+hh*0.1); g.stroke();
  }
}
/* 삼각돛(라틴 세일) — 활대가 앞아래에서 뒤위로 비스듬히 걸린다 */
function drawLatSail(g, mx, deck, mh, furl, t, dir){
  const ax = mx+dir*mh*0.40, ay = deck-mh*0.18;     /* 앞쪽 아래 끝 */
  const bx = mx-dir*mh*0.16, by = deck-mh*0.98;     /* 뒤쪽 위 끝 */
  g.strokeStyle='#4a3520'; g.lineWidth=Math.max(1.4,mh*0.026);
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  if(furl<=0.02){
    g.fillStyle='#ddd3bb'; g.save();
    g.translate((ax+bx)/2,(ay+by)/2); g.rotate(Math.atan2(by-ay,bx-ax));
    g.beginPath(); g.ellipse(0,0, mh*0.30, Math.max(2,mh*0.022),0,0,7); g.fill(); g.restore();
    return;
  }
  const f=0.5+0.5*furl;
  const cx = mx-dir*mh*(0.06+0.26*f), cy = deck-mh*0.05;
  const sway = dir*mh*0.05*Math.sin(t*0.7);
  const gr=g.createLinearGradient(bx,by,cx,cy);
  gr.addColorStop(0,'#f4eddb'); gr.addColorStop(1,'#d3c8aa');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(ax,ay);
  g.lineTo(bx,by);
  g.quadraticCurveTo((bx+cx)/2+sway*1.4, (by+cy)/2, cx+sway, cy);
  g.quadraticCurveTo((cx+ax)/2+sway*0.6, (cy+ay)/2+mh*0.06, ax,ay);
  g.closePath(); g.fill();
  g.strokeStyle='rgba(120,100,70,.4)'; g.lineWidth=1; g.stroke();
}
/* 정크선 부채돛 */
function drawJunkSail(g, mx, deck, mh, furl, t, dir){
  const h=mh*0.86*Math.max(0.12,furl), top=deck-mh*0.95, w=mh*0.52;
  g.fillStyle='#b1743e';
  g.beginPath();
  g.moveTo(mx-dir*w*0.16, top);
  g.lineTo(mx+dir*w*0.9, top+h*0.12);
  g.lineTo(mx+dir*w*0.86, top+h);
  g.lineTo(mx-dir*w*0.22, top+h*0.92);
  g.closePath(); g.fill();
  g.strokeStyle='#6d4423'; g.lineWidth=1.4;
  for(let i=0;i<=6;i++){
    const u=i/6;
    g.beginPath();
    g.moveTo(mx-dir*w*(0.16+0.06*u), top+ (h*0.92-0)*u + h*0.02);
    g.lineTo(mx+dir*w*(0.9-0.04*u), top+h*0.12+(h*0.88)*u);
    g.stroke();
  }
}

/* 배 한 척. (0,0)이 물에 닿는 배 한가운데. dir=1이면 오른쪽을 본다 */
function drawShipSide(g, type, L, o){
  o = o||{};
  const p = RIG[type] || RIG.caravel;
  const dir = o.dir===undefined?1:o.dir;
  const t = W.t, sail = o.sail===undefined?3:o.sail, furl = clamp(sail/3,0,1);
  const dmg = o.dmg===undefined?1:o.dmg;      /* 1=멀쩡 0=박살 */
  const half=L/2, h=L*p.h, d=L*p.d;
  g.save();
  g.scale(dir,1);

  /* 노 */
  if(p.oars){
    g.strokeStyle='#8a6a3c'; g.lineWidth=Math.max(1.5,L*0.008);
    for(let i=0;i<p.oars;i++){
      const x = -half + L*0.12 + i*(L*0.76/p.oars);
      const ph = Math.sin(t*3 - i*0.25)*0.5+0.5;
      g.beginPath(); g.moveTo(x, -h*0.4);
      g.lineTo(x - L*0.06 - ph*L*0.03, d + L*0.06 + ph*L*0.02);
      g.stroke();
    }
  }

  /* 선체 */
  hullPath(g,L,p);
  const gr=g.createLinearGradient(0,-h*1.6,0,d);
  gr.addColorStop(0, p.wood); gr.addColorStop(0.62, p.wood);
  gr.addColorStop(0.63,'#8d2f26'); gr.addColorStop(1,'#5d2019');
  g.fillStyle=gr; g.fill();
  g.strokeStyle='#3a2716'; g.lineWidth=Math.max(1,L*0.006); g.stroke();

  /* 판자 줄 */
  g.save(); hullPath(g,L,p); g.clip();
  g.strokeStyle='rgba(50,32,16,.35)'; g.lineWidth=1;
  for(let y=-h*1.5;y<d;y+=Math.max(3,L*0.022)){
    g.beginPath(); g.moveTo(-half-2,y); g.lineTo(half+L*0.2,y); g.stroke();
  }
  /* 위쪽 띠(장식) */
  g.fillStyle=p.trim; g.fillRect(-half-2,-h-L*0.03,L+L*0.3,Math.max(2,L*0.02));
  /* 대포 구멍 */
  if(p.ports){
    const gy=-h+L*0.045;
    for(let i=0;i<p.ports;i++){
      const x=-half+L*0.16+i*(L*0.68/p.ports);
      g.fillStyle='#20150c'; g.fillRect(x-L*0.018,gy-L*0.018,L*0.036,L*0.036);
      g.fillStyle=p.trim; g.fillRect(x-L*0.022,gy-L*0.022,L*0.044,L*0.005);
      if(o.fire && i%2===0){ g.fillStyle='#1a120a'; g.fillRect(x-L*0.01,gy-L*0.006,L*0.05,L*0.012); }
    }
    if(p.ports2){
      const gy2=gy-L*0.055;
      for(let i=0;i<p.ports-2;i++){
        const x=-half+L*0.2+i*(L*0.62/(p.ports-2));
        g.fillStyle='#20150c'; g.fillRect(x-L*0.016,gy2-L*0.016,L*0.032,L*0.032);
      }
    }
  }
  /* 선미 창문 */
  g.fillStyle='rgba(255,220,150,'+(isNight()?0.9:0.35)+')';
  for(let i=0;i<3;i++) g.fillRect(-half+L*0.02+i*L*0.035, -h-L*p.sh*0.6, L*0.024, L*0.03);
  g.restore();

  /* 부서진 자국 */
  if(dmg<0.99){
    g.fillStyle='#1a1008';
    const n=R((1-dmg)*7);
    for(let i=0;i<n;i++){
      const x=-half+L*0.15+((i*7919)%100)/100*L*0.7, y=-h+L*0.02+((i*104729)%100)/100*L*0.06;
      g.beginPath(); g.ellipse(x,y,L*0.02,L*0.016,0,0,7); g.fill();
    }
  }

  /* 난간 */
  g.strokeStyle=p.trim; g.lineWidth=Math.max(1,L*0.006);
  g.beginPath(); g.moveTo(-half+L*p.sl,-h-L*0.045); g.lineTo(half-L*p.fl,-h-L*0.045); g.stroke();

  /* 거북선 지붕 */
  if(p.turtle){
    g.fillStyle='#4b5b46';
    g.beginPath();
    g.moveTo(-half+L*0.06,-h);
    g.quadraticCurveTo(0,-h-L*0.20, half-L*0.08,-h);
    g.closePath(); g.fill();
    g.strokeStyle='#2c3a2a'; g.lineWidth=1.2; g.stroke();
    g.strokeStyle='#8f9a86';
    for(let i=0;i<14;i++){ /* 쇠못 */
      const u=i/13, x=-half+L*0.08+u*(L*0.82);
      const y=-h-Math.sin(u*Math.PI)*L*0.17;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-L*0.022); g.stroke();
    }
    /* 용머리 */
    g.fillStyle='#7a3b2a';
    g.beginPath();
    g.moveTo(half-L*0.06,-h+L*0.01);
    g.lineTo(half+L*0.10,-h-L*0.03);
    g.lineTo(half+L*0.16,-h+L*0.02);
    g.lineTo(half+L*0.08,-h+L*0.05);
    g.closePath(); g.fill();
    g.fillStyle='#f0d24a'; g.beginPath(); g.arc(half+L*0.09,-h-L*0.005,L*0.012,0,7); g.fill();
    if(o.fire!==undefined && o.smoke){
      g.fillStyle='rgba(220,220,220,.5)';
      g.beginPath(); g.arc(half+L*0.19,-h+L*0.0,L*0.04,0,7); g.fill();
    }
  }
  /* 판옥선 위층 */
  if(p.panok){
    g.fillStyle=p.wood; g.fillRect(-half+L*0.1,-h-L*0.09,L*0.8,L*0.09);
    g.strokeStyle='#2f6b4f'; g.lineWidth=Math.max(1,L*0.007);
    for(let i=0;i<10;i++){
      const x=-half+L*0.12+i*L*0.078;
      g.beginPath(); g.moveTo(x,-h-L*0.09); g.lineTo(x,-h-L*0.135); g.stroke();
    }
    g.beginPath(); g.moveTo(-half+L*0.1,-h-L*0.135); g.lineTo(half-L*0.1,-h-L*0.135); g.stroke();
  }
  /* 갤리 충각 */
  if(type==='galley'||type==='galleass'){
    g.fillStyle='#6a4c2c';
    g.beginPath(); g.moveTo(half-L*0.02,-h*0.2); g.lineTo(half+L*0.2,-h*0.05); g.lineTo(half-L*0.02,L*0.01); g.closePath(); g.fill();
  }

  /* 제1사장(뱃머리 앞으로 뻗은 기둥) */
  if(p.sprit>0){
    g.strokeStyle='#5a3f22'; g.lineWidth=Math.max(1.6,L*0.012);
    g.beginPath(); g.moveTo(half-L*0.1,-h-L*p.fh*0.4);
    g.lineTo(half+L*0.28*p.sprit, -h-L*0.16*p.sprit); g.stroke();
  }

  /* 돛대 */
  const deckY = -h;
  for(const m of p.masts){
    const mx=m[0]*L, mh=m[1]*L, kind=m[2];
    g.strokeStyle='#5a3f22'; g.lineWidth=Math.max(1.8,L*0.014);
    g.beginPath(); g.moveTo(mx, deckY+L*0.02); g.lineTo(mx, deckY-mh); g.stroke();
    /* 밧줄 */
    g.strokeStyle='rgba(60,44,26,.55)'; g.lineWidth=1;
    for(const s of [-1,1]){
      g.beginPath(); g.moveTo(mx, deckY-mh*0.86); g.lineTo(mx+s*L*0.14, deckY-L*0.01); g.stroke();
      g.beginPath(); g.moveTo(mx, deckY-mh*0.55); g.lineTo(mx+s*L*0.10, deckY-L*0.01); g.stroke();
    }
    if(kind==='lat') drawLatSail(g,mx,deckY,mh,furl,t,1);
    else if(kind==='jk') drawJunkSail(g,mx,deckY,mh,furl,t,1);
    else if(kind==='kr'){
      drawSqSail(g,mx,deckY-mh*0.92, L*0.40, mh*0.72, furl, t,1);
    }else{
      const n = kind==='sq3'?3:2;
      const spans=[0.46,0.34,0.24], hs=[0.34,0.26,0.18];
      for(let i=0;i<n;i++){
        const top = deckY-mh*(0.95-i*0.34);
        drawSqSail(g, mx, top, L*spans[i], mh*hs[i], furl, t, 1);
      }
    }
    /* 까마귀둥지 */
    if(kind!=='jk' && mh>L*0.7){
      g.fillStyle='#6b4a28';
      g.fillRect(mx-L*0.022, deckY-mh*0.70, L*0.044, L*0.026);
    }
  }

  /* 깃발 */
  const topM = p.masts.length? p.masts.reduce((a,b)=>b[1]>a[1]?b:a) : null;
  if(topM) drawFlag(g, topM[0]*L+1, deckY-topM[1]*L, L*0.12, L*0.05, o.flag||'#d33', t, 1);
  g.fillStyle='#3a2716';
  g.fillRect(-half+L*0.02, -h-L*p.sh-L*0.22, Math.max(1.5,L*0.008), L*0.22);
  drawFlag(g, -half+L*0.02, -h-L*p.sh-L*0.22, L*0.14, L*0.06, o.flag||'#d33', t*0.9, 1);

  /* 선원들 */
  if(o.crew){
    const tired = o.tired||0;
    const deckTop = deckY - L*0.005;
    const n = clamp(o.crew,1,7);
    for(let i=0;i<n;i++){
      const base = -half+L*0.18 + i*(L*0.62/n);
      const walk = Math.sin(t*0.8+i*2.1)*L*0.05;
      const sit = tired>60 && i%2===0;
      drawPerson(g, base+(sit?0:walk), deckTop, L*0.055, ['#c8b89a','#8fa8c0','#c4907a','#9fb08a'][i%4], t+i, sit);
    }
    /* 선미루 위 조타 */
    drawPerson(g, -half+L*p.sl*0.5, -h-L*p.sh-L*0.002, L*0.055, '#e0d2b0', t*0.4, false);
  }
  g.restore();
}

/* =====================================================================

function drawPerson(g,x,y,s,col,t,sit){
  g.save(); g.translate(x,y);
  const sw = sit?0:Math.sin(t*3)*0.5;
  g.fillStyle=col;
  if(sit){
    g.fillRect(-s*0.28,-s*0.85,s*0.56,s*0.6);
    g.fillRect(0,-s*0.3,s*0.55,s*0.22);
  }else{
    g.fillRect(-s*0.25,-s*1.15,s*0.5,s*0.72);
    g.strokeStyle=col; g.lineWidth=Math.max(1,s*0.16);
    g.beginPath(); g.moveTo(0,-s*0.45); g.lineTo(sw*s*0.4,0); g.moveTo(0,-s*0.45); g.lineTo(-sw*s*0.4,0); g.stroke();
  }
  g.fillStyle='#e8c9a0'; g.beginPath(); g.arc(0,-s*(sit?1.02:1.32),s*0.22,0,7); g.fill();
  g.fillStyle='#5a4a34'; g.beginPath(); g.arc(0,-s*(sit?1.10:1.40),s*0.24,Math.PI,0); g.fill();
  g.restore();
}

}

    g.fillStyle='#dfe6ea';
    g.beginPath(); g.moveTo(66*s,12*s); g.quadraticCurveTo(0,26*s,-38*s,12*s); g.quadraticCurveTo(0,15*s,66*s,12*s); g.fill();
    /* 점무늬 */
    g.fillStyle='#eef3f6';
    for(let i=0;i<26;i++){

    }

    g.beginPath(); g.moveTo(0,-16*s); g.lineTo(-14*s,-36*s); g.lineTo(-18*s,-13*s); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(22*s,12*s); g.lineTo(4*s,32*s); g.lineTo(28*s,16*s); g.closePath(); g.fill();
    finTail(g,-40*s,1*s,22*s,20*s,c);
    g.fillStyle='#20303a'; g.fillRect(60*s,-2*s,14*s,5*s);
    g.fillStyle='#0b1218'; g.beginPath(); g.arc(58*s,-6*s,2.2*s,0,7); g.fill();
  },
  squid(g,s,t){
    const c='#8e3f4e';
    g.fillStyle=c;
    g.beginPath();
    g.moveTo(-56*s,0); g.quadraticCurveTo(-20*s,-16*s,14*s,-9*s);
    g.quadraticCurveTo(24*s,0,14*s,9*s); g.quadraticCurveTo(-20*s,16*s,-56*s,0); g.closePath(); g.fill();
    g.fillStyle='#a85566';
    g.beginPath(); g.moveTo(-40*s,-8*s); g.quadraticCurveTo(-52*s,-22*s,-62*s,-6*s); g.quadraticCurveTo(-50*s,-4*s,-40*s,-8*s); g.fill();
    g.beginPath(); g.moveTo(-40*s,8*s); g.quadraticCurveTo(-52*s,22*s,-62*s,6*s); g.quadraticCurveTo(-50*s,4*s,-40*s,8*s); g.fill();
    g.strokeStyle=c; g.lineCap='round';
    for(let i=0;i<8;i++){
      const a=(i-3.5)*0.18, len=(i%2?48:34)*s;
      g.lineWidth=(3.4-Math.abs(i-3.5)*0.3)*s;
      g.beginPath(); g.moveTo(14*s,a*22*s);
      g.quadraticCurveTo(30*s+len*0.4, a*40*s+Math.sin(t*2+i)*8*s, 20*s+len, a*46*s+Math.sin(t*2+i)*16*s);
      g.stroke();
    }
    g.lineWidth=2.6*s;
    for(const d of [-1,1]){
      g.beginPath(); g.moveTo(14*s,d*4*s);
      g.quadraticCurveTo(56*s, d*10*s+Math.sin(t*1.6)*10*s, 84*s, d*20*s+Math.sin(t*1.6)*18*s);
      g.stroke();

      g.ellipse(84*s, d*20*s+Math.sin(t*1.6)*18*s, 5*s,3*s,0,0,7); g.fill();
    }
    g.lineCap='butt';
    g.fillStyle='#f0e6c8'; g.beginPath(); g.arc(4*s,-3*s,6.5*s,0,7); g.fill();
    g.fillStyle='#101018'; g.beginPath(); g.arc(5*s,-3*s,3.4*s,0,7); g.fill();

  dugong(g,s,t){

    g.fillStyle=c;

    g.quadraticCurveTo(-4*s,2*s,-34*s,9*s); g.quadraticCurveTo(6*s,20*s,40*s,4*s); g.closePath(); g.fill();
    g.fillStyle='#9aa6a2';
    g.beginPath(); g.ellipse(38*s,0,11*s,9*s,0,0,7); g.fill();
    g.fillStyle='#6c7874';
    g.beginPath(); g.ellipse(43*s,3*s,6*s,4*s,0,0,7); g.fill();
    g.fillStyle=c; g.save(); g.translate(14*s,10*s); g.rotate(Math.sin(t*1.6)*0.3);
    g.beginPath(); g.ellipse(0,5*s,11*s,4*s,0.3,0,7); g.fill(); g.restore();
    finTail(g,-30*s,1*s,16*s,9*s,c);
    g.fillStyle='#0b1218'; g.beginPath(); g.arc(40*s,-4*s,1.9*s,0,7); g.fill();
  },
};

function drawPortScene(g){
  const y0 = Ht*0.50, U = Ht/180;            /* U = 도트 한 칸 기준 크기 */
  drawSky(g, y0, false);
  /* 뒷산 */
  const d=dayAmt();
  g.fillStyle=rgb(mix([26,34,44],[86,104,86],d));
  g.beginPath(); g.moveTo(0,y0);
  for(let x=0;x<=Wd;x+=Wd*0.03){
    g.lineTo(x, y0-Ht*0.20-Math.sin(x/Wd*7+2)*Ht*0.07-Math.sin(x/Wd*17)*Ht*0.04);
  }
  g.lineTo(Wd,y0); g.closePath(); g.fill();

  const port = P(S.at);
  const reg = port.reg;
  /* 마을 */
  const wall = rgb(mix([60,60,66],{eu:[236,228,208],af:[214,178,126],in:[228,208,176],ea:[226,220,206],am:[236,224,198]}[reg]||[230,220,200], d*0.9+0.1));
  const roof = {eu:'#a8452f', af:'#8a6a3a', in:'#8a5a3a', ea:'#3f5d6b', am:'#a8452f'}[reg]||'#a8452f';
  const N=9;
  for(let i=0;i<N;i++){
    const hs={ x: Wd*0.02 + i*(Wd*0.96/N) + ((i*37)%7)*U*0.4,
               w: Wd*0.072 + ((i*29)%5)*U*1.2,
               h: Ht*0.09 + ((i*53)%6)*U*1.6 };
    const by = y0-U;
    g.fillStyle=wall; g.fillRect(hs.x, by-hs.h, hs.w, hs.h);
    g.fillStyle=roof;
    if(reg==='ea'){ /* 기와지붕 — 처마가 위로 들린다 */
      g.beginPath();
      g.moveTo(hs.x-U*1.6, by-hs.h);
      g.quadraticCurveTo(hs.x+hs.w/2, by-hs.h-U*4, hs.x+hs.w+U*1.6, by-hs.h);
      g.lineTo(hs.x+hs.w+U*0.6, by-hs.h+U*1.2); g.lineTo(hs.x-U*0.6, by-hs.h+U*1.2);
      g.closePath(); g.fill();
    }else{
      g.beginPath();
      g.moveTo(hs.x-U, by-hs.h); g.lineTo(hs.x+hs.w/2, by-hs.h-U*3.4); g.lineTo(hs.x+hs.w+U, by-hs.h);
      g.closePath(); g.fill();
    }
    g.fillStyle= isNight()? 'rgba(255,206,120,.95)':'rgba(60,50,40,.55)';
    for(let r=0;r<2;r++) for(let c=0;c<2;c++){
      if((i+r*3+c)%3===0 && r===1) continue;
      g.fillRect(hs.x+U*1.4+c*(hs.w-U*4), by-hs.h+U*2.4+r*U*4, U*2, U*2.4);
    }
  }
  /* 등대 */
  const lx=Wd-U*14, lw=U*4.6, lh=Ht*0.26;
  g.fillStyle='#efe6d2'; g.fillRect(lx, y0-lh, lw, lh-U);
  g.fillStyle='#c0432f'; g.fillRect(lx, y0-lh*0.72, lw, U*1.8); g.fillRect(lx, y0-lh*0.38, lw, U*1.8);
  g.fillStyle= isNight()?'#ffe08a':'#8fa3b0'; g.fillRect(lx-U*0.6, y0-lh-U*2.6, lw+U*1.2, U*2.6);
  if(isNight()){
    g.save(); g.globalAlpha=0.16; g.fillStyle='#ffe08a';
    g.beginPath(); g.moveTo(lx+lw/2,y0-lh-U); g.lineTo(0,y0-lh*1.5); g.lineTo(0,y0-lh*0.2); g.closePath(); g.fill();
    g.restore();
  }
  /* 바다 */
  const surf=mix([16,34,58],[40,110,150],d);
  g.fillStyle=rgb(surf); g.fillRect(0,y0,Wd,Ht-y0);
  g.strokeStyle=rgba(mix([120,150,180],[200,235,255],d),.35); g.lineWidth=Math.max(1,U*0.3);
  for(let k=0;k<7;k++){
    const off=y0+U*2.4+k*U*3.6;
    g.beginPath();
    for(let x=0;x<=Wd;x+=Wd*0.01){ const yy=off+Math.sin(x*0.03+W.t*1.6+k)*U*0.5; x?g.lineTo(x,yy):g.moveTo(x,yy); }
    g.stroke();
  }
  /* 부두 */
  const pierY=y0+Ht*0.10;
  g.fillStyle='#6b4f30'; g.fillRect(0,pierY,Wd*0.42,U*2.6);
  g.fillStyle='#553f26';
  for(let i=0;i<8;i++) g.fillRect(i*Wd*0.052+U, pierY+U*2.6, U*1.6, Ht*0.09);
  /* 내 배 */
  const L=Wd*0.34*(spec().len/34);
  g.save();
  g.translate(Wd*0.66, pierY+U*1.6+Math.sin(W.t*1.1)*U*0.4);
  g.rotate(Math.sin(W.t*0.8)*0.012);
  drawShipSide(g, S.ship, L, {dir:-1, sail:0, crew:3, tired:S.fat, flag:flagColor(), dmg:S.hull/100});
  g.restore();
  /* 부두 사람들 */
  for(let i=0;i<6;i++){
    drawPerson(g, Wd*0.03+i*Wd*0.062+Math.sin(W.t*0.5+i)*U*2, pierY, U*3.4,
      ['#c8b89a','#8fa8c0','#c4907a','#9fb08a','#d8c8a8'][i%5], W.t+i*3, false);
  }
  /* 갈매기 */
  g.strokeStyle=isNight()?'#556':'#f2f2f2'; g.lineWidth=Math.max(1,U*0.3);
  for(let i=0;i<5;i++){
    const gx=((W.t*Wd*0.02+i*Wd*0.23)%(Wd+Wd*0.2))-Wd*0.1, gy=Ht*0.14+Math.sin(W.t*0.7+i)*Ht*0.03;
    const f=Math.sin(W.t*5+i)*U;
    g.beginPath(); g.moveTo(gx-U*1.6,gy+f); g.quadraticCurveTo(gx,gy-U*0.5,gx+U*1.6,gy+f); g.stroke();
  }
}

const LAND = [
  /* 유럽·아프리카·아시아 */
  [[-6,36],[-9,39],[-1,46],[4,52],[8,56],[5,58],[10,64],[20,70],[30,70],[60,72],[100,76],[140,72],
   [160,60],[140,45],[128,38],[120,30],[108,20],[105,10],[100,3],[95,16],[85,20],[80,10],[77,8],

   [9,4],[-5,5],[-17,15],[-10,30]],
  /* 아메리카 */
  [[-165,60],[-130,55],[-125,45],[-118,33],[-105,22],[-95,18],[-88,20],[-83,10],[-77,5],[-81,-5],
   [-71,-18],[-73,-40],[-75,-53],[-65,-40],[-58,-35],[-48,-25],[-35,-8],[-50,0],[-60,8],[-75,10],
   [-83,9],[-90,15],[-97,20],[-92,29],[-81,25],[-75,35],[-70,44],[-55,50],[-65,60],[-80,70],
   [-120,70],[-160,68]],
  /* 오스트레일리아 */
  [[113,-22],[129,-12],[142,-11],[153,-27],[147,-38],[130,-32],[115,-34]],
  /* 영국 */

  [[-45,60],[-20,70],[-25,82],[-60,80],[-55,68]],
];
function drawMapInto(g, w, h, hover){
  const sx=w/1000, sy=h/600;
  const MX = lon => mapX(lon)*sx, MY = lat => mapY(lat)*sy;
  g.clearRect(0,0,w,h);
  /* 양피지 */
  g.fillStyle='#e8d7ae'; g.fillRect(0,0,w,h);
  g.fillStyle='rgba(190,160,110,.35)';
  for(let i=0;i<60;i++){
    const x=(i*7919)%w, y=(i*104729)%h;
    g.beginPath(); g.arc(x,y,((i*13)%9)+2,0,7); g.fill();
  }
  /* 위도선 */
  g.strokeStyle='rgba(140,110,70,.35)'; g.lineWidth=1;
  for(let lat=-60;lat<=75;lat+=15){
    g.beginPath(); g.moveTo(0,MY(lat)); g.lineTo(w,MY(lat)); g.stroke();
  }
  for(let lon=-180;lon<=180;lon+=30){
    g.beginPath(); g.moveTo(MX(lon),0); g.lineTo(MX(lon),h); g.stroke();
  }
  g.strokeStyle='rgba(150,60,40,.5)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,MY(0)); g.lineTo(w,MY(0)); g.stroke();

  /* 땅 */
  for(const poly of LAND){
    g.beginPath();
    poly.forEach((p,i)=> i? g.lineTo(MX(p[0]),MY(p[1])) : g.moveTo(MX(p[0]),MY(p[1])));
    g.closePath();
    g.fillStyle='#c9b184'; g.fill();
    g.strokeStyle='#7a5c33'; g.lineWidth=1.6; g.stroke();
  }
  /* 항로 */
  for(const [a,b] of LINKS){
    const A=P(a),B=P(b);
    const near = (a===S.at||b===S.at);
    g.strokeStyle= near? 'rgba(40,80,140,.85)':'rgba(90,70,45,.35)';
    g.lineWidth= near?2.2:1.2;
    g.setLineDash(near?[]:[5,5]);
    g.beginPath(); g.moveTo(MX(A.lon),MY(A.lat)); g.lineTo(MX(B.lon),MY(B.lat)); g.stroke();
  }
  g.setLineDash([]);
  /* 항구 */
  const conn = neighbors(S.at);
  for(const p of PORTS){
    const x=MX(p.lon), y=MY(p.lat);
    const here = p.id===S.at, can = conn.includes(p.id);
    g.beginPath(); g.arc(x,y, here?7:(can?6:4), 0,7);
    g.fillStyle = here? '#c03a2a' : (can? '#2a5a9a' : '#7a6a50');
    g.fill();
    if(hover===p.id){ g.strokeStyle='#c03a2a'; g.lineWidth=2.5; g.beginPath(); g.arc(x,y,11,0,7); g.stroke(); }
    g.fillStyle='#4a3722'; g.font=(here?'bold ':'')+'12px "Malgun Gothic"'; g.textAlign='center';
    g.fillText(p.n, x, y-10);
  }
  g.textAlign='left';
  /* 나침반 */
  const cx=w*0.085, cy=h*0.80, r=Math.min(w,h)*0.07;
  g.strokeStyle='#8a6a3c'; g.lineWidth=1.6;
  g.beginPath(); g.arc(cx,cy,r,0,7); g.stroke();
  g.beginPath(); g.arc(cx,cy,r*0.72,0,7); g.stroke();
  g.fillStyle='#a8452f'; g.beginPath();
  g.moveTo(cx,cy-r); g.lineTo(cx+r*0.22,cy); g.lineTo(cx,cy+r); g.lineTo(cx-r*0.22,cy); g.closePath(); g.fill();
  g.fillStyle='#4a3722'; g.font='bold 11px serif'; g.textAlign='center';
  g.fillText('N',cx,cy-r-4); g.textAlign='left';
  /* 바다 괴물 낙서 */
  g.save(); g.translate(w*0.30,h*0.86); g.scale(Math.min(w,h)*0.0016,Math.min(w,h)*0.0016);
  g.globalAlpha=.45; CDRAW.squid(g,0.7,W.t); g.restore(); g.globalAlpha=1;
  g.fillStyle='rgba(90,70,45,.6)'; g.font='italic 13px serif';
  g.fillText('여기서부터는 아무도 모르는 바다', w*0.22, h*0.94);

  /* 내 배 위치 */
  if(S.scene==='sail' && S.to){
    const A=P(S.at), B=P(S.to), u=S.dist? clamp(S.prog/S.dist,0,1):0;
    const x=MX(A.lon)+(MX(B.lon)-MX(A.lon))*u, y=MY(A.lat)+(MY(B.lat)-MY(A.lat))*u;
    g.strokeStyle='#c03a2a'; g.lineWidth=2.4; g.setLineDash([6,4]);
    g.beginPath(); g.moveTo(MX(A.lon),MY(A.lat)); g.lineTo(x,y); g.stroke(); g.setLineDash([]);
    g.save(); g.translate(x,y-4); g.scale(0.16,0.16);
    drawShipSide(g, S.ship, 180, {dir: (MX(B.lon)>=MX(A.lon))?1:-1, sail:S.sail, flag:flagColor()});
    g.restore();
  }
  return {MX, MY};
}


/* =====================================================================
   4. 게임 진행 (항해·사건·전투·항구)
   ===================================================================== */
/* 바다 위에서 지금 벌어지는 일들 */
const W = {
  t:0, rough:1, wind:1, windDir:0.7, storm:0, calm:0, rain:0, flash:0,
  creature:null, foe:null, scope:null, battle:null, eventCd:6, arrivedMsg:0,
};

/* ── 배 성능 ── */
function fatSpd(){ return 1 - S.fat/230; }                    /* 지친 선원 = 느린 배 */
function scurvySpd(){ return 1 - Math.min(S.scurvy,100)/300; }
function myKnots(){
  const sp=spec();
  let sailF = [0,0.35,0.72,1][clamp(S.sail,0,3)];
  let k = sp.kn * (0.35 + W.wind*0.75) * sailF;
  if(sp.crew && RIG[S.ship].oars) k += (W.wind<0.4? sp.kn*0.45 : sp.kn*0.12);  /* 노 젓는 배는 무풍에도 간다 */
  k *= fatSpd()*scurvySpd()*(0.6+0.4*(S.hull/100));
  if(S.food<=0) k*=0.75;
  return Math.max(0.6,k);
}
const kmh = kn => kn*1.852;

/* ── 항해 시작 ── */
function startSail(toId){
  S.to=toId; S.dist=legDist(S.at,toId); S.prog=0; S.scene='sail'; S.sail=2;
  W.creature=null; W.foe=null; W.scope=null; W.battle=null; W.storm=0; W.calm=0;
  W.eventCd=rnd(3,7); W.wind=rnd(.6,1.1);
  closeModal();
  toast(P(toId).n+'(으)로 출항! 약 '+R(S.dist)+'km', 'good');
  renderButtons();
}
function arrive(){
  S.at=S.to; S.to=null; S.scene='port'; S.prog=0;
  W.creature=null; W.foe=null; W.battle=null; W.scope=null; W.storm=0;
  toast(P(S.at).n+'에 닿았다! 닻을 내려라. 수고했다 — 쉬고 싶으면 식당이나 여관으로 가라.', 'good');
  autosave(); renderButtons();
}

/* ── 시간 흐르기 ── */
function passHours(gh){
  S.hour += gh;
  while(S.hour>=24){ S.hour-=24; S.day++; newDay(); }
}
function newDay(){
  const eat = clamp(S.crew/16, .5, 4);
  S.food -= eat; S.water -= eat;
  if(S.fruit>0){ S.fruit-=0.6; S.noFruit=0; S.scurvy=Math.max(0,S.scurvy-6); }
  else S.noFruit++;
  if(S.noFruit>10) S.scurvy=Math.min(100, S.scurvy + 3);
  if(S.food<0){ S.food=0; S.fat=Math.min(100,S.fat+9); toast('식량이 떨어졌다! 선원들이 굶는다','bad'); }
  if(S.water<0){ S.water=0; S.fat=Math.min(100,S.fat+12); toast('물이 떨어졌다! 아주 위험하다','bad'); }
  if(S.scurvy>50 && Math.random()<0.3) toast('괴혈병이다. 과일을 먹여야 한다','bad');
  autosave();
}

/* ── 항해 한 틀 ── */
function sailStep(dt){
  const busy = W.creature||W.foe||W.battle||W.scope;
  const warp = busy? 1 : S.warp;
  const gh = dt*1.7*warp;                    /* 실제 1초 = 게임 1.7시간(배속 곱하기) */
  passHours(gh);

  /* 바람 */
  W.windDir += dt*0.12*Math.sin(W.t*0.17);
  W.wind += (rnd(-1,1))*dt*0.25;
  if(W.storm>0) W.wind = clamp(W.wind,1.3,1.8);
  else if(W.calm>0) W.wind = clamp(W.wind,0.05,0.25);
  else W.wind = clamp(W.wind, .45, 1.25);
  W.rough += ((W.storm>0?3.4:(W.calm>0?0.25:1)) - W.rough)*dt*0.7;
  if(W.storm>0){ W.storm-=dt; if(W.storm<=0){ toast('폭풍이 지나갔다','good'); W.rain=0; } W.rain=1; }
  if(W.calm>0){ W.calm-=dt; if(W.calm<=0) toast('바람이 다시 분다','good'); }
  if(W.flash>0) W.flash-=dt*2;

  /* 나아가기 */
  S.prog += kmh(myKnots())*gh;

  /* 피로 */
  let f = 0.11 + S.sail*0.045;
  if(W.storm>0) f += 0.5;
  if(isNight()) f += 0.05;
  if(RIG[S.ship].oars && W.wind<0.4) f += 0.25;      /* 노를 저으면 훨씬 힘들다 */
  if(S.food<=0||S.water<=0) f += 0.4;
  S.fat = clamp(S.fat + f*gh, 0, 100);

  /* 폭풍에 돛을 다 펴면 배가 상한다 */
  if(W.storm>0 && S.sail>=3){
    S.hull -= dt*7;
    if(Math.random()<dt*0.6) toast('돛을 줄여! 배가 부서진다','bad');
    if(S.hull<=0) sinkShip('폭풍에 배가 부서졌다');
  }
  if(W.storm>0 && Math.random()<dt*0.25) W.flash=1;

  /* 사건 */
  W.eventCd -= gh;
  if(W.eventCd<=0 && !W.creature && !W.foe && !W.battle){ W.eventCd = rnd(4,10); rollEvent(); }

  /* 생물 움직이기 */
  const c=W.creature;
  if(c){
    c.t += dt; c.x += c.vx*dt;
    if(c.t>c.life || c.x<-0.25 || c.x>1.25){
      if(!c.done) toast(BI(c.id).n+'이(가) 사라졌다...', 'bad');
      W.creature=null;
    }
  }
  /* 다른 배 */
  const fo=W.foe;
  if(fo){
    fo.t += dt;
    if(fo.hostile){
      const run = (S.sail>=3 && myKnots() > fo.kn*0.95);
      fo.close += dt*(run? -0.10 : 0.10);
      if(fo.close<=0){ toast('따돌렸다! 해적선이 멀어진다','good'); W.foe=null; }
      else if(fo.close>=1){ startBattle(fo); }
    }else{
      fo.close += dt*0.03;
      if(fo.t>26){ W.foe=null; }
    }
  }
  if(S.prog>=S.dist) arrive();
}

/* ── 사건 뽑기 ── */
function rollEvent(){
  const r=Math.random();
  if(r<0.50) spawnCreature();
  else if(r<0.78) spawnShip();
  else if(r<0.92){ W.storm=rnd(16,30); W.flash=1; toast('폭풍이다! 돛을 줄여라, 어서! (←)','bad'); }
  else { W.calm=rnd(10,18); toast('바람이 죽었군... 무풍지대다. 노가 있는 배라면 저어야 한다.','bad'); }
}
function zoneNow(){
  const A=P(S.at), B=S.to?P(S.to):A, u=S.dist?clamp(S.prog/S.dist,0,1):0;
  const lat = A.lat + (B.lat-A.lat)*u;
  const far = S.dist>4000;
  if(Math.abs(lat)>34) return far?['cold','deep','any']:['cold','any'];
  return far?['warm','deep','any']:['warm','any'];
}
function spawnCreature(){
  const zs=zoneNow();
  const pool=[];
  for(const b of BIO){
    if(!zs.includes(b.zone)) continue;
    const w = [0,26,15,7,3,1][b.rare];
    for(let i=0;i<w;i++) pool.push(b.id);
  }
  if(!pool.length) return;
  const id=pick(pool), b=BI(id);
  const air = (id==='albatross');
  const jumpers = ['dolphin','flyfish','manta','orca','humpback'];
  const surfacer = ['sperm','whaleshark','turtle','sunfish','dugong','penguin','seal','jelly'];
  W.creature = {
    id, t:0, life:rnd(15,24), done:false,
    x: Math.random()<0.5?-0.12:1.12,
    vx: 0, depth: air? -0.10 : (id==='squid'? 0.30 : rnd(0.06,0.20)),
    mode: air?'fly':(jumpers.includes(id)?'jump':(surfacer.includes(id)?'surface':'swim')),
    dz: rnd(0.45,0.86),
  };
  W.creature.vx = (W.creature.x<0?1:-1) * rnd(0.030,0.055);
  W.creature.dir = W.creature.vx>0?1:-1;
  toast('물속에 뭔가 보입니다! 스페이스를 눌러 망원경으로 보세요!', 'dex', 'lookout');
}
function spawnShip(){
  const zs = P(S.to||S.at).reg;
  let pool = SHIPS.filter(s=>s.buy.includes(zs) || Math.random()<0.25);
  if(!pool.length) pool=SHIPS;
  const s = pick(pool);
  const hostile = Math.random() < 0.42;
  W.foe = {type:s.id, t:0, close:0.15, hostile, kn:s.kn, observed:false};
  toast((hostile?'해적기입니다! 배가 다가옵니다!':'앞쪽에 다른 배가 보입니다!') +
        ' 스페이스로 망원경'+(hostile?', C를 누르면 먼저 공격합니다':''), hostile?'bad':'dex', 'lookout');
}

/* ── 망원경으로 관찰 ── */
function tryScope(){
  if(W.scope) return;
  if(W.creature && !W.creature.done){
    W.scope = {kind:'bio', id:W.creature.id, t:0, ok:false};
  }else if(W.foe && !W.foe.observed){
    W.scope = {kind:'ship', id:W.foe.type, t:0, ok:false};
  }else if(W.battle && !W.battle.observed){
    W.scope = {kind:'ship', id:W.battle.type, t:0, ok:false};
  }else{
    toast('지금은 볼 게 없다','');
  }
}
function scopeStep(dt){
  const s=W.scope; if(!s) return;
  s.t += dt;
  if(s.t>0.85 && !s.ok){
    s.ok=true;
    const fail = Math.random() < S.fat/260;      /* 너무 지치면 손이 떨려 놓치기도 한다 */
    if(fail){ toast('손이 떨려서 놓쳤다... 좀 쉬어야겠다','bad'); }
    else{
      if(s.kind==='bio'){ if(W.creature) W.creature.done=true; dexAdd('bio', s.id); }
      else { if(W.foe) W.foe.observed=true; if(W.battle) W.battle.observed=true; dexAdd('ship', s.id); }
    }
  }
  if(s.t>2.2) W.scope=null;
}
function dexAdd(kind,id){
  const d = S.dex[kind];
  const obj = kind==='bio'? BI(id) : SH(id);
  if(d[id]){ d[id]++; toast(obj.n+' — 이미 도감에 있다 (본 횟수 '+d[id]+')',''); return false; }
  d[id]=1; S.seen++;
  const rare = kind==='bio'? obj.rare : Math.max(1,R(obj.price/2200)+1);
  const g = (30 + rare*45) * (perk('rafael')?2:1);
  S.gold += g;
  toast('도감에 새로 기록! ' + obj.n + '  (+'+g+'골드)', 'dex');
  autosave();
  return true;
}

/* ── 전투 ── */
function startBattle(fo){
  const sp=SH(fo.type);
  W.foe=null;
  W.battle = {
    type:fo.type, hull:sp.hull, hullMax:sp.hull, guns:sp.guns, crew:sp.crew,
    dist:78, myRe:0, eRe:2.4, shots:[], smoke:[], over:0, observed:!!fo.observed, boardT:0,
  };
  S.scene='battle'; S.fights++;
  toast('전투 시작! ←→ 거리, 스페이스 대포, B 백병전, R 도망','bad');
  renderButtons();
}
function battleStep(dt){
  const b=W.battle; if(!b) return;
  if(b.over){ b.over-=dt; if(b.over<=0) endBattle(); return; }
  b.myRe-=dt; b.eRe-=dt;
  if(b.boardT>0){ b.boardT-=dt; if(b.boardT<=0) resolveBoard(); return; }

  /* 적이 쏜다 */
  if(b.eRe<=0){
    b.eRe = rnd(2.6,4.4) + b.dist*0.02;
    const acc = clamp(1-b.dist/135,.15,.85);
    if(Math.random()<acc*0.9){
      const dmg = b.guns*rnd(0.5,1.0) * (perk('lihuamei')?0.6:1);
      S.hull -= dmg;
      b.shots.push({x0:0.72,x1:0.34,t:0,hit:true});
      if(S.hull<=0){ sinkShip('적의 대포에 배가 부서졌다'); return; }
    }else b.shots.push({x0:0.72,x1:0.34,t:0,hit:false});
    b.smoke.push({x:0.70,y:0,t:0});
  }
  /* 총알 날아가기 */
  for(const s of b.shots) s.t+=dt*1.8;
  b.shots = b.shots.filter(s=>s.t<1);
  for(const s of b.smoke) s.t+=dt;
  b.smoke = b.smoke.filter(s=>s.t<1.2);
  /* 시간 조금 흐름 */
  passHours(dt*0.35);
  S.fat = clamp(S.fat + dt*0.9, 0, 100);
}
function fireCannon(){
  const b=W.battle; if(!b||b.over||b.boardT>0) return;
  if(b.myRe>0){ return; }
  if(S.ball<=0){ toast('포탄이 없다! 도망치거나 붙어야 한다','bad'); return; }
  S.ball--;
  b.myRe = 2.6 + S.fat*0.02 - spec().guns*0.02;
  const acc = clamp(1-b.dist/135,.15,.9) * (1-S.fat/300) * (perk('alvezas')?1.25:1);
  b.smoke.push({x:0.36,y:0,t:0});
  if(Math.random()<acc){
    const dmg = spec().guns*rnd(0.9,1.6);
    b.hull -= dmg;
    b.shots.push({x0:0.36,x1:0.72,t:0,hit:true});
    if(b.hull<=0){ b.over=1.4; b.win=true; }
  }else b.shots.push({x0:0.36,x1:0.72,t:0,hit:false});
}
function tryBoard(){
  const b=W.battle; if(!b||b.over||b.boardT>0) return;
  if(b.dist>30){ toast('더 붙어야 한다 (→)','bad'); return; }
  b.boardT=1.6; toast('갈고리를 던져 적 배로 넘어간다!','bad');
}
function resolveBoard(){
  const b=W.battle;
  const mine = S.crew*(1-S.fat/160)*rnd(.8,1.3)*(perk('alvezas')?1.4:1);
  const his  = b.crew*(b.hull/b.hullMax)*rnd(.8,1.3);
  if(mine>his){
    b.hull=0; b.over=1.2; b.win=true;
    const lost=ri(0,Math.max(1,R(S.crew*0.12)));
    S.crew-=lost;
    if(lost) toast('백병전에서 이겼다! 선원 '+lost+'명을 잃었다','bad');
  }else{
    const lost=ri(1,Math.max(2,R(S.crew*0.25)));
    S.crew=Math.max(3,S.crew-lost);
    S.hull-=12; S.fat=clamp(S.fat+18,0,100);
    toast('밀렸다! 선원 '+lost+'명을 잃고 물러났다','bad');
    b.dist=60;
    if(S.hull<=0) sinkShip('백병전에서 배를 빼앗겼다');
  }
}
function tryFlee(){
  const b=W.battle; if(!b||b.over) return;
  if(b.dist<55){ toast('너무 가깝다! 더 벌려야 도망갈 수 있다 (←)','bad'); return; }
  const ok = myKnots() > SH(b.type).kn*rnd(.75,1.15);
  if(ok){ toast('도망쳤다! 무사히 벗어났다','good'); W.battle=null; S.scene='sail'; renderButtons(); }
  else{ toast('따라잡혔다! 다시 붙는다','bad'); b.dist=Math.max(20,b.dist-25); S.hull-=6; }
}
function endBattle(){
  const b=W.battle;
  if(b.win){
    const sp=SH(b.type);
    const gold = R((120 + sp.price*0.14 + sp.cargo*2 + Math.random()*180) * (perk('tial')?2:1));
    const ball = ri(4,14), food = ri(2,8);
    S.gold+=gold; S.ball+=ball; S.food+=food; S.sunk++;
    if(!S.dex.ship[b.type]) dexAdd('ship', b.type);
    toast('이겼다! 전리품 '+gold+'골드 · 포탄 '+ball+' · 식량 '+food,'good');
    S.fat=clamp(S.fat+10,0,100);
  }
  W.battle=null; S.scene='sail'; renderButtons(); autosave();
}
function sinkShip(why){
  const half=R(S.gold*0.4);
  S.gold-=half; S.cargo={}; S.hull=100; S.ship='caravel'; S.crew=12;
  S.fat=clamp(S.fat+30,0,100); S.ball=8; W.battle=null; W.foe=null;
  /* 가장 가까운 항구로 구명정을 저어 간다 */
  const home = S.to && Math.random()<0.5 ? S.to : S.at;
  S.at=home; S.to=null; S.scene='port'; S.prog=0;
  toast(why+'! 구명정으로 '+P(home).n+'까지 왔다. '+half+'골드를 잃고 낡은 카라벨을 얻었다','bad');
  renderButtons(); autosave();
}

/* =====================================================================
   화면 그리기 (장면별)
   ===================================================================== */
function drawSailScene(g){
  if(S.view==='side') drawSailSideScene(g);
  else drawSailDeckScene(g);
}

/* ── 갑판 시점(선원 시점) — 배 위에서 앞을 본다 ── */
const DECK = () => ({
  yBow: Ht*0.560, yStern: Ht*1.10,
  wBow: Wd*0.060, wStern: Wd*0.44,
});
function deckHalf(u){                       /* u=0 뱃머리, 1 발밑 */
  const D=DECK();
  return D.wBow + (D.wStern-D.wBow)*Math.pow(clamp(u,0,1),0.9);
}
function deckY(u){ const D=DECK(); return D.yBow + (D.yStern-D.yBow)*clamp(u,0,1); }

function drawSailDeckScene(g){
  const rough=W.rough;
  const roll  = Math.sin(W.t*0.75)*0.022*rough;
  const pitch = Math.sin(W.t*1.25)*Ht*0.016*rough;
  const hz = Ht*0.40 + pitch;
  W._cpos=null;
  /* 하늘·바다·바깥 세상은 배가 흔들리는 대로 기운다 */
  g.save();
  g.translate(Wd/2,hz); g.rotate(roll); g.scale(1.14,1.14); g.translate(-Wd/2,-hz);
  drawSky(g,hz,W.storm>0);
  if(W.flash>0){ g.fillStyle='rgba(255,255,255,'+(W.flash*0.5)+')'; g.fillRect(-Wd,0,Wd*3,hz); }
  drawSeaPersp(g,hz);
  drawWorldAhead(g,hz);
  g.restore();
  /* 내 배 */
  if(S.view==='deck') drawDeck(g); else drawShipStern(g);
  if(W.storm>0) drawRain(g);
  if(W.scope) drawScope(g, W._cpos);
}
function drawSeaPersp(g,hz){
  const d=dayAmt(), H=Ht-hz;
  const far  = mix([16,34,56],[52,122,158],d);
  const near = mix([6,18,32], [20,74,110],d);
  const gr=g.createLinearGradient(0,hz,0,Ht);
  gr.addColorStop(0,rgb(far)); gr.addColorStop(1,rgb(near));
  g.fillStyle=gr; g.fillRect(-Wd*0.3,hz,Wd*1.6,H+Ht*0.4);
  /* 해·달빛 길 */
  if(!W.storm){
    const bright = dayAmt()>0.1;
    const sx = bright? Wd*(0.1+((S.hour-5)/15)*0.8) : Wd*0.78;
    g.save(); g.globalAlpha=bright?0.22:0.16;
    g.fillStyle= bright?'#fff0c0':'#dfe8ff';
    g.beginPath(); g.moveTo(sx-14,hz); g.lineTo(sx+14,hz);
    g.lineTo(sx+Wd*0.22, Ht+40); g.lineTo(sx-Wd*0.22, Ht+40); g.closePath(); g.fill();
    g.restore();
  }
  /* 다가오는 파도 줄 */
  const n=30, spd=0.05+myKnots()*0.012;
  const rough=W.rough;
  for(let i=0;i<n;i++){
    let u=((i/n)+ (W.t*spd)%(1/n));
    const uu=Math.pow(u,2.4);
    const y=hz+H*uu;
    const a=clamp(uu*2.4,0,1)*0.5;
    const amp=(0.6+uu*16)*rough;
    g.strokeStyle=rgba(mix([120,150,180],[210,240,255],dayAmt()), a*0.6);
    g.lineWidth=0.8+uu*3.5;
    g.beginPath();
    for(let x=-Wd*0.2;x<=Wd*1.2;x+=18){
      const yy=y+Math.sin(x*(0.02-uu*0.012)+W.t*(2+uu*3)+i)*amp;
      x<=-Wd*0.2? g.moveTo(x,yy) : g.lineTo(x,yy);
    }
    g.stroke();
  }
}
/* 앞바다에 있는 것들(생물·다른 배) */
function drawWorldAhead(g,hz){
  const H=Ht-hz;
  const c=W.creature;
  if(c){
    const dz = c.dz||0.55;
    let y = hz + H*Math.pow(dz,1.8);
    const sc = (0.10+dz*1.5)*clamp(Math.min(Wd,Ht)/300,0.5,1.8)*1.5;
    const x = c.x*Wd;
    if(c.mode==='jump'){
      const ph=(c.t*0.55)%1;
      y -= Math.max(0,Math.sin(ph*Math.PI))*H*0.10;
    }else if(c.mode==='fly'){ y = hz - Ht*0.06 + Math.sin(c.t*0.9)*Ht*0.02; }
    else if(c.mode==='surface'){ y += Math.sin(c.t*0.8)*10; }
    else { y += 18*sc; }
    W._cpos={x,y};
    g.save(); g.translate(x,y); g.scale(c.dir*sc,sc);
    drawCreature(g,c.id,1,W.t);
    g.restore();
    /* 물 위로 나온 것 말고는 물빛에 덮인다 */
    if(c.mode==='swim'||c.mode==='surface'){
      g.fillStyle='rgba(20,80,120,.34)';
      g.fillRect(-Wd*0.3, y-6*sc, Wd*1.6, Ht);
    }
    if((c.id==='sperm'||c.id==='humpback') && Math.sin(c.t*0.8)>0.55){
      g.fillStyle='rgba(235,245,255,.55)';
      const bx2=x+c.dir*48*sc, by2=y-24*sc;
      g.beginPath(); g.ellipse(bx2, by2-14*sc, 3.5*sc, 15*sc,0,0,7); g.fill();
      g.beginPath(); g.ellipse(bx2-3*sc, by2-30*sc, 8*sc, 6*sc,0,0,7); g.fill();
    }
  }
  const fo=W.foe;
  if(fo){
    const sc=0.22+fo.close*0.85;
    const y=hz+H*Math.pow(0.05+fo.close*0.13,1.6);
    g.save(); g.translate(Wd*(0.74-fo.close*0.08), y); g.rotate(Math.sin(W.t*1.1)*0.02);
    drawShipSide(g,fo.type,260*sc,{dir:-1,sail:3,crew:2,flag:fo.hostile?'#1a1a1a':'#3a6ea8'});
    g.restore();
    if(fo.hostile) W._foeLabel={x:Wd*0.74, y:y-90*sc-10};
  }
}
/* ── 내 배를 뒤에서 본 모습 (대항해시대풍) ── */
function drawShipStern(g){
  const p=RIG[S.ship]||RIG.caravel, night=isNight();
  const cx=Wd/2, sternY=Ht*0.705, bowY=Ht*0.415;
  const halfS=Wd*0.145, halfB=Wd*0.029;
  const hw = v => halfS + (halfB-halfS)*v;              /* v=0 선미, 1 뱃머리 */
  const vy = v => sternY + (bowY-sternY)*v;
  const roll=Math.sin(W.t*0.85)*0.035*W.rough;
  const heave=Math.sin(W.t*1.25)*Ht*0.010*W.rough;
  const wood=p.wood, trim=p.trim;
  const hullH=Ht*0.085;                                  /* 선미가 물 위로 솟은 높이 */

  /* 항적(배가 지나간 하얀 물자국) */
  g.save();
  g.fillStyle='rgba(235,245,255,.35)';
  g.beginPath();
  g.moveTo(cx-halfS*0.9, sternY+hullH*0.9);
  g.lineTo(cx+halfS*0.9, sternY+hullH*0.9);
  g.lineTo(cx+halfS*2.4, Ht+10); g.lineTo(cx-halfS*2.4, Ht+10);
  g.closePath(); g.fill();
  g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=Math.max(1,Ht*0.006);
  for(let i=0;i<5;i++){
    const u=((W.t*0.5+i*0.2)%1);
    const yy=sternY+hullH*0.9+u*(Ht-sternY);
    g.globalAlpha=0.5*(1-u);
    g.beginPath();
    g.moveTo(cx-halfS*(0.9+u*1.5), yy); g.lineTo(cx+halfS*(0.9+u*1.5), yy); g.stroke();
  }
  g.restore();

  g.save();
  g.translate(cx, sternY+Ht*0.9); g.rotate(roll); g.translate(-cx, -(sternY+Ht*0.9));
  g.translate(0, heave);

  /* 뱃머리 물보라 */
  g.fillStyle='rgba(255,255,255,.5)';
  g.beginPath(); g.ellipse(cx, bowY+Ht*0.012, halfB*2.6, Ht*0.012, 0,0,7); g.fill();

  /* 좌우 선체(옆면) */
  for(const side of [-1,1]){
    g.beginPath();
    g.moveTo(cx+side*halfS, sternY);
    g.lineTo(cx+side*halfB, bowY);
    g.lineTo(cx+side*halfB*0.9, bowY+Ht*0.016);
    g.lineTo(cx+side*halfS*0.94, sternY+hullH);
    g.closePath();
    g.fillStyle= night? '#2f2415' : '#5d4126';
    g.fill();
  }
  /* 갑판 */
  g.beginPath();
  g.moveTo(cx-halfS, sternY); g.lineTo(cx+halfS, sternY);
  g.lineTo(cx+halfB, bowY); g.lineTo(cx-halfB, bowY);
  g.closePath();
  const gd=g.createLinearGradient(0,bowY,0,sternY);
  gd.addColorStop(0, night?'#3a2c1c':'#a98657');
  gd.addColorStop(1, night?'#4a3a26':'#cfae7c');
  g.fillStyle=gd; g.fill();
  g.save(); g.clip();
  g.strokeStyle='rgba(60,42,24,.4)'; g.lineWidth=1;
  for(let k=-1;k<=1;k+=0.2){
    g.beginPath(); g.moveTo(cx+k*halfS, sternY); g.lineTo(cx+k*halfB, bowY); g.stroke();
  }
  for(let i=1;i<10;i++){
    const v=i/10;
    g.beginPath(); g.moveTo(cx-hw(v), vy(v)); g.lineTo(cx+hw(v), vy(v)); g.stroke();
  }
  g.restore();

  /* 뱃전 난간 */
  for(const side of [-1,1]){
    g.beginPath();
    g.moveTo(cx+side*halfS, sternY);
    g.lineTo(cx+side*halfB, bowY);
    g.lineTo(cx+side*halfB, bowY-Ht*0.022);
    g.lineTo(cx+side*halfS*1.03, sternY-Ht*0.062);
    g.closePath();
    g.fillStyle= night? '#3d2f1e' : wood; g.fill();
    g.strokeStyle=trim; g.lineWidth=Math.max(1,Ht*0.004);
    g.beginPath();
    g.moveTo(cx+side*halfB, bowY-Ht*0.022);
    g.lineTo(cx+side*halfS*1.03, sternY-Ht*0.062); g.stroke();
    /* 대포 구멍 */
    if(p.ports) for(let i=1;i<=3;i++){
      const v=i/4.2, x=cx+side*hw(v)*1.01, y=vy(v)-Ht*0.022-Ht*0.04*(1-v)*0.5;
      g.fillStyle='#20150c';
      g.fillRect(x-Wd*0.008, y, Wd*0.016, Ht*0.014);
    }
    /* 노 */
    if(p.oars) for(let i=0;i<5;i++){
      const v=0.1+i*0.16, x=cx+side*hw(v)*1.02, y=vy(v);
      const ph=Math.sin(W.t*3-i*0.4)*0.5+0.5;
      g.strokeStyle='#8a6a3c'; g.lineWidth=Math.max(1.5,Wd*0.004*(1-v*0.5));
      g.beginPath(); g.moveTo(x,y-Ht*0.01);
      g.lineTo(x+side*Wd*(0.05+ph*0.02)*(1-v*0.5), y+Ht*0.035*(1-v*0.5)); g.stroke();
    }
  }

  /* 선미(내 쪽을 보는 면) */
  g.beginPath();
  g.moveTo(cx-halfS, sternY);
  g.lineTo(cx+halfS, sternY);
  g.lineTo(cx+halfS*0.94, sternY+hullH);
  g.quadraticCurveTo(cx, sternY+hullH*1.14, cx-halfS*0.94, sternY+hullH);
  g.closePath();
  const gs=g.createLinearGradient(0,sternY,0,sternY+hullH);
  gs.addColorStop(0, night?'#4a3722':wood); gs.addColorStop(0.72, night?'#3a2a18':wood);
  gs.addColorStop(0.73,'#8d2f26'); gs.addColorStop(1,'#5d2019');
  g.fillStyle=gs; g.fill();
  g.strokeStyle='#3a2716'; g.lineWidth=Math.max(1,Ht*0.003); g.stroke();
  /* 선미 장식과 창문 */
  g.fillStyle=trim; g.fillRect(cx-halfS, sternY+hullH*0.12, halfS*2, Ht*0.008);
  g.fillStyle= night? 'rgba(255,214,140,.95)':'rgba(120,180,200,.7)';
  for(let i=-1;i<=1;i++) g.fillRect(cx+i*halfS*0.42-halfS*0.13, sternY+hullH*0.24, halfS*0.26, hullH*0.26);
  /* 선미 등불 */
  if(night){
    const lx=cx, ly=sternY-Ht*0.05;
    const gg=g.createRadialGradient(lx,ly,2,lx,ly,Ht*0.10);
    gg.addColorStop(0,'rgba(255,214,140,.9)'); gg.addColorStop(1,'rgba(255,190,110,0)');
    g.fillStyle=gg; g.beginPath(); g.arc(lx,ly,Ht*0.10,0,7); g.fill();
    g.fillStyle='#ffd98a'; g.fillRect(lx-Wd*0.006, ly-Ht*0.012, Wd*0.012, Ht*0.024);
  }
  /* 깃발 */
  g.fillStyle='#3a2716'; g.fillRect(cx-1, sternY-Ht*0.14, Math.max(2,Wd*0.004), Ht*0.10);
  drawFlag(g, cx, sternY-Ht*0.14, Wd*0.055, Ht*0.028, CAP().flag, W.t, 1);

  /* 거북선 지붕 */
  if(p.turtle){
    g.fillStyle='#4b5b46';
    g.beginPath();
    g.moveTo(cx-halfS*0.96, sternY-Ht*0.01);
    g.quadraticCurveTo(cx, sternY-Ht*0.075, cx+halfS*0.96, sternY-Ht*0.01);
    g.lineTo(cx+halfB*1.1, bowY); g.lineTo(cx-halfB*1.1, bowY);
    g.closePath(); g.fill();
    g.strokeStyle='#8f9a86'; g.lineWidth=1;
    for(let i=0;i<9;i++){
      const v=i/9, x=cx-hw(v)*0.6+ (i%2)*hw(v)*1.2, y=vy(v);
      g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-Ht*0.012*(1-v*0.6)); g.stroke();
    }
  }

  /* 돛대와 돛 (먼 것부터) */
  const masts=(p.masts.length? p.masts : [[0,0.8,'kr']])
    .map(m=>({v: clamp(0.5+m[0]*1.35, 0.08, 0.92), h:m[1], kind:m[2]}))
    .sort((a,b)=>b.v-a.v);
  const furl=clamp(S.sail/3,0,1);
  for(const m of masts){
    const y=vy(m.v), s=1-0.55*m.v, w=hw(m.v)*2.15;
    const mh=Ht*0.62*s*m.h;
    /* 밧줄 */
    g.strokeStyle='rgba(50,36,20,.55)'; g.lineWidth=1;
    for(const side of [-1,1]){
      g.beginPath(); g.moveTo(cx, y-mh*0.8); g.lineTo(cx+side*hw(m.v)*1.02, y-Ht*0.014); g.stroke();
    }
    g.strokeStyle= night?'#3a2a18':'#6b4a28'; g.lineWidth=Math.max(2,Wd*0.007*s);
    g.beginPath(); g.moveTo(cx,y); g.lineTo(cx,y-mh); g.stroke();
    if(m.kind==='lat')      drawSternLateen(g,cx,y,mh,w,furl,s);
    else if(m.kind==='jk')  drawDeckJunk(g,cx,y,mh,w,furl,s);
    else{
      const n=m.kind==='sq3'?3:(m.kind==='kr'?1:2);
      let bot=y-mh*0.18;
      for(let i=0;i<n;i++){
        const hgt=mh*0.34*(1-i*0.15);
        drawDeckSq(g,cx,bot-hgt,w*(1-i*0.22),hgt,furl,s);
        bot=bot-hgt-mh*0.04;
      }
    }
  }
  /* 갑판 위 선원 */
  const spots=[[-0.5,0.22],[0.45,0.34],[-0.4,0.52],[0.4,0.66],[0,0.44]];
  spots.forEach((sp,i)=>{
    const v=sp[1], s=(1-0.6*v)*Ht*0.055;
    const x=cx+sp[0]*hw(v)*0.8+Math.sin(W.t*0.6+i*2)*hw(v)*0.08;
    drawPersonBack(g, x, vy(v), s, ['#c8b89a','#8fa8c0','#c4907a','#9fb08a','#d8c8a8'][i%5], W.t+i, S.fat>60 && i%2===0);
  });
  g.restore();
}
function drawSternLateen(g,cx,deck,mh,w0,furl,s){
  const w=w0*0.62;
  const ax=cx-w*0.55, ay=deck-mh*0.30, bx=cx+w*0.45, by=deck-mh*0.92;
  g.strokeStyle='#4a3520'; g.lineWidth=Math.max(1.5,3*s);
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  if(furl<=0.02) return;
  const f=0.55+0.45*furl;
  const gr=g.createLinearGradient(ax,ay,bx,by);
  gr.addColorStop(0,'#ddd3b6'); gr.addColorStop(.5,'#f6efdd'); gr.addColorStop(1,'#ded4b8');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(ax,ay); g.lineTo(bx,by);
  g.quadraticCurveTo(cx+w*0.24, deck-mh*0.34*f, cx+w*0.04, deck-mh*0.10);
  g.quadraticCurveTo(cx-w*0.26, deck-mh*0.16, ax,ay);
  g.closePath(); g.fill();
  g.strokeStyle='rgba(120,100,70,.35)'; g.lineWidth=1; g.stroke();
}

/* 내가 탄 배의 갑판(가까이 보기 — 예비 시점) */
function drawDeck(g){
  const p=RIG[S.ship]||RIG.caravel, D=DECK();
  const night=isNight();
  const wood=p.wood, trim=p.trim;
  /* 갑판 바닥 */
  g.beginPath();
  g.moveTo(Wd/2-deckHalf(0), deckY(0));
  g.lineTo(Wd/2+deckHalf(0), deckY(0));
  g.lineTo(Wd/2+deckHalf(1), deckY(1));
  g.lineTo(Wd/2-deckHalf(1), deckY(1));
  g.closePath();
  const gd=g.createLinearGradient(0,deckY(0),0,Ht);
  gd.addColorStop(0, night?'#4a3a26':'#9c7a4c');
  gd.addColorStop(1, night?'#3a2c1c':'#c8a877');
  g.fillStyle=gd; g.fill();
  /* 널빤지 */
  g.save(); g.clip();
  g.strokeStyle='rgba(60,42,24,.45)'; g.lineWidth=1.2;
  for(let k=-1;k<=1;k+=0.125){
    g.beginPath();
    g.moveTo(Wd/2+k*deckHalf(0), deckY(0));
    g.lineTo(Wd/2+k*deckHalf(1), deckY(1));
    g.stroke();
  }
  for(let i=1;i<=16;i++){
    const u=Math.pow(i/16,1.7);
    g.globalAlpha=0.35;
    g.beginPath(); g.moveTo(Wd/2-deckHalf(u),deckY(u)); g.lineTo(Wd/2+deckHalf(u),deckY(u)); g.stroke();
  }
  g.globalAlpha=1;
  /* 승강구 */
  const hu=0.62, hh=deckHalf(hu)*0.30;
  g.fillStyle='#2a1c10';
  g.beginPath();
  g.moveTo(Wd/2-hh,deckY(hu)); g.lineTo(Wd/2+hh,deckY(hu));
  g.lineTo(Wd/2+hh*1.35,deckY(hu+0.12)); g.lineTo(Wd/2-hh*1.35,deckY(hu+0.12));
  g.closePath(); g.fill();
  g.restore();

  /* 양쪽 뱃전 */
  const bulH = u => Ht*(0.012 + 0.115*Math.pow(u,1.35));
  for(const side of [-1,1]){
    g.beginPath();
    g.moveTo(Wd/2+side*deckHalf(0), deckY(0));
    for(let u=0;u<=1.001;u+=0.1) g.lineTo(Wd/2+side*deckHalf(u), deckY(u));
    for(let u=1;u>=-0.001;u-=0.1) g.lineTo(Wd/2+side*deckHalf(u)*1.05, deckY(u)-bulH(u));
    g.closePath();
    g.fillStyle= night? '#3d2f1e' : wood;
    g.fill();
    g.strokeStyle=trim; g.lineWidth=3;
    g.beginPath();
    for(let u=0;u<=1.001;u+=0.05){
      const x=Wd/2+side*deckHalf(u)*1.05, y=deckY(u)-bulH(u);
      u===0? g.moveTo(x,y): g.lineTo(x,y);
    }
    g.stroke();
    /* 대포 */
    if(p.ports) for(const u of [0.42,0.66,0.90]){
      const x=Wd/2+side*deckHalf(u)*0.90, y=deckY(u), s=(0.12+u)*Wd*0.05;
      g.fillStyle='#5a4028';
      g.fillRect(x-s*0.42, y-s*0.26, s*0.84, s*0.26);
      g.fillStyle='#2a2a2e';
      g.fillRect(x-s*0.30, y-s*0.62, s*0.60, s*0.38);
      g.beginPath(); g.ellipse(x+side*s*0.42, y-s*0.44, s*0.34, s*0.13, 0,0,7); g.fill();
      g.fillStyle='#3a2a18';
      g.beginPath(); g.arc(x-s*0.28,y,s*0.11,0,7); g.arc(x+s*0.28,y,s*0.11,0,7); g.fill();
    }
  }

  /* 뱃머리(선수루) — 저 앞에 보이는 배의 앞부분 */
  const by=deckY(0), bw=deckHalf(0);
  g.fillStyle= night? '#3d2f1e' : wood;
  g.beginPath();
  g.moveTo(Wd/2-bw*1.05, by);
  g.lineTo(Wd/2+bw*1.05, by);
  g.lineTo(Wd/2+bw*0.85, by-Ht*(p.fh>0.06?0.075:0.035));
  g.lineTo(Wd/2-bw*0.85, by-Ht*(p.fh>0.06?0.075:0.035));
  g.closePath(); g.fill();
  g.strokeStyle=trim; g.lineWidth=2.5; g.stroke();
  if(p.sprit>0){
    g.strokeStyle='#5a3f22'; g.lineWidth=7;
    g.beginPath(); g.moveTo(Wd/2, by-Ht*0.03); g.lineTo(Wd/2, by-Ht*0.03-Ht*0.13*p.sprit); g.stroke();
    g.strokeStyle='rgba(60,44,26,.6)'; g.lineWidth=1.2;
    for(const side of [-1,1]){
      g.beginPath(); g.moveTo(Wd/2, by-Ht*0.03-Ht*0.13*p.sprit);
      g.lineTo(Wd/2+side*bw*0.9, by-Ht*0.02); g.stroke();
    }
  }

  /* 돛대와 돛 */
  const masts = p.masts.length? p.masts : [[0,0.8,'kr']];
  const list = masts.map(m=>({u: clamp(0.5 - m[0]*1.15, 0.20, 0.86), kind:m[2], h:m[1]}))
                    .sort((a,b)=>a.u-b.u);
  const furl = clamp(S.sail/3,0,1);
  for(const m of list){
    const y=deckY(m.u), s=0.12+0.9*m.u;
    const mw=Math.max(3,Wd*0.014*s);
    const mh = Ht*1.05*s*m.h;                  /* 갑판에서 돛대 꼭대기까지 */
    const w  = deckHalf(m.u)*0.95;             /* 돛 너비 */
    /* 밧줄 */
    g.strokeStyle='rgba(50,36,20,.6)'; g.lineWidth=Math.max(1,1.5*s);
    for(const side of [-1,1]) for(const k of [0.7,0.98]){
      g.beginPath(); g.moveTo(Wd/2, y-mh*0.78); g.lineTo(Wd/2+side*deckHalf(m.u)*k, y-bulH(m.u)); g.stroke();
    }
    /* 돛대 */
    g.strokeStyle= night?'#3a2a18':'#6b4a28'; g.lineWidth=mw;
    g.beginPath(); g.moveTo(Wd/2, y+4); g.lineTo(Wd/2, y-mh); g.stroke();
    /* 돛 */
    if(m.kind==='lat')      drawDeckLateen(g, Wd/2, y, mh, w, furl, s);
    else if(m.kind==='jk')  drawDeckJunk(g, Wd/2, y, mh, w, furl, s);
    else{
      const n = m.kind==='sq3'?3:(m.kind==='kr'?1:2);
      let bot = y - mh*0.26;
      for(let i=0;i<n;i++){
        const hgt = mh*0.30*(1-i*0.13);
        drawDeckSq(g, Wd/2, bot-hgt, w*(1-i*0.20), hgt, furl, s);
        bot = bot-hgt-mh*0.045;
      }
    }
    /* 줄사다리 */
    if(m.u>0.65){
      g.strokeStyle='rgba(60,44,26,.55)'; g.lineWidth=1;
      for(const side of [-1,1]){
        for(let i=1;i<=7;i++){
          const t1=i/8;
          g.beginPath();
          g.moveTo(Wd/2+side*deckHalf(m.u)*0.98*(1-t1), y-bulH(m.u)-(mh*0.78-bulH(m.u))*t1);
          g.lineTo(Wd/2+side*deckHalf(m.u)*0.98*(1-t1)*0.5, y-bulH(m.u)-(mh*0.78-bulH(m.u))*t1);
          g.stroke();
        }
      }
    }
  }

  /* 거북선은 지붕 아래에서 내다본다 */
  if(p.turtle){
    g.fillStyle='#38452f';
    g.beginPath();
    g.moveTo(0,0); g.lineTo(Wd,0); g.lineTo(Wd,Ht*0.30);
    g.quadraticCurveTo(Wd/2, Ht*0.10, 0, Ht*0.30);
    g.closePath(); g.fill();
    g.strokeStyle='#22301f'; g.lineWidth=3; g.stroke();
  }

  /* 갑판 위 선원들 */
  const tired=S.fat;
  const spots=[[-0.55,0.34],[0.5,0.4],[-0.35,0.62],[0.42,0.7],[-0.62,0.86],[0.15,0.28]];
  spots.forEach((sp,i)=>{
    const u=sp[1], s=(0.1+u)*Wd*0.075;
    const x=Wd/2 + sp[0]*deckHalf(u)*0.85 + Math.sin(W.t*0.6+i*2)*deckHalf(u)*0.06;
    drawPersonBack(g, x, deckY(u), s, ['#c8b89a','#8fa8c0','#c4907a','#9fb08a','#d8c8a8','#b8a888'][i%6], W.t+i, tired>60 && i%2===0);
  });

  /* 앞쪽(내 발밑) — 선미 갑판, 나침반 상자, 키잡이 */
  g.fillStyle= night? '#2e2314' : '#7a5a34';
  g.fillRect(0, Ht*0.955, Wd, Ht*0.06);
  g.fillStyle=trim; g.fillRect(0, Ht*0.948, Wd, Math.max(2,Ht*0.008));
  /* 나침반 상자 */
  const k=Wd*0.055;
  g.save(); g.translate(Wd*0.11, Ht*0.952);
  g.fillStyle='#6b4a28'; g.fillRect(-k*0.5,-k*0.62,k,k*0.62);
  g.fillStyle=trim; g.fillRect(-k*0.56,-k*0.70,k*1.12,k*0.12);
  g.fillStyle= night? '#3b2f1c':'#e8dcc0';
  g.beginPath(); g.arc(0,-k*0.32,k*0.27,0,7); g.fill();
  g.strokeStyle='#6b4a28'; g.lineWidth=Math.max(1,k*0.03);
  g.beginPath(); g.arc(0,-k*0.32,k*0.27,0,7); g.stroke();
  const ang=Math.sin(W.t*0.5)*0.25;
  g.strokeStyle='#a8452f'; g.lineWidth=Math.max(1.5,k*0.035);
  g.beginPath();
  g.moveTo(-Math.sin(ang)*k*0.2, -k*0.32+Math.cos(ang)*k*0.2);
  g.lineTo(Math.sin(ang)*k*0.2, -k*0.32-Math.cos(ang)*k*0.2); g.stroke();
  g.restore();
  /* 키잡이(뒤에서 본 모습) */
  g.save(); g.translate(Wd*0.80, Ht*1.0);
  drawPersonBack(g, 0, 0, Wd*0.058, '#d8c8a8', W.t*0.4, false);
  g.strokeStyle='#6b4a28'; g.lineWidth=Math.max(2,Wd*0.006);
  g.beginPath(); g.moveTo(0,-Wd*0.05); g.lineTo(Math.sin(W.t*0.5)*Wd*0.012,-Wd*0.115); g.stroke();
  g.restore();
  /* 밤 등불 */
  if(night){
    for(const u of [0.45,0.75]){
      const x=Wd/2+deckHalf(u)*0.98, y=deckY(u)-Ht*0.20*Math.pow(u,1.5)-8;
      const gg=g.createRadialGradient(x,y,2,x,y,70);
      gg.addColorStop(0,'rgba(255,214,140,.85)'); gg.addColorStop(1,'rgba(255,190,110,0)');
      g.fillStyle=gg; g.beginPath(); g.arc(x,y,70,0,7); g.fill();
      g.fillStyle='#ffd98a'; g.fillRect(x-5,y-8,10,14);
    }
  }
  /* 뱃머리 물보라 */
  g.fillStyle='rgba(255,255,255,.35)';
  for(let i=0;i<10;i++){
    const u=(W.t*0.5+i*0.1)%1;
    const side=i%2?1:-1;
    const x=Wd/2+side*deckHalf(0)*(1.1+u*2.4), y=deckY(0)+u*Ht*0.06;
    g.globalAlpha=0.4*(1-u);
    g.beginPath(); g.ellipse(x,y,10+u*40,3+u*10,0,0,7); g.fill();
  }
  g.globalAlpha=1;
}
/* 갑판에서 본 네모돛 (바람에 앞으로 불룩) */
function drawDeckSq(g, cx, top, w, h, furl, s){
  g.strokeStyle='#4a3520'; g.lineWidth=Math.max(2,5*s);
  g.beginPath(); g.moveTo(cx-w/2, top); g.lineTo(cx+w/2, top); g.stroke();
  if(furl<=0.02){
    g.fillStyle='#ddd3bb';
    g.beginPath(); g.ellipse(cx,top+4*s,w*0.46,Math.max(3,10*s),0,0,7); g.fill();
    return;
  }
  const hh=h*(0.5+0.5*furl);
  const gr=g.createLinearGradient(cx-w/2,0,cx+w/2,0);
  gr.addColorStop(0,'#b9ad91'); gr.addColorStop(.35,'#f6efdd'); gr.addColorStop(.75,'#e6ddc4'); gr.addColorStop(1,'#b2a68a');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(cx-w/2, top+2);
  g.quadraticCurveTo(cx-w*0.54, top+hh*0.5, cx-w*0.46, top+hh);
  g.quadraticCurveTo(cx, top+hh*0.80, cx+w*0.46, top+hh);
  g.quadraticCurveTo(cx+w*0.54, top+hh*0.5, cx+w/2, top+2);
  g.closePath(); g.fill();
  g.strokeStyle='rgba(120,100,70,.3)'; g.lineWidth=1;
  for(const u of [-0.25,0,0.25]){
    g.beginPath(); g.moveTo(cx+w*u, top+3); g.lineTo(cx+w*u*0.92, top+hh-hh*0.06); g.stroke();
  }
}
/* 갑판에서 본 삼각돛 — 활대가 비스듬히 걸리고 그 아래로 돛이 퍼진다 */
function drawDeckLateen(g, cx, deck, mh, w, furl, s){
  const ax=cx-w*0.62, ay=deck-mh*0.34;      /* 활대 아래쪽(왼쪽) */
  const bx=cx+w*0.50, by=deck-mh*0.93;      /* 활대 위쪽(오른쪽) */
  g.strokeStyle='#4a3520'; g.lineWidth=Math.max(2,4.5*s);
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  if(furl<=0.02){
    g.fillStyle='#ddd3bb'; g.save();
    g.translate((ax+bx)/2,(ay+by)/2); g.rotate(Math.atan2(by-ay,bx-ax));
    g.beginPath(); g.ellipse(0,0,w*0.5,Math.max(3,7*s),0,0,7); g.fill(); g.restore();
    return;
  }
  const f=0.55+0.45*furl;
  const gr=g.createLinearGradient(ax,ay,bx,by);
  gr.addColorStop(0,'#ded4b8'); gr.addColorStop(.5,'#f6efdd'); gr.addColorStop(1,'#ddd3b6');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(ax,ay);
  g.lineTo(bx,by);
  g.quadraticCurveTo(cx+w*0.30, deck-mh*0.34*f, cx+w*0.06, deck-mh*0.20*f);
  g.quadraticCurveTo(cx-w*0.28, deck-mh*0.22, ax,ay);
  g.closePath(); g.fill();
  g.strokeStyle='rgba(120,100,70,.35)'; g.lineWidth=1; g.stroke();
}
/* 갑판에서 본 정크선 부채돛 */
function drawDeckJunk(g, cx, deck, mh, w, furl, s){
  const top=deck-mh*0.92, bot=deck-mh*0.24, h=(bot-top)*(0.6+0.4*clamp(furl,0.15,1));
  g.fillStyle='#b1743e';
  g.beginPath();
  g.moveTo(cx-w*0.52, top+h*0.08);
  g.lineTo(cx+w*0.52, top);
  g.lineTo(cx+w*0.48, top+h*0.92);
  g.lineTo(cx-w*0.48, top+h);
  g.closePath(); g.fill();
  g.strokeStyle='#6d4423'; g.lineWidth=Math.max(1,2*s);
  for(let i=0;i<=7;i++){
    const u=i/7;
    g.beginPath();
    g.moveTo(cx-w*0.52+w*0.04*u, top+h*0.08+h*0.92*u);
    g.lineTo(cx+w*0.52-w*0.04*u, top+h*0.92*u);
    g.stroke();
  }
}
/* 뒤에서 본 사람 */
function drawPersonBack(g,x,y,s,col,t,sit){
  g.save(); g.translate(x,y);
  g.fillStyle=col;
  if(sit){
    g.fillRect(-s*0.30,-s*0.80,s*0.60,s*0.58);

  }else{
    g.fillRect(-s*0.28,-s*1.10,s*0.56,s*0.70);

    g.fillRect(s*0.05,-s*0.42,s*0.20,s*0.44);
    g.fillStyle=col;
    g.fillRect(-s*0.40,-s*1.02+sw*s*0.1,s*0.14,s*0.5);

/* ── 옆에서 보기(예전 시점) ── */
function drawSailSideScene(g){
  const y0=Ht*0.46, rough=W.rough;
  drawSky(g,y0,W.storm>0);
  if(W.flash>0){ g.fillStyle='rgba(255,255,255,'+(W.flash*0.5)+')'; g.fillRect(0,0,Wd,y0); }
  drawSeaBack(g,y0,rough);

  /* 생물 */
  const c=W.creature;
  let cpos=null;
  if(c){
    const x=c.x*Wd;
    let y=y0 + c.depth*Ht;
    if(c.mode==='jump'){
      const ph=(c.t*0.55)%1;
      y = y0 + c.depth*Ht - Math.max(0, Math.sin(ph*Math.PI))*Ht*0.16;
    }else if(c.mode==='surface'){
      y = y0 + c.depth*Ht + Math.sin(c.t*0.8)*Ht*0.035;
    }else if(c.mode==='fly'){
      y = y0 - Ht*0.10 + Math.sin(c.t*0.9)*Ht*0.03;
    }else{
      y = y0 + c.depth*Ht + Math.sin(c.t*0.6)*Ht*0.02;
    }
    cpos={x,y};
    const sc = clamp(Math.min(Wd,Ht)/620,0.55,1.5)*1.5;
    g.save(); g.translate(x,y); g.scale(c.dir*sc, sc);
    drawCreature(g, c.id, 1, W.t);
    g.restore();
    /* 물 위로 나온 부분은 밝게, 물속은 파랗게 덮는다 */
    g.save();
    g.beginPath(); g.moveTo(0,Ht);
    for(let xx=0;xx<=Wd;xx+=10) g.lineTo(xx, seaY(xx,y0,rough));
    g.lineTo(Wd,Ht); g.closePath(); g.clip();
    g.fillStyle='rgba(20,80,120,.30)'; g.fillRect(0,y0,Wd,Ht-y0);
    g.restore();
    /* 물기둥 (고래) */
    if((c.id==='sperm'||c.id==='humpback') && Math.sin(c.t*0.8)>0.6){
      g.fillStyle='rgba(235,245,255,.75)';
      const bx=x+c.dir*70*sc;
      g.beginPath(); g.ellipse(bx, y-60*sc, 9*sc, 34*sc, 0,0,7); g.fill();
      g.beginPath(); g.ellipse(bx-8*sc, y-84*sc, 16*sc, 12*sc, 0,0,7); g.fill();
    }
    /* 첨벙 */
    if(c.mode==='jump'){
      g.fillStyle='rgba(255,255,255,.5)';
      for(let i=0;i<6;i++) g.fillRect(x-30+i*11, seaY(x,y0,rough)-2-((i*7)%9), 3,3);
    }
  }

  /* 내 배 */
  const L = Wd*0.30 * (spec().len/34);
  const bob = Math.sin(W.t*1.3)*3*rough;
  g.save();
  g.translate(Wd*0.36, y0+10+bob);
  g.rotate(Math.sin(W.t*0.9)*0.022*rough);
  drawShipSide(g, S.ship, L, {dir:1, sail:S.sail, crew:5, tired:S.fat, flag:flagColor(), dmg:S.hull/100});
  g.restore();
  /* 뱃머리 물보라 */
  const spd=myKnots();
  g.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<8;i++){
    const px=Wd*0.36+L*0.5+ (i*9) - (W.t*40)%20;
    g.fillRect(px, y0+12+Math.sin(W.t*6+i)*4, 5+spd, 3);
  }

  /* 다른 배 */
  const fo=W.foe;
  if(fo){
    const sc = 0.28 + fo.close*0.55;
    g.save();
    g.translate(Wd*(0.86-fo.close*0.18), y0+4+Math.sin(W.t*1.7)*2);
    g.rotate(Math.sin(W.t*1.1)*0.02);
    drawShipSide(g, fo.type, 230*sc, {dir:-1, sail:3, crew:2,
      flag: fo.hostile?'#1a1a1a':'#3a6ea8'});
    g.restore();
    if(fo.hostile) W._foeLabel={x:Wd*0.84, y:y0-24};
  }

  drawSeaFront(g,y0,rough);
  if(W.storm>0) drawRain(g);
  if(W.scope) drawScope(g, cpos);
}
function drawRain(g){
  const U=Ht/180;
  g.strokeStyle='rgba(190,215,240,.45)'; g.lineWidth=Math.max(1,U*0.35);
  for(let i=0;i<160;i++){
    const x=(i*97 + W.t*Wd*0.55)%(Wd+Wd*0.2)-Wd*0.1, y=(i*53 + W.t*Ht*1.25)%Ht;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x-U*1.6,y+U*3.6); g.stroke();
  }
}
/* 나무 액자 (대항해시대풍) */
function woodPanel(g,x,y,w,h){
  g.fillStyle='#5b4026'; g.fillRect(x,y,w,h);
  g.fillStyle='#7a5a34'; g.fillRect(x+4,y+4,w-8,h-8);
  g.fillStyle='#e6d5ac'; g.fillRect(x+8,y+8,w-16,h-16);
  g.strokeStyle='#3f2c18'; g.lineWidth=2; g.strokeRect(x+0.5,y+0.5,w-1,h-1);
  g.fillStyle='#c9a253';
  for(const p of [[x+6,y+6],[x+w-12,y+6],[x+6,y+h-12],[x+w-12,y+h-12]]) g.fillRect(p[0],p[1],6,6);
}

/* ── 아래 대사창 (선장이 나에게 말한다) ── */
function drawMsgWindow(g){
  const h=116, x=8, y=Ht-h-8, w=Wd-16;
  woodPanel(g,x,y,w,h);

  /* 초상화 */
  const ps=88, px=x+16, py=y+(h-ps)/2;
  g.fillStyle='#2a1c10'; g.fillRect(px-3,py-3,ps+6,ps+6);
  const tmp=document.createElement('canvas'); tmp.width=ps; tmp.height=ps;
  pixelInto(tmp, gg=>{ gg.save(); gg.translate(ps/2,ps*0.56); drawPortrait(gg, who==='lookout'?'sailor':cap.id, ps*1.05); gg.restore(); });
  g.drawImage(tmp,px,py);
  /* 이름표 */
  g.fillStyle='#5b4026'; g.fillRect(px+ps+12, y+14, 150, 24);
  g.fillStyle='#f0e2bc'; g.font='bold 14px "Malgun Gothic"';
  g.fillText(nm, px+ps+22, y+31);
  /* 대사 */
  g.fillStyle='#3f2c18'; g.font='16px "Malgun Gothic"';
  const text = MSG? MSG.text : (S.scene==='port'
      ? P(S.at).n+' 항구다. 쉬거나 물건을 사고, 준비되면 출항하자.'
      : (S.scene==='battle' ? '적선이다! 대포 준비!' : '바다는 잔잔하다. 망루를 잘 살펴라.'));
  const maxw = w - ps - 60;
  const words = text.split(' ');
  let line='', ly=y+62;
  for(const wd of words){
    const t2 = line? line+' '+wd : wd;

    else line=t2;
  }
  if(line) g.fillText(line, px+ps+22, ly);
  if(MSGQ.length){
    g.fillStyle='#8a6a3c'; g.font='12px "Malgun Gothic"';
    g.fillText('▼ '+MSGQ.length, x+w-40, y+h-14);

}
/* 나침반 + 바람 */
function drawCompassPanel(g){
  const size=COLW(), x=Wd-size-8, y=56;
  woodPanel(g,x,y,size,size+22);
  const cx=x+size/2, cy=y+size/2+2, r=size*0.31;

    const a=i*Math.PI/4;

  }
