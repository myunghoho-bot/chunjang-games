<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>태양계 타임라인 - 궤도 버전</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02030a; color: #eef; overflow: hidden;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }

  #top { position: fixed; top: 12px; left: 0; right: 0; text-align: center; pointer-events: none; }
  #year { font-size: 40px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 14px #000, 0 0 4px #000; }
  #era { font-size: 17px; color: #ffd98a; margin-top: 2px; text-shadow: 0 0 6px #000; }

  #caption { position: fixed; top: 96px; left: 50%; transform: translateX(-50%); width: min(560px, 92vw);
    background: rgba(10, 14, 40, .82); border: 2px solid #5a6cff; border-radius: 16px; padding: 12px 16px;
    text-align: center; pointer-events: none; transition: opacity .5s; }
  #caption.hide { opacity: 0; }
  #caption .t { font-size: 22px; font-weight: 800; }
  #caption .d { font-size: 15px; color: #cfd6ff; margin-top: 6px; line-height: 1.5; }

  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.85) 40%); }
  #btns { display: flex; gap: 6px; align-items: center; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
  button { font-family: inherit; font-size: 15px; font-weight: 700; color: #fff; background: #26305e;
    border: 2px solid #4a5aa8; border-radius: 10px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #34417c; }
  button.on { background: #e0a020; border-color: #ffd36a; color: #221; }
  #play { font-size: 20px; min-width: 60px; background: #2a7a3a; border-color: #5fd27a; }
  #bar { position: relative; height: 34px; margin: 0 8px; cursor: pointer; }
  #track { position: absolute; left: 0; right: 0; top: 20px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, #6a2a6a, #2a3a8a 30%, #2a7a4a 50%, #ffcc44 62%, #ff4422 75%, #9ab0ff 82%, #333 100%); }
  #fill { position: absolute; left: 0; top: 20px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.35); }
  #knob { position: absolute; top: 14px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px #8cf; }
  .tick { position: absolute; top: 0; width: 18px; margin-left: -9px; text-align: center; font-size: 13px; line-height: 16px; }
  .tick.got { filter: none; }
  .tick.no { filter: grayscale(1) opacity(.45); }
  #nowmark { position: absolute; top: 16px; width: 2px; height: 16px; background: #7dff9a; }

  #side { position: fixed; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  #side button { font-size: 13px; text-align: left; padding: 5px 9px; }
  #sysgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  canvas.place { cursor: crosshair; }
  #side .syshead { font-size: 12px; color: #9fb0ff; text-align: center; }
  #side button.sys.on { background: #3a5ad0; border-color: #9fb8ff; color: #fff; }

  #info { position: fixed; left: 12px; top: 12px; width: 270px; background: rgba(10,14,40,.9); border: 2px solid #4a5aa8;
    border-radius: 14px; padding: 12px; display: none; }
  #info h3 { margin: 0 0 6px; font-size: 22px; }
  #info .st { color: #ffd98a; font-weight: 700; margin-bottom: 6px; }
  #info .fx { font-size: 14px; line-height: 1.5; color: #d6dcff; }
  #info .row { display: flex; gap: 6px; margin-top: 10px; }

  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; }
  #mbox { width: min(820px, 94vw); max-height: 86vh; overflow: auto; background: #0e1430; border: 3px solid #5a6cff;
    border-radius: 18px; padding: 16px 18px; }
  #mbox h2 { margin: 0 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .card { background: #1b2350; border: 2px solid #3d4b99; border-radius: 12px; padding: 8px; font-size: 13px; line-height: 1.4; cursor: pointer; }
  .card b { display: block; font-size: 15px; margin: 2px 0; }
  .card .y { color: #9fb0ff; font-size: 12px; }
  .card.lock { opacity: .5; cursor: default; }
  .card .e { font-size: 26px; }
  .q { font-size: 20px; font-weight: 800; margin: 10px 0 14px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opts button { font-size: 17px; padding: 12px; }
  .opts button.ok { background: #2a8a3a; border-color: #7fe08f; }
  .opts button.bad { background: #8a2a2a; border-color: #ff8080; }
  #toast { position: fixed; right: 14px; bottom: 110px; background: #e0a020; color: #221; font-weight: 800;
    padding: 8px 14px; border-radius: 12px; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #help { position: fixed; left: 12px; bottom: 96px; font-size: 12px; color: #8a93c0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top"><div id="year">-</div><div id="era">-</div></div>
<div id="caption" class="hide"><div class="t"></div><div class="d"></div></div>

<div id="side">
  <div class="syshead">별 고르기</div>
  <div id="sysgrid">
  <div class="syshead">별 고르기</div>
  <button class="sys on" data-sys="solar">🌞 태양계</button>
  <button class="sys" data-sys="tauceti">🟡 타우 세티</button>
  <button class="sys" data-sys="trappist">🔴 트라피스트-1</button>
  <button class="sys" data-sys="kepler70">🔵 케플러-70</button>
  <button class="sys" data-sys="tabby">👽 태비의 별</button>
  <button class="sys" data-sys="betel">💥 베텔게우스</button>

  </div>
  <div style="height:8px"></div>

  <button id="bName" class="on">🏷️ 이름</button>

  <button id="bMine">🪐 내 행성 넣기</button>
  <button id="bTilt">👀 기울여 보기</button>
  <button id="bSound" class="on">🔊 소리</button>
</div>

<div id="info">
  <h3 id="iName"></h3>
  <div class="st" id="iState"></div>
  <div class="fx" id="iFact"></div>
  <div class="row"><button id="iFollow">📌 따라가기</button><button id="iClose">닫기</button></div>
</div>

<div id="help">끌기: 화면 움직이기 · 휠: 확대/축소 · 행성 클릭: 정보 · 스페이스: 재생/멈춤 · ←→: 사건 이동</div>

<div id="bottom">
  <div id="btns">
    <button id="bStart" title="처음으로">⏮</button>
    <button id="bPrev">◀ 사건</button>
    <button id="play">▶</button>
    <button id="bNext">사건 ▶</button>
    <span style="width:10px"></span>
    <button class="spd" data-s="0.5">느리게</button>
    <button class="spd on" data-s="1">x1</button>
    <button class="spd" data-s="2">x2</button>
    <button class="spd" data-s="4">x4</button>
  </div>
  <div id="bar"><div id="track"></div><div id="fill"></div><div id="nowmark"></div><div id="knob"></div></div>
</div>

<script>
'use strict';
// ================================================================
//  태양계 타임라인 - 궤도 버전
//  위에서 내려다본 태양계가 46억 년 전 ~ 아주 먼 미래까지 변하는 모습.
//  거리는 "제곱근 눈금"(sqrt AU)이라 해왕성까지 한 화면에 들어온다.
// ================================================================

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth || 1200; H = window.innerHeight || 800;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- 도우미 ----------
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b);
  return [0, 1, 2].map(i => Math.round(lerp(A[i], B[i], t))); }
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------- 시간 축 ----------
// [연도, 이 구간을 x1 속도로 지나가는 데 걸리는 초]
// 연도: 음수 = 지금보다 전, 양수 = 지금보다 후
const SOLAR_NODES = [
  [-4.6e9, 5], [-4.59e9, 5], [-4.57e9, 4], [-4.567e9, 7], [-4.555e9, 5], [-4.54e9, 7],
  [-4.51e9, 5], [-4.4e9, 5], [-4.1e9, 9], [-3.8e9, 5], [-2.4e9, 5], [-7.2e8, 4], [-5.4e8, 5],
  [-6.6e7, 6], [0, 7], [1e9, 5], [3.5e9, 4], [5e9, 5], [7e9, 5], [7.5e9, 6], [7.59e9, 5],
  [7.7e9, 5], [7.9e9, 6], [8e9, 5], [1e12, 5], [1e15, 7], [1e17, 0]
];
let NODES, CUM, TOTAL;
function setNodes(n) {
  NODES = n; CUM = []; TOTAL = 0;
  for (const x of n) { CUM.push(TOTAL); TOTAL += x[1]; }
  TOTAL -= n[n.length - 1][1];
}
const isLogSeg = (y0, y1) => y0 > 0 && y1 / y0 > 50;

function yearAt(p) {
  p = clamp(p, 0, TOTAL);
  for (let i = 0; i < NODES.length - 1; i++) {
    if (p <= CUM[i + 1] || i === NODES.length - 2) {
      const f = clamp((p - CUM[i]) / NODES[i][1], 0, 1), y0 = NODES[i][0], y1 = NODES[i + 1][0];
      return isLogSeg(y0, y1) ? y0 * Math.pow(y1 / y0, f) : lerp(y0, y1, f);
    }
  }
  return NODES[NODES.length - 1][0];
}
function pAt(y) {
  if (y <= NODES[0][0]) return 0;
  for (let i = 0; i < NODES.length - 1; i++) {
    const y0 = NODES[i][0], y1 = NODES[i + 1][0];
    if (y <= y1) {
      const f = isLogSeg(y0, y1) ? Math.log(y / y0) / Math.log(y1 / y0) : (y - y0) / (y1 - y0);
      return CUM[i] + f * NODES[i][1];
    }
  }
  return TOTAL;
}
// 표(연도→값)를 "시간 막대 위치" 기준으로 부드럽게 보간 (아주 먼 미래도 자연스럽게)
function makeTab(rows) { return rows.map(r => [pAt(r[0]), r[1]]); }
function tab(T, p) {
  if (p <= T[0][0]) return T[0][1];
  for (let i = 0; i < T.length - 1; i++)
    if (p <= T[i + 1][0]) return lerp(T[i][1], T[i + 1][1], (p - T[i][0]) / (T[i + 1][0] - T[i][0] || 1));
  return T[T.length - 1][1];
}
function tabColor(T, p) {
  if (p <= T[0][0]) return hexRgb(T[0][1]);
  for (let i = 0; i < T.length - 1; i++)
    if (p <= T[i + 1][0]) return mixHex(T[i][1], T[i + 1][1], (p - T[i][0]) / (T[i + 1][0] - T[i][0] || 1));
  return hexRgb(T[T.length - 1][1]);
}

// 한국어 숫자: 45억 6700만
function korNum(n) {
  if (n < 1e4) return Math.round(n).toLocaleString();
  const d = Math.pow(10, Math.floor(Math.log10(n)) - 2);
  n = Math.round(n / d) * d;
  const U = [[1e16, '경'], [1e12, '조'], [1e8, '억'], [1e4, '만']], parts = [];
  for (const [u, s] of U) { const q = Math.floor(n / u + 1e-9); if (q > 0) { parts.push(q + s); n -= q * u; } if (parts.length === 2) break; }
  return parts.join(' ');
}
function fmtYear(y) {
  const a = Math.abs(y);
  if (a < 3000) return '지금!';
  return korNum(a) + ' 년 ' + (y < 0 ? '전' : '후');
}

// ---------- 별·행성·사건 (지금 고른 별에 따라 바뀜) ----------
let T_SUNR, T_SUNC, T_SUNL, T_MASS, PLANETS = [], PL = {}, EVENTS = [], GBELTS = [];
let REF = 1; // 공전 속도 기준 거리
let GEXTRA = null;
// 생명 가능 지대 [안쪽 AU, 바깥쪽 AU, 언제부터, 언제까지]
const HZT = { solar: [0.95, 1.67, -4.5e9, 1e9], tauceti: [0.55, 1.6, -5.78e9, 9e9], trappist: [0.023, 0.05, -6.6e9, 4e12],
  alphacen: [1.2, 2.1, -5.29e9, 3.5e9], sirius: [4.8, 8.4, -2.29e8, 1e9] }; // 별마다 따로 있는 특별 장면 (태비의 별 먼지 덩어리 등)
const omega = a => Math.min(3.2, 1.1 / Math.pow(Math.max(a / REF, 0.15), 1.05)); // 화면용 공전 속도 (진짜보다 훨씬 빠름)

function loadSolar() {
  setNodes(SOLAR_NODES);
  // ---------- 태양 ----------
  T_SUNR = makeTab([ // 태양 반지름(AU). 지금 = 0.00465
    [-4.6e9, 0], [-4.592e9, 0], [-4.585e9, 0.03], [-4.567e9, 0.006], [0, 0.00465], [5e9, 0.0075],
    [7e9, 0.012], [7.3e9, 0.06], [7.45e9, 0.3], [7.5e9, 0.56], [7.55e9, 1.02], [7.59e9, 1.2],
    [7.594e9, 0.06], [7.7e9, 0.05], [7.8e9, 0.3], [7.88e9, 0.95], [7.9e9, 0.4], [7.92e9, 0.002], [7.95e9, 0.0000425]
  ]);
  T_SUNC = makeTab([
    [-4.59e9, '#7a2010'], [-4.58e9, '#ff5a2a'], [-4.567e9, '#fff0b0'], [0, '#fff3c4'], [5e9, '#ffe08a'],
    [7.3e9, '#ffa850'], [7.5e9, '#ff6a3a'], [7.59e9, '#ff4a28'], [7.594e9, '#ffd27a'], [7.7e9, '#ffc070'],
    [7.8e9, '#ff7040'], [7.88e9, '#ff5030'], [7.9e9, '#ffffff'], [7.95e9, '#cfe0ff'], [1e10, '#e8f0ff'],
    [1e12, '#fff0d0'], [1e14, '#ffb070'], [3e15, '#c04020'], [3e16, '#501810'], [1e17, '#1a1212']
  ]);
  T_SUNL = makeTab([ // 밝기(빛 번짐 크기)
    [-4.592e9, 0], [-4.585e9, 1.6], [-4.567e9, 0.8], [0, 1], [1e9, 1.1], [3.5e9, 1.4], [5e9, 1.6], [7e9, 2.4],
    [7.59e9, 6], [7.594e9, 2], [7.7e9, 2], [7.88e9, 5], [7.9e9, 3], [7.95e9, 1.2], [1e12, 0.5], [1e15, 0.15], [1e17, 0]
  ]);
  T_MASS = makeTab([[-1, 1], [7.3e9, 1], [7.59e9, 0.68], [7.8e9, 0.65], [7.95e9, 0.54]]);

  // ---------- 행성 ----------
  PLANETS = [
    // 수성: 처음엔 더 컸는데 충돌로 겉껍질이 날아가 작아졌다 (sz0 → sz)
    { id: 'mercury', n: '수성', col: '#b8b2aa', sz: 3.4, sz0: 4.4, shrink: -3.9e9, a0: 0.387, form: [-4.56e9, -4.54e9], engulf: 7.50e9 },
    { id: 'venus', n: '금성', col: '#e9c784', sz: 5, a0: 0.723, form: [-4.56e9, -4.54e9], engulf: 7.55e9 },
    // 수성 충돌 행성: 수성 바깥을 돌다가 궤도가 찌그러져 수성과 충돌
    { id: 'mimpact', n: '수성 충돌 행성', full: '수성 충돌 행성', col: '#8c7f9a', col2: '#5e5468', sz: 4.6, a0: 0.56,
      form: [-4.556e9, -4.546e9], crash: -3.9e9, hit: 'mercury', win: 0.025e9, deadMsg: '💥 수성과 부딪혀 부서졌어요',
      eT: makeTab([[-4.05e9, 0], [-3.93e9, 0.3]]), w: 0.5 },
    { id: 'earth', n: '지구', col: '#2e7bd1', sz: 5.5, a0: 1, form: [-4.56e9, -4.54e9], engulf: 7.59e9 },
    // 테이아: 지구 앞 60도 자리(트로이 자리)에서 돌다가 -45.1억 년에 지구와 충돌 → 달
    { id: 'theia', n: '테이아', full: '테이아', col: '#a07a60', col2: '#6a4a3a', sz: 4.3, a0: 1, form: [-4.556e9, -4.546e9],
      crash: -4.51e9, hit: 'earth', trojan: true, deadMsg: '💥 지구와 부딪혀서 달이 되었어요' },
    { id: 'mars', n: '화성', col: '#d4683f', sz: 3.9, a0: 1.524, form: [-4.562e9, -4.55e9], eject: 6e16 },
    // 5번째 암석행성(행성 V): 화성과 소행성대 사이 → 궤도가 흔들리다 태양으로 떨어짐
    { id: 'planetv', n: '행성 V', full: '5번째 암석행성 (행성 V)', col: '#9a8f86', col2: '#6f5f55', sz: 3.6, a0: 1.9,
      form: [-4.556e9, -4.546e9], crash: -3.95e9, hit: 'venus', win: 0.035e9, deadMsg: '💥 금성과 부딪혀 사라졌어요',
      eT: makeTab([[-4.1e9, 0], [-3.97e9, 0.55]]) },
    { id: 'jupiter', n: '목성', col: '#d8a56e', sz: 12, form: [-4.5695e9, -4.566e9], eject: 3e16,
      aT: makeTab([[-4.566e9, 3.5], [-4.562e9, 1.5], [-4.556e9, 5.45], [-4.1e9, 5.45], [-3.85e9, 5.2]]) },
    { id: 'saturn', n: '토성', col: '#e4cc8e', sz: 10, form: [-4.569e9, -4.565e9], eject: 1e16,
      aT: makeTab([[-4.566e9, 4.6], [-4.562e9, 2.0], [-4.556e9, 7.6], [-4.1e9, 7.6], [-3.85e9, 9.54]]) },
    { id: 'uranus', n: '천왕성', col: '#a4e2ea', sz: 7, form: [-4.567e9, -4.56e9], eject: 5e15,
      aT: makeTab([[-4.1e9, 14], [-3.95e9, 16.5], [-3.85e9, 19.2]]) },
    { id: 'neptune', n: '해왕성', col: '#4f72f0', sz: 7, form: [-4.567e9, -4.56e9], eject: 2e15,

  extra: () => {
    const clumps = [];
    for (let i = 0; i < 9; i++) {
      const pts = [];
      const n = 40 + (Math.random() * 50 | 0), big = rnd(0.5, 1.6);
      for (let k = 0; k < n; k++) pts.push([rnd(-1, 1) * 26 * big, rnd(-1, 1) * 10 * big, Math.random()]);
      clumps.push({ a: rnd(0.55, 1.8), e: rnd(0.2, 0.6), w: rnd(0, 6.283), th: rnd(0, 6.283), big, op: rnd(0.25, 0.9), pts });
    }
    const panels = [];
    for (let i = 0; i < 140; i++) panels.push({ a: rnd(0.12, 0.3), th: rnd(0, 6.283), ring: i % 5, s: rnd(0.6, 1.2) });
    const hist = [];
    let dipNow = 0;
    const rAt = (c, th) => c.a * (1 - c.e * c.e) / (1 + c.e * Math.cos(th - c.w));
    return {
      update(dt, y) {
        const on = y > -1e5 && y < 1.95e9;
        let block = 0;
        const Rw = sunDisp(tab(T_SUNR, P)) / S; // 별 반지름(화면 세계 단위)
        if (on) for (const c of clumps) {
          const r = rAt(c, c.th);
          c.th += omega(c.a) * dt * Math.pow(c.a / r, 2) * 0.6;
          c.x = wx(r, c.th); c.y = wy(r, c.th);
          // 지구는 화면 아래쪽 방향 → 별보다 아래(y>0)에서 별 앞을 지나가면 빛을 가린다
          const half = 0.12 * c.big + Rw;
          if (c.y > 0 && Math.abs(c.x) < half) block += c.op * 0.22 * c.big * (1 - Math.abs(c.x) / half);
        }
        if (TABBY_ALIEN && y < 1.95e9) for (const p of panels) {
          p.th += omega(p.a) * dt * 0.5;
          const x = wx(p.a, p.th + p.ring * 0.4), yy = wy(p.a, p.th + p.ring * 0.4);
          if (yy > 0 && Math.abs(x) < Rw) block += 0.012 * p.s;
        }
        dipNow = clamp(block, 0, 0.6);
        hist.push(1 - dipNow + (Math.random() - 0.5) * 0.004);
        if (hist.length > 360) hist.shift();
      },
      draw(y) {
        if (y > -1e5 && y < 1.95e9) {
          const al = ss(-1e5, -5e4, y);
          for (const c of clumps) {
            const X = sx(c.x), Y = sy(c.y), z = Math.sqrt(zoom), ang = Math.atan2(c.y, c.x) + Math.PI / 2;
            const ca = Math.cos(ang), sa = Math.sin(ang);
            for (const [dx, dy, s] of c.pts) {
              ctx.fillStyle = `rgba(${150 + s * 60 | 0},${120 + s * 40 | 0},${100 + s * 30 | 0},${al * c.op * (0.35 + s * 0.4)})`;
              ctx.fillRect(X + (dx * ca - dy * sa) * z, Y + (dx * sa + dy * ca) * z, 2, 2);
            }
          }
        }
        if (TABBY_ALIEN && y < 1.95e9) {
          for (const p of panels) {
            const th = p.th + p.ring * 0.4, X = sx(wx(p.a, th)), Y = sy(wy(p.a, th));
            ctx.save(); ctx.translate(X, Y); ctx.rotate(th);
            const glint = 0.5 + 0.5 * Math.sin(clock * 3 + p.a * 40);
            ctx.fillStyle = `rgba(${150 + glint * 100 | 0},${170 + glint * 80 | 0},255,.9)`;
            const w = 7 * p.s * Math.sqrt(zoom), h = 3 * p.s * Math.sqrt(zoom);
            ctx.fillRect(-w / 2, -h / 2, w, h);
            ctx.restore();
          }
          label('👽 상상 모드: 외계인 거대 구조물 (진짜 증거는 없어요!)', W / 2, 92, '#9fffb0');
        }
        // 지구로 가는 빛길 (여기를 지나가는 것이 별빛을 가린다)
        const Rs = Math.max(sunDisp(tab(T_SUNR, P)), 3);
        const g = ctx.createLinearGradient(0, sy(0), 0, H);
        g.addColorStop(0, 'rgba(160,200,255,.10)'); g.addColorStop(1, 'rgba(160,200,255,0)');
        ctx.fillStyle = g; ctx.fillRect(sx(0) - Rs, sy(0), Rs * 2, H - sy(0));
        // 지구 방향 표시
        label('↓ 지구는 이쪽 (1,470광년)', sx(0), Math.min(H - 140, sy(0) + dist(fitAU) * S * 0.95), '#9fc8ff');
      },
      drawUI(y) {
        // 왼쪽 아래 밝기 그래프
        const x0 = 12, y0 = H - 240, w = 290, h = 96;
        ctx.fillStyle = 'rgba(8,12,34,.85)'; ctx.fillRect(x0, y0, w, h);
        ctx.strokeStyle = '#4a5aa8'; ctx.lineWidth = 1.5; ctx.strokeRect(x0, y0, w, h);
        ctx.font = 'bold 12px "Malgun Gothic"'; ctx.textAlign = 'left'; ctx.fillStyle = '#cfd6ff';
        ctx.fillText('📉 지구에서 본 별빛 밝기  지금 ' + Math.round((1 - dipNow) * 100) + '%', x0 + 8, y0 + 16);
        const gy = v => y0 + 26 + (1 - v) / 0.35 * (h - 34);
        ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.moveTo(x0 + 6, gy(1)); ctx.lineTo(x0 + w - 6, gy(1)); ctx.stroke();
        ctx.fillStyle = 'rgba(160,170,220,.7)'; ctx.font = '10px "Malgun Gothic"';
        ctx.fillText('100%', x0 + w - 32, gy(1) - 3); ctx.fillText('78%', x0 + w - 28, gy(0.78) - 3);
        ctx.strokeStyle = TABBY_ALIEN ? '#9fffb0' : '#ffd36a'; ctx.lineWidth = 1.6; ctx.beginPath();
        hist.forEach((v, i) => { const X = x0 + 6 + i / 360 * (w - 12), Y = gy(clamp(v, 0.65, 1.01)); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
        ctx.stroke();
      },
    };
  },
};

function sunDisp(R) { // 태양 크기(화면용): 작을 땐 덜 작게 보이게
  if (R <= 0) return 0;
  if (SYS !== 'solar') return S * dist(R) * (R < 0.01 ? Math.pow(R / 0.01, 0.25) : 1);
  return R > 0.05 ? S * dist(R) : S * dist(0.05) * Math.pow(R / 0.05, 0.3);
}

// 각 행성의 지금 거리(AU)
function planetA(Pl, y, p) {
  let a = Pl.aT ? tab(Pl.aT, p) : Pl.a0;
  a /= tab(T_MASS, p);
  if (Pl.engulf) {
    const R = tab(T_SUNR, p);
    a = lerp(a, R * 0.92, ss(Pl.engulf - (Pl.ew || 0.025e9), Pl.engulf, y));
  }
  if (Pl.eject && y > Pl.eject) a *= 1 + clamp(Math.log10(y / Pl.eject) / 0.5, 0, 1) * 25;
  return a;
}

// ---------- 매 프레임 계산 ----------
function update(dt) {
  clock += dt;
  if (playing) {
    let sp = speed * (slowT > 0 ? 0.35 : 1);
    P += dt * sp;
    if (P >= TOTAL) { P = TOTAL; playing = false; setPlayBtn(); if (!ended) { ended = true; setTimeout(showEnd, 1800); } }
  }
  slowT -= dt;
  const y = yearAt(P);

  // 사건 통과 체크
  if (y > lastY) {
    let last = null;
    for (const E of EVENTS) if (E.y > lastY && E.y <= y) { last = E; fire(E); }
    if (last) showCaption(last);
  }
  lastY = y;

  // 행성 이동
  for (const Pl of PLANETS) {
    Pl.a = planetA(Pl, y, P);
    const born = ss(Pl.form[0], Pl.form[1], y);
    Pl.alive = born > 0 && !(Pl.engulf && y >= Pl.engulf) && !(Pl.crash && y >= Pl.crash);
    if (Pl.mine) {
      const eaten = tab(T_SUNR, P) > Pl.a * 0.95;
      if (eaten && Pl.alive) {
        if (Pl.wasAlive) { fx.push({ x: Pl.x, y: Pl.y, t: 0, dur: 1.6, r: 40, c: [255, 160, 60] }); sfx('gulp'); toast('😱 내 행성이 별에 삼켜졌어!'); Pl.eatenAt = y; }
        Pl.alive = false;
      }
    }
    let vis = born;
    if (Pl.eject && y > Pl.eject) vis *= 1 - clamp(Math.log10(y / Pl.eject) / 0.45, 0, 1);
    if (Pl.leave) vis *= 1 - ss(Pl.leave[0], Pl.leave[1], y);
    Pl.szNow = Pl.sz0 && y < Pl.shrink ? Pl.sz0 : Pl.sz;
    if (Pl.look) { Pl.lk = Pl.look(y); Pl.szNow = Pl.lk.sz; }
    if (vis <= 0.01) Pl.alive = false;
    Pl.vis = vis;
    // 찌그러진 궤도(타원): 태양에 가까울 땐 빨리, 멀 땐 천천히
    Pl.e = Pl.eT ? tab(Pl.eT, P) : (Pl.e0 || 0);
    const rAt = th => Pl.a * (1 - Pl.e * Pl.e) / (1 + Pl.e * Math.cos(th - (Pl.w || 0)));
    if (Pl.trojan) {
      // 테이아: 지구 앞 60도에 있다가 지구 쪽으로 미끄러져 온다
      const E = PL.earth;
      Pl.th = E.th + lerp(1.047, 0, ss(-4.535e9, -4.51e9, y));
      Pl.r = Pl.a * (1 + 0.06 * ss(-4.535e9, -4.515e9, y) * Math.sin(clock * 3));
    } else {
      Pl.r = rAt(Pl.th);
      Pl.th += omega(Pl.a) * dt * Math.pow(Pl.a / Pl.r, 2);
    }
    if (Pl.wasAlive && !Pl.alive && Pl.engulf && y >= Pl.engulf)
    { fx.push({ x: wx(Pl.r, Pl.th), y: wy(Pl.r, Pl.th), t: 0, dur: 1.6, r: 40, c: [255, 160, 60] }); sfx('gulp'); }
    Pl.wasAlive = Pl.alive;
    Pl.x = wx(Pl.r, Pl.th); Pl.y = wy(Pl.r, Pl.th);
    Pl.rAt = rAt;
    // 충돌하러 가는 행성: 마지막엔 부딪힐 행성 쪽으로 끌려간다
    if (Pl.hit && !Pl.trojan) {
      const T = PL[Pl.hit], f = ss(Pl.crash - Pl.win, Pl.crash, y);
      if (f > 0) { Pl.x = lerp(Pl.x, T.x, f); Pl.y = lerp(Pl.y, T.y, f); Pl.r = Math.hypot(Pl.x, Pl.y) ** (1 / EXP); }
    }
    if (Pl.wasCrash === false && Pl.crash && y >= Pl.crash && y - Pl.crash < 0.03e9) { // 멀리 건너뛸 땐 터지지 않게
      sfx('boom');
      if (!Pl.hit) fx.push({ x: Pl.x, y: Pl.y, t: 0, dur: 2.2, r: 70, c: [255, 220, 170] });
      else fx.push({ follow: Pl.hit, t: 0, dur: 2.2, r: 70, c: [255, 240, 200] });
      if (Pl.hit) for (let i = 0; i < 90; i++) debris.push({ on: Pl.hit, ang: Math.random() * 6.283, r: rnd(4, 10), vr: rnd(10, 40), w: rnd(2, 5), t: 0, dur: rnd(2, 4) });
    }
    Pl.wasCrash = !!(Pl.crash && y >= Pl.crash);
  }
  if (SYS === 'solar') {
    for (const d of disk) d.th += omega(d.a) * dt;
    for (const b of belt) b.th += omega(b.a) * dt;
    for (const o of outer) o.th += omega(lerp(o.a0, o.a1, 0.5)) * dt * 0.8;
  }
  for (const g of GBELTS) for (const q of g.pts) q.th += omega(q.a) * dt * 0.7;
  if (GEXTRA) GEXTRA.update(dt, y);

  // 후기 대폭격: 혜성이 쏟아진다
  if (SYS === 'solar' && playing && y > -4.1e9 && y < -3.8e9 && Math.random() < dt * 9) {
    const ids = ['earth', 'earth', 'mars', 'venus', 'mercury', 'earth'];
    const th = Math.random() * 6.283;
    comets.push({ sx: wx(32, th), sy: wy(32, th), tid: ids[(Math.random() * ids.length) | 0], t: 0, dur: rnd(2.2, 3.6), big: false, moon: Math.random() < 0.3 });
  }
  for (const c of comets) {
    c.t += dt;
    if (c.t >= c.dur && !c.done) {
      c.done = true;
      const T = targetPos(c);
      if (T) fx.push({ x: T[0], y: T[1], t: 0, dur: c.big ? 2.5 : 0.7, r: c.big ? 40 : 12, c: [255, 220, 150], follow: c.tid });
      if (T) sfx(c.big ? 'boom' : 'thud');
      if (T && c.tid === 'earth' && meteor.on) meteor.hit++;
    }
  }
  comets = comets.filter(c => !c.done);
  // 운석 막기 미니게임: 후기 대폭격 동안
  const lhb = SYS === 'solar' && y > -4.1e9 && y < -3.8e9;
  if (lhb && !meteor.on) { meteor = { on: true, blocked: 0, hit: 0 }; }
  if (!lhb && meteor.on) {
    meteor.on = false;
    if (y >= -3.8e9) toast('☄️ 운석 막기 끝! 막은 것 ' + meteor.blocked + '개, 지구에 떨어진 것 ' + meteor.hit + '개');
  }
  for (const f of fx) f.t += dt;
  fx = fx.filter(f => f.t < f.dur);
  for (const d of debris) { d.t += dt; d.ang += d.w * dt; d.r += d.vr * dt; d.vr *= 0.97; }
  debris = debris.filter(d => d.t < d.dur);

  // 화면 크기 자동 맞추기
  let target;
  if (SYS !== 'solar') {
    // 보이는 행성과 별 크기에 맞춰 자동으로
    target = SD().fitMin;
    for (const Pl of PLANETS) if (Pl.alive && Pl.vis > 0.5 && !Pl.noFit) target = Math.max(target, Math.max(Pl.r, Pl.a * (1 + Pl.e)) * 1.15);
    target = Math.max(target, tab(T_SUNR, P) * 1.5);
    if (y > 1e15) target = Math.min(target, fitAU);
  }
  else if (y < -4.57e9) target = 40;
  else if (y < -4.555e9) target = 11;
  else if (y < -4.1e9) target = 17;
  else if (y < 7.3e9) target = 33;
  else if (y < 1e15) target = 33 / tab(T_MASS, P);
  else target = fitAU;
  fitAU += (target - fitAU) * Math.min(1, dt * 1.2);
  TK += ((tiltOn ? 0.38 : 1) - TK) * Math.min(1, dt * 3);
  flashT = Math.max(0, flashT - dt * 0.5);
  S = Math.min(W, (H - 120) / Math.max(TK, 0.55)) * 0.46 / dist(fitAU) * zoom;

  if (follow && PL[follow] && PL[follow].alive) { camX = -PL[follow].x; camY = -PL[follow].y; }
  else if (follow === 'sun') { camX *= 0.9; camY *= 0.9; }
}

function targetPos(c) {
  const Pl = PL[c.tid];
  if (!Pl || !Pl.alive) return null;
  return [Pl.x, Pl.y];
}

// 사건이 일어날 때 특별한 장면
function fire(E) {
  if (!got.has(dk(E.i))) { got.add(dk(E.i)); saveDex(); sfx('ding'); toast('📖 새 사건 카드! ' + E.e + ' ' + E.t + '  (' + dexCount() + '/' + EVENTS.length + ')'); updateDexN(); }
  slowT = 1.6;
  const ear = PL.earth;
  if (E.t.startsWith('공룡 멸종')) {
    const th = ear.th + 1.2;
    comets.push({ sx: ear.x + Math.cos(th) * 1.4, sy: ear.y + Math.sin(th) * 1.4, tid: 'earth', t: 0, dur: 1.2, big: true });
  }
  if (E.t === '헬륨 섬광') { fx.push({ x: 0, y: 0, t: 0, dur: 1.5, r: 160, c: [255, 255, 220] }); sfx('boom'); }
  if (E.fx === 'super') { // 초신성!
    fx.push({ x: 0, y: 0, t: 0, dur: 5, r: 700, c: [255, 255, 240] });
    fx.push({ x: 0, y: 0, t: 0, dur: 3, r: 300, c: [255, 180, 120] });
    flashT = 1; slowT = 4; sfx('big');
  }
  if (E.t === '행성상 성운') fx.push({ x: 0, y: 0, t: 0, dur: 2, r: 120, c: [180, 255, 240] });
}

// ---------- 그리기 ----------
function draw() {
  const y = yearAt(P);
  ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);

  // 별
  for (const s of stars) {
    const a = 0.35 + 0.5 * s.b + 0.25 * Math.sin(clock * 1.5 + s.tw);
    ctx.fillStyle = `rgba(220,230,255,${clamp(a, 0, 1) * 0.55})`;
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  drawAndromeda(y);

  const R = tab(T_SUNR, P);

  // 다른 별의 원반·띠
  for (const g of GBELTS) {
    const al = ss(g.on[0], g.on[1], y) * (1 - ss(g.off[0], g.off[1], y));
    if (al <= 0.01) continue;
    const M = tab(T_MASS, P);
    for (const q of g.pts) {
      const X = sx(wx(q.a / M, q.th)), Y = sy(wy(q.a / M, q.th));
      if (X < -5 || X > W + 5 || Y < -5 || Y > H + 5) continue;
      ctx.fillStyle = rgba(g.col, al * (0.3 + q.s * 0.5));
      ctx.fillRect(X, Y, 1.8, 1.8);
    }
  }
  // 분자구름 / 원반 (태양계)
  const diskA = SYS !== 'solar' ? 0 : y < -4.565e9 ? 1 : 1 - ss(-4.565e9, -4.535e9, y);
  if (diskA > 0) {
    const k = ss(-4.6e9, -4.575e9, y); // 0 = 아직 구름, 1 = 납작한 원반
    for (const d of disk) {
      const r = dist(d.a) * lerp(d.cloud, 1, k);
      const th = lerp(d.ca, d.th, k);
      const X = sx(r * Math.cos(th)), Y = sy(r * Math.sin(th));
      if (X < -5 || X > W + 5 || Y < -5 || Y > H + 5) continue;
      ctx.fillStyle = rgba(k < 0.5 ? [190, 130, 200] : d.c, diskA * (0.4 + d.s * 0.5));
      ctx.fillRect(X, Y, 2, 2);
    }
  }
  // 소행성대
  const beltA = SYS !== 'solar' ? 0 : ss(-4.556e9, -4.54e9, y) * (y > 7.95e9 ? 1 - ss(1e15, 1e16, y) * 0.8 : 1);
  if (beltA > 0) for (const b of belt) {
    const a = b.a / tab(T_MASS, P);
    ctx.fillStyle = `rgba(190,170,150,${beltA * (0.35 + b.s * 0.4)})`;
    ctx.fillRect(sx(wx(a, b.th)), sy(wy(a, b.th)), 1.5, 1.5);
  }
  // 바깥 얼음 띠 → 카이퍼 띠
  const outA = SYS !== 'solar' ? 0 : ss(-4.56e9, -4.54e9, y);
  if (outA > 0) {
    const n = ss(-4.1e9, -3.85e9, y), M = tab(T_MASS, P);
    for (const o of outer) {
      const f = ss(o.d * 0.5, o.d * 0.5 + 0.5, n);
      const a = lerp(o.a0, o.a1, f) / M;
      const al = o.keep ? 1 : 1 - f;
      if (al <= 0.02) continue;
      ctx.fillStyle = `rgba(170,210,255,${outA * al * (0.3 + o.s * 0.4)})`;
      ctx.fillRect(sx(wx(a, o.th)), sy(wy(a, o.th)), 1.5, 1.5);
    }
  }

  // 생명 가능 지대 (물이 액체로 있을 수 있는 거리) - 초록 띠
  const HZ = HZT[SYS];
  if (showOrbit && HZ && y > HZ[2] && y < HZ[3]) {
    const r0 = dist(HZ[0]) * S, r1 = dist(HZ[1]) * S;
    ctx.fillStyle = 'rgba(80,220,120,.08)';
    ctx.beginPath(); ctx.ellipse(sx(0), sy(0), r1, r1 * TK, 0, 0, 6.283); ctx.ellipse(sx(0), sy(0), r0, r0 * TK, 0, 0, 6.283); ctx.fill('evenodd');
    if (showNames) label('생명 가능 지대', sx(0), sy(0) - r1 * TK - 6, '#7fe08f');
  }
  // 궤도선
  if (showOrbit) {
    for (const Pl of PLANETS) if (Pl.alive) {
      ctx.strokeStyle = selected === Pl.id ? 'rgba(255,220,120,.55)' : `rgba(150,170,255,${0.18 * Pl.vis})`;
      ctx.lineWidth = selected === Pl.id ? 1.6 : 1;
      ctx.beginPath();
      if (Pl.e > 0.01 && Pl.rAt) {
        for (let i = 0; i <= 120; i++) { const t = i / 120 * 6.283, rr = Pl.rAt(t);
          i ? ctx.lineTo(sx(wx(rr, t)), sy(wy(rr, t))) : ctx.moveTo(sx(wx(rr, t)), sy(wy(rr, t))); }
      } else if (!Pl.crash) ctx.ellipse(sx(0), sy(0), dist(Pl.a) * S, dist(Pl.a) * S * TK, 0, 0, 6.283);
      ctx.stroke();
    }
  }

  drawNebula(y);
  if (TK < 0.95) for (const Pl of PLANETS) if (Pl.alive && Pl.y < 0) drawPlanet(Pl, y); // 별 뒤쪽 행성
  drawSun(y, R);
  if (GEXTRA) GEXTRA.draw(y);

  // 행성 (별 앞쪽)
  for (const Pl of PLANETS) if (Pl.alive && !(TK < 0.95 && Pl.y < 0)) drawPlanet(Pl, y);
  // 화면 밖에 있는 행성은 가장자리에 화살표로 알려 준다
  for (const Pl of PLANETS) {
    if (!Pl.alive || Pl.vis < 0.3) continue;
    const X = Pl.sX, Y = Pl.sY, m = 30;
    if (X > m && X < W - m && Y > m && Y < H - 130) continue;
    const cx = W / 2, cy = H / 2 - 30, dx = X - cx, dy = Y - cy;
    const k = Math.min((W / 2 - m) / Math.abs(dx || 1), (H / 2 - 110) / Math.abs(dy || 1));
    const ax = cx + dx * k, ay = cy + dy * k, ang = Math.atan2(dy, dx);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.fillStyle = Pl.full ? '#ffcf9a' : '#aab8ff';
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
    label(Pl.n + ' ' + fmtAU(Pl.r) + 'AU', clamp(ax - Math.cos(ang) * 22, 70, W - 70), ay - Math.sin(ang) * 22 + 4, Pl.full ? '#ffcf9a' : '#aab8ff');
  }

  // 파편
  for (const d of debris) {
    const E = PL[d.on || 'earth'], X = sx(E.x) + Math.cos(d.ang) * d.r, Y = sy(E.y) + Math.sin(d.ang) * d.r;
    ctx.fillStyle = `rgba(255,${180 + Math.random() * 60 | 0},120,${1 - d.t / d.dur})`;
    ctx.fillRect(X, Y, 2, 2);
  }
  // 혜성
  for (const c of comets) {
    const T = targetPos(c) || [c.sx * 0.1, c.sy * 0.1];
    const f = c.t / c.dur, e = f * f;
    const x = lerp(c.sx, T[0], e), yy = lerp(c.sy, T[1], e);
    const X = sx(x), Y = sy(yy);
    c.sX = X; c.sY = Y;
    const bx = sx(lerp(c.sx, T[0], Math.max(0, e - 0.08))), by = sy(lerp(c.sy, T[1], Math.max(0, e - 0.08)));
    const g = ctx.createLinearGradient(bx, by, X, Y);
    g.addColorStop(0, 'rgba(150,200,255,0)'); g.addColorStop(1, c.big ? 'rgba(255,200,120,1)' : 'rgba(200,230,255,.9)');
    ctx.strokeStyle = g; ctx.lineWidth = c.big ? 4 : 2;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(X, Y); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(X, Y, c.big ? 3 : 1.6, 0, 6.283); ctx.fill();
  }
  // 번쩍
  for (const f of fx) {
    let X, Y;
    if (f.follow && PL[f.follow]) { X = sx(PL[f.follow].x); Y = sy(PL[f.follow].y); }
    else { X = sx(f.x); Y = sy(f.y); }
    const k = f.t / f.dur, rr = f.r * (0.3 + k) * Math.sqrt(zoom);
    const g = ctx.createRadialGradient(X, Y, 0, X, Y, rr);
    g.addColorStop(0, rgba(f.c, 1 - k)); g.addColorStop(1, rgba(f.c, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, rr, 0, 6.283); ctx.fill();
  }

  if (GEXTRA) GEXTRA.drawUI(y);
  if (meteor.on) {
    const x0 = 12, y0 = H / 2 - 40;
    ctx.fillStyle = 'rgba(40,20,10,.85)'; ctx.fillRect(x0, y0, 230, 58);
    ctx.strokeStyle = '#ff9a50'; ctx.lineWidth = 2; ctx.strokeRect(x0, y0, 230, 58);
    ctx.textAlign = 'left'; ctx.font = 'bold 14px "Malgun Gothic"'; ctx.fillStyle = '#ffd36a';
    ctx.fillText('☄️ 운석 막기! 혜성을 눌러!', x0 + 10, y0 + 22);
    ctx.font = '13px "Malgun Gothic"'; ctx.fillStyle = '#fff';
    ctx.fillText('막은 것 ' + meteor.blocked + '  ·  지구에 떨어진 것 ' + meteor.hit, x0 + 10, y0 + 44);
  }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,245,${flashT * 0.9})`; ctx.fillRect(0, 0, W, H); }
  // 거리 눈금 안내
  ctx.fillStyle = 'rgba(160,170,220,.6)'; ctx.font = '12px "Malgun Gothic"'; ctx.textAlign = 'left';
  ctx.fillText('※ 거리는 줄여서 그렸어요 (바깥쪽일수록 더 많이 줄임)', 12, H - 112);
}

const fmtAU = r => r < 0.1 ? r.toFixed(4) : r < 3 ? r.toFixed(2) : r < 100 ? r.toFixed(1) : Math.round(r);
function drawPlanet(Pl, y) {
  const X = sx(Pl.x), Y = sy(Pl.y);
  const r = Pl.szNow * Math.sqrt(zoom) * (0.35 + 0.65 * Pl.vis);
  Pl.sX = X; Pl.sY = Y; Pl.sR = r;
  ctx.globalAlpha = clamp(Pl.vis * 1.2, 0, 1);
  if (Pl.id === 'earth') {
    const [c1, c2] = earthLook(y);
    drawBall(X, Y, r, c1, c2, Pl.th);
    drawMoon(y, X, Y, r);
  } else if (Pl.id === 'jupiter') drawJupiter(X, Y, r, Pl.th);
  else if (Pl.id === 'saturn') drawSaturn(X, Y, r, Pl.th);
  else if (Pl.star) drawStarBall(X, Y, r, Pl.lk ? Pl.lk.col : Pl.col, Pl.lk && Pl.lk.glow !== undefined ? Pl.lk.glow : (Pl.glow || 1));
  else if (Pl.lk) drawBall(X, Y, r, Pl.lk.col, Pl.lk.col2, Pl.th);
  else drawBall(X, Y, r, Pl.col, Pl.col2 || null, Pl.th);
  ctx.globalAlpha = 1;
  if (dist(Pl.r) * S < SUN_R) { // 별 속에 있을 때도 보이게 테두리
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(X, Y, r + 3, 0, 6.283); ctx.stroke();
  }
  if (selected === Pl.id) {
    ctx.strokeStyle = '#ffd36a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(X, Y, r + 6 + Math.sin(clock * 5) * 1.5, 0, 6.283); ctx.stroke();
  }
  if (showNames) label(Pl.n, X, Y + r + 13, Pl.full ? '#ffcf9a' : '#dfe6ff');
}
// 짝꿍 별 (시리우스 B, 알파 센타우리 B 같은 별)
function drawStarBall(X, Y, r, col, glow) {

function drawBall(X, Y, r, c1, c2, th) {

function drawSun(y, R) {

    const g = ctx.createRadialGradient(X, Y, 0, X, Y, S * 2.5);
    g.addColorStop(0, 'rgba(200,90,60,.35)'); g.addColorStop(1, 'rgba(60,30,80,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, S * 2.5, 0, 6.283); ctx.fill();
  }
  if (disp <= 0) return;
  if (L > 0.01) {

    const g = ctx.createRadialGradient(X, Y, disp * 0.6, X, Y, gr);
    g.addColorStop(0, rgba(col, Math.min(0.75, 0.3 + L * 0.1))); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, gr, 0, 6.283); ctx.fill();

  const hot = L > 0.05 ? [Math.min(255, col[0] + 50), Math.min(255, col[1] + 50), Math.min(255, col[2] + 50)] : col;
  g2.addColorStop(0, rgba(hot, 1)); g2.addColorStop(1, rgba(col, 1));

    ctx.strokeStyle = rgba([255, 200, 120], 0.25); ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 160; i++) {
      const a = i / 160 * 6.283, w = r * (1 + 0.025 * Math.sin(a * 7 + clock * 2) + 0.015 * Math.sin(a * 13 - clock * 3));
      i ? ctx.lineTo(X + Math.cos(a) * w, Y + Math.sin(a) * w) : ctx.moveTo(X + Math.cos(a) * w, Y + Math.sin(a) * w);
    }
    ctx.stroke();

function nebulaList() {

}
function drawNebula(y) { for (const nb of nebulaList()) drawOneNebula(y, nb); }
function drawOneNebula(y, nb) {
  if (y < nb.y0 || P > pAt(nb.y1)) return;
  const f = clamp((P - pAt(nb.y0)) / (pAt(nb.y1) - pAt(nb.y0)), 0, 1);
  const al = Math.pow(1 - f, 1.3) * 0.75;
  if (al <= 0.01) return;
  const c = nb.on && PL[nb.on] ? PL[nb.on] : null;
  const X = sx(c ? c.x : 0), Y = sy(c ? c.y : 0), rr = dist(1 + f * (nb.au || 70)) * S;
  const lobes = nb.cols || [[0, 1, 0.75, '120,255,230'], [0.6, 0.85, 1, '255,90,140'], [2.1, 0.95, 0.8, '140,150,255']];
  for (const [rot, sxk, syk, cc] of lobes) {
    ctx.save(); ctx.translate(X, Y); ctx.scale(1, TK); ctx.rotate(rot + clock * 0.03); ctx.scale(sxk, syk);
    const g = ctx.createRadialGradient(0, 0, rr * 0.55, 0, 0, rr);
    g.addColorStop(0, `rgba(${cc},0)`); g.addColorStop(0.75, `rgba(${cc},${al * 0.6})`); g.addColorStop(1, `rgba(${cc},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}

function drawAndromeda(y) {
  if (y < -1e9) return;
  const g = ss(0, 4.5e9, y);
  const after = ss(4.5e9, 5.5e9, y) * (1 - ss(5e11, 1e14, y));
  if (y < 4.5e9) {
    const X = W * 0.15, Y = H * 0.28, r = 12 + g * Math.min(W, H) * 0.35;
    ctx.save(); ctx.translate(X, Y); ctx.rotate(-0.6); ctx.scale(1, 0.38);
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    gr.addColorStop(0, 'rgba(255,240,220,.55)'); gr.addColorStop(0.25, 'rgba(200,190,255,.22)'); gr.addColorStop(1, 'rgba(120,120,220,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();

  const mx = (e.clientX - W / 2) / S - camX, my = (e.clientY - H / 2) / (S * TK) - camY;
  zoom = clamp(zoom * k, 0.2, 40);
  const S2 = S * k;
  if (!follow) { camX = (e.clientX - W / 2) / S2 - mx; camY = (e.clientY - H / 2) / (S2 * TK) - my; }
}, { passive: false });

function pick(X, Y) {
  if (placing) { placeMine(X, Y); return; }
  // 혜성 부수기
  for (const c of comets) if (!c.done && c.sX !== undefined && Math.hypot(X - c.sX, Y - c.sY) < 20) {
    c.done = true; c.zapped = true;
    fx.push({ x: (c.sX - W / 2) / S - camX, y: (c.sY - H / 2) / (S * TK) - camY, t: 0, dur: 0.5, r: 18, c: [150, 220, 255] });
    sfx('zap');
    if (meteor.on) meteor.blocked++;
    if (c.big) toast('🦖 공룡을 구했어! (하지만 진짜 역사에서는 소행성이 떨어졌어요)');
    return;
  }
  let best = null, bd = 1e9;
  for (const Pl of PLANETS) if (Pl.alive && Pl.sX !== undefined) {
    const d = Math.hypot(X - Pl.sX, Y - Pl.sY) - Pl.sR;
    if (d < 14 && d < bd) { bd = d; best = Pl.id; }
  }
  const ds = Math.hypot(X - sx(0), Y - sy(0));
  if (!best && ds < Math.max(SUN_R, 12) + 8) best = 'sun';
  selected = best;
  showInfo();
}

  if (i >= qs.length) {
    const st = score >= 10 ? '⭐⭐⭐ 우주 박사!' : score >= 7 ? '⭐⭐ 천문학자!' : score >= 4 ? '⭐ 우주 탐험가' : '우주 새싹 🌱 다시 구경해 보자!';
    mbox.innerHTML = `<h2>퀴즈 끝!</h2><div class="q">${qs.length}문제 중 ${score}개 맞았어요<br>${st}</div>
      <p><button onclick="startQuiz()">다시 풀기</button> <button onclick="closeModal()">닫기</button></p>`;
    return;
  }
  const [q, opts] = qs[i];
  const shuffled = opts.map((o, k) => [o, k === 0]).sort(() => Math.random() - 0.5);
  mbox.innerHTML = `<h2>❓ 퀴즈 ${i + 1} / ${qs.length} <span style="float:right;font-size:16px">맞힌 개수 ${score}</span></h2>
    <div class="q">${q}</div><div class="opts">${shuffled.map((o, k) => `<button data-k="${k}">${o[0]}</button>`).join('')}</div>
    <p style="text-align:right"><button onclick="closeModal()">그만하기</button></p>`;
  mbox.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    const ok = shuffled[+b.dataset.k][1];
    mbox.querySelectorAll('.opts button').forEach((x, k) => { x.disabled = true; if (shuffled[k][1]) x.classList.add('ok'); });
    if (!ok) b.classList.add('bad'); else quiz.score++;
    setTimeout(() => { quiz.i++; showQ(); }, ok ? 800 : 1600);
  });
}
function showEnd() {
  mbox.innerHTML = `<h2>⚫ ${SD().name} 이야기 끝!</h2>
    <div class="q">${SD().end}</div>
    <p>모은 사건 카드: <b>${dexCount()} / ${EVENTS.length}</b></p>
    ${PL.mine ? `<p style="font-size:18px">${PL.mine.eatenAt !== undefined ? '😢 내 행성은 ' + fmtYear(PL.mine.eatenAt) + '에 별에 삼켜졌어.' : '🎉 내 행성은 별에 삼켜지지 않고 버텼어!'}</p>` : ''}
    <p><button onclick="startQuiz()">❓ 퀴즈 풀기</button> <button onclick="closeModal();restart();playing=true;setPlayBtn()">⏮ 처음부터 다시</button> <button onclick="closeModal()">닫기</button></p>`;
  modal.style.display = 'flex';
}

// ---------- 시작 ----------
switchSystem('solar');
let prevT = performance.now(), infoT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now;
  update(dt);
  draw();
  const y = yearAt(P);
  elYear.textContent = fmtYear(y);
  elEra.textContent = SD().emoji + ' ' + SD().name + ' · ' + eraName(y);
  const pct = P / TOTAL * 100;
  knob.style.left = pct + '%'; fillEl.style.width = pct + '%';
  infoT -= dt; if (infoT <= 0) { refreshInfo(); infoT = 0.25; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
