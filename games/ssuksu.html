<style>
:root{--fs:12px;--panel:#241c29;--panel2:#30263a;--line:#5a4860;--line2:#8a7290;--txt:#efe6d6;--dim:#a99c97;--gold:#f0c35a;--hp:#d4574b;--mp:#4f8bdc;--ex:#e3c04a;--ft:#a978d0;--good:#86d07c;--bad:#e2735f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#110d16;color:var(--txt);font:var(--fs)/1.45 'Galmuri11',monospace;user-select:none;-webkit-user-select:none}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
.hide{display:none!important}
button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line2);border-right-color:#140f18;border-bottom-color:#140f18;padding:.2em .75em;cursor:pointer;border-radius:0;white-space:nowrap}
button:hover{background:#43364d}
button:active{transform:translateY(1px)}
button:disabled{opacity:.42;cursor:default;transform:none}
button.main{background:#6a4526;border-color:#c08a52 #2a1a0e #2a1a0e #c08a52}
button.main:hover{background:#7d5530}
input{font:inherit;color:var(--txt);background:#15101a;border:1px solid var(--line2);padding:.3em .5em;outline:none;border-radius:0}
.px{image-rendering:pixelated}
/* 아래 상태줄 */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:1em;padding:.45em .8em .45em;background:linear-gradient(#2b2231,#1c1621);border-top:2px solid #4a3b50;flex-wrap:nowrap}
#expBar{position:absolute;left:0;right:0;bottom:var(--barh,46px);height:.75em;background:#120e15;border-top:1px solid #3a2e40}
#expBar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#f2d36a,#c99a2e);width:0}
#expBar span{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-size:.85em;color:#fff;text-shadow:1px 1px 0 #000;white-space:nowrap}
#who{min-width:7.5em}
#who b{color:var(--gold)}
#who div:last-child{color:var(--dim)}
#gauges{display:flex;flex-direction:column;gap:.15em;width:15em}
.gg{position:relative;height:1.15em;background:#120e15;border:1px solid #3e3144}
.gg i{position:absolute;left:0;top:0;bottom:0;width:0}
.gg.hp i{background:linear-gradient(#ec7a6c,#b23c34)}
.gg.mp i{background:linear-gradient(#77aaf0,#3463b4)}
.gg.ft i{background:linear-gradient(#c79ae6,#7d4aa8)}
.gg span{position:absolute;left:.4em;top:50%;transform:translateY(-52%);font-size:.85em;color:#fff;text-shadow:1px 1px 0 #000;white-space:nowrap}
#goldT{color:var(--gold);min-width:7em}
#slots{display:flex;gap:.25em}
.slot{position:relative;width:2.9em;height:2.9em;background:#15101a;border:1px solid #4d3e55;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot img{width:2.2em;height:2.2em;image-rendering:pixelated}
.slot .k{position:absolute;left:1px;top:-1px;font-size:.75em;color:#d9cbbd;text-shadow:1px 1px 0 #000}
.slot .n{position:absolute;right:2px;bottom:0;font-size:.75em;color:#fff;text-shadow:1px 1px 0 #000}
.slot .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(10,6,14,.72)}
.slot.lock{opacity:.35}
.slot.sep{margin-left:.6em}
#menuBtns{display:flex;gap:.25em;margin-left:auto}
#menuBtns button{padding:.2em .5em}
#topL{position:absolute;left:.8em;top:.6em;background:rgba(20,15,24,.72);border:1px solid #3e3144;padding:.35em .7em;min-width:11em}
#mapName{color:#fff}
#clock,#bossG{color:var(--dim)}
#bossG.ready{color:var(--bad)}
#buffs{display:flex;gap:.3em;margin-top:.2em;flex-wrap:wrap}
#buffs span{background:#3a2c44;padding:0 .35em;font-size:.85em}
#questTrack{position:absolute;right:.8em;top:.6em;background:rgba(20,15,24,.72);border:1px solid #3e3144;padding:.35em .7em;min-width:13em;max-width:20em}
#questTrack .t{color:var(--gold)}
#questTrack .d{color:var(--good)}
#log{position:absolute;left:.8em;bottom:calc(var(--barh,46px) + 1.6em);display:flex;flex-direction:column;gap:.1em;pointer-events:none;max-width:36em}
#log div{background:rgba(16,12,20,.66);padding:.05em .5em;transition:opacity .8s}
#log .g{color:var(--gold)}#log .e{color:#9fd0ff}#log .w{color:var(--bad)}#log .q{color:var(--good)}#log .p{color:#d9b3ff}
#banner{position:absolute;left:50%;top:3.2em;transform:translateX(-50%);text-align:center;pointer-events:none;transition:opacity .6s;opacity:0}
#banner .a{font-size:1.6em;color:#fff;text-shadow:2px 2px 0 #000,0 0 6px #000;letter-spacing:.06em}
#banner .b{color:#e7d6b8;text-shadow:1px 1px 0 #000}
#bossBar{position:absolute;left:50%;top:.6em;transform:translateX(-50%);width:min(30em,60vw);text-align:center}
#bossBar .nm{color:#ffd0b8;text-shadow:1px 1px 0 #000}
#bossBar .g{height:.9em;background:#120e15;border:1px solid #6d3a3a;position:relative}
#bossBar .g i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e46a4f,#9b2c25)}
/* 창 */
#win{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);width:min(44em,94vw);max-height:min(36em,78vh);display:flex;flex-direction:column;background:var(--panel);border:2px solid #6b5470;box-shadow:0 0 0 2px #140f18,6px 6px 0 rgba(0,0,0,.35)}
#win .wt{display:flex;align-items:center;justify-content:space-between;padding:.35em .6em;background:linear-gradient(#3e3046,#30253a);border-bottom:1px solid #5a4860}
#win .wt span{color:#fff}
#winBody{padding:.6em .8em;overflow:auto}
.tabs{display:flex;gap:.25em;margin-bottom:.5em;flex-wrap:wrap}
.tabs button.on{background:#5b4766;border-color:#a88bb3}
.row{display:flex;align-items:center;gap:.6em;padding:.3em .2em;border-bottom:1px solid #3a2f40}
.row img{width:2.2em;height:2.2em;image-rendering:pixelated;flex:none}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--dim)}
.row .pr{color:var(--gold);min-width:5.5em;text-align:right}
.row .btns{display:flex;gap:.25em}
.r1{color:#7fc3ff}.r2{color:#c792ff}.r3{color:#ffb54d}
.note{color:var(--dim);margin:.3em 0 .5em}
.talk{background:#1a141f;border:1px solid #3e3144;padding:.6em .7em;margin-bottom:.6em;line-height:1.6}
.talk b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:.4em}
.card{background:#1a141f;border:1px solid #3e3144;padding:.4em;text-align:center}
.card canvas{width:100%;height:5.5em;image-rendering:pixelated;object-fit:contain}
.card.done{border-color:#b08a3a}
.card small{display:block;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.2em .8em;background:#1a141f;border:1px solid #3e3144;padding:.4em .6em;margin-bottom:.5em}
.stats span{color:var(--dim)}
.eqs{display:flex;gap:.4em;margin-bottom:.5em;flex-wrap:wrap}
.eqs .slot{width:auto;min-width:12em;height:auto;padding:.3em .5em;justify-content:flex-start;gap:.4em;cursor:default}
.areas{display:flex;flex-direction:column;gap:.3em}
.area{display:flex;align-items:center;gap:.6em;background:#1a141f;border:1px solid #3e3144;padding:.4em .6em}
.area.here{border-color:#b08a3a}
.area .nm{flex:1}
.area small{color:var(--dim)}
/* 첫 화면 */
#title,#create{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(12,8,16,.15),rgba(12,8,16,.6))}
#title h1{margin:0;font-size:calc(var(--fs)*5);font-weight:700;color:#fff3dc;letter-spacing:.04em;text-shadow:4px 4px 0 #2a1730,8px 8px 0 rgba(0,0,0,.35)}
#title .sub{color:#e8d8bf;text-shadow:2px 2px 0 #000;margin:.4em 0 2em}
#title .bt{display:flex;flex-direction:column;gap:.5em;min-width:14em}
#title .bt button{padding:.55em 1em;font-size:1.15em}
#title .ver{position:absolute;bottom:.8em;color:#d8c8b0;text-shadow:1px 1px 0 #000;font-size:.9em}
#create .box{background:var(--panel);border:2px solid #6b5470;box-shadow:0 0 0 2px #140f18;padding:1em 1.2em;width:min(46em,94vw)}
#create h2{margin:0 0 .6em;font-size:1.3em;color:#fff}
.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.job{background:#1a141f;border:1px solid #3e3144;padding:.5em;cursor:pointer;text-align:center}
.job.on{border-color:#d9a85a;background:#2a2026}
.job canvas{width:100%;height:9em;image-rendering:pixelated;object-fit:contain}
.job b{display:block;font-size:1.15em;color:#fff}
.job small{display:block;color:var(--dim);min-height:3em}

function hsl(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(1,s));l=Math.max(0,Math.min(1,l));const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};const t=v=>Math.round(v*255).toString(16).padStart(2,'0');return'#'+t(f(0))+t(f(8))+t(f(4))}
function hueToward(h,t,a){const d=((t-h+540)%360)-180;return h+Math.sign(d)*Math.min(Math.abs(d),a)}
// 색상 사다리 5칸: 가장 어두움·그림자·바탕·밝음·반짝임 (어두운 쪽은 푸르게, 밝은 쪽은 노랗게)

function outline(src,dark=.42,top=.62){const w=src.width+2,h=src.height+2,c=mk(w,h),g=c.getContext('2d');g.drawImage(src,1,1);const d=g.getImageData(0,0,w,h),p=d.data,o=new Uint8ClampedArray(p);const nb=[[0,1,top],[1,0,dark],[-1,0,dark],[0,-1,dark]];for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(p[i+3]>0)continue;for(const[dx,dy,f]of nb){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;const j=(yy*w+xx)*4;if(p[j+3]===0)continue;o[i]=p[j]*f*.85;o[i+1]=p[j+1]*f*.9;o[i+2]=Math.min(255,p[j+2]*f+18);o[i+3]=255;break}}d.data.set(o);g.putImageData(d,0,0);return c}

function updatePlayer(dt){

  if(MAP.th==='sky')for(let i=0;i<10;i++){const x=((hash(i,1,8)*W-tNow*60*(1+i%3))%W+W)%W,y=hash(i,2,8)*H*.7;b.fillStyle='rgba(255,255,255,.5)';b.fillRect(Math.round(x),Math.round(y),8+i%3*4,1)}
}

let AC=null;const sfxLast={};

  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
    const tone=(f1,f2,dur,type='square',vol=.06,delay=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t+delay);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+delay+dur);g.gain.setValueAtTime(vol,t+delay);g.gain.exponentialRampToValueAtTime(.0005,t+delay+dur);o.connect(g).connect(AC.destination);o.start(t+delay);o.stop(t+delay+dur+.02)};
    const noise=(dur,vol=.08,freq=1200)=>{const n=AC.createBuffer(1,Math.round(AC.sampleRate*dur),AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=freq;s.buffer=n;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t)};
    ({jump:()=>tone(280,520,.09,'square',.035),swing:()=>noise(.07,.05,3000),hit:()=>{tone(220,90,.07,'square',.05);noise(.05,.05,1800)},crit:()=>{tone(440,160,.1,'square',.06);noise(.08,.07,2500)},
      coin:()=>{tone(988,988,.06,'square',.03);tone(1319,1319,.1,'square',.03,.06)},pick:()=>tone(660,880,.07,'triangle',.05),rare:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.1,'triangle',.05,i*.07)),
      hurt:()=>tone(220,80,.18,'sawtooth',.05),lvl:()=>[392,523,659,784,1047].forEach((f,i)=>tone(f,f,.14,'square',.04,i*.08)),skill:()=>tone(500,900,.12,'triangle',.05),
      boom:()=>{noise(.35,.12,500);tone(120,40,.3,'sine',.1)},zap:()=>{tone(1200,300,.15,'sawtooth',.03);noise(.1,.04,4000)},portal:()=>tone(300,1200,.3,'sine',.05),drink:()=>tone(400,760,.15,'sine',.06),
      buy:()=>{tone(784,784,.06,'triangle',.05);tone(1047,1047,.1,'triangle',.05,.07)},throw:()=>noise(.1,.05,1500),eat:()=>{tone(330,330,.06,'triangle',.05);tone(440,440,.06,'triangle',.05,.1);tone(392,392,.1,'triangle',.05,.2)}}[k]||(()=>{}))();

    const dn=ev=>{ev.preventDefault();if(!keys[code])pressed[code]=true;keys[code]=true},up=ev=>{keys[code]=false};
    e.addEventListener('pointerdown',dn);e.addEventListener('pointerup',up);e.addEventListener('pointerleave',up);e.addEventListener('pointercancel',up);T.appendChild(e)};
  btn('◀','ArrowLeft','left',.8,3.2);btn('▶','ArrowRight','left',8.8,3.2);btn('▲','ArrowUp','left',4.8,7);btn('▼','ArrowDown','left',4.8,-.6);
  btn('점프','Space','right',.8,.4);btn('공격','KeyZ','right',5,.4);SKEYS.forEach((k,i)=>btn(k,'Key'+k,'right',.8+i*4.2,4.6))}

// ════════ 12. 돌리기 ════════
let last=performance.now(),hudT=0;
function titleScene(dt){
  if(!MAP){S=newState('warrior',1,'');S.day=.36;MAP=buildMap('town');makePlayer(640)}
  tNow+=dt;const span=Math.max(0,MAP.w-VW);cam.x=(Math.sin(tNow*.05)*.5+.5)*span;cam.y=MAP.gy+BARB-VH;
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.life>0);
}
function loop(now){
  requestAnimationFrame(loop);
  try{
    let dt=Math.min(.05,(now-last)/1000);last=now;
    if(gameOn){if(hitStop>0){hitStop-=dt;dt*=.2}update(dt)}else titleScene(dt);
    if(MAP)draw();
    for(const k in pressed)delete pressed[k];
    if(gameOn){hudT-=dt;if(hudT<=0){hudT=.1;hud()}}
    drawPreviews();
  }catch(e){console.error(e)}
}
addEventListener('resize',()=>{resize();if(gameOn)measureBar()});
makeFX();makeClouds();resize();
if(!loadSave())$('#btCont').disabled=true;
requestAnimationFrame(loop);

</script>
