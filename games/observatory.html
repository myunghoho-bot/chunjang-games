<title>행성 탐사 천문대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 상단 계기판 / 전천 지도(캔버스) + 우측 관측 패널. 좁은 화면에서는 패널이 하단 시트로 바뀐다.
   한 가지 시각 세계(어두운 관측실)를 의도적으로 선택한 단일 테마. */
:root{
  --ink:#050812; --deep:#0a1020; --panel:#0d1527; --panel2:#141f38; --line:#243350;
  --text:#dce5f5; --dim:#8794b0; --amber:#f2c46d; --teal:#62cfc7; --rose:#ef8573; --blue:#7fa6ff; --ok:#8fd694;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
  --mono:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,monospace;
  --peek:0px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:14px/1.55 var(--sans);overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
#top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 24px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--deep)}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand p{margin:0;font-size:12px;color:var(--dim)}
.stats{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0}
.stats div{display:flex;align-items:baseline;gap:6px}
.stats dt{font-size:12px;color:var(--dim)}
.stats dd{margin:0;font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.stats .of{font-size:12px;color:var(--dim)}
#stage{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
#skyWrap{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;background:var(--ink)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#hint{position:absolute;left:14px;top:10px;font:12px var(--mono);color:var(--dim);pointer-events:none;text-shadow:0 0 6px var(--ink)}
#intro{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(88%,360px);text-align:center;pointer-events:none;color:var(--text);font-size:15px;text-shadow:0 0 12px var(--ink),0 0 4px var(--ink)}
#intro small{display:block;margin-top:6px;color:var(--dim);font-size:12.5px}
#tools{position:absolute;left:12px;bottom:calc(12px + var(--peek));display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100% - 24px)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:8px 14px;min-height:38px;cursor:pointer;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--amber)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 14px;min-height:38px;border-radius:6px;cursor:pointer}
.btn:hover:not([disabled]){border-color:var(--blue)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1b1405;font-weight:600}
.btn.sm{min-height:32px;padding:4px 11px}
.btn[disabled]{opacity:.4;cursor:default}
.btn.on{border-color:var(--teal);color:var(--teal)}
#toasts{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line);padding:7px 14px;border-radius:6px;font-size:13px;transition:opacity .4s}
.toast.good{border-color:var(--amber);color:var(--amber)}
.toast.out{opacity:0}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;overscroll-behavior:contain}
.tabs{position:sticky;top:0;z-index:2;display:flex;background:var(--deep);border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:44px;background:none;border:0;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.tabs button.on{color:var(--text);border-bottom-color:var(--amber)}
#btnFold{display:none;flex:0 0 52px}
.sec{padding:14px 16px;border-top:1px solid var(--line)}
#pbody>.sec:first-child{border-top:0}
.sec h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--dim)}
.sec h4{margin:14px 0 6px;font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:.04em}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.zb{display:flex;gap:6px}
.idrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tag{font:500 13px var(--mono);color:var(--teal)}
.cls{font:12px var(--mono);color:var(--dim)}
.nm{display:flex;flex-direction:column;gap:2px;margin:10px 0 12px}
.nm span{font-size:12px;color:var(--dim)}
.nm input,.pname{background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 0;font-size:17px;font-weight:500;color:var(--amber);width:100%;border-radius:0}
.nm input::placeholder,.pname::placeholder{color:#5d6a86;font-weight:400}
.nm input:focus,.pname:focus{outline:0;border-bottom-color:var(--amber)}
.facts,.pfacts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 16px;margin:0}
.facts dt,.pfacts dt{color:var(--dim);font-size:13px}
.facts dd,.pfacts dd{margin:0;font:13px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
canvas.plot{width:100%;display:block;border-radius:4px;background:#080e1d}
#cSys{height:240px}#cData{height:150px}#cPg{height:110px}#cFold{height:140px}#cSolve{height:150px}
.cap{font-size:12px;color:var(--dim);margin-top:6px}
.note{margin:8px 0;font-size:13px;color:var(--dim)}
.obsrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.obsrow .grow{flex:1;font-size:13px;color:var(--dim);min-width:90px}
.obsrow b{font-family:var(--mono);color:var(--text);font-weight:500}
.pc{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:6px 0 4px;font-size:13px}
.pc b{font-family:var(--mono);color:var(--amber);font-weight:500}
.pc input[type=range],.solver input[type=range]{flex:1;min-width:120px;accent-color:var(--amber)}
.msg{min-height:22px;margin:8px 0 0;font-size:13px;color:var(--dim)}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--rose)}
.pcard{padding:12px 0;border-top:1px dashed var(--line)}
.pcard:first-of-type{border-top:0;padding-top:4px}
.phead{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.letter{font:500 15px var(--mono);color:var(--teal)}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border:1px solid var(--ok);color:var(--ok);border-radius:10px;margin-left:6px}
.orb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--dim)}
.solver{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--deep)}
.solver label{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:8px 0;font-size:13px}
.solver label span{min-width:96px}
.solver output{font:13px var(--mono);color:var(--amber);min-width:44px}
.gauge{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:10px 0;font-size:12.5px;color:var(--dim)}
.bar{position:relative;flex:1;min-width:120px;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal)}
.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--amber)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.help ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.help li{color:var(--text)}
.help li span{color:var(--dim);display:block;font-size:13px}
.lrow{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;cursor:pointer;min-height:44px}
.lrow:first-of-type{border-top:0}
.lrow span:last-child{font:12px var(--mono);color:var(--dim);text-align:right}
.lrow strong{font-weight:500;color:var(--amber)}
.empty{color:var(--dim);font-size:13px;margin:10px 0 0}
@media (max-width:860px){
  :root{--peek:52px}
  #stage{grid-template-columns:minmax(0,1fr)}
  #panel{position:fixed;left:0;right:0;bottom:0;height:58%;z-index:5;border-left:0;border-top:1px solid var(--line);transform:translateY(calc(100% - 44px - env(safe-area-inset-bottom,0px)));transition:transform .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  #btnFold{display:block}
  .stats{gap:2px 14px}
  .brand p{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}.toast{transition:none}}
</style>

<div id="app">
  <header id="top">
    <div class="brand"><h1>행성 탐사 천문대</h1><p>천체 12,802개 · 은하 속 별까지 합쳐 2,000,000개 · 행성이 있는 별 1,500,000개</p></div>
    <dl class="stats">
      <div><dt>발견한 천체</dt><dd id="stStars">0</dd><dd class="of">/ 12,802</dd></div>
      <div><dt>행성</dt><dd id="stPlanets">0</dd></div>
      <div><dt>궤도 확정</dt><dd id="stOrbits">0</dd></div>
      <div><dt>점수</dt><dd id="stScore">0</dd></div>
    </dl>
  </header>
  <main id="stage">
    <div id="skyWrap">
      <canvas id="sky" aria-label="전천 별 지도"></canvas>
      <div id="hint"></div>
      <div id="intro">스캔 모드에서 하늘을 문질러<br>별을 밝은 점으로 찾아내세요<small>확대할수록 더 어두운 별이 보입니다</small></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="tools">
        <div class="seg" role="group" aria-label="조작 모드"><button id="mScan" class="on" data-m="scan">스캔</button><button id="mPan" data-m="pan">이동</button><button id="mLink" data-m="link">별자리</button></div>
        <button class="btn" id="bAuto">자동 탐사</button>
        <div class="seg"><button id="zOut" aria-label="축소">−</button><button id="zIn" aria-label="확대">+</button></div>
        <button class="btn" id="bFit">전체</button>
      </div>
    </div>
    <aside id="panel" aria-label="관측 패널">
      <div class="tabs"><button id="tabStar" class="on">선택한 별</button><button id="tabLog">발견 기록</button><button id="btnFold" aria-label="패널 접기/펴기">⌃</button></div>
      <div id="pbody"></div>
    </aside>
  </main>
</div>

<script>
(()=>{
'use strict';
//#CORE-START
const NMS=9000,N=12802,TOTAL=2000000,W=3000,H=1500,SEED=20261010,TAU=Math.PI*2;
const MAXD=1440,LC_DT=0.25,RV_DT=0.5,LETTERS='bcdefghi';
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(a,b){let h=Math.imul(a|0,0x9E3779B1)^Math.imul(b|0,0x85EBCA6B);h^=h>>>15;h=Math.imul(h,0x2C1B3C6D);h^=h>>>12;h=Math.imul(h,0x297A2D39);h^=h>>>15;return(h>>>0)/4294967296;}
function gauss(a,b){const u=Math.max(1e-9,hash2(a,b*2+1)),v=hash2(a,b*2+2);return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}
function kepE(M,e){M%=TAU;if(M<0)M+=TAU;let E=e<0.8?M:Math.PI;for(let k=0;k<14;k++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-9)break;}return E;}
function trueAnom(M,e){const E=kepE(M,e);return 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2));}
const CST=[[2800,[255,140,80]],[3600,[255,172,104]],[4600,[255,205,150]],[5600,[255,236,205]],[6400,[246,244,255]],[7600,[205,222,255]],[9000,[180,205,255]]];
function teffRGB(T){if(T<=CST[0][0])return CST[0][1];for(let i=1;i<CST.length;i++){if(T<=CST[i][0]){const a=CST[i-1],b=CST[i],f=(T-a[0])/(b[0]-a[0]);return a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*f));}}return CST[CST.length-1][1];}
function specClass(T){return T>=7500?'A':T>=6000?'F':T>=5200?'G':T>=3900?'K':'M';}
function makeStar(id){
  if(id>=NMS)return makeObj(id);
  const r=rng(SEED+id*7919+13);
  const ci=(id*7919)%NMS,x=((ci%150)+r())*(W/150),y=(((ci/150)|0)+r())*(H/60);
  const M=0.25+1.55*Math.pow(r(),2);
  const Rs=Math.pow(M,0.85),T=5772*Math.pow(M,0.55),L=Math.pow(M,3.7);
  const Mabs=4.83-2.5*Math.log10(L);
  let m=0,dpc=0;
  for(let k=0;k<14;k++){dpc=Math.pow(10,0.9+2.6*Math.pow(r(),0.6));m=Mabs+5*Math.log10(dpc)-5;if(m>=5.5&&m<=18.8)break;}
  if(m<5.5)m=5.5;if(m>18.8)m=18.8;
  dpc=Math.pow(10,(m-Mabs+5)/5);
  const rgb=teffRGB(T);
  const s={id,x,y,m,M,Rs,T,L,dpc,ly:dpc*3.26,cls:specClass(T),rgb,rgbs:rgb.join(','),col:'rgb('+rgb.join(',')+')',prot:8+r()*25,varPh:r()*TAU};
  s.sigP=140e-6*Math.pow(10,0.19*(m-9));
  s.varA=Math.min(2e-4,0.5*s.sigP);
  s.sigR=Math.sqrt(Math.pow(2*Math.pow(10,0.15*(m-8)),2)+2.25);
  s.pl=[];s.hzIn=0.95*Math.sqrt(L);s.hzOut=1.7*Math.sqrt(L);s.t='ms';s.tn=s.cls+'형 별';
  return s;
}
/* 별이 아닌 천체 3802개: 점근거성가지 520, 팽창 거성 800, 성운 780, 은하 600, 중성자별 650, 블랙홀 452.
   은하 600개가 나머지 1,987,198개의 별을 나눠 가진다(합계 2,000,000). */
const OT=[['agb',520,'AGB 별 (점근거성가지)'],['giant',800,'팽창하는 거성'],['neb',780,'성운'],['gal',600,'은하'],['ns',650,'중성자별'],['bh',452,'블랙홀']];
const GAL0=NMS+520+800+780;
function msPos(id){const r=rng(SEED+id*7919+13),ci=(id*7919)%NMS,x=((ci%150)+r())*(W/150);return[x,(((ci/150)|0)+r())*(H/60)];}
function galRw(j){const g=rng(SEED+j*131+4242);return 5+13*Math.pow(g(),2.5);}
let EX=null;
function extras(){
  if(EX)return EX;
  const CS=30,gx=Math.ceil(W/CS),gy=Math.ceil(H/CS),cells=Array.from({length:gx*gy},()=>[]);
  const ci=(x,y)=>Math.min(gy-1,(y/CS)|0)*gx+Math.min(gx-1,(x/CS)|0);
  for(let id=0;id<NMS;id++){const[x,y]=msPos(id);cells[ci(x,y)].push(x,y);}
  const ne=N-NMS,pos=new Float64Array(ne*2);
  for(let k=0;k<ne;k++){
    const rr=rng(SEED+777+k*31);let bx=0,by=0,bd=-1;
    for(let c=0;c<10;c++){
      const x=rr()*W,y=rr()*H,cx=Math.min(gx-1,(x/CS)|0),cy=Math.min(gy-1,(y/CS)|0);let d=1e9;
      for(let yy=Math.max(0,cy-1);yy<=Math.min(gy-1,cy+1);yy++)for(let xx=Math.max(0,cx-1);xx<=Math.min(gx-1,cx+1);xx++){const a=cells[yy*gx+xx];for(let i=0;i<a.length;i+=2){const dd=(a[i]-x)*(a[i]-x)+(a[i+1]-y)*(a[i+1]-y);if(dd<d)d=dd;}}
      if(d>bd){bd=d;bx=x;by=y;}
    }
    pos[k*2]=bx;pos[k*2+1]=by;cells[ci(bx,by)].push(bx,by);
  }
  const ng=OT[3][1],w=[];let sw=0;
  for(let j=0;j<ng;j++){const v=Math.pow(galRw(j),2.2)*Math.exp(0.6*gauss(j,7));w.push(v);sw+=v;}
  const pool=TOTAL-N,galN=w.map(v=>Math.floor(v/sw*pool)),fr=w.map((v,j)=>[v/sw*pool-galN[j],j]);
  let rest=pool-galN.reduce((a,b)=>a+b,0);fr.sort((a,b)=>b[0]-a[0]);
  for(let i=0;rest>0;i=(i+1)%ng,rest--)galN[fr[i][1]]++;
  const HT=1500000-8000,galH=galN.map(v=>Math.floor(v/pool*HT)),fh=galN.map((v,j)=>[v/pool*HT-galH[j],j]);
  let rh=HT-galH.reduce((a,b)=>a+b,0);fh.sort((a,b)=>b[0]-a[0]);
  for(let i=0;rh>0;i=(i+1)%ng,rh--)galH[fh[i][1]]++;
  return EX={pos,galN,galH};
}
function makeObj(id){
  const E=extras();let k=id-NMS,ti=0;while(k>=OT[ti][1]){k-=OT[ti][1];ti++;}
  const t=OT[ti][0],r=rng(SEED+id*7919+99);
  const o={id,x:E.pos[(id-NMS)*2],y:E.pos[(id-NMS)*2+1],t,tn:OT[ti][2],cls:OT[ti][2],pl:[],M:1,Rs:1,T:5000,L:1,m:12,dpc:100,hzIn:0,hzOut:0,prot:10,varPh:r()*TAU,ph:r()*TAU,sigP:1e-4,sigR:3,varA:0,ang:r()*Math.PI};
  const lum=()=>Math.pow(o.Rs,2)*Math.pow(o.T/5772,4);
  const fromMag=()=>{o.L=lum();o.dpc=Math.pow(10,(o.m-(4.83-2.5*Math.log10(o.L))+5)/5);};
  let rgb=[255,255,255];
  if(t==='agb'){
    o.T=2700+700*r();o.M=1+0.9*r();o.Rs=150+250*r();o.m=8.6+3.6*r();fromMag();
    o.P=180+340*r();o.amp=1.2+3*r();o.mdot=Math.pow(10,-7-2*r());rgb=teffRGB(o.T);
  }else if(t==='giant'){
    o.T=3700+1500*r();o.M=1+4*r();o.Rs=12+70*r();o.m=9+3.3*r();fromMag();
    o.P=25+130*r();o.amp=0.05+0.35*r();o.grow=0.2+3*r();rgb=teffRGB(o.T);
  }else if(t==='neb'){
    const u=r();o.nk=u<0.45?0:u<0.75?1:2;o.Rw=3.5+7*Math.pow(r(),1.6);o.m=9.2+3.6*r();
    o.dpc=Math.pow(10,2.8+1.0*r());o.size=o.nk===0?20+100*r():o.nk===1?0.4+2.6*r():5+25*r();o.T=o.nk===1?(10000+60000*r()):6000+6000*r();
    rgb=[[235,100,150],[90,220,200],[120,160,255]][o.nk];
  }else if(t==='gal'){
    const gi=id-GAL0,u=r();o.gk=u<0.55?0:u<0.85?1:2;o.Rw=galRw(gi);o.m=9.8+3*r();o.q=0.3+0.7*r();
    o.n=E.galN[gi];o.hosts=E.galH[gi];o.dpc=(2+300*Math.pow(r(),1.5))*1e6/3.26;o.diam=20+80*(o.Rw-5)/13;o.gi=gi;
    rgb=[[190,205,255],[255,225,175],[200,230,255]][o.gk];
  }else if(t==='ns'){
    o.m=11+3.6*r();o.dpc=Math.pow(10,2+1.5*r());o.M=1.2+1.0*r();o.km=10+3*r();o.Pspin=Math.pow(10,-2.7+3.3*r());

    }else if(s.gk===1){
      const rr=Math.min(1.1,0.36*Math.sqrt(-2*Math.log(1-0.98*u))),th=v*TAU;X=rr*Math.cos(th);Y=rr*Math.sin(th);ci=b<0.75?0:2;

function baseLC(s,days){let c=cLC.get(s.id);if(!c||c.days<days){c=genLC(s,days);c.days=days;cLC.set(s.id,c);}return c;}
function baseRV(s,days){let c=cRV.get(s.id);if(!c||c.days<days){c=genRV(s,days);c.days=days;cRV.set(s.id,c);}return c;}
function pctRange(y,n,mask){
  const a=[],stp=Math.max(1,Math.floor(n/700));
  for(let i=0;i<n;i+=stp){if(mask&&mask[i])continue;a.push(y[i]);}
  if(a.length<5)return[-1,1];
  a.sort((p,q)=>p-q);
  const lo=a[Math.floor(a.length*0.004)],hi=a[Math.min(a.length-1,Math.floor(a.length*0.996))],pad=(hi-lo)*0.12||1e-6;

function buildData(s,tab,days){

    const b=baseLC(s,days),n=Math.floor(days/LC_DT),mask=new Uint8Array(n);
    for(const rec of st.pl){const pl=s.pl[rec.k];if(!pl.tr)continue;
      for(let i=0;i<n;i++){let ph=(b.t[i]-pl.t0)/rec.P;ph-=Math.round(ph);if(Math.abs(ph*rec.P)<pl.dur*0.75)mask[i]=1;}}
    const[lo,hi]=pctRange(b.f,n,mask);
    return{n,t:b.t,y:b.f,mask,sig:s.sigP,dt:LC_DT,scale:1e6,lo,hi};
  }
  const b=baseRV(s,days),n=Math.floor(days/RV_DT),y=Float32Array.from(b.v.subarray(0,n));
  for(const rec of st.pl){const pl=s.pl[rec.k];if(pl.K*Math.sqrt(n/2)/s.sigR<4)continue;
    const f=harmFit(b.t,y,n,rec.P,2);for(let i=0;i<n;i++)y[i]-=harmEval(f,b.t[i],true);}

}
function rebuildData(){

function ensurePG(){
  const s=stars[U.sel],st=ensureSt(s.id),D=U.D,key=U.tab;

  const c=U.pg[key];
  if(c&&c.n===D.n&&c.nf===st.pl.length)return c;
  const span=D.n*D.dt;
  const lc=key==='lc',thr=lc?7:5;
  const r=lc?blsScan(D.t,D.y,D.n,D.sig,D.mask,Math.max(3,span/2)):lsScan(D.t,D.y,D.n,D.sig,Math.max(3,span*0.8));
  /* 진짜 신호의 배수·부수 주기에서 생기는 가짜 봉우리를 걸러낸다 */
  const found=new Set(st.pl.map(x=>x.k)),pool=s.pl.filter(p=>!found.has(p.k)&&(!lc||p.tr)),pw=Float32Array.from(r.pw);
  if(pool.length){
    const tol=P=>Math.max(0.02,0.3*P/span),res=Float32Array.from(D.y.subarray(0,D.n));
    for(let i=0;i<D.n;i++){let a=0;for(const pl of pool)a+=lc?transitDepth(pl,D.t[i]):-rvKep(pl,D.t[i]);res[i]+=a;}
    const rm=meanOf(res,D.n,D.mask);
    for(let i=0;i<pw.length;i++){
      if(r.pw[i]<=thr)continue;
      const P=r.Ps[i];
      if(pool.some(pl=>Math.abs(P/pl.P-1)<tol(pl.P)))continue;
      const q=lc?blsAt(D.t,res,D.n,P,D.sig,rm,D.mask).snr:lsAt(D.t,res,D.n,P,D.sig,rm);

  for(let i=1;i<pw.length-1;i++)if(pw[i]>thr&&pw[i]>=pw[i-1]&&pw[i]>=pw[i+1])peaks.push(i);
  peaks.sort((a,b)=>pw[b]-pw[a]);
  const keep=[];for(const i of peaks){if(keep.every(j=>Math.abs(Math.log(r.Ps[i]/r.Ps[j]))>0.08))keep.push(i);if(keep.length>=6)break;}

}

const rvOK=(s,pl,days)=>pl.K*Math.sqrt(Math.floor(days/RV_DT)/2)/s.sigR>=5;

function measure(s,rec){

    for(let i=0;i<n;i++){let ph=(b.t[i]-pl.t0)/rec.P;ph-=Math.round(ph);if(Math.abs(ph*rec.P)<pl.dur*0.3){sm-=b.f[i];c++;}}
    if(c>2)out.Re=Math.sqrt(Math.max(1e-8,sm/c))*s.Rs/0.009168;

      <dt>공전 주기</dt><dd>${rec.P.toFixed(rec.P<10?3:2)} 일</dd>
      <dt>궤도 반지름</dt><dd>${a.toFixed(3)} AU</dd>
      <dt>크기</dt><dd>${m.Re!=null?'지구의 '+m.Re.toFixed(1)+'배':'알 수 없음 (트랜짓 없음)'}</dd>
      <dt>최소 질량</dt><dd>${m.Me!=null?'지구의 '+(m.Me<10?m.Me.toFixed(1):Math.round(m.Me))+'배':'알 수 없음 (도플러 관측 필요)'}</dd>
      <dt>평형 온도</dt><dd>${Math.round(teq)} K (${Math.round(teq-273)}℃)</dd>
      <dt>유형</dt><dd>${ptype(m)}</dd>
    </dl>
    <div class="orb"><span>${orb}</span>${rec.orbit===2?'':`<button class="btn sm" data-act="solve" data-v="${rec.k}">궤도 맞추기</button>`}</div>
    ${U.solve&&U.solve.k===rec.k?solveHTML():''}
  </article>`;
}
function solveHTML(){
  const sd=U.solve;
  if(sd.err)return `<div class="solver"><p class="msg bad" style="margin:0">${esc(sd.err)}</p><div class="row" style="margin-top:10px">${sd.weak?'<button class="btn" data-act="circ">원형 궤도로 추정</button>':'<button class="btn" data-act="gorv">도플러 관측으로 이동</button>'}<button class="btn" data-act="closesolve">닫기</button></div></div>`;
  return `<div class="solver"><canvas id="cSolve" class="plot"></canvas>
    <label><span>이심률 e</span><input type="range" id="sE" min="0" max="0.8" step="0.01" value="0"><output id="oE">0.00</output></label>
    <label><span>근점 방향 ω</span><input type="range" id="sW" min="0" max="360" step="1" value="0"><output id="oW">0°</output></label>
    <div class="gauge"><div class="bar"><i id="gFill"></i><b id="gMark"></b></div><span id="gTxt">맞춤도 —</span></div>
    <div class="row"><button class="btn primary" id="bOrbit" data-act="orbit" disabled>궤도 확정</button><button class="btn" data-act="circ">원형 궤도로 추정</button><button class="btn" data-act="closesolve">닫기</button></div>
    <p class="msg" id="solveMsg">곡선 모양이 점들과 겹치도록 e와 ω를 조절하세요. 금색 눈금을 넘으면 확정할 수 있습니다.</p></div>`;
}

    desc=['근처 젊은 별의 자외선에 달궈진 수소가 붉게 빛나는 구름입니다.','죽어가는 별이 벗어 던진 껍질이 중심의 뜨거운 잔해에 이온화되어 빛나는 고리입니다.','주변 별빛을 먼지가 푸르게 되비치는 구름입니다.'][s.nk];cap='성운의 모습입니다.';

function drawObjPanel(now){
  const c=$('#cObj');if(!c||U.sel==null||U.ptab!=='star')return;
  const s=stars[U.sel];if(s.t==='ms')return;
  const{g,w,h}=fitCanvas(c,220);g.clearRect(0,0,w,h);
  const t=now/1000,lx=w*0.26,cy=h/2,R=Math.min(w*0.22,h*0.42);
  g.globalCompositeOperation='lighter';
  const curve=(fn,label,inv)=>{
    const x0=w*0.52,x1=w-12,y0=26,y1=h-26;g.globalCompositeOperation='source-over';
    g.strokeStyle='rgba(127,166,255,.18)';g.lineWidth=1;g.strokeRect(x0,y0,x1-x0,y1-y0);
    g.strokeStyle=AMBER;g.lineWidth=1.5;g.beginPath();
    for(let i=0;i<=160;i++){const v=fn(i/160),y=y0+(inv?v:1-v)*(y1-y0)*0.8+(y1-y0)*0.1;if(i)g.lineTo(x0+(i/160)*(x1-x0),y);else g.moveTo(x0,y);}
    g.stroke();g.fillStyle=DIM;g.font='10px '+MONO;g.textAlign='left';g.textBaseline='top';g.fillText(label,x0,6);
    return{x0,x1,y0,y1};
  };
  if(s.t==='agb'||s.t==='giant'){
    const span=1200,A=s.amp/2,fn=u=>{const tt=u*span,tau=TAU*tt/s.P+s.ph;return s.t==='agb'?0.5+0.5*(-Math.cos(tau)+0.18*Math.sin(2.7*tau))/1.18:0.5+0.5*(-Math.sin(tau)-0.35*Math.sin(2.3*tau+1))/1.35;};
    const b=curve(fn,'밝기(위가 밝음) · 1,200일',false);
    const u=((t*0.06)%1),v=fn(u),px=b.x0+u*(b.x1-b.x0),py=b.y0+(1-v)*(b.y1-b.y0)*0.8+(b.y1-b.y0)*0.1;
    g.fillStyle=TEAL;g.beginPath();g.arc(px,py,3.5,0,TAU);g.fill();
    g.globalCompositeOperation='lighter';
    const tau=TAU*(u*span)/s.P+s.ph,sz=s.t==='agb'?0.5+0.5*(-Math.cos(tau)):0.5+0.5*(-Math.sin(tau)),rr=R*(0.55+0.2*sz)*(s.t==='giant'?(1+0.25*((t/8)%1)):1);
    const q=s.t==='agb'?(t/7)%1:0;
    if(s.t==='agb')for(let i=0;i<3;i++){const qq=(q+i/3)%1;g.strokeStyle='rgba('+s.rgbs+','+(0.4*(1-qq)).toFixed(2)+')';g.lineWidth=2;g.beginPath();g.arc(lx,cy,rr*(1.2+1.2*qq),0,TAU);g.stroke();}
    else{g.strokeStyle='rgba('+s.rgbs+','+(0.35*(1-(t/8)%1)).toFixed(2)+')';g.lineWidth=2;g.beginPath();g.arc(lx,cy,rr*1.25,0,TAU);g.stroke();}
    const gr=g.createRadialGradient(lx,cy,0,lx,cy,rr*2);gr.addColorStop(0,'rgba('+s.rgbs+',.7)');gr.addColorStop(1,'rgba('+s.rgbs+',0)');g.fillStyle=gr;g.beginPath();g.arc(lx,cy,rr*2,0,TAU);g.fill();
    g.fillStyle='rgba(255,240,225,.85)';g.beginPath();g.arc(lx,cy,rr*0.7,0,TAU);g.fill();
  }else if(s.t==='ns'){
    const ang=t*1.3;g.fillStyle='rgba(170,200,255,.25)';g.beginPath();g.arc(lx,cy,R*0.5,0,TAU);g.fill();
    g.fillStyle='#eaf3ff';g.beginPath();g.arc(lx,cy,R*0.22,0,TAU);g.fill();
    for(const sg of[1,-1]){const gr=g.createLinearGradient(lx,cy,lx+sg*Math.cos(ang)*R*1.6,cy+sg*Math.sin(ang)*R*1.6);gr.addColorStop(0,'rgba(170,205,255,.75)');gr.addColorStop(1,'rgba(170,205,255,0)');g.strokeStyle=gr;g.lineWidth=7;g.beginPath();g.moveTo(lx,cy);g.lineTo(lx+sg*Math.cos(ang)*R*1.6,cy+sg*Math.sin(ang)*R*1.6);g.stroke();}
    const fn=u=>{let v=0;for(let k=0;k<3;k++){const d=(u*3-k-0.5)/0.09;v+=Math.exp(-d*d);}return Math.min(1,v);};
    const b=curve(fn,'전파 펄스 · 주기 '+(s.Pspin<1?(s.Pspin*1000).toFixed(1)+' ms':s.Pspin.toFixed(2)+' s'),false);
    const u=(t*0.45)%1;g.strokeStyle='rgba(98,207,199,.6)';g.beginPath();g.moveTo(b.x0+u*(b.x1-b.x0),b.y0);g.lineTo(b.x0+u*(b.x1-b.x0),b.y1);g.stroke();
  }else if(s.t==='bh'){
    g.globalCompositeOperation='lighter';
    for(let i=0;i<5;i++){g.strokeStyle='rgba(255,'+(140+i*18)+',90,'+(0.5-i*0.07).toFixed(2)+')';g.lineWidth=4;g.beginPath();g.ellipse(lx,cy,R*(0.5+0.17*i),R*(0.5+0.17*i)*0.28,-0.25,0,TAU);g.stroke();}
    for(let i=0;i<7;i++){const a=t*(1.6-i*0.15)+i*1.9,rr=R*(0.62+0.1*i);g.fillStyle='rgba(255,220,160,.8)';g.beginPath();g.arc(lx+rr*Math.cos(a)*Math.cos(-0.25)-rr*0.28*Math.sin(a)*Math.sin(-0.25),cy+rr*Math.cos(a)*Math.sin(-0.25)+rr*0.28*Math.sin(a)*Math.cos(-0.25),2.2,0,TAU);g.fill();}
    g.strokeStyle='rgba(150,190,255,.35)';g.lineWidth=3;g.beginPath();g.moveTo(lx,cy-R*0.2);g.lineTo(lx,cy-R*1.2);g.moveTo(lx,cy+R*0.2);g.lineTo(lx,cy+R*1.2);g.stroke();
    g.globalCompositeOperation='source-over';g.fillStyle='#000';g.beginPath();g.arc(lx,cy,R*0.34,0,TAU);g.fill();g.strokeStyle='rgba(255,200,140,.9)';g.lineWidth=1.5;g.stroke();
    const fn=u=>{let v=0.5;for(let k=1;k<=6;k++)v+=0.16*Math.sin(u*TAU*(k*3.1)+s.varPh*k+t*(0.3+0.1*k))/k;return Math.max(0.03,Math.min(0.97,v));};
    curve(fn,'X선 세기 · 불규칙한 깜박임',false);
  }else{
    const spr=s.t==='gal'?SPR.gal[s.gk]:SPR.neb[s.nk],Rd=Math.min(w,h)*0.46;
    g.globalCompositeOperation='lighter';g.save();g.translate(w/2,cy);g.rotate(s.ang);if(s.t==='gal')g.scale(1,s.q);g.drawImage(spr,-Rd,-Rd,2*Rd,2*Rd);g.restore();
    if(s.t==='gal')galMembers(g,s,w/2,cy,Rd*0.85,Math.min(s.n,5000),1);
  }
  g.globalCompositeOperation='source-over';
}

function helpHTML(){
  return `<section class="sec help"><h3>관측 순서</h3><ol>

    <li>행성이 있는 별 고르기<span>전체 별 2,000,000개 중 1,500,000개에 행성이 있습니다. 직접 관측할 수 있는 일반 별 9,000개 중에서는 8,000개에 행성이 있고(나머지 1,492,000개는 은하 속 별), 그중 918개 행성계에 거주 가능 영역의 행성이 정확히 하나 있습니다. 나머지는 가스 거대 행성 등만 있는 별이며, 영역 바깥에 가스 거대 행성이 있기도 합니다. 단서: 행성은 12.5등급보다 밝은 주황·붉은 별(K·M형) 주위에서만 발견됩니다.</span></li>

}

/* 관측 애니메이션 */
function startObserve(days){
  if(U.anim)return;
  const s=stars[U.sel],st=ensureSt(s.id),cur=st[U.tab],to=Math.min(MAXD,cur+days);
  if(to<=cur){msg('관측 한도('+MAXD+'일)에 도달했습니다.');return;}
  U.D=buildData(s,U.tab,to);
  U.anim={tab:U.tab,from:cur,to,t0:performance.now(),dur:RM?50:Math.min(3500,Math.max(700,(to-cur)*8))};U.shown=cur;
  msg('관측 중…');
}
function finishAnim(){
  if(!U.anim)return;
  const a=U.anim,s=stars[U.sel],st=ensureSt(s.id);
  st[a.tab]=a.to;U.anim=null;
  if(a.tab===U.tab)U.D=buildData(s,U.tab,a.to);
  dirtySave();
  if(a.tab===U.tab&&U.sel!=null){ensurePG();const od=$('#obsDays');if(od)od.textContent=a.to;msg('관측이 끝났습니다. 주기 분석의 봉우리를 확인하세요.');if(U.ptab==='star'){renderPanel();}}
}

/* 주기 선택과 확정 */
function pickFromPg(clientX){
  const c=$('#cPg'),G=U.pg[U.tab];if(!c||!G||U.anim)return;
  const inf=c._info;if(!inf)return;
  const rect=c.getBoundingClientRect(),x=clientX-rect.left,f=Math.max(0,Math.min(1,(x-inf.pl)/inf.iw)),P0=Math.exp(inf.lmin+f*(inf.lmax-inf.lmin));
  let bi=-1,bv=-1;
  for(let i=0;i<G.Ps.length;i++){if(Math.abs(G.Ps[i]/P0-1)<0.15&&G.pw[i]>bv){bv=G.pw[i];bi=i;}}
  let P1=bi>=0?G.Ps[bi]:P0,bestP=P1,bestV=-1;
  for(let k=-20;k<=20;k++){const Pt=P1*(1+k*0.0001),v=powerAt(Pt);if(v>bestV){bestV=v;bestP=Pt;}}
  U.pc[U.tab]=bestP;U.base=bestP;const fine=$('#pcFine');if(fine)fine.value=0;
  updatePc();drawPG();drawFold();msg('');
}
function confirmPeriod(){
  const s=stars[U.sel],st=ensureSt(s.id),tab=U.tab,P=U.pc[tab],D=U.D;
  if(U.anim)return;
  if(!P||!D){msg('먼저 관측하고, 주기 그래프에서 주기를 고르세요.','bad');return;}
  const G=ensurePG(),thr=G?G.thr:(tab==='lc'?7:5),found=new Set(st.pl.map(r=>r.k));
  const pool=s.pl.filter(p=>!found.has(p.k)&&(tab==='rv'||p.tr));
  let hit=null,hitF=1,near=false;
  for(const pl of pool){
    for(const f of[1,2,3,0.5,1/3,1.5,2/3]){
      if(Math.abs(P/(pl.P*f)-1)>=(f===1?0.02:0.03))continue;
      if(powerAt(pl.P)>=thr){if(!hit||f===1){hit=pl;hitF=f;}}else near=true;
    }
  }
  let alias=false;
  if(!hit&&!near&&powerAt(P)>=thr){
    for(const pl of pool){
      if(powerAt(pl.P)<thr)continue;
      if(powerWithout(pl,P)<thr){hit=pl;alias=true;break;}
    }
  }
  if(!hit){
    if(near)msg('이 주기 근처에 신호가 있지만 아직 기준선 아래입니다. 관측 기간을 늘려 보세요.','bad');
    else if(powerAt(P)>=thr)msg('기준선을 넘었지만 실제 행성 신호가 아닌 가짜 봉우리입니다. 가장 높은 봉우리부터 확인하고, 접힌 곡선이 한 곳에 모이는지 보세요.','bad');
    else msg('이 주기는 기준선 아래라서 신호가 확인되지 않습니다. 기준선 위의 봉우리를 골라 보세요.','bad');
    return;
  }
  if(alias)toast('가짜 봉우리였지만 실제 신호가 숨어 있었습니다. '+hit.P.toFixed(3)+'일로 보정했습니다');
  else if(hitF!==1)toast('선택한 주기는 실제의 '+(hitF>=1?hitF.toFixed(hitF%1?1:0)+'배':'1/'+Math.round(1/hitF))+'였습니다. '+hit.P.toFixed(3)+'일로 보정했습니다');
  const rec={k:hit.k,letter:LETTERS[st.pl.length]||'?',P:hit.P*(1+(hash2(s.id*11+hit.k,5)-0.5)*0.00004),via:tab,orbit:0,e:0,w:0,K:0,t:Date.now()};
  st.pl.push(rec);S.log.unshift({sid:s.id,k:hit.k});
  S.score+=40+(hit.hz?25:0);
  toast(planetName(s,rec)+' 발견! 이름을 지어 주세요','good');
  ach('p1','첫 행성을 발견했습니다');
  if(hit.hz)ach('hz','거주 가능 영역의 행성을 발견했습니다');
  if(st.pl.length>=2)ach('multi','다중 행성계를 발견했습니다');
  U.D=buildData(s,tab,st[tab]);U.pg[tab]=null;U.pc[tab]=null;U.focusName=hit.k;
  dirtySave();dirty=true;renderPanel();
}

/* 궤도 맞추기 */
function openSolve(k){
  const s=stars[U.sel],st=ensureSt(s.id),rec=st.pl.find(r=>r.k===k),pl=recPl(s,rec),days=st.rv;
  U.solve={k};
  if(days<=0){U.solve.err='전파 도플러 관측 자료가 아직 없습니다. 도플러 탭에서 먼저 관측하세요.';}
  else if(days<rec.P*1.2){U.solve.err='관측 기간이 부족합니다. 주기('+rec.P.toFixed(1)+'일)의 1.2배 이상, 즉 '+Math.ceil(rec.P*1.2)+'일 이상 관측해야 합니다.';}
  else{
    const n=Math.floor(days/RV_DT);
    if(pl.K*Math.sqrt(n/2)/s.sigR<6){U.solve.err='속도 변화가 잡음에 묻혀 궤도 모양을 알 수 없습니다. 관측을 늘리거나 원형 궤도로 추정하세요.';U.solve.weak=true;}
    else{
      const b=baseRV(s,days),y=Float32Array.from(b.v.subarray(0,n));
      for(const r2 of st.pl){if(r2===rec)continue;const p2=recPl(s,r2);if(!rvOK(s,p2,days))continue;const f=harmFit(b.t,y,n,r2.P,2);for(let i=0;i<n;i++)y[i]-=harmEval(f,b.t[i],true);}
      const stp=Math.max(1,Math.floor(n/450)),m=Math.floor(n/stp),ts=new Float64Array(m),ys=new Float64Array(m);
      for(let i=0;i<m;i++){ts[i]=b.t[i*stp];ys[i]=y[i*stp];}
      const qT=fitOrbit(ts,ys,m,rec.P,pl.e,pl.w).q;
      if(qT<0.08){U.solve.err='신호가 약해 궤도 모양을 가려낼 수 없습니다. 관측을 늘리거나 원형 궤도로 추정하세요.';U.solve.weak=true;}
      else Object.assign(U.solve,{ts,ys,m,qT,rec,e:0,w:0,fit:null});
    }
  }
  renderPanel();
}
function initSolve(){
  const sd=U.solve;if(!sd||sd.err)return;
  sd.e=0;sd.w=0;updateSolve();
}
function updateSolve(){
  const sd=U.solve;if(!sd||sd.err||!sd.ts)return;
  const eEl=$('#sE'),wEl=$('#sW');if(!eEl)return;
  sd.e=+eEl.value;sd.w=(+wEl.value)*Math.PI/180;
  $('#oE').textContent=sd.e.toFixed(2);$('#oW').textContent=wEl.value+'°';
  sd.fit=fitOrbit(sd.ts,sd.ys,sd.m,sd.rec.P,sd.e,sd.w);
  const q=sd.fit.q,need=sd.qT-0.04;
  $('#gFill').style.width=Math.max(0,Math.min(100,q/sd.qT*100))+'%';
  $('#gMark').style.left=(need/sd.qT*100)+'%';
  $('#gTxt').textContent='맞춤도 '+Math.max(0,q*100).toFixed(0)+'% · 목표 '+(need*100).toFixed(0)+'%';
  const ok=q>=need;$('#bOrbit').disabled=!ok;
  const mEl=$('#solveMsg');mEl.textContent=ok?'목표를 넘었습니다. 궤도를 확정하세요.':'곡선 모양이 점들과 겹치도록 e와 ω를 조절하세요. 금색 눈금을 넘으면 확정할 수 있습니다.';mEl.className='msg'+(ok?' ok':'');
  drawSolve();
}
function drawSolve(){
  const c=$('#cSolve');if(!c)return;
  const sd=U.solve;if(!sd||!sd.fit)return;
  const{g,w,h}=fitCanvas(c,150);g.clearRect(0,0,w,h);
  g.font='10px '+MONO;g.textBaseline='middle';
  const pl=40,pr=8,pt=8,pb=18,iw=w-pl-pr,ih=h-pt-pb,P=sd.rec.P,fit=sd.fit;
  const ph0=-fit.ph,xs=new Float64Array(sd.m);
  const sorted=Array.from(sd.ys).sort((a,b)=>a-b),lo0=sorted[Math.floor(sorted.length*0.01)],hi0=sorted[Math.floor(sorted.length*0.99)],pad=(hi0-lo0)*0.15||1;
  const lo=lo0-pad,hi=hi0+pad,X=x=>pl+x*iw,Y=v=>pt+(1-(v-lo)/(hi-lo))*ih;
  g.strokeStyle=LINE;g.fillStyle=DIM;g.textAlign='right';
  for(let i=0;i<3;i++){const v=lo+(hi-lo)*i/2,y=Y(v);g.beginPath();g.moveTo(pl,y);g.lineTo(w-pr,y);g.stroke();g.fillText(v.toFixed(1),pl-4,y);}
  g.textAlign='center';g.fillText('위상  (m/s)',w/2,h-7);
  g.save();g.beginPath();g.rect(pl,pt,iw,ih);g.clip();
  g.fillStyle=TEAL+'90';
  for(let i=0;i<sd.m;i++){let ph=(sd.ts[i]/P+fit.ph)%1;if(ph<0)ph+=1;g.fillRect(X(ph)-.8,Y(sd.ys[i])-.8,1.8,1.8);}
  g.strokeStyle=AMBER;g.lineWidth=2;g.beginPath();
  for(let i=0;i<=120;i++){const ph=i/120,v=fit.c+fit.K*orbShape(ph,sd.e,sd.w);if(i)g.lineTo(X(ph),Y(v));else g.moveTo(X(ph),Y(v));}
  g.stroke();g.restore();
}
function acceptOrbit(circ){
  const s=stars[U.sel],st=ensureSt(s.id),sd=U.solve,rec=st.pl.find(r=>r.k===(sd?sd.k:-1));
  if(!rec)return;
  if(circ){rec.orbit=1;rec.e=0;rec.w=0;S.score+=15;toast(planetName(s,rec)+': 원형 궤도로 추정했습니다');}
  else{
    const f=sd.fit;rec.orbit=2;rec.e=sd.e;rec.w=f.K<0?(sd.w+Math.PI)%TAU:sd.w;rec.K=Math.abs(f.K);
    S.score+=60;toast(planetName(s,rec)+' 궤도 확정! e = '+rec.e.toFixed(2),'good');ach('orb1','첫 궤도를 확정했습니다');
  }
  U.solve=null;dirtySave();renderPanel();
}

/* 항성계 확대 */
function drawSys(now){
  const c=$('#cSys');if(!c||U.sel==null||U.ptab!=='star')return;
  const{g,w,h}=fitCanvas(c,240);g.clearRect(0,0,w,h);
  const s=stars[U.sel],st=ensureSt(s.id),cx=w/2,cy=h/2,R=Math.min(w,h)/2-10;
  const recs=st.pl.map(rec=>({rec,pl:recPl(s,rec),a:Math.cbrt(s.M*Math.pow(rec.P/365.25,2))}));
  const maxA=recs.reduce((m,r)=>Math.max(m,r.a),0);
  const base=recs.length?Math.max(0.12,maxA*1.35):1.3*Math.sqrt(s.L);
  const view=base/U.sysZ,sc=R/view,t=now/1000*30;
  const hzI=0.95*Math.sqrt(s.L),hzO=1.7*Math.sqrt(s.L);
  if(hzO*sc<R*4){g.strokeStyle='rgba(143,214,148,.12)';g.lineWidth=Math.max(1,(hzO-hzI)*sc);g.beginPath();g.arc(cx,cy,(hzI+hzO)/2*sc,0,TAU);g.stroke();}
  const sr=Math.min(R*0.5,Math.max(5,s.Rs*0.00465*sc));
  const grd=g.createRadialGradient(cx,cy,0,cx,cy,sr*3);grd.addColorStop(0,'rgba('+s.rgbs+',.55)');grd.addColorStop(1,'rgba('+s.rgbs+',0)');
  g.fillStyle=grd;g.beginPath();g.arc(cx,cy,sr*3,0,TAU);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(cx,cy,sr,0,TAU);g.fill();
  g.fillStyle='rgba('+s.rgbs+',.7)';g.beginPath();g.arc(cx,cy,sr,0,TAU);g.fill();
  for(const{rec,pl,a}of recs){
    const e=rec.orbit===2?rec.e:0,w0=rec.orbit===2?rec.w:0;
    g.lineWidth=1.2;g.strokeStyle=rec.orbit===2?'rgba(242,196,109,.75)':'rgba(135,148,176,.55)';
    g.setLineDash(rec.orbit===2?[]:[4,4]);g.beginPath();
    for(let i=0;i<=120;i++){const nu=i/120*TAU,r=a*(1-e*e)/(1+e*Math.cos(nu)),x=cx+r*Math.cos(nu+w0)*sc,y=cy+r*Math.sin(nu+w0)*sc;if(i)g.lineTo(x,y);else g.moveTo(x,y);}
    g.stroke();g.setLineDash([]);
    const M=TAU*(t/rec.P+pl.ph),nu=trueAnom(M,e),r=a*(1-e*e)/(1+e*Math.cos(nu)),px=cx+r*Math.cos(nu+w0)*sc,py=cy+r*Math.sin(nu+w0)*sc;
    const re=pl.tr&&st.lc>0?Math.sqrt(pl.depth)*s.Rs/0.009168:3,pr=Math.max(2.5,Math.min(8,2+Math.sqrt(re)*1.1));
    g.fillStyle=TEAL;g.beginPath();g.arc(px,py,pr,0,TAU);g.fill();
    g.fillStyle=TEXT;g.font='11px '+MONO;g.textAlign='left';g.textBaseline='middle';g.fillText(rec.letter,px+pr+3,py);
  }
  if(!recs.length){g.fillStyle=DIM;g.font='13px "IBM Plex Sans KR",sans-serif';g.textAlign='center';g.fillText('아직 발견된 행성이 없습니다',cx,h-16);}
  const cap=$('#sysCap');if(cap){const tx='시야 반경 '+view.toFixed(view<1?3:2)+' AU'+(hzO*sc<R*4?' · 초록 띠는 액체 물이 가능한 거리':'');if(cap.textContent!==tx)cap.textContent=tx;}
}

/* 패널 이벤트 */
pbody.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v;
  if(act==='tab'){finishAnim();U.tab=v;rebuildData();renderPanel();}
  else if(act==='obs')startObserve(+v);
  else if(act==='confirm')confirmPeriod();
  else if(act==='sysz'){U.sysZ=Math.max(0.4,Math.min(60,U.sysZ*(+v>0?1.6:1/1.6)));}
  else if(act==='solve'){finishAnim();openSolve(+v);}
  else if(act==='closesolve'){U.solve=null;renderPanel();}
  else if(act==='gorv'){U.solve=null;U.tab='rv';rebuildData();renderPanel();}
  else if(act==='orbit')acceptOrbit(false);
  else if(act==='circ')acceptOrbit(true);
  else if(act==='logsel'){selectStar(+v);}
  else if(act==='expprog')saveFile('천문대-진행상황.json',JSON.stringify(progObj()));
  else if(act==='impprog'){const f=$('#impFile');if(f)f.click();}
  else if(act==='newcon'){conNew();linkFrom=null;renderPanel();dirty=true;}
  else if(act==='actcon'){S.act=+v;linkFrom=null;dirtySave();renderPanel();dirty=true;}
  else if(act==='delcon'){S.cons.splice(+v,1);S.act=Math.min(S.act,S.cons.length-1);if(S.act<0&&S.cons.length)S.act=0;linkFrom=null;dirtySave();renderPanel();dirty=true;}
});
pbody.addEventListener('change',e=>{if(e.target.id==='impFile'){const f=e.target.files[0];if(f)f.text().then(importProg);e.target.value='';}});
pbody.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='inStar'){const v=t.value.trim();if(v)S.names[U.sel]=v;else delete S.names[U.sel];dirtySave();dirty=true;}
  else if(t.classList.contains('conname')){const c=S.cons[+t.dataset.i];if(c){c.name=t.value.slice(0,24);dirtySave();dirty=true;}}
  else if(t.classList.contains('pname')){const key=U.sel+':'+t.dataset.k,v=t.value.trim();if(v)S.pn[key]=v;else delete S.pn[key];dirtySave();}
  else if(t.id==='pcFine'){if(U.base){U.pc[U.tab]=U.base*(1+(+t.value)/10000);updatePc();drawPG();drawFold();}}
  else if(t.id==='sE'||t.id==='sW')updateSolve();
});
pbody.addEventListener('pointerdown',e=>{if(e.target.id==='cPg')pickFromPg(e.clientX);});
pbody.addEventListener('wheel',e=>{if(e.target.id==='cSys'){e.preventDefault();U.sysZ=Math.max(0.4,Math.min(60,U.sysZ*Math.exp(-e.deltaY*0.0018)));}},{passive:false});
$('#tabStar').onclick=()=>{U.ptab='star';panel.classList.add('open');renderPanel();};
$('#tabLog').onclick=()=>{U.ptab='log';panel.classList.add('open');renderPanel();};
$('#btnFold').onclick=()=>panel.classList.toggle('open');

/* 상단 수치와 도구 상태 */
let lastStat='';
function updateStats(){
  let np=0,no=0;for(const id in S.st){for(const r of S.st[id].pl){np++;if(r.orbit===2)no++;}}
  const key=S.nDisc+'|'+np+'|'+no+'|'+S.score;
  if(key!==lastStat){lastStat=key;$('#stStars').textContent=S.nDisc.toLocaleString();$('#stPlanets').textContent=np;$('#stOrbits').textContent=no;$('#stScore').textContent=S.score.toLocaleString();}
  const intro=$('#intro');if(intro)intro.hidden=S.nDisc>=8;
  const pct=Math.round(S.auto/(ACOLS*AROWS)*100);
  const lbl=S.autoOn?'탐사 중 '+pct+'%':S.auto>=ACOLS*AROWS?'전천 탐사 완료':S.auto>0?'탐사 이어서 '+pct+'%':'자동 탐사';
  const ba=$('#bAuto');if(ba.textContent!==lbl)ba.textContent=lbl;ba.classList.toggle('on',S.autoOn);
  const hn='한계등급 '+limMag().toFixed(1)+' · 배율 ×'+(cam.z/zRef).toFixed(1)+' · 스캔 반경 '+Math.round(RET/cam.z)+' 단위';
  const hint=$('#hint');if(hint.textContent!==hn)hint.textContent=hn;
}

/* 메인 루프 */
let last=performance.now(),autoAcc=0;
function tick(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(camAnim){
    const f=Math.min(1,(now-camAnim.t0)/camAnim.dur),e=1-Math.pow(1-f,3);
    cam.x=camAnim.fx+(camAnim.tx-camAnim.fx)*e;cam.y=camAnim.fy+(camAnim.ty-camAnim.fy)*e;cam.z=camAnim.fz+(camAnim.tz-camAnim.fz)*e;
    clampCam();if(f>=1)camAnim=null;dirty=true;
  }
  if(S.autoOn){
    autoAcc+=dt*8;let c=0;
    while(autoAcc>=1&&S.auto<ACOLS*AROWS&&c<20){autoAcc-=1;autoStep();c++;}
    if(S.auto>=ACOLS*AROWS){S.autoOn=false;toast('전천 탐사를 마쳤습니다. 확대하면 더 어두운 별이 보입니다.','good');}
    dirty=true;
  }
  if(U.anim){
    const a=U.anim,f=Math.min(1,(now-a.t0)/a.dur);
    U.shown=a.from+(a.to-a.from)*(1-Math.pow(1-f,2));
    const od=$('#obsDays');if(od)od.textContent=Math.floor(U.shown);
    if(f>=1)finishAnim();
  }
  if(dirty||fx.length){drawSky(now);dirty=false;}
  if(U.sel!=null&&U.ptab==='star'){if(stars[U.sel].t==='ms'){drawSys(now);if(U.anim||U.drawNow){drawData();}}else drawObjPanel(now);}
  updateStats();
  requestAnimationFrame(tick);
}

/* 시작 */
window.addEventListener('resize',()=>{resize();if(U.sel!=null)redrawPlots();});
function redrawPlots(){if(U.sel!=null&&stars[U.sel].t!=='ms')return;drawData();drawPG();drawFold();drawSolve();}
const _render=renderPanel;
renderPanel=function(){_render();if(U.sel!=null&&U.ptab==='star'&&stars[U.sel].t==='ms'){redrawPlots();}};
resize();
new ResizeObserver(()=>{resize();if(U.sel!=null)redrawPlots();}).observe(wrap);
if(S.nDisc===0){/* 하늘 전체에 고르게: 40x20 칸마다 가장 밝은 별 하나 */
  const best=new Array(800).fill(null);
  for(const s of stars){if(s.m>12.4)continue;const c=Math.min(19,(s.y/(H/20))|0)*40+Math.min(39,(s.x/(W/40))|0);if(!best[c]||s.m<best[c].m)best[c]=s;}
  for(const s of best)if(s){S.disc[s.id]=1;S.nDisc++;S.score+=1;}
  dirtySave();
}
checkAch();
setMode('scan');
renderPanel();
requestAnimationFrame(tick);
})();
</script>
