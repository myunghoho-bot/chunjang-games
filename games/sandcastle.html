<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>모래성</title>
<style>
:root{--bg:rgba(251,248,241,.94);--bd:#d8ccb4;--tx:#2a2824;--sub:#7a7266;--ac:#1d6f73;--ac2:#e6f1f0;--lock:#b9b0a2;--warn:#a0522d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9ec9db;font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:var(--tx);-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
.pn{background:var(--bg);border:1px solid var(--bd);border-radius:8px;box-shadow:0 2px 10px rgba(60,45,20,.12)}
#top{position:fixed;left:8px;right:8px;top:8px;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px}
#top .ttl{font-weight:800;font-size:17px;letter-spacing:.5px;white-space:nowrap}
#top .beach{font-size:12px;color:var(--sub);white-space:nowrap}
#top .sp{flex:1}
.tb{height:30px;padding:0 11px;border:1px solid var(--bd);border-radius:6px;background:#fff;font-size:13px;white-space:nowrap}
.tb:hover{border-color:var(--ac);color:var(--ac)}
.tb:disabled{opacity:.45;cursor:default;color:inherit;border-color:var(--bd)}
.tb.on{background:var(--ac);border-color:var(--ac);color:#fff}
#sunbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);white-space:nowrap}
#sun{width:150px;accent-color:#d98a2b}
#clock{width:40px;font-variant-numeric:tabular-nums;color:var(--tx)}
.stat{display:flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.stat svg{width:18px;height:18px}
#sandbar{width:92px;height:9px;border-radius:5px;background:#e9e1d0;overflow:hidden;border:1px solid #d6c9ad}
#sandbar i{display:block;height:100%;width:50%;background:linear-gradient(#d9b877,#c49a52)}
#tools{position:fixed;left:8px;top:60px;width:84px;padding:6px;display:flex;flex-direction:column;gap:4px}
.tl{position:relative;height:56px;border:1px solid transparent;border-radius:6px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.tl svg{width:26px;height:26px;stroke:#3d3830;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tl:hover{background:#fff;border-color:var(--bd)}
.tl.on{background:var(--ac2);border-color:var(--ac)}
.tl.on svg{stroke:var(--ac)}
.tl.lk{color:var(--lock);cursor:default}
.tl.lk svg{stroke:var(--lock)}
.tl .k{position:absolute;right:4px;top:3px;font-size:10px;color:var(--sub)}
.tl .lkt{font-size:10px;color:var(--lock)}
#opts{position:fixed;left:100px;top:60px;width:220px;padding:10px 12px;font-size:13px}
#opts h4{margin:0 0 8px;font-size:14px}
#opts .row{margin:8px 0}
#opts label{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-bottom:3px}
#opts input[type=range]{width:100%;accent-color:var(--ac)}
#opts .seg{display:flex;flex-wrap:wrap;gap:4px}
#opts .seg button{flex:1 1 auto;min-width:60px;height:28px;border:1px solid var(--bd);border-radius:5px;background:#fff;font-size:12px}
#opts .seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#opts .seg button:disabled{color:var(--lock);background:#f4f0e8;cursor:default}
#opts .note{font-size:11px;color:var(--sub);line-height:1.45;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid button{height:58px;border:1px solid var(--bd);border-radius:5px;background:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
.grid button canvas{width:34px;height:34px}
.grid button.on{border-color:var(--ac);background:var(--ac2)}
.grid button:disabled{opacity:.4;cursor:default}
.grid button b{font-weight:600;color:var(--sub);font-size:10px}
#help{position:fixed;left:8px;bottom:8px;padding:6px 10px;font-size:11.5px;color:var(--sub);max-width:calc(100% - 16px)}
#toasts{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:8px 14px;font-size:13px;background:rgba(36,40,42,.88);color:#fff;border-radius:6px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;max-width:520px;text-align:center}
.toast.show{opacity:1;transform:none}
.toast b{color:#ffd88a}
#dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,30,30,.25)}
#dlg.show{display:flex}
#dlgc{width:min(720px,calc(100% - 24px));max-height:calc(100% - 40px);display:flex;flex-direction:column}
#dlgh{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--bd)}
#dlgh .tab{height:30px;padding:0 14px;border:1px solid var(--bd);border-radius:6px;background:#fff;font-size:13px}
#dlgh .tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#dlgh .x{margin-left:auto;width:30px;height:30px;border:1px solid var(--bd);border-radius:6px;background:#fff;font-size:16px;line-height:1}
#dlgb{padding:12px 14px;overflow:auto;font-size:13px}
.goal{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;background:#fff}
.goal .gt{flex:1}
.goal .gt b{display:block;font-size:13.5px}
.goal .gt span{font-size:12px;color:var(--sub)}
.goal .pr{width:90px;height:7px;border-radius:4px;background:#ece5d6;overflow:hidden}
.goal .pr i{display:block;height:100%;background:var(--ac)}
.goal .rw{width:62px;text-align:right;font-size:12px;color:var(--sub)}
.goal.done{background:#eef6f3}
.goal.done .gt b{color:var(--ac)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dx{border:1px solid var(--bd);border-radius:6px;background:#fff;padding:8px;font-size:12px;line-height:1.45}
.dx canvas{display:block;width:64px;height:64px;margin:0 auto 4px}
.dx b{display:block;font-size:13px;text-align:center}
.dx .cnt{display:block;text-align:center;color:var(--sub);font-size:11px;margin-bottom:4px}
.dx.no{color:var(--lock)}
.dx.no b{color:var(--lock)}
.sec{margin:4px 0 14px}
.sec h5{margin:0 0 6px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{border:1px solid var(--bd);border-radius:6px;background:#fff;padding:8px;font-size:12px;text-align:left;line-height:1.4}
.card b{display:block;font-size:13px;margin-bottom:2px}
.card .c{color:var(--sub)}
.card.on{border-color:var(--ac);background:var(--ac2)}
.card:disabled{color:var(--lock);cursor:default}
.card .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(0,0,0,.15)}
.optrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.optrow span{width:110px;color:var(--sub)}
.optrow .seg{display:flex;gap:4px}
.optrow .seg button{height:28px;padding:0 12px;border:1px solid var(--bd);border-radius:5px;background:#fff;font-size:12px}
.optrow .seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.small{font-size:11.5px;color:var(--sub)}
@media (max-width:1180px){#top .beach{display:none}#sun{width:110px}}
@media (max-width:980px){#sunbox span.lb{display:none}#sun{width:84px}.tb{padding:0 8px}#top{gap:6px}}
@media (max-width:820px){#opts{width:190px}#help{display:none}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<div id="top" class="pn">
  <span class="ttl">모래성</span><span class="beach" id="beachName"></span>
  <span class="sp"></span>
  <div id="sunbox"><span class="lb">해 위치</span><input id="sun" type="range" min="0" max="24" step="0.05" value="14"><span id="clock">14:00</span></div>
  <div class="stat" title="가진 모래"><svg viewBox="0 0 20 20"><path d="M3 15c2-5 4-7 7-7s5 2 7 7z" fill="#d6b273" stroke="#9a7840"/></svg><div id="sandbar"><i></i></div><span id="sandtx"></span></div>
  <div class="stat" title="불가사리"><svg viewBox="0 0 20 20"><path d="M10 1.8l2.3 5.6 6 .5-4.6 3.9 1.5 5.9L10 14.5l-5.2 3.2 1.5-5.9L1.7 7.9l6-.5z" fill="#e07a4f" stroke="#a24b2b" stroke-width=".8"/></svg><span id="startx">0</span></div>
  <button class="tb" id="bSnd" title="파도 소리">소리 켬</button>
  <button class="tb" id="bWave">큰 파도</button>
  <button class="tb" id="bUndo" title="Ctrl+Z">되돌리기</button>
  <button class="tb" id="bGoal">목표</button>
  <button class="tb" id="bDex">도감</button>
  <button class="tb" id="bSet">모래밭</button>
</div>
<div id="tools" class="pn"></div>
<div id="opts" class="pn"></div>
<div id="help" class="pn">왼쪽 버튼: 도구 쓰기 · 오른쪽 버튼 끌기: 돌려 보기 · 휠: 가까이/멀리 · 가운데 버튼 끌기 또는 W A S D: 옮기기 · Q E: 돌리기</div>
<div id="toasts"></div>
<div id="dlg"><div id="dlgc" class="pn"><div id="dlgh"></div><div id="dlgb"></div></div></div>
<script>
'use strict';
// ===== 기본 도구 =====
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const rnd=(a,b)=>a+Math.random()*(b-a);
function h2(i,j){const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)}
function vn2(x,z){const i=Math.floor(x),j=Math.floor(z),u=x-i,v=z-j,a=u*u*(3-2*u),b=v*v*(3-2*v);
  return lerp(lerp(h2(i,j),h2(i+1,j),a),lerp(h2(i,j+1),h2(i+1,j+1),a),b)*2-1}
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function pick(o){let s=0;for(const k in o)s+=o[k];let r=Math.random()*s;for(const k in o){r-=o[k];if(r<=0)return k}return Object.keys(o)[0]}
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+a;return w+((c-0xAC00)%28?a:b)}

// ===== 행렬 =====
const M4={
  id(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m},
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o},
  persp(fov,asp,n,f){const t=1/Math.tan(fov/2),o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o},
  look(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2],l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
    let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
    const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx,o=new Float32Array(16);
    o[0]=xx;o[4]=xy;o[8]=xz;o[1]=yx;o[5]=yy;o[9]=yz;o[2]=zx;o[6]=zy;o[10]=zz;
    o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);o[15]=1;return o},
  inv(a){const o=new Float32Array(16),b00=a[0]*a[5]-a[1]*a[4],b01=a[0]*a[6]-a[2]*a[4],b02=a[0]*a[7]-a[3]*a[4],b03=a[1]*a[6]-a[2]*a[5],b04=a[1]*a[7]-a[3]*a[5],b05=a[2]*a[7]-a[3]*a[6],
    b06=a[8]*a[13]-a[9]*a[12],b07=a[8]*a[14]-a[10]*a[12],b08=a[8]*a[15]-a[11]*a[12],b09=a[9]*a[14]-a[10]*a[13],b10=a[9]*a[15]-a[11]*a[13],b11=a[10]*a[15]-a[11]*a[14];
    let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!d)return M4.id();d=1/d;
    o[0]=(a[5]*b11-a[6]*b10+a[7]*b09)*d;o[1]=(a[2]*b10-a[1]*b11-a[3]*b09)*d;o[2]=(a[13]*b05-a[14]*b04+a[15]*b03)*d;o[3]=(a[10]*b04-a[9]*b05-a[11]*b03)*d;
    o[4]=(a[6]*b08-a[4]*b11-a[7]*b07)*d;o[5]=(a[0]*b11-a[2]*b08+a[3]*b07)*d;o[6]=(a[14]*b02-a[12]*b05-a[15]*b01)*d;o[7]=(a[8]*b05-a[10]*b02+a[11]*b01)*d;
    o[8]=(a[4]*b10-a[5]*b08+a[7]*b06)*d;o[9]=(a[1]*b08-a[0]*b10-a[3]*b06)*d;o[10]=(a[12]*b04-a[13]*b02+a[15]*b00)*d;o[11]=(a[9]*b02-a[8]*b04-a[11]*b00)*d;
    o[12]=(a[5]*b07-a[4]*b09-a[6]*b06)*d;o[13]=(a[0]*b09-a[1]*b07+a[2]*b06)*d;o[14]=(a[13]*b01-a[12]*b03-a[14]*b00)*d;o[15]=(a[8]*b03-a[9]*b01+a[10]*b00)*d;return o},
  tr(x,y,z){const m=M4.id();m[12]=x;m[13]=y;m[14]=z;return m},
  ry(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m},
  rx(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m},
  rz(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m},
  sc(x,y,z){const m=M4.id();m[0]=x;m[5]=y===undefined?x:y;m[10]=z===undefined?x:z;return m}
};
function chain(){let m=arguments[0];for(let i=1;i<arguments.length;i++)m=M4.mul(m,arguments[i]);return m}

// ===== 모래밭 모양 =====
// 좌표: 모래밭(계산하는 곳)은 x,z 모두 -6~6 m. 바다는 +z 쪽. 바다 높이 0.
function prof(z){let h=.42-.032*(z+6)-.03*Math.max(0,z-.5)**2;
  if(z<-7)h+=.035*Math.pow(-7-z,1.3);return Math.max(-7,Math.min(h,3.4))}
function nz(x,z){return 0.035*vn2(x*.35,z*.35)+0.012*vn2(x*1.3+5,z*1.3+2)}
const ROCKS=[[-3.8,1,1,.7],[3.2,-1.3,.8,.6],[.8,3.8,1.1,.8],[4.6,3.2,.75,.55],[-2,-3.8,.65,.45],[-4.8,4.2,.9,.65],[-12,3,2.5,1.4],[13,-1,2.2,1.2],[11,9,3,1.6],[-14,10,2.8,1.5],[-20,-4,3,1.5],[19,3,2.4,1.3]];
function chanDepth(x,z){const cx=.9*Math.sin(z*.29),w=.65+.045*Math.max(0,z+6);let d=Math.abs(x-cx)/w;
  if(z>-1.2){const b=Math.min(2.1,(z+1.2)*.45);d=Math.min(Math.abs(x-cx-b),Math.abs(x-cx+b))/w}
  return d<1?.42*(1-d*d):0}
const LAYOUTS={
  basic:{n:'열린 바닷가',cost:0,d:'파도가 정면에서 들어오는 넓은 모래사장입니다.',
    h:(x,z)=>prof(z)+nz(x,z)},
  lagoon:{n:'석호',cost:3,d:'모래 둑 안쪽에 잔잔한 물웅덩이가 있습니다. 가운데 물길로 바닷물이 드나듭니다.',
    h:(x,z)=>{let h=prof(z)+nz(x,z);const m=Math.exp(-(((z+.8)/2.1)**4))*Math.exp(-((x/4.9)**6));h-=.55*m;
      h+=.32*Math.exp(-(((z-3)/.8)**2))*smooth(.4,1.3,Math.abs(x));return h}},
  island:{n:'작은 섬',cost:6,d:'사방이 바다로 둘러싸인 둥근 섬입니다.',
    h:(x,z)=>{const r=Math.hypot(x,z*1.12);return Math.max(-7,.62-.023*r*r+nz(x,z)+.12*Math.exp(-r*r/5))}},
  spit:{n:'모래톱',cost:9,d:'좁고 긴 모래 언덕 한쪽은 바다, 다른 쪽은 잔잔한 만입니다.',
    h:(x,z)=>{const s=z-(.3+.22*x);let h=.52+nz(x,z)-(s>0?.045*s*s+.02*s:.09*s*s);return s>0?Math.max(-7,h):Math.max(-.55+.01*s,h)},
    calm:(x,z)=>z-(.3+.22*x)<0},
  delta:{n:'강 하구',cost:12,d:'강물이 모래밭을 지나 바다로 흘러 나갑니다.',
    h:(x,z)=>prof(z)+nz(x,z)-chanDepth(x,z),river:true},
  rocks:{n:'바위 해변',cost:15,d:'파도에 깎이지 않는 바위가 군데군데 있습니다. 모래 속에 화석이 더 많이 묻혀 있습니다.',
    h:(x,z)=>prof(z)+nz(x,z),
    rock:(x,z)=>{let r=-99;for(const[cx,cz,rr,t]of ROCKS){const d=Math.hypot(x-cx,(z-cz)*1.2);if(d<rr){const k=Math.pow(1-(d/rr)**2,.7)*(.8+.35*vn2(x*2.2,z*2.2));r=Math.max(r,prof(cz)+nz(x,z)-.15+t*k)}}return r}}
};
const LAYOUT_ORDER=['basic','lagoon','island','spit','delta','rocks'];
function riverSurf(z){const cx=.9*Math.sin(z*.29);return prof(z)+nz(cx,z)-.42+.17}

const SANDS={
  gold:{n:'금빛 모래',cost:0,dry:'#e2c389',wet:'#b39260',d:'석영 알갱이가 많은 흔한 바닷가 모래입니다.'},
  white:{n:'하얀 산호 모래',cost:2,dry:'#f0eadb',wet:'#c3b79d',d:'부서진 산호와 조개 껍데기가 쌓여 생긴 모래입니다.'},
  pink:{n:'분홍 모래',cost:5,dry:'#edc8b6',wet:'#bf917e',d:'붉은 껍데기를 가진 아주 작은 바다 생물(유공충)이 섞여 분홍빛이 납니다.'},
  black:{n:'검은 화산 모래',cost:8,dry:'#5d5852',wet:'#38342f',d:'화산에서 흘러나온 용암이 바다에서 식어 부서진 모래입니다.'}
};
const SAND_ORDER=['gold','white','pink','black'];

// ===== 도구 =====
const TOOLS=[
  {id:'build',n:'쌓기',key:'1',lock:0},
  {id:'dig',n:'삽',key:'2',lock:0},
  {id:'mold',n:'양동이 틀',key:'3',lock:0},
  {id:'smooth',n:'흙손',key:'4',lock:1},
  {id:'wall',n:'성벽',key:'5',lock:2},
  {id:'spray',n:'물뿌리개',key:'6',lock:3},
  {id:'water',n:'물 양동이',key:'7',lock:4},
  {id:'decor',n:'꾸미기',key:'8',lock:0}
];

// ===== 모래밭 계산 (모래 높이 + 물 + 젖은 정도) =====
const N=192,HALF=6,C=2*HALF/N,NN=N*N,CA=C*C;
const SB=new Float32Array(NN);   // 모래 높이(m)
const SD=new Float32Array(NN);   // 물 깊이(m)
const SM=new Float32Array(NN);   // 젖은 정도 0~1
let SF=new Float32Array(NN),SF2=new Float32Array(NN);   // 물거품
let SS=new Float32Array(NN),SS2=new Float32Array(NN);   // 물에 섞여 떠다니는 모래
const VX=new Float32Array(NN),VZ=new Float32Array(NN);  // 물 빠르기
const OL=new Float32Array(NN),OR=new Float32Array(NN),OU=new Float32Array(NN),OD=new Float32Array(NN);
const INIT=new Float32Array(NN); // 처음 모래 높이(바위 포함)
const FLOOR=new Float32Array(NN);// 더 못 파는 높이(바위·바닥)
const ROCKF=new Uint8Array(NN);  // 바위가 있는 칸
const RL=new Float32Array(NN);   // 강물 높이
const EDGE=new Uint8Array(NN);   // 0 안쪽, 1 파도 치는 바다, 2 잔잔한 물, 3 강, 4 막힌 가장자리
const TMP=new Float32Array(NN),REP=new Float32Array(NN);
let EDGES=[];
const ROWW=new Uint8Array(N); // 물이 있는 줄 (물 없는 줄은 계산을 건너뛴다)
let frameN=0;
const rowAct=j=>ROWW[j]||(j>0&&ROWW[j-1])||(j<N-1&&ROWW[j+1]);
const cx=i=>(i+.5)*C-HALF;
const SAND_MAX=3;
const DRY=[0,1/600,1/240];       // 안 마름, 느림, 보통
const WAVE_C=3.2,WAVE_T1=8.3,WAVE_T2=11.7,WAVE_AMP=[.07,.13,.22];
const W={t:0,sea:0,big:[],dayF:1};
const A={maxUp:0,maxDown:0,volUp:0,pond:0,flagTop:0};
function layout(){return LAYOUTS[G.layout]}

function crest(u){const f=u-Math.floor(u)-.5;return Math.exp(-f*f/.015)-.217}
function waveAt(z,t){const p=t+(z-HALF)/WAVE_C,a=WAVE_AMP[G.set.waves];
  let e=a*(crest(p/WAVE_T1)+.55*crest(p/WAVE_T2+.37));
  for(const b of W.big){const q=(p-b.t0)/1.1;e+=b.a*Math.exp(-q*q)}return e}
function tideAt(t){return G.set.tide?.12*Math.sin(t*2*Math.PI/360):0}

function setupLayout(keep){
  const L=layout();EDGES=[];
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=j*N+i,x=cx(i),z=cx(j),b=L.h(x,z),r=L.rock?L.rock(x,z):-99;
    INIT[k]=Math.max(b,r);ROCKF[k]=r>b?1:0;FLOOR[k]=r>-90?Math.max(r,b-1.2):Math.max(b-1.2,-2.6);
    if(!keep){SB[k]=INIT[k];SM[k]=0}
    EDGE[k]=0;
    if(i===0||j===0||i===N-1||j===N-1){
      if(L.river&&j===0&&chanDepth(x,z)>.03){EDGE[k]=3;RL[k]=riverSurf(z)}
      else if(b<-.01)EDGE[k]=(L.calm&&L.calm(x,z))?2:1;
      else EDGE[k]=4;
      EDGES.push(k)}
  }
  for(let k=0;k<NN;k++){SD[k]=Math.max(0,W.sea-SB[k]);SS[k]=SF[k]=VX[k]=VZ[k]=OL[k]=OR[k]=OU[k]=OD[k]=0;
    if(SD[k]>0)SM[k]=1}
  if(!keep)for(let k=0;k<NN;k++){const hw=SB[k]-W.sea;SM[k]=hw<0?1:clamp(1-hw/.4,0,.9)}
}

// 물 흐름: 칸 사이에 관이 있다고 보고, 물높이 차이만큼 흘려 보낸다
function pipe(dt){
  const K=dt*9.81*C,damp=1-dt*.35,lim0=CA/dt;
  for(let j=0;j<N;j++){if(!rowAct(j))continue;const r=j*N;for(let i=0;i<N;i++){const k=r+i,d=SD[k];
    if(d<=0){OL[k]=OR[k]=OU[k]=OD[k]=0;continue}
    const h=SB[k]+d;let l=0,rr=0,u=0,dd=0;
    if(i>0){l=OL[k]*damp+K*(h-SB[k-1]-SD[k-1]);if(l<0)l=0}
    if(i<N-1){rr=OR[k]*damp+K*(h-SB[k+1]-SD[k+1]);if(rr<0)rr=0}
    if(j>0){u=OU[k]*damp+K*(h-SB[k-N]-SD[k-N]);if(u<0)u=0}
    if(j<N-1){dd=OD[k]*damp+K*(h-SB[k+N]-SD[k+N]);if(dd<0)dd=0}
    const s=l+rr+u+dd;if(s>0){const m=d*lim0/s;if(m<1){l*=m;rr*=m;u*=m;dd*=m}}
    OL[k]=l;OR[k]=rr;OU[k]=u;OD[k]=dd}}
  const f=dt/CA;
  for(let j=0;j<N;j++){if(!rowAct(j))continue;const r=j*N;let w=0;for(let i=0;i<N;i++){const k=r+i;
    const inL=i>0?OR[k-1]:0,inR=i<N-1?OL[k+1]:0,inU=j>0?OD[k-N]:0,inD=j<N-1?OU[k+N]:0;
    const d0=SD[k];let d1=d0+f*(inL+inR+inU+inD-OL[k]-OR[k]-OU[k]-OD[k]);if(d1<0)d1=0;SD[k]=d1;
    const av=(d0+d1)*.5;
    if(d1>0)w=1;
    if(av>.003){VX[k]=clamp((inL-OL[k]+OR[k]-inR)*.5/(C*av),-4,4);VZ[k]=clamp((inU-OU[k]+OD[k]-inD)*.5/(C*av),-4,4)}
    else{VX[k]=0;VZ[k]=0}}ROWW[j]=w}
}
function scanRows(){for(let j=0;j<N;j++){let w=0;const r=j*N;for(let i=0;i<N;i++)if(SD[r+i]>0){w=1;break}ROWW[j]=w}}
function forceEdges(){
  for(const k of EDGES){const e=EDGE[k];let lv;
    if(e===1)lv=W.sea+waveAt(cx((k/N)|0),W.t);else if(e===2)lv=W.sea;else if(e===3)lv=RL[k];else continue;
    SD[k]=Math.max(0,lv-SB[k])}
}
// 물에 깎이고 쌓이는 모래, 물거품, 마르기
function sedFoam(dt0){const sea=W.sea,ph=frameN&3;
  for(let j=0;j<N;j++){const wet=rowAct(j);if(!wet&&(j&3)!==ph)continue;const dt=wet?dt0:dt0*4;
  const KC=.012,KE=.7*dt,KD=1.5*dt,dry=DRY[G.set.dry]*dt*(W.dayF*.75+.25),fd=1-dt*.55,fq=Math.max(0,1-dt*3);
  for(let k=j*N,ke=k+N;k<ke;k++){const d=SD[k];
    if(d<.003){if(SS[k]>0){SB[k]+=SS[k];SS[k]=0}SF[k]*=fq;
      if(EDGE[k]===0&&SB[k]<sea-.01){SD[k]=d+dt*.015;SM[k]=1;continue}
      const hw=SB[k]-sea,mc=hw<0?1:clamp(1-hw/.4,0,.9),m=SM[k]-dry;SM[k]=m>mc?m:mc;continue}
    SM[k]=1;
    if(EDGE[k]===0&&SB[k]>sea+.01){SD[k]=d>dt*.0012?d-dt*.0012:0}
    else if(EDGE[k]===0&&SB[k]+d<sea)SD[k]=d+Math.min(sea-SB[k]-d,dt*.015)
    const sp=Math.hypot(VX[k],VZ[k]),cap=KC*Math.max(0,sp-.15)*Math.min(1,d/.05),s=SS[k];
    if(s<cap){let e=(cap-s)*KE;const room=SB[k]-FLOOR[k];if(e>room)e=room;if(e>0){SB[k]-=e;SS[k]=s+e}}
    else{const dp=(s-cap)*KD;SB[k]+=dp;SS[k]=s-dp}
    let g=Math.max(0,sp-.8)*1.3;if(d<.05&&sp>.6)g+=.9;
    const fo=SF[k]*fd+g*dt*2;SF[k]=fo>1?1:fo}}
}
function advect(src,dst,dt){const s=dt/C,M1=N-1.001;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=j*N+i;
    if(SD[k]<.003){dst[k]=src[k];continue}
    let x=i-VX[k]*s,z=j-VZ[k]*s;x=x<0?0:x>M1?M1:x;z=z<0?0:z>M1?M1:z;
    const x0=x|0,z0=z|0,fx=x-x0,fz=z-z0,q=z0*N+x0;
    dst[k]=(src[q]*(1-fx)+src[q+1]*fx)*(1-fz)+(src[q+N]*(1-fx)+src[q+N+1]*fx)*fz}
}
// 무너지기: 젖은 모래는 가파르게 버티고, 마른 모래·물살 속 모래는 금방 흘러내린다
let slRate=.2,slDt=0;
function slP(a,b,f){const da=SB[a]-SB[b];let hi,lo,d;if(da>0){hi=a;lo=b;d=da}else{hi=b;lo=a;d=-da}
  const lim=REP[hi]*f;if(d<=lim)return;let m=(d-lim)*.5*slRate*(f>1?.7:1);const room=SB[hi]+TMP[hi]-FLOOR[hi];
  if(m>room)m=room;if(m<=0)return;TMP[hi]-=m;TMP[lo]+=m}
function slump(dt){
  for(let k=0;k<NN;k++){const m=SM[k];let t=m<.15?.7:.7+(Math.min(m,1)-.15)*13;
    if(SD[k]>.004){const sp=Math.hypot(VX[k],VZ[k]),tw=Math.max(.55,1.7-sp*1.3);if(tw<t)t=tw}REP[k]=t*C}
  TMP.fill(0);slRate=Math.min(.22,dt*9);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=j*N+i;
    if(i<N-1)slP(k,k+1,1);
    if(j<N-1){slP(k,k+N,1);if(i<N-1)slP(k,k+N+1,1.4142);if(i>0)slP(k,k+N-1,1.4142)}}
  for(let k=0;k<NN;k++)if(TMP[k]!==0)SB[k]+=TMP[k];
}
function simStep(dt){
  dt=Math.min(dt,1/20);
  W.sea=tideAt(W.t);
  const n=clamp(Math.ceil(dt*120),1,6),h=dt/n;frameN++;scanRows();
  for(let s=0;s<n;s++){W.t+=h;pipe(h);forceEdges();for(const k of EDGES)if(SD[k]>0)ROWW[(k/N)|0]=1}
  sedFoam(dt);
  advect(SS,SS2,dt);[SS,SS2]=[SS2,SS];
  advect(SF,SF2,dt);[SF,SF2]=[SF2,SF];
  slDt+=dt;if(frameN&1){slump(slDt);slDt=0}
  for(const k of EDGES){SB[k]=INIT[k];SS[k]=0}
  W.big=W.big.filter(b=>W.t<b.t0+12);
}
// 성 크기 재기 (목표용)
function analyze(){let up=0,dn=0,vol=0,pond=0;const sea=W.sea;
  for(let k=0;k<NN;k++){if(EDGE[k])continue;const df=SB[k]-INIT[k];
    if(df>up)up=df;if(-df>dn)dn=-df;if(df>0)vol+=df;
    if(SD[k]>.06&&SB[k]>sea+.04&&df<-.08)pond++}
  A.maxUp=up;A.maxDown=dn;A.volUp=vol*CA;A.pond=pond;
}
// 위치의 높이 (모래밭 안은 계산값, 밖은 처음 모양)
function sampleArr(arr,x,z){let fi=(x+HALF)/C-.5,fj=(z+HALF)/C-.5;fi=clamp(fi,0,N-1.001);fj=clamp(fj,0,N-1.001);
  const i=fi|0,j=fj|0,u=fi-i,v=fj-j,k=j*N+i;return(arr[k]*(1-u)+arr[k+1]*u)*(1-v)+(arr[k+N]*(1-u)+arr[k+N+1]*u)*v}
function inside(x,z,m){m=m||0;return x>-HALF+m&&x<HALF-m&&z>-HALF+m&&z<HALF-m}
function groundAt(x,z){if(inside(x,z,C*.5))return sampleArr(SB,x,z);const L=layout();let h=L.h(x,z);if(L.rock)h=Math.max(h,L.rock(x,z));return h}
function waterAt(x,z){return inside(x,z,C*.5)?sampleArr(SD,x,z):0}
function cellK(x,z){const i=clamp(Math.floor((x+HALF)/C),0,N-1),j=clamp(Math.floor((z+HALF)/C),0,N-1);return j*N+i}

// ===== 그리기 준비 (WebGL2) =====
const cv=document.getElementById('cv');
const gl=cv.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML='<p style="padding:20px;font-size:16px">이 브라우저는 3D 그림(WebGL2)을 지원하지 않습니다. 크롬이나 엣지에서 열어 주세요.</p>';throw new Error('no webgl2')}
function mkSh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error('셰이더 오류: '+gl.getShaderInfoLog(s));return s}
function mkProg(vs,fs,attrs){const p=gl.createProgram();gl.attachShader(p,mkSh(gl.VERTEX_SHADER,vs));gl.attachShader(p,mkSh(gl.FRAGMENT_SHADER,fs));
  (attrs||['a_p']).forEach((a,i)=>gl.bindAttribLocation(p,i,a));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('셰이더 연결 오류: '+gl.getProgramInfoLog(p));
  const P={p,u:{}};P.loc=n=>(n in P.u)?P.u[n]:(P.u[n]=gl.getUniformLocation(p,n));return P}

precision highp float;precision highp int;precision highp sampler2D;
uniform sampler2D u_sim,u_out;
uniform float u_N,u_half,u_outN,u_outH,u_time,u_sea,u_amp;

`;
const COMMON=`

uniform vec4 u_tl[8];uniform int u_ss;

// ===== 빛 (해 위치) =====
const LT={};
function mixv(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
function nrm(v){const l=Math.hypot(...v);return[v[0]/l,v[1]/l,v[2]/l]}
function lightSetup(){const a=(G.hour-6)/12*Math.PI;
  const sd=nrm([Math.cos(a)*.9,Math.sin(a),-.38]),el=sd[1],day=smooth(-.07,.22,el);
  const sunC=mixv([1,.48,.22],[1,.96,.9],smooth(0,.45,el)).map(v=>v*day*1.25);
  const md=nrm([-sd[0]*.7,Math.max(.35,-sd[1]),-.3]),night=1-day;
  if(el>-.02){LT.ld=sd;LT.lc=sunC}else{LT.ld=md;LT.lc=[.3*night*.6,.36*night*.6,.52*night*.6]}
  const tw=clamp(1-Math.abs(el-.04)/.16,0,1);
  LT.amb=mixv([.05,.065,.12],[.4,.42,.47],day);
  LT.sky=mixv([.015,.025,.07],[.22,.46,.8],day);
  LT.fog=mixv(mixv([.045,.06,.11],[.66,.79,.9],day),[.96,.6,.4],tw*.55);
  LT.sunDir=sd;LT.sunC=sunC.map(v=>v+tw*.3);LT.moonDir=md;LT.night=night;W.dayF=day}
function setCommon(P){gl.useProgram(P.p);const u=P.loc;
  gl.uniform1i(u('u_sim'),0);gl.uniform1i(u('u_out'),1);
  gl.uniform1f(u('u_N'),N);gl.uniform1f(u('u_half'),HALF);gl.uniform1f(u('u_outN'),OUTN);gl.uniform1f(u('u_outH'),OUTH);
  gl.uniform1f(u('u_time'),W.t);gl.uniform1f(u('u_sea'),W.sea);gl.uniform1f(u('u_amp'),WAVE_AMP[G.set.waves]);
  const bg=new Float32Array(16);W.big.slice(0,4).forEach((b,i)=>{bg[i*4]=b.t0;bg[i*4+1]=b.a});gl.uniform4fv(u('u_big'),bg);
  gl.uniform3fv(u('u_ld'),LT.ld);gl.uniform3fv(u('u_lc'),LT.lc);gl.uniform3fv(u('u_amb'),LT.amb);gl.uniform3fv(u('u_fog'),LT.fog);
  gl.uniform3fv(u('u_sky'),LT.sky);gl.uniform1i(u('u_ss'),Q.ss);gl.uniform3fv(u('u_cam'),cam.eye);gl.uniform4fv(u('u_tl'),TL);
  if(cam.vp)gl.uniformMatrix4fv(u('u_vp'),false,cam.vp)}

// ===== 횃불 빛 =====
const TL=new Float32Array(32);
function torchLights(){TL.fill(0);const ts=G.decor.filter(d=>d.k==='torch').map(d=>({d,q:Math.hypot(d.x-cam.tx,d.z-cam.tz)})).sort((a,b)=>a.q-b.q).slice(0,8);
  ts.forEach((o,i)=>{const d=o.d,wet=waterAt(d.x,d.z)>.03;d.out=wet?3:Math.max(0,(d.out||0)-1/60);
    const on=d.out>0?0:1,y=groundAt(d.x,d.z)-.04+.48;TL[i*4]=d.x;TL[i*4+1]=y;TL[i*4+2]=d.z;
    TL[i*4+3]=on*(.15+.85*LT.night)*(1+.12*Math.sin(W.t*13+i*2)+.06*Math.sin(W.t*31+i))*.95})}

// ===== 작은 알갱이 (모래·물방울) =====
const PARTS=[];
function sandFx(x,y,z,n){const c=hex(SANDS[G.sandType].wet);for(let i=0;i<n;i++)PARTS.push({x:x+rnd(-.08,.08),y:y+.02,z:z+rnd(-.08,.08),vx:rnd(-.7,.7),vy:rnd(.6,1.7),vz:rnd(-.7,.7),t:0,m:rnd(.4,.8),c,s:.016})}
let sprAcc=0;
function sprayFx(x,z,r,dt){sprAcc+=dt*90;while(sprAcc>1&&PARTS.length<700){sprAcc--;const px=x+rnd(-r,r),pz=z+rnd(-r,r);
  PARTS.push({x:px,y:groundAt(px,pz)+rnd(.4,.7),z:pz,vx:0,vy:-2.6,vz:0,t:0,m:.5,c:[.78,.9,1],s:.01})}}
let glintT=0;
function partsTick(dt){glintT-=dt;if(glintT<=0&&BI.length){glintT=.35;const b=BI[(Math.random()*BI.length)|0];
    PARTS.push({x:b.x+rnd(-.05,.05),y:groundAt(b.x,b.z)+.06,z:b.z+rnd(-.05,.05),vx:0,vy:.25,vz:0,t:0,m:.9,c:[1.4,1.35,1.2],s:.02,g:0})}
for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.t+=dt;if(p.g!==0)p.vy-=9.8*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
  if(p.t>p.m||p.y<groundAt(p.x,p.z))PARTS.splice(i,1)}}
const PP=mkProg(`#version 300 es
in vec3 a_p;in vec4 a_c;uniform mat4 u_vp;uniform float u_ps;out vec3 v_c;
void main(){gl_Position=u_vp*vec4(a_p,1.);gl_PointSize=a_c.a*u_ps/gl_Position.w;v_c=a_c.rgb;}`,`#version 300 es
precision mediump float;in vec3 v_c;out vec4 o;uniform vec3 u_amb,u_lc;
void main(){vec2 q=gl_PointCoord-.5;if(dot(q,q)>.25)discard;o=vec4(v_c*(u_amb+u_lc*.8),1.);}`,['a_p','a_c']);
const partVao=gl.createVertexArray(),partBuf=gl.createBuffer();
gl.bindVertexArray(partVao);gl.bindBuffer(gl.ARRAY_BUFFER,partBuf);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,28,0);
gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,28,12);gl.bindVertexArray(null);

// ===== 장식이 물에 쓸려 가기 =====
function decorTick(dt){for(let i=G.decor.length-1;i>=0;i--){const d=G.decor[i];if(d.k==='flag'||d.k==='torch')continue;
  if(waterAt(d.x,d.z)>.04){const k=cellK(d.x,d.z),sp=Math.hypot(VX[k],VZ[k]);if(sp>.8){d.x+=VX[k]*.3*dt;d.z+=VZ[k]*.3*dt}}
  if(!inside(d.x,d.z,.25)){G.decor.splice(i,1);toast(josa(itemName(d.k),'이','가')+' 파도에 쓸려 갔습니다.')}}}

// ===== 그리기 =====
function drawMesh(m,mat,sway,glow){const u=PM.loc;gl.uniformMatrix4fv(u('u_m'),false,mat);gl.uniform1f(u('u_sway'),sway||0);gl.uniform1f(u('u_glow'),glow===undefined?1:glow);
  gl.bindVertexArray(m.vao);gl.drawArrays(gl.TRIANGLES,0,m.n)}
function resize(){const dpr=Math.min(window.devicePixelRatio||1,1.5)*Q.scale,w=Math.max(1,Math.round(cv.clientWidth*dpr)),h=Math.max(1,Math.round(cv.clientHeight*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
function cursorUniforms(){const u=PT.loc;let cur=[0,0,0,0],line=[-99,0,0,0];const t=G.tool,o=G.opt;
  if(hit&&inside(hit[0],hit[2],.1)&&!drag&&!gest){
    if(t==='build'||t==='dig'||t==='smooth'||t==='spray'||t==='water')cur=[hit[0],hit[2],o.r,1];
    else if(t==='mold'){const m=MOLDS[o.mold];cur=[hit[0],hit[2],m.r,m.sh===1?2:1]}
    else if(t==='wall'){cur=[hit[0],hit[2],o.wallT/2,stroke?3:1];if(stroke)line=[stroke.a[0],stroke.a[2],hit[0],hit[2]]}
    else if(t==='decor')cur=[hit[0],hit[2],o.del?.12:.06,1]}
  gl.uniform4fv(u('u_cur'),cur);gl.uniform4fv(u('u_line'),line);gl.uniform1f(u('u_curRot'),-cam.yaw)}
function render(){resize();updateCam();lightSetup();torchLights();
  gl.viewport(0,0,cv.width,cv.height);gl.clearColor(LT.fog[0],LT.fog[1],LT.fog[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,simTex);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,outTex);
  // 하늘
  gl.disable(gl.DEPTH_TEST);setCommon(PK);{const u=PK.loc;gl.uniformMatrix4fv(u('u_ivp'),false,cam.ivp);gl.uniform3fv(u('u_sunDir'),LT.sunDir);gl.uniform3fv(u('u_sunC'),LT.sunC);
    gl.uniform3fv(u('u_moonDir'),LT.moonDir);gl.uniform1f(u('u_night'),LT.night)}
  gl.bindVertexArray(skyVao);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
  // 땅
  setCommon(PT);{const u=PT.loc,S=SANDS[G.sandType];gl.uniform3fv(u('u_dry'),hex(S.dry));gl.uniform3fv(u('u_wet'),hex(S.wet));cursorUniforms();
    gl.uniform1i(u('u_mode'),1);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(2,2);gl.bindVertexArray(MESH_OUT.vao);gl.drawElements(gl.TRIANGLES,MESH_OUT.n,gl.UNSIGNED_INT,0);
    gl.disable(gl.POLYGON_OFFSET_FILL);gl.uniform1i(u('u_mode'),0);gl.bindVertexArray(MESH_SIM.vao);gl.drawElements(gl.TRIANGLES,MESH_SIM.n,gl.UNSIGNED_INT,0)}
  // 물건
  setCommon(PM);
  drawMesh(MESH_FAR,M4.id());
  for(const p of PALMS)drawMesh(p.m,M4.tr(p.x,p.y,p.z),p.sw+1);
  G.decor.forEach((d,i)=>{const m=dmesh(d.k),y=groundAt(d.x,d.z)-(FREE[d.k]?.04:.004);
    drawMesh(m,chain(M4.tr(d.x,y,d.z),M4.ry(d.ry),LIE[d.k]?M4.rz(Math.PI/2):M4.id()),d.k==='flag'?-(i+1):0,d.k==='torch'&&d.out>0?0:1)});
  for(const b of BI){const m=dmesh(b.k),wet=waterAt(b.x,b.z),y=groundAt(b.x,b.z)+(wet>.02?Math.min(wet,.08)*.5:0)-.003;
    drawMesh(m,chain(M4.tr(b.x,y+(LIE[b.k]?.05:0),b.z),M4.ry(b.ry),M4.sc(1.7),LIE[b.k]?M4.rz(Math.PI/2):M4.id(),M4.tr(0,LIE[b.k]?-.09:0,0)))}
  // 알갱이
  if(PARTS.length){const a=new Float32Array(PARTS.length*7);PARTS.forEach((p,i)=>{a.set([p.x,p.y,p.z,p.c[0],p.c[1],p.c[2],p.s],i*7)});
    gl.useProgram(PP.p);gl.uniformMatrix4fv(PP.loc('u_vp'),false,cam.vp);gl.uniform1f(PP.loc('u_ps'),cv.height*1.1);gl.uniform3fv(PP.loc('u_amb'),LT.amb);gl.uniform3fv(PP.loc('u_lc'),LT.lc);
    gl.bindVertexArray(partVao);gl.bindBuffer(gl.ARRAY_BUFFER,partBuf);gl.bufferData(gl.ARRAY_BUFFER,a,gl.STREAM_DRAW);gl.drawArrays(gl.POINTS,0,PARTS.length)}
  // 물
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
  setCommon(PO);gl.uniform1i(PO.loc('u_river'),0);gl.bindVertexArray(MESH_OCEAN.vao);gl.drawElements(gl.TRIANGLES,MESH_OCEAN.n,gl.UNSIGNED_INT,0);
  if(layout().river){gl.uniform1i(PO.loc('u_river'),1);gl.bindVertexArray(MESH_RIVER.vao);gl.drawElements(gl.TRIANGLES,MESH_RIVER.n,gl.UNSIGNED_INT,0)}
  setCommon(PW);gl.bindVertexArray(MESH_SIM.vao);gl.drawElements(gl.TRIANGLES,MESH_SIM.n,gl.UNSIGNED_INT,0);
  gl.depthMask(true);gl.disable(gl.BLEND);gl.bindVertexArray(null)}

// ===== 물건 작은 그림 =====
const THN=128,thFb=gl.createFramebuffer(),thCol=gl.createRenderbuffer(),thDep=gl.createRenderbuffer();
gl.bindRenderbuffer(gl.RENDERBUFFER,thCol);gl.renderbufferStorage(gl.RENDERBUFFER,gl.RGBA8,THN,THN);
gl.bindRenderbuffer(gl.RENDERBUFFER,thDep);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,THN,THN);
gl.bindFramebuffer(gl.FRAMEBUFFER,thFb);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,thCol);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,thDep);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);
const THC={};
function thumbData(k){if(THC[k])return THC[k];const m=dmesh(k),r=m.rad*1.1,cy=50+m.cy,eye=[r*.9,cy+r*2.3,-r*1.6];
  gl.bindFramebuffer(gl.FRAMEBUFFER,thFb);gl.viewport(0,0,THN,THN);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);
  const save={...LT},sc=cam.eye,sv=cam.vp;
  LT.ld=nrm([.4,.85,-.5]);LT.lc=[1.05,1,.95];LT.amb=[.5,.52,.56];LT.fog=[.8,.8,.8];LT.sky=[.5,.6,.8];cam.eye=eye;
  cam.vp=M4.mul(M4.persp(.7,1,r*.1,r*20),M4.look(eye,[0,cy,0],[0,1,0]));const tls=TL.slice();TL.fill(0);
  setCommon(PM);drawMesh(m,chain(M4.tr(0,50,0),LIE[k]?M4.rz(Math.PI/2):M4.id(),M4.tr(0,LIE[k]?-.09:0,0)),0,1);
  const px=new Uint8Array(THN*THN*4);gl.readPixels(0,0,THN,THN,gl.RGBA,gl.UNSIGNED_BYTE,px);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);Object.assign(LT,save);cam.eye=sc;cam.vp=sv;TL.set(tls);
  const img=new ImageData(THN,THN);for(let y=0;y<THN;y++)img.data.set(px.subarray((THN-1-y)*THN*4,(THN-y)*THN*4),y*THN*4);
  return THC[k]=img}
function drawThumb(c,k){try{const img=thumbData(k),t=document.createElement('canvas');t.width=t.height=THN;t.getContext('2d').putImageData(img,0,0);
  const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(t,0,0,c.width,c.height)}catch(e){console.error(e)}}

// ===== 돌리기 =====
let last=performance.now(),acc1=0,acc2=0,errN=0;
function frame(dt){keyCam(dt);
  if(mouse[0]>=0&&!drag&&!gest)hit=pickGround(mouse[0],mouse[1]);
  if(stroke&&stroke.t!=='wall')brush(dt);
  simStep(dt);beachTick(dt);decorTick(dt);partsTick(dt);
  if(waveCool>0){waveCool-=dt;if(waveCool<=0)waveCool=0}
  acc2+=dt;if(acc2>.25){acc2=0;ui.top();ui.wave();soundTick()}
  acc1+=dt;if(acc1>1){acc1=0;checkGoals()}
  saveT-=dt;if(saveT<=0){saveT=15;save()}
  uploadSim();render()}
// 자동 화질: 느리면 그림 크기와 그림자 계산을 줄인다
const Q={scale:1,ss:30,ft:16,n:0,lvl:0};
const QL=[[1,30],[.85,22],[.7,16],[.55,12]];
function autoQ(ms){Q.ft=Q.ft*.95+ms*.05;Q.n++;if(Q.n<90)return;
  if(Q.ft>34&&Q.lvl<QL.length-1){Q.lvl++;Q.n=0}else if(Q.ft<15&&Q.lvl>0&&Q.n>600){Q.lvl--;Q.n=0}else return;
  Q.scale=QL[Q.lvl][0];Q.ss=QL[Q.lvl][1]}
let paused=false;
function loop(now){requestAnimationFrame(loop);if(paused)return;try{const dt=Math.min(.1,Math.max(0,(now-last)/1000));autoQ(now-last);last=now;frame(dt)}catch(e){if(errN++<5)console.error(e)}}
cv.addEventListener('pointerleave',()=>{if(!stroke)mouse=[-1,-1]});

// ===== 파도 소리 =====
const SND={ctx:null,g:null,lp:null,on:true};
function soundStart(){if(SND.ctx||!SND.on)return;try{const ac=new (window.AudioContext||window.webkitAudioContext)(),n=ac.sampleRate*4,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
  let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2}
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;
  const g=ac.createGain();g.gain.value=0;src.connect(lp);lp.connect(g);g.connect(ac.destination);src.start();SND.ctx=ac;SND.g=g;SND.lp=lp}catch(e){}}
function soundTick(){if(!SND.ctx)return;const on=SND.on&&!document.hidden;
  const sh=(waveAt(HALF*.45,W.t-.6)+.06)/(WAVE_AMP[G.set.waves]+.1),near=clamp(1.25-cam.dist/30,.25,1);
  const v=on?clamp(.05+.22*Math.max(0,sh),0,.42)*near:0,t=SND.ctx.currentTime;
  SND.g.gain.setTargetAtTime(v,t,.25);SND.lp.frequency.setTargetAtTime(380+900*clamp(sh,0,1.4),t,.3)}
addEventListener('pointerdown',soundStart);
$('bSnd').onclick=()=>{SND.on=!SND.on;$('bSnd').textContent=SND.on?'소리 켬':'소리 끔';if(SND.on)soundStart();try{localStorage.setItem('sandcastle_snd',SND.on?'1':'0')}catch(e){}};
try{if(localStorage.getItem('sandcastle_snd')==='0'){SND.on=false;$('bSnd').textContent='소리 끔'}}catch(e){}

// ===== 시험용 =====
window.dbg={get G(){return G},W,A,cam,SB,SD,SM,BI,
  view(tx,tz,yaw,pitch,dist){Object.assign(cam,{tx,tz,yaw,pitch,dist});cam.ty=groundAt(tx,tz)+.15;updateCam()},
  tick(n,dt){dt=dt||1/60;for(let i=0;i<n;i++){simStep(dt);beachTick(dt);partsTick(dt)}uploadSim();render()},
  draw(){uploadSim();render()},
  stamp(x,z,m){G.opt.mold=m||'round';stamp(x,z)},
  wall(x0,z0,x1,z1,h,t){if(h)G.opt.wallH=h;if(t)G.opt.wallT=t;buildWall([x0,0,z0],[x1,0,z1])},
  brush(tool,x,z,r,secs){G.tool=tool;G.opt.r=r||.25;hit=[x,groundAt(x,z),z];stroke={t:tool,h0:hit[1]};for(let i=0;i<(secs||1)*60;i++)brush(1/60);stroke=null},
  spawn(k,x,z){BI.push({k,x,z,ry:1,t:0})},
  hour(h){G.hour=h;ui.top()},pause(v){paused=v},Q,
  simMs(n){n=n||30;const t=performance.now();for(let i=0;i<n;i++)simStep(1/60);return(performance.now()-t)/n},big(){waveCool=0;bigWave()},
  shot(){return fetch('/shot',{method:'POST',body:cv.toDataURL('image/png')}).then(r=>r.text())}};

// ===== 시작 =====
const firstRun=!localStorage.getItem(SAVE_KEY);
load();resize();ui.tools();ui.opts();ui.top();ui.undo();ui.wave();
if(firstRun)setTimeout(()=>toast('바닷가로 밀려온 유리병을 누르면 새 도구가 들어 있습니다.'),1200);
addEventListener('beforeunload',()=>{if(G)save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G)save()});
requestAnimationFrame(loop);
</script>
<script src="../track.js" defer></script>
</body>
</html>
