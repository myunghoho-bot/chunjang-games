<style>
:root{--f:18px;--fs:12px;--fb:24px;--fh:36px;--px:3px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#05060c;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'Galmuri11','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:var(--f);color:#fff6dc;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hide{display:none!important}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;font-weight:700}
.pbtn{position:relative;background:#27305e;color:#fff6dc;padding:.4em .9em;margin:calc(var(--px)*1.5);line-height:1.25;
 box-shadow:0 calc(var(--px)*-1) 0 #05060c,0 var(--px) 0 #05060c,calc(var(--px)*-1) 0 0 #05060c,var(--px) 0 0 #05060c,inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(0,0,0,.35),inset var(--px) var(--px) 0 rgba(255,255,255,.2)}
.pbtn:hover{filter:brightness(1.2)} .pbtn:active{transform:translateY(var(--px))}
.pbtn.y{background:#f0c020;color:#2b1700} .pbtn.r{background:#cf343c} .pbtn.g{background:#2f9e4a} .pbtn.b{background:#2f6fd0} .pbtn.k{background:#3a3f55}
.pbtn.s{font-size:var(--fs);padding:.35em .6em;margin:var(--px)}
.pbtn.big{font-size:var(--fb);padding:.4em 1.3em}
.pbtn.on{background:#f0c020;color:#2b1700}
.pbtn[disabled]{opacity:.35;pointer-events:none}
/* 경기 화면 글자판 */
#hud{position:absolute;inset:0;pointer-events:none}
#hud button,#hud .card{pointer-events:auto}
#topBtns{position:absolute;right:.4%;top:1%;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
#speedBox{position:absolute;right:1%;top:calc(var(--fs)*3.2);text-align:right;font-size:var(--f);text-shadow:var(--px) var(--px) 0 #000;font-weight:700}
#speedBox .kmh{color:#ffe15a;font-size:var(--fb)}
.card{position:absolute;bottom:1.5%;background:rgba(8,10,26,.82);padding:.35em .6em;font-size:var(--fs);line-height:1.45;
 box-shadow:0 calc(var(--px)*-1) 0 #f2e2b0,0 var(--px) 0 #f2e2b0,calc(var(--px)*-1) 0 0 #f2e2b0,var(--px) 0 0 #f2e2b0;max-width:31%}
.card b{font-size:var(--f)}
.card .tag{display:inline-block;padding:0 .3em;margin-right:.3em;color:#fff;font-weight:700}
#batCard{left:1%} #pitCard{right:1%;text-align:left}
.bar{display:inline-block;height:.55em;background:#222;width:5em;vertical-align:middle;margin-left:.3em}
.bar i{display:block;height:100%;background:#58d36a}
#ctrl{position:absolute;left:50%;transform:translateX(-50%);bottom:1%;display:flex;flex-wrap:nowrap;justify-content:center;pointer-events:none}
#ctrl button{pointer-events:auto}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--fs)*3.6);font-size:var(--fs);background:rgba(0,0,0,.55);padding:.2em .6em;white-space:nowrap;text-shadow:var(--px) var(--px) 0 #000}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:var(--fh);font-weight:700;pointer-events:none;
 text-shadow:var(--px) 0 0 #000,calc(var(--px)*-1) 0 0 #000,0 var(--px) 0 #000,0 calc(var(--px)*-1) 0 #000,var(--px) var(--px) 0 #000,calc(var(--px)*-1) var(--px) 0 #000,var(--px) calc(var(--px)*-1) 0 #000,calc(var(--px)*-1) calc(var(--px)*-1) 0 #000,0 calc(var(--px)*2) 0 #000}
#msg.pop{animation:pop .35s steps(4)}
#msg .small{display:block;font-size:var(--f);margin-top:.3em}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;background:rgba(5,8,24,.85);padding:.5em 0;font-size:var(--fb);font-weight:700;
 box-shadow:0 var(--px) 0 #f0c020,0 calc(var(--px)*-1) 0 #f0c020;animation:slide .4s steps(5)}
#banner small{display:block;font-size:var(--f);color:#ffe9a8;margin-top:.2em;font-weight:400}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}
/* 메뉴 화면 */
#scr{position:absolute;inset:0;background:rgba(4,6,18,.78);overflow-y:auto;overflow-x:hidden;padding:2% 3%;touch-action:pan-y}
#scr::-webkit-scrollbar{width:calc(var(--px)*3)} #scr::-webkit-scrollbar-thumb{background:#f0c020}
.col{display:flex;flex-direction:column;align-items:center}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center}
h1{font-size:var(--fh);color:#ffe15a;text-shadow:var(--px) var(--px) 0 #a8321c,calc(var(--px)*2) calc(var(--px)*2) 0 #000;margin:.2em 0 .3em;text-align:center}
h2{font-size:var(--fb);color:#ffe15a;margin:.4em 0;text-align:center;text-shadow:var(--px) var(--px) 0 #000}
.title{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{font-size:calc(var(--fh)*1.6);font-weight:700;color:#fff;letter-spacing:.05em;
 text-shadow:var(--px) 0 0 #0b1a5c,calc(var(--px)*-1) 0 0 #0b1a5c,0 var(--px) 0 #0b1a5c,0 calc(var(--px)*-1) 0 #0b1a5c,calc(var(--px)*2) calc(var(--px)*2) 0 #0b1a5c,calc(var(--px)*3) calc(var(--px)*3) 0 #e83a3a,calc(var(--px)*4) calc(var(--px)*4) 0 #000}
.logo span{color:#ffe15a}
.sub{color:#bfe3ff;margin:.3em 0 .8em;text-shadow:var(--px) var(--px) 0 #000}
.myteam{margin-bottom:.6em;display:flex;align-items:center;gap:.4em;background:rgba(0,0,0,.5);padding:.3em .8em;text-shadow:var(--px) var(--px) 0 #000}
.coin{display:inline-block;width:.9em;height:.9em;background:#ffd23a;box-shadow:inset calc(var(--px)*-1) calc(var(--px)*-1) 0 #c48a10,0 0 0 var(--px) #6b4500;margin:0 .15em;vertical-align:-.1em}
.tb{display:inline-block;min-width:2.6em;text-align:center;padding:.1em .3em;font-weight:700;border:var(--px) solid;text-shadow:none;font-size:var(--fs);line-height:1.3}
.tb.big{font-size:var(--f);min-width:3.2em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--f)*9),1fr));gap:calc(var(--px)*3);width:100%}
.tcard{background:#1a2148;padding:.5em;text-align:center;cursor:pointer;box-shadow:0 0 0 var(--px) #05060c,inset var(--px) var(--px) 0 rgba(255,255,255,.15)}
.tcard:hover{filter:brightness(1.25)} .tcard small{display:block;font-size:var(--fs);color:#b9c3ee;margin-top:.3em}
.tcard.sel{outline:var(--px) solid #ffe15a}
table.t{border-collapse:collapse;margin:.3em auto;font-size:var(--fs);background:rgba(0,0,0,.45)}
table.t td,table.t th{padding:.25em .5em;text-align:center;border-bottom:1px solid rgba(255,255,255,.12)}
table.t th{color:#ffe15a}
table.t tr.me td{background:rgba(240,192,32,.25);color:#fff}
.box{background:rgba(16,22,58,.92);padding:.6em .9em;margin:.3em 0;box-shadow:0 0 0 var(--px) #05060c,inset var(--px) var(--px) 0 rgba(255,255,255,.12)}
.small{font-size:var(--fs);color:#c9d2f5}
.win{color:#7dff8e} .lose{color:#ff8a8a}
.stat{display:inline-flex;align-items:center;margin:.15em .4em;font-size:var(--fs)}
.stat .bar{width:4.5em}
.prow{display:flex;align-items:center;flex-wrap:wrap;gap:.2em .5em;padding:.35em .2em;border-bottom:1px solid rgba(255,255,255,.1)}
.prow .nm{min-width:6.5em;font-weight:700}
#pop{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:5}
.popbox{background:#151b40;padding:.8em 1.1em;max-width:90%;max-height:90%;overflow:auto;text-align:center;
 box-shadow:0 0 0 var(--px) #f2e2b0,0 0 0 calc(var(--px)*2) #05060c}
.trophy canvas{width:calc(var(--f)*5);height:calc(var(--f)*5);image-rendering:pixelated}
.trophy{display:inline-flex;flex-direction:column;align-items:center;margin:.4em;font-size:var(--fs);width:calc(var(--f)*7);text-align:center}
.line td{min-width:1.6em}
</style>
</head>
<body>
<div id="stage">
 <canvas id="cv" width="384" height="216"></canvas>
 <div id="hud" class="hide">
  <div id="topBtns">
   <button class="pbtn s" data-a="auto" id="bAuto">자동: 끔</button>
   <button class="pbtn s" data-a="pchange" id="bPit">투수 교체</button>
   <button class="pbtn s" data-a="sound" id="bSnd">소리: 켬</button>
   <button class="pbtn s" data-a="pause">메뉴</button>
  </div>
  <div id="speedBox"></div>
  <div id="batCard" class="card"></div>
  <div id="pitCard" class="card"></div>
  <div id="hint" class="hide"></div>
  <div id="ctrl"></div>
 </div>
 <div id="msg"></div>
 <div id="banner" class="hide"></div>
 <div id="scr" class="hide"></div>
 <div id="pop" class="hide"></div>
</div>
<script>

function pickW(arr,w){let s=0;for(const x of w)s+=x;let r=Math.random()*s;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}return arr[arr.length-1];}

function R(x,y,w,h,c){C.fillStyle=c;C.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function P(x,y,c){C.fillStyle=c;C.fillRect(Math.round(x),Math.round(y),1,1);}
function line(x0,y0,x1,y1,c,t){t=t||1;x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);C.fillStyle=c;
 const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;let err=dx+dy;const o=Math.floor(t/2);
 for(let i=0;i<3000;i++){C.fillRect(x0-o,y0-o,t,t);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}}}
function ell(cx,cy,rx,ry,c){C.fillStyle=c;ry=Math.max(ry,0.5);for(let y=-Math.ceil(ry);y<=Math.ceil(ry);y++){const q=1-(y*y)/(ry*ry);if(q<0)continue;const w=Math.round(rx*Math.sqrt(q));C.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1);}}
function ring(cx,cy,rx,ry,c){C.fillStyle=c;const n=Math.max(24,Math.round((rx+ry)*4));for(let a=0;a<n;a++){const t=a/n*Math.PI*2;C.fillRect(Math.round(cx+Math.cos(t)*rx),Math.round(cy+Math.sin(t)*ry),1,1);}}
function poly(pts,c){let a=Infinity,b=-Infinity;for(const p of pts){a=Math.min(a,p[1]);b=Math.max(b,p[1]);}C.fillStyle=c;
 for(let y=Math.floor(a);y<=Math.ceil(b);y++){const yc=y+0.5,xs=[];for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];
  if((p[1]<=yc&&q[1]>yc)||(q[1]<=yc&&p[1]>yc))xs.push(p[0]+(yc-p[1])*(q[0]-p[0])/(q[1]-p[1]));}
  xs.sort((m,n)=>m-n);for(let k=0;k+1<xs.length;k+=2){const x0=Math.round(xs[k]),x1=Math.round(xs[k+1]);if(x1>x0)C.fillRect(x0,y,x1-x0,1);}}}
function rgbOf(h){if(h[0]==='r'){return h.match(/\d+/g).slice(0,3).map(Number);}h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=rgbOf(a),B=rgbOf(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
function shade(a,t){return t<0?mix(a,'#000000',-t):mix(a,'#ffffff',t);}

  if(!rolling){vh-=k*vh*dt;vz-=gr*dt;r+=vh*dt;h+=vz*dt;
   if(h<=0){h=0;if(hr){rolling=true;vh=0;}else{if(landT<0)landT=t+dt;if(Math.abs(vz)>3){vz=-vz*0.38;vh*=0.7;}else{vz=0;rolling=true;vh*=0.9;}}}}

function newSeason(){S.seasonNo++;const ids=TEAMS.map(t=>t.id);let arr=shuffle(ids.slice());const rounds=[];const n=arr.length;
 for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if((r+i)%2)[a,b]=[b,a];pairs.push([a,b]);}rounds.push(pairs);arr.splice(1,0,arr.pop());}
 let all=shuffle(rounds.slice());if(S.set.len===18)all=all.concat(shuffle(rounds.map(rd=>rd.map(p=>[p[1],p[0]]))));
 const table={};ids.forEach(id=>table[id]={w:0,l:0,d:0,rs:0,ra:0});
 S.season={no:S.seasonNo,team:S.team,rounds:all,ri:0,table,log:[],phase:'reg',post:null};save();}
function standings(){const t=S.season.table;return Object.keys(t).sort((a,b)=>{const A=t[a],B=t[b];const pa=A.w+A.l?A.w/(A.w+A.l):0.5,pb=B.w+B.l?B.w/(B.w+B.l):0.5;if(pb!==pa)return pb-pa;return(B.rs-B.ra)-(A.rs-A.ra);});}
function myPair(){const rd=S.season.rounds[S.season.ri];return rd&&rd.find(p=>p[0]===S.team||p[1]===S.team);}

function teamRating(tid){const r=roster(tid);const off=r.bat.reduce((s,b)=>s+b.pow*0.45+b.con*0.45+b.spd*0.1,0)/9;
 const pit=r.pit.slice(0,5).reduce((s,p)=>s+(p.vel-128)*1.5+p.ctrl*0.35+p.brk*0.35,0)/5;return{off,pit};}
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function simGame(home,away,noTie){const H=teamRating(home),A=teamRating(away);const inn=S.set.inn;
 const la=0.52*Math.pow(A.off/70,2.4)/Math.pow(H.pit/86,1.6),lh=0.52*Math.pow(H.off/70,2.4)/Math.pow(A.pit/86,1.6)*1.04;
 let a=0,h=0;for(let i=0;i<inn;i++){a+=poisson(la);h+=poisson(lh);}let ex=0;while(a===h&&(ex<3||noTie)){a+=poisson(la);h+=poisson(lh);ex++;if(ex>30){h++;}}return[a,h];}
function recordGame(home,away,sc){const t=S.season.table;const a=sc[0],h=sc[1];t[home].rs+=h;t[home].ra+=a;t[away].rs+=a;t[away].ra+=h;
 if(h>a){t[home].w++;t[away].l++;}else if(a>h){t[away].w++;t[home].l++;}else{t[home].d++;t[away].d++;}}

 rd.forEach(p=>{if(p[0]===S.team||p[1]===S.team)return;const sc=simGame(p[0],p[1]);recordGame(p[0],p[1],sc);});
 se.ri++;if(se.ri>=se.rounds.length){se.phase='post';setupPost();}save();}

 if(po.champ){const me=po.champ===S.team;body+='<div class="box" style="text-align:center">'+(me?'<h1>우승!!!</h1><div class="trophy"><canvas width="32" height="32" data-trophy="'+S.team+'"></canvas></div><br>트로피를 받았어! '+coinTxt(2000)+' 보너스!'
   :'<b>'+TEAM[po.champ].name+'</b> 우승! 다음 시즌엔 우리가 우승하자!')+'<br><button class="pbtn y big" data-a="newseason">새 시즌 시작</button></div>';}
 else if(mine){const h=mine.h,a=mine.a;body+='<div class="row"><button class="pbtn y big" data-a="playpost">'+(mine===po.fin?'한국시리즈':'플레이오프')+' 경기 시작!</button></div><p class="small" style="text-align:center">'+TEAM[h].park.n+'에서 · 비기면 연장 끝까지!</p>';}
 else body+='<p class="small" style="text-align:center">'+(po.seeds.includes(S.team)?'아쉽게 떨어졌어...':'이번 시즌은 4위 안에 못 들었어.')+'</p><div class="row"><button class="pbtn y" data-a="postsim">다음 결과 보기</button></div>';
 body+='<div class="row"><button class="pbtn" data-a="title">처음 화면</button></div>';scr(body);drawTrophies();}
// ---- 경기 끝 화면 ----
function showGameOver(){const g=G;$('msg').innerHTML='';$('hud').classList.add('hide');const n=Math.max(g.line[0].length,g.line[1].length,g.maxInn);let h='<tr><th></th>';for(let i=0;i<n;i++)h+='<th>'+(i+1)+'</th>';h+='<th>R</th><th>H</th></tr>';
 [0,1].forEach(s=>{const tid=teamOf(g,s);h+='<tr'+(s===g.my?' class="me"':'')+'><td>'+badge(tid)+'</td>';for(let i=0;i<n;i++){const v=g.line[s][i];h+='<td>'+(v==null?'':v)+'</td>';}h+='<td><b>'+g.score[s]+'</b></td><td>'+g.hits[s]+'</td></tr>';});
 const my=g.bs[g.my];let mvp=null,ms=-1;Object.keys(my).forEach(nm=>{const a=my[nm];const sc=a.h*2+a.hr*4+a.rbi*1.5;if(sc>ms){ms=sc;mvp=nm;}});
 const a=my[mvp];const R0=g.result;
 scr('<div class="col"><h1>'+(R0==='W'?'승리!':R0==='L'?'아쉽게 졌어':'무승부')+'</h1><table class="t line">'+h+'</table>'+
  (ms>0?'<div class="box">오늘의 선수: <b>'+mvp+'</b> — '+a.ab+'타수 '+a.h+'안타'+(a.hr?' '+a.hr+'홈런':'')+(a.rbi?' '+a.rbi+'타점':'')+'</div>':'')+
  '<div class="box">받은 돈 '+coinTxt(g.coin)+(g.myHR?' <span class="small">(홈런 보너스 포함)</span>':'')+' · 지금 '+coinTxt(S.coins)+'</div>'+
  '<div class="row"><button class="pbtn y big" data-a="aftergame">다음</button><button class="pbtn g" data-a="train">선수 키우기</button></div></div>');}
// ---- 선수 키우기 ----
let trainTab='bat';
function upCost(name,k){const c=(S.upCnt[S.team+'|'+name+'|'+k]||0);return 60+c*30;}
function showTrain(){const r=roster(S.team);const st=S.stats[S.team]||{};
 const statBtn=(name,k,label,v,max)=>{const c=upCost(name,k);const can=S.coins>=c&&v<max;return '<span class="stat">'+label+' <b style="margin-left:.3em">'+v+'</b>'+bar(k==='vel'?v-120:v,k==='vel'?max-120:max,'#58d36a')+
  '<button class="pbtn s '+(can?'g':'k')+'" data-a="up" data-v="'+name+'|'+k+'"'+(can?'':' disabled')+'>+1 ('+c+')</button></span>';};
 let rows='';
 if(trainTab==='bat')rows=r.bat.map(b=>{const s=st[b.name];const avg=s&&s.ab?(s.h/s.ab).toFixed(3).replace(/^0/,''):'-';
  return '<div class="prow"><span class="nm">'+b.name+'<br><span class="small">'+POSN[b.pos]+' · '+(b.hand==='L'?'좌타':'우타')+'</span></span>'+statBtn(b.name,'pow','파워',b.pow,99)+statBtn(b.name,'con','컨택',b.con,99)+statBtn(b.name,'spd','주력',b.spd,99)+
   '<span class="small">타율 '+avg+' · 홈런 '+(s?s.hr:0)+' · 타점 '+(s?s.rbi:0)+'</span></div>';}).join('');
 else rows=r.pit.map(p=>'<div class="prow"><span class="nm">'+p.name+'<br><span class="small">'+(p.closer?'마무리':'선발')+' · '+(p.hand==='L'?'좌투':'우투')+' · '+p.types.split('').map(t=>PT[t].n).join('/')+'</span></span>'+
  statBtn(p.name,'vel','구속',p.vel,165)+statBtn(p.name,'ctrl','제구',p.ctrl,99)+statBtn(p.name,'brk','변화',p.brk,99)+statBtn(p.name,'sta','체력',p.sta,99)+'</div>').join('');
 scr('<h2>선수 키우기 · '+TEAM[S.team].name+'</h2><div class="row"><span class="myteam">'+coinTxt(S.coins)+'</span></div>'+
  '<div class="row"><button class="pbtn '+(trainTab==='bat'?'y':'k')+'" data-a="ttab" data-v="bat">타자</button><button class="pbtn '+(trainTab==='pit'?'y':'k')+'" data-a="ttab" data-v="pit">투수</button></div>'+
  '<div class="box">'+rows+'</div><p class="small" style="text-align:center">경기에서 이기면 돈을 더 많이 받아! 홈런 1개마다 50 보너스.</p><div class="row"><button class="pbtn" data-a="title">처음 화면</button></div>');}
// ---- 트로피 방 ----
function drawTrophyCanvas(cvs,tid){const T=TEAM[tid];const x=cvs.getContext('2d');const prev=C;C=x;C.clearRect(0,0,32,32);
 R(10,27,12,3,'#5a3a1a');R(8,29,16,2,'#3e2810');R(12,24,8,3,T.c1);R(14,19,4,5,'#e0a420');
 R(7,4,18,3,'#ffd84a');poly([[7,6],[25,6],[22,15],[18,19],[14,19],[10,15]],'#f2c02c');R(9,7,3,7,'#fff2a0');
 R(3,6,4,2,'#f2c02c');R(3,6,2,6,'#f2c02c');R(3,11,5,2,'#f2c02c');R(25,6,4,2,'#f2c02c');R(27,6,2,6,'#f2c02c');R(24,11,5,2,'#f2c02c');
 R(13,9,6,4,T.c1);P(15,10,'#ffffff');P(16,11,'#ffffff');C=prev;}
function drawTrophies(){document.querySelectorAll('canvas[data-trophy]').forEach(c=>drawTrophyCanvas(c,c.dataset.trophy));}
function showTrophies(){const rc=S.rec;const t=S.trophies.map(tr=>'<div class="trophy"><canvas width="32" height="32" data-trophy="'+tr.team+'"></canvas>시즌 '+tr.no+'<br>'+TEAM[tr.team].name+'</div>').join('');
 scr('<h2>트로피 방</h2><div class="box" style="text-align:center">'+(t||'<p>아직 트로피가 없어. 시즌에서 한국시리즈 우승을 하면 여기 놓여!</p>')+'</div>'+
  '<div class="box" style="text-align:center">지금까지 '+rc.games+'경기 · '+rc.w+'승 '+rc.l+'패 '+rc.d+'무 · 우리 팀 홈런 '+rc.hr+'개</div><div class="row"><button class="pbtn" data-a="title">처음 화면</button></div>');drawTrophies();}
// ---- 설정 ----
function showSettings(){const s=S.set;const opt=(k,v,l)=>'<button class="pbtn s '+(s[k]===v?'y':'k')+'" data-a="set" data-v="'+k+'|'+v+'">'+l+'</button>';
 scr('<h2>설정</h2><div class="box"><p>한 경기 길이</p><div class="row">'+opt('inn',3,'3회')+opt('inn',5,'5회')+opt('inn',9,'9회 (진짜처럼)')+'</div>'+
  '<p>난이도 (공 빠르기)</p><div class="row">'+opt('diff',0,'쉬움')+opt('diff',1,'보통')+opt('diff',2,'어려움')+'</div>'+
  '<p>시즌 길이 (새 시즌부터)</p><div class="row">'+opt('len',9,'9경기')+opt('len',18,'18경기')+'</div>'+
  '<p>소리 · 스트라이크존</p><div class="row">'+opt('sound',true,'소리 켬')+opt('sound',false,'소리 끔')+opt('zone',true,'존 보이기')+opt('zone',false,'존 숨기기')+'</div></div>'+
  '<div class="row"><button class="pbtn" data-a="title">돌아가기</button><button class="pbtn s r" data-a="wipe">모든 기록 지우기</button></div>');}
// ---- 한 경기 상대 고르기 ----
function showFriendly(){scr('<h2>한 경기 · 상대 팀 고르기</h2><p class="small" style="text-align:center">우리 홈구장 '+TEAM[S.team].park.n+'에서 해.</p><div class="grid">'+
 TEAMS.filter(T=>T.id!==S.team).map(T=>'<div class="tcard" data-a="friendgo" data-v="'+T.id+'">'+badge(T.id,true)+'<br><b>'+T.name+'</b></div>').join('')+'</div><div class="row"><button class="pbtn" data-a="title">돌아가기</button></div>');}

// ---- 버튼 동작 ----
const ACT={
 title(){toTitle();},season(){showSeason();},friendly(){showFriendly();},train(){if(G&&G.st==='over')G=null;showTrain();},trophy(){showTrophies();},settings(){showSettings();},
 team(){showTeamPick(false);},
 pickteam(v){const first=!S.team;if(S.team!==v){S.team=v;S.season=null;}save();bgCache['b'+v]=null;toTitle();},
 playseason(){const pr=myPair();if(!pr)return showSeason();newGame(pr[0],pr[1],'season');},
 simseason(){simMySeasonGame();},
 playpost(){const m=postMyMatch();if(m)newGame(m.h,m.a,'post');},
 postsim(){postSimRest();save();showPost();},
 newseason(){newSeason();showSeason();},
 friendgo(v){newGame(S.team,v,'friendly');},
 aftergame(){const mode=G&&G.mode;G=null;scene='title';$('hud').classList.add('hide');if(mode==='season')showSeason();else if(mode==='post')showPost();else toTitle();},
 ttab(v){trainTab=v;showTrain();},
 up(v){const [name,k]=v.split('|');const c=upCost(name,k);if(S.coins<c)return;S.coins-=c;const u=S.up[S.team]||(S.up[S.team]={});const p=u[name]||(u[name]={});p[k]=(p[k]||0)+1;
  const key=S.team+'|'+name+'|'+k;S.upCnt[key]=(S.upCnt[key]||0)+1;save();SFX.coin();const y=$('scr').scrollTop;showTrain();$('scr').scrollTop=y;},
 set(v){const [k,val]=v.split('|');S.set[k]=val==='true'?true:val==='false'?false:Number(val);save();showSettings();},
 wipe(){pop('<p>돈, 선수 키운 것, 트로피, 시즌이 전부 지워져.<br>정말 지울까?</p><div class="row"><button class="pbtn r" data-a="wipeyes">응, 지워</button><button class="pbtn" data-a="unpop">아니</button></div>');},
 wipeyes(){S=defSave();save();unpop();for(const k in bgCache)delete bgCache[k];toTitle();},
 unpop(){unpop();},
 auto(){if(!G)return;G.auto=!G.auto;if(G.auto&&G.st==='pre'&&G.aim)G.aim.state='free';hud();},
 sound(){S.set.sound=!S.set.sound;save();hud();},
 pause(){if(!G)return;G.paused=true;pop('<h2>잠깐 멈춤</h2><div class="col"><button class="pbtn y" data-a="resume">계속하기</button><button class="pbtn r s" data-a="quit">경기 그만하기 (기록 안 남아)</button></div>');},
 resume(){if(G)G.paused=false;unpop();},
 quit(){unpop();const mode=G&&G.mode;G=null;scene='title';$('hud').classList.add('hide');unbanner();$('msg').innerHTML='';if(mode==='season')showSeason();else if(mode==='post')showPost();else toTitle();},
 ptype(v){if(!G)return;G.sel=Number(v);hud();},
 pchange(){const g=G;if(!g||g.half===g.my)return;const side=g.my;const R=g.R[side];g.paused=true;
  pop('<h2>투수 교체</h2><p class="small">한 번 내려간 투수는 다시 못 나와.</p>'+R.pit.map((p,i)=>{const used=g.used[side].includes(i);return '<div class="prow" style="justify-content:space-between"><span class="nm">'+p.name+(p.closer?' (마무리)':'')+'</span><span class="small">구속 '+p.vel+' 제구 '+p.ctrl+' 변화 '+p.brk+' 체력 '+p.sta+'</span>'+
   (i===g.pi[side]?'<span class="small">지금 던지는 중</span>':'<button class="pbtn s '+(used?'k':'g')+'" data-a="pdo" data-v="'+i+'"'+(used?' disabled':'')+'>내보내기</button>')+'</div>';}).join('')+'<button class="pbtn" data-a="resume">닫기</button>');},
 pdo(v){const g=G;unpop();g.paused=false;if(g.st==='flight'||g.st==='windup')return;changePitcher(g,g.my,Number(v));},
};
stage.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.disabled)return;if(el.blur)el.blur();ac();SFX.click();const f=ACT[el.dataset.a];if(f)f(el.dataset.v);});

// ---- 마우스 / 터치 / 키보드 ----
const keys={};
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function setCursor(x,y){cursor.x=clamp(x,ZX0-16,ZX1+16);cursor.y=clamp(y,ZY0-14,ZY1+14);}
function setAim(x,y){G.aim.x=clamp(x,ZX0-34,ZX1+34);G.aim.y=clamp(y,ZY0-30,ZY1+30);}
function onMove(p){const g=G;if(!g||scene!=='game'||g.paused)return;if(humanBatting(g))setCursor(p.x,p.y);else if(humanPitching(g)&&g.st==='pre'&&g.aim.state==='free')setAim(p.x,p.y);}
function onDown(p){const g=G;if(!g||scene!=='game'||g.paused)return;
 if(g.st==='field'){g.fast=true;return;}
 if(g.st==='change'||g.st==='intro'){if(g.stT>0.5)g.stT=9;return;}
 if(humanBatting(g)){if(p)setCursor(p.x,p.y);if(g.st==='flight')humanSwing();return;}
 if(humanPitching(g)&&g.st==='pre'){if(g.aim.state==='free'){if(p)setAim(p.x,p.y);g.aim.state='ring';g.aim.t=0;g.aim.r=22;hud();}else if(g.aim.state==='ring')humanThrow();}}
stage.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;onMove(toCanvas(e));});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,[data-a],#scr,#pop,.card'))return;ac();onDown(toCanvas(e));});
addEventListener('keydown',e=>{keys[e.code]=true;if(!G||scene!=='game'||G.paused)return;
 if(e.code==='Space'||e.code==='Enter'){e.preventDefault();onDown(null);}
 const m=/^Digit([1-6])$/.exec(e.code);if(m&&humanPitching(G)){const P=curPitcher(G);const i=Number(m[1])-1;if(i<P.types.length){G.sel=i;hud();}}
 if(e.code==='KeyA')ACT.auto();if(e.code.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});

// =====================================================================
//  메인 루프
// =====================================================================
let last=performance.now(),errCount=0;
function draw(now){const t=now/1000;
 if(scene==='game'&&G){if(G.view==='field'&&G.play)drawField(t);else drawBat(t);}else drawTitleBG(t);}
function loop(now){requestAnimationFrame(loop);
 try{const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(scene==='game'&&G&&!G.paused)updateGame(dt);
  draw(now);drawFx(dt);
 }catch(e){errCount++;if(errCount<5)console.error(e);}}
load();resize();toTitle();requestAnimationFrame(loop);
</script>
<script src="../track.js" defer></script>
