<style>
:root{--f:18px;--fs:12px;--fb:24px;--fh:36px;--px:3px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#05060c;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'Galmuri11','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:var(--f);color:#fff6dc;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hide{display:none!important}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;font-weight:700}
.pbtn{position:relative;background:#27305e;color:#fff6dc;padding:.4em .9em;margin:calc(var(--px)*1.5);line-height:1.25;
 box-shadow:0 calc(var(--px)*-1) 0 #05060c,0 var(--px) 0 #05060c,calc(var(--px)*-1) 0 0 #05060c,var(--px) 0 0 #05060c,inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(0,0,0,.35),inset var(--px) var(--px) 0 rgba(255,255,255,.2)}
.pbtn:hover{filter:brightness(1.2)} .pbtn:active{transform:translateY(var(--px))}
.pbtn.y{background:#f0c020;color:#2b1700} .pbtn.r{background:#cf343c} .pbtn.g{background:#2f9e4a} .pbtn.b{background:#2f6fd0} .pbtn.k{background:#3a3f55}
.pbtn.s{font-size:var(--fs);padding:.35em .6em;margin:var(--px)}
.pbtn.big{font-size:var(--fb);padding:.4em 1.3em}
.pbtn.on{background:#f0c020;color:#2b1700}
.pbtn[disabled]{opacity:.35;pointer-events:none}
/* 경기 화면 글자판 */
#hud{position:absolute;inset:0;pointer-events:none}
#hud button,#hud .card{pointer-events:auto}
#topBtns{position:absolute;right:.4%;top:1%;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
#speedBox{position:absolute;right:1%;top:calc(var(--fs)*3.2);text-align:right;font-size:var(--f);text-shadow:var(--px) var(--px) 0 #000;font-weight:700}
#speedBox .kmh{color:#ffe15a;font-size:var(--fb)}
.card{position:absolute;bottom:1.5%;background:rgba(8,10,26,.82);padding:.35em .6em;font-size:var(--fs);line-height:1.45;
 box-shadow:0 calc(var(--px)*-1) 0 #f2e2b0,0 var(--px) 0 #f2e2b0,calc(var(--px)*-1) 0 0 #f2e2b0,var(--px) 0 0 #f2e2b0;max-width:31%}
.card b{font-size:var(--f)}
.card .tag{display:inline-block;padding:0 .3em;margin-right:.3em;color:#fff;font-weight:700}
#batCard{left:1%} #pitCard{right:1%;text-align:left}
.bar{display:inline-block;height:.55em;background:#222;width:5em;vertical-align:middle;margin-left:.3em}
.bar i{display:block;height:100%;background:#58d36a}
#ctrl{position:absolute;left:50%;transform:translateX(-50%);bottom:1%;display:flex;flex-wrap:nowrap;justify-content:center;pointer-events:none}
#ctrl button{pointer-events:auto}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--fs)*3.6);font-size:var(--fs);text-align:center;line-height:1.35;background:rgba(0,0,0,.55);padding:.2em .6em;white-space:nowrap;text-shadow:var(--px) var(--px) 0 #000}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:var(--fh);font-weight:700;pointer-events:none;
 text-shadow:var(--px) 0 0 #000,calc(var(--px)*-1) 0 0 #000,0 var(--px) 0 #000,0 calc(var(--px)*-1) 0 #000,var(--px) var(--px) 0 #000,calc(var(--px)*-1) var(--px) 0 #000,var(--px) calc(var(--px)*-1) 0 #000,calc(var(--px)*-1) calc(var(--px)*-1) 0 #000,0 calc(var(--px)*2) 0 #000}
#msg.pop{animation:pop .35s steps(4)}
#msg .small{display:block;font-size:var(--f);margin-top:.3em}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;background:rgba(5,8,24,.85);padding:.5em 0;font-size:var(--fb);font-weight:700;
 box-shadow:0 var(--px) 0 #f0c020,0 calc(var(--px)*-1) 0 #f0c020;animation:slide .4s steps(5)}
#banner small{display:block;font-size:var(--f);color:#ffe9a8;margin-top:.2em;font-weight:400}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}
/* 메뉴 화면 */
#scr{position:absolute;inset:0;background:rgba(4,6,18,.78);overflow-y:auto;overflow-x:hidden;padding:2% 3%;touch-action:pan-y}
#scr::-webkit-scrollbar{width:calc(var(--px)*3)} #scr::-webkit-scrollbar-thumb{background:#f0c020}
.col{display:flex;flex-direction:column;align-items:center}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center}
h1{font-size:var(--fh);color:#ffe15a;text-shadow:var(--px) var(--px) 0 #a8321c,calc(var(--px)*2) calc(var(--px)*2) 0 #000;margin:.2em 0 .3em;text-align:center}
h2{font-size:var(--fb);color:#ffe15a;margin:.4em 0;text-align:center;text-shadow:var(--px) var(--px) 0 #000}
.title{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{font-size:calc(var(--fh)*1.6);font-weight:700;color:#fff;letter-spacing:.05em;
 text-shadow:var(--px) 0 0 #0b1a5c,calc(var(--px)*-1) 0 0 #0b1a5c,0 var(--px) 0 #0b1a5c,0 calc(var(--px)*-1) 0 #0b1a5c,calc(var(--px)*2) calc(var(--px)*2) 0 #0b1a5c,calc(var(--px)*3) calc(var(--px)*3) 0 #e83a3a,calc(var(--px)*4) calc(var(--px)*4) 0 #000}
.logo span{color:#ffe15a}
.sub{color:#bfe3ff;margin:.3em 0 .8em;text-shadow:var(--px) var(--px) 0 #000}
.myteam{margin-bottom:.6em;display:flex;align-items:center;gap:.4em;background:rgba(0,0,0,.5);padding:.3em .8em;text-shadow:var(--px) var(--px) 0 #000}
.coin{display:inline-block;width:.9em;height:.9em;background:#ffd23a;box-shadow:inset calc(var(--px)*-1) calc(var(--px)*-1) 0 #c48a10,0 0 0 var(--px) #6b4500;margin:0 .15em;vertical-align:-.1em}
.tb{display:inline-block;min-width:2.6em;text-align:center;padding:.1em .3em;font-weight:700;border:var(--px) solid;text-shadow:none;font-size:var(--fs);line-height:1.3}
.tb.big{font-size:var(--f);min-width:3.2em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--f)*9),1fr));gap:calc(var(--px)*3);width:100%}
.tcard{background:#1a2148;padding:.5em;text-align:center;cursor:pointer;box-shadow:0 0 0 var(--px) #05060c,inset var(--px) var(--px) 0 rgba(255,255,255,.15)}
.tcard:hover{filter:brightness(1.25)} .tcard small{display:block;font-size:var(--fs);color:#b9c3ee;margin-top:.3em}
.tcard.sel{outline:var(--px) solid #ffe15a}
table.t{border-collapse:collapse;margin:.3em auto;font-size:var(--fs);background:rgba(0,0,0,.45)}
table.t td,table.t th{padding:.25em .5em;text-align:center;border-bottom:1px solid rgba(255,255,255,.12)}
table.t th{color:#ffe15a}
table.t tr.me td{background:rgba(240,192,32,.25);color:#fff}
.box{background:rgba(16,22,58,.92);padding:.6em .9em;margin:.3em 0;box-shadow:0 0 0 var(--px) #05060c,inset var(--px) var(--px) 0 rgba(255,255,255,.12)}
.small{font-size:var(--fs);color:#c9d2f5}
.win{color:#7dff8e} .lose{color:#ff8a8a}
.stat{display:inline-flex;align-items:center;margin:.15em .4em;font-size:var(--fs)}
.stat .bar{width:4.5em}
.prow{display:flex;align-items:center;flex-wrap:wrap;gap:.2em .5em;padding:.35em .2em;border-bottom:1px solid rgba(255,255,255,.1)}
.prow .nm{min-width:6.5em;font-weight:700}
#pop{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:5}
.popbox{background:#151b40;padding:.8em 1.1em;max-width:90%;max-height:90%;overflow:auto;text-align:center;
 box-shadow:0 0 0 var(--px) #f2e2b0,0 0 0 calc(var(--px)*2) #05060c}
.trophy canvas{width:calc(var(--f)*5);height:calc(var(--f)*5);image-rendering:pixelated}
.trophy{display:inline-flex;flex-direction:column;align-items:center;margin:.4em;font-size:var(--fs);width:calc(var(--f)*7);text-align:center}
.line td{min-width:1.6em}
</style>
</head>
<body>
<div id="stage">
 <canvas id="cv" width="384" height="216"></canvas>
 <div id="hud" class="hide">
  <div id="topBtns">
   <button class="pbtn s" data-a="auto" id="bAuto">자동: 끔</button>
   <button class="pbtn s" data-a="pchange" id="bPit">투수 교체</button>
   <button class="pbtn s" data-a="sound" id="bSnd">소리: 켬</button>
   <button class="pbtn s" data-a="pause">메뉴</button>
  </div>
  <div id="speedBox"></div>
  <div id="batCard" class="card"></div>
  <div id="pitCard" class="card"></div>
  <div id="hint" class="hide"></div>
  <div id="ctrl"></div>
 </div>

 for(let r=0;r<3;r++)for(let c=0;c<3;c++){let v=rng()*1.4-0.7;if(c===1&&r===1)v+=1.2;else if(c===1||r===1)v+=0.3;else v-=0.4;
  if(c===ins)v+=(pow-60)/30*0.6;if(c===awy)v+=(con-70)/20*0.5;if(r===2)v+=(pow-65)/40*0.4;if(r===0)v-=(75-con)/40*0.4;sc.push(v);}

function aiSwing(g,p){const B=curBatter(g),P=curPitcher(g),fat=fatigue(g,1-g.half);
 const ex=Math.max(0,Math.abs(p.fx)-0.25),ey=Math.max(0,0.46-p.fy,p.fy-1.09);const edge=Math.hypot(ex,ey);const inZ=edge===0;

 let ps=inZ?0.66:Math.max(0.02,0.28-edge*1.8);
 if(!inZ&&brk)ps+=0.08;
 if(g.strikes===2)ps+=inZ?0.24:0.12;
 if(g.balls===3&&g.strikes<2)ps*=0.6;
 if(!inZ)ps-=(B.con-70)/100*0.25;
 if(Math.random()>ps)return{swing:false};
 const tSw=p.T+clamp(gauss()*0.03,-0.08,0.05);
 let pc=inZ?0.84:Math.max(0.12,0.6-edge*1.6);
 const hz=hotOf(B,p.fx,p.fy);pc+=(B.con-70)/100*0.55+0.05*hz;
 if(!brk)pc-=(p.kmh-145)/100*1.4;else pc-=(P.brk-70)/100*0.7;
 if(p.nice)pc-=0.07;pc+=fat*0.12;
 if(humanPitching(g))pc+=[-0.07,0,0.04][S.set.diff];
 pc=clamp(pc,0.15,0.95);
 if(Math.random()>pc)return{swing:true,contact:false,tSw};
 if(Math.random()<0.4)return{swing:true,contact:true,foul:true,tSw,sp:(Math.random()<0.5?-1:1)*rnd(50,85),ev:rnd(25,40),la:rnd(-10,65)};
 const mid=1-clamp(Math.hypot(p.fx/0.25,(p.fy-0.78)/0.3),0,1.4)/1.4;
 const q=clamp(Math.random()*0.85+mid*0.2+(B.pow-65)/250-(p.nice?0.08:0)+fat*0.08+0.07*hz,0,1);
 const ev=(36+B.pow*0.13)*(0.68+0.32*q)+rnd(-1.5,1.5);
 const la=12+(B.pow-60)/6+gauss()*20;
 const pull=B.hand==='L'?1:-1;
 const sp=clamp(pull*8+gauss()*21,-44,44);
 return{swing:true,contact:true,foul:false,tSw,ev,la,sp};}

function autoSwing(g){const p=g.p;p.checked=true;const k=cellRect(batLock.c,batLock.r);
 const B=curBatter(g);const hb=hitBox(g),h=hotOf(B,p.fx,p.fy);const hw=hb.hw*(1+0.08*h),hh=hb.hh*(1+0.08*h);const nx=(p.B.x-k.cx)/hw,ny=(p.B.y-k.cy)/hh;
 if(Math.max(Math.abs(nx),Math.abs(ny))>1)return;
 const Wd=DIFF[S.set.diff].W;const e=clamp(gauss()*Wd*(0.32-B.con/100*0.2),-0.06,0.06);
 p.swung=true;g.sw={t0:g.time,aim:{x:k.cx,y:k.cy}};
 const d=Math.hypot(nx,ny),qt=1-Math.abs(e)/Wd,qp=1-d/1.42;const q=clamp(0.3*qt+0.7*qp+0.08*h,0,1);
 let ev=(36+B.pow*0.13)*(0.62+0.38*q)+rnd(-1.2,1.2)+h*0.8;if(q>0.85)ev+=1.5;
 const la=18-ny*36+rnd(-6,6);const pull=B.hand==='L'?1:-1;
 const sp=p.fx/0.25*18+pull*(-e/Wd)*35+gauss()*14;
 p.res={type:Math.abs(sp)>45?'foul':'fair',ev,la,sp,q,tHit:p.T+e};}
function toggleLock(){if(batLock&&batLock.c===batCell.c&&batLock.r===batCell.r)batLock=null;else batLock={c:batCell.c,r:batCell.r};SFX.click();}
// 칠 칸 고르기: 투수는 내가 칸을 누를 때까지 기다렸다가 던진다 (아이가 정함 2026-10-19 "내가 어디칠지 정해노면 던지게")

function batPick(g){if(g.st==='pre'){batLock={c:batCell.c,r:batCell.r};if(!g.ready){g.ready=true;g.stT=0;}SFX.click();hud();return;}
 if(g.st==='windup'||g.st==='flight'){toggleLock();return;}
 batLock={c:batCell.c,r:batCell.r};g.queued=true;SFX.click();}

function humanThrow(){const g=G;const a=g.aim;const P=curPitcher(g);const type=P.types[g.sel]||P.types[0];
 const acc=clamp((a.r-3)/19,0,1);const nice=a.r<=6;
 const tx=(a.x-ZCX)/ZS,ty=0.5+(ZPY-a.y)/ZS;a.state='free';
 throwPitch(g,type,tx,ty,acc,nice);if(nice)msg('나이스 제구!','#7dff8e',true);}

function flightPath(ev,la,sp,pk){
 const dt=0.02,k=0.17,gr=9.8;const th=la*Math.PI/180,ph=sp*Math.PI/180;const dx=Math.sin(ph),dy=Math.cos(ph);
 let vh=ev*Math.cos(th),vz=ev*Math.sin(th),r=0,h=1.0,t=0,rolling=false,landT=-1,hr=false,hrT=0,wall=false;
 const fr=fenceAt(pk,sp),wh=wallAt(pk,sp);const pts=[];
 for(let i=0;i<700;i++){
  pts.push({t,x:dx*r,y:dy*r,h,gr:landT>=0});
  if(hr&&t>hrT+1.5)break;
  if(!rolling){vh-=k*vh*dt;vz-=gr*dt;r+=vh*dt;h+=vz*dt;
   if(h<=0){h=0;if(hr){rolling=true;vh=0;}else{if(landT<0)landT=t+dt;if(Math.abs(vz)>3){vz=-vz*0.38;vh*=0.7;}else{vz=0;rolling=true;vh*=0.9;}}}}
  else{const sg=Math.sign(vh);vh=sg*Math.max(0,Math.abs(vh)-5.5*dt);r+=vh*dt;}
  if(!hr&&r>=fr){if(h>wh&&landT<0&&Math.abs(sp)<=45){hr=true;hrT=t;}
   else{r=fr-0.2;vh=-Math.abs(vh)*(rolling?0.4:0.3);wall=true;}}
  if(r<0){r=0;vh=0;}
  t+=dt;}
 return{pts,landT:landT<0?99:landT,hr,hrT,wall,dt,fr};}
function makeFielders(g){const fs=1-g.half;const R=g.R[fs];const F=[];
 R.bat.forEach(b=>{if(b.pos==='DH')return;const of=b.pos==='LF'||b.pos==='CF'||b.pos==='RF';
  F.push({id:b.pos,x:FPOS[b.pos].x,y:FPOS[b.pos].y,x0:FPOS[b.pos].x,y0:FPOS[b.pos].y,v:(of?4.8:5.0)+b.spd/100*1.6,react:(of?0.65:0.38)+rnd(-0.05,0.1),reach:b.pos==='C'?0.8:(of?0.9:1.0),name:b.name});});
 F.push({id:'P',x:0,y:18.4,x0:0,y0:18.4,v:5.2,react:0.55+rnd(0,0.1),reach:0.7,name:curPitcher(g).name});
 return F;}
function findCatch(path,F){const Pp=path.pts;
 for(let i=0;i<Pp.length;i++){const p=Pp[i];if(p.h>2.4)continue;if(Math.hypot(p.x,p.y)>path.fr+0.3)continue;
  let best=null,bt=1e9;for(const f of F){const d=Math.max(0,Math.hypot(f.x-p.x,f.y-p.y)-f.reach);const need=f.react+d/f.v;if(need<=p.t&&need<bt){best=f;bt=need;}}
  if(best)return{f:best,t:p.t,x:p.x,y:p.y,air:!p.gr};}
 const p=Pp[Pp.length-1];let best=F[0],bd=1e9;F.forEach(f=>{const d=Math.hypot(f.x-p.x,f.y-p.y);if(d<bd){bd=d;best=f;}});
 return{f:best,t:p.t+best.react+bd/best.v,x:p.x,y:p.y,air:false};}
function mkRunner(p,from,to,t0,v){return{name:p.name,p,from,to,t0,v,out:false,outT:0,outS:to,arrT:t0+Math.max(0,to-from)*27.43/v};}
function isForced(occ,b){for(let k=1;k<b;k++)if(!occ[k-1])return false;return true;}
function resolvePlay(g,ev,la,sp){
 const pk=TEAM[g.home].park;const path=flightPath(ev,la,sp,pk);const F=makeFielders(g);
 const bat=curBatter(g),vb=runV(bat);const occ=g.bases.slice();const outs0=g.outs;
 const pl={path,F,throws:[],runners:[],events:[],outs:0,runs:0,nb:[null,null,null],kind:'',text:'',tf:0,end:0,time:0,cat:null,ev,la,sp,hits:0,bases:0};
 if(path.hr){pl.kind='HR';pl.runs=1+occ.filter(Boolean).length;pl.text=pl.runs===4?'만루 홈런!!!':'홈런!!';pl.hits=1;pl.bases=4;
  const t0=0.5;occ.forEach((r,i)=>{if(r)pl.runners.push(mkRunner(r,i+1,4,t0,12));});pl.runners.push(mkRunner(bat,0,4,t0+0.3,12));
  pl.tf=path.hrT;pl.end=path.hrT+2.6;return pl;}
 const cat=findCatch(path,F);pl.cat=cat;pl.tf=cat.t;const f=cat.f;const CP={x:cat.x,y:cat.y};
 f.mv={x:cat.x,y:cat.y,t0:f.react,v:f.v};
 F.forEach(o=>{if(o!==f){const dx=cat.x-o.x,dy=cat.y-o.y,d=Math.hypot(dx,dy)||1;const m=Math.min(4,d*0.3);o.mv={x:o.x+dx/d*m,y:o.y+dy/d*m,t0:o.react+0.1,v:o.v*0.6};}});
 const stay=(b,r)=>{pl.runners.push(mkRunner(r,b,b,0,runV(r)));pl.nb[b-1]=r;};
 const cover=(base)=>{let id;if(base===1)id=f.id==='1B'?'2B':'1B';else if(base===2)id=(f.id==='SS'||f.id==='3B'||(f.id==='P'&&cat.x<0))?'2B':'SS';else if(base===3)id=f.id==='3B'?'SS':'3B';else id=f.id==='C'?'P':'C';
  const o=F.find(q=>q.id===id);if(o&&o!==f){o.mv={x:BASES[base%4].x,y:BASES[base%4].y,t0:o.react,v:o.v};}};
 if(cat.air){
  pl.kind='FO';pl.outs=1;pl.text=la<12?'직선타 아웃':(Math.hypot(cat.x,cat.y)<45?'내야 뜬공 아웃':'뜬공 아웃');
  const br=mkRunner(bat,0,1,0.2,vb);br.out=true;br.outT=cat.t;br.outS=Math.min(0.9,Math.max(0,cat.t-0.2)*vb/27.43);pl.runners.push(br);
  pl.events.push({t:cat.t,x:cat.x,y:cat.y,txt:'OUT',c:'#ff5050'});
  let tEnd=cat.t+0.9;
  for(let b=1;b<=3;b++){const r=occ[b-1];if(!r)continue;
   if(b===3&&outs0+1<3&&Math.hypot(cat.x,cat.y)>40){const v=runV(r);const arr=cat.t+27.43/v;const thr=cat.t+0.9+dist(CP,BASES[0])/24;
    if(arr<thr+1.0){pl.runs++;pl.kind='SF';pl.text='희생플라이!';pl.runners.push(mkRunner(r,3,4,cat.t,v));pl.throws.push({from:CP,to:BASES[0],t0:cat.t+0.9,t1:thr});cover(4);tEnd=Math.max(tEnd,arr+0.4,thr+0.3);continue;}}
   stay(b,r);}
  if(!pl.throws.length)pl.throws.push({from:CP,to:{x:0,y:30},t0:cat.t+0.6,t1:cat.t+0.6+dist(CP,{x:0,y:30})/26});
  pl.end=Math.max(tEnd,pl.throws[pl.throws.length-1].t1+0.3);return finalize(pl,g);}
 const tf=cat.t;
 if(IF_IDS.includes(f.id)&&Math.hypot(cat.x,cat.y)<46){
  // 땅볼 수비
  const thrT=(from,base)=>tf+0.75+dist(from,BASES[base])/28;
  const tB1=0.65+27.43/vb;let done=false;const r1=occ[0];
  if(r1&&outs0<2){const v1=runV(r1);const tR2=0.3+24.4/v1;const t2=thrT(CP,2);
   if(t2+0.4<tR2){cover(2);pl.throws.push({from:CP,to:BASES[2],t0:tf+0.75,t1:t2});pl.outs=1;
    const rr=mkRunner(r1,1,2,0.1,v1);rr.out=true;rr.outT=t2;rr.outS=1+Math.min(0.92,Math.max(0,t2-0.1)*v1/27.43);pl.runners.push(rr);
    pl.events.push({t:t2,x:BASES[2].x,y:BASES[2].y,txt:'OUT',c:'#ff5050'});
    const t1=t2+0.9+27.43/25;cover(1);pl.throws.push({from:BASES[2],to:BASES[1],t0:t2+0.9,t1});
    if(t1+0.05<tB1&&outs0+1<3){pl.outs=2;pl.kind='DP';pl.text='병살!';const br=mkRunner(bat,0,1,0.75,vb);br.out=true;br.outT=t1;br.outS=Math.min(0.95,(t1-0.75)*vb/27.43);pl.runners.push(br);
     pl.events.push({t:t1,x:BASES[1].x,y:BASES[1].y,txt:'OUT',c:'#ff5050'});}
    else{pl.kind='FC';pl.text='선행 주자 아웃';pl.runners.push(mkRunner(bat,0,1,0.75,vb));pl.nb[0]=bat;pl.events.push({t:tB1,x:BASES[1].x,y:BASES[1].y,txt:'SAFE',c:'#7dff8e'});}
    for(let b=2;b<=3;b++){const r=occ[b-1];if(!r)continue;const to=b+1;pl.runners.push(mkRunner(r,b,to,0.2,runV(r)));if(to>=4)pl.runs++;else pl.nb[to-1]=r;}
    done=true;pl.end=Math.max(t1,tB1)+0.6;}}
  if(!done){const t1=thrT(CP,1);cover(1);pl.throws.push({from:CP,to:BASES[1],t0:tf+0.75,t1});
   if(t1+0.05<tB1){pl.kind='GO';pl.outs=1;pl.text='땅볼 아웃';const br=mkRunner(bat,0,1,0.75,vb);br.out=true;br.outT=t1;br.outS=Math.min(0.95,(t1-0.75)*vb/27.43);pl.runners.push(br);
    pl.events.push({t:t1,x:BASES[1].x,y:BASES[1].y,txt:'OUT',c:'#ff5050'});
    for(let b=1;b<=3;b++){const r=occ[b-1];if(!r)continue;const to=b+1;pl.runners.push(mkRunner(r,b,to,0.2,runV(r)));if(to>=4)pl.runs++;else pl.nb[to-1]=r;}}
   else{pl.kind='IH';pl.text='내야 안타!';pl.hits=1;pl.bases=1;pl.runners.push(mkRunner(bat,0,1,0.75,vb));pl.nb[0]=bat;pl.events.push({t:tB1,x:BASES[1].x,y:BASES[1].y,txt:'SAFE',c:'#7dff8e'});
    for(let b=1;b<=3;b++){const r=occ[b-1];if(!r)continue;const to=isForced(occ,b)?b+1:b;pl.runners.push(mkRunner(r,b,to,0.2,runV(r)));if(to>=4)pl.runs++;else pl.nb[to-1]=r;}}
   pl.end=Math.max(t1,tB1)+0.6;}
  return finalize(pl,g);}
 // 안타!
 const landed=path.landT<tf;const hold=(landed&&la>=18&&path.landT>1.0)?Math.min(1.2,path.landT*0.3):0;
 const ballAt=k=>tf+0.7+dist(CP,BASES[k===4?0:k])/25;
 let kb=1;while(kb<4&&0.75+(kb+1)*27.43/vb+kb*0.3+0.3<ballAt(kb+1))kb++;
 let cap=5;
 for(let b=3;b>=1;b--){const r=occ[b-1];if(!r)continue;const v=runV(r);let to=b;
  for(let j=b+1;j<=4;j++){const tr=0.2+hold+(j-b)*27.43/v+(j-b-1)*0.3;if(tr<ballAt(j)+(j===4?2.0:0.3))to=j;else break;}
  if(isForced(occ,b))to=Math.max(to,b+1);if(cap<4)to=Math.min(to,cap-1);cap=to;
  pl.runners.push(mkRunner(r,b,to,0.2+hold,v));if(to>=4)pl.runs++;else pl.nb[to-1]=r;}
 if(cap<4)kb=Math.min(kb,cap-1);kb=Math.max(1,kb);
 pl.runners.push(mkRunner(bat,0,kb,0.6,vb));if(kb>=4)pl.runs++;else pl.nb[kb-1]=bat;
 pl.kind='H'+kb;pl.hits=1;pl.bases=kb;pl.text=['','안타!','2루타!','3루타!','그라운드 홈런!!'][kb];if(path.wall&&kb>=2)pl.text+=' 펜스 맞았어!';
 const tb=Math.min(4,kb+1);const tgt=BASES[tb===4?0:tb];cover(tb);pl.throws.push({from:CP,to:tgt,t0:tf+0.7,t1:tf+0.7+dist(CP,tgt)/25});
 let e=pl.throws[0].t1;pl.runners.forEach(r=>e=Math.max(e,r.arrT));pl.end=e+0.4;
 return finalize(pl,g);}
function finalize(pl,g){if(g.outs+pl.outs>=3){pl.runs=0;}pl.end=Math.min(pl.end,pl.tf+9);return pl;}
// 애니메이션용 위치
function basePt(s){s=clamp(s,0,4);const k=Math.min(3,Math.floor(s)),u=s-k;const a=BASES[k],b=BASES[k+1];return{x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u)};}
function runnerPos(r,t){if(r.out&&t>r.outT+0.9)return null;if(r.to>=4&&r.from<4&&t>r.arrT+0.5)return null;
 let s=r.from+Math.max(0,t-r.t0)*r.v/27.43;const lim=r.out?r.outS:r.to;if(s>lim)s=lim;const p=basePt(s);return{x:p.x,y:p.y,moving:s<lim&&t>=r.t0,out:r.out&&t>=r.outT};}
function fielderPos(f,t){const m=f.mv;if(!m)return{x:f.x0,y:f.y0,moving:false};const tt=t-m.t0;if(tt<=0)return{x:f.x0,y:f.y0,moving:false};
 const D=Math.hypot(m.x-f.x0,m.y-f.y0);const d=Math.min(D,tt*m.v);const u=D>0?d/D:1;return{x:lerp(f.x0,m.x,u),y:lerp(f.y0,m.y,u),moving:d<D};}
function ballPos(pl,t){const P=pl.path.pts;if(pl.kind==='HR'||t<=pl.tf){const i=clamp(Math.floor(t/pl.path.dt),0,P.length-1);return P[i];}
 for(const th of pl.throws){if(t<th.t0)return{x:th.from.x,y:th.from.y,h:1.4};if(t<=th.t1){const u=(t-th.t0)/(th.t1-th.t0);return{x:lerp(th.from.x,th.to.x,u),y:lerp(th.from.y,th.to.y,u),h:1.4+Math.sin(u*Math.PI)*2.5};}}
 const L=pl.throws[pl.throws.length-1];if(L)return{x:L.to.x,y:L.to.y,h:1.2};return{x:pl.cat.x,y:pl.cat.y,h:1.2};}

function addRuns(g,n){if(n<=0)return;g.score[g.half]+=n;g.halfRuns+=n;
 if(g.half===1&&g.inning>=g.maxInn&&g.score[1]>g.score[0])g.walkoff=true;}
function stat(g){return g.bs[g.half][curBatter(g).name];}
function doCall(g){const p=g.p;let txt,col='#ffffff';let sub='';
 if(p.swung){g.strikes++;txt='헛스윙!';col='#ffd84a';if(p.res&&p.res.why&&humanBatting(g))sub=p.res.why==='early'?'너무 빨랐어':p.res.why==='late'?'너무 늦었어':'공이 다른 칸으로 왔어';}
 else if(inZone(p.fx,p.fy)){g.strikes++;txt='스트라이크!';col='#ffd84a';if(humanBatting(g))sub=batLock?'공이 다른 칸으로 왔어':'칸을 눌러 두면 알아서 쳐!';}else{g.balls++;txt='볼';col='#7dd3ff';}
 g.paEnd=false;
 if(g.strikes>=3){txt=p.swung?'헛스윙 삼진!':'루킹 삼진!';col='#ff6a6a';g.outs++;stat(g).ab++;stat(g).k++;g.paEnd=true;SFX.out();}
 else if(g.balls>=4){txt='볼넷';col='#7dff8e';const b=g.bases,bat=curBatter(g);let runs=0;if(b[0]){if(b[1]){if(b[2])runs++;b[2]=b[1];}b[1]=b[0];}b[0]=bat;
  stat(g).bb++;if(runs){stat(g).rbi+=runs;addRuns(g,runs);txt='밀어내기 볼넷!';}g.paEnd=true;SFX.ball();}
 else if(txt==='볼')SFX.ball();else SFX.strike();
 msg(txt,col,false,sub);g.st='call';g.stT=0;hud();}
function applyPlay(g,pl){const st=stat(g);
 if(pl.kind!=='SF')st.ab++;if(pl.hits){st.h++;g.hits[g.half]++;}if(pl.kind==='HR'){st.hr++;if(g.half===g.my)g.myHR++;}
 g.outs+=pl.outs;
 if(g.outs<3){g.bases=pl.nb.slice();if(pl.kind!=='DP')st.rbi+=pl.runs;addRuns(g,pl.runs);}
 let col=pl.hits?'#ffe15a':'#ff8a8a';if(pl.kind==='HR')col='#ff7ae0';if(pl.kind==='SF')col='#7dff8e';
 msg(pl.text,col,true,pl.runs&&g.outs<3?pl.runs+'점!':'');
 if(pl.hits||pl.runs){if(g.half===g.my)SFX.hit();}else SFX.out();
 if(pl.kind==='HR')SFX.hr();else if(pl.runs)SFX.cheer(1.2,0.1);}
function endPA(g){g.bi[g.half]=(g.bi[g.half]+1)%9;g.balls=0;g.strikes=0;
 if(g.walkoff){return gameOver(g);}
 if(g.outs>=3)return endHalf(g);
 // AI 투수 교체
 const fs=1-g.half;if(fs!==g.my||g.auto)aiBullpen(g,fs);
 prePitch();}
function aiBullpen(g,side){const R=g.R[side];const lead=g.score[side]-g.score[1-side];
 const avail=R.pit.map((p,i)=>i).filter(i=>!g.used[side].includes(i));if(!avail.length)return;
 const closer=R.pit.length-1;let next=null;
 if(g.inning>=g.maxInn&&g.maxInn>=5&&lead>=1&&lead<=3&&avail.includes(closer)&&!R.pit[g.pi[side]].closer)next=closer;
 else if(fatigue(g,side)>0.85){next=avail.find(i=>i!==closer);if(next==null)next=avail[0];}
 if(next!=null)changePitcher(g,side,next);}
function changePitcher(g,side,i){g.pi[side]=i;g.pc[side]=0;if(!g.used[side].includes(i))g.used[side].push(i);
 const p=g.R[side].pit[i];msg('투수 교체','#bfe3ff',true,p.name+(p.closer?' (마무리)':''));hud();}
function endHalf(g){g.line[g.half][g.inning-1]=g.halfRuns;const a=g.score[0],h=g.score[1];
 if(g.half===0){if(g.inning>=g.maxInn&&h>a){g.line[1][g.inning-1]='X';return gameOver(g);}g.half=1;}
 else{if(g.inning>=g.maxInn&&a!==h)return gameOver(g);if(g.inning>=g.maxInn+(g.noTie?20:3))return gameOver(g);g.half=0;g.inning++;}

function updateGame(dt){const g=G;const sp=g.auto?2.0:1;
 if(g.st==='field'){g.play.time+=dt*(g.auto?3.5:2.4)*(g.fast?2:1);if(g.play.time>=g.play.end){g.view='bat';applyPlay(g,g.play);g.st='res';g.stT=0;hud();}return;}
 dt*=sp;g.time+=dt;g.stT+=dt;
 switch(g.st){
  case 'intro':if(g.stT>1.1){if(!g.started){g.started=true;beginHalf();}else{unbanner();prePitch();}}break;
  case 'change':if(g.stT>1.3){unbanner();g.st='intro';g.stT=9;}break;
  case 'pre':
   if(humanPitching(g)){if(g.aim.state==='ring'){g.aim.t+=dt;const u=g.aim.t/0.45;g.aim.r=3+19*Math.abs(1-u);if(g.aim.t>=0.9){g.aim.r=22;humanThrow();}}}
   else if(humanBatting(g)&&!g.ready){/* 내가 칠 칸을 고를 때까지 기다림 */}
   else if(g.stT>(g.auto?0.25:0.35)){const c=aiPitchChoice(g);throwPitch(g,c.type,c.tx,c.ty,0.5,false);}
   break;
  case 'windup':if(g.stT>=WU){g.st='flight';g.stT=0;g.p.t=0;hud();}break;
  case 'flight':{const p=g.p;p.t+=dt;
   if(humanBatting(g)&&batLock&&!p.swung&&!p.checked&&p.t>=p.T-0.12)autoSwing(g);
   if(p.ai&&p.ai.swing&&!p.swung&&p.t>=p.ai.tSw){p.swung=true;g.sw={t0:g.time,aim:{x:p.B.x+rnd(-3,3),y:p.B.y+rnd(-3,3)}};
    p.res=p.ai.contact?{type:p.ai.foul?'foul':'fair',ev:p.ai.ev,la:p.ai.la,sp:p.ai.sp,tHit:p.ai.tSw}:{type:'miss'};}
   if(p.res&&p.res.type!=='miss'&&p.t>=p.res.tHit+0.02){contact(g);break;}
   if(p.t>=p.T+0.1){SFX.mitt();doCall(g);}
   break;}
  case 'hit':if(g.stT>0.35){afterHit(g);}break;
  case 'call':if(g.stT>0.6){if(g.paEnd)endPA(g);else prePitch();}break;
  case 'res':if(g.stT>0.9){endPA(g);}break;
  case 'over':if(g.stT>2.2&&!g.shown){g.shown=true;showGameOver();}break;}}
function contact(g){const p=g.p;SFX.crack();const u=clamp(p.t/p.T,0,1);const b=ballScreen(p,u);
 g.hitAnim={x:b.x,y:b.y,r:b.r,res:p.res};g.st='hit';g.stT=0;
 if(p.res.type==='fair')g.play=resolvePlay(g,p.res.ev,p.res.la,p.res.sp);}
function afterHit(g){const r=g.hitAnim.res;
 if(r.type==='foul'){if(g.strikes<2)g.strikes++;msg('파울','#ffffff');g.paEnd=false;g.st='call';g.stT=0;hud();return;}
 g.view='field';g.st='field';g.fast=false;g.play.time=0;hud();}

function teamRating(tid){const r=roster(tid);const off=r.bat.reduce((s,b)=>s+b.pow*0.45+b.con*0.45+b.spd*0.1,0)/9;
 const pit=r.pit.slice(0,5).reduce((s,p)=>s+(p.vel-128)*1.5+p.ctrl*0.35+p.brk*0.35,0)/5;return{off,pit};}
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function simGame(home,away,noTie){const H=teamRating(home),A=teamRating(away);const inn=S.set.inn;
 const la=0.52*Math.pow(A.off/70,2.4)/Math.pow(H.pit/86,1.6),lh=0.52*Math.pow(H.off/70,2.4)/Math.pow(A.pit/86,1.6)*1.04;
 let a=0,h=0;for(let i=0;i<inn;i++){a+=poisson(la);h+=poisson(lh);}let ex=0;while(a===h&&(ex<3||noTie)){a+=poisson(la);h+=poisson(lh);ex++;if(ex>30){h++;}}return[a,h];}
function recordGame(home,away,sc){const t=S.season.table;const a=sc[0],h=sc[1];t[home].rs+=h;t[home].ra+=a;t[away].rs+=a;t[away].ra+=h;
 if(h>a){t[home].w++;t[away].l++;}else if(a>h){t[away].w++;t[home].l++;}else{t[home].d++;t[away].d++;}}

 rd.forEach(p=>{if(p[0]===S.team||p[1]===S.team)return;const sc=simGame(p[0],p[1]);recordGame(p[0],p[1],sc);});
 se.ri++;if(se.ri>=se.rounds.length){se.phase='post';setupPost();}save();}

 S.season.log.push(TEAM[pr[1]].abbr+' '+sc[0]+' : '+sc[1]+' '+TEAM[pr[0]].abbr+' ('+res+', 결과만)');S.coins+=res==='승'?100:40;finishRound();showSeason();}

 ptype(v){if(!G)return;G.sel=Number(v);hud();},
 pchange(){const g=G;if(!g||g.half===g.my)return;const side=g.my;const R=g.R[side];g.paused=true;
  pop('<h2>투수 교체</h2><p class="small">한 번 내려간 투수는 다시 못 나와.</p>'+R.pit.map((p,i)=>{const used=g.used[side].includes(i);return '<div class="prow" style="justify-content:space-between"><span class="nm">'+p.name+(p.closer?' (마무리)':'')+'</span><span class="small">구속 '+p.vel+' 제구 '+p.ctrl+' 변화 '+p.brk+' 체력 '+p.sta+'</span>'+
   (i===g.pi[side]?'<span class="small">지금 던지는 중</span>':'<button class="pbtn s '+(used?'k':'g')+'" data-a="pdo" data-v="'+i+'"'+(used?' disabled':'')+'>내보내기</button>')+'</div>';}).join('')+'<button class="pbtn" data-a="resume">닫기</button>');},
 pdo(v){const g=G;unpop();g.paused=false;if(g.st==='flight'||g.st==='windup')return;changePitcher(g,g.my,Number(v));},
};
stage.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.disabled)return;if(el.blur)el.blur();ac();SFX.click();const f=ACT[el.dataset.a];if(f)f(el.dataset.v);});

// ---- 마우스 / 터치 / 키보드 ----
const keys={};
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function setCursor(x,y){const k=cellAt(x,y,false);setCellBat(k.c,k.r);}
function setAim(x,y){const k=cellAt(x,y,true);setCellAim(k.c,k.r);}
function onMove(p){const g=G;if(!g||scene!=='game'||g.paused)return;if(humanBatting(g))setCursor(p.x,p.y);else if(humanPitching(g)&&g.st==='pre'&&g.aim.state==='free')setAim(p.x,p.y);}
function onDown(p){const g=G;if(!g||scene!=='game'||g.paused)return;
 if(g.st==='field'){g.fast=true;return;}
 if(g.st==='change'||g.st==='intro'){if(g.stT>0.5)g.stT=9;return;}
 if(humanBatting(g)){if(p)setCursor(p.x,p.y);batPick(g);return;}
 if(humanPitching(g)&&g.st==='pre'){if(g.aim.state==='free'){if(p)setAim(p.x,p.y);g.aim.state='ring';g.aim.t=0;g.aim.r=22;hud();}else if(g.aim.state==='ring')humanThrow();}}
stage.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;onMove(toCanvas(e));});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,[data-a],#scr,#pop,.card'))return;ac();onDown(toCanvas(e));});
addEventListener('keydown',e=>{keys[e.code]=true;if(!G||scene!=='game'||G.paused)return;
 if(e.code==='Space'||e.code==='Enter'){e.preventDefault();onDown(null);}
 const m=/^Digit([1-6])$/.exec(e.code);if(m&&humanPitching(G)){const P=curPitcher(G);const i=Number(m[1])-1;if(i<P.types.length){G.sel=i;hud();}}
 const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.code];
 if(dir){e.preventDefault();if(humanBatting(G))setCellBat(batCell.c+dir[0],batCell.r+dir[1]);else if(humanPitching(G)&&G.st==='pre'&&G.aim.state==='free'){const a=G.aim.cell||{c:1,r:1};setCellAim(a.c+dir[0],a.r+dir[1]);}}
 const np=/^Numpad([1-9])$/.exec(e.code);if(np&&humanBatting(G)){const n=Number(np[1])-1;setCellBat(n%3,2-Math.floor(n/3));batPick(G);}
 if(e.code==='KeyA')ACT.auto();});
addEventListener('keyup',e=>{keys[e.code]=false;});

// =====================================================================
//  메인 루프
// =====================================================================
let last=performance.now(),errCount=0;
function draw(now){const t=now/1000;
 if(scene==='game'&&G){if(G.view==='field'&&G.play)drawField(t);else drawBat(t);}else drawTitleBG(t);}
function loop(now){requestAnimationFrame(loop);
 try{const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(scene==='game'&&G&&!G.paused)updateGame(dt);
  draw(now);drawFx(dt);
 }catch(e){errCount++;if(errCount<5)console.error(e);}}
load();resize();toTitle();requestAnimationFrame(loop);
</script>
<script src="../track.js" defer></script>
</body>
</html>
