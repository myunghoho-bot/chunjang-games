<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>랜덤 인생 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:'Malgun Gothic','맑은 고딕',sans-serif;color:#e8edf2;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
.panel{background:rgba(16,20,26,.78);border:1px solid rgba(255,255,255,.09);border-radius:10px;backdrop-filter:blur(6px)}
#top{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:10px;align-items:stretch;pointer-events:none}
#top>div{pointer-events:auto}
.who{padding:8px 14px;min-width:180px;max-width:300px;flex:0 1 auto}
.who b{display:block;font-size:17px;letter-spacing:-.3px}
.who span{display:block;font-size:12px;color:#9fb0c0;margin-top:2px;line-height:1.35}
.stats{display:flex;gap:0;padding:6px 6px;flex:1;flex-wrap:nowrap;align-items:center;overflow:hidden}
.st{padding:2px 9px;border-right:1px solid rgba(255,255,255,.07);flex:0 0 auto}
.st:last-child{border-right:0}
.st i{display:block;font-style:normal;font-size:11px;color:#8c9aab}
.st b{font-size:14px;white-space:nowrap}
.bar{display:block;width:60px;height:7px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px;background:#7cc6a4;transition:width .4s}
#tSkill{background:#7fa8e0}
.clock{padding:6px 12px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:190px}
.clock b{font-size:16px}
.clock>span{font-size:12px;color:#9fb0c0}
.row{display:flex;gap:4px}
button{font-family:inherit;font-size:12px;color:#dfe7ee;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{background:rgba(255,255,255,.16)}
button.on{background:#3d6f8f;border-color:#5b93b8;color:#fff}
button:disabled{opacity:.4;cursor:default}
#log{position:fixed;left:10px;bottom:10px;width:330px;max-height:34vh;overflow:hidden;padding:8px 12px;font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;justify-content:flex-end}
#log div{color:#c9d3dc;border-bottom:1px solid rgba(255,255,255,.05);padding:2px 0}
#log div em{font-style:normal;color:#8c9aab;margin-right:6px;font-size:11px}
#log div.good{color:#a9e3c4}
#log div.bad{color:#f0b9a0}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 16px;font-size:14px;display:none;white-space:nowrap;cursor:pointer}
#hint kbd{display:inline-block;background:#e8edf2;color:#111;border-radius:4px;padding:0 6px;margin-right:6px;font-family:inherit;font-weight:bold}
#workbar{position:fixed;right:10px;bottom:10px;padding:8px 12px;font-size:12.5px;min-width:220px;display:none;line-height:1.55}
#workbar .bar{width:100%}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);font-size:12px;padding:2px 8px;border-radius:5px;background:rgba(16,20,26,.72);color:#e8edf2;white-space:nowrap;pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.1)}
.lb.mine{background:rgba(48,92,70,.85);border-color:#7cc6a4}
.lb.work{background:rgba(52,78,120,.85);border-color:#7fa8e0}
.lb.sale{background:rgba(110,80,36,.85);border-color:#d9aa5c}
.lb.go{box-shadow:0 0 0 2px #ffd36b}
#modal{position:fixed;inset:0;background:rgba(5,8,12,.45);display:flex;align-items:center;justify-content:center;z-index:20}
#modal.hide{display:none}
.card{width:min(560px,92vw);max-height:86vh;overflow:auto;padding:20px 22px;background:rgba(20,25,32,.96);border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h2{font-size:19px;margin-bottom:4px;letter-spacing:-.3px}
.card .sub{font-size:12.5px;color:#9fb0c0;margin-bottom:14px;line-height:1.5}
.card p{font-size:14px;line-height:1.65;color:#d5dde5;margin:6px 0}
.card table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.card td,.card th{padding:6px 6px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
.card th{color:#8c9aab;font-weight:normal;font-size:12px}
.card .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.card .acts button{font-size:14px;padding:6px 16px}
.card .acts button.pri{background:#3d6f8f;border-color:#5b93b8;color:#fff}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;margin:10px 0}
.kv i{font-style:normal;color:#8c9aab}
.flag{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#fade{position:fixed;inset:0;background:#f4efe6;opacity:0;pointer-events:none;transition:opacity 2.2s;z-index:15}
#bar2{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="top">
 <div class="who panel"><b id="tName">-</b><span id="tPlace">-</span></div>
 <div class="stats panel">
  <div class="st"><i>연도</i><b id="tYear">-</b></div>
  <div class="st"><i>나이</i><b id="tAge">-</b></div>
  <div class="st"><i>돈</i><b id="tMoney">-</b></div>
  <div class="st"><i>직업</i><b id="tJob">-</b></div>
  <div class="st"><i>사는 곳</i><b id="tHome">-</b></div>
  <div class="st"><i>기분</i><span class="bar"><span id="tMood"></span></span></div>
  <div class="st"><i>실력</i><span class="bar"><span id="tSkill"></span></span></div>
 </div>
 <div class="clock panel">
  <b id="tClock">-</b><span id="tPhase">-</span>
  <div class="row" id="spd"><button data-s="1" class="on">1배</button><button data-s="2">2배</button><button data-s="4">4배</button></div>
  <div class="row"><button id="bPast">지나간 인생</button><button id="bHelp">도움말</button></div>
 </div>
</div>
<div id="workbar" class="panel"></div>
<div id="log" class="panel"></div>
<div id="hint" class="panel"></div>
<div id="modal" class="hide"><div class="card" id="mcard"></div></div>
<div id="fade"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const SAVE_KEY='randomlife3d_v1';

// ================= 기본 도구 =================
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random; // 지금 쓰는 랜덤 (마을 만들 때는 씨앗 랜덤으로 바꿈)
const rnd=(a,b)=>a+(b-a)*R();
const rint=(a,b)=>Math.floor(a+(b-a+1)*R());
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fmtN=n=>Math.round(n).toLocaleString('ko-KR');
function yearStr(y){if(y<0)return '기원전 '+(y<-9999?'약 ':'')+fmtN(-y)+'년';return y+'년'}
function addYear(y,n){let r=y+n;if(y<0&&r>=0)r+=1;return r} // 0년은 없음
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
function jit(c,k){const f=1+(R()-.5)*k;return[c[0]*f,c[1]*f,c[2]*f]}
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+a;return w+((c-0xAC00)%28?a:b)} // 받침 있으면 a
const eun=w=>josa(w,'은','는'),iga=w=>josa(w,'이','가'),eul=w=>josa(w,'을','를'),ro=w=>{const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+'로';const j=(c-0xAC00)%28;return w+(j&&j!==8?'으로':'로')};

// 4x4 행렬 (열 우선)
const M4={
 id(){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;return o},
 persp(f,a,n,fa){const t=1/Math.tan(f/2),r=new Float32Array(16);r[0]=t/a;r[5]=t;r[10]=(fa+n)/(n-fa);r[11]=-1;r[14]=2*fa*n/(n-fa);return r},
 ortho(l,r,b,t,n,f){const o=new Float32Array(16);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o},
 look(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx,o=new Float32Array(16);
  o[0]=xx;o[1]=yx;o[2]=zx;o[4]=xy;o[5]=yy;o[6]=zy;o[8]=xz;o[9]=yz;o[10]=zz;
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);o[15]=1;return o},
 mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o},
 // 위치·Y회전·크기 한 번에
 trs(x,y,z,ry,sx,sy,sz){const c=Math.cos(ry),s=Math.sin(ry),o=new Float32Array(16);
  o[0]=c*sx;o[2]=-s*sx;o[5]=sy;o[8]=s*sz;o[10]=c*sz;o[12]=x;o[13]=y;o[14]=z;o[15]=1;return o},
 tr(x,y,z){const o=M4.id();o[12]=x;o[13]=y;o[14]=z;return o},
 rx(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o},
 rz(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o},
 sc(x,y,z){const o=M4.id();o[0]=x;o[5]=y;o[10]=z;return o},
 xf(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14],m[3]*x+m[7]*y+m[11]*z+m[15]]}
};

class Geo{
 constructor(){this.d=[];this.ax=0;this.az=0;this.ar=0;this.ay=0}
 at(x,z,r,y){this.ax=x;this.az=z;this.ar=r||0;this.ay=y||0;return this}
 T(x,y,z){const c=Math.cos(this.ar),s=Math.sin(this.ar);return[this.ax+x*c+z*s,this.ay+y,this.az-x*s+z*c]}
 // 세 점(이미 바뀐 좌표)과 안쪽 기준점 → 법선은 바깥으로
 tri(a,b,c,col,g,ctr){let ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];

  const d=this.d;for(const p of[a,b,c])d.push(p[0],p[1],p[2],nx,ny,nz,col[0],col[1],col[2],g||0)}

 triC(a,b,c,ca,cb,cc){let ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;if(ny<0){nx=-nx;ny=-ny;nz=-nz}

 // 상자: 가운데 x,z / 바닥 y / 크기 / 자기 회전 ry

 gable(cx,y,cz,sx,h,sz,col,az){const hx=sx/2,hz=sz/2,P=(x,yy,z)=>az?this.T(cx+z,yy,cz+x):this.T(cx+x,yy,cz+z),ct=this.T(cx,y,cz);
  const a=P(-hx,y,-hz),b=P(hx,y,-hz),c=P(hx,y,hz),d=P(-hx,y,hz),r1=P(-hx,y+h,0),r2=P(hx,y+h,0);

  this.tri(c0,this.T(cx+Math.cos(a0)*r,y,cz+Math.sin(a0)*r),this.T(cx+Math.cos(a1)*r,y,cz+Math.sin(a1)*r),col,g,dn)}}
}

const YEARS_ALL=3009999; // 기원전 300만 년 ~ 9999년 (0년은 없음)
function rollYear(){let y=-3000000+Math.floor(Math.random()*YEARS_ALL);if(y>=0)y+=1;return y}
function eraOf(y){for(let i=0;i<ERAS.length;i++)if(y>=ERAS[i].from&&y<=ERAS[i].to)return i;return ERAS.length-1}
function rollLife(forceYear){
 R=Math.random;
 const y=forceYear!==undefined?forceYear:rollYear(),ei=eraOf(y),E=ERAS[ei];
 let lands=E.lands.filter(l=>y>=l[2]&&y<=l[3]);if(!lands.length)lands=E.lands;
 const l=pick(lands),o=l[10]||{};
 const fem=R()<.5,fam=R()<.3?0:R()<.72?1:2;
 const look=o.style==='future'?'future':l[5];
 const N={seed:Math.floor(Math.random()*1e9),era:ei,birthYear:y,year:y,country:l[0],now:l[1],climate:l[4],look,cul:l[6],
  cur:{n:CUR_PRE[l[7]]||l[7],pre:!!CUR_PRE[l[7]],man:!!o.man},w:l[8],r:l[9]||0,swap:o.swap||null,swapped:false,style:o.style||E.style,sp:o.sp||'호모 사피엔스',
  fem,fam,name:makeName(l[6],fem),age:0,money:0,mood:70,skill:[0,4,10][fam],job:null,home:{type:'parents'},fired:0,jobsHad:[],bought:[],pet:null,
  deathAge:0,adult:false,dead:false,h:10,log:[],parentsGone:false,stats:{tasks:0,years:0,earned:0}};
 N.deathAge=Math.max(E.adult+14,rint(E.life[0],E.life[1]));
 return N}
function W0(){return L.w*Math.pow(1+L.r,L.r?L.year-2020:0)*(L.swapped?L.swap[2]:1)} // 지금 보통 1년 벌이
function money(n){n=Math.max(0,Math.round(n));const c=L.cur;
 if(c.pre)return c.n+' '+fmtN(n);
 if(c.man&&n>=10000){const e=Math.floor(n/1e8),m=Math.floor(n%1e8/1e4);return(e?fmtN(e)+'억'+(m?' ':''):'')+(m?fmtN(m)+'만':'')+' '+c.n}
 return fmtN(n)+' '+c.n}
function housePrice(sz){return Math.round(W0()*[5,10,22][sz])}
function jobWage(i){return Math.round(W0()*ERAS[L.era].jobs[i][3])}

function spawnLife(){
 const st=L.style,wildish=st==='wild'||st==='stone';
 const nP=st==='wild'?11:st==='stone'?12:st==='neo'?13:16;
 for(let i=0;i<nP;i++){const fem=R()<.5,kid=R()<.18;const n={x:0,z:0,ry:R()*6.28,a:makeLook(fem),s:kid?rnd(.55,.7):rnd(.92,1.06),walk:R()*6,mv:0,path:[],wait:rnd(0,4),gray:!kid&&R()<.15,free:wildish};
  const p=wildish?randFree():randRoad();n.x=p[0];n.z=p[1];W.npcs.push(n)}
 for(const pen of W.pens)for(let i=0;i<pen.n;i++){const kind=pick(pen.kinds);const a={kind,x:pen.x+rnd(-pen.r,pen.r)*.6,z:pen.z+rnd(-pen.r,pen.r)*.6,ry:R()*6.28,walk:0,mv:0,pen,tx:null,wait:rnd(0,5),s:kind==='elephant'||kind==='mammoth'?rnd(.9,1.1):rnd(.85,1.1),graze:0};
  if(kind==='giraffe'||kind==='elephant')a.s*=pen.free?1:.6;W.anims.push(a)}
 const vk=st==='modern'?['car','car','car','bus','car','car']:st==='future'?['hover','hover','hover','hover','hover']:st==='space'?['rover','rover']:st==='industrial'?['carriage','carriage']:[];
 vk.forEach((k,i)=>{const alongX=i%2===0,dir=R()<.5?1:-1;W.cars.push({kind:k,alongX,dir,lane:dir*1.25,p:rnd(-48,48),t:0,c:hex(pick(['#e8e4dc','#c8402e','#3a6aa8','#2a2a2e','#f0c040','#7a8a94'])),v:k==='bus'?5:k==='carriage'?3.5:k==='rover'?4:8})})}
function randRoad(){const s=R()<.5?-1:1,t=rnd(-44,44),o=s*rnd(2.6,3.4);return R()<.5?[t,o]:[o,t]}
function randFree(){for(let k=0;k<20;k++){const x=rnd(-40,40),z=rnd(-40,40);if(!blocked(x,z,.6))return[x,z]}return[0,4]}
function blocked(x,z,r){for(const b of W.blocks)if(x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r)return true;for(const p of W.ponds)if(Math.hypot(x-p.x,z-p.z)<p.r+r)return true;return false}
// 원을 상자·물 밖으로 밀어내기
function pushOut(o,r){for(const b of W.blocks){if(o.x>b.x0-r&&o.x<b.x1+r&&o.z>b.z0-r&&o.z<b.z1+r){const dl=o.x-(b.x0-r),dr=(b.x1+r)-o.x,dt=o.z-(b.z0-r),db=(b.z1+r)-o.z,m=Math.min(dl,dr,dt,db);
  if(m===dl)o.x=b.x0-r;else if(m===dr)o.x=b.x1+r;else if(m===dt)o.z=b.z0-r;else o.z=b.z1+r}}
 for(const p of W.ponds){const dx=o.x-p.x,dz=o.z-p.z,d=Math.hypot(dx,dz),rr=p.r+r;if(d<rr&&d>.001){o.x=p.x+dx/d*rr;o.z=p.z+dz/d*rr}}
 o.x=clamp(o.x,-50,50);o.z=clamp(o.z,-50,50)}
function onRoad(x,z){return Math.abs(x)<4?'z':Math.abs(z)<4?'x':null}
function stepNPC(n,dt){
 if(n.wait>0){n.wait-=dt;n.mv=Math.max(0,n.mv-dt*3);return}
 if(!n.path.length){if(n.free){n.path.push(randFree())}else{const t=randRoad(),a=onRoad(n.x,n.z)||(Math.abs(n.x)<Math.abs(n.z)?'z':'x'),b=Math.abs(t[0])<4?'z':'x';
   if(a!==b){const cx=Math.sign(n.x||1)*3,cz=Math.sign(t[1]||1)*3;n.path.push(a==='x'?[Math.sign(t[0]||1)*3,Math.sign(n.z||1)*3]:[Math.sign(n.x||1)*3,Math.sign(t[1]||1)*3])}n.path.push(t)}}
 const t=n.path[0],dx=t[0]-n.x,dz=t[1]-n.z,d=Math.hypot(dx,dz);
 if(d<.3){n.path.shift();if(!n.path.length)n.wait=rnd(1.5,6);return}
 const sp=1.3*(n.s<.8?1.15:1);n.x+=dx/d*sp*dt;n.z+=dz/d*sp*dt;n.ry=Math.atan2(dx,dz);n.mv=Math.min(1,n.mv+dt*3);n.walk+=dt*sp*4.2;
 if(n.free){const ox=n.x,oz=n.z;pushOut(n,.35);if(Math.abs(ox-n.x)+Math.abs(oz-n.z)>.001&&R()<.02)n.path=[]}}
function stepAnimal(a,dt){
 if(a.wait>0){a.wait-=dt;a.mv=Math.max(0,a.mv-dt*2);a.graze=Math.min(1,a.graze+dt);return}
 a.graze=Math.max(0,a.graze-dt*2);
 if(!a.tx){const ang=R()*6.28,r=R()*a.pen.r;a.tx=[a.pen.x+Math.cos(ang)*r,a.pen.z+Math.sin(ang)*r]}
 const dx=a.tx[0]-a.x,dz=a.tx[1]-a.z,d=Math.hypot(dx,dz);if(d<.3){a.tx=null;a.wait=rnd(2,8);return}

  L.mood=clamp(L.mood-3,0,100)}
 else if(L.retired){pay=w0*.35*n}

 // 한 해씩 넘기기

function groundAt(sx,sy){if(!cam.vp)return null;const iv=invert(cam.vp),nx=sx/innerWidth*2-1,ny=1-sy/innerHeight*2;
 const a=M4.xf(iv,nx,ny,-1),b=M4.xf(iv,nx,ny,1);const p0=[a[0]/a[3],a[1]/a[3],a[2]/a[3]],p1=[b[0]/b[3],b[1]/b[3],b[2]/b[3]];
 const t=p0[1]/(p0[1]-p1[1]);if(!(t>0))return null;return[p0[0]+(p1[0]-p0[0])*t,p0[2]+(p1[2]-p0[2])*t]}
function invert(m){const o=new Float32Array(16),a=m;const b00=a[0]*a[5]-a[1]*a[4],b01=a[0]*a[6]-a[2]*a[4],b02=a[0]*a[7]-a[3]*a[4],b03=a[1]*a[6]-a[2]*a[5],b04=a[1]*a[7]-a[3]*a[5],b05=a[2]*a[7]-a[3]*a[6],

 let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!d)return o;d=1/d;
 o[0]=(a[5]*b11-a[6]*b10+a[7]*b09)*d;o[1]=(a[2]*b10-a[1]*b11-a[3]*b09)*d;o[2]=(a[13]*b05-a[14]*b04+a[15]*b03)*d;o[3]=(a[10]*b04-a[9]*b05-a[11]*b03)*d;
 o[4]=(a[6]*b08-a[4]*b11-a[7]*b07)*d;o[5]=(a[0]*b11-a[2]*b08+a[3]*b07)*d;o[6]=(a[14]*b02-a[12]*b05-a[15]*b01)*d;o[7]=(a[8]*b05-a[10]*b02+a[11]*b01)*d;
 o[8]=(a[4]*b10-a[5]*b08+a[7]*b06)*d;o[9]=(a[1]*b08-a[0]*b10-a[3]*b06)*d;o[10]=(a[12]*b04-a[13]*b02+a[15]*b00)*d;o[11]=(a[9]*b02-a[8]*b04-a[11]*b00)*d;
 o[12]=(a[5]*b07-a[4]*b09-a[6]*b06)*d;o[13]=(a[0]*b09-a[1]*b07+a[2]*b06)*d;o[14]=(a[13]*b01-a[12]*b03-a[14]*b00)*d;o[15]=(a[8]*b03-a[9]*b01+a[10]*b00)*d;return o}

function liveStep(dt){

 if(keys.KeyW||keys.ArrowUp)mz-=1;if(keys.KeyS||keys.ArrowDown)mz+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;

const ID=M4.id();
function render(time){
 const w=cv.clientWidth|0,h=cv.clientHeight|0,dpr=Math.min(devicePixelRatio||1,1.5);if(cv.width!==Math.floor(w*dpr)||cv.height!==Math.floor(h*dpr)){cv.width=Math.floor(w*dpr);cv.height=Math.floor(h*dpr)}
 if(!L||!W||!W.mesh)return;
 const lt=lighting();
 const cp=Math.cos(cam.pitch),eye=[cam.tx+Math.sin(cam.yaw)*cp*cam.dist,Math.sin(cam.pitch)*cam.dist,cam.tz+Math.cos(cam.yaw)*cp*cam.dist];cam.eye=eye;
 const proj=M4.persp(.85,cv.width/Math.max(1,cv.height),.5,600),view=M4.look(eye,[cam.tx,1,cam.tz],[0,1,0]),vp=M4.mul(proj,view);cam.vp=vp;
 buildDL(time);
 // 그림자
 const c=[Math.round(cam.tx/2)*2,0,Math.round(cam.tz/2)*2],S=Math.max(40,cam.dist*1.3);
 const lv=M4.look([c[0]+lt.sd[0]*90,lt.sd[1]*90,c[2]+lt.sd[2]*90],c,[0,1,0]),lp=M4.ortho(-S,S,-S,S,1,220),ltm=M4.mul(lp,lv);
 gl.bindFramebuffer(gl.FRAMEBUFFER,shFB);gl.viewport(0,0,SHN,SHN);gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
 gl.useProgram(PS.p);gl.uniformMatrix4fv(U(PS,'u_lt'),false,ltm);gl.uniformMatrix4fv(U(PS,'u_m'),false,ID);gl.bindVertexArray(W.mesh.vao);gl.drawArrays(gl.TRIANGLES,0,W.mesh.n);drawItems(PS,true);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);
 gl.clearColor(lt.hor[0],lt.hor[1],lt.hor[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 // 하늘
 gl.disable(gl.DEPTH_TEST);gl.useProgram(PK.p);gl.uniformMatrix4fv(U(PK,'u_ivp'),false,invert(M4.mul(proj,M4.look([0,0,0],[cam.tx-eye[0],1-eye[1],cam.tz-eye[2]],[0,1,0]))));
 gl.uniform3fv(U(PK,'u_sun'),lt.sd);gl.uniform3fv(U(PK,'u_top'),lt.top);gl.uniform3fv(U(PK,'u_hor'),lt.hor);gl.uniform3fv(U(PK,'u_sunC'),lt.sunC);
 gl.uniform1f(U(PK,'u_time'),time);gl.uniform1f(U(PK,'u_night'),lt.stars);gl.uniform1f(U(PK,'u_cloud'),L.climate==='moon'||L.climate==='ice'?0:L.weather==='rain'?1:.75);gl.uniform1f(U(PK,'u_planet'),CLIMATE[L.climate].planet||0);
 gl.bindVertexArray(skyVao);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.enable(gl.DEPTH_TEST);
 // 땅·건물·사람
 const P=PM;gl.useProgram(P.p);gl.uniformMatrix4fv(U(P,'u_vp'),false,vp);gl.uniformMatrix4fv(U(P,'u_lt'),false,ltm);
 gl.uniform3fv(U(P,'u_sun'),lt.sd);gl.uniform3fv(U(P,'u_sunC'),lt.sunC);gl.uniform3fv(U(P,'u_amb0'),lt.amb0);gl.uniform3fv(U(P,'u_amb1'),lt.amb1);
 gl.uniform3fv(U(P,'u_eye'),eye);gl.uniform3fv(U(P,'u_fog'),lt.hor);gl.uniform1f(U(P,'u_fogD'),lt.fogD);gl.uniform1f(U(P,'u_night'),lt.night);gl.uniform1f(U(P,'u_time'),time);
 gl.uniform1f(U(P,'u_shTex'),SHN);gl.uniform1f(U(P,'u_alpha'),1);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,shTex);gl.uniform1i(U(P,'u_sh'),0);
 gl.uniformMatrix4fv(U(P,'u_m'),false,ID);gl.uniform3fv(U(P,'u_tint'),[1,1,1]);gl.uniform1f(U(P,'u_emit'),0);gl.uniform1f(U(P,'u_water'),0);
 gl.bindVertexArray(W.mesh.vao);gl.drawArrays(gl.TRIANGLES,0,W.mesh.n);
 gl.uniform1f(U(P,'u_water'),1);gl.bindVertexArray(W.water.vao);gl.drawArrays(gl.TRIANGLES,0,W.water.n);gl.uniform1f(U(P,'u_water'),0);
 drawItems(P,false,0,DL.length,DL.pf,DL.pt);
 if(DL.pt>DL.pf){gl.depthFunc(gl.GREATER);gl.depthMask(false);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.uniform1f(U(P,'u_alpha'),.5);gl.uniform1f(U(P,'u_emit'),.9);gl.uniform3fv(U(P,'u_tint'),[.55,.8,1]);
  let cur=null;for(let i=DL.pf;i<DL.pt;i++){const it=DL[i];if(it.mesh!==cur){cur=it.mesh;gl.bindVertexArray(cur.vao)}gl.uniformMatrix4fv(U(P,'u_m'),false,it.m);gl.drawArrays(gl.TRIANGLES,0,cur.n)}
  gl.depthFunc(gl.LESS);gl.depthMask(true);gl.disable(gl.BLEND);gl.uniform1f(U(P,'u_alpha'),1);drawItems(P,false,DL.pf,DL.pt)}
 gl.bindTexture(gl.TEXTURE_2D,null);
 drawLabels(vp)}

// ================= 이름표·위쪽 정보 =================
const LBP=[];
function labelFor(lot){const E=E_(),r=lot.role;
 if(r==='board')return[E.board,''];if(r==='shop')return[E.shop,''];if(r==='study')return[E.study,''];
 if(r==='rent')return L.home.type==='rent'&&L.adult?['내 집 · '+E.rentName,'mine']:[E.rentName,''];
 if(r==='parents')return[L.parentsGone?'부모님이 살던 집':'부모님 집',!L.adult?'mine':''];
 if(r.startsWith('sale:')){const sz=+r[5];return L.home.type==='own'&&L.home.size===sz?['내 집 · '+E.houses[sz],'mine']:['판매 중 · '+E.houses[sz]+' · '+money(housePrice(sz)),'sale']}
 if(r.startsWith('work:')){const i=lot.job;return L.job&&L.job.i===i?['내 일터 · '+jobName(i),'work']:[jobName(i),'work']}
 return null}
function drawLabels(vp){let k=0;const hh=L.h%24,workTime=L.job&&L.h<24&&hh>=9&&hh<18;
 for(const lot of W.lots){const lb=labelFor(lot);if(!lb)continue;const p=M4.xf(vp,lot.top[0],lot.top[1],lot.top[2]);
  if(p[3]<=0)continue;const x=(p[0]/p[3]*.5+.5)*innerWidth,y=(1-(p[1]/p[3]*.5+.5))*innerHeight;if(x<-80||x>innerWidth+80||y<-20||y>innerHeight+20)continue;
  const dist=Math.hypot(lot.top[0]-cam.tx,lot.top[2]-cam.tz);if(dist>cam.dist*1.9+10&&!lb[1])continue;
  let el=LBP[k];if(!el){el=document.createElement('div');el.className='lb';$('#labels').appendChild(el);LBP.push(el);el.onclick=()=>{if(MODE==='live'&&!modalOpen&&el._lot)PL.tgt=el._lot.door.slice()}}
  el._lot=lot;el.style.display='block';el.style.left=x+'px';el.style.top=y+'px';if(el._t!==lb[0]){el.textContent=lb[0];el._t=lb[0]}
  const go=(workTime&&lot.role==='work:'+L.job.i&&!PL.working)||(hh>=21||L.h>=24)&&lot===homeLot()&&L.adult;
  el.className='lb'+(lb[1]?' '+lb[1]:'')+(go?' go':'');el.style.opacity=clamp(1.4-dist/(cam.dist*2+20),.35,1);k++}
 for(;k<LBP.length;k++)LBP[k].style.display='none'}
let hudT=0;
function hud(dt){hudT-=dt;
 if(L&&toastT<=0){const a=nearAction(),hn=$('#hint');if(a){hn.innerHTML='<kbd>E</kbd>'+a.t;hn.style.display='block'}else if(PL.busy){hn.textContent=PL.busy.kind==='sit'?'쉬는 중':PL.busy.kind==='study'?'배우는 중':'자는 중';hn.style.display='block'}else hn.style.display='none'}
 if(hudT>0||!L)return;hudT=.2;const E=E_();
 $('#tName').textContent=L.name;$('#tPlace').textContent=placeStr()+' · '+L.sp;
 $('#tYear').textContent=yearStr(L.year);$('#tAge').textContent=L.age+'살';$('#tMoney').textContent=money(L.money);
 $('#tJob').textContent=!L.adult?'어린이':L.job?jobName(L.job.i):L.retired?'은퇴':'없음';$('#tHome').textContent=L.adult?homeName():'부모님 집';
 $('#tMood').style.width=L.mood+'%';$('#tSkill').style.width=L.skill+'%';
 $('#tClock').textContent=MODE==='child'?'자라는 중':clockStr(L.h);$('#tPhase').textContent=E.name+' · '+(MODE==='child'?'어린 시절':phaseOf(L.h))+(L.weather==='rain'?' · 비':L.weather==='snow'?' · 눈':'');
 const wb=$('#workbar');
 if(MODE==='live'&&L.job){const hh=L.h%24,wt=L.h<24&&hh>=9&&hh<18,wk=L.wk||{in:0,all:0,tasks:0},att=wk.all>0?Math.round(wk.in/wk.all*100):0;
  wb.style.display='block';wb.innerHTML=`<b>${jobName(L.job.i)}</b> · 1년 벌이 ${money(L.job.wage)}<br>${wt?(PL.working?'일하는 중 · 반짝이는 곳으로 가면 일을 해냅니다':'일하러 갈 시간입니다'):'오늘 일한 비율'} ${att}% · 해낸 일 ${wk.tasks}`+(L.job.strikes?'<br><span style="color:#f0b9a0">경고 1번 받음</span>':'')}
 else if(MODE==='live'&&!L.job&&!L.retired){wb.style.display='block';wb.innerHTML='일이 없습니다. '+E.board+'에서 일을 구하세요.'}else wb.style.display='none'}

// ================= 저장 =================
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({L,past,px:PL.x,pz:PL.z}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s)return null;past=s.past||[];return s}catch(e){return null}}
setInterval(()=>{if(L&&!L.dead&&MODE==='live')save()},8000);
addEventListener('beforeunload',()=>{if(L&&!L.dead)save()});

// ================= 시작 =================
let last=performance.now();
function loop(now){requestAnimationFrame(loop);
 try{const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render(now/1000);hud(dt)}catch(e){console.error(e);if(!loop.err){loop.err=1;toast('오류: '+e.message)}}}
function boot(){const s=load();
 if(s&&s.L&&!s.L.dead){L=s.L;genTown();R=Math.random;R=mulberry(L.seed+7);PL.look=makeLook(L.fem);R=Math.random;
  if(!L.parentsGone){const pl=lotByRole('parents');R=mulberry(L.seed+11);for(let i=0;i<2;i++)W.npcs.push({x:pl.door[0]+(i?1.2:-1.2),z:pl.door[1]+.6,ry:0,a:makeLook(i===1),s:1,walk:0,mv:0,path:[],wait:9999,parent:1});R=Math.random}
  PL.x=s.px||0;PL.z=s.pz||0;if(L.adult){L.h=Math.min(L.h,17);MODE='live'}else MODE='child';pet.x=PL.x;pet.z=PL.z;cam.tx=PL.x;cam.tz=PL.z;renderLog()}
 else startLife(rollLife());
 requestAnimationFrame(loop)}
window.dbg={get L(){return L},get W(){return W},PL,cam,born:y=>{closeModal();startLife(rollLife(y))},years:n=>{for(let i=0;i<n;i++)endYear()},
 setH:h=>{L.h=h},adult:()=>{closeModal();MODE='child';while(!L.adult)endYear();closeModal()},frame:()=>render(performance.now()/1000),shot:()=>{render(performance.now()/1000);return fetch('/shot',{method:'POST',body:cv.toDataURL('image/png')})}};
boot();

</script>
