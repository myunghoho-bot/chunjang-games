<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>랜덤 인생 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:'Malgun Gothic','맑은 고딕',sans-serif;color:#e8edf2;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
.panel{background:rgba(16,20,26,.78);border:1px solid rgba(255,255,255,.09);border-radius:10px;backdrop-filter:blur(6px)}
#top{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:10px;align-items:stretch;pointer-events:none}
#top>div{pointer-events:auto}
.who{padding:8px 14px;min-width:180px;max-width:300px;flex:0 1 auto}
.who b{display:block;font-size:17px;letter-spacing:-.3px}
.who span{display:block;font-size:12px;color:#9fb0c0;margin-top:2px;line-height:1.35}
.stats{display:flex;gap:0;padding:6px 6px;flex:1;flex-wrap:nowrap;align-items:center;overflow:hidden}
.st{padding:2px 9px;border-right:1px solid rgba(255,255,255,.07);flex:0 0 auto}
.st:last-child{border-right:0}
.st i{display:block;font-style:normal;font-size:11px;color:#8c9aab}
.st b{font-size:14px;white-space:nowrap}
.bar{display:block;width:60px;height:7px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px;background:#7cc6a4;transition:width .4s}
#tSkill{background:#7fa8e0}
.clock{padding:6px 12px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:190px}
.clock b{font-size:16px}
.clock>span{font-size:12px;color:#9fb0c0}
.row{display:flex;gap:4px}
button{font-family:inherit;font-size:12px;color:#dfe7ee;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{background:rgba(255,255,255,.16)}
button.on{background:#3d6f8f;border-color:#5b93b8;color:#fff}
button:disabled{opacity:.4;cursor:default}
#log{position:fixed;left:10px;bottom:10px;width:330px;max-height:34vh;overflow:hidden;padding:8px 12px;font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;justify-content:flex-end}
#log div{color:#c9d3dc;border-bottom:1px solid rgba(255,255,255,.05);padding:2px 0}
#log div em{font-style:normal;color:#8c9aab;margin-right:6px;font-size:11px}
#log div.good{color:#a9e3c4}
#log div.bad{color:#f0b9a0}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 16px;font-size:14px;display:none;white-space:nowrap;cursor:pointer}
#hint kbd{display:inline-block;background:#e8edf2;color:#111;border-radius:4px;padding:0 6px;margin-right:6px;font-family:inherit;font-weight:bold}
#workbar{position:fixed;right:10px;bottom:10px;padding:8px 12px;font-size:12.5px;min-width:220px;display:none;line-height:1.55}
#workbar .bar{width:100%}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);font-size:12px;padding:2px 8px;border-radius:5px;background:rgba(16,20,26,.72);color:#e8edf2;white-space:nowrap;pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.1)}
.lb.mine{background:rgba(48,92,70,.85);border-color:#7cc6a4}
.lb.work{background:rgba(52,78,120,.85);border-color:#7fa8e0}
.lb.sale{background:rgba(110,80,36,.85);border-color:#d9aa5c}
.lb.go{box-shadow:0 0 0 2px #ffd36b}
#modal{position:fixed;inset:0;background:rgba(5,8,12,.45);display:flex;align-items:center;justify-content:center;z-index:20}
#modal.hide{display:none}
.card{width:min(560px,92vw);max-height:86vh;overflow:auto;padding:20px 22px;background:rgba(20,25,32,.96);border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h2{font-size:19px;margin-bottom:4px;letter-spacing:-.3px}
.card .sub{font-size:12.5px;color:#9fb0c0;margin-bottom:14px;line-height:1.5}
.card p{font-size:14px;line-height:1.65;color:#d5dde5;margin:6px 0}
.card table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.card td,.card th{padding:6px 6px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
.card th{color:#8c9aab;font-weight:normal;font-size:12px}
.card .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.card .acts button{font-size:14px;padding:6px 16px}
.card .acts button.pri{background:#3d6f8f;border-color:#5b93b8;color:#fff}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;margin:10px 0}
.kv i{font-style:normal;color:#8c9aab}
.flag{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#fade{position:fixed;inset:0;background:#f4efe6;opacity:0;pointer-events:none;transition:opacity 2.2s;z-index:15}
#bar2{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="top">
 <div class="who panel"><b id="tName">-</b><span id="tPlace">-</span></div>
 <div class="stats panel">
  <div class="st"><i>연도</i><b id="tYear">-</b></div>
  <div class="st"><i>나이</i><b id="tAge">-</b></div>
  <div class="st"><i>돈</i><b id="tMoney">-</b></div>
  <div class="st"><i>직업</i><b id="tJob">-</b></div>
  <div class="st"><i>사는 곳</i><b id="tHome">-</b></div>
  <div class="st"><i>기분</i><span class="bar"><span id="tMood"></span></span></div>
  <div class="st"><i>실력</i><span class="bar"><span id="tSkill"></span></span></div>
 </div>
 <div class="clock panel">
  <b id="tClock">-</b><span id="tPhase">-</span>
  <div class="row" id="spd"><button data-s="1" class="on">1배</button><button data-s="2">2배</button><button data-s="4">4배</button></div>
  <div class="row"><button id="bPast">지나간 인생</button><button id="bHelp">도움말</button></div>
 </div>
</div>
<div id="workbar" class="panel"></div>
<div id="log" class="panel"></div>
<div id="hint" class="panel"></div>
<div id="modal" class="hide"><div class="card" id="mcard"></div></div>
<div id="fade"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const SAVE_KEY='randomlife3d_v1';

// ================= 기본 도구 =================
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random; // 지금 쓰는 랜덤 (마을 만들 때는 씨앗 랜덤으로 바꿈)
const rnd=(a,b)=>a+(b-a)*R();
const rint=(a,b)=>Math.floor(a+(b-a+1)*R());
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fmtN=n=>Math.round(n).toLocaleString('ko-KR');
function yearStr(y){if(y<0)return '기원전 '+(y<-9999?'약 ':'')+fmtN(-y)+'년';return y+'년'}
function addYear(y,n){let r=y+n;if(y<0&&r>=0)r+=1;return r} // 0년은 없음
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
function jit(c,k){const f=1+(R()-.5)*k;return[c[0]*f,c[1]*f,c[2]*f]}
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+a;return w+((c-0xAC00)%28?a:b)} // 받침 있으면 a
const eun=w=>josa(w,'은','는'),iga=w=>josa(w,'이','가'),eul=w=>josa(w,'을','를'),ro=w=>{const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+'로';const j=(c-0xAC00)%28;return w+(j&&j!==8?'으로':'로')};

// 4x4 행렬 (열 우선)
const M4={
 id(){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;return o},
 persp(f,a,n,fa){const t=1/Math.tan(f/2),r=new Float32Array(16);r[0]=t/a;r[5]=t;r[10]=(fa+n)/(n-fa);r[11]=-1;r[14]=2*fa*n/(n-fa);return r},
 ortho(l,r,b,t,n,f){const o=new Float32Array(16);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o},
 look(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx,o=new Float32Array(16);
  o[0]=xx;o[1]=yx;o[2]=zx;o[4]=xy;o[5]=yy;o[6]=zy;o[8]=xz;o[9]=yz;o[10]=zz;
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);o[15]=1;return o},
 mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o},
 // 위치·Y회전·크기 한 번에
 trs(x,y,z,ry,sx,sy,sz){const c=Math.cos(ry),s=Math.sin(ry),o=new Float32Array(16);
  o[0]=c*sx;o[2]=-s*sx;o[5]=sy;o[8]=s*sz;o[10]=c*sz;o[12]=x;o[13]=y;o[14]=z;o[15]=1;return o},
 tr(x,y,z){const o=M4.id();o[12]=x;o[13]=y;o[14]=z;return o},
 rx(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o},
 rz(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o},
 sc(x,y,z){const o=M4.id();o[0]=x;o[5]=y;o[10]=z;return o},
 xf(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14],m[3]*x+m[7]*y+m[11]*z+m[15]]}
};

function startLife(N){L=N;genTown();R=Math.random;
 const pl=lotByRole('parents');PL.x=pl.door[0];PL.z=pl.door[1];PL.ry=0;PL.tgt=null;PL.busy=null;PL.sit=0;
 R=mulberry(L.seed+7);PL.look=makeLook(L.fem);R=Math.random;
 // 부모님 두 분
 R=mulberry(L.seed+11);for(let i=0;i<2;i++){const n={x:pl.door[0]+(i?1.2:-1.2),z:pl.door[1]+.6,ry:0,a:makeLook(i===1),s:1,walk:0,mv:0,path:[],wait:9999,parent:1,home:pl.door};W.npcs.push(n)}R=Math.random;
 cam.tx=PL.x;cam.tz=PL.z;$('#fade').style.opacity=0;
 MODE='birth';showBirth()}
function beAdult(){L.adult=true;L.home={type:'rent'};L.ypd=lifeYPD();const r=lotByRole('rent');PL.x=r.door[0];PL.z=r.door[1];
 L.money=Math.round(W0()*[.15,.5,1.6][L.fam]);MODE='live';L.h=8;
 addLog('어른이 되었습니다. '+eul(E_().rentName)+' 얻어 혼자 살기 시작했습니다.','good');save();showAdult()}

// 1년이 끝남 (다음 날 아침)
function swapCheck(){if(L.swap&&!L.swapped&&L.year>=L.swap[0]){const f=L.swap[2];L.swapped=true;L.money*=f;if(L.job)L.job.wage=Math.round(L.job.wage*f);L.cur.n=L.swap[1];if(L.adult)addLog('나라의 돈이 '+ro(L.swap[1])+' 바뀌었습니다.')}}
// 하루가 끝남. 어린 시절은 1년씩, 어른은 하루에 L.ypd년씩 훌쩍 지나간다 (한 인생 = 하루 6번 ≈ 1시간)
function endYear(){
 const E=E_(),st=L.style;L.h=6;
 if(!L.adult){L.age++;L.year=addYear(L.year,1);L.stats.years++;swapCheck();
  if(L.age===1)addLog('걸음마를 시작했습니다.');if(L.age===Math.floor(E.adult*.45))addLog(E.grow[0]+'.');if(L.age===Math.floor(E.adult*.8))addLog(E.grow[1]+'.');
  if(L.age>=E.adult)beAdult();return}
 if(!L.ypd)L.ypd=lifeYPD();
 const n=Math.max(1,Math.min(L.ypd,L.deathAge-L.age)),w0=W0();let pay=0,cost=0;
 // 오늘 하루 일한 것이 n년 치 일이 된다
 if(L.job){const j=L.job,wk=L.wk||{in:0,all:1,tasks:0},att=wk.all>0?wk.in/wk.all:0;
  pay=(j.wage*clamp(att*1.15,0,1)+Math.min(wk.tasks,40)*j.wage*.01)*n;const perf=att*80+Math.min(wk.tasks,20);j.days=(j.days||0)+1;j.years+=n;
  L.skill=Math.min(100,L.skill+n+Math.min(wk.tasks,30)*.12);
  if(perf<30){j.strikes=(j.strikes||0)+1;if(j.strikes>=2){fire('일을 너무 자주 빠져서 해고되었습니다.')}else addLog('일을 자주 빠졌습니다. 한 번 더 그러면 해고될 수 있습니다.','bad')}
  else{j.strikes=0;if(perf>=80){j.good=(j.good||0)+1;if(j.good>=2){j.good=0;j.wage=Math.round(j.wage*1.2);addLog('일을 잘해서 '+(st==='wild'||st==='stone'?'무리에서 더 많은 몫을 받게':'월급이 올랐')+'습니다.','good')}}
   if(L.job&&j.days>=1&&Math.random()<.12)fire(st==='wild'||st==='stone'||st==='neo'?'무리에서 그 일을 다른 이에게 맡겼습니다. (해고)':st==='future'||st==='space'?'일이 기계로 바뀌어서 해고되었습니다.':st==='industrial'||st==='modern'?'회사가 어려워져서 해고되었습니다.':'주인이 이제 일을 그만 나오라고 했습니다. (해고)')}
  L.mood=clamp(L.mood-3,0,100)}
 else if(L.retired){pay=w0*.35*n}
 cost=(w0*(L.job?.35:.22)+(L.home.type==='rent'?w0*E.rent:0))*n;
 L.money+=pay-cost;L.stats.earned+=pay;
 if(L.money<0){L.money=0;addLog(st==='wild'||st==='stone'?'먹을 것이 모자라 무리가 나눠 주었습니다.':'돈이 모자라 이웃이 도와주었습니다.')}
 if(pay>0)addLog(`${n}년 동안 ${eul(money(pay))} 벌고 ${eul(money(cost))} 썼습니다.`);
 // 한 해씩 넘기기
 for(let k=0;k<n;k++){L.age++;L.year=addYear(L.year,1);L.stats.years++;if(L.r&&L.job)L.job.wage=Math.round(L.job.wage*(1+L.r));swapCheck();
  if(!L.pet&&Math.random()<(st==='wild'||st==='stone'?.08:.04)){const early=st==='wild'||st==='stone',kind=early?(Math.random()<.5?'cat':'wolf'):st==='space'||st==='future'?'dog':(Math.random()<.35?'wolf':'dog');
   L.pet={kind,hunt:early,c:kind==='wolf'?hex(pick(['#8a8a88','#6a6460','#a8a29a'])):kind==='cat'?hex(pick(['#c8a070','#a08a6a','#d8b080'])):hex(pick(['#d8a060','#3a3a3a','#f0ece4','#8a6a4a','#c8c0b0']))};
   const nm={cat:'고양이',wolf:'늑대',dog:'강아지'}[kind];addLog(early?nm+'가 따라오기 시작했습니다. 이제 사냥 파트너입니다. 일할 때 반짝이는 곳을 같이 찾아 줍니다.':nm+' 한 마리가 따라와서 같이 살게 되었습니다.','good');pet.x=PL.x;pet.z=PL.z}
  if(!L.parentsGone&&L.age>=(L.parentsAge||(L.parentsAge=rint(48,62)))){L.parentsGone=true;W.npcs=W.npcs.filter(q=>!q.parent);addLog('부모님이 편안히 눈을 감으셨습니다.')}}
 if(L.home.type==='own')L.mood=clamp(L.mood+4,0,100);if(L.pet)L.mood=clamp(L.mood+3,0,100);
 if(Math.random()<.6)healEvent();
 L.wk={in:0,all:0,tasks:0};W.tasks=[];
 const cw=L.climate;L.weather=(cw==='snow'&&Math.random()<.35)?'snow':(['green','tropic','savanna'].includes(cw)&&Math.random()<.15)?'rain':'clear';drops.length=0;
 if(L.age>=L.deathAge){save();die();return}
 addLog(`${n}년이 흘렀습니다. ${yearStr(L.year)}, ${L.age}살의 하루가 시작됩니다.`);
 if(L.age+L.ypd>=L.deathAge)addLog('몸이 예전 같지 않습니다. 오늘이 마지막 하루일지도 모릅니다.');
 save()}
function lifeYPD(){return Math.max(1,Math.round((L.deathAge-L.age)/6))}
function fire(why){if(!L.job)return;addLog(why,'bad');L.fired++;L.job=null}
function healEvent(){const st=L.style;
 const A=st==='wild'?['무리의 아이들과 나무 그늘에서 쉬었습니다.','강가에서 시원한 물을 마셨습니다.','노을이 아주 예뻤습니다.','친구가 털을 골라 주었습니다.','멀리서 코끼리 떼가 지나가는 걸 보았습니다.']
  :st==='stone'?['밤하늘의 별을 오래 보았습니다.','모닥불 앞에서 옛이야기를 들었습니다.','처음 보는 꽃을 찾았습니다.']
  :st==='space'?['창밖으로 지구가 반짝이는 걸 보았습니다.','돔 정원에서 꽃이 피었습니다.','친구와 별 이야기를 했습니다.']
  :['이웃이 음식을 나눠 주었습니다.','오랜 친구를 만났습니다.','비 오는 소리를 들으며 푹 잤습니다.','동네 아이들이 인사를 했습니다.','좋아하는 노래를 찾았습니다.'];
 addLog(pick(A),'good');L.mood=clamp(L.mood+6,0,100);if(st!=='wild'&&st!=='stone'&&Math.random()<.25){const g=W0()*.04;L.money+=g;addLog('길에서 '+eul(money(g))+' 주웠습니다.','good')}}
function die(){MODE='dead';PL.busy=null;const age=L.age;$('#fade').style.opacity=.85;
 const where=homeLot()===lotByRole('parents')?'부모님 집':homeName();
 addLog(`${age}살에 ${where}에서 편안히 눈을 감았습니다.`);
 const rec={name:L.name,fem:L.fem,birth:L.birthYear,death:L.year,age,country:L.country,now:L.now,era:ERAS[L.era].name,sp:L.sp,jobs:L.jobsHad.slice(),fired:L.fired,bought:L.bought.map(i=>ERAS[L.era].houses[i]),money:money(L.money),pet:L.pet?L.pet.kind:null};
 past.unshift(rec);if(past.length>60)past.pop();L.dead=true;save();setTimeout(()=>showDeath(rec),2300)}

// 할 수 있는 일 (문 앞에서 E)
function nearAction(){
 if(MODE!=='live'||PL.busy)return null;const E=E_();let best=null,bd=2.4;
 for(const lot of W.lots){const d=Math.hypot(PL.x-lot.door[0],PL.z-lot.door[1]);if(d>=bd)continue;const r=lot.role;let a=null;
  if(r==='board')a={t:E.board+' 보기',f:openBoard};
  else if(r==='shop')a={t:E.shop+' 들어가기',f:openShop};
  else if(r==='study')a={t:E.study+'에서 배우기',f:doStudy};
  else if(r==='rent'&&L.home.type==='rent')a={t:'잠자기 (다음 날로)',f:doSleep};
  else if(r==='parents'&&!L.parentsGone)a={t:'부모님 뵙기',f:visitParents};
  else if(r.startsWith('sale:')){const sz=+r[5];a=L.home.type==='own'&&L.home.size===sz?{t:'잠자기 (다음 날로)',f:doSleep}:{t:E.houses[sz]+' 보기',f:()=>openHouse(sz)}}
  else if(r.startsWith('work:')){const i=lot.job;if(!(L.job&&L.job.i===i))a={t:jobName(i)+' 일터 보기',f:()=>openWork(i)}}
  if(a){best=a;bd=d}}
 for(const b of W.benches){const d=Math.hypot(PL.x-b.x,PL.z-b.z);if(d<bd){bd=d;best={t:(L.style==='wild'||L.style==='stone'||L.style==='neo'?'바위에 앉아 쉬기':'앉아서 쉬기'),f:()=>doSit(b)}}}
 return best}
function busy(kind,hours,mul,done){PL.busy={kind,left:hours,mul,done};PL.tgt=null}
function doSit(b){PL.x=b.x;PL.z=b.z;PL.ry=Math.atan2(27-b.x,27-b.z);PL.sit=1;busy('sit',2,4,()=>{PL.sit=0;L.mood=clamp(L.mood+9,0,100);addLog(pick(['물가에 앉아 바람을 느꼈습니다.','한참 동안 하늘을 보며 쉬었습니다.','조용히 앉아 물소리를 들었습니다.']),'good')})}
function doStudy(){const h=L.h%24;if(h>=22||h<6){toast('밤에는 배울 수 없습니다.');return}if(L.job&&h>=9&&h<18){toast('일하는 시간에는 배울 수 없습니다.');return}
 if(L.studiedDay===L.year){toast('오늘은 이미 배웠습니다. 내일 다시 오세요.');return}
 PL.act=1;busy('study',3,4,()=>{PL.act=0;L.studiedDay=L.year;const g=rnd(4,6);L.skill=Math.min(100,L.skill+g);addLog(E_().study+'에서 배웠습니다. 실력 +'+Math.round(g),'good')})}
function doSleep(){const h=L.h%24;if(h>=6&&h<17){toast('아직 낮입니다. 저녁부터 잘 수 있습니다.');return}busy('sleep',99,14,null);addLog('푹 잤습니다.');L.mood=clamp(L.mood+3,0,100)}
function visitParents(){if(L.visitDay===L.year){toast('오늘은 이미 다녀왔습니다.');return}L.visitDay=L.year;L.mood=clamp(L.mood+6,0,100);addLog(pick(['부모님과 저녁을 먹었습니다.','부모님이 어릴 적 이야기를 해 주셨습니다.','부모님 집 마당에서 쉬었습니다.']),'good')}
let toastT=0;function toast(t){const h=$('#hint');h.textContent=t;h.style.display='block';toastT=2.2}

// ================= 창(모달) =================
let modalOpen=false;
function openModal(html,bind){$('#mcard').innerHTML=html;$('#modal').classList.remove('hide');modalOpen=true;if(bind)bind($('#mcard'))}
function closeModal(){$('#modal').classList.add('hide');modalOpen=false}
const wildish=()=>L.style==='wild'||L.style==='stone'||L.style==='neo';
function placeStr(){return L.country+(L.now?' ('+L.now+')':'')}
function showBirth(){const E=E_();
 openModal(`<h2>${L.name} 태어남</h2><div class="sub">${yearStr(L.birthYear)} · ${E.name}</div>
 <div class="kv"><i>태어난 곳</i><span>${placeStr()}</span><i>사람 종류</i><span>${L.sp}</span><i>성별</i><span>${L.fem?'여자':'남자'}</span>
 <i>집안 형편</i><span>${['가난한 집','보통 집','넉넉한 집'][L.fam]}</span><i>나라의 돈</i><span>${L.cur.n}</span>
 <i>이 해에 태어날 확률</i><span>${fmtN(YEARS_ALL)}분의 1</span></div>
 <p>태어날 시대와 곳은 고를 수 없습니다. 기원전 300만 년부터 9999년까지 모든 해가 같은 확률로 정해집니다.</p>
 <div class="acts"><button class="pri" id="mGo">살아 보기</button></div>`,c=>c.querySelector('#mGo').onclick=()=>{closeModal();MODE='child';addLog(placeStr()+'에서 태어났습니다.')})}
function showAdult(){const E=E_();
 openModal(`<h2>어른이 되었습니다</h2><div class="sub">${L.age}살 · ${yearStr(L.year)}</div>
 <p>이제 직접 움직일 수 있습니다. 가진 것: ${money(L.money)}</p>
 <table><tr><th>할 일</th><th>방법</th></tr>
 <tr><td>일 구하기</td><td>${E.board}에서 고릅니다</td></tr>
 <tr><td>일하기</td><td>일하는 시간(오전 9시~오후 6시)에 일터 마당 안에 있으면 됩니다. 반짝이는 곳에 가면 일을 더 해냅니다</td></tr>
 <tr><td>쉬기</td><td>${E.shop}, ${E.study}, 물가 쉼터</td></tr>
 <tr><td>집 사기</td><td>'판매 중' 집 앞에서 E</td></tr>
 <tr><td>잠자기</td><td>저녁에 내 집 앞에서 E → 다음 해</td></tr></table>
 <p>하루는 10분입니다. 하루가 끝나면 ${L.ypd}년이 훌쩍 지나가고, 한 인생은 하루 6번(약 1시간)입니다. 일을 너무 자주 빠지면 해고됩니다.</p>
 <div class="acts"><button class="pri" id="mGo">시작</button></div>`,c=>c.querySelector('#mGo').onclick=closeModal)}
function canJob(i){const j=E_().jobs[i];if(j[5]&&L.year<j[5])return'아직 없는 일';if(L.skill<j[4])return'실력 '+j[4]+' 필요';if(L.age>=Math.min(78,L.deathAge))return'나이가 많음';return''}
function takeJob(i){const j=E_().jobs[i];L.job={i,wage:jobWage(i),years:0,strikes:0,good:0};L.retired=false;if(!L.jobsHad.includes(j[0]))L.jobsHad.push(j[0]);
 addLog(j[0]+' 일을 시작했습니다. 1년 벌이 '+money(L.job.wage)+'.','good');save()}
function openBoard(){const E=E_();
 const rows=E.jobs.map((j,i)=>{if(!lotByRole('work:'+i))return'';const why=canJob(i),mine=L.job&&L.job.i===i;
  return`<tr><td>${j[0]}</td><td>${money(jobWage(i))}</td><td>${j[4]}</td><td>${mine?'지금 하는 일':why?`<span style="color:#8c9aab">${why}</span>`:`<button data-j="${i}">${L.job?'바꾸기':'하기'}</button>`}</td></tr>`}).join('');
 const oldOk=(L.style==='modern'||L.style==='future'||L.style==='space')&&L.age>=60;
 openModal(`<h2>${E.board}</h2><div class="sub">지금 실력 ${Math.round(L.skill)} · 실력은 ${E.study}에서 배우거나 일하면 오릅니다</div>
 <table><tr><th>일</th><th>1년 벌이</th><th>필요한 실력</th><th></th></tr>${rows}</table>
 <div class="acts">${L.job?'<button id="mQuit">일 그만두기</button>':''}${oldOk&&!L.retired?'<button id="mRet">은퇴하기</button>':''}<button class="pri" id="mX">닫기</button></div>`,c=>{
  c.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{takeJob(+b.dataset.j);closeModal()});
  const q=c.querySelector('#mQuit');if(q)q.onclick=()=>{addLog(jobName(L.job.i)+' 일을 그만두었습니다.');L.job=null;closeModal()};
  const r=c.querySelector('#mRet');if(r)r.onclick=()=>{L.job=null;L.retired=true;addLog('은퇴했습니다. 이제 연금을 받으며 쉽니다.','good');closeModal()};
  c.querySelector('#mX').onclick=closeModal})}
function openWork(i){const j=E_().jobs[i],why=canJob(i);
 openModal(`<h2>${j[0]}</h2><div class="sub">1년 벌이 ${money(jobWage(i))} · 필요한 실력 ${j[4]}</div><p>일하는 시간에 이 마당 안에 있으면 일을 합니다.</p>
 <div class="acts">${why?`<span style="color:#8c9aab;font-size:13px;align-self:center">${why}</span>`:`<button class="pri" id="mT">${L.job?'이 일로 바꾸기':'이 일 하기'}</button>`}<button id="mX">닫기</button></div>`,c=>{
  const t=c.querySelector('#mT');if(t)t.onclick=()=>{takeJob(i);closeModal()};c.querySelector('#mX').onclick=closeModal})}
function openShop(){const E=E_();
 const items=E.items.map(it=>[it[0]==='FOOD'?(MODERN_FOOD[L.cul]||'따뜻한 밥'):it[0],Math.max(1,Math.round(W0()*it[1])),it[2]]);
 openModal(`<h2>${E.shop}</h2><div class="sub">가진 돈 ${money(L.money)} · 기분 ${Math.round(L.mood)}</div>
 <table><tr><th>것</th><th>값</th><th>기분</th><th></th></tr>${items.map((it,i)=>`<tr><td>${it[0]}</td><td>${money(it[1])}</td><td>+${it[2]}</td><td><button data-i="${i}" ${L.money<it[1]?'disabled':''}>사기</button></td></tr>`).join('')}</table>
 <div class="acts"><button class="pri" id="mX">닫기</button></div>`,c=>{
  c.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];if(L.money<it[1])return;L.money-=it[1];L.mood=clamp(L.mood+it[2],0,100);addLog(wildish()?it[0]+' — 맛있었습니다.':eul(it[0])+' 즐겼습니다.','good');closeModal();openShop()});
  c.querySelector('#mX').onclick=closeModal})}
function openHouse(sz){const E=E_(),price=housePrice(sz),have=L.home.type==='own',back=have?Math.round(housePrice(L.home.size)*.9):0,need=price-back,verb=wildish()?'얻기':'사기';
 openModal(`<h2>${E.houses[sz]}</h2><div class="sub">${['작은 집','보통 집','큰 집'][sz]} · 값 ${money(price)}</div>
 <div class="kv"><i>가진 돈</i><span>${money(L.money)}</span>${have?`<i>지금 집 팔면</i><span>${money(back)} (값의 90%)</span>`:''}<i>더 필요한 돈</i><span>${need>L.money?money(need-L.money):'없음'}</span></div>

// ================= 이름표·위쪽 정보 =================
const LBP=[];
function labelFor(lot){const E=E_(),r=lot.role;
 if(r==='board')return[E.board,''];if(r==='shop')return[E.shop,''];if(r==='study')return[E.study,''];
 if(r==='rent')return L.home.type==='rent'&&L.adult?['내 집 · '+E.rentName,'mine']:[E.rentName,''];
 if(r==='parents')return[L.parentsGone?'부모님이 살던 집':'부모님 집',!L.adult?'mine':''];
 if(r.startsWith('sale:')){const sz=+r[5];return L.home.type==='own'&&L.home.size===sz?['내 집 · '+E.houses[sz],'mine']:['판매 중 · '+E.houses[sz]+' · '+money(housePrice(sz)),'sale']}
 if(r.startsWith('work:')){const i=lot.job;return L.job&&L.job.i===i?['내 일터 · '+jobName(i),'work']:[jobName(i),'work']}
 return null}
function drawLabels(vp){let k=0;const hh=L.h%24,workTime=L.job&&L.h<24&&hh>=9&&hh<18;
 for(const lot of W.lots){const lb=labelFor(lot);if(!lb)continue;const p=M4.xf(vp,lot.top[0],lot.top[1],lot.top[2]);
  if(p[3]<=0)continue;const x=(p[0]/p[3]*.5+.5)*innerWidth,y=(1-(p[1]/p[3]*.5+.5))*innerHeight;if(x<-80||x>innerWidth+80||y<-20||y>innerHeight+20)continue;
  const dist=Math.hypot(lot.top[0]-cam.tx,lot.top[2]-cam.tz);if(dist>cam.dist*1.9+10&&!lb[1])continue;
  let el=LBP[k];if(!el){el=document.createElement('div');el.className='lb';$('#labels').appendChild(el);LBP.push(el);el.onclick=()=>{if(MODE==='live'&&!modalOpen&&el._lot)PL.tgt=el._lot.door.slice()}}
  el._lot=lot;el.style.display='block';el.style.left=x+'px';el.style.top=y+'px';if(el._t!==lb[0]){el.textContent=lb[0];el._t=lb[0]}
  const go=(workTime&&lot.role==='work:'+L.job.i&&!PL.working)||(hh>=21||L.h>=24)&&lot===homeLot()&&L.adult;

// ================= 저장 =================
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({L,past,px:PL.x,pz:PL.z}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s)return null;past=s.past||[];return s}catch(e){return null}}
setInterval(()=>{if(L&&!L.dead&&MODE==='live')save()},8000);
addEventListener('beforeunload',()=>{if(L&&!L.dead)save()});

// ================= 시작 =================
let last=performance.now();
function loop(now){requestAnimationFrame(loop);
 try{const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render(now/1000);hud(dt)}catch(e){console.error(e);if(!loop.err){loop.err=1;toast('오류: '+e.message)}}}
function boot(){const s=load();
 if(s&&s.L&&!s.L.dead){L=s.L;genTown();R=Math.random;R=mulberry(L.seed+7);PL.look=makeLook(L.fem);R=Math.random;
  if(!L.parentsGone){const pl=lotByRole('parents');R=mulberry(L.seed+11);for(let i=0;i<2;i++)W.npcs.push({x:pl.door[0]+(i?1.2:-1.2),z:pl.door[1]+.6,ry:0,a:makeLook(i===1),s:1,walk:0,mv:0,path:[],wait:9999,parent:1});R=Math.random}
  PL.x=s.px||0;PL.z=s.pz||0;if(L.adult){L.h=Math.min(L.h,17);MODE='live'}else MODE='child';pet.x=PL.x;pet.z=PL.z;cam.tx=PL.x;cam.tz=PL.z;renderLog()}
 else startLife(rollLife());
