<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>중소기업 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:'Malgun Gothic','맑은 고딕',sans-serif;color:#e8edf2;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
.panel{background:rgba(16,20,26,.8);border:1px solid rgba(255,255,255,.09);border-radius:10px;backdrop-filter:blur(6px)}
#top{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:10px;align-items:stretch;pointer-events:none}
#top>div{pointer-events:auto}
.who{padding:8px 14px;min-width:190px;max-width:300px;flex:0 1 auto}
.who b{display:block;font-size:17px;letter-spacing:-.3px}
.who span{display:block;font-size:12px;color:#9fb0c0;margin-top:2px;line-height:1.35}
.stats{display:flex;padding:6px;flex:1;align-items:center;overflow:hidden}
.st{padding:2px 12px;border-right:1px solid rgba(255,255,255,.07);flex:0 0 auto}
.st:last-child{border-right:0}
.st i{display:block;font-style:normal;font-size:11px;color:#8c9aab}
.st b{font-size:15px;white-space:nowrap}
.clock{padding:6px 12px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:200px}
.clock b{font-size:16px}
.clock>span{font-size:12px;color:#9fb0c0}
.row{display:flex;gap:4px}
button{font-family:inherit;font-size:12px;color:#dfe7ee;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{background:rgba(255,255,255,.16)}
button.on{background:#3d6f8f;border-color:#5b93b8;color:#fff}
button.pri{background:#3d6f8f;border-color:#5b93b8;color:#fff}
button.pri:hover{background:#4a82a6}
button.red{background:rgba(160,60,50,.5);border-color:rgba(220,110,90,.6)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font-family:inherit;font-size:13px;color:#e8edf2;background:#0f1419;border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:4px 6px}
input[type=range]{padding:0;accent-color:#5b93b8}
input[type=checkbox]{accent-color:#5b93b8;width:15px;height:15px;vertical-align:-2px}
input[type=color]{padding:0;width:28px;height:24px;border:0;background:none;cursor:pointer}
#side{position:fixed;right:10px;top:132px;width:268px;padding:10px 12px;font-size:12.5px;line-height:1.5}
#side h4{font-size:12px;color:#8c9aab;font-weight:normal;margin:6px 0 2px}
#side h4:first-child{margin-top:0}
#side .ln{display:flex;justify-content:space-between;gap:8px}
#side .ln span{color:#9fb0c0}
#floorCtl{position:fixed;right:10px;bottom:10px;padding:8px 12px;font-size:12.5px;display:none;align-items:center;gap:8px}
#log{position:fixed;left:10px;bottom:10px;width:350px;max-height:30vh;overflow:hidden;padding:8px 12px;font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;justify-content:flex-end}
#log div{color:#c9d3dc;border-bottom:1px solid rgba(255,255,255,.05);padding:2px 0}
#log div em{font-style:normal;color:#8c9aab;margin-right:6px;font-size:11px}
#log div.good{color:#a9e3c4}
#log div.bad{color:#f0b9a0}
#log div.big{color:#ffd88a}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 16px;font-size:14px;display:none;white-space:nowrap;cursor:pointer}
#hint kbd{display:inline-block;background:#e8edf2;color:#111;border-radius:4px;padding:0 6px;margin-right:6px;font-family:inherit;font-weight:bold}
#banner{position:fixed;left:50%;top:128px;transform:translateX(-50%);padding:10px 22px;font-size:15px;display:none;text-align:center;border-color:rgba(255,216,138,.5)}
#banner small{display:block;font-size:12px;color:#c9b88f;margin-top:2px}
#report{position:fixed;right:290px;bottom:10px;padding:10px 14px;font-size:12.5px;line-height:1.6;display:none;min-width:210px}
#report b{display:block;font-size:13px;margin-bottom:2px}
#report .ln{display:flex;justify-content:space-between;gap:14px}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);font-size:12px;padding:2px 8px;border-radius:5px;background:rgba(16,20,26,.75);color:#e8edf2;white-space:nowrap;pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.12)}
.lb.act{background:rgba(52,78,120,.88);border-color:#7fa8e0}
.lb.bld{background:rgba(48,92,70,.85);border-color:#7cc6a4}
.lb.site{background:rgba(110,80,36,.88);border-color:#d9aa5c}
#modal{position:fixed;inset:0;background:rgba(5,8,12,.5);display:flex;align-items:center;justify-content:center;z-index:20}
#modal.hide,#dev.hide{display:none}
.card{width:min(600px,94vw);max-height:90vh;overflow:auto;padding:18px 22px;background:rgba(20,25,32,.97);border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card.wide{width:min(1000px,96vw)}
.card h2{font-size:19px;margin-bottom:4px;letter-spacing:-.3px}
.card h3{font-size:14px;margin:14px 0 6px;color:#cfd9e2}
.card .sub{font-size:12.5px;color:#9fb0c0;margin-bottom:12px;line-height:1.5}
.card p{font-size:13.5px;line-height:1.65;color:#d5dde5;margin:6px 0}
.card table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.card td,.card th{padding:6px 6px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;vertical-align:middle}
.card th{color:#8c9aab;font-weight:normal;font-size:12px}
.card .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.card .acts button{font-size:14px;padding:6px 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid rgba(255,255,255,.1);margin:6px 0 14px;flex-wrap:wrap}
.tabs button{border-radius:6px 6px 0 0;border-bottom:0;font-size:13px;padding:6px 14px;background:transparent}
.tabs button.on{background:rgba(61,111,143,.45);border-color:#5b93b8}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.opt{padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:8px;cursor:pointer;background:rgba(255,255,255,.035);font-size:13px;line-height:1.45}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt span{color:#9fb0c0;font-size:12px}
.opt:hover{background:rgba(255,255,255,.07)}
.opt.on{border-color:#5b93b8;background:rgba(61,111,143,.35)}
.opt.lock{opacity:.38;cursor:default}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid rgba(255,255,255,.1);padding:4px 11px}
.seg button:last-child{border-right:0}
.sw{display:inline-block;width:22px;height:22px;border-radius:5px;border:2px solid rgba(255,255,255,.12);cursor:pointer;margin:2px;vertical-align:middle}
.sw.on{border-color:#fff;box-shadow:0 0 0 1px #000}
.pg{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;min-width:80px}
.pg>span{display:block;height:100%;background:#7cc6a4;border-radius:4px}
.star{color:#ffd36b;letter-spacing:1px}
.star i{color:#4a5560;font-style:normal}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 10px;font-size:13.5px;margin:8px 0}
.kv i{font-style:normal;color:#8c9aab}
.muted{color:#8c9aab;font-size:12px}
.good{color:#a9e3c4}.bad{color:#f0b9a0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.frm{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center;font-size:13px;margin:8px 0}
.frm>i{font-style:normal;color:#9fb0c0}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
/* 개발 도구 */
#dev{position:fixed;inset:0;background:#15191e;z-index:30;display:flex;flex-direction:column;font-size:13px}
.dvTop{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#1d232a;border-bottom:1px solid rgba(255,255,255,.08)}
.dvTop .ttl{font-size:15px;font-weight:bold;white-space:nowrap}
.dvTop .ttl small{font-weight:normal;color:#8c9aab;margin-left:6px;font-size:12px}
.dvTabs{display:flex;gap:3px;flex:1;overflow-x:auto;padding:0 6px}
.dvTabs button{white-space:nowrap;padding:5px 12px;font-size:12.5px}
.dvScore{white-space:nowrap;font-size:12.5px;color:#cfd9e2;padding:4px 10px;border:1px solid rgba(255,255,255,.12);border-radius:6px}
.dvScore b{color:#7cc6a4}
.dvBody{flex:1;display:flex;min-height:0}
.dvLeft{width:184px;flex:0 0 184px;background:#1a1f25;border-right:1px solid rgba(255,255,255,.07);padding:10px;overflow:auto}
.dvLeft h5,.dvRight h5{font-size:11.5px;color:#8c9aab;font-weight:normal;margin:10px 0 6px;letter-spacing:.5px}
.dvLeft h5:first-child,.dvRight h5:first-child{margin-top:0}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pal button{padding:8px 4px;font-size:12.5px;text-align:center}
.dvMid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0;background:radial-gradient(circle at 50% 45%,#262d36,#14181d)}
.dvTip{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#7d8b99;font-size:12px}
.dvRight{width:310px;flex:0 0 310px;background:#1a1f25;border-left:1px solid rgba(255,255,255,.07);padding:10px 12px;overflow:auto}
.pr{display:grid;grid-template-columns:76px 1fr;gap:6px 8px;align-items:center;margin-bottom:4px}
.pr>i{font-style:normal;color:#9fb0c0;font-size:12px}
.pr input[type=number]{width:62px}
.pr textarea{width:100%;height:54px;resize:vertical}
.pr input[type=text]{width:100%}
.nums{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nums span{color:#8c9aab;font-size:11px}
.icg{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.icg canvas{width:100%;aspect-ratio:1;border-radius:5px;background:#2a323c;cursor:pointer;border:1px solid transparent}
.icg canvas.on{border-color:#7fa8e0;background:#3d6f8f}
.actl{display:flex;flex-direction:column;gap:5px;margin:4px 0}
.actr{background:#222932;border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:6px 7px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.actr b{font-weight:normal;color:#9fd0ff;margin-right:2px}
.actr select,.actr input{font-size:12px;padding:2px 4px;max-width:150px}
.actr input[type=number]{width:58px}
.actr .x{margin-left:auto;padding:0 7px}
.chk{font-size:12.5px;line-height:1.75}
.chk .ok{color:#7cc6a4}.chk .no{color:#8c9aab}
#dvFrame{position:relative;box-shadow:0 18px 50px rgba(0,0,0,.55);transform-origin:center center}
#dvFrame canvas{display:block}
.dvDeco{position:absolute;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="top">
 <div class="who panel"><b id="tName">-</b><span id="tGrade">-</span></div>
 <div class="stats panel">
  <div class="st"><i>자금</i><b id="tMoney">-</b></div>
  <div class="st"><i>오늘 매출</i><b id="tSales">-</b></div>
  <div class="st"><i>직원</i><b id="tStaff">-</b></div>
  <div class="st"><i>인지도</i><b id="tRep">-</b></div>
  <div class="st"><i>지금 있는 곳</i><b id="tWhere">-</b></div>
 </div>
 <div class="clock panel">
  <b id="tClock">-</b><span id="tDay">-</span>
  <div class="row" id="spd"><button data-s="1" class="on">1배</button><button data-s="2">2배</button><button data-s="4">4배</button></div>
  <div class="row"><button id="bInfo">회사 현황</button><button id="bView">속 보기</button><button id="bHelp">도움말</button></div>
 </div>
</div>
<div id="side" class="panel"></div>
<div id="floorCtl" class="panel"><span>본사 보는 층</span><button id="fDn">아래층</button><b id="fNow">-</b><button id="fUp">위층</button></div>
<div id="log" class="panel"></div>
<div id="hint" class="panel"></div>
<div id="banner" class="panel"></div>
<div id="report" class="panel"></div>
<div id="modal" class="hide"><div class="card" id="mcard"></div></div>
<div id="dev" class="hide"></div>
<div id="fade"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const SAVE_KEY='smb3d_v1';

// ================= 기본 도구 =================
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const rnd=(a,b)=>a+(b-a)*R();
const rint=(a,b)=>Math.floor(a+(b-a+1)*R());
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const fmtN=n=>Math.round(n).toLocaleString('ko-KR');
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
function shade(c,k){return[c[0]*k,c[1]*k,c[2]*k]}
function jit(c,k){const f=1+(R()-.5)*k;return[c[0]*f,c[1]*f,c[2]*f]}
function hash3(x,y,z){const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return s-Math.floor(s)}
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+a;return w+((c-0xAC00)%28?a:b)}
const eun=w=>josa(w,'은','는'),iga=w=>josa(w,'이','가'),eul=w=>josa(w,'을','를'),wa=w=>josa(w,'과','와');
const ro=w=>{const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+'로';const j=(c-0xAC00)%28;return w+(j&&j!==8?'으로':'로')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 돈 쓰기: 2억 3,500만 원
function won(n){const neg=n<0;n=Math.abs(Math.round(n));let s;
 if(n>=1e8){const e=Math.floor(n/1e8),m=Math.floor((n%1e8)/1e4);s=fmtN(e)+'억'+(m?' '+fmtN(m)+'만':'')}
 else if(n>=1e4){const m=Math.floor(n/1e4),r=n%1e4;s=fmtN(m)+'만'+(r&&m<10?' '+fmtN(r):'')}else s=fmtN(n);
 return(neg?'-':'')+s+' 원'}
function wonS(n){const neg=n<0;n=Math.abs(n);let s;if(n>=1e8)s=(n/1e8).toFixed(n>=1e10?0:1).replace(/\.0$/,'')+'억';else if(n>=1e4)s=fmtN(n/1e4)+'만';else s=fmtN(n);return(neg?'-':'')+s+' 원'}
const priceStr=n=>fmtN(n)+'원';

// 4x4 행렬 (열 우선)
const M4={
 id(){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;return o},
 persp(f,a,n,fa){const t=1/Math.tan(f/2),r=new Float32Array(16);r[0]=t/a;r[5]=t;r[10]=(fa+n)/(n-fa);r[11]=-1;r[14]=2*fa*n/(n-fa);return r},
 ortho(l,r,b,t,n,f){const o=new Float32Array(16);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o},
 look(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx,o=new Float32Array(16);
  o[0]=xx;o[1]=yx;o[2]=zx;o[4]=xy;o[5]=yy;o[6]=zy;o[8]=xz;o[9]=yz;o[10]=zz;
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);o[15]=1;return o},
 mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o},
 trs(x,y,z,ry,sx,sy,sz){const c=Math.cos(ry),s=Math.sin(ry),o=new Float32Array(16);
  o[0]=c*sx;o[2]=-s*sx;o[5]=sy;o[8]=s*sz;o[10]=c*sz;o[12]=x;o[13]=y;o[14]=z;o[15]=1;return o},
 tr(x,y,z){const o=M4.id();o[12]=x;o[13]=y;o[14]=z;return o},
 rx(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o},
 ry(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o},
 rz(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o},
 sc(x,y,z){const o=M4.id();o[0]=x;o[5]=y;o[10]=z;return o},
 xf(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14],m[3]*x+m[7]*y+m[11]*z+m[15]]}
};
const mm=M4.mul;
function invert(m){const o=new Float32Array(16),a=m;const b00=a[0]*a[5]-a[1]*a[4],b01=a[0]*a[6]-a[2]*a[4],b02=a[0]*a[7]-a[3]*a[4],b03=a[1]*a[6]-a[2]*a[5],b04=a[1]*a[7]-a[3]*a[5],b05=a[2]*a[7]-a[3]*a[6],
 b06=a[8]*a[13]-a[9]*a[12],b07=a[8]*a[14]-a[10]*a[12],b08=a[8]*a[15]-a[11]*a[12],b09=a[9]*a[14]-a[10]*a[13],b10=a[9]*a[15]-a[11]*a[13],b11=a[10]*a[15]-a[11]*a[14];
 let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!d)return o;d=1/d;
 o[0]=(a[5]*b11-a[6]*b10+a[7]*b09)*d;o[1]=(a[2]*b10-a[1]*b11-a[3]*b09)*d;o[2]=(a[13]*b05-a[14]*b04+a[15]*b03)*d;o[3]=(a[10]*b04-a[9]*b05-a[11]*b03)*d;
 o[4]=(a[6]*b08-a[4]*b11-a[7]*b07)*d;o[5]=(a[0]*b11-a[2]*b08+a[3]*b07)*d;o[6]=(a[14]*b02-a[12]*b05-a[15]*b01)*d;o[7]=(a[8]*b05-a[10]*b02+a[11]*b01)*d;

  for(const o of it)o.z+=v*dt;while(it.length&&it[0].z>LINE_Z1){it.shift();PILE[d][i]=(PILE[d][i]+1)%14}
  if(!it.length||it[it.length-1].z>LINE_Z0+sp)it.push({z:LINE_Z0+.05})}}

// ================= 회사 돌아가기 =================
let SPEED=1;
const truckAcc={elec:0,food:0};
function rateH(h){return h>=7&&h<19.5?1/14:1/3.5} // 진짜 1초에 지나가는 게임 시간(시)
function clockStr(h){const hh=Math.floor(h)%24,mi=Math.floor((h%1)*60/10)*10;return(hh<12?'오전 ':'오후 ')+((hh%12)||12)+':'+String(mi).padStart(2,'0')}
function lvMul(lv){return 1+.3*(lv-1)}
function typeOf(P){return P.dept==='elec'?DEV[P.type]:FOOD[P.type]}
function demand(P){const T=typeOf(P),qf=Math.pow(Math.max(5,P.q)/60,1.6),pf=clamp(Math.pow(P.fair/P.price,2.2),.03,3),brand=1+S.rep/400;
 const k=S.products.some(o=>o!==P&&o.dept===P.dept&&o.type===P.type&&o.day>P.day)?.35:1;return T.market*qf*pf*brand*P.nov*k}
function dayRate(d){const P=prodById(S.act[d]);if(!P)return 0;const T=typeOf(P);let u=0;for(let i=0;i<S.lines[d].length;i++){const w=d==='elec'?staffOf('eprod').filter(s=>s.line===i).length:staffOf('fprod').filter(s=>s.line===i).length;u+=T.rate*lvMul(S.lines[d][i])*Math.min(3,w)/3}return u}
function simStep(dt){const dh=dt*rateH(S.h)*SPEED,h0=S.h;S.h+=dh;
 for(const d of['elec','food'])produce(d,dh);sales(dh);research(dh);construction(dh);
 if(h0<18&&S.h>=18)settle();
 if(S.h>=24){S.h-=24;newDay()}}
function produce(d,dh){const P=prodById(S.act[d]);if(!P||S.flags['halt_'+d])return;const T=typeOf(P);let u=0;
 for(let i=0;i<S.lines[d].length;i++){const w=lineRunning(d,i);if(w)u+=T.rate*lvMul(S.lines[d][i])*(w/3)*dh/9}
 if(u<=0)return;const cost=u*P.cost*(S.flags.costUp===S.day?1.1:1);
 if(S.money<cost){if(!S.flags['nomoney_'+d]){S.flags['nomoney_'+d]=1;addLog(DEPT[d]+' 공장: 재료를 살 돈이 모자라 생산이 멈췄습니다.','bad')}return}
 S.flags['nomoney_'+d]=0;S.money-=cost;S.today.mat+=cost;P.stock+=u;P.made+=u;S.today.made[d]+=u;S.stats.made+=u;
 truckAcc[d]+=dh;if(truckAcc[d]>1.3){truckAcc[d]=0;sendTruck(d)}}
function sales(dh){if(S.h<8||S.h>=22)return;for(const P of S.products){if(P.stock<=0)continue;const s=Math.min(P.stock,demand(P)*dh/14);if(s<=0)continue;
 P.stock-=s;P.sold+=s;P.td=(P.td||0)+s;const rev=s*P.price;S.money+=rev;S.today.rev+=rev;S.stats.rev+=rev;S.stats.sold+=s;S.today.sold+=s}}
function research(dh){for(const d of['elec','food','build']){const T=TECH[d];if(S.tech[d]>=T.max){S.res[d]=0;continue}let pts=0;for(const s of S.staff)if(s.role===T.who&&atWork(s))pts+=s.skill;if(!pts)continue;
 S.res[d]+=pts*dh/9*3;const need=T.cost[S.tech[d]+1];if(S.res[d]>=need){S.res[d]=0;S.tech[d]++;banner('새 기술을 개발했습니다',DEPT[d]+' · '+T.un[S.tech[d]]);addLog(DEPT[d]+' 연구 완료: 이제 '+eul(T.un[S.tech[d]])+' 만들 수 있습니다.','big');if(d==='build')genOffers()}}}
function equipMul(k){const e=S.equip;if(k==='dig'||k==='found')return 1+(e.exc?.6:0)+(e.dump?.25:0);if(k==='frame')return 1+(e.mixer?.35:0)+(e.crane?.5:0);return 1+(e.crane?.2:0)}
function construction(dh){for(const p of S.projects.slice()){let pts=0;for(const s of S.staff)if(s.role==='bwork'&&s.site===p.id&&atWork(s)&&RT[s.id].loc==='lot:'+p.lot)pts+=s.skill;
 if(!pts)continue;p.pts+=pts*equipMul(projStage(p).k)*dh/9*2.5;if(p.pts>=p.need)finishProject(p);else buildLot(p.lot)}}
function maxProjects(){return Math.min(3,1+Math.floor(staffOf('bdev').length/2))}
function finishProject(p){const T=BLD[p.type],bonus=Math.min(.12,staffOf('bdev').reduce((a,s)=>a+s.skill,0)*.01),pay=Math.round(p.pay*(1+bonus));
 S.money+=pay;S.today.rev+=pay;S.today.cons+=pay;S.stats.rev+=pay;S.rep+=Math.round(8+Math.sqrt(T.need)*1.5);
 S.built.push({lot:p.lot,type:p.type,name:p.name,color:p.color,day:S.day,n:S.built.length});S.projects.splice(S.projects.indexOf(p),1);
 assignBuilders();buildLot(p.lot);buildSigns();banner('건물을 다 지었습니다',p.name+' · 받은 돈 '+won(pay));addLog(p.name+' 준공. 계약금 '+won(pay)+(bonus>0?' (설계 보너스 포함)':'')+'을 받았습니다.','big')}
function offerName(t){const c=pick(CLIENT);return t==='house'?genName(R()<.5)+' 씨 집':t==='school'?c+' 초등학교':t==='hospital'?c+' 병원':t==='office'?c+' 빌딩':t==='tower'?c+' 타워':t==='apt'?c+' 아파트':t==='villa'?c+' 빌라':c+' '+BLD[t].n}
function genOffers(){const av=BLD_ORDER.filter(t=>BLD[t].tech<=S.tech.build);S.offers=[];S.offerDay=S.day;
 for(let i=0;i<4;i++){const t=i===0?av[av.length-1-rint(0,Math.min(1,av.length-1))]:pick(av),T=BLD[t],k=.9+R()*.24;S.offers.push({type:t,name:offerName(t),pay:Math.round(T.pay*k/1e6)*1e6,mat:Math.round(T.mat*k/1e6)*1e6})}}
function acceptOffer(i,color){const o=S.offers[i],T=BLD[o.type];if(!o)return false;
 if(S.projects.length>=maxProjects()){toast('지금은 공사를 더 맡을 수 없습니다. 설계사를 뽑으면 늘어납니다.');return false}
 if(T.crane&&!S.equip.crane){toast('타워 크레인이 있어야 합니다.');return false}
 if(S.money<o.mat){toast('재료비가 모자랍니다.');return false}
 const lot=LOT_ORDER.find(l=>!lotUsed(l));if(lot===undefined){toast('지을 땅이 없습니다.');return false}
 S.money-=o.mat;S.today.mat+=o.mat;const p={id:'c'+(S.nid++),type:o.type,name:o.name,lot,color,pts:0,need:T.need,pay:o.pay,mat:o.mat,day:S.day};
 S.projects.push(p);S.offers.splice(i,1);assignBuilders();buildGround();buildLot(lot);buildSigns();addLog(o.name+' 공사를 계약했습니다. 재료비 '+won(o.mat)+'을 냈습니다.','good');return true}
function settle(){let w=0;for(const s of S.staff)w+=s.wage;const paid=Math.min(w,Math.max(0,S.money));S.money-=paid;S.today.wage+=paid;for(const s of S.staff)s.days++;
 if(paid<w)addLog('자금이 모자라 급여를 다 주지 못했습니다.','bad');showReport()}
function newDay(){S.hist.push({d:S.day,rev:S.today.rev,mat:S.today.mat,wage:S.today.wage});if(S.hist.length>60)S.hist.shift();
 const yRev=S.today.rev;S.day++;S.today=freshToday();
 for(const P of S.products){P.nov=Math.max(P.dept==='elec'?.35:.6,P.nov*(P.dept==='elec'?.97:.99));P.td=0}
 for(let i=S.ads.length-1;i>=0;i--){const a=S.ads[i];S.rep+=a.per;if(--a.left<=0)S.ads.splice(i,1)}
 S.rep=S.rep*.995+Math.min(14,Math.sqrt(Math.max(0,yRev)/1e6));S.rep=clamp(S.rep,0,3000);
 if(S.day%20===0){const t=pick(FOOD_ORDER),f=rint(0,4),[a,b]=TREND_RANGE[t][f],o=S.trend[t][f];const nv=clamp(o+(R()<.5?-1:1),a,b);if(nv!==o){S.trend[t][f]=nv;S.survey[t]=0;addLog('사람들이 좋아하는 '+FOOD[t].n+' 맛이 조금 바뀌고 있습니다.')}}
 if(!S.offers.length||S.day-(S.offerDay||0)>=3)genOffers();
 genCands();for(const s of S.staff){const r=rtOf(s);planDay(r);if(r.st!=='away'){r.st='away';r.path=[];r.hide=0}}
 const e=R();
 if(e<.05){const ev=pick([['신문에 우리 회사 이야기가 실렸습니다.',25],['방송 뉴스에 우리 회사가 나왔습니다.',40],['동네 사람들 사이에 우리 회사 소문이 좋게 났습니다.',15]]);S.rep+=ev[1];addLog(ev[0]+' (인지도 +'+ev[1]+')','good')}
 else if(e<.07&&S.day>5){S.money+=3e7;addLog('중소기업 지원금 3,000만 원을 받았습니다.','good')}
 else if(e<.09&&S.products.length){S.flags.costUp=S.day;addLog('재료 값이 잠깐 올랐습니다. 오늘은 재료비가 10% 더 듭니다.','bad')}
 addLog('창업 '+S.day+'일째 아침입니다.');save()}
function updateGrade(){let g=0;for(let i=0;i<GRADE.length;i++)if(S.staff.length>=GRADE[i].min)g=i;if(g>S.grade){S.grade=g;banner('회사가 커졌습니다: '+GRADE[g].n,'생산 라인 '+GRADE[g].lines+'개 · 본사 '+GRADE[g].floors+'층까지 지을 수 있습니다');addLog('직원이 '+S.staff.length+'명이 되어 '+GRADE[g].n+'으로 올라섰습니다.','big')}}

function hire(role,ci){const c=S.cands[role]&&S.cands[role][ci];if(!c)return false;const RL=ROLE[role];
 const s={id:S.nid++,name:c.name,fem:c.fem,role,skill:c.skill,wage:c.wage,days:0,seed:c.seed,trait:c.trait,hired:S.day};
 if(RL.office){const st=freeSeat();if(st<0){toast('본사에 빈 책상이 없습니다. 사장 컴퓨터의 시설 메뉴에서 본사를 증축하세요.');return false}s.seat=st}
 else if(role!=='bwork'){const sl=freeSlot(RL.d);if(!sl){toast('생산 라인에 빈자리가 없습니다. 생산 라인을 늘리세요.');return false}s.line=sl[0];s.slot=sl[1]}
 S.staff.push(s);S.cands[role].splice(ci,1);if(role==='bwork')assignBuilders();rtOf(s);updateGrade();addLog(s.name+' 님이 '+ro(RL.n)+' 들어왔습니다.','good');return true}
function fireStaff(id){const i=S.staff.findIndex(s=>s.id===id);if(i<0)return;const s=S.staff[i];S.staff.splice(i,1);delete RT[id];assignBuilders();addLog(s.name+' 님이 회사를 떠났습니다.')}

const LINE_COST=[0,3e7,9e7,2.4e8];
function upCost(lv){return Math.round(1.5e7*Math.pow(lv,1.6)/1e6)*1e6}
function floorCost(){return 6e7*(S.floors-1)}
function spend(n){if(S.money<n){toast('자금이 모자랍니다.');return false}S.money-=n;S.today.mat+=n;return true}
function addLine(d){const n=S.lines[d].length;if(n>=grade().lines){toast('회사가 더 커져야 라인을 늘릴 수 있습니다.');return}if(!spend(LINE_COST[n]))return;S.lines[d].push(1);LINES[d][n]=[];buildFactory(d);addLog(FAC[d].name+'에 생산 라인 '+(n+1)+'번을 새로 놓았습니다.','good')}
function upLine(d,i){const lv=S.lines[d][i];if(lv>=5)return;if(!spend(upCost(lv)))return;S.lines[d][i]++;buildFactory(d);addLog(FAC[d].name+' '+(i+1)+'번 라인을 '+(lv+1)+'단계로 올렸습니다. 더 빨리 만듭니다.','good')}
function addFloor(){if(S.floors>=grade().floors){toast('회사가 더 커져야 본사를 높일 수 있습니다.');return}if(!spend(floorCost()))return;S.floors++;buildOffice();buildInts();addLog('본사를 '+S.floors+'층으로 높였습니다. 책상 16개가 늘었습니다.','good')}
function buyEquip(k){if(S.equip[k])return;if(!spend(EQUIP[k].price))return;S.equip[k]=1;addLog(eul(EQUIP[k].n)+' 샀습니다.','good')}
function runAd(k){const A=ADS.find(a=>a.k===k);if(!spend(A.cost))return;const per=A.rep/A.days;S.ads.push({k,left:A.days-1,per});S.rep+=per;addLog(eul(A.n)+' 시작했습니다. '+A.days+'일 동안 인지도가 오릅니다.','good')}

 if(TEX[P.id])delete TEX[P.id];banner('새 제품을 내놓았습니다',P.name+' · 품질 '+P.q+'점 · '+priceStr(P.price));addLog(DEPT[P.dept]+' 신제품 '+eul(P.name)+' 내놓았습니다('+typeOf(P).n+'). 공장에서 바로 만듭니다.','big');save()}
function fairPrice(base,q,cm){return Math.max(100,Math.round(base*(.7+q/150)*Math.pow(cm,.7)/(base>=1e5?1e4:base>=1e4?1e3:100))*(base>=1e5?1e4:base>=1e4?1e3:100))}

 r.style.display='block';reportT=8}

 openModal(`<h2>엘리베이터</h2><div class="sub">가고 싶은 층을 고르세요. 지금 ${PL.f+1}층입니다.</div>${h}`,c=>on(c,'button[data-k]','click',el=>{closeModal();goFloor(+el.dataset.k)}))}

let hrRole='edev',hrTab='hire';
function roleCap(r){const RL=ROLE[r];if(RL.office){const free=allSeats().length-S.staff.filter(s=>ROLE[s.role].office).length;return'본사 빈 책상 '+free+'개'}
 if(r==='bwork')return'인원 제한 없음';const d=RL.d,free=S.lines[d].length*3-staffOf(r).length;return'빈 라인 자리 '+free+'개'}
function openHR(){if(!S.cands||S.candDay!==S.day)genCands();
 const tabs=`<div class="tabs"><button data-t="hire" class="${hrTab==='hire'?'on':''}">직원 뽑기</button><button data-t="list" class="${hrTab==='list'?'on':''}">직원 목록 (${S.staff.length}명)</button></div>`;let body='';
 if(hrTab==='hire'){body=`<div class="opts">${ROLE_ORDER.map(r=>`<div class="opt${r===hrRole?' on':''}" data-r="${r}"><b>${ROLE[r].n} <span>${staffOf(r).length}명</span></b><span>${ROLE[r].job}<br>${roleCap(r)}</span></div>`).join('')}</div>
  <h3>${ROLE[hrRole].n} 지원자</h3><table><tr><th>이름</th><th>실력</th><th>하루 급여</th><th>특징</th><th></th></tr>${(S.cands[hrRole]||[]).map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${stars(c.skill)}</td><td>${won(c.wage)}</td><td class="muted">${c.trait}</td><td><button class="pri" data-h="${i}">뽑기</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">오늘 지원자를 다 뽑았습니다. 내일 새 지원자가 옵니다.</td></tr>'}</table>
  <p class="muted">실력이 높을수록 일을 잘하고(생산·연구·공사가 빨라짐) 급여가 조금 더 비쌉니다. 급여는 매일 오후 6시에 나갑니다.</p>`}
 else{body=`<table><tr><th>이름</th><th>하는 일</th><th>실력</th><th>하루 급여</th><th>일한 날</th><th>지금</th><th></th></tr>${S.staff.map(s=>{const r=RT[s.id];const now=!r||r.st==='away'?'퇴근':r.st==='come'?'출근 중':r.st==='go'?'퇴근 중':r.st==='brk'?'쉬는 중':'일하는 중';
  return`<tr><td>${esc(s.name)}</td><td>${ROLE[s.role].n}${s.line!==undefined?' · '+(s.line+1)+'번 라인':''}</td><td>${stars(s.skill)}</td><td>${won(s.wage)}</td><td>${s.days}일</td><td class="muted">${now}</td><td><button class="red" data-f="${s.id}">내보내기</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">아직 직원이 없습니다.</td></tr>'}</table>`}
 openModal(`<h2>인사과</h2><div class="sub">직원 ${S.staff.length}명 · 하루 급여 합계 ${won(S.staff.reduce((a,s)=>a+s.wage,0))} · ${GRADE[S.grade].n}</div>${tabs}${body}<div class="acts"><button id="mClose">닫기</button></div>`,c=>{
  on(c,'.tabs button','click',el=>{hrTab=el.dataset.t;openHR()});on(c,'.opt[data-r]','click',el=>{hrRole=el.dataset.r;openHR()});
  on(c,'button[data-h]','click',el=>{if(hire(hrRole,+el.dataset.h))openHR()});
  on(c,'button[data-f]','click',el=>{const s=S.staff.find(q=>q.id===+el.dataset.f);if(s&&confirm(s.name+' 님을 내보낼까요?')){fireStaff(s.id);openHR()}});$('#mClose').onclick=closeModal},true)}

// ---------- 공장 관리 ----------
function openFactory(d){const F=FAC[d],P=prodById(S.act[d]),mine=S.products.filter(p=>p.dept===d),rate=dayRate(d),dem=P?demand(P):0,halt=S.flags['halt_'+d];
 const lines=S.lines[d].map((lv,i)=>{const w=staffOf(d==='elec'?'eprod':'fprod').filter(s=>s.line===i).length;return`<tr><td>${i+1}번 라인</td><td>${lv}단계 ${pgBar(lv/5)}</td><td>작업자 ${w}/3명</td><td>${lv<5?`<button data-u="${i}">${lv+1}단계로 (${wonS(upCost(lv))})</button>`:'<span class="muted">최고 단계</span>'}</td></tr>`}).join('');
 const nl=S.lines[d].length,canAdd=nl<4;
 openModal(`<h2>${F.name} 관리</h2><div class="sub">${P?'지금 만드는 제품: <b>'+esc(P.name)+'</b> ('+typeOf(P).n+', 품질 '+P.q+'점)':'아직 만들 제품이 없습니다. 2층 사장 컴퓨터에서 제품을 기획하세요.'}</div>
 <div class="kv"><i>하루에 만드는 양</i><span>약 ${fmtN(rate)}개 ${halt?'<span class="bad">(멈춤)</span>':''}</span><i>하루에 팔리는 양</i><span>약 ${fmtN(dem)}개</span><i>창고 재고</i><span>${P?fmtN(P.stock)+'개':'-'} ${P&&P.stock>dem*2.5&&dem>0?'<span class="bad">재고가 많이 쌓였습니다</span>':''}</span></div>
 <h3>생산 라인</h3><table>${lines}</table>
 <div class="acts" style="justify-content:flex-start">${canAdd?`<button class="pri" id="fAdd" ${nl>=grade().lines?'disabled':''}>라인 늘리기 (${wonS(LINE_COST[nl])})</button>${nl>=grade().lines?'<span class="muted" style="align-self:center">'+GRADE.find(g=>g.lines>nl).n+'이 되면 늘릴 수 있습니다</span>':''}`:''}
 <button id="fHalt">${halt?'생산 다시 시작':'생산 잠깐 멈추기'}</button></div>
 <h3>만들 제품 고르기</h3><table>${mine.map(p=>`<tr><td>${esc(p.name)}</td><td>${typeOf(p).n}</td><td>품질 ${p.q}</td><td>재고 ${fmtN(p.stock)}</td><td>${p.id===S.act[d]?'<b class="good">만드는 중</b>':`<button data-p="${p.id}">이것 만들기</button>`}</td></tr>`).join('')||'<tr><td class="muted">아직 제품이 없습니다.</td></tr>'}</table>
 <div class="acts"><button id="mClose">닫기</button></div>`,c=>{
  on(c,'button[data-u]','click',el=>{upLine(d,+el.dataset.u);openFactory(d)});on(c,'button[data-p]','click',el=>{S.act[d]=el.dataset.p;S.flags['halt_'+d]=0;openFactory(d)});
  const a=$('#fAdd');if(a)a.onclick=()=>{addLine(d);openFactory(d)};$('#fHalt').onclick=()=>{S.flags['halt_'+d]=halt?0:1;openFactory(d)};$('#mClose').onclick=closeModal},true)}

// ---------- 건설 사무소 ----------
let bColor=BCOLORS[0];
function openBuild(){if(!S.offers.length)genOffers();
 const cur=S.projects.map(p=>{const st=projStage(p),crew=staffOf('bwork').filter(s=>s.site===p.id).length,T=BLD[p.type];
  return`<tr><td><b>${esc(p.name)}</b><br><span class="muted">${T.n} ${T.fl}층</span></td><td style="width:34%">${pgBar(p.pts/p.need,'#d9aa5c')}<span class="muted">${{dig:'땅 파기',found:'기초 공사',frame:'뼈대 올리기 ('+st.sf+'/'+T.fl+'층)',skin:'벽·창문 ('+st.ff+'/'+T.fl+'층)',end:'마무리'}[st.k]} · ${Math.floor(p.pts/p.need*100)}%</span></td><td>기술자 ${crew}명${crew<T.crew?'<br><span class="bad">'+T.crew+'명은 있어야 빨라요</span>':''}</td><td>받을 돈 ${wonS(p.pay)}</td></tr>`}).join('');
 const off=S.offers.map((o,i)=>{const T=BLD[o.type],why=T.crane&&!S.equip.crane?'타워 크레인 필요':S.projects.length>=maxProjects()?'동시 공사 '+maxProjects()+'개까지':S.money<o.mat?'재료비 모자람':'';
  return`<tr><td><b>${esc(o.name)}</b><br><span class="muted">${T.n} · ${T.fl}층 · 기술자 ${T.crew}명 권장</span></td><td>계약금 <b>${wonS(o.pay)}</b><br><span class="muted">재료비 ${wonS(o.mat)} 먼저 냄</span></td><td><span class="good">남는 돈 약 ${wonS(o.pay-o.mat)}</span></td><td>${why?'<span class="muted">'+why+'</span>':`<button class="pri" data-o="${i}">계약하기</button>`}</td></tr>`}).join('');
 const eq=Object.keys(EQUIP).map(k=>`<tr><td><b>${EQUIP[k].n}</b><br><span class="muted">${EQUIP[k].d}</span></td><td>${S.equip[k]?'<span class="good">있음</span>':`<button data-e="${k}">사기 (${wonS(EQUIP[k].price)})</button>`}</td></tr>`).join('');
 openModal(`<h2>건설 사무소</h2><div class="sub">공사를 계약하면 길 건너 빈 땅에 건물을 짓습니다. 현장 기술자가 많을수록, 장비가 있을수록 빨리 짓습니다. 다 지으면 계약금을 받습니다.<br>건설 기술 ${S.tech.build}단계 · 지은 건물 ${S.built.length}채 · 현장 기술자 ${staffOf('bwork').length}명</div>
 <h3>짓고 있는 건물</h3><table>${cur||'<tr><td class="muted">지금 짓는 건물이 없습니다.</td></tr>'}</table>
 <h3>들어온 공사 (3일마다 바뀜)</h3><div class="frm" style="grid-template-columns:110px 1fr"><i>새 건물 외벽 색</i><div>${swatches(BCOLORS,bColor,'b')}</div></div><table>${off}</table>
 <h3>건설 장비</h3><table>${eq}</table><div class="acts"><button id="mClose">닫기</button></div>`,c=>{
  on(c,'.sw','click',el=>{bColor=el.dataset.b;c.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===el))});
  on(c,'button[data-o]','click',el=>{if(acceptOffer(+el.dataset.o,bColor))openBuild()});on(c,'button[data-e]','click',el=>{buyEquip(el.dataset.e);openBuild()});$('#mClose').onclick=closeModal},true)}

// ---------- 사장 컴퓨터 ----------
let pcTab='plan';
function thumbOf(P,sz){const c=document.createElement('canvas');c.width=c.height=sz||64;const g=c.getContext('2d');
 if(P.dept==='elec'){const T=DEV[P.type],k=Math.min(sz/T.w,sz/T.h)*.86,w=T.w*k,h=T.h*k;g.fillStyle=P.color;rr(g,(sz-w)/2-3,(sz-h)/2-3,w+6,h+6,6);g.fill();g.save();g.translate((sz-w)/2,(sz-h)/2);g.scale(k,k);paintScreen(g,P.design,0,null);g.restore()}
 else paintPackage(g,P,sz,sz);return c.toDataURL()}
function openComputer(tab){if(tab)pcTab=tab;const T=['plan','prod','res','fac','ad','info'],N={plan:'제품 기획',prod:'내 제품',res:'연구',fac:'시설',ad:'광고',info:'회사 현황'};
 const tabs=`<div class="tabs">${T.map(t=>`<button data-t="${t}" class="${t===pcTab?'on':''}">${N[t]}</button>`).join('')}</div>`;let body='',bind=null;
 if(pcTab==='plan'){body=`<div class="opts" style="grid-template-columns:1fr 1fr">
  <div class="opt" id="goE"><b>전자 제품 기획</b><span>계산기·스마트폰·노트북 같은 기계를 설계합니다. 부품을 고르고, 화면과 버튼을 직접 만들어 누르면 동작하게 합니다.</span><br><span class="muted">전자 기술 ${S.tech.elec}단계 · 개발자 ${staffOf('edev').length}명</span></div>
  <div class="opt" id="goF"><b>식품 기획</b><span>과자·음료·라면 같은 식품을 만듭니다. 맛을 고르고 시식단에게 맛을 보인 뒤 포장을 꾸밉니다.</span><br><span class="muted">식품 기술 ${S.tech.food}단계 · 연구원 ${staffOf('fdev').length}명</span></div></div>
  ${S.draft?`<p class="muted" style="margin-top:12px">만들다 만 전자 제품이 있습니다: ${DEV[S.draft.type].n}. <button id="goD">이어서 만들기</button></p>`:''}
  <p class="muted" style="margin-top:12px">개발자·연구원이 많고 실력이 좋을수록 제품 품질에 보너스가 붙습니다.</p>`;
  bind=c=>{$('#goE').onclick=()=>openElecPlan(null);$('#goF').onclick=()=>openFoodPlan();const d=$('#goD');if(d)d.onclick=()=>openElecPlan(S.draft)}}
 else if(pcTab==='prod'){const list=S.products.slice().reverse();
  body=`<table><tr><th></th><th>이름</th><th>종류</th><th>품질</th><th>값</th><th>재고</th><th>오늘 팔림</th><th>인기</th><th></th></tr>${list.map(p=>`<tr><td><img src="${thumbOf(p,48)}" width="48" height="48" style="border-radius:6px;display:block"></td><td><b>${esc(p.name)}</b>${S.act[p.dept]===p.id?'<br><span class="good">공장에서 만드는 중</span>':''}</td><td>${typeOf(p).n}</td><td>${p.q}점</td><td>${priceStr(p.price)}<br><button data-pr="${p.id}">값 바꾸기</button></td><td>${fmtN(p.stock)}</td><td>${fmtN(p.td||0)}</td><td>${pgBar(p.nov/1.3,'#d9aa5c')}</td>
   <td style="white-space:nowrap">${p.dept==='elec'?`<button data-run="${p.id}">켜 보기</button> <button data-v="${p.id}">새 버전</button>`:`<button data-fv="${p.id}">새 맛</button>`}${S.act[p.dept]!==p.id?` <button data-a="${p.id}">이것 만들기</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">아직 만든 제품이 없습니다.</td></tr>'}</table>
   <p class="muted">인기는 날이 갈수록 조금씩 떨어집니다(전자 제품은 빨리, 식품은 천천히). 새 제품이나 새 버전을 내면 다시 잘 팔립니다.</p>`;
  bind=c=>{on(c,'button[data-run]','click',el=>{const p=prodById(el.dataset.run);closeModal();openEditor(p.design,{run:true,title:p.name,body:p.color,dev:p.type,onClose:()=>openComputer('prod')})});
   on(c,'button[data-v]','click',el=>{const p=prodById(el.dataset.v);openElecPlan({type:p.type,hw:Object.assign({},p.hw),color:p.color,design:JSON.parse(JSON.stringify(p.design)),base:p.name,gen:(p.gen||1)+1})});
   on(c,'button[data-fv]','click',el=>{const p=prodById(el.dataset.fv);openFoodPlan(p)});
   on(c,'button[data-a]','click',el=>{const p=prodById(el.dataset.a);S.act[p.dept]=p.id;openComputer('prod')});
   on(c,'button[data-pr]','click',el=>{const p=prodById(el.dataset.pr);const v=prompt(p.name+'의 새 값 (원). 알맞은 값은 '+fmtN(p.fair)+'원 정도입니다.',p.price);const n=parseInt(String(v||'').replace(/[^0-9]/g,''));if(n>0){p.price=n;openComputer('prod')}})}}
 else if(pcTab==='res'){body=['elec','food','build'].map(d=>{const T=TECH[d],lv=S.tech[d],mx=lv>=T.max,need=mx?1:T.cost[lv+1],who=staffOf(T.who);
  return`<h3>${DEPT[d]} 기술 ${lv}단계</h3><p class="muted">지금 만들 수 있는 것: ${T.un.slice(1,lv+1).join(' · ')}</p>${mx?'<p class="good">최고 단계입니다.</p>':`<p>다음 단계: <b>${T.un[lv+1]}</b></p>${pgBar(S.res[d]/need)}<p class="muted">${ROLE[T.who].n} ${who.length}명이 연구 중 · 하루에 약 ${who.reduce((a,s)=>a+s.skill,0)*3}점 (필요 ${need}점, 지금 ${Math.floor(S.res[d])}점)${who.length?'':' — '+eul(ROLE[T.who].n)+' 뽑아야 연구가 됩니다'}</p>`}`}).join('')}
 else if(pcTab==='fac'){const g=grade(),nl=d=>S.lines[d].length;
  body=`<p class="muted">지금 회사 등급: <b>${g.n}</b> — 생산 라인 ${g.lines}개, 본사 ${g.floors}층까지 지을 수 있습니다. 직원이 늘면 등급이 오릅니다.</p>
  <table><tr><td><b>본사 건물</b><br><span class="muted">${S.floors}층 · 책상 ${allSeats().length}개 (사무직 ${S.staff.filter(s=>ROLE[s.role].office).length}명)</span></td><td>${S.floors<g.floors?`<button class="pri" id="aF">한 층 더 올리기 (${wonS(floorCost())})</button>`:'<span class="muted">지금 등급에서는 더 못 올림</span>'}</td></tr>
  ${['elec','food'].map(d=>`<tr><td><b>${FAC[d].name}</b><br><span class="muted">라인 ${nl(d)}개 · ${S.lines[d].map(v=>v+'단계').join(', ')}</span></td><td>${nl(d)<g.lines&&nl(d)<4?`<button class="pri" data-l="${d}">라인 늘리기 (${wonS(LINE_COST[nl(d)])})</button>`:'<span class="muted">'+(nl(d)>=4?'라인 자리가 꽉 찼습니다':'회사가 더 커지면 늘릴 수 있음')+'</span>'}<br><span class="muted">라인 단계 올리기는 공장 안 관리 컴퓨터에서</span></td></tr>`).join('')}
  <tr><td><b>건설 장비</b><br><span class="muted">${Object.keys(EQUIP).filter(k=>S.equip[k]).map(k=>EQUIP[k].n).join(', ')||'없음'}</span></td><td><span class="muted">건설 사무소에서 살 수 있습니다</span></td></tr></table>`;
  bind=c=>{const a=$('#aF');if(a)a.onclick=()=>{addFloor();openComputer('fac')};on(c,'button[data-l]','click',el=>{addLine(el.dataset.l);openComputer('fac')})}}
 else if(pcTab==='ad'){body=`<p class="muted">광고를 하면 인지도가 오릅니다. 인지도가 높을수록 모든 제품이 더 잘 팔리고, 실력 좋은 사람이 지원합니다. 지금 인지도 ${Math.round(S.rep)}</p>
  <table>${ADS.map(a=>`<tr><td><b>${a.n}</b><br><span class="muted">${a.days}일 동안 인지도 +${a.rep}</span></td><td>${won(a.cost)}</td><td><button class="pri" data-ad="${a.k}">시작</button></td></tr>`).join('')}</table>
  ${S.ads.length?'<p class="good">진행 중인 광고: '+S.ads.map(a=>ADS.find(x=>x.k===a.k).n+' ('+a.left+'일 남음)').join(', ')+'</p>':''}`;
  bind=c=>on(c,'button[data-ad]','click',el=>{runAd(el.dataset.ad);openComputer('ad')})}
 else{body=infoHTML();bind=c=>drawChart($('#chart'))}
 openModal(`<h2>사장 컴퓨터</h2><div class="sub">${esc(S.name)} · ${GRADE[S.grade].n} · 창업 ${S.day}일째 · 자금 ${won(S.money)}</div>${tabs}${body}<div class="acts"><button id="mClose">닫기</button></div>`,c=>{
  on(c,'.tabs button','click',el=>openComputer(el.dataset.t));$('#mClose').onclick=closeModal;if(bind)bind(c)},true)}
function infoHTML(){const g=GRADE[S.grade],ng=GRADE[S.grade+1],cnt={};for(const s of S.staff)cnt[s.role]=(cnt[s.role]||0)+1;const y=S.hist[S.hist.length-1];
 return`<div class="two"><div><div class="kv"><i>회사 등급</i><span>${g.n}${ng?' <span class="muted">(직원 '+ng.min+'명이면 '+ng.n+')</span>':''}</span><i>직원</i><span>${S.staff.length}명</span><i>자금</i><span>${won(S.money)}</span><i>오늘 매출</i><span>${won(S.today.rev)}</span><i>어제 매출</i><span>${y?won(y.rev):'-'}</span><i>지금까지 매출</i><span>${won(S.stats.rev)}</span><i>판 제품</i><span>${fmtN(S.stats.sold)}개</span><i>지은 건물</i><span>${S.built.length}채</span><i>인지도</i><span>${Math.round(S.rep)}</span></div></div>
