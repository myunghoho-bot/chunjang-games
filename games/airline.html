        <p>손님 ${r.pax}명 · 기분 ${r.mood}점</p>
        <p style="margin-top:8px">티켓 값 <b class="ok">+${money(r.ticket)}</b></p>
        <p>짐 값 <b class="ok">+${money(r.cargo)}</b></p>
        <p>기름값 <b class="bad">-${money(r.fuelCost)}</b></p>
        <p>서비스비(승무원·기내식) <b class="bad">-${money(r.svc||0)}</b></p>
        <p>착륙료 <b class="bad">-${money(r.landFee)}</b></p>
        ${r.damage?`<p>수리비 <b class="bad">-${money(r.damage)}</b></p>`:''}
        <p style="font-size:21px;margin-top:10px">합쳐서
          <b class="${r.net>=0?'ok':'bad'}">${r.net>=0?'+':''}${money(r.net)}</b></p>
      </div>
      <div class="card"><p>지금 돈 <b>${money(S.money)}</b> · 평판 <b>${Math.round(S.rep)}</b>
        · ${esc(p.nick)} 고장 <b>${Math.round(p.wear)}%</b></p></div>
      <div class="row" style="justify-content:center">
        <button class="g big" id="again">🛫 또 날기</button>
        <button class="big" id="home">🏢 본사로</button>
      </div>
    </div>`;
  document.getElementById('again').onclick = ()=>{
    if(r.planeIdx<0 || !S.planes[r.planeIdx]){ go('office'); return; }
    S.sel = r.planeIdx; go('route');
  };
  document.getElementById('home').onclick  = ()=> go('office');
  save();
}

/* =========================================================================
   9) 꼬리 그리기
   ========================================================================= */
const tailView = { col:1, painting:false };
function buildTail(){
  if(!S.tail) S.tail = emptyTail();
  $panel.className='hide'; $tools.className='';
  $tools.innerHTML =
    TAILPAL.map((c,i)=>`<button class="tool ${tailView.col===i?'on':''}" data-tc="${i}"
        style="width:34px;height:30px;background:${c};border:2px solid ${tailView.col===i?'#fff':'#24406e'}"></button>`).join('')
    + `<button class="tool ${tailView.col<0?'on':''}" data-tc="-1">지우개</button>`
    + `<div style="flex:1"></div>
       <button class="${S.nameOn?'g':'d'}" id="nOn">${S.nameOn?'✔ 이름 쓰는 중':'🔤 이름 쓰기'}</button>
       <button class="${S.tailOn?'g':'d'}" id="tOn">${S.tailOn?'✔ 내 그림 쓰는 중':'내 그림 쓰기'}</button>
       <button class="d" id="tClr">전부 지우기</button>
       <button class="g" id="tDone">다 그렸어! ✔</button>`;
  $tools.querySelectorAll('[data-tc]').forEach(b=> b.onclick=()=>{ tailView.col=+b.dataset.tc; buildTail(); });
  document.getElementById('tOn').onclick = ()=>{ S.tailOn = !S.tailOn; buildTail(); };
  document.getElementById('nOn').onclick = ()=>{ S.nameOn = !S.nameOn; buildTail(); };
  document.getElementById('tClr').onclick = ()=>{ S.tail = emptyTail(); };
  document.getElementById('tDone').onclick = ()=>{ S.tailOn = true; save(); go('office'); };
}
function tailGeom(){
  const cell = clamp(Math.min((H-230)/TAILH, 44), 20, 44);
  const gw = cell*TAILW, gh = cell*TAILH;
  return { cell, gw, gh, x0: Math.round(W*0.30 - gw/2), y0: Math.round(52+40) };
}
function drawTailScreen(){
  const g = tailGeom();
  ctx.fillStyle='#0d1c33'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#eaf2ff'; ctx.font='bold 20px sans-serif';
  ctx.fillText('🎨 꼬리날개에 우리 항공사 마크를 그려 봐', 24, 84);
  // 격자
  for(let r=0;r<TAILH;r++) for(let c=0;c<TAILW;c++){
    const x=g.x0+c*g.cell, y=g.y0+r*g.cell, v=S.tail[r][c];
    ctx.fillStyle = (v<0) ? ((r+c)%2 ? '#16294a':'#12223e') : TAILPAL[v];
    ctx.fillRect(x,y,g.cell,g.cell);
    ctx.strokeStyle='rgba(140,170,210,.22)'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,g.cell-1,g.cell-1);
  }
  // 미리보기 — 진짜 비행기에 붙은 모습
  const px = W*0.72, py = H*0.52;
  const on = S.tailOn; S.tailOn = true;                  // 미리보기는 항상 내 그림으로
  drawPlaneSide(px, py, clamp(W*0.34, 260, 460), TYPES[4], {gear:true, paxLit:true});
  S.tailOn = on;
  ctx.fillStyle='#9db4d4'; ctx.font='14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('이렇게 붙어! (모든 비행기 꼬리에 다 붙는다)', px, py+120); ctx.textAlign='left';
}
function tailClick(mx,my){
  const g = tailGeom();
  const c = Math.floor((mx-g.x0)/g.cell), r = Math.floor((my-g.y0)/g.cell);
  if(c<0||r<0||c>=TAILW||r>=TAILH) return;
  S.tail[r][c] = tailView.col;
}

/* =========================================================================
   10) 세계 지도 — 지금 나는 비행기가 다 보인다
   ========================================================================= */
function mapGeom(){
  const top = 52+46, bot = H-70;
  return { top, bot, cy:(top+bot)/2, hh:(bot-top)/2, cx:W/2, hw:W/2-40 };
}
function mapXY(lon, lat){
  const g = mapGeom();
  let rel = ((lon - HOME.lon + 540) % 360) - 180;      // 서울이 가운데
  return { x: g.cx + rel/180*g.hw, y: g.cy - lat/90*g.hh };
}
function buildMap(){
  $panel.className='hide'; $tools.className='';
  $tools.innerHTML = `<span class="st">🗺 세계 지도 — 지금 하늘에 ${S.flights.length}대</span>
    <span class="mini">비행기를 누르면 그 비행기를 구경할 수 있어</span>
    <div style="flex:1"></div>
    <button class="d" id="mSpd">⏩ 빠르기 ${S.watchSpeed}배</button>
    <button class="d" id="mBack">🏢 본사로</button>`;
  document.getElementById('mSpd').onclick = ()=>{ cycleSpeed(); buildMap(); blurBtn(); };
  document.getElementById('mBack').onclick = ()=> go('office');
}
function flightPos(f){
  const to = CITY[f.route.to] || CITY['가까운 공항'];
  const a = mapXY(HOME.lon, HOME.lat), b = mapXY(to[0], to[1]);
  const u = clamp(f.dist/f.route.dist, 0, 1);
  const mx0 = (a.x+b.x)/2, my0 = (a.y+b.y)/2;
  const dx = b.x-a.x, dy = b.y-a.y;
  const ctrl = { x: mx0 - dy*0.13, y: my0 + dx*0.13 };     // 살짝 휜 항로
  const q = (p0,p1,p2,t)=> (1-t)*(1-t)*p0 + 2*(1-t)*t*p1 + t*t*p2;
  const x = q(a.x,ctrl.x,b.x,u), y = q(a.y,ctrl.y,b.y,u);
  const t2 = Math.min(1, u+0.02);
  const x2 = q(a.x,ctrl.x,b.x,t2), y2 = q(a.y,ctrl.y,b.y,t2);
  return {x, y, a, b, ctrl, u, ang: Math.atan2(y2-y, x2-x)};
}
function drawMapScreen(){
  const g = mapGeom();
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#071426'); sky.addColorStop(1,'#0d2a44');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#123a5e'; roundRect(20, g.top, W-40, g.bot-g.top, 14); ctx.fill();
  ctx.strokeStyle='#2d5f8a'; ctx.lineWidth=2; ctx.stroke();
  ctx.save(); roundRect(20, g.top, W-40, g.bot-g.top, 14); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  for(let lon=-180; lon<=180; lon+=30){ const q=mapXY(lon+HOME.lon,0);
    ctx.beginPath(); ctx.moveTo(q.x,g.top); ctx.lineTo(q.x,g.bot); ctx.stroke(); }
  for(let lat=-60; lat<=60; lat+=30){ const q=mapXY(HOME.lon,lat);
    ctx.beginPath(); ctx.moveTo(20,q.y); ctx.lineTo(W-20,q.y); ctx.stroke(); }
  LANDS.forEach(function(L){
    const lon=L[0], lat=L[1], rx=L[2], ry=L[3], rot=L[4];
    [-360,0,360].forEach(function(off){
      const c = mapXY(lon+off, lat);
      const r1 = rx/180*g.hw, r2 = ry/90*g.hh;
      if(c.x + r1 < 0 || c.x - r1 > W) return;
      ctx.fillStyle='#2f7a4a'; ctx.beginPath();
      ctx.ellipse(c.x, c.y, r1, r2, rot, 0, 7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.07)'; ctx.beginPath();
      ctx.ellipse(c.x, c.y-r2*0.25, r1*0.86, r2*0.5, rot, 0, 7); ctx.fill();
    });
  });
  Object.keys(CITY).forEach(function(n){
    if(n==='가까운 공항') return;
    const c = CITY[n], q = mapXY(c[0], c[1]);
    ctx.fillStyle='#0f2136'; ctx.beginPath(); ctx.arc(q.x,q.y,4.5,0,7); ctx.fill();
    ctx.fillStyle='#cfe0f5'; ctx.beginPath(); ctx.arc(q.x,q.y,2.6,0,7); ctx.fill();
    ctx.fillStyle='rgba(210,228,248,.78)'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText(n, q.x, q.y-9); ctx.textAlign='left';
  });
  const hp = mapXY(HOME.lon, HOME.lat);
  ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(hp.x,hp.y,7,0,7); ctx.fill();
  ctx.fillStyle='#0f2136'; ctx.beginPath(); ctx.arc(hp.x,hp.y,3,0,7); ctx.fill();
  mapLabel(S.name+' 공항', hp.x, hp.y+26, '#ffd23f');

  S.flights.forEach(function(f){
    const q = flightPos(f);
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(q.a.x,q.a.y); ctx.quadraticCurveTo(q.ctrl.x,q.ctrl.y,q.b.x,q.b.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = (f===F) ? '#ffd23f' : '#7be08a'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(q.a.x,q.a.y);
    const steps = 24;
    for(let i=1;i<=steps;i++){
      const tt = q.u*i/steps;
      const xx=(1-tt)*(1-tt)*q.a.x+2*(1-tt)*tt*q.ctrl.x+tt*tt*q.b.x;
      const yy=(1-tt)*(1-tt)*q.a.y+2*(1-tt)*tt*q.ctrl.y+tt*tt*q.b.y;
      ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.ang);
    ctx.fillStyle = (f===F) ? '#ffd23f' : '#eaf2ff';
    ctx.beginPath();
    ctx.moveTo(13,0); ctx.lineTo(-4,5); ctx.lineTo(-1,0); ctx.lineTo(-4,-5);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(-2,-9,3,18);
    ctx.restore();
    mapLabel(f.p.nick+' '+Math.round(q.u*100)+'%', q.x, q.y-16, (f===F)?'#ffd23f':'#cfe0f5');
  });
  ctx.restore();

  if(!S.flights.length){
    ctx.fillStyle='#9db4d4'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('지금 하늘에 뜬 비행기가 없어 — 본사에서 한 대 띄워 봐!', W/2, g.cy); ctx.textAlign='left';
  }
  ctx.fillStyle='#eaf2ff'; ctx.font='bold 20px sans-serif';
  ctx.fillText('🗺 세계 지도', 24, 84);
}
function mapLabel(txt, x, y, col){
  ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  const w = ctx.measureText(txt).width + 12;
  ctx.fillStyle='rgba(6,16,32,.78)'; roundRect(x-w/2, y-13, w, 18, 6); ctx.fill();
  ctx.fillStyle=col; ctx.fillText(txt, x, y); ctx.textAlign='left';
}
function mapClick(mx,my){
  let best=null, bd=1e9;
  S.flights.forEach(function(f){
    const q = flightPos(f);
    const d = Math.hypot(q.x-mx, q.y-my);
    if(d<bd){ bd=d; best=f; }
  });
  if(best && bd < 34) watchFlight(best);
}

/* =========================================================================
   본사 배경 그림
   ========================================================================= */
function drawOfficeScreen(){
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0d2247'); sky.addColorStop(0.6,'#2d6ea8'); sky.addColorStop(1,'#8fc4e8');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  const gy = H*0.66;
  ctx.fillStyle='#4c8f57'; ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#3b4450'; ctx.fillRect(0,gy+60,W,70);
  ctx.fillStyle='#e8eef7';
  for(let i=0;i<26;i++) ctx.fillRect(i*80 - (S.tick*0.4)%80, gy+92, 34, 5);
  // 터미널
  ctx.fillStyle='#8496ad'; roundRect(W*0.05, gy-70, 300, 70, 8); ctx.fill();
  ctx.fillStyle='#c8d6e8';
  for(let i=0;i<10;i++) ctx.fillRect(W*0.05+14+i*28, gy-56, 18, 26);
  ctx.fillStyle='#6e7d92'; ctx.fillRect(W*0.05+140, gy-110, 12, 42);
  ctx.fillStyle='#eaf2ff'; ctx.font='bold 16px sans-serif';
  ctx.fillText(S.name+' 공항', W*0.05+16, gy-16);
  // 주기된 비행기들 (하늘에 뜬 건 빼고)
  const list = S.planes.filter(p=>!S.flights.some(f=>f.p===p)).slice(0,4);
  const ax0 = W*0.30, ax1 = Math.max(ax0+200, W-390);   // 오른쪽은 정보칸이 덮으니 비워 둔다
  const step = (ax1-ax0)/Math.max(1,list.length);
  list.forEach((p,i)=>{
    const t = typeOf(p.type);
    const L = Math.min(step*1.35, clamp(W*0.11,95,200)*(0.7 + t.rows/30));
    drawPlaneSide(ax0 + step*(i+0.5), gy+72, L, t, {gear:true, paxLit:true});
  });
  // 하늘에는 지금 운항 중인 비행기들이 지나간다
  S.flights.slice(0,4).forEach((f,i)=>{
    const x = ((S.tick*1.6 + i*430)%(W+500)) - 250;
    const y = H*0.14 + i*54;
    drawPlaneSide(x, y, 84, f.t, {gear:false, rot:-0.05, paxLit:true});
    ctx.fillStyle='rgba(8,20,38,.65)'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    const label = f.p.nick+' → '+f.route.to;
    const tw = ctx.measureText(label).width+14;
    roundRect(x-tw/2, y+22, tw, 18, 6); ctx.fill();
    ctx.fillStyle='#cfe0f5'; ctx.fillText(label, x, y+35); ctx.textAlign='left';
  });
}
function drawShopScreen(){
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#08152b'); sky.addColorStop(1,'#123055');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
}

/* =========================================================================
   메인 루프
   ========================================================================= */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  S.tick += dt*60;
  try{
    // 하늘에 떠 있는 비행기는 어느 화면에 있든 계속 날아간다
    if(S.flights && S.flights.length){
      const n = clamp(S.watchSpeed||1, 1, 4);
      for(let i=0;i<n;i++) S.flights.forEach(f=> updateFlight(f, dt));
      purgeFlights();
      if(S.screen==='flight' && S.tick%90 < 1) buildFlightTools();   // 진행률 가끔 새로 고침
    }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);
    switch(S.screen){
      case 'title':  drawTitleScreen(); break;
      case 'office': drawOfficeScreen(); break;
      case 'shop':   drawShopScreen(); break;
      case 'seat':   drawSeatScreen(); break;
      case 'route':  drawShopScreen(); break;
      case 'cargo':  drawCargoScreen(); break;
      case 'flight': if(F) drawFlight(); else drawShopScreen(); break;
      case 'result': drawShopScreen(); break;
      case 'tail':   drawTailScreen(); break;
      case 'map':    drawMapScreen(); break;
    }
  }catch(e){
    // 여기서 멈추면 게임 전체가 멈춘다 — 화면에 알려만 주고 계속 돈다
    console.error(e);
    ctx.fillStyle='#2a0b0b'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle='#ff9c9c'; ctx.font='14px sans-serif';
    ctx.fillText('앗! 문제가 생겼어: '+e.message, 12, H-15);
  }
}
function drawTitleScreen(){
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#06122a'); sky.addColorStop(0.6,'#1b4a7d'); sky.addColorStop(1,'#4d90c4');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.55)';
  for(let i=1;i<70;i++) ctx.fillRect((i*7919)%W, (i*104729)%Math.round(H*0.55), 2, 2);
  const x = (S.tick*1.2)%(W+600) - 300;
  drawPlaneSide(x, H*0.80, 220, TYPES[2], {gear:false, paxLit:true, rot:-0.04});
}
requestAnimationFrame(loop);

/* =========================================================================
   마우스
   ========================================================================= */
function pos(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height) };
}
cv.addEventListener('mousedown', e=>{
  const p = pos(e);
  if(S.screen==='tail'){ tailView.painting = true; tailClick(p.x,p.y); }
  if(S.screen==='map'){ mapClick(p.x,p.y); }
  if(S.screen==='seat'){ seatView.painting = true; seatClick(p.x,p.y,false); }
  if(S.screen==='cargo'){ C.mx=p.x; C.my=p.y; cargoDown(p.x,p.y); }
});
cv.addEventListener('mousemove', e=>{
  const p = pos(e);
  if(S.screen==='tail' && tailView.painting) tailClick(p.x,p.y);
  if(S.screen==='seat' && seatView.painting) seatClick(p.x,p.y,true);
  if(S.screen==='cargo'){ C.mx=p.x; C.my=p.y; }
});
addEventListener('mouseup', ()=>{
  seatView.painting = false; tailView.painting = false;
  if(S.screen==='cargo' && C && C.drag) cargoUp();
});
cv.addEventListener('wheel', e=>{
  if(S.screen==='seat'){ e.preventDefault(); seatView.scroll += e.deltaY*0.6; }
}, {passive:false});
cv.addEventListener('contextmenu', e=>{
  e.preventDefault();
  if(S.screen==='seat'){ const p=pos(e); const old=seatView.tool; seatView.tool='X'; seatClick(p.x,p.y,false); seatView.tool=old; }
});

/* 시작 */
go('title');
window.go = go; window.resize = resize;   // 확인용 (S 는 그냥 전역 변수라 콘솔에서 바로 보인다)
</script>
