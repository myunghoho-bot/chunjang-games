<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>별의 일생 시뮬레이터</title>
<style>
:root{--bg:#f6f5f1;--fg:#1c1c1a;--mut:#65645d;--card:#fff;--bd:#dcdad2;--ac:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

h1{font-size:20px;font-weight:500;margin:4px 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px;font-size:13px;align-items:center}
.opts label{display:flex;align-items:center;gap:5px}
.opts select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
canvas{width:100%;height:auto;display:block;border-radius:12px;background:#0a0e1f}
.chips{display:flex;gap:6px;margin:12px 0;overflow-x:auto}

.chips button.on{color:var(--fg);border-color:var(--ac);font-weight:500}
.cap{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.cap h2{font-size:16px;font-weight:500;margin:0 0 4px}
.cap p{margin:0;font-size:14px}
.cap small{display:block;margin-top:6px;color:var(--mut);font-size:12px}
.ctl{display:flex;gap:8px;align-items:center;margin-top:12px}
.ctl button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
.ctl input{flex:1;accent-color:var(--ac)}
.note{font-size:12px;color:var(--mut);margin-top:10px}
</style></head><body><main>
<h1>별의 일생 시뮬레이터</h1>

<label>행성 수 <select id="pn"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label>

<label><input type="checkbox" id="ey" checked>눈</label>
<label><input type="checkbox" id="bb" checked>말풍선</label>
</div>
<canvas id="c" width="680" height="380" role="img" aria-label="별이 태어나 행성과 함께 늙어가며 백색왜성이 되는 과정을 보여주는 애니메이션"></canvas>
<div class="chips" id="chips"></div>
<div class="cap"><h2 id="ct"></h2><p id="cd"></p><small id="cm"></small></div>
<div class="ctl"><button id="pp">일시정지</button><button id="rs">처음부터</button><input id="sl" type="range" min="0" max="300" value="0" aria-label="시간"></div>
<div class="note">전체 약 5분이고, 시간 축은 단계마다 크게 압축되어 있어요. 별 유형, 행성 수, 생명체를 바꾸거나 "처음부터"를 누르면 새로 뽑은 확률로 다시 재생돼요(행성 포획·충돌, 삼켜진 행성이 핵만 남는 크톤 행성 10%). 골디락스 존에서 벗어나 너무 뜨겁거나 추워지면 생명체가 멸종하고, 초신성 뒤에는 중성자별이나 블랙홀과 성운이 남아 새 별이 태어나요. 생명체, 다이슨 스피어, 청색왜성은 영상의 가정이고, M형 왜성의 팽창은 연출이에요.</div>
</main>

const mk=d=>{const r=[];nonB.forEach(v=>{if(v.k==='gas')return;const hs=nonB.filter(h=>h!==v&&h.r>v.r&&Math.abs(h.x-v.x)<=d);if(hs.length)r.push([v,hs.reduce((a,b)=>Math.abs(b.x-v.x)<Math.abs(a.x-v.x)?b:a)])});return r.sort(()=>Math.random()-.5)};
const pick=(v,h)=>{if(vics.has(v)||hosts.has(v)||vics.has(h))return;vics.add(v);hosts.add(h);const i=cnt.get(h)||0;cnt.set(h,i+1);v.ev={t:Math.random()<.5?'cap':'col',h,u:13.5+Math.random()*2.5,i,d:Math.random()<.5?'ring':'moon'}};
