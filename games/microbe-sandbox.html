<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미생물 샌드박스</title>
<style>
:root{--bg:#0b111c;--panel:#141f31;--panel2:#1b2a42;--line:#2b3d5a;--text:#e6eefb;--dim:#93a6c4;--acc:#5ad1ff;--good:#7be37b;--warn:#ffcf5a;--bad:#ff7a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;overflow:hidden;user-select:none}
#app{display:grid;grid-template-columns:214px 1fr 280px;height:100vh}
.panel{background:var(--panel);overflow-y:auto;padding:10px;border-right:1px solid var(--line)}
#right{border-right:none;border-left:1px solid var(--line)}
h1{font-size:18px;margin:2px 0 10px}
h2{font-size:13px;color:var(--dim);margin:14px 0 6px;font-weight:normal;letter-spacing:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.btn{background:var(--panel2);border:2px solid var(--line);color:var(--text);border-radius:9px;padding:6px 4px;font-size:12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.btn:hover{border-color:#456}
.btn.on{border-color:var(--acc);background:#1d3a55;box-shadow:0 0 8px #5ad1ff55}
.btn canvas{width:40px;height:40px}
.btn .em{font-size:20px;line-height:24px}
.btn .x{position:absolute;top:1px;right:4px;font-size:11px;color:var(--dim)}
.btn .x:hover{color:var(--bad)}
.wide{width:100%;flex-direction:row;justify-content:center;padding:8px;font-size:13px;margin-top:6px}
label.sl{display:block;font-size:12px;margin:8px 0 2px;color:var(--dim)}
label.sl b{color:var(--text);float:right;font-weight:normal}
input[type=range]{width:100%;accent-color:var(--acc)}
#center{display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .btn{flex-direction:row;padding:5px 9px;font-size:13px}
select{background:var(--panel2);color:var(--text);border:2px solid var(--line);border-radius:8px;padding:5px;font-family:inherit;font-size:13px}
#clock{margin-left:auto;font-size:12px;color:var(--dim)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;display:block;cursor:crosshair}
#toasts{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:60%}
.toast{background:#0f1a2bdd;border:1px solid var(--line);border-left:4px solid var(--acc);padding:7px 10px;border-radius:8px;font-size:13px;animation:fin .3s}
@keyframes fin{from{opacity:0;transform:translateY(-6px)}}
#hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px #000}
#poplist .row{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0}
#poplist canvas{width:22px;height:22px;flex:none}
#poplist .nm{flex:1}
#poplist .bar{height:5px;border-radius:3px;margin-top:2px}
#poplist .sub{color:var(--dim);font-size:11px}
#graph{width:100%;height:120px;background:#0d1626;border-radius:8px;display:block}
#card{background:var(--panel2);border-radius:10px;padding:9px;font-size:12px;min-height:60px}
#card .gene{display:flex;align-items:center;gap:6px;margin:3px 0}
#card .gene span{width:78px;color:var(--dim)}
#card .gene i{flex:1;height:7px;background:#0d1626;border-radius:4px;overflow:hidden;display:block}
#card .gene i b{display:block;height:100%;border-radius:4px}
#card .acts{display:flex;gap:5px;margin-top:7px}
#card .acts .btn{flex:1;flex-direction:row;justify-content:center;padding:5px;font-size:12px}
#news{font-size:12px;color:var(--dim);line-height:1.5}
#news div{border-bottom:1px dashed #2b3d5a;padding:3px 0}
#news div:first-child{color:var(--text)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
#modal.show{display:flex}
#ed{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;width:min(560px,94vw);max-height:94vh;overflow:auto}
#ed h3{margin:0 0 10px}
#ed .cols{display:grid;grid-template-columns:170px 1fr;gap:14px}
#edPrev{width:170px;height:170px;background:#0d1626;border-radius:12px}
#ed input[type=text]{width:100%;background:var(--panel2);color:var(--text);border:2px solid var(--line);border-radius:8px;padding:6px;font-family:inherit;font-size:14px}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.shapes .btn canvas{width:32px;height:32px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:5px 0}
.edBtns{display:flex;gap:8px;margin-top:12px}
.edBtns .btn{flex:1;flex-direction:row;justify-content:center;padding:9px;font-size:14px}
#edInfo{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="panel" id="left">
    <h1>🔬 미생물 샌드박스</h1>
    <h2>미생물 넣기</h2>
    <div class="grid2" id="spBtns"></div>
    <button class="btn wide" id="newSp">✏️ 나만의 미생물 만들기</button>
    <h2>도구</h2>
    <div class="grid2" id="toolBtns"></div>
    <label class="sl">붓 크기 <b id="brushV"></b></label>
    <input type="range" id="brush" min="8" max="160" value="45">
    <label class="sl">한 번에 넣는 수 <b id="perV"></b></label>
    <input type="range" id="per" min="1" max="30" value="5">
  </div>

  <div id="center">
    <div id="top">
      <button class="btn" id="pauseB">⏸ 멈춤</button>
      <button class="btn spd" data-s="1">1배</button>
      <button class="btn spd" data-s="2">2배</button>
      <button class="btn spd" data-s="4">4배</button>
      <button class="btn spd" data-s="8">8배</button>
      <select id="preset"></select>
      <button class="btn" id="startB">▶ 시작</button>
      <button class="btn" id="fitB">🔍 전체 보기</button>
      <span id="clock"></span>
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="toasts"></div>
      <div id="hint">왼쪽 클릭: 도구 쓰기 · 휠: 확대/축소 · 오른쪽 끌기: 화면 옮기기 · 스페이스: 멈춤</div>
    </div>
  </div>

  <div class="panel" id="right">
    <h2>접시 환경</h2>
    <label class="sl">🌡 온도 <b id="tempV"></b></label>
    <input type="range" id="temp" min="0" max="100" value="25">
    <label class="sl">☀️ 햇빛 <b id="sunV"></b></label>
    <input type="range" id="sun" min="0" max="100" value="60">
    <label class="sl">🍯 자연 영양분 <b id="supV"></b></label>
    <input type="range" id="sup" min="0" max="300" value="100">
    <label class="sl">🧬 돌연변이 <b id="mutV"></b></label>
    <input type="range" id="mut" min="0" max="300" value="100">
    <h2>몇 마리? <span id="total"></span></h2>
    <div id="poplist"></div>
    <canvas id="graph"></canvas>
    <h2>자세히 보기 (🔎 도구로 클릭)</h2>
    <div id="card">🔎 돋보기 도구로 미생물을 클릭해 봐!</div>
    <h2>소식</h2>
    <div id="news"></div>
  </div>
</div>

<div id="modal"><div id="ed">
  <h3>✏️ 나만의 미생물 만들기</h3>
  <div class="cols">
    <div>
      <canvas id="edPrev" width="340" height="340"></canvas>
      <div id="edInfo"></div>
    </div>
    <div>
      <label class="sl">이름</label>
      <input type="text" id="edName" maxlength="10" value="반짝이균">
      <label class="sl">모양</label>
      <div class="shapes" id="edShapes"></div>
      <label class="sl">색깔 <b id="edHueV"></b></label>
      <input type="range" id="edHue" min="0" max="359" value="330">
      <label class="sl">크기 <b id="edSizeV"></b></label>
      <input type="range" id="edSize" min="2" max="40" value="6">
      <label class="sl">빠르기 <b id="edSpdV"></b></label>
      <input type="range" id="edSpd" min="5" max="200" value="60">
      <div id="edFood">
        <label class="sl">먹는 것</label>
        <div class="chk"><input type="checkbox" id="edNutr" checked>🍯 영양분 먹기</div>
        <div class="chk"><input type="checkbox" id="edLight">☀️ 햇빛으로 영양분 만들기</div>
        <div class="chk"><input type="checkbox" id="edHunt">🦷 자기보다 작은 미생물 잡아먹기</div>
        <label class="sl">번식 <b id="edRepV"></b></label>
        <input type="range" id="edRep" min="1" max="3" value="2">
      </div>
      <label class="sl">더위 견딤 <b id="edHeatV"></b></label>
      <input type="range" id="edHeat" min="30" max="120" value="45">
      <div class="chk"><input type="checkbox" id="edProk" checked>🦠 세균 종류 (항생제·바이러스에 약함)</div>
    </div>
  </div>
  <div class="edBtns">
    <button class="btn" id="edCancel">취소</button>
    <button class="btn on" id="edOk">✅ 만들기!</button>
  </div>
</div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = () => Math.random();
const hasBatchim = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c <= 11171 && c % 28 !== 0; };
const iga = w => w + (hasBatchim(w) ? '이' : '가'), eulreul = w => w + (hasBatchim(w) ? '을' : '를');

// ───────── 세계 ─────────
const WORLD = 1000, CX = 500, CY = 500, DR = 480;
const G = 100, CS = WORLD / G;               // 환경 칸 (영양분·빛·온도·항생제)
const nut = new Float32Array(G * G), lit = new Float32Array(G * G);
const heat = new Float32Array(G * G), anti = new Float32Array(G * G);
const tmpF = new Float32Array(G * G), mask = new Uint8Array(G * G);
let crowd = new Uint16Array(0), spCnt = new Uint16Array(0);                // 칸마다 같은 종 몇 마리인지 (사냥꾼끼리 먹이 다툼)
for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) {
  const dx = (x + 0.5) * CS - CX, dy = (y + 0.5) * CS - CY;
  mask[y * G + x] = dx * dx + dy * dy < (DR + CS) * (DR + CS) ? 1 : 0;
}
const CAP = 4000;                            // 접시에 들어가는 최대 수
const VCAP = 1200; let virusN = 0;           // 바이러스는 따로 최대 수
const GC = 50, GN = WORLD / GC;              // 생물 찾기용 칸
const head = new Int32Array(GN * GN);
const photoCnt = new Uint16Array(GN * GN);    // 칸마다 햇빛 먹는 미생물 수 (서로 그늘을 만듦)
let nxt = new Int32Array(CAP * 2);

let orgs = [], born = [], T = 0, nextId = 1;
let paused = false, speed = 1;
let globalT = 25, sun = 0.6, supply = 1, mutRate = 1;

const cellOf = (x, y) => clamp((y / CS) | 0, 0, G - 1) * G + clamp((x / CS) | 0, 0, G - 1);
const lightAt = ci => clamp(sun + lit[ci], 0, 1.6);

// ───────── 미생물 종류 ─────────
const BUILTIN = [
  { id: 'bact', name: '세균', shape: 'rod', hue: 95, sat: 60, lum: 55, size: 3, speed: 0.6, nutr: 0.03, light: 0, hunt: false, metab: 0.01, divE: 3.5, life: 3000, prok: true, heatMax: 48,
    desc: '영양분을 먹고 엄청 빨리 둘로 나뉘어. 항생제와 바이러스에 약해.' },
  { id: 'cyano', name: '남조류', shape: 'coccus', hue: 155, sat: 65, lum: 42, size: 3.5, speed: 0.12, nutr: 0, light: 0.03, hunt: false, metab: 0.008, divE: 4, life: 4000, prok: true, heatMax: 62,
    desc: '햇빛으로 스스로 영양분을 만들어. 지구에 산소를 처음 만든 생물이야!' },
  { id: 'eug', name: '유글레나', shape: 'flag', hue: 115, sat: 65, lum: 45, size: 8, speed: 0.8, nutr: 0.012, light: 0.035, hunt: false, metab: 0.014, divE: 10, life: 5000, heatMax: 40,
    desc: '빨간 눈점으로 빛을 찾아 헤엄쳐 가. 식물이랑 동물 중간이야.' },
  { id: 'amoeba', name: '아메바', shape: 'amoeba', hue: 200, sat: 35, lum: 72, size: 14, speed: 0.3, nutr: 0.004, light: 0, hunt: true, sense: 90, metab: 0.02, divE: 26, life: 9000, heatMax: 42,
    desc: '몸 모양을 바꾸며 기어가서 작은 생물을 감싸서 먹어.' },
  { id: 'para', name: '짚신벌레', shape: 'cilia', hue: 40, sat: 60, lum: 70, size: 12, speed: 1.1, nutr: 0, light: 0, hunt: true, sense: 110, metab: 0.018, divE: 26, life: 8000, heatMax: 40,
    desc: '온몸의 털(섬모)로 빠르게 헤엄치며 세균을 먹어.' },
  { id: 'virus', name: '바이러스', shape: 'virus', hue: 300, sat: 75, lum: 65, size: 1.6, speed: 0.25, virus: true, life: 700, heatMax: 60,
    desc: '혼자서는 못 살아. 세균 몸에 들어가서 자기를 잔뜩 복사해.' },
  { id: 'tardi', name: '물곰', shape: 'tardi', hue: 28, sat: 40, lum: 68, size: 36, speed: 0.35, nutr: 0, light: 0, hunt: true, sense: 170, metab: 0.08, divE: 300, life: 30000, heatMax: 150, tough: true,
    desc: '다리 8개! 엄청 튼튼해서 끓는 물에서도 버티고, 배고프면 술통처럼 쪼그라들어 잠을 자.' },
];
let SPECIES = [];
const SPMAP = {};
function addSpecies(sp) {
  SPECIES.push(sp); SPMAP[sp.id] = sp; sp.ix = SPECIES.length - 1;
  sp.st = { n: 0, maxGen: 0, ares: 0, vres: 0, pow: 0, ever: false, peak: 0, ms: {} };
}
BUILTIN.forEach(addSpecies);

// 나만의 미생물: 모양·크기·빠르기에서 나머지 값을 계산
function buildCustom(d) {
  const s = d.size, isV = d.shape === 'virus';
  const repF = [0, 1.5, 1, 0.65][d.rep];
  const sp = {
    id: d.id, name: d.name, custom: true, shape: d.shape, hue: d.hue, sat: 70, lum: 58, size: isV ? Math.min(s, 3) : s,
    speed: d.spd, virus: isV, prok: !isV && d.prok, heatMax: d.heat, life: isV ? 900 : Math.round(2500 + s * 500),
    nutr: !isV && d.nutr ? 0.015 * Math.pow(s, 0.6) : 0,
    light: !isV && d.light ? 0.012 * Math.pow(s, 0.7) : 0,
    hunt: !isV && d.hunt, sense: 40 + s * 4,
    metab: 0.004 * Math.pow(s, 0.9) * (0.6 + 0.5 * d.spd),
    divE: Math.pow(s, 1.3) * repF,
    tough: d.shape === 'tardi' && d.heat >= 100,
    desc: '내가 만든 미생물!', data: d,
  };
  if (!sp.nutr && !sp.light && !sp.hunt && !isV) sp.nutr = 0.01; // 아무것도 안 먹으면 바로 굶으니까
  return sp;
}
function loadCustoms() {
  try {
    const arr = JSON.parse(localStorage.getItem('microbeSandboxCustom') || '[]');
    arr.forEach(d => addSpecies(buildCustom(d)));
  } catch (e) {}
}
function saveCustoms() {
  try { localStorage.setItem('microbeSandboxCustom', JSON.stringify(SPECIES.filter(s => s.custom).map(s => s.data))); } catch (e) {}
}

// ───────── 생물 만들기 / 유전자 ─────────
function baseGenes() { return { size: 1, spd: 1, hue: 0, ares: 0, vres: 0, ht: 0, pow: 0 }; }
function mutate(g) {
  const m = mutRate, n = () => (rnd() - 0.5) * m;
  const c = {
    size: clamp(g.size + n() * 0.06, 0.6, 1.8), spd: clamp(g.spd + n() * 0.1, 0.4, 2.2),
    hue: clamp(g.hue + n() * 8, -70, 70), ares: clamp(g.ares + n() * 0.08, 0, 1),
    vres: clamp(g.vres + n() * 0.08, 0, 1), ht: clamp(g.ht + n() * 1.6, 0, 40), pow: clamp(g.pow + n() * 0.06, 0, 1),
  };
  if (rnd() < 0.012 * m) { // 가끔 큰 돌연변이
    const k = ['ares', 'vres', 'ht', 'pow', 'spd'][(rnd() * 5) | 0];
    c[k] = clamp(c[k] + (k === 'ht' ? 6 : 0.3), 0, k === 'ht' ? 40 : k === 'spd' ? 2.2 : 1);
  }
  return c;
}
function colorOf(o) {
  const sp = o.sp, h = sp.hue + o.g.hue;
  o.col = `hsl(${h},${sp.sat}%,${sp.lum}%)`;
  o.col2 = `hsl(${h},${sp.sat}%,${Math.max(15, sp.lum - 25)}%)`;
  o.colA = `hsla(${h},${sp.sat}%,${sp.lum}%,0.55)`;
}
function makeOrg(sp, x, y, g, gen, E) {
  const o = {
    id: nextId++, sp, x, y, a: rnd() * TAU, g: g || baseGenes(), gen: gen || 1, age: 0,
    E: E != null ? E : (sp.divE || 1) * (0.35 + rnd() * 0.3), inf: 0, vsp: null, vg: null,
    dig: 0, tgt: null, tun: false, dead: false, cause: '', lifeMax: sp.life * (0.7 + rnd() * 0.6),
  };
  colorOf(o);
  return o;
}
function randInDish(x, y, rad) {
  for (let k = 0; k < 20; k++) {
    const a = rnd() * TAU, d = Math.sqrt(rnd()) * rad;
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    if ((px - CX) ** 2 + (py - CY) ** 2 < (DR - 5) ** 2) return [px, py];
  }
  return null;
}
function spawn(sp, x, y, rad, n) {
  let c = 0;
  for (let k = 0; k < n && orgs.length + born.length < CAP; k++) {
    const p = randInDish(x, y, rad); if (!p) continue;
    born.push(makeOrg(sp, p[0], p[1])); c++;
  }
  flushBorn();
  return c;
}
function flushBorn() { if (born.length) { for (const b of born) orgs.push(b); born.length = 0; } }

function kill(o, cause, by, noNut) {
  if (o.dead) return;
  o.dead = true; o.cause = cause; o.by = by || null;
  if (!by && !noNut && !o.sp.virus) { // 죽으면 영양분으로 돌아감
    const ci = cellOf(o.x, o.y);
    nut[ci] = Math.min(4, nut[ci] + o.sp.size * o.g.size * 0.35);
  }
  if (o === selected) {
    news(`🔎 지켜보던 ${o.sp.name} #${o.id}가 ${by ? by.sp.name + '에게 잡아먹혔어' : cause + ' 죽었어'}.`, true);
  }
}

// ───────── 생물 찾기 칸 ─────────
const gcell = (x, y) => clamp((y / GC) | 0, 0, GN - 1) * GN + clamp((x / GC) | 0, 0, GN - 1);
function buildGrid() {
  head.fill(-1); photoCnt.fill(0);
  if (crowd.length !== SPECIES.length * GN * GN) crowd = new Uint16Array(SPECIES.length * GN * GN); else crowd.fill(0);
  if (nxt.length < orgs.length) nxt = new Int32Array(orgs.length * 2);
  for (let i = 0; i < orgs.length; i++) {
    const o = orgs[i], c = gcell(o.x, o.y);
    nxt[i] = head[c]; head[c] = i;
    if (o.sp.light) photoCnt[c]++;
    if (o.sp.hunt) crowd[o.sp.ix * GN * GN + c]++;
  }
}
function nearby(x, y, rad, fn) {
  const x0 = clamp(((x - rad) / GC) | 0, 0, GN - 1), x1 = clamp(((x + rad) / GC) | 0, 0, GN - 1);
  const y0 = clamp(((y - rad) / GC) | 0, 0, GN - 1), y1 = clamp(((y + rad) / GC) | 0, 0, GN - 1);

}

  { name: '🌿 작은 연못', run() { resetWorld(1.2); sAll('bact', 150); sAll('cyano', 120); sAll('eug', 30); sAll('amoeba', 8); sAll('para', 8); sAll('tardi', 1); news('여러 미생물이 사는 작은 연못이야. 누가 살아남을까?'); } },
  { name: '💊 항생제 실험', run() { resetWorld(1.5); sAll('bact', 300); news('세균이 퍼지면 💊항생제를 조금씩 뿌려 봐. 살아남은 세균의 자손은 점점 항생제를 견디게 될지도 몰라!'); } },
  { name: '🦠 바이러스 습격', run() { resetWorld(1.5); sAll('bact', 350); sAll('cyano', 100); sAll('virus', 15); news('바이러스가 들어왔어! 세균이 막는 힘을 키울까, 바이러스가 뚫는 힘을 키울까?'); } },
  { name: '🐻 물곰 왕국', run() { resetWorld(1.5); sAll('bact', 200); sAll('cyano', 150); sAll('eug', 50); sAll('amoeba', 25); sAll('para', 25); sAll('tardi', 3); news('물곰 3마리가 사는 접시야. 🔎로 물곰을 클릭해서 따라가 봐!'); } },
  { name: '♨️ 뜨거운 온천', run() { resetWorld(1.5); setTemp(52); sAll('bact', 150); sAll('cyano', 150); sAll('amoeba', 10); sAll('para', 10); sAll('tardi', 2); news('물이 52°C야! 더위를 견디게 진화하는 미생물만 살아남을 거야.'); } },
];
function setTemp(v) { $('temp').value = v; globalT = v; $('tempV').textContent = v + '°C'; }

// ───────── 나만의 미생물 편집기 ─────────
const ED_SHAPES = [['rod', '막대'], ['coccus', '동그라미'], ['flag', '꼬리털'], ['amoeba', '아메바'], ['cilia', '짚신'], ['tardi', '곰'], ['virus', '바이러스']];
let edShape = 'coccus';
function edData() {
  return {
    name: $('edName').value.trim() || '이름없는균', shape: edShape, hue: +$('edHue').value, size: +$('edSize').value,
    spd: +$('edSpd').value / 100, nutr: $('edNutr').checked, light: $('edLight').checked, hunt: $('edHunt').checked,
    rep: +$('edRep').value, heat: +$('edHeat').value, prok: $('edProk').checked,
  };
}
function edRefresh() {
  const d = edData();
  $('edHueV').textContent = ''; $('edSizeV').textContent = d.size; $('edSpdV').textContent = d.spd.toFixed(2);
  $('edRepV').textContent = ['', '느림', '보통', '빠름'][d.rep]; $('edHeatV').textContent = d.heat + '°C';
  $('edFood').style.display = d.shape === 'virus' ? 'none' : '';
  document.querySelectorAll('#edShapes .btn').forEach(b => b.classList.toggle('on', b.dataset.shape === edShape));
  const sp = buildCustom({ ...d, id: 'tmp' });
  let info = d.shape === 'virus' ? '바이러스는 혼자 못 살고 세균 종류 미생물에 들어가서 늘어나.' :
    `하루 쓰는 힘: ${(sp.metab * 1000).toFixed(0)} · 나뉘려면 필요한 힘: ${sp.divE.toFixed(0)}`;
  if (sp.hunt) info += `<br>🦷 크기 ${(d.size * 0.1).toFixed(1)}~${(d.size * 0.7).toFixed(1)} 사이 미생물을 잡아먹어.`;
  if (d.size > 20 && !sp.hunt) info += '<br>⚠️ 큰데 잡아먹지 않으면 배고플 수 있어!';
  $('edInfo').innerHTML = info;
}
function edLoop() {
  if (!$('modal').classList.contains('show')) return;
  requestAnimationFrame(edLoop);
  const d = edData(), c = $('edPrev').getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#0d1626'; c.fillRect(0, 0, 340, 340);
  const ext = { rod: 1.8, coccus: 1.1, flag: 2.2, amoeba: 1.3, cilia: 1.7, virus: 2.4, tardi: 1.3 }[edShape];
  const k = 120 / ext / Math.max(1, 1);
  const fake = { id: 3, inf: 0, tun: false };
  c.setTransform(k, 0, 0, k, edShape === 'virus' ? 150 : 170, 170);
  drawBody(c, edShape, 1, `hsl(${d.hue},70%,58%)`, `hsl(${d.hue},70%,33%)`, `hsla(${d.hue},70%,58%,0.55)`, performance.now() / 16, fake, true);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#93a6c4'; c.font = '13px sans-serif'; c.fillText(`실제 크기: 세균의 ${(d.size / 3).toFixed(1)}배`, 10, 330);
}
function openEditor() {
  const box = $('edShapes'); box.innerHTML = '';
  for (const [s, n] of ED_SHAPES) {
    const b = document.createElement('button'); b.className = 'btn'; b.dataset.shape = s;
    b.appendChild(makeIcon(s, +$('edHue').value, 70, 58, 16));
    const t = document.createElement('span'); t.textContent = n; b.appendChild(t);
    b.onclick = () => { edShape = s; if (s === 'virus') $('edProk').checked = false; edRefresh(); };
    box.appendChild(b);
  }
  $('modal').classList.add('show'); edRefresh(); edLoop();
}
['edName', 'edHue', 'edSize', 'edSpd', 'edNutr', 'edLight', 'edHunt', 'edRep', 'edHeat', 'edProk'].forEach(id => $(id).addEventListener('input', edRefresh));
$('newSp').onclick = openEditor;
$('edCancel').onclick = () => $('modal').classList.remove('show');
$('edOk').onclick = () => {
  const d = edData(); d.id = 'c' + Date.now().toString(36);
  const sp = buildCustom(d); addSpecies(sp); saveCustoms(); buildButtons(); setTool('sp:' + sp.id);
  $('modal').classList.remove('show');
  news(`✨ 새 미생물 '${sp.name}'${hasBatchim(sp.name) ? '을' : '를'} 만들었어! 접시를 클릭해서 넣어 봐.`);
};

// ───────── 위쪽·오른쪽 조절 ─────────
function setPaused(p) { paused = p; $('pauseB').textContent = p ? '▶ 계속' : '⏸ 멈춤'; }
function setSpeed(s) { speed = s; document.querySelectorAll('.spd').forEach(b => b.classList.toggle('on', +b.dataset.s === s)); }
$('pauseB').onclick = () => setPaused(!paused);
document.querySelectorAll('.spd').forEach(b => b.onclick = () => setSpeed(+b.dataset.s));
PRESETS.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.name; $('preset').appendChild(o); });
$('preset').value = 1;
$('startB').onclick = () => { if (orgs.length > 30 && !confirm('지금 접시를 비우고 새로 시작할까?')) return; setTemp(25); PRESETS[+$('preset').value].run(); setPaused(false); };
$('fitB').onclick = () => { follow = false; cam.set = false; fitCam(); };
function bindSlider(id, fn) { const el = $(id); const f = () => fn(+el.value); el.addEventListener('input', f); f(); }
bindSlider('temp', v => { globalT = v; $('tempV').textContent = v + '°C'; });
bindSlider('sun', v => { sun = v / 100; $('sunV').textContent = v + '%'; });
bindSlider('sup', v => { supply = v / 100; $('supV').textContent = (v / 100).toFixed(1) + '배'; });
bindSlider('mut', v => { mutRate = v / 100; $('mutV').textContent = (v / 100).toFixed(1) + '배'; });
bindSlider('brush', v => { brushR = v; $('brushV').textContent = v; });
bindSlider('per', v => { perClick = v; $('perV').textContent = v + '마리'; });

// ───────── 시작 ─────────
let fcount = 0;
function frame() {
  requestAnimationFrame(frame);
  if (!paused) for (let k = 0; k < speed; k++) tick();
  toolHold();
  if (follow && selected && !selected.dead) { cam.x += (selected.x - cam.x) * 0.15; cam.y += (selected.y - cam.y) * 0.15; }
  if (fcount % 6 === 0) updateFieldImage();
  draw();
  if (fcount % 15 === 0) updatePanels();
  fcount++;
}
loadCustoms();
buildButtons();
setSpeed(1);
addEventListener('resize', resize);
resize();
PRESETS[1].run();
updateFieldImage();
requestAnimationFrame(frame);
</script>
</body>
</html>
