<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>로켓 조립소</title>
<style>
:root{--panel:rgba(7,22,40,.95);--panel2:#0e2a48;--line:#2c5d8f;--text:#e8f2ff;--dim:#8db2d8;--acc:#5cc8ff;--acc2:#ffd166;--bad:#ff7070;--ok:#7ee08a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06121f;color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:13px;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.num{font-family:Consolas,"Courier New",monospace}
button{font:inherit;color:var(--text);background:#123459;border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
button:hover{background:#1a4573;border-color:var(--acc)}
button.on{background:#1d5d8f;border-color:var(--acc);color:#fff}
button.main{background:#b8410f;border-color:#fb923c;font-weight:bold}
button.main:hover{background:#d9530f}
button:disabled{opacity:.4;cursor:default}
.hide{display:none!important}
.bar{position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);z-index:6;overflow-x:auto;overflow-y:hidden}
.bar .title{font-weight:bold;letter-spacing:1px;color:var(--acc);margin-right:4px;white-space:nowrap}
.bar .sp{flex:1}
.nameBtn{font-weight:bold;max-width:190px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:4px 6px;border:1px dashed transparent;border-radius:4px;white-space:nowrap}
.nameBtn:hover{border-color:var(--line)}
.side{position:fixed;top:44px;bottom:0;background:var(--panel);z-index:4;display:flex;flex-direction:column}
#bLeft{left:0;width:226px;border-right:1px solid var(--line)}
#bRight{right:0;width:262px;border-left:1px solid var(--line);overflow-y:auto;padding:10px 10px 30px}
#cats{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
#cats button{padding:4px 7px;font-size:12px}
#plist{flex:1;overflow-y:auto;padding:6px}
.pi{display:flex;align-items:center;gap:8px;padding:5px;border:1px solid transparent;border-radius:4px;cursor:pointer;margin-bottom:2px;touch-action:none}
.pi:hover{background:#12304f;border-color:var(--line)}
.pi.sel{background:#184068;border-color:var(--acc)}
.pi canvas{flex:none;width:46px;height:46px;pointer-events:none}
.pi .tx{pointer-events:none;min-width:0}
.pi .nm{font-weight:bold}
.pi .nt{color:var(--dim);font-size:11px;line-height:1.3}
.pi .used{color:var(--ok);font-size:10px;margin-left:4px;font-weight:normal}
h3{font-size:13px;color:var(--acc);margin:6px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:3px 0}
.row .k{color:var(--dim)}
.sl{margin:7px 0}
.sl .row{margin:0 0 2px}
input[type=range]{width:100%;accent-color:#5cc8ff}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.info{color:var(--dim);font-size:12px;line-height:1.5;margin:4px 0 8px}
.warn{color:var(--acc2);font-size:12px;margin:3px 0;line-height:1.4}
.bad{color:var(--bad)}
.good{color:var(--ok)}
.stg{border:1px solid var(--line);border-radius:4px;padding:4px 6px;margin:3px 0;font-size:12px}
.stg b{color:var(--acc)}
.cols{display:flex;gap:4px;flex-wrap:wrap}
.cols button{width:26px;height:22px;padding:0}
.hint{position:fixed;left:238px;right:274px;bottom:10px;text-align:center;color:var(--dim);font-size:12px;pointer-events:none;z-index:3;text-shadow:0 1px 2px #000}
.zbtn{position:fixed;z-index:4;display:flex;flex-direction:column;gap:4px}
.zbtn button{width:34px;height:30px;padding:0}
#bZoom{right:274px;top:54px}
/* 비행 화면 */
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
#lcol{position:fixed;left:8px;top:52px;display:flex;flex-direction:column;gap:6px;z-index:4;width:208px}
#hud .row{margin:1px 0}
#hud .v{font-family:Consolas,monospace;font-size:13px}
.fuelbar{height:7px;background:#1b3350;border-radius:3px;overflow:hidden;margin:3px 0 1px}
.fuelbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9f43,#ffd166)}
#thr{position:fixed;left:8px;bottom:8px;z-index:4;display:flex;gap:6px;align-items:flex-end}
#thrTrack{width:44px;height:170px;background:#0c2038;border:1px solid var(--line);border-radius:6px;position:relative;cursor:ns-resize;touch-action:none}
#thrFill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#ff7a1a,#ffd166);border-radius:0 0 5px 5px}
#thrTxt{position:absolute;left:0;right:0;top:4px;text-align:center;font-family:Consolas,monospace;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none}
.vcol{display:flex;flex-direction:column;gap:4px}
.vcol button{padding:5px 6px;font-size:12px}
#rcol{position:fixed;right:8px;bottom:8px;z-index:4;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:330px}
#acts button{font-size:12px;padding:4px 7px}
#rcs{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,30px);gap:3px}
#rcs button{padding:0;font-size:12px}
#rcsWrap .t{font-size:11px;color:var(--dim);text-align:center;margin-bottom:3px}
#rcsWrap .x{display:flex;gap:3px;margin-top:4px}
#rcsWrap .x button{flex:1;font-size:11px;padding:4px 2px}
#stg{width:176px}
#stgList{max-height:150px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:3px;margin-bottom:5px}
.sItem{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:3px 5px;color:var(--dim);background:#0b2038}
.sItem.next{color:#fff;border-color:var(--acc);background:#163d63}
#stgBtn{width:100%;padding:9px 6px;font-size:14px}
#rotBox{position:fixed;left:118px;bottom:8px;z-index:4;display:flex;gap:4px}
#rotBox button{height:40px;min-width:46px;font-size:13px}
#fZoom{right:8px;top:52px}
#pop{position:fixed;z-index:8;min-width:150px;max-width:240px}
#pop .t{font-weight:bold;margin-bottom:3px}
#pop .s{color:var(--dim);font-size:11px;margin-bottom:6px;line-height:1.4}
#pop button{display:block;width:100%;margin-top:4px;text-align:left}
#modal{position:fixed;inset:0;background:rgba(2,8,16,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.mbox{background:#0a1c31;border:1px solid var(--acc);border-radius:8px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;padding:14px 16px}
.mbox h2{font-size:16px;color:var(--acc);margin-bottom:8px}
.mbox .opt{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;cursor:pointer}
.mbox .opt:hover{border-color:var(--acc);background:#11304f}
.mbox .opt b{display:block;margin-bottom:2px}
.mbox .opt span{color:var(--dim);font-size:12px}
.mbox table{width:100%;border-collapse:collapse;font-size:12px}
.mbox td,.mbox th{padding:5px 4px;border-bottom:1px solid #1c3a5c;text-align:left;vertical-align:middle}
.mbox th{color:var(--dim);font-weight:normal}
.mbox .foot{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
#toasts{position:fixed;left:50%;top:52px;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.toast{background:rgba(6,20,36,.92);border:1px solid var(--line);border-radius:5px;padding:5px 12px;font-size:12px;transition:opacity .5s}
.toast.good{border-color:#3f9d55}
@media (max-width:900px),(max-height:500px){
  body{font-size:12px}
  #bLeft{width:178px}
  #bRight{width:206px;padding:8px 8px 30px}
  .pi canvas{width:36px;height:36px}
  .pi .nt{display:none}
  .hint{display:none}
  #bZoom{right:214px}
  #lcol{width:176px}
  #hud{padding:5px 7px}
  #thrTrack{height:120px;width:40px}
  #stgList{max-height:70px}
  #stg{width:150px}
  #rotBox{left:102px}
  #rotBox button{height:36px;min-width:40px}
  #rcs{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,26px)}
  .bar{gap:4px}
  .bar button{padding:4px 7px}
}
</style>
<script src="../mobile.js"></script>
</head>
<body>
<canvas id="cv"></canvas>

<div id="build">
  <div class="bar">
    <span class="title">로켓 조립소</span>
    <span class="nameBtn" id="dName" title="이름 바꾸기">새 로켓</span>
    <button id="bNew">새로</button>
    <button id="bLoad">불러오기</button>
    <button id="bSave">저장</button>
    <button id="bUndo">되돌리기</button>
    <button id="bSym" class="on" title="가운데 줄 옆에 놓으면 반대쪽에도 똑같이 놓아요">대칭</button>
    <button id="bView" title="설계도 그림과 실제 색깔 그림을 바꿔요">설계도</button>
    <span class="sp"></span>
    <button id="bBase">우주 기지</button>
    <button id="bRec">기록</button>
    <button id="bSet">설정</button>
    <button id="bLaunch" class="main">발사</button>
  </div>
  <div class="side" id="bLeft"><div id="cats"></div><div id="plist"></div></div>
  <div class="side" id="bRight"></div>
  <div class="zbtn" id="bZoom"><button id="bzIn">+</button><button id="bzOut">-</button><button id="bzFit" title="로켓이 다 보이게">맞춤</button></div>
  <div class="hint" id="bHint"></div>
</div>

<div id="fly" class="hide">
  <div class="bar">
    <span class="title">로켓 조립소</span>
    <span class="nameBtn" id="vName" title="이름 바꾸기"></span>
    <button id="fBuild">설계실로</button>
    <button id="fBase">우주 기지</button>
    <button id="fRec">기록</button>
    <span class="sp"></span>
    <button id="wDn">느리게</button><span id="wTxt" class="num" style="min-width:58px;text-align:center">1×</span><button id="wUp">빠르게</button>
    <button id="fPov" title="캡슐 안에서 창밖 보기 (V)">우주인 시점</button>
    <button id="fMap">지도</button>
  </div>
  <div id="lcol">
    <div class="box" id="hud"></div>
    <div class="box hide" id="tgt"></div>
  </div>
  <div id="thr">
    <div id="thrTrack"><div id="thrFill"></div><div id="thrTxt">0%</div></div>
    <div class="vcol"><button id="thrMax">최대</button><button id="thrOff">끄기</button></div>
  </div>
  <div id="rotBox"><button id="rotL" title="왼쪽으로 돌기 (A)">&#9664;</button><button id="sasBtn" class="on" title="손을 떼면 자세를 그대로 유지해요 (T)">자세 유지</button><button id="rotR" title="오른쪽으로 돌기 (D)">&#9654;</button></div>
  <div class="zbtn" id="fZoom"><button id="fzIn">+</button><button id="fzOut">-</button><button id="fzFar" title="천체가 보이게 멀리 / 우주선 가까이">멀리</button></div>
  <div id="rcol">
    <div id="acts"></div>

      <div class="t">자세 제어 분사 (I J K L)</div>
      <div id="rcs">
        <span></span><button data-r="0,1">앞</button><span></span>
        <button data-r="-1,0">왼쪽</button><span></span><button data-r="1,0">오른쪽</button>
        <span></span><button data-r="0,-1">뒤</button><span></span>
      </div>
      <div class="x"><button id="matchBtn">속도 맞추기</button><button id="autoDock">자동 도킹</button></div>
    </div>
    <div class="box" id="stg"><div id="stgList"></div><button id="stgBtn" class="main">다음 단계</button></div>
  </div>
</div>

<div id="pop" class="box hide"></div>
<div id="modal" class="hide"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>

<script>
'use strict';
// =====================================================================
//  로켓 조립소 — 부품을 붙여 로켓을 만들고, 발사해서 궤도에 올리고,
//  위성을 놓거나 정거장 모듈끼리 도킹해서 우주 정거장을 키우는 2D 샌드박스
// =====================================================================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2, G0 = 9.80665, DEG = Math.PI / 180;
const DIRS = [[0, 1], [-1, 0], [0, -1], [1, 0]];   // 부품이 r번 돌아갔을 때 '부품의 위쪽'이 가리키는 방향
const newId = () => 'p' + Math.random().toString(36).slice(2, 10);
const nf = (x, d = 0) => (isFinite(x) ? x : 0).toLocaleString('ko-KR', { maximumFractionDigits: d, minimumFractionDigits: d });
function fDist(m) { const a = Math.abs(m); if (a < 1000) return nf(m, 0) + ' m'; if (a < 100000) return nf(m / 1000, 1) + ' km'; return nf(m / 1000, 0) + ' km'; }
function fSpd(v) { return nf(v, Math.abs(v) < 10 ? 1 : 0) + ' m/s'; }
function fMass(kg) { if (kg < 1000) return nf(kg, 0) + ' kg'; if (kg < 100000) return nf(kg / 1000, 1) + ' t'; return nf(kg / 1000, 0) + ' t'; }
function fForce(n) { if (n < 1e6) return nf(n / 1000, 0) + ' kN'; return nf(n / 1e6, 2) + ' MN'; }
function fTime(s) {
  s = Math.max(0, s);
  if (s < 60) return nf(s, 0) + '초';
  if (s < 3600) return Math.floor(s / 60) + '분 ' + Math.floor(s % 60) + '초';
  if (s < 86400) return Math.floor(s / 3600) + '시간 ' + Math.floor(s % 3600 / 60) + '분';
  return nf(Math.floor(s / 86400), 0) + '일 ' + Math.floor(s % 86400 / 3600) + '시간';
}
function wrapA(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }

// ---------------- 손맛 도우미 (game-hit-lessons/juice.js) ----------------
const Juice = (() => {
  const ease = {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    inQuad: t => t * t, pulse: t => Math.sin(Math.PI * t),
  };
  const tweens = [];
  function tween(sec, onUpdate, easing = ease.outCubic, onDone) { tweens.push({ t: 0, sec: Math.max(0.001, sec), onUpdate, easing, onDone }); }
  let trauma = 0, shakeTime = 0;
  function addShake(amount) { trauma = Math.min(1, trauma + amount); }
  function noise(t, seed) { const x = Math.sin(t * 12.9898 + seed * 78.233) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; }
  function shakeOffset(maxPx = 10) { const s = trauma * trauma, f = shakeTime * 32; return { x: Math.round(maxPx * s * noise(f, 1)), y: Math.round(maxPx * s * noise(f, 2)) }; }
  let stop = 0;
  function hitstop(ms) { stop = Math.max(stop, ms / 1000); }
  const parts = [], MAX_PARTS = 400;
  function burst(x, y, n = 10, color = '#ffffff', speed = 160, life = 0.5, size = 3, gravity = 300) {
    for (let i = 0; i < n && parts.length < MAX_PARTS; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.35 + Math.random() * 0.65);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.3, life, max: life, size, color, g: gravity });
    }
  }
  const pops = [];
  function popText(x, y, text, color = '#ffffff', size = 14, font = 'bold') { pops.push({ x, y, text: String(text), color, size, font, t: 0, life: 0.8 }); }
  let flashA = 0, flashColor = '#ffffff';
  function flash(alpha = 0.3, color = '#ffffff') { flashA = Math.max(flashA, alpha); flashColor = color; }
  function update(realDt) {
    const dt = Math.max(0, Math.min(0.1, realDt || 0));
    shakeTime += dt; trauma = Math.max(0, trauma - 1.4 * dt);
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i]; tw.t += dt; const k = Math.min(tw.t / tw.sec, 1);
      try { tw.onUpdate(tw.easing(k)); } catch (e) { console.error(e); }
      if (k >= 1) { tweens.splice(i, 1); if (tw.onDone) try { tw.onDone(); } catch (e) { console.error(e); } }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt; p.vx *= (1 - 1.5 * dt); p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = pops.length - 1; i >= 0; i--) { const q = pops[i]; q.t += dt; if (q.t >= q.life) pops.splice(i, 1); }
    flashA = Math.max(0, flashA - dt * 3);
    if (stop > 0) { stop = Math.max(0, stop - dt); return dt * 0.05; }
    return dt;
  }
  function draw(ctx) {
    ctx.save();
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      const s = Math.max(1, Math.round(p.size * (0.5 + 0.5 * p.life / p.max)));
      ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const q of pops) {
      const k = q.t / q.life, sc = k < 0.15 ? ease.outBack(k / 0.15) : 1;
      ctx.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
      ctx.font = `${q.font} ${Math.round(q.size * sc)}px sans-serif`;
      const y = q.y - 28 * ease.outCubic(k);
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(q.text, q.x, y);
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, y);
    }
    ctx.restore();
  }
  function drawFlash(ctx, w, h) { if (flashA <= 0) return; ctx.save(); ctx.globalAlpha = flashA; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, w, h); ctx.restore(); }
  let ac = null, muted = false;
  function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { } return ac; }
  function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.12, vary = 0.08, slideTo = null) {
    if (muted) return;
    try {
      audio(); const t0 = ac.currentTime, f = freq * (1 + (Math.random() * 2 - 1) * vary);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { }
  }
  function noiseHit(dur = 0.15, vol = 0.15, lowpass = 1800) {
    if (muted) return;
    try {
      audio(); const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; f.type = 'lowpass'; f.frequency.value = lowpass; g.gain.value = vol;
      src.connect(f).connect(g).connect(ac.destination); src.start();
    } catch (e) { }
  }
  function setMuted(v) { muted = !!v; }
  function isMuted() { return muted; }
  function clear() { tweens.length = 0; parts.length = 0; pops.length = 0; trauma = 0; stop = 0; flashA = 0; }
  return { ease, tween, addShake, shakeOffset, hitstop, burst, popText, flash, update, draw, drawFlash, beep, noiseHit, setMuted, isMuted, clear, audio };
})();

// 엔진 소리(계속 나는 우르릉 소리) — 첫 클릭 뒤에 만들어진다
const EngineSound = (() => {
  let src = null, gain = null, filt = null;
  function ensure() {

function drawIcon(cnv, key) {

// ---------- 붙이기(자석) ----------
function snapPlace(p, wx, wy, exclude) {
  const thr = Math.max(0.5, 26 / B.cam.z);
  let best = null, bd = thr;
  const mount = mountOf(p);
  for (const q of D().parts) {
    if (exclude.has(q.id)) continue;
    for (const qe of edgesOf(q)) {
      let r = p.r, f = p.f;
      if (mount === 'base') { r = { T: 0, R: 3, L: 1, B: 2 }[qe.s]; f = 0; }
      else if (mount === 'side') { if (qe.s === 'R') { r = 0; f = 0; } else if (qe.s === 'L') { r = 0; f = 1; } else continue; }
      const tmp = Object.assign({}, p, { r, f, x: 0, y: 0 });
      for (const pe of edgesOf(tmp)) {
        if (pe.s !== OPP[qe.s]) continue;
        const qm = (qe.a + qe.b) / 2, pm = (pe.a + pe.b) / 2;
        const lo = qe.a - pe.b + 0.1, hi = qe.b - pe.a - 0.1;
        if (lo > hi) continue;
        let cx, cy;
        if (qe.s === 'T' || qe.s === 'B') {
          cy = qe.c - pe.c;
          cx = Math.abs(wx + pm - qm) < thr ? qm - pm : Math.round(wx * 4) / 4;
          cx = clamp(cx, lo, hi);
        } else {
          cx = qe.c - pe.c;
          cy = Math.abs(wy + pm - qm) < thr ? qm - pm : Math.round(wy * 4) / 4;
          cy = clamp(cy, lo, hi);
        }
        const dist = Math.hypot(cx - wx, cy - wy);
        if (dist < bd) { bd = dist; best = { x: cx, y: cy, r, f, snapped: true }; }
      }
    }
  }
  if (best) return best;
  // 자석에 안 붙으면 0.25 m 칸에 맞추고, 땅 가까우면 땅 위에
  const [bw, bh] = bboxSize(p);
  let x = Math.round(wx * 4) / 4, y = Math.round(wy * 4) / 4;
  if (Math.abs(x) < thr) x = 0;
  if (Math.abs(wy - bh / 2) < thr) y = bh / 2;
  return { x, y, r: p.r, f: p.f, snapped: false };
}
function mirrorOf(p) { const m = JSON.parse(JSON.stringify(p)); m.id = newId(); m.x = -p.x; m.r = (4 - (p.r || 0)) % 4; m.f = p.f ? 0 : 1; m.sym = p.id; p.sym = m.id; return m; }
function placeGhost() {
  const g = B.ghost; if (!g) return;
  pushHist();
  const p = JSON.parse(JSON.stringify(B.placing)); p.id = newId(); p.x = g.x; p.y = g.y; p.r = g.r; p.f = g.f; delete p.sym;
  D().parts.push(p);
  if (B.symOn && Math.abs(p.x) > 0.05) D().parts.push(mirrorOf(p));
  B.sel = p.id;
  Juice.beep(660, 0.04, 'triangle', 0.06);
  stopPlacing(); designChanged();
}
function deleteSel() {
  const p = partById(B.sel); if (!p) return;
  pushHist();
  D().parts = D().parts.filter(q => q.id !== p.id && q.id !== p.sym);
  B.sel = null; Juice.beep(220, 0.05, 'triangle', 0.06); designChanged();
}
function rotateSel(flip) {
  const p = partById(B.sel); if (!p) return;
  pushHist();
  if (flip) p.f = p.f ? 0 : 1; else p.r = ((p.r || 0) + 1) % 4;
  const m = p.sym && partById(p.sym);
  if (m) { m.r = (4 - p.r) % 4; m.f = p.f ? 0 : 1; }
  designChanged();
}
function copySel() {
  const p = partById(B.sel); if (!p) return;
  const t = JSON.parse(JSON.stringify(p)); delete t.sym; startPlacing(t);
}

// 크기 바꾸기: 위에 붙은 것은 위로, 옆에 붙은 것은 옆으로 같이 밀어 준다
function resizePart(p, prop, val, noPair) {
  const parts = D().parts, adj = buildAdj(parts), byId = new Map(parts.map(q => [q.id, q]));
  const oldE = edgesOf(p), sideOf = {};
  for (const nid of adj.get(p.id)) {
    const q = byId.get(nid), qE = edgesOf(q);
    for (const e of oldE) for (const f of qE) if (OPP[e.s] === f.s && Math.abs(e.c - f.c) < 0.03 && Math.min(e.b, f.b) - Math.max(e.a, f.a) > 0.04) { if (!sideOf[nid]) sideOf[nid] = e.s; }
  }
  const before = { w: p.w, h: p.h, w2: p.w2 };
  if (prop === 'n') { p.n = val; p.w = engWidth(p); } else p[prop] = val;
  const newE = edgesOf(p), delta = {};
  for (const s of ['T', 'B', 'L', 'R']) { const a = oldE.find(e => e.s === s), b = newE.find(e => e.s === s); delta[s] = a && b ? b.c - a.c : 0; }
  // 아래쪽 모서리는 그대로 두기
  const keepY = -delta.B; p.y += keepY;
  const rest = parts.filter(q => q.id !== p.id), adj2 = new Map(); for (const q of rest) adj2.set(q.id, (adj.get(q.id) || []).filter(n => n !== p.id));
  const moved = new Set();
  for (const nid in sideOf) {
    if (moved.has(nid)) continue;
    const s = sideOf[nid];
    if (s === 'B') continue;
    const dx = (s === 'L' || s === 'R') ? delta[s] : 0, dy = (s === 'T') ? delta.T + keepY : keepY;
    const comp = components(rest.filter(q => !moved.has(q.id)), adj2).find(c => c.some(q => q.id === nid)) || [];
    for (const q of comp) { if (moved.has(q.id)) continue; moved.add(q.id); q.x += dx; q.y += dy; }
  }
  const m = !noPair && p.sym && byId.get(p.sym);
  if (m && (m[prop] !== val || prop === 'n')) { resizePart(m, prop, val, true); m.x = -p.x; m.y = p.y; }
  return before;
}

// ---------- 오른쪽 판 ----------
function rocketMain(parts) {
  if (!parts.length) return { main: [], loose: [], adj: new Map() };
  const adj = buildAdj(parts), comps = components(parts, adj), ctrl = bestControl(parts);
  let main = ctrl ? comps.find(c => c.includes(ctrl)) : comps.reduce((a, b) => (b.length > a.length ? b : a));
  const ms = new Set(main.map(p => p.id));
  return { main, loose: parts.filter(p => !ms.has(p.id)), adj };
}
// 단계별 속도 바꿈량(Δv)과 힘/무게
function stageStats(parts) {
  const { main, loose, adj } = rocketMain(parts);
  if (!main.length) return null;
  const P = main.map(p => Object.assign({}, p)), byId = new Map(P.map(p => [p.id, p]));
  const adjM = buildAdj(P);
  fillFuel(P, adjM);
  const events = computeStages(P, adjM);
  const ctrl = bestControl(P);
  let rootId = ctrl ? ctrl.id : P.reduce((a, b) => (b.y > a.y ? b : a)).id;
  let alive = new Set(P.map(p => p.id));
  const on = new Set(), out = [];
  const mass = () => { let m = 0; for (const id of alive) m += partMass(byId.get(id)); return m; };
  function dropFor(ev, aliveSet) { // 이 사건으로 떨어져 나갈 부품
    const decs = ev.filter(id => aliveSet.has(id) && (isDecoupler(byId.get(id)) || DEFS[byId.get(id).t].kind === 'fairing'));
    if (!decs.length) return new Set();
    const live = [...aliveSet].filter(id => !decs.includes(id)).map(id => byId.get(id));
    const cs = components(live, adjM); const keep = cs.find(c => c.some(q => q.id === rootId)) || cs.reduce((a, b) => (b.length > a.length ? b : a), []);
    const ks = new Set(keep.map(q => q.id)); const drop = new Set(); for (const id of aliveSet) if (!ks.has(id)) drop.add(id);
    return drop;
  }
  let firstBurn = true;
  for (let i = 0; i < events.length; i++) {
    const ev = events[i];
    const drop = dropFor(ev, alive);
    for (const id of ev) { const p = byId.get(id); if (p && alive.has(id) && isEngine(p)) on.add(id); }
    for (const id of drop) alive.delete(id);
    // 연료 칸 나누기
    const live = [...alive].map(id => byId.get(id));
    const secs = components(live.filter(p => !isDecoupler(p)), adjM);
    const pools = secs.map(c => ({ tanks: c.filter(p => DEFS[p.t].kind === 'tank'), engs: c.filter(p => isEngine(p) && on.has(p.id)) })).filter(s => s.engs.length);
    const nextDrop = i + 1 < events.length ? dropFor(events[i + 1], alive) : new Set();
    const watch = pools.filter(s => s.engs.some(e => nextDrop.has(e.id)));
    const sl = firstBurn;
    let m0 = mass(), dv = 0, tb = 0, Fsl = 0;
    for (const s of pools) for (const e of s.engs) Fsl += engThrust(ENGINES[DEFS[e.t].eng], sl ? 1 : 0) * e.n;
    const twr = Fsl / (m0 * G0);
    let guard = 0;
    while (guard++ < 60) {
      const act = pools.filter(s => s.tanks.reduce((a, t) => a + t.fuel, 0) > 1e-6);
      if (!act.length) break;
      if (watch.length && !watch.some(s => act.includes(s))) break;
      let F = 0, md = 0, tmin = Infinity;
      for (const s of act) {
        let smd = 0; for (const e of s.engs) { const E = ENGINES[DEFS[e.t].eng]; const k = engMdot(E) * e.n; smd += k; F += k * engIsp(E, sl ? 0.5 : 0) * G0; }
        md += smd; s._md = smd; tmin = Math.min(tmin, s.tanks.reduce((a, t) => a + t.fuel, 0) / smd);
      }
      if (!(md > 0) || !isFinite(tmin)) break;
      const m = mass();
      dv += F / md * Math.log(m / Math.max(1, m - md * tmin)); tb += tmin;
      for (const s of act) { const tot = s.tanks.reduce((a, t) => a + t.fuel, 0), take = s._md * tmin; for (const t of s.tanks) t.fuel -= take * t.fuel / tot; }
    }
    if (pools.length) firstBurn = false;
    const engs = {}; for (const s of pools) for (const e of s.engs) { const nm = ENGINES[DEFS[e.t].eng].name; engs[nm] = (engs[nm] || 0) + (e.n || 1); }
    const kinds = ev.map(id => byId.get(id) && DEFS[byId.get(id).t].kind);
    const lab = kinds.includes('fairing') ? '페어링 열기' : kinds.includes('decoupler') || kinds.includes('rdecoupler') ? '분리' : ev.some(id => byId.get(id) && isChute(byId.get(id))) ? '낙하산 준비' : '분리';
    out.push({ dv, twr, tb, m0, engs, drops: drop.size, lab, burn: pools.length > 0 && dv > 1 });
  }
  const total = out.reduce((a, s) => a + s.dv, 0);
  let crew = 0, wmax = 0, ymin = Infinity, ymax = -Infinity, has12 = false;
  for (const p of main) { crew += partCrew(p); const [bw, bh] = bboxSize(p); wmax = Math.max(wmax, bw); ymin = Math.min(ymin, p.y - bh / 2); ymax = Math.max(ymax, p.y + bh / 2); if (p.w >= 12 || (p.w2 || 0) >= 12) has12 = true; }
  let m = 0; const full = main.map(p => Object.assign({}, p)); fillFuel(full, buildAdj(full)); for (const p of full) m += partMass(p);
  return { stages: out, total, mass: m, height: ymax - ymin, width: wmax, crew, ctrl: !!ctrl, loose: loose.length, count: main.length, has12 };
}

function slider(k, label, v, a, b, st) {

function rocketSummary() {

  const st = B.stats;
  let h = '<h3>로켓 정보</h3>';
  if (!st) return h + '<div class="info">아직 부품이 없어요. 왼쪽에서 부품을 골라 놓아 보세요.<br><br>맨 위에 조종 장치(캡슐이나 위성 컴퓨터), 그 아래에 연료 탱크, 맨 아래에 엔진을 붙이면 로켓이 돼요.<br><br>만든 로켓을 보고 싶으면 위의 "불러오기"에서 예시 로켓도 볼 수 있어요.</div>';
  h += `<div class="row"><span class="k">무게(연료 가득)</span><span class="num">${fMass(st.mass)}</span></div>`;
  h += `<div class="row"><span class="k">높이 / 폭</span><span class="num">${nf(st.height, 1)} m / ${nf(st.width, 1)} m</span></div>`;
  h += `<div class="row"><span class="k">부품</span><span class="num">${st.count}개</span></div>`;
  if (st.crew) h += `<div class="row"><span class="k">사람</span><span class="num">${st.crew}명</span></div>`;
  let n = 0;
  for (const s of st.stages) {
    n++;
    const en = Object.entries(s.engs).map(([k, v]) => k + (v > 1 ? '×' + v : '')).join(', ');
    if (s.burn) h += `<div class="stg"><b>${n}단계</b> ${en}<br>속도 <span class="num">+${nf(s.dv, 0)} m/s</span> · 힘/무게 <span class="num ${s.twr < 1 && n === 1 ? 'bad' : ''}">${nf(s.twr, 2)}</span> · ${fTime(s.tb)}</div>`;
    else h += `<div class="stg"><b>${n}단계</b> ${s.lab}</div>`;
  }
  h += `<div class="row" style="margin-top:6px"><span class="k">모두 합친 속도</span><span class="num ${st.total >= needDv() ? 'good' : ''}">${nf(st.total, 0)} m/s</span></div>`;
  h += `<div class="row"><span class="k">궤도까지 필요</span><span class="num">약 ${nf(needDv(), 0)} m/s</span></div>`;

  if (st.loose) h += `<div class="warn">붙지 않은 부품이 ${st.loose}개 있어요(빨간 테두리). 발사할 때 두고 가요.</div>`;

  h += `<div class="info" style="margin-top:8px">힘/무게가 1보다 커야 떠요. 1단계는 1.2~1.5쯤이 좋아요.</div>`;

    const [, t] = b2s(0, ymax), [, b] = b2s(0, ymin);

function fitBuild() {
  const ps = D().parts; const v = viewRect();

  for (const p of ps) { const [bw, bh] = bboxSize(p); x0 = Math.min(x0, p.x - bw / 2); x1 = Math.max(x1, p.x + bw / 2); y0 = Math.min(y0, p.y - bh / 2); y1 = Math.max(y1, p.y + bh / 2); }

}
function hitPart(wx, wy) {
  const ps = sortedForDraw(D().parts).reverse();
  const cover = k => k === 'fairing' || (k === 'decoupler');
  let found = null;
  for (const pass of [0, 1]) {
    for (const p of ps) {

      if (pass === 0 && cover(k) && p.h > 1) continue;
      const [bw, bh] = bboxSize(p), m = 3 / B.cam.z;

function buildDown(e) {
  B.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (B.ptrs.size === 2) { const [a, b] = [...B.ptrs.values()]; B.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: B.cam.z }; B.drag = null; B.pan = null; return; }
  if (e.button === 2) { if (B.placing) stopPlacing(); B.pan = { sx: e.clientX, sy: e.clientY, cx: B.cam.x, cy: B.cam.y }; return; }
  if (B.placing) { updateGhost(e.clientX, e.clientY); if (B.ghost) placeGhost(); return; }
  const [wx, wy] = s2b(e.clientX, e.clientY);
  const p = hitPart(wx, wy);
  if (p) {
    B.sel = p.id; refreshRight();
    B.drag = { id: p.id, ox: p.x - wx, oy: p.y - wy, moved: false, sx: e.clientX, sy: e.clientY, snap: JSON.stringify(D().parts) };
  } else {

}
function buildMove(e) {

  if (B.pinch && B.ptrs.size === 2) { const [a, b] = [...B.ptrs.values()]; B.cam.z = clamp(B.pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, B.pinch.d), 0.3, 80); return; }

}

  else h += `<div class="info">아직 저장한 설계가 없어요. 위의 "저장"을 누르면 여기에 생겨요.</div>`;
  h += `<h2 style="margin-top:12px">예시 로켓</h2>`;
  for (const [id, nm, ds] of EXAMPLES) h += `<div class="opt" data-ex="${id}"><b>${nm}</b><span>${ds}</span></div>`;
  h += `<div class="foot"><button id="lClose">닫기</button></div>`;
  openModal(h, { lClose: closeModal });
  const box = $('mbox');
  box.querySelectorAll('[data-ld]').forEach(b => b.onclick = () => { pushHist(); const d = S.designs[b.dataset.ld]; S.cur = { name: d.name, parts: JSON.parse(JSON.stringify(d.parts)) }; afterLoad(); });
  box.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => { if (confirm(b.dataset.dl + ' 설계를 지울까요?')) { delete S.designs[b.dataset.dl]; saveAll(); loadModal(); } });
  box.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { pushHist(); const ex = makeExample(b.dataset.ex); S.cur = ex; afterLoad(); });
}
function afterLoad() { closeModal(); B.sel = null; $('dName').textContent = D().name; fitBuild(); designChanged(); toast(D().name + ' 불러왔어요'); }

// ---------- 예시 로켓 ----------
const EXAMPLES = [
  ['falcon', '팰컨 9 + 인공위성', '스페이스X 로켓을 닮은 2단 로켓이에요. 페어링 안에 위성이 들어 있어요.'],
  ['crew', '팰컨 9 + 크루 드래곤', '사람 4명이 탄 캡슐이에요. 궤도에 오르면 1단계 남은 걸 떼고, 목표를 국제 우주 정거장으로 정한 다음 "자동으로 가기"를 눌러 보세요.'],
  ['station', '정거장 모듈 로켓', '거주 모듈과 도킹 포트 2개를 싣고 가요. 여러 번 쏘아서 도킹하면 정거장이 돼요.'],
  ['nuri', '누리호', '한국 로켓을 닮은 3단 로켓이에요. KRE-075 엔진 4개로 떠요.'],
  ['saturn', '새턴 V + 아폴로', '폭 10 m짜리 큰 3단 로켓이에요. 달까지 갈 수 있어요.'],
  ['electron', '일렉트론', '작은 위성을 쏘는 아주 작은 로켓이에요.'],
  ['grabber', '소행성 잡이', '집게와 큰 연료 탱크를 단 우주선이에요. 소행성 옆에 놓고 잡아 보세요.'],
];
function makeExample(id) {
  const P = (t, x, yb, o) => { const p = newPart(t); Object.assign(p, o || {}); if (isMainEngine(p)) p.w = engWidth(p); p.x = x; p.y = yb + p.h / 2; return p; };
  const side = (t, yc, hostHalfW) => { const a = P(t, 0, 0), [bw] = bboxSize(Object.assign({}, a, { r: 1 })); const r = Object.assign(P(t, 0, 0), { r: 3 }); r.x = hostHalfW + bw / 2; r.y = yc; const l = Object.assign(P(t, 0, 0), { r: 1 }); l.x = -r.x; l.y = yc; l.sym = r.id; r.sym = l.id; return [r, l]; };
  let parts = [], name = '';
  const f9low = () => [P('e_merlin', 0, 0, { n: 9 }), P('tank', 0, 2, { w: 3.5, h: 40 }), P('dec', 0, 42, { w: 3.5, h: 5 }), P('e_mvac', 0, 42.5), P('tank', 0, 47, { w: 3.5, h: 11 })];
  if (id === 'crew') {
    name = '크루 드래곤';
    parts = f9low().concat([P('dec', 0, 58, { w: 3.5, h: 0.5 }), P('shield', 0, 58.5, { w: 4 }), P('dragon', 0, 59)]);
  } else if (id === 'falcon') {
    name = '팰컨 9';
    parts = f9low().concat([P('dec', 0, 58, { w: 1.5, h: 0.5 }), P('bus', 0, 58.5, { w: 2, h: 2.5 }), P('antenna', 0, 61)], side('solarS', 59.75, 1), [P('fairing', 0, 58, { w: 5, h: 11 })]);
  } else if (id === 'station') {
    name = '정거장 모듈';
    parts = f9low().concat([P('dec', 0, 58, { w: 3.5, h: 0.5 }), P('dock', 0, 58.5), P('hab', 0, 59, { w: 4.5, h: 8.5 }), P('probe', 0, 67.5, { w: 1.5 }), P('dock', 0, 68)], side('solarS', 63.25, 2.25));
  } else if (id === 'nuri') {
    name = '누리호';
    parts = [P('e_kre075', 0, 0, { n: 4 }), P('tank', 0, 2.5, { w: 3.5, h: 16 }), P('dec', 0, 18.5, { w: 3.5, h: 3 }), P('e_kre075', 0, 19), P('tank', 0, 21.5, { w: 3.5, h: 6 }),
      P('dec', 0, 27.5, { w: 3.5, h: 2 }), P('e_kre007', 0, 28), P('tank', 0, 29.5, { w: 2.5, h: 2 }), P('dec', 0, 31.5, { w: 1, h: 0.5 }), P('bus', 0, 32, { w: 1.5, h: 1.5 }), P('fairing', 0, 31.5, { w: 3.5, h: 6 })];
  } else if (id === 'saturn') {
    name = '새턴 V';
    parts = [P('e_f1', 0, 0, { n: 5 }), P('tank', 0, 5.5, { w: 10, h: 26 }), P('dec', 0, 31.5, { w: 10, h: 4 }), P('e_j2', 0, 32, { n: 5 }), P('tank', 0, 35.5, { w: 10, h: 22 }),
      P('adapter', 0, 57.5, { w: 10, w2: 6.5, h: 5 }), P('dec', 0, 62.5, { w: 6.5, h: 0.5 }), P('e_j2', 0, 59.5), P('tank', 0, 63, { w: 6.5, h: 11 }),
      P('adapter', 0, 74, { w: 6.5, w2: 4, h: 6 }), P('dec', 0, 80, { w: 4, h: 0.5 }), P('shield', 0, 80.5, { w: 4 }), P('apollo', 0, 81)];
  } else if (id === 'electron') {
    name = '일렉트론';
    parts = [P('e_rutherford', 0, 0, { n: 9 }), P('tank', 0, 1, { w: 1.5, h: 7.5 }), P('dec', 0, 8.5, { w: 1.5, h: 1.2 }), P('e_rutherford', 0, 8.7), P('tank', 0, 9.7, { w: 1.5, h: 2.2 }),
      P('dec', 0, 11.9, { w: 1, h: 0.5 }), P('probe', 0, 12.4, { w: 1 }), P('fairing', 0, 11.9, { w: 1.5, h: 3 })];
  } else if (id === 'grabber') {
    name = '소행성 잡이';
    parts = [P('e_rl10', 0, 0, { n: 1 }), P('tank', 0, 2.5, { w: 3, h: 8 }), P('probe', 0, 10.5, { w: 3 }), P('claw', 0, 11)];
  }
  // 예시는 땅 위(0)부터
  return { name, parts };
}

// ---------- 소행성 뿌리기 ----------
function stateFromOrbit(b, a, e, nu, w) {
  const p = a * (1 - e * e), r = p / (1 + e * Math.cos(nu)), th = w - nu, s = -1;
  const k = Math.sqrt(b.mu / p), vr = k * e * Math.sin(nu), vt = k * (1 + e * Math.cos(nu));
  const c = Math.cos(th), sn = Math.sin(th);
  return { x: r * c, y: r * sn, vx: vr * c - s * vt * sn, vy: vr * sn + s * vt * c };
}
function spawnRock(name, bodyId, rad, a, e) {
  const b = BODY[bodyId], st = stateFromOrbit(b, a, e, Math.random() * TAU, Math.random() * TAU);
  const p = { id: newId(), t: 'rock', x: 0, y: 0, w: rad * 2, h: rad * 2, r: 0, f: 0, seed: 1 + Math.floor(Math.random() * 997), home: bodyId, name };
  const v = { id: 'a' + Math.random().toString(36).slice(2, 9), name, parts: [p], x: st.x, y: st.y, vx: st.vx, vy: st.vy, ang: Math.random() * TAU, av: (Math.random() - 0.5) * 0.06, body: bodyId, landed: false, throttle: 0, sas: false, stages: [], docks: 0, astro: true, born: 0 };
  retopo(v); world.vessels.push(v);
}
function makeAsteroids() {
  const k = world.scale === 'real' ? 1 : 0.1, AU = 1.496e11 * k, mA = BODY.moon.a;
  // 지구에 잠깐 붙잡힌 진짜 '작은 달'들
  spawnRock('2020 CD3', 'earth', 1.5, mA * 0.18, 0.15);
  spawnRock('2024 PT5', 'earth', 5, mA * 0.26, 0.2);
  spawnRock('2006 RH120', 'earth', 1.5, mA * 0.34, 0.1);
  for (let i = 0; i < 4; i++) spawnRock('근지구 소행성 ' + (i + 1), 'sun', 2 + Math.random() * 5, AU * (1.05 + Math.random() * 0.25), 0.05 + Math.random() * 0.1);
  for (let i = 0; i < 8; i++) spawnRock('소행성대 소행성 ' + (i + 1), 'sun', 2 + Math.random() * 7, AU * (2.2 + Math.random() * 1.0), Math.random() * 0.12);
  for (let i = 0; i < 3; i++) spawnRock('프록시마 소행성 ' + (i + 1), 'proxima', 2 + Math.random() * 5, BODY.proxb.a * (1.6 + Math.random()), Math.random() * 0.1);
}

// =====================================================================
//  시작
// =====================================================================
let lastT = performance.now();
function loop(now) {
  try {
    const real = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
    const dt = Juice.update(real);
    if (screen === 'build') { drawBuild(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); Juice.draw(ctx); }
    else { stepFlight(dt, real); drawFlight(real); }
  } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
function bindUI() {
  $('dName').onclick = () => { const n = prompt('로켓 이름', D().name); if (n && n.trim()) { D().name = n.trim().slice(0, 30); $('dName').textContent = D().name; saveSoon(); } };
  $('vName').onclick = () => { const A = active(); if (!A) return; const n = prompt('우주선 이름', A.name); if (n && n.trim()) { A.name = n.trim().slice(0, 30); $('vName').textContent = A.name; saveSoon(); } };
  $('bNew').onclick = () => { if (D().parts.length && !confirm('지금 설계를 비울까요? (저장 안 한 건 사라져요)')) return; pushHist(); S.cur = { name: '새 로켓', parts: [] }; B.sel = null; $('dName').textContent = D().name; B.cam = { x: 0, y: 12, z: 14 }; designChanged(); };
  $('bLoad').onclick = loadModal;
  $('bSave').onclick = () => { const n = prompt('저장할 이름', D().name); if (!n || !n.trim()) return; const nm = n.trim().slice(0, 30); D().name = nm; $('dName').textContent = nm; S.designs[nm] = JSON.parse(JSON.stringify(D())); saveAll(); toast(nm + ' 저장했어요', true); };
  $('bUndo').onclick = undo;
  $('bSym').onclick = () => { B.symOn = !B.symOn; $('bSym').classList.toggle('on', B.symOn); };
  $('bView').onclick = () => { S.set.view = S.set.view === 'real' ? 'bp' : 'real'; $('bView').textContent = S.set.view === 'real' ? '실제 색' : '설계도'; saveSoon(); };
  $('bView').textContent = S.set.view === 'real' ? '실제 색' : '설계도';
  $('bBase').onclick = baseModal; $('bRec').onclick = recModal; $('bSet').onclick = setModal;
  $('bLaunch').onclick = launchModal;
  $('bzIn').onclick = () => { B.cam.z = clamp(B.cam.z * 1.3, 0.3, 80); };
  $('bzOut').onclick = () => { B.cam.z = clamp(B.cam.z / 1.3, 0.3, 80); };
  $('bzFit').onclick = fitBuild;
  $('fBuild').onclick = exitToBuild; $('fBase').onclick = baseModal; $('fRec').onclick = recModal;
  $('fMap').onclick = toggleMap; $('fPov').onclick = togglePov;
  $('wUp').onclick = () => warpStep(1); $('wDn').onclick = () => warpStep(-1);
  $('fzIn').onclick = () => flyZoom(2); $('fzOut').onclick = () => flyZoom(1 / 2);
  $('fzFar').onclick = () => {
    const A = active(); if (!A || F.map) return;
    const near = clamp(0.42 * (H - 44) / Math.max(A._Hh, A._W * 0.7, 3), 1e-6, 40);
    const b = BODY[A.body], far = b.kind === 'gal' ? near : Math.min(H, W) * 0.42 / (Math.hypot(A.x, A.y) + b.R * 0.15);
    F.zoom = F.zoom > Math.sqrt(near * far) ? far : near;
  };
  $('stgBtn').onclick = () => { const A = active(); if (A) { doStage(A); refreshFlightUI(); } };
  $('thrMax').onclick = () => setThrottle(1); $('thrOff').onclick = () => setThrottle(0);
  $('sasBtn').onclick = () => { const A = active(); if (A) { A.sas = !A.sas; refreshFlightUI(); } };
  $('matchBtn').onclick = () => { F.match = !F.match; F.autoDock = false; refreshFlightUI(); };
  $('autoDock').onclick = () => {
    const A = active(), T = Vs(world.targetId);
    if (!F.autoDock && A && T && !A.parts.some(p => (isPort(p) && portInfo(A, p)) || (DEFS[p.t].kind === 'claw' && !p.link))) { toast('빈 도킹 포트나 집게가 있어야 해요'); return; }
    if (!F.autoDock && A && T && Math.hypot(vAbs(A).x - vAbs(T).x, vAbs(A).y - vAbs(T).y) > 3000) { toast('목표가 3 km 안에 있을 때 쓸 수 있어요'); return; }
    F.autoDock = !F.autoDock; F.match = false; refreshFlightUI();
  };
  holdBtn($('rotL'), 'rotL'); holdBtn($('rotR'), 'rotR');
  document.querySelectorAll('#rcs button').forEach(b => { const [x, y] = b.dataset.r.split(',').map(Number); holdBtn(b, x < 0 ? 'rcsL' : x > 0 ? 'rcsR' : y > 0 ? 'rcsF' : 'rcsB'); });
  const tr = $('thrTrack');
  const thrAt = e => { const r = tr.getBoundingClientRect(); setThrottle(1 - (e.clientY - r.top) / r.height); };
  tr.addEventListener('pointerdown', e => { e.preventDefault(); try { tr.setPointerCapture(e.pointerId); } catch (er) { } thrAt(e); tr._d = true; });
  tr.addEventListener('pointermove', e => { if (tr._d) thrAt(e); });
  tr.addEventListener('pointerup', () => { tr._d = false; });
  window.addEventListener('blur', () => { F.keys = {}; F.hold = {}; });
}
function init() {
  resize(); loadAll();
  if (!world || !Array.isArray(world.vessels)) world = { scale: S.set.scale, time: 0, vessels: [], activeId: null, targetId: null };
  world.scale = world.scale || S.set.scale || 'easy'; S.set.scale = world.scale;
  setupBodies();
  for (const v of world.vessels.slice()) { try { v._com = null; retopo(v); } catch (e) { console.warn(e); world.vessels = world.vessels.filter(o => o !== v); } }
  if (!world.astro) { makeAsteroids(); world.astro = true; }
  if (!world.iss || world.issVer !== 2) upgradeStation();
  Juice.setMuted(!S.set.sound);
  B.symOn = true;
  $('dName').textContent = D().name;
  bindUI(); buildCats(); buildList(); setHint(); refreshRight(); fitBuild();
  requestAnimationFrame(loop);
}
init();
