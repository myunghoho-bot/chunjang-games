<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>비행기 게임 3D</title>
<style>
:root{--pn:rgba(11,17,25,.86);--pn2:rgba(255,255,255,.045);--ln:rgba(255,255,255,.13);--tx:#e9eff5;--dm:#93a4b5;--ac:#3fa9f5;--ac2:#2a7fc0;--ok:#58cf86;--wn:#f5b63f;--bd:#ff5d55}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0f15;color:var(--tx);font:14px/1.45 'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas#hud{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.scr{position:fixed;inset:0;display:none;pointer-events:none}
.scr.on{display:block}
.pn{pointer-events:auto;background:var(--pn);border:1px solid var(--ln);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button{font:inherit;color:var(--tx);background:#1b2836;border:1px solid var(--ln);border-radius:7px;padding:8px 14px;cursor:pointer;transition:background .12s}
button:hover{background:#25374a}
button.pri{background:var(--ac2);border-color:#56b4f5}
button.pri:hover{background:#3192d8}
button:disabled{opacity:.38;cursor:default}
button.sel{background:#284a68;border-color:#5fb6f0}
h2{font-size:17px;font-weight:700;margin-bottom:10px}
.sub{color:var(--dm);font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1}
.lbl{font-size:12px;color:var(--dm);margin:12px 0 6px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 11px;font-size:13px}
/* 처음 화면 */
#sTitle .pn{position:absolute;left:28px;top:28px;bottom:28px;width:330px;display:flex;flex-direction:column;padding:28px 24px}
.b1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.b1 b{color:var(--ac)}
.b2{color:var(--dm);font-size:13px;margin-top:6px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:34px}
.menu button{padding:13px 16px;font-size:15px;text-align:left}
.foot{margin-top:auto;color:var(--dm);font-size:12px;display:flex;justify-content:space-between}
/* 목록 화면 */
.side{position:absolute;left:20px;top:20px;bottom:20px;width:360px;display:flex;flex-direction:column;padding:18px}
.list{flex:1;overflow-y:auto;margin:10px -6px 12px;padding:0 6px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.it{padding:9px 11px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;display:flex;gap:10px;align-items:center}
.it:hover{background:var(--pn2)}
.it.sel{background:#1f3a54;border-color:#4fa6e6}
.it .nm{font-weight:700}
.it .ds{font-size:12px;color:var(--dm)}
.it.dis{opacity:.4}
.sw{width:30px;height:20px;border-radius:4px;flex:none;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.sw i{position:absolute;right:0;top:0;bottom:0;width:40%}
.sw u{position:absolute;left:0;right:0;bottom:4px;height:3px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;padding:7px 4px}
.info{position:absolute;right:20px;bottom:20px;width:400px;max-height:calc(100% - 40px);overflow-y:auto;padding:18px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;margin:10px 0}
.spec span:nth-child(odd){color:var(--dm)}
.long{font-size:13px;color:#cfd9e3;line-height:1.6}
.fact{margin-top:10px;padding:9px 11px;border-radius:7px;background:rgba(245,182,63,.1);border:1px solid rgba(245,182,63,.3);font-size:12.5px;color:#f3dcae}
.nav{display:flex;gap:8px}
/* 경로 */
#mapBox{position:absolute;left:20px;top:20px;bottom:20px;right:400px;padding:10px;display:flex}
#mapCv{flex:1;width:100%;height:100%;cursor:crosshair;border-radius:6px}
#sRoute .rp{position:absolute;right:20px;top:20px;bottom:20px;width:364px;padding:18px;display:flex;flex-direction:column;overflow-y:auto}
select{font:inherit;color:var(--tx);background:#1b2836;border:1px solid var(--ln);border-radius:7px;padding:7px 9px;width:100%}
.note{font-size:12px;color:var(--wn);margin-top:6px;min-height:16px}
.sum{font-size:13px;margin-top:10px;padding:10px;border-radius:7px;background:var(--pn2)}
/* 비행 중 버튼 */
#flyBtns{position:absolute;right:12px;top:230px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#flyBtns button{padding:7px 10px;font-size:12px;min-width:92px;background:rgba(11,17,25,.8)}
#flyBtns button.on{border-color:var(--wn);color:var(--wn)}
#thrBox{position:absolute;right:120px;top:230px;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px}
#thrBox input{writing-mode:vertical-lr;direction:rtl;height:150px;width:26px}
#thrBox span{font-size:11px;color:var(--dm)}
/* 가운데 창 */
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);overflow-y:auto;padding:22px}
.mid .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mid .btns button{padding:11px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--ln);font-size:13px}
.big{font-size:26px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 6px;border-bottom:1px solid var(--ln);text-align:left}
th{color:var(--dm);font-weight:400}
.keys td:first-child{color:var(--wn);font-weight:700;white-space:nowrap;width:120px}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 26px;font-size:14px;color:var(--dm);z-index:10}
@media (max-width:860px),(max-height:500px){
 #sTitle .pn{width:270px;padding:18px;left:12px;top:12px;bottom:12px}.b1{font-size:24px}.menu{margin-top:18px}
 .side{width:290px;left:10px;top:10px;bottom:10px;padding:12px}.info{width:300px;right:10px;bottom:10px;padding:12px}
 #mapBox{left:10px;top:10px;bottom:10px;right:300px}#sRoute .rp{width:282px;right:10px;top:10px;bottom:10px;padding:12px}
 #flyBtns{top:180px}#thrBox{top:180px;right:116px}#thrBox input{height:110px}
}
</style><script src="../mobile.js"></script>
</head><body>
<canvas id="cv"></canvas><canvas id="hud"></canvas>
<div id="loading" class="pn">대한민국 지형을 만드는 중입니다…</div>

<div class="scr" id="sTitle"><div class="pn">
 <div class="b1">비행기 게임 <b>3D</b></div>
 <div class="b2">대한민국 하늘 · 기종 52 · 항공사 22 · 공항 7</div>
 <div class="menu">
  <button class="pri" id="bStart">비행 시작</button>
  <button id="bLog">비행 기록</button>
  <button id="bHelp">조작 방법</button>
 </div>
 <div class="foot"><span>HJ</span><span id="tCount"></span></div>
</div></div>

<div class="scr" id="sPlane">
 <div class="pn side"><h2>기종 선택</h2>
  <div class="tabs"><button data-tab="pax" class="sel">여객기</button><button data-tab="cargo">화물기</button><button data-tab="mil">군사기</button></div>
  <div class="list" id="plList"></div>
  <div class="nav"><button id="bPlBack">이전</button><button class="pri grow" id="bPlNext">다음</button></div>
 </div>
 <div class="pn info" id="plInfo"></div>
</div>

<div class="scr" id="sAir">
 <div class="pn side"><h2>항공사 선택</h2><div class="sub" id="alSub"></div>
  <div class="list" id="alList"></div>
  <div class="nav"><button id="bAlBack">이전</button><button class="pri grow" id="bAlNext">다음</button></div>
 </div>
</div>

<div class="scr" id="sRoute">
 <div class="pn" id="mapBox"><canvas id="mapCv"></canvas></div>
 <div class="pn rp">
  <h2>비행 계획</h2><div class="sub" id="rtPlane"></div>
  <div id="misBox"><div class="lbl">임무</div><div class="seg" id="segMis"><button data-v="fly">목적지로 비행</button><button data-v="fight">공중전 훈련</button></div>
   <div id="enBox"><div class="lbl">적기 수</div><div class="seg" id="segEn"><button data-v="3">3대</button><button data-v="6">6대</button><button data-v="10">10대</button></div></div></div>
  <div class="lbl">출발 공항</div><select id="selFrom"></select>
  <div id="toBox"><div class="lbl">도착 공항</div><select id="selTo"></select></div>
  <div class="note" id="rtNote"></div>
  <div class="lbl">시작 위치</div><div class="seg" id="segStart"><button data-v="rw">활주로에서</button><button data-v="air">하늘에서</button></div>
  <div class="lbl">시간</div><div class="seg" id="segTod"><button data-v="day">낮</button><button data-v="eve">저녁</button><button data-v="night">밤</button></div>
  <div class="lbl">날씨</div><div class="seg" id="segWx"><button data-v="0">맑음</button><button data-v="1">구름 조금</button><button data-v="2">구름 많음</button></div>
  <div class="sum" id="rtSum"></div>
  <div class="nav" style="margin-top:auto;padding-top:14px"><button id="bRtBack">이전</button><button class="pri grow" id="bRtGo">출발</button></div>
 </div>
</div>

<div class="scr" id="sFly">
 <div class="pn" id="thrBox"><span>추력</span><input type="range" id="thrS" min="0" max="100" value="0"><span id="thrV">0%</span></div>
 <div id="flyBtns"><button id="fGear">바퀴 (G)</button><button id="fCam">시점 (C)</button><button id="fAP">자동 조종 (Z)</button><button id="fMis" style="display:none">미사일 (F)</button><button id="fPause">일시정지 (P)</button></div>
</div>

<div class="scr" id="sPause"><div class="pn mid"><h2>일시정지</h2>
 <div class="btns"><button class="pri" id="bResume">계속하기</button><button id="bMore" style="display:none">적기 더 부르기</button><button id="bRestart">처음부터 다시</button><button id="bToPlane">기종 바꾸기</button><button id="bToTitle">처음 화면</button></div>
 <div style="margin-top:16px">
  <div class="opt"><span>조종 도우미 (손을 떼면 날개가 수평으로)</span><button id="oAssist"></button></div>
  <div class="opt"><span>소리</span><button id="oSound"></button></div>
  <div class="opt"><span>그림자</span><button id="oShadow"></button></div>
 </div>
 <div class="lbl">조작 방법</div><div id="pauseKeys"></div>
</div></div>

<div class="scr" id="sResult"><div class="pn mid" id="resBox"></div></div>
<div class="scr" id="sCrash"><div class="pn mid" id="crBox"></div></div>
<div class="scr" id="sLog"><div class="pn mid" style="width:640px"><h2>비행 기록</h2><div id="logBody"></div><div class="btns"><button id="bLogBack">닫기</button></div></div></div>
<div class="scr" id="sHelp"><div class="pn mid" style="width:560px"><h2>조작 방법</h2><div id="helpBody"></div><div class="btns"><button id="bHelpBack">닫기</button></div></div></div>
<script>

'use strict';
/* ═══════════════ 기본 도구 ═══════════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const D2R=Math.PI/180, R2D=180/Math.PI, G0=9.81;
const hex=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]};
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const mulc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], sc3=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len3=a=>Math.hypot(a[0],a[1],a[2]), norm3=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const madd3=(a,b,k)=>[a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k];
function rotAx(v,ax,an){const c=Math.cos(an),s=Math.sin(an),d=dot3(ax,v),cr=cross3(ax,v);
 return[v[0]*c+cr[0]*s+ax[0]*d*(1-c),v[1]*c+cr[1]*s+ax[1]*d*(1-c),v[2]*c+cr[2]*s+ax[2]*d*(1-c)]}
const wrapPI=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
// 앞 방향과 기울기로 자세 만들기 (F·U·R)
function orient(F,bank){F=norm3(F);let Rh=cross3(F,[0,1,0]);if(len3(Rh)<1e-4)Rh=[0,0,1];Rh=norm3(Rh);const Uh=cross3(Rh,F);
 const U=rotAx(Uh,F,bank),R=cross3(F,U);return{F,U,R:norm3(R)}}
// 값 노이즈
function hash2(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),u),lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),u),v)*2-1}
function fbm(x,y,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=vnoise(x*f+i*17.3,y*f-i*9.1)*a;a*=.5;f*=2.03}return s}
function ridged(x,y,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=(1-Math.abs(vnoise(x*f+i*7.7,y*f+i*3.1)))*a;a*=.5;f*=2.1}return s}
const fmt=(n,d)=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d||0,minimumFractionDigits:d||0});
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),ss=s%60;return m+'분 '+(ss<10?'0':'')+ss+'초'}

/* ═══════════════ 행렬 ═══════════════ */
const M4={
 id(){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;return o},
 persp(f,a,n,fa){const t=1/Math.tan(f/2),r=new Float32Array(16);r[0]=t/a;r[5]=t;r[10]=(fa+n)/(n-fa);r[11]=-1;r[14]=2*fa*n/(n-fa);return r},
 ortho(l,r,b,t,n,f){const o=new Float32Array(16);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o},
 look(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx,o=new Float32Array(16);
  o[0]=xx;o[1]=yx;o[2]=zx;o[4]=xy;o[5]=yy;o[6]=zy;o[8]=xz;o[9]=yz;o[10]=zz;
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);o[15]=1;return o},
 mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o},
 tr(x,y,z){const o=M4.id();o[12]=x;o[13]=y;o[14]=z;return o},
 sc(x,y,z){const o=M4.id();o[0]=x;o[5]=y;o[10]=z;return o},
 rx(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o},
 ry(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o},
 rz(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o},
 basis(F,U,R,p){const o=new Float32Array(16);o[0]=F[0];o[1]=F[1];o[2]=F[2];o[4]=U[0];o[5]=U[1];o[6]=U[2];o[8]=R[0];o[9]=R[1];o[10]=R[2];o[12]=p[0];o[13]=p[1];o[14]=p[2];o[15]=1;return o},
 xf(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14],m[3]*x+m[7]*y+m[11]*z+m[15]]},
 inv(m){const o=new Float32Array(16),a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!d)return M4.id();d=1/d;
  o[0]=(a11*b11-a12*b10+a13*b09)*d;o[1]=(a02*b10-a01*b11-a03*b09)*d;o[2]=(a31*b05-a32*b04+a33*b03)*d;o[3]=(a22*b04-a21*b05-a23*b03)*d;
  o[4]=(a12*b08-a10*b11-a13*b07)*d;o[5]=(a00*b11-a02*b08+a03*b07)*d;o[6]=(a32*b02-a30*b05-a33*b01)*d;o[7]=(a20*b05-a22*b02+a23*b01)*d;
  o[8]=(a10*b10-a11*b08+a13*b06)*d;o[9]=(a01*b08-a00*b10-a03*b06)*d;o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
  o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d;return o}
};

    l:'동체와 날개의 절반 이상을 금속 대신 탄소 섬유 복합재로 만들어 같은 크기의 옛 기종보다 가볍다. 옆에서 보면 조종석 유리가 검은 띠처럼 뒤로 길게 이어져 있어 멀리서도 바로 알아볼 수 있다. 날개 끝은 꺾이지 않고 위로 부드럽게 휘어 올라간다. -900은 A350 가족의 기본형이다.',
    f:'기내 공기를 다른 기종보다 촘촘하게 유지해서 오래 타도 덜 피곤하도록 만들었다.'},
  a351:{s:'A350-900을 7m 늘린 큰 형. 주바퀴가 6개',
    l:'A350-900의 동체를 약 7m 늘린 형식이다. 길어진 만큼 무거워져서 주바퀴가 한쪽에 4개가 아니라 6개로 늘었다. 엔진도 -900보다 힘이 센 것을 단다. 생김새가 -900과 거의 같아서, 둘을 구별할 때는 길이보다 주바퀴 축이 2줄인지 3줄인지를 보는 쪽이 확실하다.',
    f:'바퀴를 늘리는 이유는 무게를 넓게 나눠 밟아 활주로가 덜 상하게 하기 위해서다.'},
  dc10:{s:'수직미익을 관통하는 3번 엔진을 가진 3발기',
    l:'주익 아래에 2개, 수직미익 밑동에 1개, 합쳐서 엔진이 3개다. 과거에는 쌍발기가 대양을 횡단하는 것이 규정으로 금지돼 있었다. 그렇다고 4발기는 비용이 많이 들기 때문에 절충안으로 3발 구조가 나온 것이다. 3번 엔진은 수직미익을 관통하는 형태로 배치했다.',
    f:'지금은 쌍발기도 대양을 건널 수 있게 규정이 바뀌어 3발 여객기는 거의 사라졌다.'},
  l1011:{s:'가운데 엔진이 동체 속에 숨은 3발기',
    l:'꼬리 쪽에 엔진이 하나 더 있는 3발 여객기다. 같은 3발기인 DC-10은 그 엔진을 수직미익에 매달았지만, L-1011은 동체 안에 집어넣었다. 공기는 수직미익 밑동의 구멍으로 들어가 S자로 굽은 관을 타고 내려와 엔진을 지난 뒤 꼬리 끝으로 빠져나간다. 그래서 옆에서 보면 엔진 자체는 보이지 않고 흡입구와 꼬리 끝 배기구만 보인다.',
    f:'관을 S자로 굽히면 공기 흐름이 나빠져 설계가 어렵지만, 엔진을 낮은 곳에 둘 수 있어 정비가 편해진다.'},
  md11:{s:'DC-10의 개량형. 날개 끝에 윙렛이 달렸다',
    l:'DC-10을 개량한 기종이다. 가장 눈에 띄는 차이는 날개 끝에 위아래로 뻗은 윙렛이다. 날개 끝에서는 공기가 소용돌이치며 양력을 깎아먹는데, 윙렛이 이 소용돌이를 억제해 연비를 개선한다. 동체도 DC-10보다 길어져 좌석 수가 늘었다.',
    f:'현재 남아 있는 기체는 대부분 화물기로 운용되고 있다.'},
  md83:{s:'엔진을 꼬리에 단 덕분에 앞자리가 조용하다',
    l:'엔진이 주익이 아니라 동체 후방 양옆에 붙어 있다. 그래서 앞쪽 좌석은 엔진 소음이 거의 들리지 않는다. 반대로 최후방 좌석은 엔진 바로 옆이라 소음이 크다. 주익에 엔진이 없으므로 날개 표면을 지나는 공기 흐름이 깨끗하다. MD-83은 연료를 더 실어 항속거리를 늘린 형식이다.',
    f:'조종사들 사이에서 이 계열은 "매드독"이라는 별칭으로 불린다.'},
  md80:{s:'꼬리 엔진과 T자 미익, 길쭉한 동체',
    l:'엔진이 동체 후방에 있고, 수평미익이 수직미익 꼭대기에 얹힌 T자 미익 구조다. 동체가 매우 가늘고 길어 옆에서 보면 연필처럼 보인다. 앞쪽 좌석에서는 날개가 시야를 가리지 않고 소음도 적어 승객에게 인기가 많았다.',
    f:'꼬리에 엔진을 달면 주익은 깨끗해지지만 무게가 뒤로 쏠려 무게중심을 맞추기가 까다로워진다.'},
  il62:{s:'엔진 4개가 모두 꼬리에 몰린 소련제 장거리기',
    l:'소련이 만든 장거리 여객기다. 엔진 4개가 전부 동체 후방에 몰려 있어 무게가 심하게 뒤로 쏠린다. 승객이 타지 않은 상태에서는 뒤로 주저앉을 위험이 있어, 꼬리 아래에 지지용 다리를 따로 내리도록 설계했다.',
    f:'꼬리 밑에 보조 지지대를 내리는 여객기는 세계적으로도 사례가 드물다.'},
  tu134:{s:'유리 기수를 가졌던 소련제 소형 제트기',
    l:'소련의 단거리 제트 여객기다. 초기형은 기수가 통유리로 되어 있고, 그 안에 지도를 보며 항로를 계산하는 항법사가 앉았다. 위성항법이 보급된 지금은 그런 자리가 필요 없다. 엔진 소음이 높고 날카로워 "휘파람"이라는 별칭이 붙었다.',
    f:'폭격기를 여객기로 개조하며 발전한 계열이라 기수가 유리였던 것이다.'},
  tu154:{s:'한쪽에 바퀴 6개씩 달린 소련제 3발기',
    l:'소련을 대표하는 3발 제트 여객기다. 3번 엔진은 수직미익 밑동에 들어가 있다. 가장 특이한 점은 착륙장치로, 주 바퀴가 한쪽에 6개씩 달려 있다. 포장되지 않은 흙·자갈 활주로가 많은 환경에서 기체 무게를 넓게 분산시키기 위한 설계다. 바퀴는 주익 뒤쪽의 길쭉한 페어링 안으로 접혀 들어간다.',
    f:'험한 활주로에서 운용하는 것을 전제로 설계된, 매우 튼튼한 기체다.'},
  il76p:{s:'고익 구조의 대형 러시아기. 여객형',
    l:'주익이 동체 위에 붙은 고익 구조라 화물실 단면이 넓고 반듯하다. 기수 아래에 유리창이 있어 그 자리에 앉은 승무원이 지상을 직접 관측한다. 원래 군용 수송기이며, 이 형식은 좌석을 넣어 사람을 태우도록 개조한 것이다. 착륙장치 바퀴 수가 많아 비포장 활주로에도 대응한다.',
    f:'주익이 위에 있으면 화물실 바닥이 지면과 가까워져 짐을 싣고 내리기가 훨씬 쉽다.'},
  bae146:{s:'소음이 매우 낮아 도심 공항에 들어가는 4발기',
    l:'엔진이 4개인데도 소음이 매우 낮아 "위스퍼젯", 즉 속삭이는 제트기로 불린다. 큰 엔진 2개 대신 작은 엔진 4개를 달아 소음 수준을 낮췄다. 덕분에 소음 규제가 엄격한 도심 공항에도 취항할 수 있다. 고익에 T자 미익 구조다.',
    f:'소음 규제가 심한 도심 공항에서는 이 기종만 들어올 수 있던 시절도 있었다.'},
  conni:{s:'수직미익이 3개인 곡선 동체의 프로펠러 여객기',
    l:'동체가 물고기처럼 완만하게 휜 곡선을 그리는 프로펠러 여객기다. 수직미익이 3개인 데는 이유가 있다. 필요한 방향 안정성을 미익 하나로 얻으려면 높이가 너무 커져서 당시 격납고 문에 들어가지 못했기 때문에, 같은 면적을 3개로 나눠 단 것이다.',
    f:'가장 아름다운 항공기를 꼽을 때 빠지지 않고 이름이 오르는 기종이다.'},
  an2:{s:'날개가 위아래 2장인 복엽기. 매우 느리게 날 수 있다',
    l:'주익이 위아래로 2장 겹쳐 있는 복엽기다. 날개 면적이 매우 넓어 아주 낮은 속도에서도 양력을 유지한다. 맞바람이 강하면 지상에서 볼 때 뒤로 밀리는 것처럼 보일 정도다. 엔진이 멈춰도 급강하하지 않고 완만하게 내려온다. 60년 넘게 생산된 기록도 가지고 있다.',
    f:'조종 교범에 최저 속도 제한이 명시돼 있지 않은, 대단히 이례적인 기종이다.'},
  c172:{s:'역사상 가장 많이 생산된 항공기',
    l:'4만 대 넘게 생산된, 역사상 가장 많이 만들어진 항공기다. 조종을 배우는 사람 대부분이 이 기종으로 처음 훈련한다. 주익이 동체 위에 붙은 고익 구조라 아래쪽 시야가 트여 있어 지상 관측과 훈련에 유리하다. 착륙장치는 접히지 않는 고정식이다.',
    f:'1958년부터 지금까지 생산이 이어지고 있다.'},
  c408:{s:'대형 화물문을 가진 쌍발 프로펠러기',
    l:'세스나가 만든 쌍발 프로펠러기다. 측면 화물문이 매우 커서 규격 화물 컨테이너를 통째로 밀어 넣을 수 있다. 착륙장치는 접히지 않는 고정식인데, 접이 기구를 없애면 무게가 줄고 고장 요인도 줄어들기 때문이다. 좌석을 넣어 여객용으로도 쓴다.',
    f:'대형 물류 회사가 지선 노선용으로 요구해서 개발된 기종이다.'},
  c182:{s:'172보다 엔진 출력이 높은 상위 기종',
    l:'세스나 172보다 엔진 출력이 높아 더 무거운 짐을 싣고 더 빠르게 순항한다. 프로펠러 날개 각도를 조종사가 조절할 수 있어, 큰 힘이 필요한 이륙 때와 빠르게 가야 하는 순항 때를 나눠 쓸 수 있다.',
    f:'스카이다이빙 강하용 기체로도 널리 쓰인다.'},
  atr72:{s:'단거리 노선을 담당하는 고익 터보프롭기',
    l:'가까운 도시 사이를 오가는 단거리 노선용 여객기다. 고익 구조라 창문에서 지상이 잘 보인다. 엔진은 제트 엔진으로 프로펠러를 돌리는 터보프롭 방식이라 출력이 크면서도 저속에서 연료 효율이 좋다. 짧은 거리를 자주 오가는 노선에서는 제트기보다 운항 비용이 훨씬 낮다.',
    f:'후방에 자체 계단이 있어 탑승교가 없는 공항에서도 승객이 타고 내릴 수 있다.'},
  atr42:{s:'ATR 72의 단축형. 더 짧은 활주로에 대응한다',
    l:'ATR 72의 동체를 줄인 형식이다. 기체가 가벼워 더 짧은 활주로에서도 이착륙할 수 있다. 수요가 적은 소도시나 섬 노선에 적합하다. 형과 외형이 거의 같아 동체 길이로 구분한다.',
    f:'42, 72라는 숫자는 표준 좌석 수를 뜻한다.'},
  conc:{s:'유일하게 실용화된 초음속 여객기',
    l:'음속의 두 배로 순항한, 실용화에 성공한 유일한 초음속 여객기다. 유럽에서 미국까지 통상 8시간 걸리는 노선을 3시간 30분에 주파했다. 기수가 꺾이는 이유는 초음속 저항을 줄이려고 기수를 극단적으로 길고 뾰족하게 만든 탓에 착륙 시 조종사의 전방 시야가 막혔기 때문이다. 그래서 이착륙 때만 기수를 아래로 내린다.',
    f:'초음속으로 날면 공기와의 마찰로 기체가 가열돼 팽창한다. 순항 중 콩코드는 약 20cm 늘어났다.'},
  a380:{s:'전 구간이 2층인 세계 최대 여객기',
    l:'현존하는 가장 큰 여객기다. 747은 앞부분만 2층이지만 A380은 기수부터 꼬리까지 전 구간이 2층이라 창문이 위아래 두 줄로 보인다. 계단도 앞뒤로 두 곳에 있다. 날개폭은 80m에 달한다. 크기에 비해 객실 소음이 낮은 것으로 평가받는다.',
    f:'A380을 받으려면 공항이 탑승교를 2층용으로 새로 만들고 유도로 폭도 넓혀야 했다.'},
  b377:{s:'상하 2개 원통을 겹친 더블 버블 동체',
    l:'동체 단면이 큰 원통과 작은 원통을 위아래로 겹친 형태여서 옆에서 보면 눈사람처럼 보인다. 위층이 객실이고, 계단으로 내려가면 아래층에 라운지가 있었다. 폭격기의 주익과 미익을 그대로 쓰고 동체만 새로 설계한 기종이다.',
    f:'침대칸까지 갖춘 당대 최고급 여객기였다.'},
  comet:{s:'세계 최초의 제트 여객기. 엔진이 날개 뿌리에 매몰됐다',
    l:'세계 최초로 실용화된 제트 여객기다. 엔진이 주익 아래에 매달린 것이 아니라 날개 뿌리 안에 매몰돼 있어 옆에서 보면 흡입구만 보인다. 공기 저항이 적은 대신 정비가 까다롭다. 초기형은 창문이 사각형이었는데, 사각형 모서리에 응력이 집중돼 금속 피로로 균열이 생긴다는 사실이 나중에 밝혀졌다.',
    f:'그때 얻은 교훈 때문에 오늘날 모든 여객기 창문은 모서리가 둥글다.'},
  vfw614:{s:'엔진을 주익 위에 얹은 보기 드문 배치',
    l:'엔진을 주익 위에 얹은, 세계적으로도 드문 배치를 가진 여객기다. 정비 시설이 부족한 지방의 짧고 거친 활주로에서 운용할 목적으로 만들어졌기 때문에 주익을 지면 가까이 낮게 달아야 했고, 그러면 날개 아래에 엔진을 달 공간이 없어진다. 그래서 파일런을 세워 주익 위로 올린 것이다. 흡입구가 높아 지상의 이물질을 빨아들일 위험도 줄었다.',
    f:'배치가 워낙 특이해서인지 총 19대만 생산되고 끝났다.'},
  avanti:{s:'주익 3장과 추진식 프로펠러를 가진 기종',
    l:'기수 쪽 작은 앞날개, 가운데 주익, 꼬리날개까지 양력을 만드는 면이 3장이다. 프로펠러가 앞에서 끄는 견인식이 아니라 주익 뒤에서 미는 추진식이라, 프로펠러 후류가 동체를 때리지 않아 객실이 조용하고 기수 쪽 시야도 트인다. 동체는 단면이 넓은 유선형이다.',
    f:'터보프롭기이면서 소형 제트기에 가까운 순항 속도를 낸다.'},
  b747f:{s:'기수 전체가 위로 열리는 화물형',

function fusMaker(P){
 const L=P.len,H=P.hgt,R=H/2,x0=-L/2,conc=!!P.delta;
 const transport=P.hi&&(P.transportWin||P.glassnose||P.id==='c400'||P.id==='c130'||P.id==='c230');
 let nl=conc?.25*L:P.mount==='nose'?.95*H:P.prop?1.3*H:P.glassnose?1.45*H:1.6*H;
 let tl=conc?.2*L:transport?2.5*H:P.prop?2.8*H:3.1*H;
 nl=Math.min(nl,.3*L);tl=Math.min(tl,.42*L);
 const tn0=1-nl/L,tt0=tl/L,up=transport?1:.7;
 const hump=t=>P.hump?sstep(.60,.70,t)*(1-sstep(.935,.99,t)):0;
 const bel=t=>P.beluga?sstep(.05,.30,t)*(1-sstep(.80,.965,t)):0;
 const wk=P.dbl?.93:1;
 function sec(t){let ym=0,rt=R,rb=R,w=R*wk,kt=0,kb=0;
  if(t>tn0){const u=Math.min((t-tn0)/(1-tn0),1);let s;
   if(conc)s=Math.pow(Math.cos(u*Math.PI/2),.8);else s=Math.pow(Math.max(1-Math.pow(u,2.1),0),.5);
   ym=-R*(conc?.12:P.mount==='nose'?.05:.22)*Math.pow(u,1.5);rt=R*s*(1-.06*u);rb=R*s;w=R*wk*s;
   if(P.glassnose){rb*=1+.1*Math.sin(u*Math.PI);ym-=R*.05*Math.sin(u*Math.PI)}}
  if(t<tt0){const u=1-t/tt0;const yt=R-R*(transport?.25:.42)*Math.pow(u,2.2),yb=-R+R*(.85+up*.75)*Math.pow(u,1.25);
   ym=(yt+yb)/2;rt=rb=Math.max((yt-yb)/2,R*.05);w=Math.max(R*(1-.9*Math.pow(u,1.35)),R*.06)*wk}
  const hm=hump(t);if(hm>0){rt+=R*.42*hm;kt=-.3*hm}
  const bl=bel(t);if(bl>0){rt+=R*1.05*bl;kt=.5*bl}
  if(P.bubble){const m=sstep(.1,.3,t)*(1-sstep(.8,.95,t));rb*=1+.14*m;kb=-.2*m}
  return{ym,rt,rb,w,kt,kb}}
 function pt(x,ph){const s=sec((x-x0)/L),c=Math.cos(ph),sn=Math.sin(ph);return[x,s.ym+(c>0?s.rt*c:s.rb*c),s.w*sn*(c>0?1+s.kt*c:1+s.kb*(-c))]}
 const X=t=>x0+t*L;
 return{L,H,R,x0,tn0,tt0,nl,tl,sec,pt,X,transport,top:x=>{const s=sec((x-x0)/L);return s.ym+s.rt},bot:x=>{const s=sec((x-x0)/L);return s.ym-s.rb},hw:x=>sec((x-x0)/L).w}
}

 $('#resBox').innerHTML='<h2>'+title+'</h2><div class="big" style="color:'+(r.score>=75?'var(--ok)':r.score>=55?'var(--wn)':'var(--bd)')+'">'+r.grade+' · '+r.score+'점</div>'+
  '<table style="margin-top:12px"><tr><th>땅에 닿을 때 내려온 속도</th><td>'+fmt(r.vs,1)+' m/s</td></tr><tr><th>활주로 가운데에서 벗어난 거리</th><td>'+fmt(r.off||0,1)+' m</td></tr><tr><th>비행 시간</th><td>'+fmtTime(r.time)+'</td></tr><tr><th>날아간 거리</th><td>'+fmt(r.dist/1000,1)+' km</td></tr>'+(PL.P.mil?'<tr><th>격추</th><td>'+G.kills+'대</td></tr>':'')+'</table>'+
  '<div class="sub" style="margin-top:8px">내려온 속도가 1 m/s보다 느리면 아주 부드러운 착륙입니다.</div>'+
  '<div class="btns"><button class="pri" id="rBack">돌아가는 비행 ('+(r.at||G.from).name+' → '+G.from.name+')</button><button id="rAgain">같은 비행 다시</button><button id="rPlane">기종 바꾸기</button><button id="rTitle">처음 화면</button></div>';
 $('#rBack').onclick=()=>{const f=r.at||G.to;G.to=G.from;G.from=f;if(G.to===G.from)G.to=AIRPORTS.find(a=>a!==G.from&&okApt(a));G.start='rw';startFlight()};
 if(!r.at||r.at===G.from)$('#rBack').style.display='none';
 $('#rAgain').onclick=startFlight;$('#rPlane').onclick=showPlane;$('#rTitle').onclick=setupTitle;G.paused=true;show('sResult')}
function showCrash(){if(!PL||G.mode!=='fly')return;$('#crBox').innerHTML='<h2>사고가 났습니다</h2><div class="sub" style="font-size:14px;color:#ffb3ad">'+PL.crashWhy+'</div>'+
  '<div class="long" style="margin-top:10px">'+crashTip(PL.crashWhy)+'</div>'+(PL.P.mil&&G.kills?'<div class="sub" style="margin-top:6px">격추 '+G.kills+'대</div>':'')+
  '<div class="btns"><button class="pri" id="cAgain">다시 하기</button><button id="cPlane">기종 바꾸기</button><button id="cTitle">처음 화면</button></div>';
 $('#cAgain').onclick=startFlight;$('#cPlane').onclick=showPlane;$('#cTitle').onclick=setupTitle;show('sCrash')}
function crashTip(w){if(/세게/.test(w))return'착륙 직전에는 ↓ 키를 살짝 눌러 기수를 들고, 추력을 줄여 천천히 내려앉으세요. 계기판의 ▼ 숫자가 3 m/s보다 작으면 안전합니다.';
 if(/날개/.test(w))return'땅 가까이에서는 날개를 수평으로 두세요. ← → 키에서 손을 떼면 날개가 저절로 수평이 됩니다.';
 if(/바다/.test(w))return'바다 위에서는 고도를 충분히 지키세요. 계기판의 "땅에서" 숫자를 보면 바다나 땅까지 남은 높이를 알 수 있습니다.';
 if(/적기/.test(w))return'적기가 뒤에 붙으면 크게 돌거나 높이를 바꿔서 피하세요.';
 if(/벗어/.test(w))return'활주로 위에서는 ← → 키로 방향을 맞추고, 속도가 빠를 때는 조금씩만 누르세요.';
 return'"지형 주의"가 보이면 바로 ↓ 키로 기수를 올리세요. 산이 많은 동쪽에서는 높게 나는 것이 안전합니다.'}
function pauseGame(on){if(G.mode!=='fly'||G.result||(PL&&PL.crashed))return;G.paused=on;if(on){syncOpts();$('#bMore').style.display=PL.P.mil?'':'none';$('#pauseKeys').innerHTML=keysTable();show('sPause')}else show('sFly')}
function syncOpts(){$('#oAssist').textContent=G.settings.assist?'켜짐':'꺼짐';$('#oSound').textContent=G.settings.sound?'켜짐':'꺼짐';$('#oShadow').textContent=G.settings.shadow?'켜짐':'꺼짐'}
function showLog(){const L=G.log.slice().reverse();const kills=G.log.reduce((s,l)=>s+(l.kills||0),0);
 $('#logBody').innerHTML=L.length?'<div class="sub" style="margin-bottom:8px">비행 '+G.log.length+'회 · 착륙 '+G.log.filter(l=>l.at&&l.at!=='바다').length+'회'+(kills?' · 격추 '+kills+'대':'')+'</div><div style="max-height:52vh;overflow-y:auto"><table><tr><th>날짜</th><th>기종</th><th>경로</th><th>결과</th></tr>'+
  L.map(l=>'<tr><td>'+l.d+'</td><td>'+l.pn+'<div class="sub">'+l.a+'</div></td><td>'+(l.mis==='fight'?'공중전 ('+l.from+')':l.from+' → '+(l.at||l.to))+'</td><td>'+l.grade+' · '+l.score+'점'+(l.kills?'<div class="sub">격추 '+l.kills+'</div>':'')+'</td></tr>').join('')+'</table></div>':'<div class="sub">아직 비행 기록이 없습니다.</div>';
 show('sLog')}

/* ═══════════════ 입력 연결 ═══════════════ */
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='SELECT')return;KEY[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 auInit();if(e.repeat)return;
 if(G.mode!=='fly'||!PL)return;
 if(e.code==='KeyP'||e.code==='Escape'){if(G.screen==='pause')pauseGame(false);else pauseGame(true);return}
 if(G.paused)return;
 if(e.code==='KeyG'){gearToggle()}
 else if(e.code==='KeyC')nextCam();
 else if(e.code==='KeyZ')apToggle();
 else if(e.code==='KeyN'&&PL.ap.on&&G.to){PL.ap.nav=!PL.ap.nav;toast(PL.ap.nav?'자동 조종: 목적지 방향으로 갑니다':'자동 조종: 지금 방향 유지')}
 else if(e.code==='KeyT'){if(G.mission==='fight'){toast('공중전 중에는 시간을 빠르게 할 수 없습니다');return}G.time=G.time===1?2:G.time===2?4:1;toast('시간 '+G.time+'배')}
 else if(e.code==='KeyM')G.bigMap=!G.bigMap;
 else if(e.code==='KeyF')fireMissile();
 else if(e.code==='KeyH')G.helpOn=!G.helpOn});
addEventListener('keyup',e=>{KEY[e.code]=false});
addEventListener('blur',()=>{for(const k in KEY)KEY[k]=false});
function gearToggle(){if(!PL||PL.m.fixedGear){toast('이 기종은 바퀴가 고정되어 있습니다');return}if(PL.onGround&&PL.gear===1){toast('땅에서는 바퀴를 올릴 수 없습니다');return}PL.gear=PL.gear?0:1;sfx('gear');toast(PL.gear?'바퀴 내림':'바퀴 올림',1400)}
function apToggle(){if(!PL)return;if(PL.ap.on){PL.ap.on=false;toast('자동 조종 꺼짐');sfx('warn');return}if(PL.onGround||!PL.inAir){toast('하늘에서만 켤 수 있습니다');return}
 PL.ap={on:true,alt:Math.round(PL.pos[1]/10)*10,hdg:hdgOf(PL.F),spd:len3(PL.vel),nav:false};toast('자동 조종 켜짐 — N: 목적지 방향');sfx('beep')}
// 마우스 둘러보기
let dragP=null;cv.addEventListener('pointerdown',e=>{dragP=[e.clientX,e.clientY];CAM.drag=true;cv.setPointerCapture(e.pointerId);auInit()});
cv.addEventListener('pointermove',e=>{if(!dragP)return;const dx=e.clientX-dragP[0],dy=e.clientY-dragP[1];dragP=[e.clientX,e.clientY];CAM.yaw+=dx*.006;CAM.pit=clamp(CAM.pit+dy*.004,-1.2,1.2);CAM.lastDrag=performance.now()});
cv.addEventListener('pointerup',()=>{dragP=null;CAM.drag=false;CAM.lastDrag=performance.now()});
cv.addEventListener('wheel',e=>{CAM.zoom=clamp(CAM.zoom*Math.exp(e.deltaY*.0012),.35,3.5);e.preventDefault()},{passive:false});
// 버튼
$('#bStart').onclick=showPlane;$('#bLog').onclick=showLog;$('#bHelp').onclick=()=>{$('#helpBody').innerHTML=keysTable()+'<div class="long" style="margin-top:12px">이륙: W 키로 추력을 끝까지 올리고, 계기판의 이륙 속도가 되면 ↓ 키로 기수를 듭니다. 하늘에 뜨면 G 키로 바퀴를 올리세요.<br>착륙: 도착 공항 근처에서 "착륙 길잡이"가 나오면 보라색 마름모를 가운데로 맞추며 내려가세요. 활주로 왼쪽의 빨강·하양 불빛(진입각 표시등)이 2개씩이면 알맞은 높이입니다.</div>';show('sHelp')};
$('#bLogBack').onclick=()=>show('sTitle');$('#bHelpBack').onclick=()=>show('sTitle');
for(const b of $$('#sPlane .tabs button'))b.onclick=()=>{PL_TAB=b.dataset.tab;buildPlaneList();const f=PLANES.find(p=>tabOf(p)===PL_TAB);if(tabOf(G.plane)!==PL_TAB)selPlane(f)};
$('#bPlBack').onclick=setupTitle;$('#bPlNext').onclick=showAir;$('#bAlBack').onclick=showPlane;$('#bAlNext').onclick=showRoute;
$('#bRtBack').onclick=()=>{fleetOf(G.plane).length>1?showAir():showPlane()};$('#bRtGo').onclick=startFlight;
$('#selFrom').onchange=e=>{G.from=AP(e.target.value);syncSeg();drawRouteMap()};$('#selTo').onchange=e=>{G.to=AP(e.target.value);syncSeg();drawRouteMap()};
const segs=[['#segMis','mission',v=>v],['#segEn','enemyN',Number],['#segStart','start',v=>v],['#segTod','tod',v=>v],['#segWx','weather',Number]];
for(const[id,k,f]of segs)for(const b of $$(id+' button'))b.onclick=()=>{G[k]=f(b.dataset.v);if(k==='mission'&&G[k]==='fight')G.start='air';syncSeg();drawRouteMap()};
$('#mapCv').addEventListener('click',e=>{const c=$('#mapCv'),m=c._m;if(!m)return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,bd=22;
 for(const a of AIRPORTS){const p=m2p(a.x,a.z,m.ox,m.oy,m.sc),d=Math.hypot(p[0]-x,p[1]-y);if(d<bd&&okApt(a)){bd=d;best=a}}if(!best)return;
 if(e.shiftKey||G.mission==='fight'){G.from=best;if(G.to===best)G.to=AIRPORTS.find(a=>a!==best&&okApt(a))}else{if(best===G.from){G.from=G.to;G.to=best}else G.to=best}fillSel();syncSeg();drawRouteMap()});
addEventListener('resize',()=>{if(G.screen==='route')drawRouteMap()});
$('#fGear').onclick=gearToggle;$('#fCam').onclick=nextCam;$('#fAP').onclick=apToggle;$('#fPause').onclick=()=>pauseGame(true);$('#fMis').onclick=fireMissile;
$('#thrS').oninput=e=>{if(PL){PL.thr=e.target.value/100;PL.rev=0}};
$('#bResume').onclick=()=>pauseGame(false);$('#bRestart').onclick=startFlight;$('#bToPlane').onclick=showPlane;$('#bToTitle').onclick=setupTitle;
$('#bMore').onclick=()=>{G.enemyN+=3;G.missionDone=false;G.mission=G.mission==='fight'?'fight':G.mission;spawnEnemies(3);pauseGame(false);toast('적기 3대가 다가옵니다')};
$('#oAssist').onclick=()=>{G.settings.assist^=1;syncOpts();save()};$('#oSound').onclick=()=>{G.settings.sound^=1;if(G.settings.sound)auInit();syncOpts();save()};$('#oShadow').onclick=()=>{G.settings.shadow^=1;syncOpts();save()};

/* ═══════════════ 한 번씩 확인하는 것 ═══════════════ */
function flightChecks(dt){const c=PL;if(!c||c.crashed)return;const v=len3(c.vel);
 // 착륙 후 멈춤
 if(c.inAir&&c.touched&&c.onGround&&v<2.5){c.stopT+=dt;if(c.stopT>1.2)endFlight('land')}else c.stopT=0;
 // 이륙 콜
 if(c.onGround&&!c.inAir&&!c.pf.fighter){const vr=c.pf.vr;if(v>vr*.92&&!G.calls.v1){G.calls.v1=1;say('V one')}if(v>vr&&!G.calls.rot){G.calls.rot=1;say('rotate')}}
 // 착륙 콜 (전파 고도, 피트)
 if(c.inAir&&!c.onGround&&c.gearPos>.9&&c.vel[1]<-.5&&G.flightT>15){const ft=aglOf(c)*3.28;for(const h of[1000,500,100,50,40,30,20,10]){if(G.callH>h&&ft<=h&&!G.calls['h'+h]){G.calls['h'+h]=1;say(h===1000?'one thousand':h===500?'five hundred':h===100?'one hundred':h===50?'fifty':h===40?'forty':h===30?'thirty':h===20?'twenty':'ten');break}}G.callH=ft}
 if(c.inAir&&!c.onGround&&aglOf(c)*3.28>1200)for(const k in G.calls)if(k[0]==='h')delete G.calls[k];
 // 공중전 다음 무리
 if(G.mission==='fight'&&G.spawned<G.enemyN&&ENEMY.filter(e=>!e.dead).length<2)spawnEnemies(Math.min(3,G.enemyN-G.spawned));
 // 기체 회복
 if(c.P.mil&&!c.burning&&c.hp<100&&G.flightT-(c.lastHit||0)>6)c.hp=Math.min(100,c.hp+dt*3);
 // 지도 끝에서 돌려보내기
 if(c.pos[2]<WZ0+800&&c.vel[2]<0)c.vel[2]*=.98;
 const ts=$('#thrS');if(document.activeElement!==ts){ts.value=Math.round(c.thr*100)}$('#thrV').textContent=Math.round(c.thr*100)+'%';
 $('#fGear').classList.toggle('on',c.gear===0);$('#fAP').classList.toggle('on',!!c.ap.on);
 if(c.ap.on&&!c.inAir)c.ap.on=false}

/* ═══════════════ 메인 루프 ═══════════════ */
let last=performance.now(),ERR=0;
function loop(now){requestAnimationFrame(loop);try{
 const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 if(!G.paused){G.t+=dt;
  if(G.mode==='fly'&&PL){const T=G.time,steps=Math.max(1,Math.ceil(dt*T*120)),h=dt*T/steps,inp=inputs();
   for(let i=0;i<steps;i++){stepPlayer(PL,h,inp);G.flightT+=h}
   if(!PL.crashed)G.dist+=len3(PL.vel)*dt*T;
   const dd=dt*T;stepNPC(dd);stepEnemies(dd);stepCombat(dd);stepShots(dd);emitTrails(PL,dt);for(const n of NPC)if(len3(sub3(n.pos,CAM.pos))<15000)emitTrails(n,dt);
   flightChecks(dt)}
  else if(G.mode==='menu'){titleFlight(dt);if(SHOW&&SHOW.title)emitTrails(SHOW,dt);stepNPC(dt)}
  stepParts(dt*(G.mode==='fly'?G.time:1))}
 updateCamera(dt);render();drawHUD();auUpdate();
}catch(e){ERR++;if(ERR<5)console.error(e)}}
function boot(){try{buildWorld();buildMapImage();buildParked();}catch(e){console.error(e);$('#loading').textContent='지형을 만드는 중 문제가 생겼습니다: '+e.message;return}
 $('#loading').style.display='none';setupTitle();requestAnimationFrame(loop)}
setTimeout(boot,40);

</script>
<script src="../track.js" defer></script>
</body></html>
