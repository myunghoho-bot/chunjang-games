<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>자동차 충돌 실험실</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;font-family:"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;color:#d9e1ea;-webkit-user-select:none;user-select:none}
canvas#cv{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#panel{position:fixed;left:10px;top:10px;bottom:10px;width:276px;background:rgba(13,17,23,.92);border:1px solid #2b3440;border-radius:8px;padding:10px 12px 12px;overflow-y:auto;font-size:12.5px;transition:transform .2s;z-index:5}
#panel.hide{transform:translateX(-300px)}
#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:#2b3440;border-radius:3px}
.hd{display:flex;align-items:center;justify-content:space-between}
h1{font-size:15px;margin:0;letter-spacing:.3px;color:#f3f6f9}
.ver{color:#6f7c8b;font-size:11px;margin:2px 0 4px}
.sec{margin:10px 0 5px;color:#f2a93b;font-size:11.5px;font-weight:bold;letter-spacing:.5px;border-top:1px solid #222a33;padding-top:8px}
button{font:inherit;color:#d9e1ea;background:#1b222b;border:1px solid #2f3a47;border-radius:5px;padding:5px 8px;cursor:pointer}
button:hover{background:#232c37;border-color:#3d4a59}
button.on{background:#3a2c12;border-color:#f2a93b;color:#ffd58a}
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.vlist button{display:flex;flex-direction:column;align-items:flex-start;padding:4px 6px 5px;text-align:left}
.vlist canvas{width:100%;height:30px;display:block;margin-bottom:2px}
.vlist b{font-weight:normal;font-size:12px}
.vlist small{color:#7f8c9b;font-size:10.5px}
.vlist button.on small{color:#c9a76a}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:5px 2px;min-width:52px}
.info{color:#8b98a8;font-size:11px;line-height:1.55;margin-top:5px}
select{width:100%;font:inherit;color:#d9e1ea;background:#1b222b;border:1px solid #2f3a47;border-radius:5px;padding:5px}
.chk{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.chk label{display:flex;align-items:center;gap:6px;color:#aeb9c6;cursor:pointer}
.chk input{accent-color:#f2a93b}
#startBtn{width:100%;margin-top:12px;padding:10px;font-size:14px;font-weight:bold;background:#7a2b1c;border-color:#c4502f;color:#fff}
#startBtn:hover{background:#933522}
.hint{color:#6f7c8b;font-size:11px;margin-top:8px;line-height:1.55}
#showPanel{position:fixed;left:10px;top:10px;z-index:4;display:none}
#hud{position:fixed;right:10px;top:10px;background:rgba(13,17,23,.84);border:1px solid #2b3440;border-radius:8px;padding:8px 10px;font-size:12px;min-width:210px;max-width:290px;z-index:3;pointer-events:none}
#hud .t{color:#f2a93b;font-size:11px;font-weight:bold;margin-bottom:4px;letter-spacing:.5px}
#hud .r{display:flex;justify-content:space-between;gap:12px;line-height:1.6}
#hud .r span{color:#9aa6b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .r b{font-family:Consolas,"D2Coding",monospace;font-weight:normal;color:#eef2f6;white-space:nowrap}
#hud i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#result{position:fixed;right:10px;top:150px;bottom:64px;width:290px;background:rgba(13,17,23,.93);border:1px solid #3a4553;border-radius:8px;padding:9px 11px;font-size:11.5px;z-index:3;display:none;overflow-y:auto}
#result::-webkit-scrollbar{width:6px}#result::-webkit-scrollbar-thumb{background:#2b3440;border-radius:3px}
#result .t{color:#f2a93b;font-weight:bold;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
#result .t button{padding:1px 7px;font-size:11px;font-weight:normal}
#result .car{border-top:1px solid #222a33;padding:6px 0 5px}
#result .car .nm{color:#eef2f6;margin-bottom:2px}
#result .g{display:grid;grid-template-columns:auto auto;gap:1px 10px}
#result .g span{color:#8b98a8}
#result .g b{font-family:Consolas,monospace;font-weight:normal;text-align:right;color:#dfe6ee}
#result .pp{margin-top:3px;color:#aeb9c6}
#result .pp div{display:flex;justify-content:space-between;gap:6px}
.lv0{color:#5fd07a}.lv1{color:#e8d44d}.lv2{color:#f0913a}.lv3{color:#ff5a4a}
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(13,17,23,.86);border:1px solid #2b3440;border-radius:8px;padding:6px 8px;z-index:3;font-size:12px;max-width:calc(100% - 310px)}
#bar .grp{display:flex;gap:3px;align-items:center}
#bar .grp em{font-style:normal;color:#6f7c8b;margin:0 3px 0 6px}
#bar button{padding:4px 8px}
#tip{position:fixed;z-index:6;background:rgba(13,17,23,.95);border:1px solid #3a4553;border-radius:5px;padding:5px 8px;font-size:11.5px;pointer-events:none;display:none;white-space:nowrap;line-height:1.5}
#status{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:rgba(13,17,23,.8);border:1px solid #2b3440;border-radius:6px;padding:4px 10px;font-size:11.5px;color:#aeb9c6;z-index:2;pointer-events:none;white-space:nowrap}
@media (max-height:520px){#hud{font-size:10.5px;padding:5px 7px;min-width:150px}#bar{font-size:11px;padding:4px}#bar button{padding:3px 6px}#result{top:110px}}
@media (max-width:900px){#panel{width:240px;font-size:12px}#bar{max-width:calc(100% - 20px);bottom:6px}#hud{min-width:150px}#result{width:250px}}
</style>
<script src="../mobile.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="panel">
  <div class="hd"><h1>자동차 충돌 실험실</h1><button id="hidePanel">접기</button></div>
  <div class="ver">옆에서 보는 2D 물리 · 차체가 휘고 찌그러짐</div>
  <div class="sec">장소</div>
  <div class="seg" id="mapSeg"></div>
  <div class="sec">차 놓기</div>
  <div class="vlist" id="vehList"></div>
  <div class="sec">장애물 놓기</div>
  <div class="seg" id="obsSeg"></div>
  <div class="seg" style="margin-top:4px"><button id="tErase">지우기</button><button id="tClear">모두 지우기</button></div>
  <div class="info" id="toolInfo"></div>
  <div class="sec">예시 장면</div>
  <select id="preset"></select>
  <div class="sec">탑승</div>
  <div class="seg" id="occSeg"><button data-v="0">없음</button><button data-v="1">운전자만</button><button data-v="2">가득</button></div>
  <div class="seg" id="dumSeg" style="margin-top:4px"><button data-v="1">시험용 인형</button><button data-v="0">사람</button></div>
  <div class="chk">
    <label><input type="checkbox" id="cBelt"> 안전벨트</label>
    <label><input type="checkbox" id="cBag"> 에어백</label>
    <label><input type="checkbox" id="cCargo"> 트럭에 짐 싣기</label>
    <label><input type="checkbox" id="cSlow"> 처음 부딪힐 때 느린 화면</label>
  </div>
  <button id="startBtn">출발</button>
  <div class="hint">땅을 누르면 고른 차가 놓입니다. 차 앞 주황 화살표 끝을 끌면 방향과 속도, 가운데 동그라미를 끌면 위치(위로 끌면 공중), 위쪽 작은 동그라미를 끌면 기울기가 바뀝니다.<br>Space 출발·멈춤 · R 다시 실행 · Delete 고른 것 지우기<br>마우스 휠 확대 · 빈 곳을 끌면 화면 이동</div>
</div>
<button id="showPanel">설정</button>
<div id="status"></div>
<div id="hud"></div>
<div id="result"></div>
<div id="tip"></div>
<div id="bar">
  <div class="grp"><button id="bRestart">다시 실행</button><button id="bPause">일시정지</button></div>
  <div class="grp"><em>배속</em><button data-ts="0.05">0.05</button><button data-ts="0.1">0.1</button><button data-ts="0.25">0.25</button><button data-ts="0.5">0.5</button><button data-ts="1" class="on">1</button></div>
  <div class="grp"><em>보기</em><button data-view="out">겉모습</button><button data-view="in">속 보기</button><button data-view="stress">힘 보기</button></div>
  <div class="grp"><em>화면</em><button id="cFollow" class="on">따라가기</button><button id="bSound" class="on">소리</button></div>
</div>
<script>
'use strict';
/* ===================== 조절값: 숫자를 바꾸려면 여기만 고치면 됨 ===================== */
const TUNE = {
  substeps: 24,         // 한 번 그릴 때(1/60초) 물리 계산 횟수
  fastSubsteps: 36,     // 아주 빠른 차(130 km/h 넘음)가 있을 때
  iters: 2,             // 연결 맞추기 반복
  gravity: 9.81,
  cabinMul: 3.2,        // 실내(안전 공간) 쇠 세기 배수. 앞뒤 찌그러지는 곳보다 단단함
  breakStretch: 0.16,   // 이만큼(16%) 늘어나면 찢어짐
  crushMin: 0.24,       // 찌그러져도 원래 길이의 24% 아래로는 안 줄어듦
  tearStrain: 0.9,      // 여러 번 접혔다 펴진 쇠(누적 90%)는 당기면 찢어짐
  roofSWR: 4,           // 지붕이 버티는 힘 = 차 무게 × 이 값 (진짜 안전 기준은 3배 이상)
  glassStrain: 0.012,   // 창문 칸이 이만큼(1.2%) 비틀리면 유리가 깨짐
  glassAlpha: 1e-6,     // 유리는 고무로 끼워져 있어서 힘을 조금만 받음(부드러움)
  strengthVar: 0.18,    // 연결마다 세기가 조금씩 다른 정도
  beamDamp: 0.16,       // 쇠 떨림 줄이기
  rigidDamp: 3,         // 한 덩어리 안에서 출렁이는 움직임 줄이기(1/초)
  groundBounce: 0.8,    // 땅에서 튀어 오르는 속도 한계(m/s)
  contactW: 1500,       // 땅에 닿을 때 단단함
  wheelContactW: 2600,  // 바퀴가 땅에 닿을 때 단단함
  maxPen: 0.12,         // 땅 속으로 이만큼 넘게는 안 들어감(m)
  fric: [0.5, 0.45, 0.55, 0.6, 0.5], // 쇠가 미끄러질 때 마찰: 아스팔트 풀 흙 바위 콘크리트
  soilSoft: [0, 0.45, 0.5, 0, 0],    // 땅이 무른 정도(파임)
  rollFric: 0.013,      // 바퀴 구름 저항
  brakeMu: 0.85,        // 브레이크 밟은 바퀴 마찰(마른 아스팔트)
  brakeDelay: 0.6,      // 부딪히고 자동으로 브레이크가 걸리기까지(초)
  driveGain: 5,         // 정한 속도 지키기 세기
  driveMaxG: 0.6,       // 가속·감속 한계(g)
  suspZeta: 0.38,       // 서스펜션 출렁임 줄이기
  bodyR: 0.045,         // 차체 점 두께(m)
  airbagDV: 4.6,        // 0.04초 동안 이만큼(m/s, 17 km/h) 속도가 줄면 에어백 터짐
  airbagR: 0.3,         // 운전석 에어백 크기(m)
  airbagFill: 0.03,     // 에어백이 부푸는 시간(초)
  beltSlack: 0.04,      // 어깨 안전벨트 여유(m)
  beltOm: 42,           // 안전벨트가 늘어나는 단단함(클수록 딱딱)
  beltLimitG: 40,       // 안전벨트가 가슴을 잡는 힘 한계(g) — 진짜 차의 '하중 제한 장치'
  neckK: 1400,          // 목이 꺾일 때 버티는 세기(1/초²)
  neckC: 40,            // 목 완충(1/초)
  neckCapG: 50,         // 목이 머리를 잡아 주는 힘 한계(g)
  headLimG: 55,
  accelClipG: 260,      // 충격(g) 잴 때 한 순간(0.0014초)에 튀는 값은 이 아래로 자름 — 계산이 한 번에 밀어낸 몫이라 진짜 몸이 받는 값이 아님         // 머리가 가슴·무릎 쪽으로 끝까지 숙여질 때 받는 힘 한계(g)
  hipOm: 130,
  slipAcc: 6,           // 벨트 없을 때 엉덩이가 방석에서 앞으로 미끄러지지 않게 잡는 힘(m/s², 마찰)           // 엉덩이가 의자(방석·허리 벨트)에 붙어 있는 단단함
  bagOm: 32,            // 에어백 푹신함(작을수록 푹신)
  bagCapG: 25,          // 에어백이 미는 힘 한계(g) — 구멍으로 바람이 빠져서 더 세지 않음
  muscleAcc: 38,        // 사람이 자세를 버티는 힘(m/s²)
  slowmo: 0.2,          // 처음 부딪힐 때 느린 화면 배속
  slowmoTime: 1.3,      // 느린 화면 시간(초, 실제 시간)
  partMax: 2600,        // 불꽃·유리·먼지 최대 개수
  maxSpeed: 300,        // 화살표로 정할 수 있는 최고 속도(km/h)
  speedPerM: 0.06,      // 화살표 길이(m) = 1 + 속도(km/h) × 이 값
};

/* ===================== 도구 ===================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, hyp=Math.hypot, DEG=Math.PI/180;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry32(12345);const rr=(a,b)=>a+(b-a)*rnd();
const sm01=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const shadeCache=new Map();
function shade(hex,f){const k=hex+'|'+f;let c=shadeCache.get(k);if(c)return c;const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;
  if(f<1){r*=f;g*=f;b*=f;}else{const t=f-1;r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t;}
  c='rgb('+(r|0)+','+(g|0)+','+(b|0)+')';shadeCache.set(k,c);return c;}
function mixHex(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const r=lerp(A>>16&255,B>>16&255,t),g=lerp(A>>8&255,B>>8&255,t),bl=lerp(A&255,B&255,t);return '#'+((1<<24)+((r|0)<<16)+((g|0)<<8)+(bl|0)).toString(16).slice(1);}
function pl(pts,x){if(x<pts[0][0]-1e-6||x>pts[pts.length-1][0]+1e-6)return null;
  for(let i=1;i<pts.length;i++){if(x<=pts[i][0]+1e-9){const a=pts[i-1],b=pts[i];const d=b[0]-a[0];const t=d>1e-9?(x-a[0])/d:0;return a[1]+(b[1]-a[1])*clamp(t,0,1);}}return pts[pts.length-1][1];}

/* ===================== 땅 ===================== */
const TER={x0:-700,dx:0.25,n:5601,h:null,h0:null,kind:null,scar:null,skid:null,map:'track'};
const MAPS={
  track:{name:'시험장',info:'평평한 아스팔트 시험장. 10 m마다 거리 표시가 있습니다.'},
  hill:{name:'언덕길',info:'왼쪽이 높은 내리막길(최대 약 13도). 브레이크 없이 굴러 내려갈 수 있습니다.'},
  cliff:{name:'절벽',info:'오른쪽 끝에 32 m 높이 절벽이 있습니다. 아래는 바위와 흙.'},
};
function terrainH(map,x){
  if(map==='hill'){const t=sm01((x+250)/300);return 38*(1-t);}
  if(map==='cliff'){
    if(x<40)return 0;
    if(x<42.6){const t=(x-40)/2.6;return -32*Math.pow(t,0.7)+Math.sin(x*9)*0.4*(1-t)*t*4;}
    return -32+0.7*Math.sin(x*0.37)+0.4*Math.sin(x*1.3+1)+Math.max(0,1.2-Math.abs(x-50)*0.5)*1.4+Math.max(0,1-Math.abs(x-63)*0.4)*1.1;
  }
  return 0;
}
function terrainKind(map,x){
  if(map==='track')return Math.abs(x)<360?0:1;
  if(map==='hill')return x>140?1:0;
  if(map==='cliff'){if(x<36)return 0;if(x<40)return 2;if(x<48)return 3;return x<58?2:1;}
  return 0;
}
function buildTerrain(map){
  TER.map=map;const n=TER.n;TER.h=new Float32Array(n);TER.h0=new Float32Array(n);TER.kind=new Uint8Array(n);TER.scar=new Float32Array(n);TER.skid=new Float32Array(n);
  for(let i=0;i<n;i++){const x=TER.x0+i*TER.dx;TER.h[i]=TER.h0[i]=terrainH(map,x);TER.kind[i]=terrainKind(map,x);}
}
function gIdx(x){let f=(x-TER.x0)/TER.dx;if(f<0)f=0;if(f>TER.n-2.001)f=TER.n-2.001;return f;}
function gH(x){const f=gIdx(x),i=f|0,t=f-i;return TER.h[i]*(1-t)+TER.h[i+1]*t;}
function gSlope(x){const f=gIdx(x),i=Math.max(1,Math.min(TER.n-3,f|0));return (TER.h[i+2]-TER.h[i-1])/(3*TER.dx);}
function gKind(x){return TER.kind[gIdx(x)|0];}

/* ===================== 차 자료 (진짜 크기·무게) =====================
   차 안 좌표: x = 뒤 범퍼 0 → 앞 범퍼 len (m), y = 땅에서 위로 (m).
   bot: 차 바닥선, belt: 창문 아래선(보닛·트렁크 윗면), top: 지붕선(실내 위만, 여러 토막 가능)
   cab: 실내(안전 공간) 범위, glass: 창문 범위, pill: 기둥 위치, crushF: 앞부분이 찌그러질 때 버티는 힘(N)
   eng: 엔진(무거운 덩어리), seats: 엉덩이 위치 x,y·발 높이 fy·옆으로 앉는 사람 수 n */
const VEH={
  mini:{doors:[2.55,1.72,0.75],name:'경차',desc:'길이 3.6 m · 950 kg',len:3.6,mass:950,col:'#d8b84a',r:0.28,wheels:[0.58,2.98],wm:38,dx:0.22,sw:0.4,sag:0.07,
    bot:[[0,0.40],[0.2,0.25],[0.5,0.17],[3.2,0.16],[3.45,0.22],[3.6,0.36]],

function Builder(){const A=()=>[];Object.assign(this,{nx:A(),ny:A(),nm:A(),nk:A(),nr:A(),no:A(),nf:A(),ba:A(),bb:A(),by:A(),bk:A(),bc:A(),bal:A(),bdc:A(),bo:A(),bmax:A(),bmin:A(),brest:A(),bbr:A(),skips:A()});}
Builder.prototype.node=function(p,m,k,r,own,fix){this.nx.push(p[0]);this.ny.push(p[1]);this.nm.push(m);this.nk.push(k);this.nr.push(r);this.no.push(own);this.nf.push(fix?1:0);return this.nx.length-1;};
Builder.prototype.beam=function(a,b,yf,k,o){o=o||{};this.ba.push(a);this.bb.push(b);this.by.push(yf*(o.novar?1:(1+TUNE.strengthVar*(rnd()*2-1))));this.bk.push(k);this.bc.push(o.coll?1:0);
  this.bal.push(o.alpha||0);this.bdc.push(o.damp||0);this.bo.push(o.own!=null?o.own:-9);this.bmax.push(o.max!=null?o.max:TUNE.breakStretch);this.bmin.push(o.min!=null?o.min:TUNE.crushMin);

function inRanges(rs,x){for(const r of rs)if(x>=r[0]&&x<=r[1])return true;return false;}
function topAt(S,x){for(const t of S.top){const v=pl(t,x);if(v!=null)return v;}return null;}

/* 차를 놓을 자리: 바닥·바퀴가 땅 위에 오도록 높이를 맞춤 */
function carPose(item){
  const S=VEH[item.v],len=S.len;const wr=S.wheels[0],wf=S.wheels[S.wheels.length-1];const d=(wf-wr)/2;
  let ang=(item.ang||0)*DEG;
  if((item.h||0)<0.05&&Math.abs(item.ang||0)<1){ang=Math.atan((gH(item.x+d)-gH(item.x-d))/(2*d));}
  const c=Math.cos(ang),s=Math.sin(ang),dir=item.dir;
  const pts=[];const nc=12;for(let i=0;i<=nc;i++){const x=len*i/nc;pts.push([x,pl(S.bot,x),TUNE.bodyR]);const t=topAt(S,x);pts.push([x,t!=null?t:pl(S.belt,x),TUNE.bodyR]);}
  for(const w of S.wheels)pts.push([w,S.r,S.r]);
  let need=-1e9;for(const p of pts){const u=dir*(p[0]-len/2);const wx=item.x+u*c-p[1]*s,wy=u*s+p[1]*c;need=Math.max(need,gH(wx)+p[2]-wy);}
  return {px:item.x,py:need+(item.h||0)+0.004,ang,c,s,dir};
}
function mkT(S,P){return (lx,ly)=>{const u=P.dir*(lx-S.len/2);return [P.px+u*P.c-ly*P.s,P.py+u*P.s+ly*P.c];};}

function buildCar(B,item,ci){

    n0:B.nx.length,b0:B.ba.length,crashT:-1,brake:false,drive:(item.spd||0)>0,vt:(item.spd||0)/3.6,parked:!((item.spd||0)>0),

    if(x<cr){const t=x/Math.max(0.2,cr);return (S.rearMul||1)*(0.72+0.8*clamp(t,0,1));}return TUNE.cabinMul*(S.cabMul||1);};
  car.zf=zf;
  // 점 (질량은 나중에)
  for(let i=0;i<nc;i++){const x=colX[i],r=rows[i];const c=[B.node(T(x,r[0]),0,NK.BODY,TUNE.bodyR,ci),B.node(T(x,r[1]),0,NK.BODY,TUNE.bodyR,ci),-1];
    if(r[2]!=null)c[2]=B.node(T(x,r[2]),0,NK.BODY,TUNE.bodyR,ci);car.G.push(c);}
  const G=car.G;
  // 질량 나누기 (아래 칸 1, 위 칸 0.45 비율)
  const wgt=new Map();const addW=(n,v)=>wgt.set(n,(wgt.get(n)||0)+v);
  for(let i=0;i<nc-1;i++){const a=rows[i],b=rows[i+1];const ar=((a[1]-a[0])+(b[1]-b[0]))/2*dxc;[G[i][0],G[i+1][0],G[i+1][1],G[i][1]].forEach(n=>addW(n,ar/4));
    if(a[2]!=null&&b[2]!=null){const au=((a[2]-a[1])+(b[2]-b[1]))/2*dxc*0.45;[G[i][1],G[i+1][1],G[i+1][2],G[i][2]].forEach(n=>addW(n,au/4));}
    else if(a[2]!=null||b[2]!=null){const hh=a[2]!=null?a[2]-a[1]:b[2]-b[1];const au=hh*dxc*0.5*0.45;const tq=a[2]!=null?G[i][2]:G[i+1][2];[G[i][1],G[i+1][1],tq].forEach(n=>addW(n,au/3));}}
  let sw=0;for(const v of wgt.values())sw+=v;

  for(const [n,v] of wgt)B.nm[n]=bodyM*v/sw;
  if(S.load&&set.cargo){let ls=0;for(const [n,v] of wgt){const lx=localX(car,B,n);if(lx<S.loadX)ls+=v;}for(const [n,v] of wgt){const lx=localX(car,B,n);if(lx<S.loadX)B.nm[n]+=S.load*v/ls;}car.loaded=true;}
  // 아래 칸 연결

  for(let i=0;i<nc-1;i++){const xm=(colX[i]+colX[i+1])/2,z=zf(xm);
    const l0=B.beam(G[i][0],G[i+1][0],0.32*F*z,BK.LON,lonO),l1=B.beam(G[i][1],G[i+1][1],0.30*F*z,BK.LON,lonO);lonB[0][i]=l0;lonB[1][i]=l1;
    const d1=B.beam(G[i][0],G[i+1][1],0.2*F*z,BK.DIAG,dO),d2=B.beam(G[i][1],G[i+1][0],0.2*F*z,BK.DIAG,dO);
    car.cells.push({q:[G[i][0],G[i+1][0],G[i+1][1],G[i][1]],bm:[l0,l1,d1,d2],i,band:0,glass:false,broken:false,lon:[l0,l1]});}
  for(let i=0;i<nc;i++)B.beam(G[i][0],G[i][1],0.22*F*zf(colX[i]),BK.VERT,lonO);
  for(let i=0;i<nc-2;i++){const xm=colX[i+1],z=zf(xm);for(const r of [0,1]){const sb=B.beam(G[i][r],G[i+2][r],0.12*F*z,BK.SKIP,dO);B.skips.push([sb,lonB[r][i],lonB[r][i+1]]);}}
  // 위 칸 (창문·지붕·기둥)
  const roofF=S.mass*g*TUNE.roofSWR;const tops=[];for(let i=0;i<nc;i++)if(rows[i][2]!=null)tops.push(i);
  const isPill=i=>{if(i===tops[0]||i===tops[tops.length-1])return true;for(const px of S.pill)if(Math.abs(colX[i]-px)<=dxc*0.5+1e-6)return true;
    for(let k=1;k<tops.length;k++)if(tops[k]!==tops[k-1]+1&&(i===tops[k]||i===tops[k-1]))return true;return false;};
  let nP=0;for(const i of tops)if(isPill(i)&&inRanges(S.glass,colX[i]))nP++;
  const pF=roofF*0.9/Math.max(2,nP);car.pillar=[];

    const yv=gl?(pi?pF:pF*0.25):0.25*F*zf(colX[i]);B.beam(G[i][1],G[i][2],yv,pi||!gl?BK.PILLAR:BK.FRAME,lonO);if(pi&&gl)car.pillar.push(i);}
  for(let i=0;i<nc-1;i++){const a=rows[i][2]!=null,b=rows[i+1][2]!=null;const xm=(colX[i]+colX[i+1])/2,z=zf(xm);const gl=inRanges(S.glass,xm);
    if(a&&b){const lt=B.beam(G[i][2],G[i+1][2],gl?pF*1.1:0.3*F*z,BK.ROOF,lonO);lonB[2][i]=lt;

      car.cells.push({q:[G[i][1],G[i+1][1],G[i+1][2],G[i][2]],bm:[lt,d1,d2],i,band:1,glass:gl,broken:false,gb:gl?[d1,d2]:null,lon:[lt]});}
    else if(a||b){const tq=a?G[i][2]:G[i+1][2],lo=a?G[i+1][1]:G[i][1];const pb=B.beam(tq,lo,gl?pF*1.1:0.3*F*z,BK.PILLAR,lonO);
      car.cells.push({q:a?[G[i][1],G[i+1][1],G[i][2]]:[G[i][1],G[i+1][1],G[i+1][2]],bm:[pb],i,band:1,glass:gl,broken:false,tri:true,lon:[pb]});}}
  for(let i=0;i<nc-2;i++){if(rows[i][2]!=null&&rows[i+1][2]!=null&&rows[i+2][2]!=null){const gl=inRanges(S.glass,colX[i+1]);const sb=B.beam(G[i][2],G[i+2][2],gl?pF*0.5:0.12*F*zf(colX[i+1]),BK.SKIP,dO);B.skips.push([sb,lonB[2][i],lonB[2][i+1]]);}}

  for(let s=0;s<P.length-1;s++){const px=pp.x[q],py=pp.y[q];const ax=P[s][0],ay=P[s][1],bx=P[s+1][0],by=P[s+1][1];
    const ex=bx-ax,ey=by-ay;const l2=ex*ex+ey*ey;if(l2<1e-8)continue;
    const t=((px-ax)*ex+(py-ay)*ey)/l2;if(t<-0.05||t>1.05)continue;
    const l=Math.sqrt(l2);let nx=-ey/l,ny=ex/l;
    if((rx-ax)*nx+(ry-ay)*ny<0){nx=-nx;ny=-ny;}
    const d=(px-ax)*nx+(py-ay)*ny;
    if(d<rho&&d>-0.45){softPush(pp,q,nx,ny,rho-d,om,0.45,cap);hit=1;
      if(fr){const vx=pp.x[q]-pp.ox[q],vy=pp.y[q]-pp.oy[q];const vn=vx*nx+vy*ny;const tx=vx-vn*nx,ty=vy-vn*ny;pp.x[q]-=tx*fr;pp.y[q]-=ty*fr;}}

function pushCircle(pp,q,cx,cy,R,om){const dx=pp.x[q]-cx,dy=pp.y[q]-cy;const d=hyp(dx,dy);if(d<R&&d>1e-6){softPush(pp,q,dx/d,dy/d,R-d,om,0.3,TUNE.bagCapG*TUNE.gravity);return 1;}return 0;}

    if(car.pvf){const a=hyp(f0.vx-car.pvf[0],f0.vy-car.pvf[1])/h/g;car.gS+=(a-car.gS)*Math.min(1,h/0.01);if(t>0.1&&car.gS>car.maxG)car.maxG=car.gS;}
    car.pvf=[f0.vx,f0.vy];
    const vf=f0.vx*f0.fx+f0.vy*f0.fy;if(!car.vring){car.vring=new Float32Array(29).fill(vf);car.vri=0;}
    const old=car.vring[car.vri];car.vring[car.vri]=vf;car.vri=(car.vri+1)%car.vring.length;
    if(set.bag&&!car.bagFired&&t>0.05&&old-vf>TUNE.airbagDV){car.bagFired=true;for(const s of car.seats)if(s.front1){const pas=car.pp&&car.pp.list.some(p=>p.seat===s&&!p.drv);if(s.drv){s.bag.on=true;s.bag.t=t;s.bag.R=TUNE.airbagR;}if(pas){s.pbag.on=true;s.pbag.t=t;s.pbag.R=TUNE.airbagR*1.3;}}if(car.pp)SND.pop();}

      s.obR=s.roof.map(a=>mapA(a,X,Y));s.obFl=s.floor.map(a=>mapA(a,X,Y));s.obB=SEATBACK.map(p=>tf(f,p[0],p[1]));
      s.obW=s.wheel?s.wheel.map(a=>mapA(a,X,Y)):null;

      if(s.pbag.on){const c=mapA(s.pbagC,X,Y);const R=bagR(s.pbag,t);s.pbagW=[c[0]-f.fx*R*0.6,c[1]-f.fy*R*0.6,R];}else s.pbagW=null;

    const aMax=(set.dummy?24:TUNE.muscleAcc)*h*h;PH=h;const DB=window.DBG||{};

      for(let j=0;j<J;j++){const q=base+j;pp.vx[q]=f.vx+(pp.vx[q]-f.vx)*0.997;pp.vy[q]=f.vy+(pp.vy[q]-f.vy)*0.997;pp.vy[q]-=g*h;pp.ox[q]=pp.x[q];pp.oy[q]=pp.y[q];pp.x[q]+=pp.vx[q]*h;pp.y[q]+=pp.vy[q]*h;}

      {const q=base;const ex=f.ox-pp.x[q],ey=f.oy-pp.y[q];const vx=(pp.x[q]-pp.ox[q])/h-f.vx,vy=(pp.y[q]-pp.oy[q])/h-f.vy;const om=TUNE.hipOm;
        let ax=om*om*ex-1.0*om*vx,ay=om*om*ey-1.0*om*vy;

          const eu=ex*f.fx+ey*f.fy,ev=ex*f.ux+ey*f.uy;let au=ax*f.fx+ay*f.fy,av=ax*f.ux+ay*f.uy;

        pp.x[q]+=ax*h*h;pp.y[q]+=ay*h*h;const e2=hyp(f.ox-pp.x[q],f.oy-pp.y[q]);if(belt&&e2>0.12){const k2=(e2-0.12)/e2;pp.x[q]+=(f.ox-pp.x[q])*k2;pp.y[q]+=(f.oy-pp.y[q])*k2;}}
      for(let j=belt?1:0;j<J;j++){const q=base+j;const T=tf(f,pp.rest[q*2],pp.rest[q*2+1]);let cx=(T[0]-pp.x[q])*0.25,cy=(T[1]-pp.y[q])*0.25;const cl=hyp(cx,cy);const lim=j===0?aMax*0.6:j===2?aMax*(DB.nomus?0:2.5):aMax;if(cl>lim){cx*=lim/cl;cy*=lim/cl;}pp.x[q]+=cx;pp.y[q]+=cy;}
      for(let it=0;it<2;it++){
        for(let q=0;q<BONES.length;q++){const ja=BONES[q][0],jb=BONES[q][1],a=base+ja,b=base+jb;const wa=JM[ja],wb=JM[jb];
          const dx=pp.x[b]-pp.x[a],dy=pp.y[b]-pp.y[a];const l=hyp(dx,dy)||1e-9;const d=(l-pp.bl[k*BONES.length+q])/l/(wa+wb);
          pp.x[a]+=dx*d*wa;pp.y[a]+=dy*d*wa;pp.x[b]-=dx*d*wb;pp.y[b]-=dy*d*wb;}
        if(!DB.lims)for(const lm of LIMS){const a=base+lm[0],b=base+lm[1];const mn=lm[2]*p.sc;const dx=pp.x[b]-pp.x[a],dy=pp.y[b]-pp.y[a];const l=hyp(dx,dy)||1e-9;
          if(l<mn){if(lm[0]===2){if(it===0){PH=h;softPush(pp,a,-dx/l,-dy/l,mn-l,90,0.5,TUNE.headLimG*g);}continue;}
            const wa=JM[lm[0]],wb=JM[lm[1]];const d=(l-mn)/l/(wa+wb)*0.3;pp.x[a]+=dx*d*wa;pp.y[a]+=dy*d*wa;pp.x[b]-=dx*d*wb;pp.y[b]-=dy*d*wb;}}
      }
      if(!DB.neck)neckSpring(pp,base,p,h);
      if(belt){const q=base+1;const dx=pp.x[q]-s.beltW[0],dy=pp.y[q]-s.beltW[1];const d=hyp(dx,dy);if(d>p.beltL){const nx=-dx/d,ny=-dy/d;const e=d-p.beltL;
        const vin=-((pp.x[q]-pp.ox[q])*nx+(pp.y[q]-pp.oy[q])*ny)/h;let a=TUNE.beltOm*TUNE.beltOm*e+2*0.35*TUNE.beltOm*Math.max(0,vin);a=Math.min(a,TUNE.beltLimitG*g);let dd=a*h*h;if(e>0.3)dd=Math.max(dd,e-0.3);pp.x[q]+=nx*dd;pp.y[q]+=ny*dd;}}

      if(t>0.12){const hq=base+2,cq=base+1;const tvx=(pp.vx[cq]*2+pp.vx[base])/3,tvy=(pp.vy[cq]*2+pp.vy[base])/3;const ah=hyp(pp.vx[hq]-pp.hv[k*4],pp.vy[hq]-pp.hv[k*4+1])/h/g,ac=hyp(tvx-pp.hv[k*4+2],tvy-pp.hv[k*4+3])/h/g;

      pp.hv[k*4]=pp.vx[base+2];pp.hv[k*4+1]=pp.vy[base+2];pp.hv[k*4+2]=(pp.vx[base+1]*2+pp.vx[base])/3;pp.hv[k*4+3]=(pp.vy[base+1]*2+pp.vy[base])/3;

function stepWorld(dt){
  const W=WD;if(!W)return;
  const hb=1/60/(W.fast?TUNE.fastSubsteps:TUNE.substeps);const ns=Math.max(1,Math.round(dt/hb));const h=dt/ns;
  let vmax=0;for(let i=0;i<W.n;i+=3){const v=Math.abs(W.vx[i])+Math.abs(W.vy[i]);if(v>vmax)vmax=v;}
  W.contact.fill(0);W.hit.fill(0);computeNear(0.6+vmax*dt*1.3);
  const g=TUNE.gravity;
  for(let st=0;st<ns;st++){
    driveStep(h);
    for(let i=0;i<W.n;i++){if(W.w[i]===0)continue;W.vy[i]-=g*h;W.ox[i]=W.x[i];W.oy[i]=W.y[i];W.x[i]+=W.vx[i]*h;W.y[i]+=W.vy[i]*h;}
    W.lam.fill(0);
    for(let it=0;it<TUNE.iters;it++)solveBeams(h,true);
    groundCollide(h);
    if(anyNear){gridBuild();interCollide(h);}
    for(let i=0;i<W.n;i++){if(W.w[i]===0)continue;W.vx[i]=(W.x[i]-W.ox[i])/h;W.vy[i]=(W.y[i]-W.oy[i])/h;}
    for(let b=0;b<W.nb;b++){if(!W.alive[b])continue;const a=W.ba[b],c=W.bb[b];const wa=W.w[a],wc=W.w[c],ws=wa+wc;if(ws===0)continue;
      const dx=W.x[c]-W.x[a],dy=W.y[c]-W.y[a];const l=hyp(dx,dy)||1;const nx=dx/l,ny=dy/l;
      const kd=W.dmp[b]>0?Math.min(0.9,W.dmp[b]*h*ws):TUNE.beamDamp;
      const dv=(W.vx[c]-W.vx[a])*nx+(W.vy[c]-W.vy[a])*ny;const imp=dv*kd/ws;
      W.vx[a]+=wa*imp*nx;W.vy[a]+=wa*imp*ny;W.vx[c]-=wc*imp*nx;W.vy[c]-=wc*imp*ny;}
    W.pstep++;if(W.pstep&1)peopleStep(2*h);
    if(W.broken.length)processBroken();
    if(W.pstep&1)rigidDamp(2*h);
    W.t+=h;
  }
}
function floorHard(pp,q,P,rx,ry){const ax=P[0][0],ay=P[0][1],bx=P[1][0],by=P[1][1];const ex=bx-ax,ey=by-ay;const l=hyp(ex,ey)||1;let nx=-ey/l,ny=ex/l;if((rx-ax)*nx+(ry-ay)*ny<0){nx=-nx;ny=-ny;}
  const t=((pp.x[q]-ax)*ex+(pp.y[q]-ay)*ey)/(l*l);if(t<-0.1||t>1.1)return;const d=(pp.x[q]-ax)*nx+(pp.y[q]-ay)*ny;if(d<0.02&&d>-0.4){pp.x[q]+=nx*(0.02-d);pp.y[q]+=ny*(0.02-d);}}

let parts=[];
function resetFx(){parts=[];}
// t: 0 불꽃 1 유리 2 먼지 3 부품 조각 4 김 5 물 6 콘크리트 7 나무 8 타이어 연기
function part(t,x,y,vx,vy,life,size,col){if(parts.length>=TUNE.partMax)parts.splice(0,60);parts.push({t,x,y,vx,vy,life,max:life,size,col,a:rnd()*6,va:rr(-12,12),rest:false});}
function glassBurst(c){const W=WD;let cx=0,cy=0,vx=0,vy=0;for(const n of c.q){cx+=W.x[n];cy+=W.y[n];vx+=W.vx[n];vy+=W.vy[n];}const k=c.q.length;cx/=k;cy/=k;vx/=k;vy/=k;
  for(let i=0;i<14;i++)part(1,cx+rr(-0.25,0.25),cy+rr(-0.2,0.2),vx*rr(0.5,1)+rr(-2.5,2.5),vy*0.6+rr(-1,3),rr(2.5,5),rr(0.025,0.06));}
function updateFx(dt){
  const g=TUNE.gravity;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    if(p.t===4||p.t===8){p.vy+=(p.t===4?1.2:0.6)*dt;p.vx*=1-1.2*dt;p.vy*=1-1.0*dt;p.size+=dt*(p.t===4?0.22:0.6);p.x+=p.vx*dt;p.y+=p.vy*dt;continue;}
    if(p.t===2){p.vy-=0.6*dt;p.vx*=1-1.5*dt;p.vy*=1-1.5*dt;p.size+=dt*0.3;p.x+=p.vx*dt;p.y+=p.vy*dt;continue;}
    if(p.rest)continue;
    p.vy-=g*dt;p.vx*=1-0.15*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;
    const gh=gH(p.x)+p.size*0.4;
    if(p.y<gh){p.y=gh;if(p.t===0||p.t===5){p.life=Math.min(p.life,p.t===5?0.15:0.05);p.vy=0;p.vx*=0.3;}
      else{p.vy=-p.vy*0.25;p.vx*=0.55;p.va*=0.5;if(Math.abs(p.vy)<0.6&&Math.abs(p.vx)<0.4){p.rest=true;p.life=Math.min(p.life+20,40);p.max=Math.max(p.max,p.life);}}}
  }
}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1;
const cam={x:0,y:3,z:40,tx:0,ty:3,tz:40,user:false};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.width=Math.max(2,Math.floor(innerWidth*DPR));H=cv.height=Math.max(2,Math.floor(innerHeight*DPR));}
function panelW(){const p=document.getElementById('panel');return p&&!p.classList.contains('hide')&&innerWidth>700?(p.offsetWidth+16)*DPR:0;}
function panelR(){const r=document.getElementById('result');return r&&r.style.display==='block'&&innerWidth>700?(r.offsetWidth+16)*DPR:0;}
function viewCX(){return (W+panelW()-panelR())/2;}
function W2S(x,y){return [(x-cam.x)*cam.z+viewCX(),H*0.58-(y-cam.y)*cam.z];}
function S2W(sx,sy){return [(sx-viewCX())/cam.z+cam.x,(H*0.58-sy)/cam.z+cam.y];}
function setWorld(){ctx.setTransform(cam.z,0,0,-cam.z,viewCX()-cam.x*cam.z,H*0.58+cam.y*cam.z);}
function pxw(p){return p*DPR/cam.z;}

function interestBox(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;const W_=WD;
  if(W_){const run=STATE.mode==='run';
    for(const car of CARS){for(let i=car.n0;i<car.n1;i++){if(run&&W_.comp[i]!==car.mainComp)continue;const x=W_.x[i],y=W_.y[i];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
      if(!run){const ar=arrowGeo(car);if(ar){x0=Math.min(x0,ar.tip[0]);x1=Math.max(x1,ar.tip[0]);}}}
    const cx0=x0,cx1=x1;for(const o of OBJS){if(run&&CARS.length&&(o.x<cx0-12||o.x>cx1+12))continue;for(const n of o.nodes){const x=W_.x[n],y=W_.y[n];if(run&&(o.type==='pole'||o.type==='tree')&&y>gH(x)+3)continue;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}}
  if(x0>x1){x0=-14;x1=14;y0=gH(0);y1=y0+6;}
  return [x0,x1,y0,y1];
}
function camFit(snap){
  const b=interestBox();const vw=(W-panelW()-panelR())*0.8,vh=H*0.62;
  const wx=Math.max(8,b[1]-b[0]+4),wy=Math.max(4,b[3]-b[2]+3);
  let z=Math.min(vw/wx,vh/wy);z=clamp(z,3*DPR,140*DPR);
  cam.tz=z;cam.tx=(b[0]+b[1])/2;cam.ty=(b[2]+b[3])/2-0.08*(H/z);
  if(snap){cam.x=cam.tx;cam.y=cam.ty;cam.z=cam.tz;}
}
function camStep(dt){if(STATE.follow&&!cam.user&&STATE.mode==="run")camFit(false);const k=1-Math.exp(-dt*(STATE.mode==='run'?3.5:8));
  if(!cam.user){cam.x+=(cam.tx-cam.x)*k;cam.y+=(cam.ty-cam.y)*k;cam.z*=Math.pow(cam.tz/cam.z,k);}}

/* 하늘·먼 산 */
function farZ(){return DPR*1.6*Math.pow(cam.z/DPR,0.4);}
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#86afd6');g.addColorStop(0.55,'#c7dbea');g.addColorStop(1,'#e4ebef');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const base=H*0.58+cam.y*farZ()*0.4;
  const layer=(par,amp,col,yo,seed)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);const step=6*DPR;
    for(let sx=0;sx<=W+step;sx+=step){const wx=(sx-viewCX())/(farZ()*par*4)+cam.x;const u=wx*par*0.02+seed;
      const h=amp*(0.55*Math.sin(u*0.9)+0.3*Math.sin(u*2.3+1.3)+0.15*Math.sin(u*5.1+2));ctx.lineTo(sx,base-yo*DPR-h*DPR);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();};
  layer(0.08,40,'#a9bfd2',95,1);layer(0.16,28,'#93aabd',60,7);
  if(TER.map==='hill')layer(0.3,22,'#7f9a83',30,3);
  // 먼 들판
  const hz=H*0.58+cam.y*farZ();const fg=ctx.createLinearGradient(0,hz,0,H);fg.addColorStop(0,'#a7b09b');fg.addColorStop(1,'#7f8a6f');ctx.fillStyle=fg;ctx.fillRect(0,hz,W,H-hz);
  // 구름
  ctx.fillStyle='rgba(255,255,255,.55)';for(let k=0;k<7;k++){const wx=k*180-((cam.x*0.04*cam.z/DPR)%1260)+60;const sx=((wx%1260)+1260)%1260*DPR-80*DPR;const sy=(40+((k*53)%90))*DPR;

function drawSand(car){const P=(x,y)=>aP(car,x,y);ctx.fillStyle='#9a7b52';ctx.beginPath();const p0=P(0.35,2.72);ctx.moveTo(p0[0],p0[1]);for(let x=0.35;x<=6.3;x+=0.4){const p=P(x,2.72+0.42*Math.sin((x-0.35)/5.95*Math.PI));ctx.lineTo(p[0],p[1]);}const p1=P(6.3,2.72);ctx.lineTo(p1[0],p1[1]);ctx.closePath();ctx.fill();}

function drawCar(car){

const SND=(()=>{
  let ac=null,master=null,noise=null,scrG=null,skG=null,on=true;
  function init(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    master=ac.createGain();master.gain.value=on?0.6:0;master.connect(ac.destination);
    const len=ac.sampleRate*2;noise=ac.createBuffer(1,len,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const loop=(type,f,q)=>{const s=ac.createBufferSource();s.buffer=noise;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(master);s.start();return g;};
    scrG=loop('bandpass',2600,1.3);skG=loop('bandpass',950,4);}
  function burst(dur,freq,type,gain,q,delay){if(!ac||!on||gain<=0.001)return;const s=ac.createBufferSource();s.buffer=noise;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;const g=ac.createGain();const t=ac.currentTime+(delay||0);
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);}
  function ping(freq,dur,gain,delay){if(!ac||!on)return;const o=ac.createOscillator();o.type='sine';o.frequency.value=freq;const g=ac.createGain();const t=ac.currentTime+(delay||0);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.0005,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
  let lc=0,lg=0,ls=0;
  return{init,setOn(v){on=v;if(master)master.gain.value=v?0.6:0;},get on(){return on;},
    crunch(v){if(!ac)return;const t=ac.currentTime;if(t-lc<0.05)return;lc=t;burst(0.22+0.5*v,700+900*v,'lowpass',0.55*v+0.05);burst(0.45+0.6*v,130,'lowpass',0.75*v);if(v>0.35)ping(420+Math.random()*500,0.35,0.035*v);},
    glass(v){if(!ac)return;const t=ac.currentTime;if(t-lg<0.06)return;lg=t;burst(0.4,4200,'highpass',0.3*v+0.05);for(let k=0;k<4;k++)ping(2800+Math.random()*3800,0.09,0.03*v,k*0.025+Math.random()*0.03);},
    snap(v){if(!ac)return;const t=ac.currentTime;if(t-ls<0.05)return;ls=t;burst(0.12,2400+Math.random()*1500,'bandpass',0.22+v*0.25,3);},
    pop(){if(!ac)return;burst(0.14,320,'lowpass',0.7);burst(0.3,1300,'bandpass',0.25,1);},
    scrape(v){if(!ac)return;scrG.gain.setTargetAtTime(on?Math.min(0.5,v*0.45):0,ac.currentTime,0.05);},
    skid(v){if(!ac)return;skG.gain.setTargetAtTime(on?Math.min(0.4,v*0.35):0,ac.currentTime,0.06);},
  };
})();

}

  for(const car of CARS){const g=arrowGeo(car);test(g.tip,'arrow',car.item);test(g.c,'move',car.item);if(STATE.sel===car.item||STATE.hover===car.item)test(g.rot,'rot',car.item);}

function personAt(sx,sy){let best=null,bd=18*DPR;for(const car of CARS){const pp=car.pp;if(!pp)continue;for(let k=0;k<pp.n;k++){const s=W2S(pp.x[k*J+2],pp.y[k*J+2]);const d=hyp(s[0]-sx,s[1]-sy);if(d<bd){bd=d;best={car,k};}}}return best;}
function hoverAt(sx,sy,e){
  if(STATE.mode==='ready'){const h=hitHandle(sx,sy);const [wx,wy]=S2W(sx,sy);const it=h?h.item:hitItem(wx,wy);if(it!==STATE.hover){STATE.hover=it;}cv.style.cursor=h?(h.type==='arrow'?'ew-resize':h.type==='rot'?'alias':'move'):STATE.tool?'crosshair':'default';tipEl.style.display='none';return;}
  const p=personAt(sx,sy);if(p){const pp=p.car.pp,ps=pp.list[p.k];const lv=injLv(pp.hmax[p.k],pp.cmax[p.k]);
    tipEl.innerHTML=p.car.S.name+' · '+ps.name+'<br>머리 최대 <b>'+pp.hmax[p.k].toFixed(0)+' g</b> · 가슴 최대 <b>'+pp.cmax[p.k].toFixed(0)+' g</b><br>판정: <span class="lv'+lv+'">'+LVN[lv]+'</span>';
    tipEl.style.display='block';tipEl.style.left=(e.clientX+14)+'px';tipEl.style.top=(e.clientY+10)+'px';}else tipEl.style.display='none';}
function clickInfo(sx,sy){}

/* ===================== 판정 ===================== */
const LVN=['좋음','보통','나쁨','아주 나쁨'];
function injLv(hg,cg){const a=hg<60?0:hg<80?1:hg<120?2:3,b=cg<45?0:cg<60?1:cg<80?2:3;return Math.max(a,b);}

/* ===================== 매 프레임 차 상태 ===================== */
function carFrame(car,dt){
  const S=car.S;const L=carLens(car);const L0=car.L0;
  car.crF=Math.max(0,L0.f-L.f);car.crR=Math.max(0,L0.r-L.r);car.crCab=Math.max(0,L0.cab-L.cab);car.crRoof=Math.max(0,L0.roof-L.roof);
  const F=carFwd(car);const sp=hyp(F.vx,F.vy)*3.6;if(sp>car.maxSpd)car.maxSpd=sp;
  if(car.crF>0.04&&car.lightsF<1){car.lightsF=1;const p=aP(car,S.len-0.1,pl(S.belt,S.len-0.15)-0.06);for(let k=0;k<8;k++)part(1,p[0],p[1],F.vx*0.6+rr(-2,2),F.vy*0.5+rr(0,2.5),rr(2,4),rr(0.02,0.04));}
  if(car.crR>0.04&&car.lightsR<1){car.lightsR=1;const p=aP(car,0.1,pl(S.belt,0.1)-0.08);for(let k=0;k<8;k++)part(1,p[0],p[1],F.vx*0.6+rr(-2,2),F.vy*0.5+rr(0,2.5),rr(2,4),rr(0.02,0.04));}
  const dbr=Math.floor((car.crF+car.crR)/0.18);if(dbr>(car.dbr||0)){car.dbr=dbr;const front=car.crF>car.crR;const p=front?aP(car,S.len-0.05,S.r+0.15):aP(car,0.05,S.r+0.15);
    for(let k=0;k<2;k++)part(3,p[0],p[1],F.vx*0.7+rr(-3,3),F.vy+rr(0,3),rr(6,12),rr(0.03,0.07),k?'#26282c':shade(car.col,0.75));}
  if(car.crF>0.25&&!S.bus&&!car.steamOn){car.steamOn=true;car.steam=9;}
  if(car.steam>0){car.steam-=dt;if(rnd()<0.25){const p=aP(car,S.len-0.5,pl(S.belt,S.len-0.5)+0.05);part(4,p[0]+rr(-0.2,0.2),p[1],rr(-0.3,0.3),rr(0.3,0.8),rr(1.2,2.2),rr(0.05,0.1));}}
  if(car.brake){for(const wh of car.wheels){if(wh.lost)continue;if(WD.contact[wh.n]>4&&rnd()<0.25)part(8,WD.x[wh.n],WD.y[wh.n]-wh.r*0.8,rr(-0.5,0.5),rr(0.2,0.8),rr(0.8,1.6),0.15);}}
  // 바퀴 돌기
  for(const wh of car.wheels){const n=wh.n;if(WD.t-WD.gct[n]<0.03){wh.spin=(car.brake&&!wh.lost)?0:WD.wv[n]/wh.r;}else wh.spin*=Math.exp(-dt*0.3);wh.ang-=wh.spin*dt;}
}

/* ===================== HUD·결과 ===================== */
const hudEl=document.getElementById('hud'),resEl=document.getElementById('result'),statusEl=document.getElementById('status');
let hudN=0;
function hud(){if(hudN++%6)return;
  let h='';
  if(STATE.mode==='ready'){h+='<div class="t">준비</div>';if(!CARS.length)h+='<div class="r"><span>놓인 차 없음</span></div>';}
  else{h+='<div class="t">'+(STATE.paused?'일시정지':'진행 중')+' · '+(WD?WD.t:0).toFixed(2)+' 초'+(STATE.slowT>0?' · 느린 화면':'')+'</div>';}
  CARS.slice(0,9).forEach(c=>{const F=carFwd(c);const kmh=STATE.mode==='ready'?(c.item.spd||0):Math.abs(F.vf)*3.6;
    const st=STATE.mode==='ready'?(c.item.h>0?'공중 '+c.item.h.toFixed(1)+' m':''):c.crashT>=0?'부딪힘':'';
    h+='<div class="r"><span><i style="background:'+c.col+'"></i>'+c.S.name+(st?' · '+st:'')+'</span><b>'+kmh.toFixed(0)+' km/h</b></div>';});
  if(CARS.length>9)h+='<div class="r"><span>외 '+(CARS.length-9)+'대</span></div>';
  hudEl.innerHTML=h;
  // 상태 줄
  let s='';if(STATE.mode==='ready'){if(STATE.tool==='erase')s='지우기: 지울 것을 누르세요 (Esc 취소)';else if(STATE.tool){const [k,id]=STATE.tool.split(':');s=(k==='veh'?VEH[id].name:OBS[id].name)+': 땅을 누르면 놓입니다 (공중을 누르면 공중에, Esc 취소)';}
    else s=CARS.length?'Space 또는 출발 버튼으로 시작합니다':'왼쪽에서 차를 고른 뒤 땅을 누르세요';}
  else s=STATE.paused?'일시정지 (Space 계속)':'R 다시 실행 · 화면을 끌면 이동, 휠로 확대';
  statusEl.textContent=s;
  // 결과
  if(STATE.mode==='run'&&WD.first>=0&&WD.t-WD.first>0.25&&STATE.resOpen){resEl.style.display='block';resEl.innerHTML=resultHtml();}
  else resEl.style.display='none';
}
function resultHtml(){let h='<div class="t"><span>충돌 결과</span><button onclick="STATE.resOpen=false">닫기</button></div>';
  for(const c of CARS){if(c.crashT<0&&c.maxG<2)continue;const S=c.S;
    h+='<div class="car"><div class="nm"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:'+c.col+'"></i>'+S.name+'</div><div class="g">';
    h+='<span>차 안 최대 충격</span><b>'+c.maxG.toFixed(0)+' g</b>';
    h+='<span>처음 속도</span><b>'+(c.item.spd||0)+' km/h</b>';
    h+='<span>앞 찌그러짐</span><b>'+(c.crF*100).toFixed(0)+' cm</b>';
    if(c.crR>0.01)h+='<span>뒤 찌그러짐</span><b>'+(c.crR*100).toFixed(0)+' cm</b>';
    h+='<span>실내 줄어듦</span><b>'+(c.crCab*100).toFixed(0)+' cm</b>';
    if(c.crRoof>0.01)h+='<span>지붕 내려앉음</span><b>'+(c.crRoof*100).toFixed(0)+' cm</b>';
    h+='<span>운동 에너지</span><b>'+(c.ke0/1000).toFixed(0)+' kJ</b>';
    h+='<span>찌그러지며 쓴 에너지</span><b>'+(c.pe/1000).toFixed(0)+' kJ</b>';
    if(c.glassBroken)h+='<span>깨진 유리</span><b>'+c.glassBroken+' 장</b>';
    if(c.lostWheels)h+='<span>빠진 바퀴</span><b>'+c.lostWheels+' 개</b>';
    if(c.bagFired)h+='<span>에어백</span><b>터짐</b>';
    h+='</div>';
    if(c.pp){h+='<div class="pp">';const pp=c.pp;for(let k=0;k<pp.n;k++){const lv=injLv(pp.hmax[k],pp.cmax[k]);
      h+='<div><span>'+pp.list[k].name+' 머리 '+pp.hmax[k].toFixed(0)+' · 가슴 '+pp.cmax[k].toFixed(0)+' g</span><span class="lv'+lv+'">'+LVN[lv]+'</span></div>';}h+='</div>';}
    h+='</div>';}
  h+='<div class="info">g = 몸이 받는 힘(몸무게의 몇 배). 판정은 머리·가슴이 받은 충격으로 정합니다. 충돌 시험 기준: 머리 80 g, 가슴 60 g 넘으면 위험.</div>';
  return h;}

/* ===================== 왼쪽 판 ===================== */
const $=id=>document.getElementById(id);
function vehIcon(cvs,S,col){const c=cvs.getContext('2d');const w=cvs.width=120,h=cvs.height=30;c.clearRect(0,0,w,h);
  const hmax=Math.max(...S.top.flat().map(p=>p[1]),...S.belt.map(p=>p[1]));const sc=Math.min(112/S.len,26/hmax);const ox=(w-S.len*sc)/2,oy=h-2;
  const P=(x,y)=>[ox+x*sc,oy-y*sc];c.fillStyle=col;c.beginPath();let p=P(0,pl(S.bot,0));c.moveTo(p[0],p[1]);
  for(let x=0;x<=S.len+1e-6;x+=S.len/40){p=P(x,pl(S.bot,x));c.lineTo(p[0],p[1]);}
  for(let x=S.len;x>=-1e-6;x-=S.len/60){const t=topAt(S,x);p=P(x,t!=null&&t>pl(S.belt,x)?t:pl(S.belt,x));c.lineTo(p[0],p[1]);}c.closePath();c.fill();
  c.fillStyle='rgba(30,40,52,.85)';for(const x of S.wheels){const q=P(x,S.r);c.beginPath();c.arc(q[0],q[1],S.r*sc,0,7);c.fillStyle='#15161a';c.fill();c.beginPath();c.arc(q[0],q[1],S.r*sc*0.5,0,7);c.fillStyle='#9aa1a8';c.fill();}
  if(S.dump){c.fillStyle=S.col2;c.beginPath();let q=P(0.1,1.4);c.moveTo(q[0],q[1]);for(const pp of [[6.5,1.4],[6.5,2.7],[0.2,2.7]]){q=P(pp[0],pp[1]);c.lineTo(q[0],q[1]);}c.fill();}}
function buildUI(){
  $('mapSeg').innerHTML=Object.keys(MAPS).map(k=>'<button data-m="'+k+'">'+MAPS[k].name+'</button>').join('');
  $('mapSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;set.map=b.dataset.m;toReady();save();};
  const vl=$('vehList');vl.innerHTML='';for(const id of VEH_ORDER){const S=VEH[id];const b=document.createElement('button');b.dataset.t='veh:'+id;b.innerHTML='<canvas></canvas><b>'+S.name+'</b><small>'+S.desc+'</small>';vl.appendChild(b);vehIcon(b.querySelector('canvas'),S,S.col);}
  vl.onclick=e=>{const b=e.target.closest('button');if(!b)return;pickTool(b.dataset.t);};
  $('obsSeg').innerHTML=OBS_ORDER.map(k=>'<button data-t="obs:'+k+'" title="'+OBS[k].desc+'">'+OBS[k].name+'</button>').join('');
  $('obsSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;pickTool(b.dataset.t);};
  $('tErase').onclick=()=>pickTool('erase');
  $('tClear').onclick=()=>{if(!set.items.length)return;if(!confirm('놓은 차와 장애물을 모두 지울까요?'))return;set.items=[];STATE.sel=null;toReady();save();};
  $('preset').innerHTML='<option value="">장면 고르기</option>'+PRESETS.map((p,i)=>'<option value="'+i+'">'+p.name+'</option>').join('');
  $('preset').onchange=e=>{const v=e.target.value;if(v==='')return;loadPreset(+v);e.target.value='';};
  $('occSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;set.occ=+b.dataset.v;rebuildAll();};
  $('dumSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;set.dummy=b.dataset.v==='1';syncUI();save();};
  for(const [id,k] of [['cBelt','belt'],['cBag','bag'],['cCargo','cargo'],['cSlow','slow']])$(id).onchange=e=>{set[k]=e.target.checked;if(k!=='slow')rebuildAll();else save();};
  $('startBtn').onclick=()=>{if(STATE.mode==='run')restart();else start();};
  $('bRestart').onclick=()=>restart();
  $('bPause').onclick=()=>{if(STATE.mode==='run'){STATE.paused=!STATE.paused;syncUI();}};
  document.querySelectorAll('#bar [data-ts]').forEach(b=>b.onclick=()=>{STATE.ts=+b.dataset.ts;syncUI();});
  document.querySelectorAll('#bar [data-view]').forEach(b=>b.onclick=()=>{STATE.view=b.dataset.view;syncUI();});
  $('cFollow').onclick=()=>{STATE.follow=!STATE.follow;cam.user=!STATE.follow;syncUI();};
  $('bSound').onclick=()=>{SND.init();SND.setOn(!SND.on);syncUI();};
  $('hidePanel').onclick=()=>{$('panel').classList.add('hide');$('showPanel').style.display='block';};
  $('showPanel').onclick=()=>{$('panel').classList.remove('hide');$('showPanel').style.display='none';};
}
function rebuildAll(){if(STATE.mode==='run')toReady(false);else rebuild();syncUI();save();}
function pickTool(t){if(STATE.mode==='run')toReady(false);STATE.tool=STATE.tool===t?null:t;syncUI();}
function loadPreset(i){const p=PRESETS[i];set.map=p.map;set.items=JSON.parse(JSON.stringify(p.items));STATE.sel=null;STATE.tool=null;toReady();save();}
function syncUI(){
  document.querySelectorAll('#mapSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===set.map));
  document.querySelectorAll('#vehList button,#obsSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===STATE.tool));
  $('tErase').classList.toggle('on',STATE.tool==='erase');
  document.querySelectorAll('#occSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.v===set.occ));
  document.querySelectorAll('#dumSeg button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===!!set.dummy));
  $('cBelt').checked=set.belt;$('cBag').checked=set.bag;$('cCargo').checked=set.cargo;$('cSlow').checked=set.slow;
  $('toolInfo').textContent=MAPS[set.map].info;
  $('startBtn').textContent=STATE.mode==='run'?'다시 실행':'출발';
  $('bPause').textContent=STATE.paused?'계속':'일시정지';
  document.querySelectorAll('#bar [data-ts]').forEach(b=>b.classList.toggle('on',+b.dataset.ts===STATE.ts));
  document.querySelectorAll('#bar [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===STATE.view));
  $('cFollow').classList.toggle('on',STATE.follow);$('bSound').classList.toggle('on',SND.on);
}
window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();if(STATE.mode==='ready')start();else{STATE.paused=!STATE.paused;syncUI();}}
  else if(e.code==='KeyR')restart();
  else if(e.code==='Escape'){STATE.tool=null;STATE.sel=null;syncUI();}
  else if((e.code==='Delete'||e.code==='Backspace')&&STATE.mode==='ready'&&STATE.sel){removeItem(STATE.sel);save();}
});
window.addEventListener('resize',()=>{resize();if(!cam.user)camFit(true);});

/* ===================== 한 프레임 ===================== */
let simAcc=0,last=performance.now();
function simFrame(rdt){
  let ts=STATE.ts;if(STATE.slowT>0){ts=Math.min(ts,TUNE.slowmo);STATE.slowT-=rdt;}
  const hb=1/60/(WD.fast?TUNE.fastSubsteps:TUNE.substeps);simAcc+=rdt*ts;let n=Math.floor(simAcc/hb);const cap=Math.round(1/60/hb*2);if(n>cap){n=cap;simAcc=0;}else simAcc-=n*hb;
  if(n<=0)return;const dt=n*hb;sparkBudget=40;const e0=WD.yieldE,g0=WD.glassE;WD.snapE=0;
  stepWorld(dt);updateFx(dt);for(const c of CARS)carFrame(c,dt);
  const E=WD.yieldE-e0;if(E>150)SND.crunch(clamp(Math.log10(E/150)/2.4,0.05,1));
  if(WD.glassE>g0)SND.glass(Math.min(1,(WD.glassE-g0)*0.4));if(WD.snapE>0.2)SND.snap(Math.min(1,WD.snapE*0.3));
  let scr=0,sk=0;for(let i=0;i<WD.n;i++){const c=WD.contact[i];if(c>3){if(WD.kind[i]===NK.WHEEL){const car=CARS[WD.own[i]];if(car&&car.brake)sk+=1;}else if(WD.kind[i]===NK.BODY)scr+=1;}}
  SND.scrape(Math.min(1,scr/6));SND.skid(Math.min(1,sk/3));
}
function loop(now){
  try{
    const rdt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
    if(STATE.mode==='run'&&!STATE.paused&&WD)simFrame(rdt);else{SND.scrape(0);SND.skid(0);}
    if(!drag)camStep(rdt);
    draw();hud();
  }catch(err){console.error(err);}
  requestAnimationFrame(loop);
}

/* 시작 */
resize();load();buildUI();if(innerWidth<760||innerHeight<500){$('panel').classList.add('hide');$('showPanel').style.display='block';}
toReady();syncUI();requestAnimationFrame(loop);
window.__car={set,STATE,TUNE,VEH,start,restart,toReady,rebuild,loadPreset,simFrame,stepWorld,draw,resize,camFit,carLens,get CARS(){return CARS;},get WD(){return WD;},get OBJS(){return OBJS;},PRESETS,cam};

</script>
