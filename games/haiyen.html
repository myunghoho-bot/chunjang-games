<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>シュエンルハイエン星団</title>
<style>
:root{
  --bg:#04070d; --panel:rgba(8,14,25,.92); --panel2:rgba(13,22,38,.95);
  --line:rgba(104,196,232,.22); --line2:rgba(104,196,232,.5);
  --tx:#dce9f6; --tx2:#8ea6bf; --tx3:#5a7189;
  --cy:#62d2ec; --cr:#f2b84b; --mi:#5fe0b5; --et:#b58dff; --core:#f1ecd8; --red:#ff5b4f; --ok:#7fe39a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:13px;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:30px;padding:0 14px;color:var(--tx);font-size:12.5px;letter-spacing:.02em;
  background:linear-gradient(180deg,rgba(40,70,100,.55),rgba(20,36,58,.65));
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);
  transition:filter .12s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1}
.btn:hover{filter:brightness(1.35)}
.btn:active{filter:brightness(.9)}
.btn.on{background:linear-gradient(180deg,rgba(60,170,200,.75),rgba(28,96,124,.8));color:#fff}
.btn.warn{background:linear-gradient(180deg,rgba(150,60,50,.7),rgba(90,30,26,.8))}
.btn.gold{background:linear-gradient(180deg,rgba(170,120,40,.8),rgba(110,72,20,.85));color:#fff6df}
.btn[disabled]{filter:grayscale(.9) brightness(.6);cursor:default}
.btn.wide{width:100%}
.btn.sm{height:24px;padding:0 10px;font-size:11.5px}

/* 위 줄 */
#top{position:fixed;left:0;right:0;top:0;height:48px;display:flex;align-items:center;gap:14px;padding:0 12px;
  background:linear-gradient(180deg,rgba(4,8,15,.95),rgba(4,8,15,.72));border-bottom:1px solid var(--line);z-index:20}
#capt{display:flex;flex-direction:column;justify-content:center;min-width:150px;cursor:pointer}
#capt .row{display:flex;align-items:baseline;gap:8px}
#cName{font-weight:700;font-size:13.5px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cLvW{font-size:11px;color:var(--tx2)}
#cLv{color:var(--cy);font-size:13px}
.xpbar{height:4px;margin-top:4px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cy);width:0}
#res{display:flex;gap:16px;align-items:center}
#res .r{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
#res svg{width:16px;height:16px}
#res b{font-size:14px;font-weight:700}
#res .r small{font-size:10.5px;color:var(--tx3);margin-left:2px}
#topBtns{margin-left:auto;display:flex;gap:4px;flex-wrap:nowrap}
#crumb{position:fixed;left:14px;top:56px;font-size:11.5px;color:var(--tx2);z-index:15;letter-spacing:.02em;pointer-events:none}
#crumb b{color:var(--tx);font-weight:600}
#crumb span{color:var(--tx3);margin:0 5px}

/* 임무 */
#quest{position:fixed;left:12px;top:80px;width:250px;background:var(--panel);border:1px solid var(--line);z-index:15;
  padding:9px 11px 10px;cursor:pointer}
#quest .qh{font-size:10.5px;color:var(--cy);letter-spacing:.08em;display:flex;justify-content:space-between}
#quest .qt{font-weight:700;margin-top:3px;font-size:13px}
#quest .qd{color:var(--tx2);font-size:11.5px;margin-top:3px;line-height:1.45}
#quest .qp{height:3px;background:rgba(255,255,255,.08);margin-top:7px;position:relative}
#quest .qp i{position:absolute;left:0;top:0;bottom:0;background:var(--cr)}

/* 오른쪽 패널 */
#side{position:fixed;right:12px;top:58px;width:300px;max-height:calc(100% - 150px);overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);z-index:16;padding:12px 13px 13px}
#side::-webkit-scrollbar{width:6px}#side::-webkit-scrollbar-thumb{background:var(--line2)}
.ph{display:flex;align-items:flex-start;gap:10px}
.ph .pt{flex:1;min-width:0}
.ph h3{font-size:15px;font-weight:700;line-height:1.25;word-break:keep-all}
.ph .sub{font-size:11px;color:var(--tx2);margin-top:2px}
.ph .x{width:24px;height:24px;color:var(--tx2);font-size:16px;line-height:1}
.ph .x:hover{color:#fff}
.sec{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.sec h4{font-size:10.5px;color:var(--tx3);letter-spacing:.1em;font-weight:600;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;font-size:12px;line-height:1.75}
.kv span:first-child{color:var(--tx2)}
.kv b{font-weight:600}
.bar{height:6px;background:rgba(255,255,255,.08);margin:5px 0 3px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0}
.note{font-size:11.5px;color:var(--tx2);line-height:1.5;margin-top:6px}
.note.red{color:#ff8c80}
.btnrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.cost{display:inline-flex;gap:8px;font-size:11.5px;align-items:center}
.cost i{font-style:normal;display:inline-flex;align-items:center;gap:3px}
.cost svg{width:12px;height:12px}
.cost .no{color:#ff8c80}
.mods{display:flex;flex-direction:column;gap:6px}
.mod{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.03);padding:6px 7px}
.hexi{width:34px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;flex-direction:column;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-size:10px;line-height:1.1;color:#061018;font-weight:700}
.hexi b{font-size:14px}
.mod .mt{flex:1;min-width:0}
.mod .mt div{font-size:12px;font-weight:600}
.mod .mt small{font-size:10.5px;color:var(--tx2)}
.cargo{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cargo i{width:12px;height:12px;display:inline-block;border:1px solid rgba(0,0,0,.4)}
.sw{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:4px}

/* 함대 줄 */
#fleet{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;z-index:15;max-width:calc(100% - 200px);overflow-x:auto;padding-bottom:2px}
#fleet::-webkit-scrollbar{height:5px}#fleet::-webkit-scrollbar-thumb{background:var(--line2)}
.fc{flex:none;width:132px;background:var(--panel);border:1px solid var(--line);padding:6px 8px 7px;cursor:pointer;position:relative}
.fc.sel{border-color:var(--cy);background:var(--panel2)}
.fc .fn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.fc .fn canvas{flex:none}
.fc .fs{font-size:10.5px;color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .fb{height:3px;background:rgba(255,255,255,.08);margin-top:5px;position:relative}
.fc .fb i{position:absolute;left:0;top:0;bottom:0}
.fc .au{position:absolute;right:6px;top:6px;font-size:9.5px;color:var(--mi);letter-spacing:.05em}

#zoomBox{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:15}
#zoomBox .btn{width:64px}
#toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:30;pointer-events:none}
.toast{background:rgba(6,12,22,.92);border:1px solid var(--line);padding:6px 14px;font-size:12px;color:var(--tx);
  transition:opacity .5s, transform .5s;white-space:nowrap}
.toast.g{border-color:rgba(242,184,75,.5)}
.toast.r{border-color:rgba(255,91,79,.55)}
#hint{position:fixed;right:12px;bottom:104px;font-size:11px;color:var(--tx3);z-index:14;pointer-events:none;white-space:nowrap;text-align:right}
body.ringmode #quest{top:100px}

/* 창 */
#modal{position:fixed;inset:0;background:rgba(0,3,8,.55);z-index:40;display:flex;align-items:center;justify-content:center}
.mbox{width:min(760px,calc(100% - 24px));max-height:calc(100% - 40px);display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line2)}
.mhead{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.mhead span{font-size:15px;font-weight:700;flex:1}
#mBody{padding:12px 14px 16px;overflow-y:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:10px 11px 11px;display:flex;flex-direction:column;gap:5px}
.card h5{font-size:13.5px}
.card .d{font-size:11.5px;color:var(--tx2);line-height:1.5;flex:1}
.card.lock{opacity:.55}
.card canvas{align-self:center}
.qlist{display:flex;flex-direction:column;gap:6px}
.qi{padding:8px 10px;background:rgba(255,255,255,.03);border-left:3px solid var(--tx3)}
.qi.cur{border-left-color:var(--cr);background:rgba(242,184,75,.06)}
.qi.done{opacity:.6;border-left-color:var(--ok)}
.qi b{font-size:12.5px}.qi div{font-size:11.5px;color:var(--tx2);margin-top:2px}
.flist{width:100%;border-collapse:collapse;font-size:12px}
.flist td,.flist th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.flist th{color:var(--tx3);font-weight:600;font-size:10.5px;letter-spacing:.06em}
.flist tr.cl{cursor:pointer}.flist tr.cl:hover{background:rgba(98,210,236,.06)}

/* 대화 */
#dlg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:flex;gap:14px;
  background:rgba(6,11,20,.96);border:1px solid var(--line2);padding:12px 14px;z-index:45;cursor:pointer;align-items:stretch}
#dlgFace{width:96px;height:96px;image-rendering:pixelated;flex:none;border:1px solid var(--line)}
#dlg .dt{flex:1;display:flex;flex-direction:column;min-width:0}
#dlgName{font-size:12px;color:var(--cy);font-weight:700;letter-spacing:.04em}
#dlgName small{color:var(--tx3);font-weight:400;margin-left:6px}
#dlgText{font-size:14.5px;line-height:1.65;margin-top:5px;flex:1;word-break:keep-all}
#dlg .dn{align-self:flex-end;font-size:11px;color:var(--tx3);margin-top:4px}

/* 링월드 */
body.ringmode #crumb,body.ringmode #fleet,body.ringmode #zoomBox,body.ringmode #side,body.ringmode #hint{display:none!important}
#ringHud{position:fixed;left:0;right:0;top:48px;z-index:15;pointer-events:none}
#ringHud > *{pointer-events:auto}
#rTitle{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center;pointer-events:none;
  background:rgba(6,11,20,.72);border:1px solid var(--line);padding:6px 16px}
#rTitle b{font-size:14px}
#rTitle div{font-size:11px;color:var(--tx2);margin-top:2px}
#rMap{position:absolute;right:12px;top:10px;width:132px;height:132px;background:rgba(6,11,20,.8);border:1px solid var(--line);cursor:pointer}
#rBtns{position:absolute;left:12px;top:10px;display:flex;gap:4px}
#rSide{position:fixed;right:12px;top:200px;width:300px;max-height:calc(100% - 214px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);
  z-index:16;padding:12px 13px 13px}
#bubble{position:fixed;z-index:25;background:rgba(240,244,248,.96);color:#14202c;font-size:12px;padding:6px 10px;max-width:240px;
  pointer-events:none;line-height:1.45;transform:translate(-50%,-100%)}
#bubble b{display:block;font-size:10.5px;color:#4a6a86}

/* 시작 화면 */
#title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:center;padding-left:9vw;
  background:radial-gradient(ellipse at 70% 50%,rgba(0,0,0,0) 0,rgba(2,4,9,.45) 60%,rgba(2,4,9,.85) 100%)}
#title .kick{font-size:12px;letter-spacing:.32em;color:var(--cy);opacity:.85}
#title h1{font-family:"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Malgun Gothic",sans-serif;font-size:clamp(30px,5.4vw,66px);font-weight:800;letter-spacing:.04em;line-height:1.08;margin-top:12px;
  text-shadow:0 0 30px rgba(98,210,236,.25)}
#title .loc{margin-top:14px;font-size:13px;color:var(--tx2);letter-spacing:.06em}
#title .loc span{color:var(--tx3);margin:0 6px}
#title .tb{display:flex;flex-direction:column;gap:8px;margin-top:38px;width:220px}
#title .tb .btn{height:38px;font-size:14px;justify-content:flex-start;padding:0 22px}
#title .foot{position:absolute;left:9vw;bottom:26px;font-size:11px;color:var(--tx3);line-height:1.6}
@media (max-width:760px){
  #res{gap:9px}#res .r small{display:none}#topBtns .btn{padding:0 9px;font-size:11.5px}
  #quest{width:200px;top:76px}#side,#rSide{width:min(300px,calc(100% - 24px))}
  #capt{min-width:96px}#cName{max-width:90px}
}
</style>
<script src="../mobile.js"></script>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top" class="hidden">
  <div id="capt" data-act="captain">
    <div class="row"><span id="cName">선장</span><span id="cLvW">Lv <b id="cLv">1</b></span></div>
    <div class="xpbar"><i id="cXp"></i></div>
  </div>
  <div id="res">
    <div class="r" title="크레딧"><svg viewBox="0 0 16 16"><path d="M8 1.2l5.9 3.4v6.8L8 14.8 2.1 11.4V4.6z" fill="none" stroke="#f2b84b" stroke-width="1.9"/><circle cx="8" cy="8" r="2.3" fill="#f2b84b"/></svg><b id="rCr">0</b><small id="rCrS"></small></div>
    <div class="r" title="광물"><svg viewBox="0 0 16 16"><path d="M2.5 6.2L5.6 2h4.8l3.1 4.2L8 14.5z" fill="#5fe0b5"/><path d="M2.5 6.2h11M5.6 2L8 6.2 10.4 2M8 6.2v8.3" stroke="#0d3a2d" stroke-width="1" fill="none"/></svg><b id="rMi">0</b><small id="rMiS"></small></div>
    <div class="r" title="에테르 결정"><svg viewBox="0 0 16 16"><path d="M8 .8l3.4 7.2L8 15.2 4.6 8z" fill="#b58dff"/><path d="M8 .8v14.4M4.6 8h6.8" stroke="#ece0ff" stroke-width=".9"/></svg><b id="rEt">0</b></div>
    <div class="r" title="고대 핵"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="#f1ecd8" stroke-width="1.5"/><circle cx="8" cy="8" r="2.6" fill="#f1ecd8"/><path d="M8 1.8v2.4M8 11.8v2.4M1.8 8h2.4M11.8 8h2.4" stroke="#f1ecd8" stroke-width="1.2"/></svg><b id="rCo">0</b></div>
  </div>
  <div id="topBtns">
    <button class="btn" data-act="fleetList">함대</button>
    <button class="btn" data-act="yard">조선소</button>
    <button class="btn" data-act="quests">임무</button>
    <button class="btn" data-act="ring" id="bRing">링월드</button>
    <button class="btn" data-act="sector">섹터 지도</button>
    <button class="btn" data-act="speed" id="bSpeed">속도 1배</button>
    <button class="btn" data-act="menu">메뉴</button>
  </div>
</div>
<div id="crumb" class="hidden"></div>
<div id="quest" class="hidden" data-act="quests"></div>
<div id="side" class="hidden"></div>
<div id="fleet" class="hidden"></div>
<div id="zoomBox" class="hidden">
  <button class="btn sm" data-act="zin">확대</button>
  <button class="btn sm" data-act="zout">축소</button>
  <button class="btn sm" data-act="home">1.1구역</button>
</div>
<div id="hint" class="hidden"></div>
<div id="toasts"></div>

<div id="ringHud" class="hidden">
  <div id="rBtns">
    <button class="btn" data-act="ringExit">우주로 나가기</button>
    <button class="btn" data-act="ringL">왼쪽 구획</button>
    <button class="btn" data-act="ringR">오른쪽 구획</button>
  </div>
  <div id="rTitle"><b id="rTitleB">하이옌 링</b><div id="rTitleS"></div></div>
  <canvas id="rMap" width="264" height="264" data-act="ringMap"></canvas>
</div>
<div id="rSide" class="hidden"></div>
<div id="bubble" class="hidden"></div>

<div id="modal" class="hidden"><div class="mbox"><div class="mhead"><span id="mTitle"></span><button class="btn sm" data-act="mclose">닫기</button></div><div id="mBody"></div></div></div>

<div id="dlg" class="hidden"><canvas id="dlgFace" width="96" height="96"></canvas><div class="dt"><div id="dlgName"></div><div id="dlgText"></div><div class="dn">누르면 다음</div></div></div>

<div id="title">
  <div class="kick">LARGE MAGELLANIC CLOUD · SECTOR A-1.1</div>
  <h1 lang="ja">シュエンルハイエン<br>星団</h1>
  <div class="loc">대마젤란운<span>›</span>쇵루하이옌 성단<span>›</span>A-1.1 섹터<span>›</span>1.1구역</div>
  <div class="tb">
    <button class="btn on" id="tContinue" data-act="tContinue">이어서 하기</button>
    <button class="btn" id="tNew" data-act="tNew">새로 시작</button>
  </div>
  <div class="foot">마우스로 끌면 지도가 움직이고, 휠로 확대합니다. 배를 누른 뒤 목적지를 누르면 출발합니다.</div>
</div>

<script>

const SAVE_KEY = 'shyongruHaiyen_v1';
const TAU = Math.PI * 2, SQ3 = Math.sqrt(3);

const fmt = n => Math.floor(n).toLocaleString('ko-KR');

function mulberry(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }
function hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function h3(x, y, z, s) { let h = (x * 374761393 + y * 668265263 + z * 1274126177 + s * 982451653) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vn3(x, y, z, s) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);

  const a = lerp(h3(xi, yi, zi, s), h3(xi + 1, yi, zi, s), xf), b = lerp(h3(xi, yi + 1, zi, s), h3(xi + 1, yi + 1, zi, s), xf);
  const c = lerp(h3(xi, yi, zi + 1, s), h3(xi + 1, yi, zi + 1, s), xf), d = lerp(h3(xi, yi + 1, zi + 1, s), h3(xi + 1, yi + 1, zi + 1, s), xf);
  return lerp(lerp(a, b, yf), lerp(c, d, yf), zf);
}

  const cand = (k, id, x, y, r) => { const d = dist(x, y, sx, sy); if (d < r && d < bd) { bd = d; best = { k, id }; } };
  for (const q of PS) { if (!q.alive || !Z[q.zi].ex) continue; const [x, y] = w2s(q.x, q.y); cand('ps', q.id, x, y, 15); }
  if (best) return best;
  for (const p of P) { if (!Z[p.zi].ex) continue; const [x, y] = w2s(...pPos(p)); cand('p', p.id, x, y, Math.max(10, p.r * cam.z + 6)); }
  for (const b of B) { if (!Z[b.zi].ex) continue; const [x, y] = w2s(b.x, b.y); cand('pb', b.id, x, y, Math.max(12, 40 * cam.z)); }
  for (const r of R) { if (!Z[r.zi].ex) continue; const [x, y] = w2s(r.x, r.y); cand('relic', r.id, x, y, Math.max(12, 50 * cam.z)); }
  for (const q of GT) { if (!Z[q.zi].ex) continue; const [x, y] = w2s(q.x, q.y); cand('gate', q.id, x, y, Math.max(12, 62 * cam.z)); }
  for (const a of A) { if (!Z[a.zi].ex) continue; const [x, y] = w2s(...aPos(a)); cand('a', a.id, x, y, Math.max(8, a.r * cam.z + 6)); }
  if (best) return best;
  if (Z[0].ex) { const d = dist(wx, wy, Z[0].cx, Z[0].cy); if (Math.abs(d - RING.r) < RING.w / 2 + 9 / cam.z) return { k: 'ring' }; }
  const zi = zoneAt(wx, wy);
  if (zi >= 0 && (Z[zi].ex || isFrontier(zi))) return { k: 'zone', id: zi };
  return null;
}
function clickAt(sx, sy) {
  if (DLG.open) { dlgNext(); return; }
  if (RWV.on) { ringClick(sx, sy); return; }
  const [wx, wy] = s2w(sx, sy), hit = pick(wx, wy, sx, sy);
  if (hit && hit.k === 'ship') { select(hit); sfx('select'); return; }
  const ship = SEL && SEL.k === 'ship' ? G.ships.find(s => s.id === SEL.id) : null;
  if (ship) { issueOrder(ship, hit, wx, wy); renderSide(true); return; }
  if (hit) { if (hit.k === 'zone' && cam.z < .14) focusZone(hit.id); select(hit); sfx('select'); } else deselect();
}
let bubbleT = 0;
function ringClick(sx, sy) {
  const h = ringPick(sx, sy);
  if (h.k === 'person') {
    const b = $('bubble'); b.innerHTML = `<b>${esc(h.p.name)} · ${h.p.seg + 1}구획 주민</b>${PLINES[h.p.line]}`;
    b.style.left = (h.bx * RWV.S / DPR) + 'px'; b.style.top = (h.by * RWV.S / DPR - 6) + 'px'; b.classList.remove('hidden'); bubbleT = 4; h.p.pause = 4; h.p.line = (h.p.line + 3) % PLINES.length; sfx('select'); return;
  }
  $('bubble').classList.add('hidden');
  const s = G.ring.segs[h.seg];
  RWV.sel = h.k === 'slot' && s.on ? { seg: h.seg, slot: h.slot } : { seg: h.seg };
  sfx('select'); renderRingSide(true);
}
const ptrs = new Map(); let drag = null, pinch = null; const keys = {};
cv.addEventListener('pointerdown', e => {
  auInit(); try { cv.setPointerCapture(e.pointerId); } catch (er) { }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false, btn: e.button };
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: dist(a.x, a.y, b.x, b.y) || 1, z: cam.z }; drag = null; }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) { const [a, b] = [...ptrs.values()]; if (!RWV.on) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.z * dist(a.x, a.y, b.x, b.y) / pinch.d); return; }
  if (!drag || !playing) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
  if (drag.moved) {
    if (RWV.on) { RWV.cam -= dx * DPR / RWV.S; RWV.tgt = null; $('bubble').classList.add('hidden'); }
    else { cam.x -= dx / cam.z; cam.y -= dy / cam.z; cam.tx = null; cam.tz = null; cam.follow = null; }
  }
  drag.x = e.clientX; drag.y = e.clientY;
});
const endPtr = e => {
  const wasDrag = drag; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (wasDrag && !wasDrag.moved && ptrs.size === 0 && playing && e.type === 'pointerup') {
    if (wasDrag.btn === 2) { if (RWV.on) { RWV.sel = null; renderRingSide(true); } else deselect(); }
    else clickAt(e.clientX, e.clientY);
  }
  if (ptrs.size === 0) drag = null;
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  e.preventDefault(); if (!playing) return;
  if (RWV.on) { RWV.cam += (e.deltaY + e.deltaX) * .35; RWV.tgt = null; $('bubble').classList.add('hidden'); return; }
  zoomAt(e.clientX, e.clientY, cam.z * Math.pow(1.0016, -e.deltaY));
}, { passive: false });
addEventListener('keydown', e => {
  if (!playing) return; auInit();
  if (DLG.open && (e.key === ' ' || e.key === 'Enter')) { dlgNext(); e.preventDefault(); return; }
  if (e.key === 'Escape') { if (modalKind) closeModal(); else if (RWV.on) { if (RWV.sel) { RWV.sel = null; renderRingSide(true); } else exitRing(); } else deselect(); return; }
  const k = e.key.toLowerCase(); keys[k] = true;
  if (/^[1-9]$/.test(e.key) && !RWV.on) { const s = G.ships[+e.key - 1]; if (s) { select({ k: 'ship', id: s.id }); cam.tx = s.x; cam.ty = s.y; sfx('select'); } }
  if (k === 'f' && SEL && SEL.k === 'ship') { cam.follow = cam.follow === SEL.id ? null : SEL.id; renderSide(true); }
  if (k === 'r') act('ring');
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function camUpdate(dt) {
  const kx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0), ky = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (RWV.on) {
    if (kx) { RWV.cam += kx * 160 * dt; RWV.tgt = null; }
    if (RWV.tgt != null) { const k = 1 - Math.exp(-dt * 5); RWV.cam = lerp(RWV.cam, RWV.tgt, k); if (Math.abs(RWV.cam - RWV.tgt) < .5) { RWV.cam = RWV.tgt; RWV.tgt = null; } }
    if (RWV.tgt == null) RWV.cam = modv(RWV.cam, CIRC);
    return;
  }
  if (kx || ky) { cam.x += kx * 650 / cam.z * dt; cam.y += ky * 650 / cam.z * dt; cam.tx = null; cam.follow = null; }
  if (cam.follow != null) { const s = G.ships.find(o => o.id === cam.follow); if (s) { const k = 1 - Math.exp(-dt * 6); cam.x = lerp(cam.x, s.x, k); cam.y = lerp(cam.y, s.y, k); } else cam.follow = null; }
  if (cam.tx != null) {
    const k = 1 - Math.exp(-dt * 5); cam.x = lerp(cam.x, cam.tx, k); cam.y = lerp(cam.y, cam.ty, k); if (cam.tz) cam.z = lerp(cam.z, cam.tz, k);
    if (dist(cam.x, cam.y, cam.tx, cam.ty) < 2 / cam.z && (!cam.tz || Math.abs(cam.z - cam.tz) < .002)) { cam.tx = null; cam.tz = null; }
  }
  cam.x = clamp(cam.x, UNI.x0 - 4000, UNI.x1 + 4000); cam.y = clamp(cam.y, UNI.y0 - 4000, UNI.y1 + 4000);
}

// ───────────────────────── 시작과 반복 ─────────────────────────
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
  if (RWV.on) ringResize();
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) save(); });
addEventListener('beforeunload', () => { if (playing) save(); });
function startGame() {
  playing = true; $('title').classList.add('hidden');
  for (const id of ['top', 'crumb', 'quest', 'fleet', 'zoomBox', 'hint']) $(id).classList.remove('hidden');
  for (const k in SX) delete SX[k];
  RWV.dirty = true; RWV.peopleKey = ''; SEL = null; fleetKey = '';
  const pr = homeP(); const [x, y] = pPos(pr);
  cam.x = (x + Z[0].cx) / 2; cam.y = (y + Z[0].cy) / 2; cam.z = fitZoom() * 1.15; cam.tx = Z[0].cx; cam.ty = Z[0].cy; cam.tz = fitZoom();
  renderFleet(true); renderTop(); renderQuest(); renderSide(true);
  if (AU.m) AU.m.gain.value = G.snd ? .5 : 0;
}
function uiTick() {
  renderTop(); renderQuest(); renderFleet(); renderSide(); renderModal();
  if (RWV.on) { renderRingHud(); renderRingSide(); }
  if (bubbleT > 0) { bubbleT -= .25; if (bubbleT <= 0) $('bubble').classList.add('hidden'); }
}
let last = performance.now(), uiT = 0, saveT = 0, qT = 0, errN = 0;
function loop(now) {
  requestAnimationFrame(loop);
  try {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; const t = now / 1000;
    if (G) { const n = playing ? G.speed : 1; for (let i = 0; i < n; i++) update(dt); }
    if (playing) camUpdate(dt); else { cam.x = 520 + Math.cos(t * .03) * 260; cam.y = 330 + Math.sin(t * .03) * 160; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (RWV.on) drawRing(t, dt * (G ? G.speed : 1));
    else { ctx.save(); if (shake > 0) ctx.translate((Math.random() - .5) * shake * 12, (Math.random() - .5) * shake * 12); drawSpace(t); ctx.restore(); }
    if (playing) {
      dlgTick(dt); uiT += dt; if (uiT > .25) { uiT = 0; uiTick(); }
      qT += dt; if (qT > .5) { qT = 0; questTick(); }
      saveT += dt; if (saveT > 10) { saveT = 0; save(); }
      padTick();
    }
  } catch (e) { errN++; if (errN < 6) console.error(e); }
}
resize(); makeBG();
newGame('관제'); cam.z = .5;
if (!hasSave()) $('tContinue').classList.add('hidden'); else { $('tContinue').classList.remove('hidden'); }
requestAnimationFrame(loop);
