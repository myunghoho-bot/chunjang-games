<style>
:root{--bg:#0d1119;--pn:#161c28;--pn2:#1d2535;--pn3:#252f43;--ln:#2e3950;--ln2:#44516d;--tx:#ebe6d8;--mu:#97a0b2;--gd:#eab94a;--gem:#6fd3ea;--red:#e2574e;--grn:#72c66b;
  --r0:#aab0bb;--r1:#58aaee;--r2:#b685f3;--r3:#f3a73e;--r4:#f3606c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:'Galmuri11','Malgun Gothic','맑은 고딕',sans-serif;font-size:12px;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
#app{display:flex;height:100%}
#stage{position:relative;flex:1;min-width:0;background:#000;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:6px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.hb{background:rgba(12,16,25,.84);border:1px solid var(--ln2);border-radius:3px;padding:5px 8px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
#stBox{min-width:178px;flex:0 1 230px}
#stName{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px}
#stName small{color:var(--mu);font-weight:400;font-size:11px}
.bar{height:8px;background:#0a0d13;border:1px solid #3a4560;margin-top:4px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#f0c75c,#c48c22);width:0}
.bar.hp i{background:linear-gradient(#ef6b5e,#b8352d)}
.bar.boss i{background:linear-gradient(#c56cf0,#7a2fb0)}
.bar.exp i{background:linear-gradient(#7fd6f2,#3b8fc0)}
#stSub{font-size:11px;color:var(--mu);margin-top:3px;display:flex;justify-content:space-between}
#hpBox{flex:0 1 170px;min-width:120px}
#hpBox .t{font-size:11px;color:var(--mu);display:flex;justify-content:space-between}
#res{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#resRow{display:flex;gap:10px;font-size:12px;font-weight:700}
#resRow span{display:flex;align-items:center;gap:4px;white-space:nowrap}
#cp{font-size:11px;color:var(--mu)}
#cp b{color:#f4d27a}
.ico{display:inline-block;width:12px;height:12px}
#quest{position:absolute;left:6px;top:64px;max-width:250px;pointer-events:auto;cursor:default}
#quest .qt{font-size:11px;color:var(--mu)}
#quest .qd{margin-top:2px}
#quest .qr{font-size:11px;color:var(--gem);margin-top:2px}
#quest.done{border-color:var(--gd);cursor:pointer;animation:qpulse 1.2s infinite}
#quest.done .qr{color:var(--gd)}
@keyframes qpulse{50%{box-shadow:0 0 0 2px rgba(234,185,74,.45)}}
#banner{position:absolute;left:50%;top:70px;transform:translateX(-50%);padding:6px 16px;background:rgba(12,16,25,.9);
  border:1px solid var(--gd);color:#f6dc92;font-weight:700;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
#banner.on{opacity:1}
#banner.bad{border-color:var(--red);color:#f3a49c}
#skillbar{position:absolute;left:6px;right:6px;bottom:6px;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.sk{width:60px;height:60px;border:2px solid var(--ln2);background:rgba(10,13,20,.9);position:relative;cursor:pointer;pointer-events:auto;border-radius:3px;overflow:hidden}
.sk canvas{position:absolute;inset:0;width:100%;height:100%}
.sk .cd{position:absolute;inset:0;background:rgba(5,7,11,.72);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.sk .nm{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(5,7,11,.75);padding:1px 0;white-space:nowrap;overflow:hidden}
.sk.ready{border-color:var(--gd);box-shadow:0 0 0 1px rgba(234,185,74,.35)}
.sk.empty{cursor:default;opacity:.55}
.sk.empty .nm{background:none;color:var(--mu)}
#tgl{margin-left:auto;display:flex;flex-direction:column;gap:5px;align-items:flex-end;pointer-events:auto}
.tb{background:rgba(12,16,25,.88);border:1px solid var(--ln2);padding:5px 8px;cursor:pointer;border-radius:3px;white-space:nowrap}
.tb.on{border-color:var(--gd);color:#f6dc92}
#bossBtn{display:none;background:linear-gradient(#8e2d2d,#641c1c);border-color:#d0584e;color:#fff;font-weight:700;padding:7px 12px}
#bossBtn.show{display:block}
#panel{width:clamp(300px,31vw,400px);flex:none;background:var(--pn);border-left:2px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex:none}
.tab{flex:1;padding:9px 0 8px;text-align:center;background:var(--pn2);border:0;border-bottom:2px solid var(--ln);cursor:pointer;color:var(--mu);font-size:13px;position:relative}
.tab.on{background:var(--pn);color:var(--tx);border-bottom-color:var(--gd)}
.tab .dot{position:absolute;top:5px;right:8px;width:6px;height:6px;background:var(--red);display:none}
.tab .dot.on{display:block}
#body{flex:1;overflow-y:auto;padding:8px;min-height:0}
#body::-webkit-scrollbar{width:8px}#body::-webkit-scrollbar-thumb{background:var(--ln2)}
.sec{font-size:11px;color:var(--mu);margin:8px 2px 5px;display:flex;justify-content:space-between;align-items:center}
.sec:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;padding:7px;background:var(--pn2);border:1px solid var(--ln);margin-bottom:5px;border-radius:2px}
.row .ic{width:32px;height:32px;flex:none;background:#0e121b;border:1px solid var(--ln)}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:12px}
.row .nm small{color:var(--mu);font-weight:400}
.row .ds{font-size:11px;color:var(--mu);margin-top:2px}
.row .ds b{color:#a6e39f;font-weight:400}
.btn{background:linear-gradient(#3a4867,#2b3650);border:1px solid #57688d;padding:6px 9px;cursor:pointer;border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #080b11;white-space:nowrap;line-height:1.25}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 #080b11}
.btn:disabled{opacity:.42;cursor:default}
.btn.gold{background:linear-gradient(#856420,#644a12);border-color:#c19838}
.btn.gem{background:linear-gradient(#22607a,#174558);border-color:#4fa6c4}
.btn.red{background:linear-gradient(#7d2a2a,#5a1b1b);border-color:#c0544c}
.btn.wide{width:100%;padding:9px}
.btn .c{display:block;font-size:11px;margin-top:1px}
.seg{display:flex;gap:0}
.seg .btn{border-radius:0;padding:4px 8px;box-shadow:none}
.seg .btn.on{background:linear-gradient(#856420,#644a12);border-color:#c19838}
.team{display:flex;gap:5px}
.slot{flex:1;height:74px;background:#0e121b;border:1px solid var(--ln2);position:relative;cursor:pointer;border-radius:2px}
.slot canvas{position:absolute;left:50%;top:4px;transform:translateX(-50%)}
.slot .l{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden}
.slot.sel{border-color:var(--gd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.card{background:#0e121b;border:1px solid var(--ln);height:84px;position:relative;cursor:pointer;border-radius:2px;overflow:hidden}
.card canvas{position:absolute;left:50%;top:3px;transform:translateX(-50%)}
.card .l{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;white-space:nowrap;overflow:hidden;padding:0 2px}
.card .lv{position:absolute;left:3px;top:2px;font-size:10px;color:var(--mu)}
.card .st{position:absolute;right:3px;top:2px;font-size:10px;color:#f4d27a}
.card .on{position:absolute;right:3px;bottom:16px;font-size:9px;background:var(--gd);color:#1a1405;padding:0 3px}
.card.sel{outline:2px solid var(--gd);outline-offset:-2px}
.card.lock canvas{opacity:.9}
.card.lock .l{color:#555e70}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}
.bd0{border-color:#59606c}.bd1{border-color:#2f6fa8}.bd2{border-color:#7350a8}.bd3{border-color:#b0702a}.bd4{border-color:#b03a46}
.det{background:var(--pn2);border:1px solid var(--ln2);padding:8px;margin-bottom:8px;border-radius:2px}
.det .top{display:flex;gap:8px}
.det .pv{width:112px;height:100px;flex:none;background:#0b0f17;border:1px solid var(--ln);position:relative}
.det .pv canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.det .info{flex:1;min-width:0}
.det .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.det .sp{font-size:11px;margin-top:2px}
.det .kv{display:flex;justify-content:space-between;font-size:11px;margin-top:3px;color:var(--mu)}
.det .kv b{color:var(--tx);font-weight:400}
.det .skd{font-size:11px;color:var(--mu);margin-top:6px;line-height:1.45;border-top:1px solid var(--ln);padding-top:5px}
.det .skd b{color:#f6dc92;font-weight:400}
.det .acts{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
.egg{display:flex;gap:8px;align-items:center}
.egg canvas{flex:none}
.rates{font-size:11px;color:var(--mu);line-height:1.6}
.rates span{display:inline-block;margin-right:8px}
.note{font-size:11px;color:var(--mu);line-height:1.5;margin:4px 2px}

function rollRar() {
  if (S.pity >= 99) return Math.random() < 0.1 ? 4 : 3;
  let r = Math.random(), acc = 0; for (let i = 0; i < 5; i++) { acc += RATE[i]; if (r < acc) return i; } return 0;
}

  const ex = S.dragons.find(d => d.sp === spi);
  if (ex) { ex.shards++; const up = starUp(ex); return { dup: true, d: ex, up }; }
  const d = { id: S.nid++, sp: spi, lv: 1, exp: 0, evo: 0, star: 1, shards: 0, name: SPECIES[spi].n.split(' ').pop() };
  S.dragons.push(d); S.seen[spi] = 1;

}

  S.gems -= cost; const res = [];

    let r = rollRar(); if (n === 10 && i === 9 && r === 0 && res.every(x => x.r === 0)) r = 1;
    if (r >= 3) S.pity = 0; else S.pity++;
    const pool = []; SPECIES.forEach((s, j) => { if (s.r === r) pool.push(j); });
    const spi = pool[Math.floor(Math.random() * pool.length)];
    const g = giveDragon(spi); res.push({ r, spi, ...g });
  }
  S.tot.hatch += n; syncTeam(); save(); markDirty();
  showHatch(res);
}

  const cell = el('div', 'hcell'); const sc = big ? 1.8 : 1.5;
  const egg = drawEgg(res.r, 0, sc); egg.className = 'px'; cell.appendChild(egg);
  cell.appendChild(el('div', 'l', '눌러서 깨우기'));
  const nw = el('div', 'nw', res.dup ? '조각' : '새 용'); cell.appendChild(nw);
  cell._res = res; cell._open = false;
  cell.onclick = () => openEgg(cell, big);
  return cell;
}
function openEgg(cell, big) {
  if (cell._open) return; cell._open = true; cell.classList.add('open');
  const res = cell._res, sc = big ? 1.8 : 1.5; let step = 1;
  const swap = c => { c.className = 'px'; cell.replaceChild(c, cell.querySelector('canvas')); };
  const it = setInterval(() => {
    if (step <= 3) { swap(drawEgg(res.r, step, sc, res.hue)); snd('crack'); step++; return; }
    clearInterval(it);
    const pc = portrait(res.spi, 0, big ? 84 : 70); pc.style.top = '4px'; swap(pc);
    const col = RAR[res.r].c;
    cell.style.borderColor = col; cell.style.background = `radial-gradient(circle at 50% 40%, ${col}44, #0b0f17 70%)`;
    const l = cell.querySelector('.l'); l.className = 'l r' + res.r; l.textContent = RAR[res.r].n + ' ' + SPECIES[res.spi].n.split(' ').pop();
    const nw = cell.querySelector('.nw'); nw.style.display = 'block'; if (res.dup) { nw.textContent = res.up ? '별 상승' : '조각 +1'; nw.style.background = '#8fa0c0'; }
    snd(res.r >= 3 ? 'win' : 'hatch');
  }, 140);
}
function showHatch(res) {
  openModal(`<h2>알 부화</h2><p>알을 눌러 깨우세요.</p><div class="hatch" id="hGrid"></div>
    <div class="acts"><button class="btn gold" id="hAll">모두 깨우기</button><button class="btn" id="hClose">닫기</button></div>`);
  const grid = $('hGrid'); if (res.length < 5) grid.style.gridTemplateColumns = `repeat(${res.length}, 86px)`;
  const cells = res.map(r => { const c = hatchCell(r, false); grid.appendChild(c); return c; });
  $('hAll').onclick = () => cells.forEach((c, i) => setTimeout(() => openEgg(c, false), i * 90));
  $('hClose').onclick = () => { closeModal(); markDirty(); };
}
function showEvolve(d, from) {
  openModal(`<h2>진화했습니다</h2><p>${esc(d.name)} — ${EVO[from].n}에서 <b style="color:#f6dc92">${EVO[d.evo].n}</b>이(가) 되었습니다.</p>
    <div style="display:flex;justify-content:center;margin:10px 0"><canvas id="evCv" class="px" width="200" height="150" style="background:#0b0f17;border:1px solid #2e3950"></canvas></div>
    <p>공격력과 체력이 크게 올랐고, 스킬도 더 세졌습니다. 레벨을 ${EVO[d.evo].cap}까지 올릴 수 있습니다.</p>
    <div class="acts"><button class="btn gold" id="evOk">확인</button></div>`);
  $('evOk').onclick = closeModal;
  const c = $('evCv'), g = c.getContext('2d'); g.imageSmoothingEnabled = false; let t0 = performance.now();
  UI.hatchTimer = setInterval(() => {
    const t = (performance.now() - t0) / 1000; g.clearRect(0, 0, 200, 150);
    const evo = t < 1 ? from : d.evo, fr = dragonFrame(d.sp, evo, Math.floor(t * 8) % 4, false);
    const sc = Math.max(1, Math.floor(Math.min(190 / fr.w, 140 / fr.h)));
    const src = t > 0.4 && t < 1.2 && Math.floor(t * 12) % 2 ? silhouette(fr.c, '#fff6d0') : fr.c;
    g.drawImage(src, Math.round((200 - fr.w * sc) / 2), Math.round((150 - fr.h * sc) / 2), fr.w * sc, fr.h * sc);
  }, 60);
}
function showStarter() {
  const opts = [{ spi: 1, el: '불', hue: 12 }, { spi: 5, el: '물', hue: 208 }, { spi: 17, el: '바람', hue: 145 }];
  openModal(`<h2>첫 알을 고르세요</h2><p>처음 함께할 용입니다. 셋 다 희귀 등급이고, 나중에 알을 더 얻어 다른 용도 모을 수 있습니다.</p>
    <div class="starter" id="stG"></div><p id="stInfo" style="text-align:center;min-height:18px"></p>`);
  const grid = $('stG');
  opts.forEach(o => {
    const cell = el('div', 'hcell'); const egg = drawEgg(1, 0, 1.9, o.hue); egg.className = 'px'; cell.appendChild(egg);
    const sp = SPECIES[o.spi]; cell.appendChild(el('div', 'l', o.el + ' 속성 알')); cell.appendChild(el('div', 'nw', '새 용'));
    cell.onmouseenter = () => { $('stInfo').textContent = '스킬: ' + SKILL[sp.el].n + ' — ' + SKILL[sp.el].d; };
    cell.onclick = () => {
      if (grid.dataset.done) return; grid.dataset.done = 1;
      const res = { r: 1, spi: o.spi, dup: false, hue: o.hue };
      cell._res = res; cell._open = false; openEgg(cell, true);
      setTimeout(() => {
        const g = giveDragon(o.spi); S.tot.hatch++;
        const nm = prompt('새로 태어난 용의 이름을 지어 주세요 (10글자까지)', g.d.name);
        if (nm && nm.trim()) g.d.name = nm.trim().slice(0, 10);
        closeModal(); syncTeam(); G.hp = G.maxHp; save(); markDirty(); UI.sel = g.d.id;
        banner(g.d.name + '이(가) 함께합니다. 몬스터를 사냥하러 갑니다.');
      }, 1100);
    };
    grid.appendChild(cell);
  });
}
function offlineReward() {
  const sec = (Date.now() - S.last) / 1000; if (sec < 120 || !S.dragons.length) return;
  const t = Math.min(sec, 8 * 3600), gold = (S.gps || monGold(S.stage) * 0.6) * t * 0.5, meat = Math.floor(t / 180);
  openModal(`<h2>자리를 비운 동안</h2><p>${fmtTime(sec)} 동안 용들이 계속 사냥했습니다. (최대 8시간까지 모입니다)</p>
    <div class="det" style="margin-top:10px"><div class="kv"><span>골드</span><b>${fmt(gold)}</b></div><div class="kv"><span>고기</span><b>${meat}개</b></div></div>
    <div class="acts"><button class="btn gold" id="ofOk">받기</button></div>`);
  $('ofOk').onclick = () => { addGold(gold); G.gEarn -= gold; S.meat += meat; closeModal(); snd('win'); save(); };
}

// ── 시작 화면
function titleDragon() {
  const c = $('tDragon'), sc = innerHeight < 460 ? 3 : 4; const fr0 = dragonFrame(3, 3, 0, false);
  c.width = fr0.w * sc; c.height = fr0.h * sc + 10; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  let f = 0; if (UI.tTimer) clearInterval(UI.tTimer);
  UI.tTimer = setInterval(() => { if ($('title').classList.contains('off')) { clearInterval(UI.tTimer); return; } const fr = dragonFrame(3, 3, f++ % 4, false); g.clearRect(0, 0, c.width, c.height); g.drawImage(fr.c, 0, (f % 8 < 4 ? 0 : 1) * sc + 4, fr.w * sc, fr.h * sc); }, 120);
}
function showTitle() {
  $('title').classList.remove('off'); titleDragon();
  const has = load(); const box = $('tBtns'); box.innerHTML = '';
  if (has) {
    const b = el('button', 'btn gold wide', '이어하기<span class="c">' + esc(stageName(has.stage)) + ' · 용 ' + has.dragons.length + '마리</span>'); b.onclick = () => startGame(false); box.appendChild(b);
    const n = el('button', 'btn wide', '처음부터 새로'); n.onclick = () => { S = has; confirmReset(); }; box.appendChild(n);
  } else { const b = el('button', 'btn gold wide', '시작하기'); b.onclick = () => startGame(true); box.appendChild(b); }
}
function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
  S = newSave(); G.mons = []; G.drs = []; G.proj = []; G.fx = []; G.coins = []; G.texts = []; G.phase = 'farm'; G.boss = null; G.skCd = [0, 0, 0];
  save(); $('title').classList.add('off'); G.running = true; updToggles(); buildSkillBar(); markDirty(); showStarter();
}
function startGame(fresh) {
  S = fresh ? newSave() : (load() || newSave());
  $('title').classList.add('off'); G.running = true;
  resize(); syncTeam(); G.hp = G.maxHp; updToggles(); markDirty();
  if (!S.dragons.length) showStarter(); else offlineReward();
  save();
}

// ════════════════ 시작 ════════════════
let lastT = performance.now();
function loop(now) {
  try {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (S && G.running) update(dt * G.speed);
    render(now); uiTick(now);
  } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { resize(); if (S) buildSkillBar(); });
setInterval(() => { if (S && G.running) save(); }, 5000);
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('beforeunload', save);
window.G = G; window.V = V; window.getS = () => S;
resize(); showTitle();
requestAnimationFrame(loop);
</script>
<script src="../track.js" defer></script>
</body>
</html>
