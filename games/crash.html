<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>비행기 추락 실험실</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;font-family:"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;color:#d9e1ea;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#panel{position:fixed;left:10px;top:10px;bottom:10px;width:272px;background:rgba(13,17,23,.9);border:1px solid #2b3440;border-radius:8px;padding:10px 12px 12px;overflow-y:auto;font-size:12.5px;transition:transform .2s;z-index:5}
#panel.hide{transform:translateX(-300px)}
#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:#2b3440;border-radius:3px}
.hd{display:flex;align-items:center;justify-content:space-between}
h1{font-size:15px;margin:0;letter-spacing:.3px;color:#f3f6f9}
.ver{color:#6f7c8b;font-size:11px;margin:2px 0 6px}
.sec{margin:11px 0 5px;color:#f2a93b;font-size:11.5px;font-weight:bold;letter-spacing:.5px;border-top:1px solid #222a33;padding-top:8px}
button{font:inherit;color:#d9e1ea;background:#1b222b;border:1px solid #2f3a47;border-radius:5px;padding:5px 8px;cursor:pointer}
button:hover{background:#232c37;border-color:#3d4a59}
button.on{background:#3a2c12;border-color:#f2a93b;color:#ffd58a}
.plist button{display:block;width:100%;text-align:left;margin:3px 0;padding:6px 8px}
.plist button small{display:block;color:#7f8c9b;font-size:11px;margin-top:1px}
.plist button.on small{color:#c9a76a}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:5px 2px;min-width:52px}
.info{color:#8b98a8;font-size:11px;line-height:1.55;margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.row span{color:#aeb9c6}
.row b{font-family:Consolas,"D2Coding",monospace;color:#f3f6f9;font-weight:normal}
input[type=range]{width:100%;margin:3px 0 0;accent-color:#f2a93b}
select{width:100%;font:inherit;color:#d9e1ea;background:#1b222b;border:1px solid #2f3a47;border-radius:5px;padding:5px}
.chk{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.chk label{display:flex;align-items:center;gap:6px;color:#aeb9c6;cursor:pointer}
.chk input{accent-color:#f2a93b}
.chk label.dis{opacity:.45}
button.mini{padding:0 6px;font-size:10.5px;margin-left:4px;vertical-align:1px}
#startBtn{width:100%;margin-top:12px;padding:10px;font-size:14px;font-weight:bold;background:#7a2b1c;border-color:#c4502f;color:#fff}
#startBtn:hover{background:#933522}
.hint{color:#6f7c8b;font-size:11px;margin-top:8px;line-height:1.5}
#showPanel{position:fixed;left:10px;top:10px;z-index:4;display:none}
#hud{position:fixed;right:10px;top:10px;background:rgba(13,17,23,.82);border:1px solid #2b3440;border-radius:8px;padding:8px 10px;font-size:12px;min-width:200px;z-index:3;pointer-events:none}
#hud .t{color:#f2a93b;font-size:11px;font-weight:bold;margin-bottom:4px;letter-spacing:.5px}
#hud .g{display:grid;grid-template-columns:auto auto;gap:2px 14px}
#hud .g span{color:#8b98a8}
#hud .g b{font-family:Consolas,"D2Coding",monospace;font-weight:normal;text-align:right;color:#eef2f6}
#hud .warn{color:#ff8a6a!important}
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(13,17,23,.85);border:1px solid #2b3440;border-radius:8px;padding:6px 8px;z-index:3;font-size:12px;max-width:calc(100% - 300px)}
#bar .grp{display:flex;gap:3px;align-items:center}
#bar .grp em{font-style:normal;color:#6f7c8b;margin:0 3px 0 6px}
#bar button{padding:4px 8px}
#result{position:fixed;right:10px;top:262px;width:250px;background:rgba(13,17,23,.92);border:1px solid #3a4553;border-radius:8px;padding:10px 12px;font-size:12px;z-index:3;display:none}
#result .t{color:#f2a93b;font-weight:bold;margin-bottom:6px}
#result .g{display:grid;grid-template-columns:auto auto;gap:3px 10px}
#result .g span{color:#8b98a8}
#result .g b{font-family:Consolas,monospace;font-weight:normal;text-align:right}
#result .btns{display:flex;gap:6px;margin-top:9px}
#result .btns button{flex:1}
#landPad{position:fixed;right:10px;bottom:64px;display:none;flex-direction:column;gap:6px;z-index:4}#landPad button{min-width:84px;padding:9px 10px;font-size:13px}
#tip{position:fixed;z-index:6;background:rgba(13,17,23,.95);border:1px solid #3a4553;border-radius:5px;padding:5px 8px;font-size:11.5px;pointer-events:none;display:none;white-space:nowrap}
@media (max-height:520px){#hud{font-size:10px;padding:5px 7px;min-width:130px}#hud .g{gap:0 8px}#bar{font-size:11px;padding:4px}#bar button{padding:3px 6px}}
@media (max-width:820px){#panel{width:236px;font-size:12px}#bar{max-width:calc(100% - 20px);bottom:6px}#hud{font-size:11px;min-width:150px}#result{top:auto;bottom:70px}}
</style>
<script src="../mobile.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="panel">
  <div class="hd"><h1>비행기 추락 실험실</h1><button id="hidePanel">접기</button></div>
  <div class="ver">옆에서 보는 2D 물리 · 쇠가 휘고 끊어짐</div>
  <div class="seg" id="modeSeg" style="margin-bottom:2px"><button data-m="crash">추락 실험</button><button data-m="land">착륙 연습</button></div>
  <div class="info" id="modeInfo"></div>
  <div class="sec">기종</div>
  <div class="plist" id="planeList"></div>
  <div class="info" id="planeInfo"></div>
  <div class="sec">장소</div>
  <div class="seg" id="sceneSeg"></div>
  <div class="sec">같이 나는 기체</div>
  <select id="c2Type"></select>
  <div class="seg" style="margin-top:5px"><button id="exPlace">하늘에 놓기</button><button id="exPark">땅에 세우기</button><button id="exClear">모두 지우기</button></div>
  <div class="info" id="exInfo"></div>
  <div class="sec">부서지는 장애물</div>
  <div class="seg" id="toolSeg"><button data-t="bld">건물</button><button data-t="tree">나무</button><button data-t="car">차</button><button data-t="fire">소방차</button><button data-t="amb">구급차</button><button data-t="tower">관제탑</button><button data-t="erase">지우기</button></div>
  <div class="seg" style="margin-top:4px"><button id="autoPlace">자동으로 놓기</button><button id="clearPlace">모두 지우기</button></div>
  <div class="info" id="placeInfo"></div>
  <div class="sec">빠른 설정</div>
  <select id="preset">
    <option value="">직접 정하기</option>
    <option value="belly">바퀴 없이 활주로에 내림</option>
    <option value="landing">바퀴 내리고 세게 내림</option>
    <option value="field">들판에 불시착</option>
    <option value="ditch">바다에 내려앉기</option>
    <option value="dive">급강하</option>
    <option value="stall">실속 (속도가 너무 느림)</option>
    <option value="cfit">산비탈에 부딪힘</option>
    <option value="tail">기수 들고 낮고 느리게 → 꼬리가 방파제에 걸림</option>
  </select>
  <div class="sec">비행 조건</div>
  <div class="row"><span>시작 고도</span><b id="vAlt"></b></div><input type="range" id="alt" min="10" max="800" step="5">
  <div class="row"><span>속도</span><b id="vSpd"></b></div><input type="range" id="spd" min="80" max="950" step="5">
  <div class="row"><span>내려가는 각도</span><b id="vGam"></b></div><input type="range" id="gam" min="-80" max="5" step="1">
  <div class="row"><span>기수 각도 <button id="attAuto" class="mini">자동</button></span><b id="vAtt"></b></div><input type="range" id="att" min="-10" max="25" step="0.5">
  <div class="row"><span>엔진 출력</span><b id="vPow"></b></div><input type="range" id="pow" min="0" max="100" step="5">
  <div class="row"><span>승강타 (기수)</span><b id="vElev"></b></div><input type="range" id="elev" min="-10" max="10" step="0.5">
  <div class="row"><span>탑승률</span><b id="vFill"></b></div><input type="range" id="fill" min="0" max="100" step="5">
  <div class="chk">
    <label id="gearLbl"><input type="checkbox" id="gear"> 바퀴 내림</label>
    <label><input type="checkbox" id="fire"> 연료 불</label>
    <label><input type="checkbox" id="slow"> 처음 부딪힐 때 느린 화면</label>
  </div>
  <button id="startBtn">추락 시작</button>
  <div class="hint">추락 전에 비행기의 화살표를 끌 수 있습니다: 가운데 = 방향·속도, 앞·뒤 = 기수 각도<br>Space 시작·멈춤 · R 다시 실행<br>마우스 휠 확대 · 끌어서 화면 이동 · 사람을 누르면 정보</div>
</div>
<button id="showPanel">설정</button>
<div id="hud"></div>
<div id="result"></div>
<div id="tip"></div>
<div id="landPad"><button data-k="up">기수 ▲</button><button data-k="dn">기수 ▼</button><button data-k="pu">출력 +</button><button data-k="pd">출력 −</button><button data-k="br">브레이크</button></div>
<div id="bar">
  <div class="grp"><button id="bRestart">다시 실행</button><button id="bPause">일시정지</button></div>
  <div class="grp"><em>배속</em><button data-ts="0.1">0.1</button><button data-ts="0.25">0.25</button><button data-ts="0.5">0.5</button><button data-ts="1" class="on">1</button><button data-ts="2">2</button></div>
  <div class="grp"><em>보기</em><button id="vInside" class="on">속 보기</button><button id="vOutside">겉모습</button><button id="vStress">힘 보기</button><button id="vTrail" class="on">궤적</button></div>
  <div class="grp"><em>화면</em><button id="cFollow" class="on">따라가기</button><button id="cWide">넓게</button><button id="bSound" class="on">소리</button></div>
</div>

// 땅 종류: 0 활주로 1 풀 2 흙 3 바위 4 모래(바다 밑)
const TER={x0:-3000,dx:0.5,n:0,h:null,h0:null,scar:null,kind:null,water:false,scene:'runway',rwA:0,rwB:0,decor:[],xEst:0};
function buildTerrain(scene,xEst,wallArg){
  const r0=mulberry32(12345+scene.length*77);
  const n=Math.ceil((32000-TER.x0)/TER.dx);
  TER.n=n;TER.h=new Float32Array(n);TER.scar=new Float32Array(n);TER.kind=new Uint8Array(n);TER.scene=scene;TER.water=scene==='sea'||scene==='seawall';TER.waterEnd=Infinity;TER.xEst=xEst;TER.rwA=set.mode==='land'?xEst-350:xEst-1400;TER.rwB=xEst+3200;
  const wallX=wallArg!=null?wallArg:xEst-110;if(scene==='seawall'){TER.waterEnd=wallX+1.2;TER.rwA=wallX+160;TER.rwB=wallX+3400;TER.wallX=wallX;}
  const ph=[r0()*6,r0()*6,r0()*6];
  const xm=Math.max(60,xEst*0.72);
  for(let i=0;i<n;i++){
    const x=TER.x0+i*TER.dx;let h=0,k=1;
    if(scene==='runway'){ if(x>TER.rwA&&x<TER.rwB){h=0;k=0;} else {h=0.15*Math.sin(x/37+ph[0])-0.1;k=1;} }
    else if(scene==='field'){ h=2.2*Math.sin(x/170+ph[0])+1.1*Math.sin(x/61+ph[1])+0.35*Math.sin(x/13+ph[2]); k=(Math.sin(x/260+ph[1])>0.45)?2:1; }
    else if(scene==='mountain'){ const d=x-xm; if(d<0){h=0.6*Math.sin(x/90+ph[0]);k=1;} else { const s=Math.min(d,1500);
        h=s*Math.tan(27*DEG)*sstep(0,90,d)+6*Math.sin(d/23+ph[1])*sstep(0,60,d)+2.5*Math.sin(d/7+ph[2])*sstep(0,40,d); if(d>1500)h+= (d-1500)*0.15; k=d<25?1:3; } }
    else if(scene==='sea'){ h=-19-5*Math.sin(x/420+ph[0])-2*Math.sin(x/97+ph[1]); k=4; }
    else if(scene==='seawall'){ if(x<wallX){h=-9-1.5*Math.sin(x/120+ph[0]);k=4;} else if(x<wallX+3){h=-9+13*sstep(wallX,wallX+2.2,x);k=3;} else {h=4;k=(x>TER.rwA&&x<TER.rwB)?0:(x<wallX+25?3:1);} }
    TER.h[i]=h;TER.kind[i]=k;
  }
  TER.h0=TER.h.slice();
  // 꾸밈
  const D=[];const r1=mulberry32(999+scene.length);
  if(scene==='runway'||scene==='seawall'){
    for(let x=TER.rwA;x<=TER.rwB;x+=60)D.push({t:'edge',x});
    for(let x=TER.rwA-900;x<TER.rwA-20;x+=30)D.push({t:'appr',x,h:1.5+(TER.rwA-x)*0.004});
    for(let x=TER.rwB+80;x<TER.rwB+4000;x+=rr2(r1,30,90))D.push({t:'tree',x,s:rr2(r1,0.7,1.3)});
    if(scene==='runway')for(let x=TER.x0+50;x<TER.rwA-950;x+=rr2(r1,30,110))D.push({t:'tree',x,s:rr2(r1,0.7,1.3)});
  }else if(scene==='field'){
    for(let x=TER.x0+30;x<30000;x+=rr2(r1,25,140))D.push({t:r1()<0.18?'pole':'tree',x,s:rr2(r1,0.6,1.4)});
    for(let x=TER.x0;x<30000;x+=rr2(r1,500,1500)){const len=rr2(r1,40,140);for(let k=0;k<len;k+=3)D.push({t:'fence',x:x+k});}
  }else if(scene==='mountain'){
    for(let x=TER.x0+30;x<30000;x+=rr2(r1,8,40)){const d=x-xm;D.push({t:d>20?'pine':'tree',x,s:rr2(r1,0.6,1.3)});}
  }else{
    D.push({t:'buoy',x:xEst+300});D.push({t:'buoy',x:xEst+1300});
  }
  TER.decor=D;
}
function rr2(r,a,b){return a+(b-a)*r();}
function gIdx(x){let f=(x-TER.x0)/TER.dx;if(f<0)f=0;if(f>TER.n-2.001)f=TER.n-2.001;return f;}

function gKind(x){return TER.kind[gIdx(x)|0];}
function waveY(x,t){return 0.28*Math.sin(x*0.16+t*1.3)+0.14*Math.sin(x*0.41-t*1.9);}

function profAt(prof,u,c){if(u<=prof[0][0])return prof[0][c];for(let k=1;k<prof.length;k++){if(u<=prof[k][0]){const a=prof[k-1],b=prof[k],t=(u-a[0])/(b[0]-a[0]);return a[c]+(b[c]-a[c])*(t*t*(3-2*t)*0.35+t*0.65);}}return prof[prof.length-1][c];}
// 점 종류: 0 몸통 1 날개 2 엔진 3 꼬리 4 바퀴다리 5 바퀴 6 화물
function buildPlaneLocal(P,gearDown){

  for(let i=0;i<NS;i++)for(let r=0;r<nR-1;r++){B_(G[i][r],G[i+1][r+1]);B_(G[i+1][r],G[i][r+1]);}
  const fus=[];G.forEach(c=>c.forEach(n=>fus.push(n)));

  const stF=new Float64Array(NS).fill(1);
  if(L>=25&&P.wing){const wj=TUNE.weakJoint;const at=u=>clamp(Math.round(u/L*NS),1,NS-2);
    const js=[at(P.wing.rLE[0]-0.8),at(P.wing.rTE[0]+1.2),at(L*0.8)];
    for(let i=0;i<NS;i++)stF[i]=TUNE.strongSkin;
    js.forEach(j=>{stF[j]=rr(wj[0],wj[1]);});}
  const colOf=new Map();G.forEach((c,i)=>c.forEach(n=>colOf.set(n,i)));
  const stBeams=[];for(let i=0;i<NS;i++)stBeams.push([]);
  beams.forEach((bm,k)=>{const ca=colOf.get(bm.a),cb=colOf.get(bm.b);if(ca==null||cb==null||ca===cb)return;const i=Math.min(ca,cb);bm.str*=stF[i];bm.st=i;stBeams[i].push(k);});
  // 몸통이 국수처럼 휘지 않게: 두 칸 건너 잇는 굽힘 연결 (가운데가 끊어지면 같이 끊어짐)
  const skips=[];const skRows=[0,FR,BR];if(up)skRows.push(UR);

  const near=(px,py,cands,k,ex)=>cands.filter(n=>!(ex&&ex.includes(n))).map(n=>[n,(nodes[n].x-px)**2+(nodes[n].y-py)**2]).sort((a,b)=>a[1]-b[1]).slice(0,k).map(a=>a[0]);

/* 속도·각도·기수 각도에 맞춰 꼬리날개를 다듬고 하늘에 놓기 (화살표로 바꿀 때도 부름) */
function applyFlight(s){
  const P=s.P,B=s.B,tb=s.tb,wingSurf=s.wingS,hsSurf=s.hsS;const n=s.n;const C=s.cfg;
  if(C.park){// 땅에 세워 둠: 수평, 바퀴가 땅에 닿게, 멈춰 있음
    s.hsBase=0;hsSurf.inc=0;s.trimInfo={alw:0,thb:0,it:0,xnp:tb.xnp,target:tb.target,cx:tb.cx,beta:tb.beta};
    const X0=C.x0||0,sg=s.mir;let Y0=-1e9;
    // 앞바퀴·뒷바퀴가 둘 다 땅에 닿게 기울기 맞춤
    let th=0;const mw=B.wheels.find(w=>w.main),nw=B.wheels.find(w=>!w.main);
    if(mw&&nw){const a=mw.n[0],c=nw.n[0];const ddx=tb.lx[c]-tb.lx[a];if(Math.abs(ddx)>0.5)th=-Math.atan(((tb.ly[c]-s.rad[c])-(tb.ly[a]-s.rad[a]))/ddx);}
    const ct=Math.cos(th),st=Math.sin(th);const LX=new Float64Array(tb.lx.length),LY=new Float64Array(tb.lx.length);
    for(let i=0;i<tb.lx.length;i++){LX[i]=tb.lx[i]*ct-tb.ly[i]*st;LY[i]=tb.lx[i]*st+tb.ly[i]*ct;}
    for(let i=0;i<LX.length;i++){const gx=X0+LX[i]*sg;const need=baseY(gx)+s.rad[i]-LY[i];if(need>Y0)Y0=need;}
    Y0+=0.02;
    for(let i=0;i<LX.length;i++){s.x[i]=s.ox[i]=X0+LX[i]*sg;s.y[i]=s.oy[i]=Y0+LY[i];s.vx[i]=0;s.vy[i]=0;}
    placePersons(s,0,0);s.V0=0;s.th0=0;s.trail.length=0;return;}
  const V=C.spd/3.6;const gam0=C.gam*DEG,Wt=tb.Mt*9.81,Sw=wingSurf?wingSurf.area:1;
  const a=tb.cx-tb.xw,bb=tb.cx-tb.xt;let alw,Lw,Lt,q;
  if(!wingSurf){alw=(C.att!=null?C.att:-4)*DEG;q=1;Lw=0;Lt=0;}
  else if(C.att!=null){
    // 기수 각도를 직접 정함: 그 자세(받음각)를 그대로 유지하게 꼬리를 맞춤 → 느리면 점점 가라앉음
    q=0.5*TUNE.rho*V*V;alw=C.att*DEG+tb.phiW+wingSurf.inc;Lw=q*Sw*clOf(alw,wingSurf);Lt=-Lw*a/bb;
  }else{
    // 내려가는 각도 그대로 계속 내려가도록, 그 각도에서 버티는 속도에 맞춰 다듬음(갑자기 다시 올라가지 않게)
    let Tt=0;for(const e of P.engines)Tt+=C.pow/100*(e.jet?e.thrust*Math.max(0.35,1-V*0.0016):Math.min(e.thrust,e.power*e.eta/Math.max(V,1)));
    const cd0=wingSurf.cd0+0.022+0.02*P.hs.area/Sw,kI=wingSurf.k;const drive=Wt*Math.sin(-gam0)+Tt;let Vt=V;
    if(drive>0&&!C.land){const qa=Sw*cd0,qc=kI*(Wt*Math.cos(gam0))**2/Sw,disc=drive*drive-4*qa*qc;if(disc>0){const qe=(drive+Math.sqrt(disc))/(2*qa);Vt=clamp(Math.sqrt(2*qe/TUNE.rho),V,V*TUNE.diveTrimMax);}}
    q=0.5*TUNE.rho*Vt*Vt;
    Lw=Wt*Math.cos(gam0)*bb/(bb-a);Lt=Wt*Math.cos(gam0)-Lw;
    alw=(Lw/(q*Sw)-wingSurf.cl0)/wingSurf.cla;alw=Math.min(alw,wingSurf.stall*0.92);
  }
  const thb=wingSurf?alw-tb.phiW-wingSurf.inc:alw;
  const alt=wingSurf?clamp(Lt/(q*hsSurf.area)/hsSurf.cla,-0.25,0.25):0;
  s.hsBase=alt-thb-tb.phiT;hsSurf.inc=s.hsBase-C.elev*DEG;
  s.trimInfo={alw:alw/DEG,thb:thb/DEG,it:hsSurf.inc/DEG,xnp:tb.xnp,target:tb.target,cx:tb.cx,beta:tb.beta};
  // 세상에 놓기
  const gam=gam0,th=gam+thb;const ct=Math.cos(th),st=Math.sin(th);
  const X0=C.x0||0,Y0=baseY(X0)+C.alt;
  const vx0=V*Math.cos(gam),vy0=V*Math.sin(gam);
  for(let i=0;i<tb.lx.length;i++){const lx=tb.lx[i],ly=tb.ly[i];s.x[i]=X0+lx*ct-ly*st;s.y[i]=Y0+lx*st+ly*ct;s.vx[i]=vx0;s.vy[i]=vy0;s.ox[i]=s.x[i];s.oy[i]=s.y[i];}
  if(s.mir<0)for(let i=0;i<tb.lx.length;i++){s.x[i]=s.ox[i]=2*X0-s.x[i];s.vx[i]=-s.vx[i];}
  placePersons(s,vx0*s.mir,vy0);
  s.V0=V;s.th0=th;s.trail.length=0;
}
function baseY(x){return (TER.water&&x<TER.waterEnd)?Math.max(0,gH(x)):gH(x);}

/* 고정해 놓고 무게를 달아 연결마다 힘을 잰다 */
function calibrate(s,pins,gmul,extra){
  const n=s.n,nb=s.nb;const sx=s.x.slice(),sy=s.y.slice();const sw=s.w.slice();
  pins.forEach(p=>s.w[p]=0);s.vx.fill(0);s.vy.fill(0);
  const F=new Float64Array(nb);const h=1/600,steps=170,it=8,avgFrom=130;
  for(let st=0;st<steps;st++){
    if(extra)for(const q of extra.nodes){s.vy[q]+=extra.f/extra.nodes.length/s.m[q]*h;}
    for(let i=0;i<n;i++){if(s.w[i]===0)continue;s.vy[i]-=9.81*gmul*h;s.ox[i]=s.x[i];s.oy[i]=s.y[i];s.x[i]+=s.vx[i]*h;s.y[i]+=s.vy[i]*h;}
    s.lam.fill(0);
    for(let k=0;k<it;k++){solveBeams(s,h,false);solveLocks(s,h,false);}
    for(let i=0;i<n;i++){if(s.w[i]===0)continue;s.vx[i]=(s.x[i]-s.ox[i])/h*0.55;s.vy[i]=(s.y[i]-s.oy[i])/h*0.55;}
    if(st>=avgFrom)for(let b=0;b<nb;b++)F[b]+=Math.abs(s.lam[b])/(h*h)/(steps-avgFrom);
  }
  s.x.set(sx);s.y.set(sy);s.w.set(sw);s.vx.fill(0);s.vy.fill(0);s.lam.fill(0);
  return F;
}

/* ===================== 물리: 쇠 연결 (휘고 끊어짐) ===================== */
function solveBeams(s,h,plastic){
  const x=s.x,y=s.y,w=s.w,ba=s.ba,bb=s.bb,rest=s.rest,lam=s.lam,alpha=s.alpha,alive=s.alive;const h2=h*h;
  for(let b=0;b<s.nb;b++){
    if(!alive[b])continue;const a=ba[b],c=bb[b];const wa=w[a],wc=w[c],ws=wa+wc;if(ws===0)continue;
    const dx=x[c]-x[a],dy=y[c]-y[a];const len=Math.sqrt(dx*dx+dy*dy);if(len<1e-9)continue;
    const C=len-rest[b];const at=alpha[b]/h2;
    let dl=(-C-at*lam[b])/(ws+at);
    if(plastic){
      const ln=lam[b]+dl,Y=s.yieldF[b]*h2;
      if(ln>Y||ln<-Y){
        const lc=ln>0?Y:-Y;dl=lc-lam[b];
        const Crem=C+ws*dl+at*lc;
        rest[b]+=Crem;s.yieldCount++;s.bent[b]+=Math.abs(Crem)/s.rest0[b];
        const brittle=s.bk[b]===7;
        if(rest[b]>s.rest0[b]*(1+(brittle?0.035:TUNE.breakStretch))||(brittle&&rest[b]<s.rest0[b]*0.8)||(lc<0&&s.bent[b]>TUNE.tearStrain)){alive[b]=0;s.broken.push(b);continue;}
        const bd=s.B.beams[b];
        if(bd&&bd.lon&&rest[b]<s.rest0[b]*TUNE.crushTear){alive[b]=0;s.broken.push(b);continue;}
        const cm=bd&&bd.vert?TUNE.frameCrushMin:TUNE.crushMin;if(rest[b]<s.rest0[b]*cm)rest[b]=s.rest0[b]*cm;
      }
      const f=Math.abs(lam[b]+dl)/h2/s.yieldF[b];if(f>s.stress[b])s.stress[b]=f;
    }
    lam[b]+=dl;const nx=dx/len,ny=dy/len;
    x[a]-=wa*dl*nx;y[a]-=wa*dl*ny;x[c]+=wc*dl*nx;y[c]+=wc*dl*ny;
  }
}
function lockFrame(s,L){const G=s.B.G,FR=s.B.FR;const A=G[L.i][FR],Bn=G[L.i+1][FR];return{A,Bn};}
function solveLocks(s,h,canBreak){
  const x=s.x,y=s.y,w=s.w;const h2=h*h;
  for(const L of s.locks){if(!L.alive)continue;const {A,Bn}=lockFrame(s,L);
    let fx=x[A]-x[Bn],fy=y[A]-y[Bn];const fl=hyp(fx,fy)||1;fx/=fl;fy/=fl;
    const tx=x[A]+(x[Bn]-x[A])*L.t-fy*L.off*s.mir,ty=y[A]+(y[Bn]-y[A])*L.t+fx*L.off*s.mir;
    const dx=tx-x[L.p],dy=ty-y[L.p];const W=w[L.p]+w[A]*(1-L.t)*(1-L.t)+w[Bn]*L.t*L.t;if(W===0)continue;
    const k=1/W;
    if(canBreak&&hyp(dx,dy)*k/h2>L.str){L.alive=false;continue;}
    x[L.p]+=dx*k*w[L.p];y[L.p]+=dy*k*w[L.p];
    x[A]-=dx*k*w[A]*(1-L.t);y[A]-=dy*k*w[A]*(1-L.t);x[Bn]-=dx*k*w[Bn]*L.t;y[Bn]-=dy*k*w[Bn]*L.t;
  }
}

/* 공기 힘(날개 양력·항력), 엔진, 물 */
function clOf(a,sf){const st=sf.stall;
  if(a>st){const k=Math.min(1,(a-st)/0.2);return (sf.cl0+sf.cla*st)*(1-k)*0.78+1.05*Math.sin(2*a)*k*(1-0.2*(1-k));}
  const sn=-st*0.85-sf.cl0/sf.cla;
  if(a<sn){const k=Math.min(1,(sn-a)/0.2);return (sf.cl0+sf.cla*sn)*(1-k)*0.78+1.05*Math.sin(2*a)*k;}
  return sf.cl0+sf.cla*a;}
function surfAlpha(s,sf){
  const le=sf.le,te=sf.te;const vx=(s.vx[le]+s.vx[te])*0.5,vy=(s.vy[le]+s.vy[te])*0.5;
  const fx=s.x[le]-s.x[te],fy=s.y[le]-s.y[te];
  return {vx,vy,a:s.mir*Math.atan2(vx*fy-vy*fx,vx*fx+vy*fy)+sf.inc};
}
function computeForces(s){
  const n=s.n,ax=s.ax,ay=s.ay,g=TUNE.gravity,rho=TUNE.rho;
  for(let i=0;i<n;i++){ax[i]=0;ay[i]=-g;
    const vx=s.vx[i],vy=s.vy[i];const v=hyp(vx,vy);
    if(v>0.5){const k=0.5*rho*v*s.cd[i]/s.m[i];ax[i]-=k*vx;ay[i]-=k*vy;}}
  for(const sf of s.surf){
    if(sf.dead)continue;
    const c=s.comp[sf.le];let ok=true;for(const nd of sf.nodes)if(s.comp[nd]!==c){ok=false;break;}
    if(!ok){sf.dead=true;continue;}
    const r=surfAlpha(s,sf);const V=hyp(r.vx,r.vy);if(V<2)continue;
    const a=Math.atan2(Math.sin(r.a),Math.cos(r.a));
    const cl=clOf(a,sf);const sn=Math.sin(a);
    const cd=sf.cd0+sf.k*Math.min(cl*cl,3)+1.5*sn*sn;
    const q=0.5*rho*V*V*sf.area;let wetk=1;
    if(TER.water){let wc=0;for(const nd of sf.nodes)if(s.y[nd]<0&&s.x[nd]<TER.waterEnd)wc++;wetk=1-wc/sf.nodes.length;}
    const L=q*cl*wetk,D=q*cd*wetk;const ux=r.vx/V,uy=r.vy/V;
    const Fx=-L*uy*s.mir-D*ux,Fy=L*ux*s.mir-D*uy;
    sf.lastA=a;sf.lastCL=cl;
    for(let k=0;k<sf.nodes.length;k++){const nd=sf.nodes[k];ax[nd]+=Fx*sf.wts[k]/s.m[nd];ay[nd]+=Fy*sf.wts[k]/s.m[nd];}
  }
  const pw=s.cfg.pow/100;
  if(s.rotor)rotorForce(s,pw);
  if(pw>0)for(const e of s.engines){
    if(!e.alive)continue;const nn=e.n;
    if(s.comp[nn[0]]!==s.mainComp){e.alive=false;continue;}
    const fx=(s.x[nn[0]]+s.x[nn[1]])*0.5-(s.x[nn[2]]+s.x[nn[3]])*0.5,fy=(s.y[nn[0]]+s.y[nn[1]])*0.5-(s.y[nn[2]]+s.y[nn[3]])*0.5;const fl=hyp(fx,fy)||1;
    const V=hyp(s.vx[nn[0]],s.vy[nn[0]]);
    let T=e.jet?pw*e.thrust*Math.max(0.35,1-V*0.0016):Math.min(pw*e.thrust,pw*e.power*e.eta/Math.max(V,1));
    for(const nd of nn){ax[nd]+=T/4*fx/fl/s.m[nd];ay[nd]+=T/4*fy/fl/s.m[nd];}
  }
}
function rotorForce(s,pw){
  const R=s.rotor;const hub=R.hub;if(s.comp[hub]!==s.mainComp)return;
  const alive=R.tipBeams.filter(tb=>s.alive[tb[0]]).length;if(!alive)return;
  let bx=0,by=0;for(const m of R.base){bx+=s.x[m];by+=s.y[m];}bx/=R.base.length;by/=R.base.length;
  let ux=s.x[hub]-bx,uy=s.y[hub]-by;const l=Math.sqrt(ux*ux+uy*uy)||1;ux/=l;uy/=l;
  const Wt=s.tb.Mt*9.81;const vax=s.vx[hub]*ux+s.vy[hub]*uy;const vd=Math.max(0,-vax);
  let T=pw*1.3*Wt+0.5*TUNE.rho*R.area*1.15*vd*vd;T*=alive/2;
  s.ax[hub]+=T*ux/s.m[hub];s.ay[hub]+=T*uy/s.m[hub];
  // 조종사가 자세를 붙잡음(로터가 돌 때만)
  if(pw>0.05){const B=s.B;const A=B.G[0][B.FR],Z=B.G[B.NS][B.FR];if(s.comp[A]===s.comp[Z]&&s.comp[A]===s.mainComp){
    const dx=s.x[A]-s.x[Z],dy=s.y[A]-s.y[Z];const d=Math.sqrt(dx*dx+dy*dy)||1;let th=Math.atan2(dy,dx);if(s.mir<0)th=Math.atan2(dy,-dx);
    let err=s.th0-th;err=Math.atan2(Math.sin(err),Math.cos(err));const om=((s.vy[A]-s.vy[Z])*dx-(s.vx[A]-s.vx[Z])*dy)/(d*d)*s.mir;
    const I=s.tb.Mt*(d/3.5)**2;const tau=I*(4*err-2.8*om);const f=tau/d;const nx=-dy/d,ny=dx/d;
    s.ax[A]+=f*nx*s.mir/s.m[A];s.ay[A]+=f*ny*s.mir/s.m[A];s.ax[Z]-=f*nx*s.mir/s.m[Z];s.ay[Z]-=f*ny*s.mir/s.m[Z];}}
}
function waterForces(s,h){
  if(!TER.water)return;const n=s.n,g=TUNE.gravity;
  for(let i=0;i<n;i++){const d=-s.y[i];if(d<=0||s.x[i]>=TER.waterEnd){s.wet[i]=0;continue;}
    s.wet[i]=1;const f=Math.min(1,d/0.6);
    s.vy[i]+=g*s.buoy[i]*Math.min(d/1.2,1)*h;
    const vx=s.vx[i],vy=s.vy[i];
    if(vy<0)s.vy[i]=vy/(1+TUNE.waterKn*-vy*f*h);else s.vy[i]=vy/(1+0.08*vy*f*h);
    s.vx[i]=vx/(1+TUNE.waterKt*Math.abs(vx)*f*h+0.4*f*h);
  }
}

/* 땅에 닿음 */
function groundCollide(s,h){
  const n=s.n,x=s.x,y=s.y,ox=s.ox,oy=s.oy;const wc2=TUNE.contactW*TUNE.contactW*h*h,ww2=TUNE.wheelContactW*TUNE.wheelContactW*h*h;
  for(let i=0;i<n;i++){
    if(s.w[i]===0)continue;const r=s.rad[i];const gx=x[i];const gh=gH(gx);
    if(y[i]-r>=gh){continue;}
    const sl=gSlope(gx);const inv=1/Math.sqrt(1+sl*sl);const nx=-sl*inv,ny=inv;
    const pen=(gh+r-y[i])*ny;const kd=gKind(gx);const isWheel=s.kind[i]===5;
    const soft=TUNE.soilSoft[kd]*(isWheel?0.5:1);
    // 부드러운 닿음: 깊이에 따라 밀어냄
    const k2=isWheel?ww2:wc2;let push=pen*k2/(1+k2)*(1-soft*0.85);
    if(pen>TUNE.maxPen*(1+soft*2))push=Math.max(push,Math.min(pen-TUNE.maxPen*(1+soft*2),0.035));
    x[i]+=nx*push;y[i]+=ny*push;
    const vdx=x[i]-ox[i],vdy=y[i]-oy[i];const dn=vdx*nx+vdy*ny;
    const tx=vdx-dn*nx,ty=vdy-dn*ny;const tl=hyp(tx,ty);
    if(tl>1e-9){const mu=isWheel?((s.cfg.park||STATE.brake&&s===S)?0.38:TUNE.rollFric):TUNE.fric[kd];
      const plow=soft*Math.min(pen,0.6)*0.012;
      const lim=mu*push+plow*tl;const red=Math.min(tl,lim)/tl;x[i]-=tx*red;y[i]-=ty*red;}
    {const mo=TUNE.groundBounce*h;const dn2=(x[i]-ox[i])*nx+(y[i]-oy[i])*ny;if(dn2>mo){const e=dn2-mo;ox[i]+=nx*e;oy[i]+=ny*e;}}
    const sp=tl/h;if(sp>s.contact[i])s.contact[i]=sp;
    const vin=-dn/h;if(vin>s.hit[i])s.hit[i]=vin;
    if(soft>0&&!isWheel&&(sp>1.5||vin>1.5)){const f=gIdx(gx)|0;const dig=Math.min(pen*soft*0.05,0.015);for(let k=-1;k<=1;k++){const j=f+k;if(j<0||j>=TER.n)continue;if(TER.h[j]>TER.h0[j]-1.6)TER.h[j]-=dig*(k===0?1:0.5);TER.scar[j]=Math.min(1,TER.scar[j]+0.05);}}
    else if(sp>3&&!isWheel){const f=gIdx(gx)|0;TER.scar[f]=Math.min(1,TER.scar[f]+0.03);}
  }
}

/* 부서진 조각끼리 부딪힘 (점 vs 쇠 모서리) */
const GR={cs:2.0,head:new Int32Array(8192),next:new Int32Array(131072),item:new Int32Array(131072),cnt:0};
function ghash(ix,iy){return ((ix*92837111)^(iy*689287499))&8191;}
function gridBuild(s){
  GR.head.fill(-1);GR.cnt=0;const cs=GR.cs,x=s.x,y=s.y;
  for(let b=0;b<s.nb;b++){if(!s.alive[b]||!s.coll[b])continue;const a=s.ba[b],c=s.bb[b];
    const ix0=Math.floor((Math.min(x[a],x[c])-0.25)/cs),ix1=Math.floor((Math.max(x[a],x[c])+0.25)/cs),iy0=Math.floor((Math.min(y[a],y[c])-0.25)/cs),iy1=Math.floor((Math.max(y[a],y[c])+0.25)/cs);
    if((ix1-ix0+1)*(iy1-iy0+1)>96)continue;
    for(let ix=ix0;ix<=ix1;ix++)for(let iy=iy0;iy<=iy1;iy++){if(GR.cnt>=131072)return;const hh=ghash(ix,iy);GR.item[GR.cnt]=b;GR.next[GR.cnt]=GR.head[hh];GR.head[hh]=GR.cnt++;}}
}
function segPush(s,px,py,pox,poy,b,R){
  // 돌려줌: [nx,ny,pen,t] 또는 null
  const a=s.ba[b],c=s.bb[b];const x=s.x,y=s.y;
  const ex=x[c]-x[a],ey=y[c]-y[a];const l2=ex*ex+ey*ey;if(l2<1e-6)return null;
  const t=((px-x[a])*ex+(py-y[a])*ey)/l2;if(t<-0.02||t>1.02)return null;
  const l=Math.sqrt(l2);const nx=-ey/l,ny=ex/l;const dNow=(px-x[a])*nx+(py-y[a])*ny;
  if(Math.abs(dNow)>1.2)return null;
  const pex=s.ox[c]-s.ox[a],pey=s.oy[c]-s.oy[a];const pl=hyp(pex,pey)||1;
  const dPrev=(pox-s.ox[a])*(-pey/pl)+(poy-s.oy[a])*(pex/pl);
  const sg=dPrev>=0?1:-1;const pen=R-sg*dNow;if(pen<=0)return null;
  return [sg*nx,sg*ny,pen,clamp(t,0,1)];
}
function interCollide(s,h){
  const x=s.x,y=s.y,w=s.w,comp=s.comp;const cs=GR.cs;const R=0.07;
  for(let i=0;i<s.n;i++){
    const ix=Math.floor(x[i]/cs),iy=Math.floor(y[i]/cs);let e=GR.head[ghash(ix,iy)];
    while(e>=0){const b=GR.item[e];e=GR.next[e];

function recomputeComps(s){
  const n=s.n,par=new Int32Array(n);for(let i=0;i<n;i++)par[i]=i;
  const f=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i];}return i;};
  for(let b=0;b<s.nb;b++){if(!s.alive[b])continue;const a=f(s.ba[b]),c=f(s.bb[b]);if(a!==c)par[a]=c;}
  const mass=new Map();for(let i=0;i<n;i++){const r=f(i);s.comp[i]=r;if(s.kind[i]<6)mass.set(r,(mass.get(r)||0)+s.m[i]);}
  let best=-1,bm=-1;for(const [k,v] of mass){if(v>bm){bm=v;best=k;}}
  s.mainComp=best;s.nComp=mass.size;

const J=11;

function initPersons(s,list){

function seatName(st,c){if(st.cls==='pilot')return c===0?'기장석':(st.crew>1?'부기장석':'앞 좌석');const L='ABCDEFGHJK';const letters=st.n===10?'ABCDEFGHJK':st.n===8?'ABCDEFGH':st.n===6?'ABCDEF':st.n===4?'ABCD':st.n===3?'DEF':'AB';

function seatFrame(s,st){

function peopleStep(s,h){

    }

function peopleFrame(s,dt){
  const pp=s.persons;if(!pp||!pp.n||dt<=0)return;
  const G=s.B.G;
  for(let k=0;k<pp.n;k++){const p=pp.list[k];let vx,vy;
    if(!pp.loose[k]){const st=p.seat;const A=G[st.i][st.r],B=G[st.i+1][st.r];
      const fl=s.B.LONG[st.i][st.r];
      if(!s.alive[fl]||s.comp[A]!==s.comp[B]){st.torn=true;}
      if(st.torn){pp.loose[k]=1;continue;}
      const A2=G[st.i][0],B2=G[st.i+1][0];vx=(lerp(s.vx[A],s.vx[B],st.t)+lerp(s.vx[A2],s.vx[B2],st.t))/2;vy=(lerp(s.vy[A],s.vy[B],st.t)+lerp(s.vy[A2],s.vy[B2],st.t))/2;}

const PROF={};function pt(k,t){PROF[k]=(PROF[k]||0)+performance.now()-t;}

    while(e>=0){const b=GR.item[e];e=GR.next[e];const r=segPush(sb,x[i],y[i],sa.ox[i],sa.oy[i],b,R);if(!r)continue;
      const [nx,ny,pen,t]=r;const a=sb.ba[b],c=sb.bb[b];const wa=sb.w[a]*(1-t),wc=sb.w[c]*t;const W=sa.w[i]+wa*(1-t)+wc*t;if(W===0)continue;const k=pen*0.6/W;
      x[i]+=nx*k*sa.w[i];y[i]+=ny*k*sa.w[i];sb.x[a]-=nx*k*wa;sb.y[a]-=ny*k*wa;sb.x[c]-=nx*k*wc;sb.y[c]-=ny*k*wc;

function stepSim(s,dt){stepWorld([s],dt);}
/* 금이 번짐: 몸통 한 곳이 찢어지면 같은 자리 나머지 쇠도 약해짐 → 그 자리에서 토막 남 */

function stepWorld(list,dt){

const SND=(()=>{

    const len=ctx.sampleRate*2;noise=ctx.createBuffer(1,len,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;

    const w=loop();windF=ctx.createBiquadFilter();windF.type='lowpass';windF.frequency.value=400;wind=ctx.createGain();wind.gain.value=0;w.connect(windF);windF.connect(wind);wind.connect(master);w.start();

    init,setOn(v){on=v;if(master)master.gain.value=v?0.55:0;},get on(){return on;},
    update(V,engPow,jet,running){if(!ctx)return;const t=ctx.currentTime;

/* 방파제 위치: 같은 물리로 미리 한 번 날려 보고(사람 빼고), 제일 낮은 곳이 방파제 윗부분 아래로 내려가는 곳에 놓음 */
function predictWall(s){
  const keys=['x','y','ox','oy','vx','vy','rest','lam','bent','stress','contact','hit','wet','comp','alive','yieldF'];
  const snap={};for(const k of keys)snap[k]=s[k].slice();
  const t0=s.t,yc=s.yieldCount,bc=s.breakCount,nc=s.nComp,mc=s.mainComp;const sd=s.surf.map(f=>f.dead),eng=s.engines.map(e=>[e.alive,e.struck]),lk=s.locks.map(l=>l.alive);
  s.noPeople=true;let res=null;
  for(let f=0;f<60*40&&res==null;f++){stepSim(s,1/60);
    for(let i=0;i<s.n;i++){if(s.kind[i]>=6)continue;if(s.y[i]-s.rad[i]<2.6){res=s.x[i];break;}}
    if(s.breakCount>bc)break;}
  for(const k of keys)s[k].set(snap[k]);
  s.t=t0;s.yieldCount=yc;s.breakCount=bc;s.nComp=nc;s.mainComp=mc;s.broken.length=0;s.crk.clear();s.noPeople=false;
  s.surf.forEach((f,k)=>f.dead=sd[k]);s.engines.forEach((e,k)=>{e.alive=eng[k][0];e.struck=eng[k][1];});s.locks.forEach((l,k)=>l.alive=lk[k]);
  return res==null?null:res-1.2;}
function xEstimate(){if(set.mode==='land')return clamp(set.alt/Math.tan(3*DEG),300,12000);const g=Math.max(Math.abs(set.gam),2)*DEG;return clamp(set.alt/Math.tan(g),120,12000);}
function restart(run){
  if(run)STATE.seed=(Math.random()*1e9)|0;
  buildTerrain(set.scene,xEstimate(),set.scene==='seawall'?1e9:null);
  shards.length=0;parts.length=0;
  S=makeSim();
  if(set.scene==='seawall'){const w=predictWall(S);if(w!=null)buildTerrain('seawall',xEstimate(),w);}
  placeObstacles(S);
  if(set.mode==='land'&&S.wingS&&run!==false&&!STATE.keepPow){const P=S.P,V=set.spd/3.6,Wt=S.tb.Mt*9.81,Sw=S.wingS.area,g=set.gam*DEG;const q=0.5*TUNE.rho*V*V;const CL=Wt*Math.cos(g)/(q*Sw);
    const D=q*Sw*(S.wingS.cd0+0.022+0.02*P.hs.area/Sw+S.wingS.k*CL*CL);let Tm=0;for(const e of P.engines)Tm+=e.jet?e.thrust*Math.max(0.35,1-V*0.0016):Math.min(e.thrust,e.power*e.eta/Math.max(V,1));
    set.pow=Math.round(clamp((D-Wt*Math.sin(-g))/Tm*100,0,100));S.cfg.pow=set.pow;applyFlight(S);}
  SIMS=[S];
  set.extra.forEach(e=>SIMS.push(makeSim(exCfg(e))));
  STATE.slowT=0;STATE.paused=false;cam.free=false;resEl.style.display='none';
  document.getElementById('bPause').textContent='일시정지';
  Shake.tr=0;STATE.ready=!run;updateHud();syncUI();
}

let SIMS=[];
function simFrame(d){stepWorld(SIMS,d);for(const s of SIMS){peopleFrame(s,d);frameEffects(s,d);frameStats(s,d);}}
let last=performance.now();
function loop(now){
  try{
    const real=Math.min(0.05,(now-last)/1000);last=now;STATE.t+=real;
    Shake.tr=Math.max(0,Shake.tr-real*1.4);
    if(S&&!STATE.paused&&!STATE.ready){
      let ts=STATE.ts;if(STATE.slowT>0){ts=Math.min(ts,TUNE.slowmo);STATE.slowT-=real;}
      const gdt=real*ts;const nst=Math.max(1,Math.ceil(gdt/(1/55)));
      for(let k=0;k<nst;k++)simFrame(gdt/nst);
      updateFx(gdt);
      for(const s of SIMS){for(const w of s.wheels){const n=w.n[0];w.rot-=s.vx[n]*gdt/w.r;}
        for(const e of s.engines){const V=hyp(s.vx[e.n[0]],s.vy[e.n[0]]);if(!e.struck)e.spin+=gdt*((e.alive&&s.cfg.pow>0)?40:V*0.6);}
        if(s.rotor){const R=s.rotor;const on=s.alive[R.tipBeams[0][0]]||s.alive[R.tipBeams[1][0]];R.spin+=gdt*(on?(s.cfg.pow>0?27:Math.min(27,8+hyp(s.vx[R.hub],s.vy[R.hub])*0.5)):0);}}
    }
    if(set.mode==='land'&&S&&!STATE.ready&&!STATE.paused)landControl(real);
    updateCamera(real);
    draw();
    hudT-=real;if(hudT<=0){hudT=0.12;updateHud();
      if(S){const c=mainCG(S);const e=S.engines.find(e=>e.alive)||(S.rotor&&S.alive[S.rotor.tipBeams[0][0]]?{}:null);SND.update(hyp(c.vx,c.vy),e?set.pow/100:0,!!(S.P.engines[0]&&S.P.engines[0].jet),!STATE.paused&&!S.done&&!STATE.ready);}}
  }catch(err){console.error(err);}
  requestAnimationFrame(loop);
}

  Object.assign(set,{scene:p.scene,alt:p.alt,gam:p.gam,pow:p.pow,elev:p.elev,gear:p.gear,att:p.att==null?null:p.att});set.spd=Math.round(clamp(P.spd[2]*p.spdK,P.spd[0],P.spd[1])/5)*5;
  syncUI();save();restart();$('preset').value=k;}
function save(){try{localStorage.setItem('plane-crash-v1',JSON.stringify(set));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('plane-crash-v1')||'null');if(d)for(const k in set)if(k in d)set[k]=d[k];}catch(e){}if(!PLANES[set.plane])set.plane='b738';if(!Array.isArray(set.obs))set.obs=[];if(!Array.isArray(set.placed))set.placed=[];if(!Array.isArray(set.extra))set.extra=[];if(!PLANES[set.exType])set.exType='a320';set.extra=set.extra.filter(e=>PLANES[e.type]);}

/* ===================== 손·마우스 ===================== */
let drag=null,pinch=null;
cv.addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(-e.deltaY*0.0015);zoomAt(e.clientX*DPR,e.clientY*DPR,f);},{passive:false});
function zoomAt(sx,sy,f){const S0=scale();const wx=cam.x+(sx-W/2)/S0,wy=cam.y-(sy-H/2)/S0;cam.z=clamp(cam.z*f,0.02,40);const S1=scale();if(cam.free){cam.x=wx-(sx-W/2)/S1;cam.y=wy+(sy-H/2)/S1;}}
cv.addEventListener('pointerdown',e=>{SND.init();cv.setPointerCapture(e.pointerId);const h=arrowHit(e.clientX,e.clientY);
  if(h){ARW.drag=h;const S0=scale();ARW.wy0=cam.y-(e.clientY*DPR-H/2)/S0;ARW.att0=set.att!=null?set.att:Math.round(S.trimInfo.thb*2)/2;drag=null;return;}
  if(STATE.tool==='craft'||STATE.tool==='park'){drag={x:e.clientX,y:e.clientY,moved:0,id:e.pointerId};return;}
  drag={x:e.clientX,y:e.clientY,moved:0,id:e.pointerId};});
cv.addEventListener('pointermove',e=>{
  if(ARW.drag){arrowMove(e.clientX,e.clientY);return;}
  {const S0=scale();ARW.mx=cam.x+(e.clientX*DPR-W/2)/S0;ARW.my=cam.y-(e.clientY*DPR-H/2)/S0;}
  const ah=arrowHit(e.clientX,e.clientY);ARW.hover=ah;cv.style.cursor=ah?'grab':(STATE.tool?'crosshair':'');
  if(drag&&drag.id===e.pointerId&&!pinch){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;
    if(drag.moved>4){const S0=scale();cam.free=true;cam.x-=dx*DPR/S0;cam.y+=dy*DPR/S0;syncBar();}}
  else hoverPerson(e.clientX,e.clientY,false);
});
cv.addEventListener('pointerup',e=>{if(ARW.drag){ARW.drag=null;save();restart();return;}
  if(drag&&drag.moved<=4&&STATE.tool){const S0=scale();placeAt(cam.x+(e.clientX*DPR-W/2)/S0,cam.y-(e.clientY*DPR-H/2)/S0);drag=null;return;}
  if(drag&&drag.moved<=4)hoverPerson(e.clientX,e.clientY,true);drag=null;});
cv.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinch={d:hyp(a.clientX-b.clientX,a.clientY-b.clientY)};}},{passive:true});
cv.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){const a=e.touches[0],b=e.touches[1];const d=hyp(a.clientX-b.clientX,a.clientY-b.clientY);zoomAt((a.clientX+b.clientX)/2*DPR,(a.clientY+b.clientY)/2*DPR,d/pinch.d);pinch.d=d;}},{passive:true});
cv.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null;},{passive:true});
const tipEl=$('tip');
function hoverPerson(cx,cy,click){
  if(!S){tipEl.style.display='none';return;}
  const S0=scale();const wx=cam.x+(cx*DPR-W/2)/S0,wy=cam.y-(cy*DPR-H/2)/S0;let pp=null,best=-1,bd=(14*DPR/S0)**2;
  for(const z of SIMS){const q=z.persons;for(let k=0;k<q.n;k++){const b=k*J+1;const d=(q.x[b]-wx)**2+(q.y[b]-wy)**2;if(d<bd){bd=d;best=k;pp=q;}}}
  if(best<0||!(click||tipEl.style.display==='block')){if(best<0)tipEl.style.display='none';if(!click)return;}
  if(best<0)return;
  const p=pp.list[best];
  tipEl.innerHTML=(p.crew?'조종사 · ':'승객 · ')+p.seatName+'<br>최대 충격 '+pp.maxG[best].toFixed(1)+' g · '+(pp.dead[best]?'<span style="color:#ff6a5a">사망</span>':pp.hurt[best]?'<span style="color:#ff8a6a">크게 다침 (생존)</span>':'무사')+(pp.loose[best]?' · 의자 뜯김':'');
  tipEl.style.left=(cx+14)+'px';tipEl.style.top=(cy+10)+'px';tipEl.style.display='block';
}
const KEYS=new Set();window.addEventListener('keyup',e=>{KEYS.delete(e.code);if(e.code==='KeyB')STATE.brake=false;});
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if(set.mode==='land'&&['ArrowUp','ArrowDown','KeyW','KeyS','KeyB'].includes(e.code)){e.preventDefault();KEYS.add(e.code);if(e.code==='KeyB')STATE.brake=true;if(STATE.ready&&e.code!=='KeyB')go();return;}
  if(e.code==='Space'){e.preventDefault();SND.init();if(STATE.ready)go();else if(S&&S.done)restart(true);else togglePause();}
  else if(e.code==='KeyR'){SND.init();restart(true);}});
function go(){if(STATE.ready&&S){STATE.ready=false;syncUI();}else restart(true);}

/* ===================== 시작 ===================== */
load();buildUI();syncUI();syncBar();restart();
if(innerWidth<900||innerHeight<520){$('panel').classList.add('hide');$('showPanel').style.display='block';}
requestAnimationFrame(loop);
window.__crash={TER,PROF,get S(){return S;},get SIMS(){return SIMS;},simFrame,updateFx:(d)=>updateFx(d),set,STATE,cam,restart,stepSim,TUNE,draw,resize,applyPreset,syncUI};
</script>
<script src="../track.js" defer></script>
</body>
