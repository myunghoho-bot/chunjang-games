<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>푸른 행성 만들기</title>
<style>
:root{--pan:rgba(7,13,28,.80);--line:rgba(130,185,255,.30);--acc:#5fd0ff;--ok:#7dff9a;--warn:#ffcf5a;--bad:#ff7a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#04060c;color:#e8f1ff;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.pan{background:var(--pan);border:1px solid var(--line);border-radius:12px}
.bar{height:12px;background:rgba(255,255,255,.13);border-radius:7px;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.btn{cursor:pointer;border:1px solid var(--line);background:rgba(20,36,70,.9);color:#e8f1ff;border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;white-space:nowrap}
.btn:hover{background:rgba(44,78,140,.95)}
.btn:disabled{opacity:.45;cursor:default}
.btn kbd{font:inherit;font-size:11px;opacity:.65;margin-left:4px}
.btn.big{font-size:18px;padding:12px 22px;border-radius:12px}
.btn.go{background:linear-gradient(180deg,#2f8ad8,#1d5fa8);border-color:#7cc4ff}
.btn.green{background:linear-gradient(180deg,#2e9a5a,#1f6d3e);border-color:#7dff9a}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#tl{position:absolute;left:10px;top:10px;padding:8px 12px 9px;width:min(430px,calc(100vw - 160px))}
#pname{font-size:20px;font-weight:800;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pname small{font-size:13px;font-weight:400;color:#9fc3ff;margin-left:6px}
#blue{margin:6px 0 6px;height:17px}
#blue>i{background:linear-gradient(90deg,#3a6fd5,#36c1dc,#7dffa8)}
#bluet{position:absolute;inset:0;text-align:center;font-size:12px;line-height:17px;font-weight:800;text-shadow:0 1px 2px #000}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 12px;font-size:12.5px}
.st{white-space:nowrap}
.st b{font-weight:800}
.st .bar{height:5px;margin-top:2px}
.ok{color:var(--ok)} .wn{color:var(--warn)} .bd{color:var(--bad)}
#tip{margin-top:7px;font-size:12.5px;color:#ffe9a8;line-height:1.35}
#btns{position:absolute;right:148px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 600px);pointer-events:auto}
#globeBox{position:absolute;right:10px;top:10px;width:130px;padding:4px 4px 5px;text-align:center;pointer-events:auto;cursor:pointer}
#globe{width:120px;height:120px;display:block;margin:0 auto}
#globeT{font-size:11px;color:#9fc3ff;margin-top:2px}
#me{position:absolute;left:10px;bottom:30px;padding:7px 10px;width:220px;font-size:12px}
#me .row{display:flex;align-items:center;gap:6px;margin:3px 0}
#me .row span{width:46px}
#me .row em{font-style:normal;width:46px;text-align:right;color:#cfe0ff}
#me .bar{flex:1;height:10px}
#keys{position:absolute;left:240px;right:10px;bottom:7px;text-align:center;font-size:12px;color:#b9cbe9;text-shadow:0 1px 2px #000,0 0 4px #000}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6;width:min(560px,92vw)}
.tst{background:rgba(9,18,38,.93);border:1px solid var(--line);padding:8px 15px;border-radius:10px;font-size:14.5px;text-align:center;animation:tin .25s;box-shadow:0 4px 18px rgba(0,0,0,.4)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#banner{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:7;opacity:0;transition:opacity .5s}
#banner .b1{font-size:44px;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px rgba(80,180,255,.9),0 3px 6px #000;white-space:nowrap}
#banner .b2{font-size:19px;margin-top:6px;text-shadow:0 2px 4px #000}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:10}
#mbox{width:min(720px,95vw);max-height:88vh;overflow:auto;padding:14px 18px 16px;position:relative}
#mbox h2{margin:0 0 8px;font-size:21px}
#mbox h3{margin:14px 0 6px;font-size:15px;color:#9fd0ff}
#mbox .x{position:absolute;right:10px;top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px;background:rgba(255,255,255,.04);cursor:pointer;position:relative}
.card:hover{background:rgba(95,208,255,.12)}
.card.off{opacity:.55}
.card .nm{font-weight:800;font-size:14px}
.card .ds{font-size:12px;color:#bcd0ee;margin-top:3px;line-height:1.35}
.card img.th{display:block;margin:0 auto 4px;width:96px;height:72px}
.cost{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;font-size:12px}
.cost span{display:inline-flex;align-items:center;gap:2px;background:rgba(0,0,0,.3);border-radius:6px;padding:1px 5px 1px 2px}
.cost span.no{color:var(--bad)}
.cost img{width:18px;height:18px}
.slot{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;background:rgba(255,255,255,.04)}
.slot:hover{background:rgba(95,208,255,.13)}
.slot img{width:36px;height:36px;flex:none}
.slot .q{font-weight:900;font-size:16px;margin-left:auto}
.slot .sub{font-size:11px;color:#9fb7d9}
.tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.tabs .btn.on{background:#2f6fc0;border-color:#9fd0ff}
.lockt{font-size:12px;color:var(--warn)}
.fact{font-size:13.5px;line-height:1.55;margin:3px 0}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:12;pointer-events:none}
#title .tbox{text-align:center;pointer-events:auto;padding:26px 34px;background:rgba(4,8,20,.55);border-radius:20px;border:1px solid rgba(130,185,255,.25)}
#title .t0{font-size:14px;letter-spacing:8px;color:#7fc8ff}
#title h1{margin:6px 0 4px;font-size:clamp(34px,6vw,62px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#7dd6ff,#5fa0ff,#7dffb0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(60,140,255,.5))}
#title .t2{font-size:17px;color:#ffd98a;margin-bottom:10px}
#title .t3{font-size:15px;color:#cfe0ff;line-height:1.6;margin-bottom:18px}
#title .tb{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#mapui{position:fixed;inset:0;display:none;pointer-events:none;z-index:4}
#mtop{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:9px 18px;font-size:18px;font-weight:800;white-space:nowrap}
#mtop small{font-size:13px;font-weight:400;color:#9fc3ff;margin-left:8px}
#mback{position:absolute;left:12px;top:12px;pointer-events:auto}
#mcard{position:absolute;right:14px;bottom:14px;width:min(370px,92vw);max-height:calc(100vh - 90px);overflow:auto;padding:12px 14px;display:none;pointer-events:auto}
#syslist{position:absolute;left:12px;top:56px;padding:8px;display:flex;flex-direction:column;gap:5px;pointer-events:auto;max-height:calc(100vh - 80px);overflow:auto;width:170px}
#syslist .btn{text-align:left;white-space:normal}
#syslist .btn small{display:block;font-size:10.5px;font-weight:400;opacity:.75}
#syslist .btn.on{background:#2f6fc0;border-color:#9fd0ff}
#mcard h2{margin:0 0 4px;font-size:22px}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:3}
@media (max-height:520px),(max-width:760px){
 #tl{width:min(330px,calc(100vw - 120px));padding:5px 8px}
 #pname{font-size:16px} #blue{height:14px;margin:4px 0} #bluet{line-height:14px;font-size:11px}
 #stats{font-size:11px;gap:2px 8px} #tip{font-size:11px;margin-top:4px}
 #globeBox{width:96px} #globe{width:86px;height:86px} #globeT{display:none}
 #btns{right:112px;max-width:calc(100vw - 460px)} .btn{padding:4px 7px;font-size:12px}
 #me{width:170px;padding:4px 8px;font-size:11px;bottom:8px} #me .row{margin:1px 0}
 #keys{display:none}
}
body.touch #keys{display:none}
body.touch #me{left:auto;right:10px;bottom:170px}
#touch b{position:absolute;pointer-events:auto;width:62px;height:62px;border-radius:50%;background:rgba(30,60,110,.55);border:2px solid rgba(150,200,255,.5);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:800}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="tl" class="pan">
    <div id="pname"></div>
    <div id="blue" class="bar"><i></i><div id="bluet"></div></div>
    <div id="stats"></div>
    <div id="tip"></div>
  </div>
  <div id="btns">
    <button class="btn" data-a="bag">가방<kbd>I</kbd></button>
    <button class="btn" data-a="build">짓기<kbd>B</kbd></button>
    <button class="btn" data-a="map">지도<kbd>M</kbd></button>
    <button class="btn" data-a="dex">도감</button>
    <button class="btn" data-a="speed" id="spdBtn">빠르기 ×1</button>
    <button class="btn" data-a="sound" id="sndBtn">소리 켬</button>
  </div>
  <div id="globeBox" class="pan" data-a="map"><canvas id="globe" width="240" height="240"></canvas><div id="globeT"></div></div>
  <div id="me" class="pan"></div>
  <div id="keys">← → 걷기 · Shift 달리기 · Space 점프 · <b>E</b> 열기/쓰기 · <b>F</b> 꾹 캐기(마우스 꾹도 돼) · <b>Q</b> 사냥 · B 짓기 · I 가방 · M 지도</div>
</div>
<div id="toast"></div>
<div id="banner"><div class="b1"></div><div class="b2"></div></div>
<div id="modal"><div id="mbox" class="pan"></div></div>

<div id="title">
  <div class="tbox">
    <div class="t0">TERRAFORMING</div>
    <h1>푸른 행성 만들기</h1>
    <div class="t2">달 · 화성 · 유로파 · 금성 · 태양 — 그리고 다른 별 7곳</div>
    <div class="t3">보급 상자를 뒤지고, 재료를 캐고, 기계를 지어서<br>죽은 행성을 바다와 숲이 있는 <b style="color:#7dd6ff">푸른 행성</b>으로 바꿔!<br>생물을 번식시키고, 너무 많아지면 사냥해서 균형을 맞춰.</div>
    <div class="tb"><button class="btn big go" id="bCont">이어 하기</button><button class="btn big" id="bNew">처음부터 새로</button></div>
  </div>
</div>

<div id="mapui">
  <div id="mtop" class="pan">어느 행성으로 갈까? <small>행성을 눌러 봐</small></div>
  <button class="btn" id="mback">← 돌아가기</button>
  <div id="syslist" class="pan"></div>
  <div id="mcard" class="pan"></div>
</div>

<div id="touch">
  <b data-k="left" style="left:16px;bottom:22px">◀</b>
  <b data-k="right" style="left:90px;bottom:22px">▶</b>
  <b data-k="jump" style="right:16px;bottom:22px">점프</b>
  <b data-k="e" style="right:90px;bottom:22px">E</b>
  <b data-k="f" style="right:16px;bottom:96px">캐기</b>
  <b data-k="q" style="right:90px;bottom:96px">사냥</b>
</div>

<script>
'use strict';
// ================= 기본 도구 =================
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function wpick(o,R){R=R||Math.random;let s=0;for(const k in o)s+=o[k];let r=R()*s;for(const k in o){r-=o[k];if(r<=0)return k;}return Object.keys(o)[0];}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const HX={};
function hx(c){if(HX[c])return HX[c];let s=c;if(s.length===4)s='#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];return HX[c]=[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];}
function mixA(a,b,t){t=clamp(t,0,1);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function col(a,al){return al==null?`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`:`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;}
function mix(c1,c2,t){return col(mixA(hx(c1),hx(c2),t));}
const W=4800, COL=4, NC=W/COL, BASEX=2400, TW=160, TH=80, VH=540, BIOG=250;
const wrapX=x=>((x%W)+W)%W;
function wd(d){d=((d%W)+W)%W;return d>=W/2?d-W:d;}
const fmtP=p=>p<0.0095?p.toFixed(4)+'기압':p<0.095?p.toFixed(3)+'기압':p<10?p.toFixed(2)+'기압':p.toFixed(0)+'기압';

// ================= 재료 =================
const ITEMS={
 iron:{n:'철',r:0,d:'기계 만드는 기본 재료. 화성 흙이 빨간 것도 녹슨 철 때문이야.'},
 si:{n:'규소',r:0,d:'모래나 돌 속에 있어. 태양 전지판과 전자부품을 만들어.'},
 ice:{n:'얼음',r:0,d:'녹이면 물, 쪼개면 산소(전기 분해)가 돼.'},
 ti:{n:'티타늄',r:1,d:'가볍고 아주 튼튼한 금속. 달 돌에 많아.'},
 u:{n:'우라늄',r:2,d:'원자력 전지에 넣으면 햇빛 없이도 오래 전기를 만들어.'},
 chip:{n:'전자부품',r:1,d:'기계의 두뇌. 기지에서 규소랑 철로 만들 수도 있어.'},
 bp:{n:'설계도 칩',r:3,d:'주우면 새 기계 설계도가 바로 열려!'},
 food:{n:'우주 식량',r:0,eat:35,d:'먹으면 배고픔이 35 채워져.'},
 o2can:{n:'산소통',r:0,d:'쓰면 산소가 60 채워져. 산소가 다 떨어지면 저절로 써.'},
 meat:{n:'고기',r:0,eat:15,d:'사냥해서 얻은 고기. 기지에서 구우면 더 배불러.'},
 steak:{n:'구운 고기',r:0,eat:50,d:'먹으면 배고픔이 50 채워져.'},
 hide:{n:'가죽',r:0,d:'털 안감 우주복을 만들 때 써.'},
 s_moss:{n:'이끼 포자',r:1,plant:'moss',d:'제일 먼저 살 수 있는 식물. 추위에도 강해.'},
 s_grass:{n:'풀 씨앗',r:1,plant:'grass',d:'풀이 자라야 토끼랑 벌이 살아.'},
 s_tree:{n:'나무 씨앗',r:2,plant:'tree',d:'나무는 산소를 제일 많이 만들어.'},
 e_fish:{n:'물고기 알',r:1,animal:'fish',d:'생명 번식장에 넣으면 물고기 3마리가 태어나.'},
 e_bee:{n:'벌 애벌레',r:1,animal:'bee',d:'번식장에 넣으면 벌 3마리. 벌이 있으면 식물이 더 잘 퍼져.'},
 e_rabbit:{n:'토끼 배아',r:2,animal:'rabbit',d:'번식장에 넣으면 토끼 3마리. 풀을 먹어.'},
 e_wolf:{n:'늑대 배아',r:3,animal:'wolf',d:'번식장에 넣으면 늑대 3마리. 토끼를 사냥해.'},
};
const RAR=['#cfd6e2','#6fb6ff','#c58bff','#ffd24a'];
const RARN=['흔함','드묾','귀함','아주 귀함'];

// ================= 행성 =================
const PL={
 moon:{n:'달',sr:13,lv:'제일 쉬움',easy:2.5,bioG:150,g:0.166,sun:1,T0:-20,P0:0,O0:0,W0:0,wMul:1,rough:0.75,
  col:{top:'#b9b9b6',mid:'#8c8c89',deep:'#5b5b5a',sky:'#93a6bf',hor:'#d3dce6',hill:'#6f6f70'},
  ore:{iron:4,si:3,ti:2.5,ice:2.5,u:0.6},kit:{iron:8,si:6,ice:4,food:3,s_moss:2},
  hint:'제일 쉬운 행성이야! 공기가 없으니 태양 전지판 → 가스 추출기부터 지어 봐.',
  facts:['지구에서 38만 km 떨어진 지구의 위성이야.','중력이 지구의 1/6이라서 점프하면 엄청 높이 떠!','공기가 없어서 낮엔 127°C, 밤엔 -173°C까지 바뀌어. 게임에선 평균 온도(-20°C)로 했어.','작고 가까워서 이 게임에선 제일 바꾸기 쉬운 곳이야. 기계 힘이 2.5배!','극지방 크레이터 바닥은 햇빛이 안 들어서 얼음이 숨어 있어. 그래서 얼음은 깊은 곳에 있어.','달은 늘 같은 면만 지구를 봐. 그래서 하늘의 지구가 안 움직여.','중력이 약해서 진짜로는 공기가 아주 천천히 우주로 새어 나가 (몇천 년 걸려).']},
 mars:{n:'화성',sr:9,lv:'보통',easy:1.2,g:0.38,sun:0.43,T0:-63,P0:0.006,O0:0.13,W0:0,wMul:1.5,rough:1,
  col:{top:'#c4673a',mid:'#99472a',deep:'#5c2915',sky:'#c08a5e',hor:'#e8c09a',hill:'#9a5a3a'},
  ore:{iron:5,si:3,ice:2,ti:1.2,u:0.6},kit:{iron:4,si:3,ice:2,food:2},
  hint:'춥고 공기가 얇아. 태양 전지판 → 히터랑 가스 추출기를 지어 봐!',
  facts:['붉은 색은 흙 속의 녹슨 철(산화철) 때문이야.','공기는 지구의 0.6%뿐이고, 거의 다 이산화탄소야.','태양계에서 제일 높은 산, 올림푸스 산(약 22km)이 있어.','작은 위성 포보스와 데이모스가 하늘을 지나가.','양쪽 극지방에 얼음 모자가 있어. 그래서 물 펌프가 1.5배 잘 돼.','햇빛은 지구의 43%라서 태양 전지판 전기가 적게 나와.']},
 europa:{n:'유로파',sr:3.5,lv:'어려움',g:0.134,sun:0.037,T0:-160,P0:0,O0:0,W0:2,wMul:3,rough:0.45,

function ensureTer(id){
 if(TER[id]) return TER[id];
 const seed=(S?S.seed:12345)+pidx(id)*7919;
 const R=mulberry(seed), d=PL[id];
 const h=new Float32Array(NC);
 if(id==='sun'){ for(let i=0;i<NC;i++) h[i]=360; }
 else{
  const waves=[]; for(let k=1;k<=40;k++) waves.push([k,(0.5+R())/Math.pow(k,1.05),R()*6.283]);
  for(let i=0;i<NC;i++){ const a=i/NC*6.283; let y=0; for(const w of waves) y+=w[1]*Math.sin(w[0]*a+w[2]); h[i]=y; }
  let mn=1e9,mx=-1e9; for(let i=0;i<NC;i++){ mn=Math.min(mn,h[i]); mx=Math.max(mx,h[i]); }
  for(let i=0;i<NC;i++){ const n=(h[i]-mn)/(mx-mn); h[i]=250+100*(1-d.rough)+(1-n)*200*d.rough; }
  const bump=(cx,r,dep,rim)=>{ for(let i=0;i<NC;i++){ const dx=wd(i*COL-cx)/r, a=Math.abs(dx); if(a<1) h[i]+=dep*(1-dx*dx); else if(rim&&a<1.35) h[i]-=dep*rim*(1-(a-1)/0.35); } };
  if(id==='moon'||d.ter==='crater'){ for(let c=0;c<16;c++){ const r=40+R()*140; bump(R()*W,r,0.22*r+R()*16,0.28); } }
  if(id==='mars'){ for(let c=0;c<6;c++){ const r=50+R()*110; bump(R()*W,r,0.2*r,0.25); } bump(W*0.82,420,-150,0); }
  if(id==='venus'||d.ter==='dome'){ for(let c=0;c<5;c++){ const cx=R()*W, r=90+R()*80; for(let i=0;i<NC;i++){ const a=Math.abs(wd(i*COL-cx))/r; if(a<1) h[i]-=34*clamp((1-a)*4,0,1); } } }
  if(id==='europa'||d.ter==='ridge'){ for(let c=0;c<30;c++){ const cx=R()*W; for(let i=0;i<NC;i++){ const a=Math.abs(wd(i*COL-cx)); if(a<14) h[i]-=7*(1-a/14); } } }
  // 기지 자리는 높고 평평하게 (바다가 70%까지 차도 안 잠기게)
  const asc=Array.from(h).sort((a,b)=>a-b), q=asc[Math.floor(NC*0.08)];
  for(let i=0;i<NC;i++){ const a=Math.abs(wd(i*COL-BASEX)); if(a<170){ const t=clamp((170-a)/70,0,1); h[i]=lerp(h[i],q,t); } }
 }
 const sd=Array.from(h).sort((a,b)=>b-a);
 const deco=[]; for(let i=0;i<260;i++) deco.push({x:R()*W,dy:8+R()*170,r:1+R()*3.2,c:R()});
 const rocks=[]; for(let i=0;i<90;i++) rocks.push({x:R()*W,r:2+R()*5,c:R()});
 const lines=[]; for(let i=0;i<(id==='venus'||d.lava?26:id==='europa'?40:0);i++) lines.push({x:R()*W,w:20+R()*90});
 const hills=new Float32Array(NC); { const ws=[]; for(let k=1;k<=10;k++) ws.push([k,(0.5+R())/k,R()*6.283]); for(let i=0;i<NC;i++){ const a=i/NC*6.283; let y=0; for(const w of ws) y+=w[1]*Math.sin(w[0]*a+w[2]); hills[i]=y; } }
 // 둥근 행성 그림용 무늬
 const vn=(gw,gh)=>{ const g=new Float32Array(gw*gh); for(let i=0;i<g.length;i++) g[i]=R()*2-1; return {g,gw,gh}; };
 const smp=(N,x,y)=>{ const fx=x*N.gw, fy=y*(N.gh-1); const x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0; const s=t=>t*t*(3-2*t); const g=(i,j)=>N.g[clamp(j,0,N.gh-1)*N.gw+((i%N.gw)+N.gw)%N.gw]; const a=lerp(g(x0,y0),g(x0+1,y0),s(tx)), b=lerp(g(x0,y0+1),g(x0+1,y0+1),s(tx)); return lerp(a,b,s(ty)); };
 const n1=vn(16,8), n2=vn(40,20), n3=vn(24,12);
 const nz=new Float32Array(TW*TH), nc=new Float32Array(TW*TH*2);
 for(let y=0;y<TH;y++) for(let x=0;x<TW;x++){ nz[y*TW+x]=smp(n1,x/TW,y/(TH-1))*0.7+smp(n2,x/TW,y/(TH-1))*0.3; }
 for(let y=0;y<TH;y++) for(let x=0;x<TW*2;x++){ nc[y*TW*2+x]=smp(n3,x/(TW*2),y/(TH-1)); }
 return TER[id]={h,sd,deco,rocks,lines,hills,nz,nc,tex:null,texT:-99};
}
function hAtT(T,x){ x=wrapX(x)/COL; const i=Math.floor(x), f=x-i; return T.h[i%NC]*(1-f)+T.h[(i+1)%NC]*f; }
function hAt(x){ return hAtT(CT,x); }
function seaYof(id,Wp,temp){ if(id==='sun'||Wp<=0.05||temp>=100) return 1e9; const T=ensureTer(id); const f=clamp(Wp/100,0,0.99)*NC, i=Math.floor(f); return lerp(T.sd[i],T.sd[Math.min(NC-1,i+1)],f-i)-0.5; }
const isWater=x=>hAt(x)>SEA+0.5;
function gnd(x){ const h=hAt(x); return (FROZEN&&h>SEA)?SEA:h; }
const oreY=o=>hAt(o.x)+o.dy;

 const T=ensureTer(id), d=PL[id], R=mulberry((S.seed^0x5bd1)+pidx(id)*131);
 const deepQ=T.sd[Math.floor(NC*0.25)];
 const far=x=>Math.abs(wd(x-BASEX))>150;
 for(let i=0;i<(d.farm?110:52);i++){
  const t=wpick(d.ore,R); let x=0;
  for(let k=0;k<40;k++){ x=R()*W; if(!far(x)) continue; if(t==='ice'&&(id==='moon'||id==='mars')&&hAtT(T,x)<deepQ) continue; break; }
  s.ores.push({t,x,dy:R()<0.5?-2:10+R()*42,r:8+R()*4});
 }
 const place=(k,n,minD)=>{ for(let i=0;i<n;i++){ let x=0; for(let tr=0;tr<50;tr++){ x=R()*W; if(!far(x)) continue; if(s.boxes.some(b=>Math.abs(wd(b.x-x))<minD)) continue; break; } s.boxes.push({k,x,items:null,op:false}); } };

function prog(id,s){
 if(id==='sun'){ const t=clamp(s.D/100,0,1); return {t,pT:t,pP:t,pO:t,pW:t,pB:t}; }
 const d=PL[id];
 if(d.farm) return {t:0,pT:0,pP:0,pO:0,pW:0,pB:0};
 const pT=Math.abs(d.T0-15)<0.01?1:clamp(1-Math.abs(s.T-15)/Math.abs(d.T0-15),0,1);
 const l0=Math.log10(Math.max(d.P0,0.001)), l=Math.log10(Math.max(s.P,0.001));
 const pP=clamp(1-Math.abs(l)/Math.abs(l0),0,1);
 const pO=clamp(s.O/21,0,1), pW=clamp(s.W/70,0,1), pB=clamp(s.bio/(d.bioG||BIOG),0,1);
 return {t:(pT+pP+pO+pW+pB)/5,pT,pP,pO,pW,pB};
}
function pushStat(id,s,k,a){
 const d=PL[id];
 if(k==='T'){ const st=a*Math.abs(d.T0-15); s.T = s.T<15? Math.min(15,s.T+st) : Math.max(15,s.T-st); }
 else if(k==='P'){ const span=Math.abs(Math.log10(Math.max(d.P0,0.001))); let l=Math.log10(Math.max(s.P,0.001)); const st=a*span; l = l<0? Math.min(0,l+st) : Math.max(0,l-st); s.P=Math.pow(10,l); }
 else if(k==='W') s.W=Math.min(70,s.W+a*70*d.wMul);
 else if(k==='O') s.O=Math.min(21,s.O+a*21);
}
function statPerSec(id,k,rate){
 const d=PL[id]; rate*=(d.easy||1);
 if(k==='T'&&Math.abs(d.T0-15)<0.01) return '온도는 벌써 딱 좋아!';
 if(k==='T') return (d.T0>15?'온도 -':'온도 +')+(rate*Math.abs(d.T0-15)).toFixed(2)+'°C/초';
 if(k==='P') return d.P0>1?'공기를 줄여 (목표 1기압)':'공기를 늘려 (목표 1기압)';
 if(k==='W') return '물 +'+(rate*70*d.wMul*100).toFixed(1)+'%/100초';

}
function sunF(id,s){ if(id==='venus') return 0.25+1.65*prog(id,s).pP; let f=PL[id].sun; if(s.storm>0) f*=0.4; return f; }
function supOf(id,s,k){ if(k==='solar') return 3*sunF(id,s); if(k==='wind') return (id!=='sun'&&s.P>=0.1)?2:0; if(k==='rtg') return 6; return 0; }
function power(id,s){ let sup=0,use=0; for(const m of s.machines){ const M=MACH[m.t]; if(M.sup) sup+=supOf(id,s,M.sup); if(M.use) use+=M.use; } return {sup,use,r:use?Math.min(1,sup/use):1}; }
function machName(t,id){ const M=MACH[t]; return (id==='venus'&&M.vn)?M.vn:M.n; }

function simStep(id,s,dt){
 const pw=power(id,s), mult=(S.dyson?2:1)*(PL[id].easy||1);
 for(const m of s.machines){
  const M=MACH[m.t];
  if(M.stat) pushStat(id,s,M.stat,M.rate*pw.r*mult*dt);
  if(m.t==='dyson') s.D=Math.min(100,s.D+0.02*pw.r*dt);
  if(m.t==='drill'){ m.tm=(m.tm||0)+dt*pw.r; if(m.tm>=25){ m.tm=0; m.buf=m.buf||{}; let tot=0; for(const k in m.buf) tot+=m.buf[k]; const fm=PL[id].farm?2:1; if(tot<12*fm){ for(let q=0;q<fm;q++){ const it=wpick(PL[id].ore); m.buf[it]=(m.buf[it]||0)+1; } } } }
 }
 if(PL[id].farm) return;
 if(id!=='sun'){
  for(const sp of s.space) if(sp==='mirror'||sp==='shade') pushStat(id,s,'T',SP_RATE*mult*dt);
  let o2=0; for(const p of s.plants) o2+=LIFE[p.t].o2*p.g; s.O=Math.min(21,s.O+o2*dt);

  }

const MS=[10,25,40,55,70,85,100];

function unmet(t,s,c){

 if(pid==='sun'||(s===ps&&pid==='sun')) return ['태양 정거장엔 생물이 못 살아'];
 if(N.T){ if(s.T<N.T[0]) out.push(`온도가 ${N.T[0]}°C 넘어야 해 (지금 ${Math.round(s.T)}°C)`); else if(s.T>N.T[1]) out.push(`온도가 ${N.T[1]}°C보다 낮아야 해 (지금 ${Math.round(s.T)}°C)`); }
 if(N.P){ if(s.P<N.P[0]) out.push(`공기가 ${N.P[0]}기압 넘어야 해 (지금 ${fmtP(s.P)})`); else if(s.P>N.P[1]) out.push(`공기가 너무 많아. ${N.P[1]}기압보다 적어야 해 (지금 ${fmtP(s.P)})`); }
 if(N.W&&s.W<N.W) out.push(`물이 ${N.W}% 넘어야 해 (지금 ${s.W.toFixed(1)}%)`);
 if(N.O&&s.O<N.O) out.push(`산소가 ${N.O}% 넘어야 해 (지금 ${s.O.toFixed(1)}%)`);

}
function trySpawnPlant(t,x){

function lifeStep(sdt,dt){

  const p=ps.plants[i], L=LIFE[p.t];

  if(bad){ p.dead=(p.dead||0)+sdt; if(p.dead>4){ ps.plants.splice(i,1); continue; } } else p.dead=0;

  if(c.grass<c.rabbit*0.5){ for(const a of ps.animals) if(a.t==='rabbit'&&Math.random()<0.004*sdt) a.dead=1; }
  if(c.rabbit>=10&&c.rabbit>c.grass*1.1&&(S.t-(warned.rab||-999))>180){ warned.rab=S.t; toast('토끼가 너무 많아서 풀이 사라지고 있어! <b>Q</b>로 사냥해서 줄여 줘'); }

  if(m.t!=='breed'||!m.emb||!(m.left>0)) continue;
  if(!ok[m.emb]&&!(LIFE[m.emb].food&&unmet(m.emb,ps,null).length===0)){ m.wait=unmet(m.emb,ps,c)[0]||''; continue; }
  if(c[m.emb]>=LIFE[m.emb].cap){ m.wait='이미 가득 찼어'; continue; }

function updAnimal(a,dt,sdt,g){

 const dpx=wd(P.x-a.x), near=Math.abs(dpx)<130&&Math.abs(P.y-a.y)<90;

  const top=SEA+7, bot=Math.max(top,hAt(a.x)-5); a.y+=(clamp(a.ty,top,bot)-a.y)*Math.min(1,dt*1.5); a.y=clamp(a.y,top,bot);

  return;

 a.flee=0;

 else if(a.t==='wolf'){
  a.fed+=sdt;
  if(a.fed>60&&ps.animals.filter(b=>b.t==='rabbit').length>4){
   let best=null,bd=230; for(const b of ps.animals) if(b.t==='rabbit'){ const dd=Math.abs(wd(b.x-a.x)); if(dd<bd){bd=dd;best=b;} }
   if(best){ a.vx=Math.sign(wd(best.x-a.x))*92; a.tm=0.4; if(bd<10&&Math.abs(best.y-a.y)<20){ best.dead=1; a.fed=0; puff(best.x,best.y-6,'#ffffff',8); } }

function updPlayer(dt){

const GLC={};

  for(let x=0;x<TW;x++){
   const n=T.nz[y*TW+x], wx=x/TW*W, h=hAtT(T,wx)+n*75+al*al*30;
   let c;

 if(placing){ const x=ghostX(), ok=placeOK(x).ok&&has(MACH[placing].cost); ctx.globalAlpha=0.55; drawMach(ctx,placing,wd(x-camX),hAt(x),{t:placing,x},0,1); ctx.globalAlpha=1; ctx.strokeStyle=ok?'#7dff9a':'#ff6a5a'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]); ctx.strokeRect(wd(x-camX)-18,hAt(x)-50,36,52); ctx.setLineDash([]); }
 ctx.textAlign='center';
 for(const t of texts){ const X=wd(t.x-camX); ctx.globalAlpha=clamp(t.l,0,1); ctx.font='bold 11px "Malgun Gothic",sans-serif'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.7)'; ctx.strokeText(t.t,X,t.y); ctx.fillStyle=t.c; ctx.fillText(t.t,X,t.y); }
 ctx.globalAlpha=1;
 if(CUR&&!modalOpen){ const tx=CUR.k==='base'?BASEX:CUR.o.x; const X=wd(tx-camX), y=hAt(tx)-(CUR.k==='base'?104:CUR.k==='box'&&CUR.o.k==='wreck'?52:44); const txt=promptText(CUR); ctx.font='bold 11px "Malgun Gothic",sans-serif'; const w=ctx.measureText(txt).width+14; ctx.fillStyle='rgba(8,16,34,.85)'; rr(ctx,X-w/2,y-12,w,17,6); ctx.fill(); ctx.strokeStyle='rgba(130,185,255,.6)'; ctx.lineWidth=1; ctx.stroke(); ctx.fillStyle='#fff'; ctx.fillText(txt,X,y); }
 // 화면 효과
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(pid==='venus'){ const a=clamp(Math.log10(Math.max(ps.P,1))/1.96,0,1)*0.2; if(a>0.01){ ctx.fillStyle=`rgba(235,175,70,${a})`; ctx.fillRect(0,0,CW,CH); } }
 if(ps.storm>0){ ctx.fillStyle=`rgba(150,90,50,${0.25*clamp(ps.storm/5,0,1)})`; ctx.fillRect(0,0,CW,CH); ctx.fillStyle='rgba(200,140,90,.5)'; for(let i=0;i<60;i++){ const x=((i*137+TIME*400)%(CW+40))-20, y=(i*71)%CH; ctx.fillRect(x,y,6,1.2); } }
 if(comet&&comet.t<3.2){ const t=comet.t/3; const x=lerp(-60,CW*0.85,t), y=lerp(CH*0.05,CH*0.55,t); const gr=ctx.createLinearGradient(x,y,x-140,y-70); gr.addColorStop(0,'rgba(220,245,255,.95)'); gr.addColorStop(1,'rgba(120,200,255,0)'); ctx.strokeStyle=gr; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-140,y-70); ctx.stroke(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill(); }
 if(comet&&comet.hit&&comet.t<3.6){ ctx.fillStyle=`rgba(255,255,255,${clamp(1-(comet.t-3)/0.6,0,1)})`; ctx.fillRect(0,0,CW,CH); }
 edgeArrow(BASEX,'기지','#7dd6ff');
 if(fall) edgeArrow(fall.x,'캡슐','#ffd24a');
 else { let best=null,bd=1e9; for(const b of ps.boxes) if(b.k==='cap'&&!b.op){ const d=Math.abs(wd(b.x-P.x)); if(d<bd){bd=d;best=b;} } if(best) edgeArrow(best.x,'캡슐','#ffd24a'); }
}
function edgeArrow(x,txt,c){
 const X=wd(x-camX); if(Math.abs(X)<VW/2-20) return;
 const right=X>0, sx=right?CW-18:18, sy=CH*0.55+(txt==='캡슐'?34:0);
 ctx.fillStyle=c; ctx.beginPath(); if(right){ ctx.moveTo(sx,sy); ctx.lineTo(sx-14,sy-10); ctx.lineTo(sx-14,sy+10); } else { ctx.moveTo(sx,sy); ctx.lineTo(sx+14,sy-10); ctx.lineTo(sx+14,sy+10); } ctx.closePath(); ctx.fill();
 ctx.font='bold 12px "Malgun Gothic",sans-serif'; ctx.textAlign=right?'right':'left'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.8)'; const tt=`${txt} ${Math.round(Math.abs(X)/10)}m`; ctx.strokeText(tt,right?sx-18:sx+18,sy+4); ctx.fillStyle=c; ctx.fillText(tt,right?sx-18:sx+18,sy+4);
}
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 try{
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now; TIME+=dt;
  if(mode==='play') updatePlay(dt);
  else if(mode==='travel'){ travel.t+=dt; if(travel.t>=travel.dur){ const to=travel.to; travel=null; arrive(to); } }
  draw();
 }catch(e){ console.error(e); if(!window._errShown){ window._errShown=1; toast('앗, 작은 오류가 났어: '+e.message); } }
}

// ================= 입력 =================
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',ArrowDown:'down',KeyS:'down',KeyF:'f',ShiftLeft:'shift',ShiftRight:'shift'};
addEventListener('keydown',e=>{
 if(mode==='title') return;
 const c=e.code;
 if(modalOpen){ if(c==='Escape'||c==='KeyI'&&MCTX.bag||c==='KeyB'&&MCTX.build) { closeModal(); e.preventDefault(); } else if(c==='KeyE'&&MCTX.box){ doAct('takeall'); e.preventDefault(); } return; }
 if(mode==='map'){ if(c==='Escape'||c==='KeyM') closeMapBack(); return; }
 if(mode!=='play') return;
 if(KM[c]){ const k=KM[c]; if(k==='jump'&&!keys.jump) keys.jumpP=true; keys[k]=true; e.preventDefault(); return; }
 if(e.repeat) return;
 if(c==='KeyE'){ interact(); e.preventDefault(); }
 else if(c==='KeyQ') autoShoot();
 else if(c==='KeyB'){ placing=null; openBuild(); MCTX.build=1; }
 else if(c==='KeyI'||c==='Tab'){ openBag(); MCTX.bag=1; e.preventDefault(); }
 else if(c==='KeyM'){ save(); openMap(); }
 else if(c==='Escape'){ placing=null; }
});
addEventListener('keyup',e=>{ const k=KM[e.code]; if(k) keys[k]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouse.down=false; save(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
addEventListener('beforeunload',save);
function worldPt(cx,cy){ return {x:wrapX(camX+(cx-CW/2)/Z), y:camTop+cy/Z}; }
cv.addEventListener('pointerdown',e=>{
 const x=e.clientX, y=e.clientY;
 if(mode==='map'||mode==='title'){ if(mode==='map') mapClick(x,y); return; }
 if(mode!=='play'||modalOpen) return;
 if(placing){ tryPlace(); return; }
 const w=worldPt(x,y);
 let ore=null; for(const o of ps.ores){ if(Math.hypot(wd(o.x-w.x),oreY(o)-w.y)<o.r+8){ ore=o; break; } }
 if(ore){ mouse.down=true; mouse.ore=ore; return; }
 for(const b of ps.boxes){ if(Math.abs(wd(b.x-w.x))<20&&w.y>hAt(b.x)-30&&w.y<hAt(b.x)+4&&Math.abs(wd(b.x-P.x))<70){ openBox(b); return; } }
 shoot(w.x,w.y);
});
addEventListener('pointerup',()=>{ mouse.down=false; mouse.ore=null; });
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
document.querySelectorAll('#touch b').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{ e.preventDefault(); if(mode!=='play'||modalOpen) return; if(k==='e') interact(); else if(k==='q') autoShoot(); else { if(k==='jump') keys.jumpP=true; keys[k]=true; } });
 const up=()=>{ if(k!=='e'&&k!=='q') keys[k]=false; };
 b.addEventListener('pointerup',up); b.addEventListener('pointerleave',up); b.addEventListener('pointercancel',up);
});
$('btns').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(b) hudAct(b.dataset.a); });
$('globeBox').addEventListener('click',()=>hudAct('map'));
function hudAct(a){
 if(mode!=='play') return;
 if(a==='bag'){ openBag(); MCTX.bag=1; }
 else if(a==='build'){ placing=null; openBuild(); MCTX.build=1; }
 else if(a==='map'){ save(); openMap(); }
 else if(a==='dex') openDex('planet');
 else if(a==='speed'){ S.speed=S.speed===1?3:S.speed===3?6:1; toast(S.speed===1?'보통 빠르기':`행성이 ${S.speed}배 빨리 바뀌어!`); hud(); }
 else if(a==='sound'){ S.sound=!S.sound; hud(); }
}

// ================= 시작 =================
function startGame(fresh){
 if(fresh||!S){
  let nm=null; try{ nm=prompt('우주인 이름을 지어 줘!','우주인'); }catch(e){}
  S=newSave((nm&&nm.trim())?nm.trim().slice(0,12):'우주인'); TER={}; pid=null; ps=null; save();
 }
 $('title').style.display='none';
 if(S.cur&&S.pl[S.cur]){ arrive(S.cur); }
 else{ openMap(); toast('처음엔 제일 쉬운 <b>달</b>을 추천해! 행성을 눌러 봐',5000); }
}
$('bNew').onclick=()=>{ if(load()&&!confirm('처음부터 새로 할까? 지금까지 한 건 지워져.')) return; startGame(true); };
$('bCont').onclick=()=>startGame(false);
S=load();
if(S&&!S.inter){ for(const id of ORDER) if(S.pl[id]&&S.pl[id].ms&&S.pl[id].ms[100]) S.inter=1; }
if(S&&!S.fewBox){ S.fewBox=1; const lim={small:6,res:3,wreck:1}; for(const id in S.pl){ const s2=S.pl[id], cnt={}; s2.boxes=s2.boxes.filter(b=>{ if(b.op||!lim[b.k]) return true; cnt[b.k]=(cnt[b.k]||0)+1; return cnt[b.k]<=lim[b.k]; }); } save(); }
if(!S){ $('bCont').style.display='none'; }
resize();
requestAnimationFrame(loop);
</script>
<script src="../track.js" defer></script>
