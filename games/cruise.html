/* ---------------- 지도 화면 ---------------- */
let VW = 1600, VH = 900, sc = 1, ox = 0, oy = 0;
function mapFit() {
  sc = Math.min(cvW / VW, cvH / VH);
  ox = (cvW - VW * sc) / 2; oy = (cvH - VH * sc) / 2;
}
function toMap(px, py) { return {x: (px - ox) / sc, y: (py - oy) / sc}; }
function drawMap() {
  mapFit();
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, cvH);
  g.addColorStop(0, '#0a4a72'); g.addColorStop(1, '#062f4c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, cvW, cvH);
  ctx.translate(ox, oy); ctx.scale(sc, sc);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 3;
  for (let y = 40; y < VH; y += 46) {
    ctx.beginPath();
    for (let x = 0; x <= VW; x += 20) {
      const yy = y + Math.sin((x / 90) + S.t * 0.7 + y) * 4;
      x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
    }
    ctx.stroke();
  }
  for (const L of LANDS) {
    ctx.beginPath();
    L.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath();
    ctx.fillStyle = '#2f6b46'; ctx.fill();
    ctx.strokeStyle = '#8fd6a8'; ctx.lineWidth = 2.5; ctx.stroke();
  }
  for (const s of S.ships) {
    if (!s.from || !s.to) continue;
    ctx.strokeStyle = (s.id === S.drive) ? 'rgba(255,226,122,.75)' : 'rgba(255,255,255,.28)';
    ctx.lineWidth = 2; ctx.setLineDash([9, 9]);
    const A = portOf(s.from), B = portOf(s.to);
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke(); ctx.setLineDash([]);
  }
  if (S.storm) drawStorm(S.storm);
  for (const p of PORTS) drawPortDot(p);
  for (const s of S.ships) drawShipTop(s);
  for (const p of PORTS) drawPortLabel(p);          // 이름은 배 위에 (안 가려지게)
  ctx.textAlign = 'center'; ctx.font = 'bold 22px 맑은 고딕';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.fillStyle = '#04202f'; ctx.fillText(f.txt, f.x + 2, f.y + 2);
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // 안내
  ctx.save();
  ctx.textAlign = 'center'; ctx.font = 'bold 24px 맑은 고딕';
  const d = driven();
  ctx.fillStyle = '#04202f'; ctx.fillRect(cvW / 2 - 300, 10, 600, 44);
  ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 2; ctx.strokeRect(cvW / 2 - 300, 10, 600, 44);
  ctx.fillStyle = '#ffe27a';
  ctx.fillText(d && d.stage === 'dock' ? '갈 항구를 눌러! (M 이나 지도 버튼으로 닫기)'
                                       : '지금은 바다 위! (M 으로 돌아가기)', cvW / 2, 40);
  ctx.restore();
}
function drawStorm(st) {
  ctx.save();
  const gr = ctx.createRadialGradient(st.x, st.y, 10, st.x, st.y, st.r);
  gr.addColorStop(0, 'rgba(30,50,70,.75)'); gr.addColorStop(1, 'rgba(30,50,70,0)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(220,240,255,.5)'; ctx.lineWidth = 5;
  for (let a = 0; a < 3; a++) {
    ctx.beginPath();
    for (let q = 0; q < 5; q += .12) {
      const th = q + a * 2.1 + S.t * 1.5, rr = q * st.r / 5.2;
      const x = st.x + Math.cos(th) * rr, y = st.y + Math.sin(th) * rr * .8;
      q ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawPortDot(p) {
  const st = pState(p.id);
  ctx.save(); ctx.textAlign = 'center';
  if (!st.open) {
    ctx.globalAlpha = .55;
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.font = '20px 맑은 고딕'; ctx.fillText('🔒', p.x, p.y + 7);
    ctx.font = '15px 맑은 고딕'; ctx.fillStyle = '#cfe6f6'; ctx.fillText(p.name, p.x, p.y + 30);
    ctx.restore(); return;
  }
  ctx.fillStyle = '#7e5a3c'; ctx.fillRect(p.x - 20, p.y + 6, 40, 7);
  ctx.fillStyle = '#c9a227'; ctx.beginPath(); ctx.arc(p.x, p.y, 12 + p.size, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff5c0'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#e8f3ff';
  for (let i = 0; i < p.size; i++) ctx.fillRect(p.x - 20 + i * 11, p.y - 26 - (i % 2) * 8, 8, 20 + (i % 2) * 8);
  const d = driven();
  if (d && d.stage === 'dock' && d.from !== p.id) {
    ctx.strokeStyle = (S.t * 4 % 2 < 1) ? '#ffe27a' : '#ffffff';
    ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, 7); ctx.stroke();
  }
  ctx.restore();
}
function drawPortLabel(p) {
  const st = pState(p.id);
  if (!st.open) return;
  ctx.save(); ctx.textAlign = 'center';
  ctx.font = 'bold 17px 맑은 고딕';
  ctx.fillStyle = '#04202f'; ctx.fillText(p.name, p.x + 1, p.y + 40);
  ctx.fillStyle = '#ffffff'; ctx.fillText(p.name, p.x, p.y + 39);
  ctx.font = '14px 맑은 고딕'; ctx.fillStyle = '#bfe9ff';
  ctx.fillText('🧍' + Math.floor(st.pax) + '  📦' + Math.floor(st.crg), p.x, p.y + 57);
  if (st.lv > 0) { ctx.fillStyle = '#ffe27a'; ctx.fillText('★'.repeat(Math.min(5, st.lv)), p.x, p.y - 40); }
  ctx.restore();
}
function drawShipTop(s) {
  const t = spec(s);
  const L = 16 + Math.sqrt(t.cap) * 1.9, W = L * 0.42;
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.ang || 0);
  ctx.beginPath(); ctx.moveTo(L / 2, 0);
  ctx.lineTo(L / 6, -W / 2); ctx.lineTo(-L / 2, -W / 2);
  ctx.lineTo(-L / 2, W / 2); ctx.lineTo(L / 6, W / 2); ctx.closePath();
  ctx.fillStyle = t.hull; ctx.fill();
  ctx.strokeStyle = (s.id === S.drive) ? '#ffe27a' : '#0a2a3d';
  ctx.lineWidth = (s.id === S.drive) ? 3 : 1.6; ctx.stroke();
  if (t.kind === 'pax') { ctx.fillStyle = '#2e86c1'; ctx.fillRect(-L * .34, -W * .28, L * .5, W * .56); }
  else { ctx.fillStyle = '#e67e22'; ctx.fillRect(-L * .34, -W * .28, L * .5, W * .56); }
  ctx.restore();
  ctx.textAlign = 'center'; ctx.font = '13px 맑은 고딕';
  ctx.fillStyle = '#04202f'; ctx.fillText(s.name, s.x + 1, s.y - L / 2 - 5);
  ctx.fillStyle = (s.id === S.drive) ? '#ffe27a' : '#dff1ff';
  ctx.fillText(s.name, s.x, s.y - L / 2 - 6);
}

/* =========================================================================
   오른쪽 패널
   ========================================================================= */
let dirty = true;
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function buildList() {
  const box = $('list');
  if (!S.ships.length) {
    box.innerHTML = '<div class="card" style="text-align:center">아직 배가 없어!<br><br>' +
      '<b style="color:#ffe27a">🚢 조선소</b> 를 눌러<br>첫 배를 사 보자.</div>';
    dirty = false; return;
  }
  box.innerHTML = S.ships.map(s => {
    const t = spec(s), me = s.id === S.drive;
    return `<div class="card${me ? ' drive' : ''}">
      <div class="cname">${me ? '🕹️ ' : '🤖 '}${esc(s.name)} <small>${t.name}</small></div>
      <div class="croute" id="rt${s.id}"></div>
      <div class="bar"><i id="bar${s.id}"></i></div>
      <div class="croute" id="st${s.id}"></div>
      <div class="crow">
        ${me ? '' : `<button onclick="setDrive(${s.id})">🕹️ 타기</button>
                     <button onclick="autoRoute(${s.id})">🗺️ 항로</button>`}
        <button onclick="renameShip(${s.id})">✏️ 이름</button>
        <button onclick="openUp(${s.id})">⬆️ 고치기</button>
      </div>
    </div>`;
  }).join('');
  dirty = false;
}
function drawUI() {
  if (dirty) buildList();
  const oldEra = S.era === 'old';                    // 옛날 세계엔 조선소가 없다
  $('bYard').style.display = oldEra ? 'none' : '';
  $('bMake').textContent = oldEra ? '🔨 조선소 (내가 만들기)' : '🔨 배 만들기';
  $('bMake').classList.toggle('buy', oldEra);
  $('pMoney').textContent = won(S.money);
  $('pSub').textContent = rank() + ' · 배 ' + S.ships.length + '척 · 항구 ' +
    S.ports.filter(p => p.open).length + '곳 · 🧍' + num(S.totalPax);
  for (const s of S.ships) {
    const rt = $('rt' + s.id); if (!rt) continue;
    const me = s.id === S.drive, t = spec(s);
    rt.textContent = s.to ? (portOf(s.from).name + ' ➜ ' + portOf(s.to).name)
                          : (portOf(s.from).name + ' 에서 쉬는 중');
    const cap = shipCap(s), bar = $('bar' + s.id);
    if (s.stage === 'sail') {
      const p = me ? Math.min(1, s.pos / routeLen(portOf(s.from), portOf(s.to))) : s.prog;
      bar.style.width = (p * 100) + '%'; bar.className = '';
    } else { bar.style.width = (s.load / cap * 100) + '%'; bar.className = 'load'; }
    $('st' + s.id).textContent =
      (s.stage === 'sail' ? '🚢 바다 위' : s.stage === 'idle' ? '💤 항로가 없어' : '⏳ 싣는 중') +
      ' · ' + Math.floor(s.load) + '/' + cap + (t.kind === 'pax' ? '명' : '개') +
      ' · ' + won(s.earn);
  }
}

/* =========================================================================
   모달
   ========================================================================= */
function openModal(html) { builderOn = false; $('mbox').innerHTML = html; $('modal').style.display = 'flex'; }
function closeModal() { builderOn = false; $('modal').style.display = 'none'; }
/* 잠깐 다른 캔버스에 그리기 (배 만들기 미리보기용) */
function withCtx(c, fn) { const old = ctx; ctx = c; try { fn(); } finally { ctx = old; } }

function openYard() {
  if (S.era === 'old') { openBuilder(); return; }   // 옛날 세계엔 파는 배가 없다 — 직접 만든다
  const row = k => SHIPS.filter(t => t.kind === k).map(t => {
    const can = S.money >= t.price;
    return `<div class="item">
      <h3>${t.kind === 'pax' ? '🛳️' : '🚛'} ${t.name}</h3>
      <p>${t.kind === 'pax' ? '손님' : '짐'} ${num(t.cap)}${t.kind === 'pax' ? '명' : '개'}까지 · 빠르기 ${t.speed}</p>
      <p class="price">${won(t.price)}</p>
      <button class="buy" style="width:100%;margin-top:6px" ${can ? '' : 'disabled'}
        onclick="buyShip('${t.id}')">${can ? '사기' : '돈이 모자라'}</button></div>`;
  }).join('');
  openModal(`<button class="closex" onclick="closeModal()">✖ 닫기</button>
    <h2>🚢 조선소</h2>
    <p style="margin:0 0 6px">가진 돈: <b style="color:#ffe27a">${won(S.money)}</b>
      · 새로 산 배는 <b>알아서 다니며</b> 돈을 벌어줘. 타고 싶으면 <b>🕹️ 타기</b>!</p>
    <h3 style="color:#8fd4ff">손님을 태우는 배</h3><div class="grid">${row('pax')}</div>
    <h3 style="color:#ffd08a;margin-top:14px">짐을 나르는 배</h3><div class="grid">${row('cargo')}</div>`);
}

function openPorts() {
  const items = PORTS.map(p => {
    const st = pState(p.id);
    if (!st.open) {
      const can = S.money >= p.cost;
      return `<div class="item"><h3>🔒 ${p.name}</h3>
        <p>항구 크기 ${'★'.repeat(p.size)}</p><p>요금 ${Math.round(p.bonus * 100)}%</p>
        <p class="price">${won(p.cost)}</p>
        <button class="buy" style="width:100%;margin-top:6px" ${can ? '' : 'disabled'}
          onclick="openPort('${p.id}')">${can ? '항로 열기' : '돈이 모자라'}</button></div>`;
    }
    const c = portUpCost(p.id), can = S.money >= c;
    return `<div class="item"><h3>⚓ ${p.name} ${'★'.repeat(st.lv)}</h3>
      <p>기다리는 손님 ${Math.floor(st.pax)} / ${paxMax(p)}명</p>
      <p>쌓인 짐 ${Math.floor(st.crg)} / ${crgMax(p)}개</p>
      <p>요금 ${Math.round(p.bonus * 100)}%</p>
      <p class="price">확장 ${won(c)}</p>
      <button style="width:100%;margin-top:6px" ${can ? '' : 'disabled'}
        onclick="upPort('${p.id}')">${can ? '항구 넓히기' : '돈이 모자라'}</button></div>`;
  }).join('');
  openModal(`<button class="closex" onclick="closeModal()">✖ 닫기</button>
    <h2>🗺️ 항구</h2>
    <p style="margin:0 0 6px">항구를 넓히면 손님이 훨씬 빨리 모여! 가진 돈: <b style="color:#ffe27a">${won(S.money)}</b></p>
    <div class="grid">${items}</div>`);
}
function openPort(id) {
  const p = portOf(id);
  if (S.money < p.cost) return;
  S.money -= p.cost; const st = pState(id); st.open = true; st.pax = 15; st.crg = 8;
  toast(p.name + ' 항로를 열었다!'); openPorts(); save();
}
function upPort(id) {
  const c = portUpCost(id);
  if (S.money < c) return;
  S.money -= c; pState(id).lv++; openPorts(); save();
}
function openUp(sid) {
  const s = S.ships.find(v => v.id === sid); if (!s) return;
  const t = spec(s);
  const items = Object.keys(UPK).map(k => {
    const c = upCost(s, k), can = S.money >= c && s.up[k] < 10;
    const now = k === 'eng' ? '빠르기 ' + shipSpeed(s).toFixed(0)
      : k === 'room' ? '정원 ' + num(shipCap(s)) + (t.kind === 'pax' ? '명' : '개')
      : '요금 ' + Math.round((1 + s.up.serv * 0.14) * 100) + '%';
    return `<div class="item"><h3>${UPK[k]} Lv.${s.up[k]}</h3><p>지금: ${now}</p>
      <p class="price">${s.up[k] >= 10 ? '최고 단계!' : won(c)}</p>
      <button class="buy" style="width:100%;margin-top:6px" ${can ? '' : 'disabled'}
        onclick="doUp(${sid},'${k}')">${s.up[k] >= 10 ? '끝' : can ? '올리기' : '돈이 모자라'}</button></div>`;
  }).join('');
  const c = s.custom;
  const tune = c ? `<div class="bstat">🔧 <b>설계 고치기</b> (공짜!)
      &nbsp; 뱃머리
      <button onclick="tuneShip(${sid},'bowN',-5)">－</button>
      <span class="val">${c.bowN != null ? c.bowN : 0}</span>
      <button onclick="tuneShip(${sid},'bowN',5)">＋</button>
      <button class="chip" onclick="tuneShip(${sid},'bowN',-99)">0으로</button>
      &nbsp; 손님 타는 곳
      <button onclick="tuneShip(${sid},'dlen',-2)">－</button>
      <span class="val">${c.dlen != null ? c.dlen : c.len}</span>
      <button onclick="tuneShip(${sid},'dlen',2)">＋</button>
      <button class="chip" onclick="tuneShip(${sid},'dlen',99)">끝까지</button>
    </div>` : '';
  openModal(`<button class="closex" onclick="closeModal()">✖ 닫기</button>
    <h2>⬆️ ${esc(s.name)} 고치기</h2>
    <p style="margin:0 0 6px">${t.name} · ${s.trips}번 다녀와서 ${won(s.earn)} 벌었어</p>
    ${tune}
    <div class="grid">${items}</div>
    <div style="margin-top:12px">
      ${s.id === S.drive ? '' : `<button onclick="setDrive(${sid});closeModal()">🕹️ 이 배 타기</button> `}
      <button onclick="renameShip(${sid})">✏️ 이름 바꾸기</button>
      <button onclick="sellShip(${sid})">🗑️ 팔기 (${won(t.price * 0.5)})</button></div>`);
}
function doUp(sid, k) {
  const s = S.ships.find(v => v.id === sid); if (!s) return;
  const c = upCost(s, k);
  if (S.money < c || s.up[k] >= 10) return;
  S.money -= c; s.up[k]++; openUp(sid); save();
}
/* 이미 만든 배의 설계 고치기 (뱃머리 · 손님 타는 곳 길이) */
function tuneShip(sid, k, d) {
  const s = S.ships.find(v => v.id === sid); if (!s || !s.custom) return;
  const c = s.custom;
  const max = (k === 'bowN') ? 70 : c.len, min = (k === 'bowN') ? 0 : 1;
  const now = (c[k] == null) ? (k === 'bowN' ? 0 : c.len) : c[k];
  c[k] = Math.max(min, Math.min(max, now + d));
  dirty = true; save(); openUp(sid);
}
/* 배 이름 바꾸기 */
function renameShip(sid) {
  const s = S.ships.find(v => v.id === sid); if (!s) return;
  let nm = null;
  try { nm = window.prompt('새 이름을 지어줘!', s.name); } catch (e) {}
  if (nm === null) return;                       // 취소
  nm = (nm || '').trim();
  if (!nm) { toast('이름을 안 썼어!'); return; }
  const old = s.name;
  s.name = nm.slice(0, 14);
  dirty = true; save();
  toast('"' + old + '" ➜ "' + s.name + '" 로 바꿨어!');
  if ($('modal').style.display === 'flex') openUp(sid);   // 고치기 창이 열려 있으면 새로 그린다
}
function sellShip(sid) {
  const s = S.ships.find(v => v.id === sid); if (!s) return;
  if (!confirm(s.name + ' 을(를) 정말 팔까?')) return;
  S.money += spec(s).price * 0.5;
  S.ships = S.ships.filter(v => v.id !== sid);
  if (S.drive === sid) S.drive = S.ships.length ? S.ships[0].id : null;
  closeModal(); dirty = true; save();
}
function autoRoute(sid) {
  const s = S.ships.find(v => v.id === sid); if (!s) return;
  const open = S.ports.filter(p => p.open);
  const opts = open.map(p => `<option value="${p.id}">${portOf(p.id).name}</option>`).join('');
  openModal(`<button class="closex" onclick="closeModal()">✖ 닫기</button>
    <h2>🗺️ ${esc(s.name)} 항로 정하기</h2>
    <p>이 배는 정한 두 항구를 <b>혼자서 계속</b> 왔다 갔다 해!</p>
    <div style="font-size:18px;margin:10px 0">
      <select id="rA" style="font-size:18px;padding:6px">${opts}</select>
      &nbsp;➜&nbsp;
      <select id="rB" style="font-size:18px;padding:6px">${opts}</select>
    </div>
    <button class="buy" onclick="setRoute(${sid})">이걸로 하기</button>`);
  $('rA').value = s.from; if (s.to) $('rB').value = s.to;
  else $('rB').selectedIndex = Math.min(1, open.length - 1);
}
function setRoute(sid) {
  const s = S.ships.find(v => v.id === sid); if (!s) return;
  const a = $('rA').value, b = $('rB').value;
  if (a === b) { toast('다른 항구를 골라야 해!'); return; }
  s.from = a; s.to = b; s.stage = 'load'; s.load = 0; s.prog = 0;
  s.x = portOf(a).x; s.y = portOf(a).y;
  closeModal(); dirty = true; save();
}
/* =========================================================================
   🔨 내가 배 만들기
   ========================================================================= */
const HULLC = ['#ffffff','#ffe08a','#ff8fa3','#8de3c0','#7fc9ff','#c9a7ff','#ffab6b','#3d5a6c'];
let B = null, builderOn = false;
function openBuilder() {
  if (!B) B = {kind:'pax', len:8, decks:3, hull:'#ffffff', deck:2, funnels:3, fpos:2, bowN:0,
               rooms:['cabin','dining','cinema','shop'], pool:true, slide:true, heli:false};
  if (!B.deck) { B.deck = 2; B.funnels = 3; B.fpos = 2; }
  if (!B.bow) B.bow = 2;
  if (S.era === 'old') B.rooms = B.rooms.filter(r => ROOMS_OLD.indexOf(r) >= 0);
  if (!B.rooms.length) B.rooms = ['cabin', 'dining'];
  const sw = HULLC.map((c, i) =>
    `<button class="sw" id="sw${i}" style="background:${c}" onclick="bColor('${c}')"></button>`).join('');
  const rm = ROOMS.map(r =>
    `<button class="chip" id="rm_${r}" onclick="bRoom('${r}')">${ROOM_NAME[r]}</button>`).join('');
  openModal(`<button class="closex" onclick="closeModal()">✖ 닫기</button>
    <h2>🔨 내 배 만들기</h2>
    ${S.era === 'old' ? '<p style="margin:0 0 8px;color:#ffe27a">🕰️ 1900년대엔 파는 배가 없어 — <b>처음부터 끝까지 네가 만든다!</b></p>' : ''}
    <canvas id="pv" width="820" height="400"></canvas>
    <div class="brow"><b>종류</b>
      <button class="chip" id="ck_pax" onclick="bKind('pax')">🛳️ 유람선(손님)</button>
      <button class="chip" id="ck_cargo" onclick="bKind('cargo')">🚛 화물선(짐)</button></div>
    <div class="brow"><b>길이</b>
      <button onclick="bAdj('len',-5)">◀◀</button>
      <button onclick="bAdj('len',-1)">－</button><span class="val" id="bv_len"></span>
      <button onclick="bAdj('len',1)">＋</button>
      <button onclick="bAdj('len',5)">▶▶</button>
      <small style="color:#9fd0ee" id="blenmax">(1~20)</small>
      &nbsp;&nbsp;<b id="blab">층수</b>
      <button onclick="bAdj('decks',-1)">－</button><span class="val" id="bv_decks"></span>
      <button onclick="bAdj('decks',1)">＋</button></div>
    <div class="brow"><b>손님 타는 곳</b>
      <button onclick="bAdj('dlen',-5)">◀◀</button>
      <button onclick="bAdj('dlen',-1)">－</button><span class="val" id="bv_dlen"></span>
      <button onclick="bAdj('dlen',1)">＋</button>
      <button onclick="bAdj('dlen',5)">▶▶</button>
      <button class="chip" onclick="bSet('dlen',B.len)">배 끝에서 끝까지!</button>
      <small style="color:#9fd0ee" id="bdmax"></small></div>
    <div class="brow"><b>뱃머리</b>
      <button onclick="bAdj('bowN',-5)">◀◀</button>
      <button onclick="bAdj('bowN',-1)">－</button><span class="val" id="bv_bowN"></span>
      <button onclick="bAdj('bowN',1)">＋</button>
      <button onclick="bAdj('bowN',5)">▶▶</button>
      <small style="color:#9fd0ee">앞의 뾰족한 부분 (0~70)</small></div>
    <div class="brow" id="brow_fun"><b>굴뚝</b>
      <button onclick="bAdj('funnels',-1)">－</button><span class="val" id="bv_funnels"></span>
      <button onclick="bAdj('funnels',1)">＋</button>
      <button class="chip" id="fp1" onclick="bSet('fpos',1)">뒤쪽</button>
      <button class="chip" id="fp2" onclick="bSet('fpos',2)">가운데</button>
      <button class="chip" id="fp3" onclick="bSet('fpos',3)">앞쪽</button>
      <span style="color:#ffe27a;font-weight:bold">👆 위 그림에서 굴뚝을 마우스로 끌어 봐!</span></div>
    <div class="brow"><b>색깔</b> ${sw}</div>
    <div class="brow" id="brow_rooms"><b>방</b> ${rm}</div>
    <div class="brow" id="brow_opt"><b>꾸미기</b>
      <button class="chip" id="op_pool" onclick="bOpt('pool')">🏊 수영장</button>
      <button class="chip" id="op_slide" onclick="bOpt('slide')">미끄럼틀</button>
      <button class="chip" id="op_heli" onclick="bOpt('heli')">헬기장</button></div>
    <div class="brow"><b>이름</b>
      <input id="bname" maxlength="14" placeholder="배 이름을 지어줘!" oninput="refreshBuilder()"></div>
    <div class="bstat" id="bstat"></div>
    <button class="buy" id="bmake" style="width:100%;font-size:19px;padding:12px"
      onclick="buildIt()">이 배 만들기</button>`);
  builderOn = true;
  refreshBuilder();
  bindFunnelDrag();
}
function bKind(k) { B.kind = k; if (k === 'cargo') B.decks = Math.min(B.decks, 6); refreshBuilder(); }
function bSet(k, v) {
  B[k] = v;
  if (k === 'fpos') B.fx = evenFx(B.funnels, v);      // 미리 정해진 자리로
  refreshBuilder();
}
function bColor(c) { B.hull = c; refreshBuilder(); }
function bOpt(o) { B[o] = !B[o]; refreshBuilder(); }
function bRoom(r) {
  const i = B.rooms.indexOf(r);
  if (i >= 0) { if (B.rooms.length > 1) B.rooms.splice(i, 1); }
  else B.rooms.push(r);
  refreshBuilder();
}
function bAdj(k, d) {
  const max = (k === 'len') ? maxLen() : (k === 'dlen') ? B.len
            : (k === 'bowN') ? 70 : (k === 'funnels') ? 6 : (B.kind === 'pax' ? 9 : 6);
  if (k === 'len' && Math.abs(d) === 5 && max > 20) d = d * 2;   // 50까지는 10칸씩
  const min = (k === 'bowN') ? 0 : 1;
  const before = B[k] == null ? min : B[k];
  B[k] = Math.max(min, Math.min(max, before + d));
  if (k === 'funnels') B.fx = evenFx(B.funnels, B.fpos || 2);
  if (k === 'len' && before > 0) {                 // 배가 길어지면 객실도 같은 비율로
    B.dlen = Math.max(1, Math.min(B.len, Math.round((B.dlen || before) * B.len / before)));
  }
  refreshBuilder();
}
function refreshBuilder() {
  if (!$('bv_len')) return;
  if (!B.fx || B.fx.length !== B.funnels) B.fx = evenFx(B.funnels, B.fpos || 2);
  B.len = Math.min(B.len, maxLen());
  if (B.dlen == null) B.dlen = Math.max(1, Math.round(B.len * 0.7));
  B.dlen = Math.max(1, Math.min(B.len, B.dlen));
  if (B.bowN == null) B.bowN = 0;        // 내가 만드는 배도 처음엔 보통 뱃머리
  $('bv_len').textContent = B.len;
  $('blenmax').textContent = '(1~' + maxLen() + ')';
  $('bv_dlen').textContent = B.dlen;
  $('bdmax').textContent = '(1~' + B.len + ' · 배 길이만큼)';
  $('bv_bowN').textContent = B.bowN;
  $('bv_decks').textContent = B.decks;
  $('blab').textContent = B.kind === 'pax' ? '층수' : '컨테이너 단수';
  $('ck_pax').classList.toggle('on', B.kind === 'pax');
  $('ck_cargo').classList.toggle('on', B.kind === 'cargo');
  HULLC.forEach((c, i) => $('sw' + i).classList.toggle('on', c === B.hull));
  const oldEra = S.era === 'old';
  ROOMS.forEach(r => {
    const b = $('rm_' + r);
    b.classList.toggle('on', B.rooms.indexOf(r) >= 0);
    b.style.display = (oldEra && ROOMS_OLD.indexOf(r) < 0) ? 'none' : '';   // 옛날엔 없는 방
  });
  ['pool','slide','heli'].forEach(o => $('op_' + o).classList.toggle('on', !!B[o]));
  [1,2,3].forEach(i => $('fp' + i).classList.toggle('on', B.fpos === i));
  $('bv_funnels').textContent = B.funnels;
  $('brow_fun').style.display = (oldEra && B.kind === 'pax') ? 'flex' : 'none';
  $('brow_rooms').style.display = B.kind === 'pax' ? 'flex' : 'none';
  $('brow_opt').style.display = (B.kind === 'pax' && !oldEra) ? 'flex' : 'none';
  const t = customSpec(B), can = S.money >= t.price;
  $('bstat').innerHTML =
    (B.kind === 'pax' ? '🧍 손님 ' : '📦 짐 ') + '<b>' + num(t.cap) + (B.kind === 'pax' ? '명' : '개') + '</b>' +
    ' · 빠르기 <b>' + t.speed.toFixed(0) + '</b>' +
    (B.kind === 'pax' ? ' · 요금 <b>' + Math.round(t.fare * 100) + '%</b>' : '') +
    ' · 값 <b style="color:' + (can ? '#8dffb0' : '#ff8a80') + '">' + won(t.price) + '</b>' +
    '<br><span style="font-size:13px;color:#9fd0ee">가진 돈 ' + won(S.money) + '</span>';
  const mk = $('bmake');
  mk.disabled = !can; mk.textContent = can ? '이 배 만들기' : '돈이 모자라';
  drawPreview();
}
function drawPreview() {
  const pv = $('pv'); if (!pv) return;
  const p = pv.getContext('2d');
  const g = p.createLinearGradient(0, 0, 0, pv.height);
  g.addColorStop(0, '#8fd4ff'); g.addColorStop(.74, '#cfeeff');
  g.addColorStop(.741, '#2aa3d6'); g.addColorStop(1, '#0a4a72');
  p.fillStyle = g; p.fillRect(0, 0, pv.width, pv.height);
  const t = customSpec(B);
  const fake = {id: -1, type: 'custom', custom: B, name: ($('bname') ? $('bname').value : '') || '내 배',
    load: t.cap * 0.7, stage: 'dock', v: 0, mood: 100, up: {eng: 0, room: 0, serv: 0}};
  const k = Math.min((pv.width * 0.94) / (hullW(t) * (1 + 2 * ((B.bowN || 0) / 100)) + 40),
                     (pv.height * 0.8) / shipH(t));
  withCtx(p, () => {
    p.save(); p.translate(pv.width / 2, pv.height * 0.74); p.scale(k, k);
    if (B.kind === 'pax') drawCruiseCut(fake); else drawCargoCut(fake);
    p.restore();
  });
  pvGeom = {cx: pv.width / 2, cy: pv.height * 0.74, k: k, top: lastTop};
  // 굴뚝 잡는 곳 표시 (끌 수 있다고 알려 주기)
  if (S.era === 'old' && B.kind === 'pax' && pvGeom.top) {
    p.save();
    B.fx.forEach(fr => {
      const x = pvGeom.cx + (pvGeom.top.tr + pvGeom.top.tw * fr) * k;
      const y = pvGeom.cy + (pvGeom.top.topY - 40) * k;
      p.strokeStyle = 'rgba(255,226,122,.95)'; p.lineWidth = 2;
      p.beginPath(); p.arc(x, y, 13, 0, 7); p.stroke();
      p.fillStyle = 'rgba(255,226,122,.95)'; p.font = 'bold 13px 맑은 고딕'; p.textAlign = 'center';
      p.fillText('↔', x, y + 5);
    });
    p.restore();
  }
}
let pvGeom = null;
/* 미리보기에서 굴뚝을 마우스로 끌기 */
function bindFunnelDrag() {
  const pv = $('pv'); if (!pv) return;
  let drag = -1;
  const frac = e => {
    if (!pvGeom || !pvGeom.top) return null;
    const r = pv.getBoundingClientRect();
    const sx = (e.clientX - r.left) * pv.width / r.width;
    const shipX = (sx - pvGeom.cx) / pvGeom.k;
    return Math.max(0.02, Math.min(0.98, (shipX - pvGeom.top.tr) / pvGeom.top.tw));
  };
  pv.style.cursor = (S.era === 'old' && B.kind === 'pax') ? 'ew-resize' : 'default';
  pv.addEventListener('pointerdown', e => {
    if (S.era !== 'old' || B.kind !== 'pax') return;
    const f = frac(e); if (f === null) return;
    let best = -1, bd = 9;
    B.fx.forEach((v, i) => { const d = Math.abs(v - f); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) {
      drag = best; B.fx[drag] = f; refreshBuilder();
      try { pv.setPointerCapture(e.pointerId); } catch (er) {}
      e.preventDefault();
    }
  });
  pv.addEventListener('pointermove', e => {
    if (drag < 0) return;
    const f = frac(e); if (f === null) return;
    B.fx[drag] = f; refreshBuilder();
  });
  pv.addEventListener('pointerup', () => { drag = -1; });
  pv.addEventListener('pointercancel', () => { drag = -1; });
}
function buildIt() {
  if (S.era === 'old') { B.pool = false; B.slide = false; B.heli = false; }  // 1900년대엔 없던 것
  const t = customSpec(B);
  if (S.money < t.price) { toast('돈이 모자라!'); return; }
  let nm = ($('bname') ? $('bname').value : '').trim();
  if (!nm) nm = '내 배 ' + S.nextId + '호';
  S.money -= t.price;
  const home = S.ports.find(p => p.open);
  const sh = {
    id: S.nextId++, type: 'custom', custom: JSON.parse(JSON.stringify(B)), name: nm.slice(0, 14),
    from: home.id, to: null, stage: 'dock', load: 0, prog: 0, wait: 0,
    x: portOf(home.id).x, y: portOf(home.id).y, ang: 0,
    up: {eng: 0, room: 0, serv: 0}, trips: 0, earn: 0, pos: 0, v: 0, mood: 100,
  };
  S.ships.push(sh);
  if (S.drive === null) S.drive = sh.id;
  builderOn = false; closeModal(); dirty = true; save();
  toast(nm + ' 완성! 🎉');
}

      자판: <b>← →</b> 조종 · <b>스페이스</b> 뱃고동/출발 · <b>M</b> 지도 · <b>ESC</b> 닫기
    </div>`);
}
function resetAll() {
  if (!confirm('진짜 처음부터 다시 할까? 지금 배들은 다 없어져!')) return;
  const era = S.era;
  localStorage.removeItem(saveKey(era));
  S = newGame(); S.era = era; view = 'sail'; dirty = true; closeModal();
}

/* =========================================================================
   🏠 플레이 창 · 💾 저장 · 🕰️ 옛날배 모드
   ========================================================================= */
let startOn = true, pickedEra = 'now';
function saveNow() { save(); toast('💾 저장했어! 껐다 켜도 그대로야'); }
function pickEra(e) {
  pickedEra = e;
  $('mNow').classList.toggle('on', e === 'now');
  $('mOld').classList.toggle('on', e === 'old');
  pickInfo();
  drawEraPreview();
}
function openStart() {
  pickedEra = (S && S.era) || 'now';
  $('start').style.display = 'flex';
  startOn = true;
  pickEra(pickedEra);
}
function pickInfo() {                      // 고른 세계의 상태를 버튼에 보여 준다
  ['now', 'old'].forEach(e => {
    const el = $('wi' + e); if (!el) return;
    const w = worldInfo(e);
    el.innerHTML = w
      ? '💾 <b>이어할 수 있어</b> · 배 ' + w.ships + '척 · ' + won(w.money)
      : '✨ 새 세계 (아직 아무것도 없어)';
  });
  const w = worldInfo(pickedEra);
  $('btnCont').style.display = w ? '' : 'none';
  $('btnCont').textContent = '⏩ 이 세계 이어하기';
}
function startPlay() {
  const w = worldInfo(pickedEra);
  if (w && w.ships &&
      !confirm('이 세계를 처음부터 다시 시작할까? 배 ' + w.ships + '척이 없어져!')) return;
  S = newGame(); S.era = pickedEra;
  view = 'sail'; dirty = true; startOn = false;
  $('start').style.display = 'none';
  save();
  toast(pickedEra === 'old' ? '🕰️ 1900년대 바다에 온 걸 환영해!' : '🛳️ 출항 준비 완료!');
}
function continueGame() {
  const w = loadWorld(pickedEra);
  if (!w) { startPlay(); return; }
  S = w;
  startOn = false; $('start').style.display = 'none'; view = 'sail'; dirty = true;
  toast(pickedEra === 'old' ? '🕰️ 옛날 바다로 돌아왔어!' : '🛳️ 다시 왔어!');
}
/* 플레이 창의 작은 배 그림 두 개 */
function drawEraPreview() {
  [['pvNow', 'now'], ['pvOld', 'old']].forEach(([id, era]) => {
    const cvs = $(id); if (!cvs) return;
    const p = cvs.getContext('2d');
    const g = p.createLinearGradient(0, 0, 0, cvs.height);
    g.addColorStop(0, era === 'old' ? '#cbb994' : '#8fd4ff');
    g.addColorStop(.72, era === 'old' ? '#e8dcc0' : '#cfeeff');
    g.addColorStop(.721, era === 'old' ? '#6f7e86' : '#2aa3d6');
    g.addColorStop(1, era === 'old' ? '#3d4a52' : '#0a4a72');
    p.fillStyle = g; p.fillRect(0, 0, cvs.width, cvs.height);
    const fake = {id: -2, type: 'p4', name: era === 'old' ? '1900' : '2026',
      load: 200, stage: 'dock', v: 0, mood: 100, up: {eng: 0, room: 0, serv: 0}};
    const t = spec(fake);
    const k = Math.min((cvs.width * 0.92) / hullW(t), (cvs.height * 0.78) / shipH(t));
    const keep = S ? S.era : 'now';
    if (S) S.era = era;
    withCtx(p, () => {
      p.save(); p.translate(cvs.width / 2, cvs.height * 0.74); p.scale(k, k);
      drawCruiseCut(fake); p.restore();
    });
    if (S) S.era = keep;
  });
}
let toastMsg = null;
function toast(t) { toastMsg = {t: t, life: 2.4}; }

/* =========================================================================
   조작
   ========================================================================= */
function toggleMap() { view = (view === 'map') ? 'sail' : 'map'; }
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); view = 'sail'; return; }
  if ($('modal').style.display === 'flex') return;
  if (e.key === 'ArrowRight') { keys.right = true; startSail(); e.preventDefault(); }
  if (e.key === 'ArrowLeft')  { keys.left = true; e.preventDefault(); }
  if (e.key === ' ') { horn(); startSail(); e.preventDefault(); }
  if (e.key === 'm' || e.key === 'M' || e.key === 'ㅡ') toggleMap();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'ArrowLeft') keys.left = false;
});
function startSail() {
  const s = driven();
  if (!s || s.stage !== 'dock') return;
  if (!s.to) { toast('먼저 지도(M)에서 갈 항구를 골라!'); view = 'map'; return; }
  if (s.load < 1) { toast('아직 손님이 안 탔어! 조금만 기다려'); return; }
  s.stage = 'sail'; s.pos = 0; s.v = 0; s.load = Math.floor(s.load); s.mood = 100; s.tilt = 0;
  // 10번에 1번은 항해 중간에 아주 강한 폭풍우를 만난다
  if (Math.random() < 0.10) {
    const a = 0.28 + Math.random() * 0.34;
    s.big = {a: a, b: a + 0.2};
    toast('📻 무전: 앞바다에 아주 강한 폭풍우가 있대!');
  } else s.big = null;
  s.braved = false;
  view = 'sail'; dirty = true;
}
cv.addEventListener('wheel', e => {
  if (view !== 'sail') return;
  const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY)) ? e.deltaX : e.deltaY;
  camScroll(-d * 0.9);
  e.preventDefault();
}, {passive: false});

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  if (view !== 'map') return;
  const m = toMap(e.clientX - r.left, e.clientY - r.top);
  let hit = null;
  for (const p of PORTS) if (Math.hypot(p.x - m.x, p.y - m.y) < 30) hit = p;
  if (!hit) return;
  if (!pState(hit.id).open) { toast(hit.name + '은(는) 아직 안 열렸어! 🗺️ 항구 에서 열어줘'); return; }
  const s = driven();
  if (!s) return;
  if (s.stage !== 'dock') { toast('바다 위라 지금은 못 바꿔!'); return; }
  if (hit.id === s.from) { toast('지금 있는 항구야!'); return; }
  s.to = hit.id;
  toast(hit.name + '(으)로 가자! → 를 눌러 출발');
  view = 'sail'; dirty = true; save();
});

/* 뱃고동 */
let actx = null;
function horn() {
  const s = driven(); if (!s) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 105;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 1.1);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 1.15);
  } catch (e) {}
  s.mood = Math.min(100, s.mood + 6);      // 손님들이 좋아한다
  hornAt = S.t;
}
let hornAt = -99;

/* =========================================================================
   저장 / 시작
   ========================================================================= */
function save() { try { localStorage.setItem(saveKey(S.era), JSON.stringify(S)); } catch (e) {} }
/* 세계 하나 불러오기 (없으면 null) */
function loadWorld(era) {
  try {
    let raw = localStorage.getItem(saveKey(era));
    if (!raw && era !== 'old') raw = localStorage.getItem(SAVE_KEY);   // 예전 저장 이어받기
    if (!raw) return null;
    const d = JSON.parse(raw); if (!d || !d.ports) return null;
    const W2 = Object.assign(newGame(), d);
    W2.era = era;
    for (const p of PORTS) if (!W2.ports.find(x => x.id === p.id))
      W2.ports.push({id: p.id, lv: 0, open: p.cost === 0, pax: 0, crg: 0});
    for (const s of W2.ships) {
      s.up = Object.assign({eng: 0, room: 0, serv: 0}, s.up || {});
      if (s.mood === undefined) s.mood = 100;
      if (s.pos === undefined) { s.pos = 0; s.v = 0; }
      s.tilt = 0; delete s.sink; delete s.big;      // 침몰 도중에 껐어도 되살아난다
      if (s.custom) {                               // 예전 설계도를 새 눈금으로
        const c = s.custom;
        if (c.dlen == null) c.dlen = Math.max(1, Math.round(c.len * OLDDECK[(c.deck || 2) - 1]));
        if (c.bowN == null) c.bowN = Math.round(BOWLEN[(c.bow || 2) - 1] * 100);
      }
    }
    return W2;
  } catch (e) { return null; }
}
/* 플레이 창에 보여 줄 세계 요약 */
function worldInfo(era) {
  const w = loadWorld(era);
  if (!w || !w.ships) return null;
  return {money: w.money, ships: w.ships.length,
          ports: w.ports.filter(p => p.open).length, earn: w.totalEarn};
}

S = loadWorld('now') || newGame();
resize();
openStart();                              // 처음엔 플레이 창부터
let last = performance.now(), saveT = 0;
function loop(now) {
  // 어디선가 잘못돼도 게임이 아예 멈추지 않게 감싼다
  try { frame(now); } catch (e) {
    console.error(e);
    toast('앗! 뭔가 꼬였어 (그래도 계속할 수 있어)');
    const s = driven();                 // 흔한 원인: 갈 곳이 없는데 바다 위인 상태
    if (s && (!s.to || !s.from)) { s.stage = 'dock'; s.pos = 0; s.v = 0; }
    view = 'sail'; last = performance.now();
  }
  requestAnimationFrame(loop);
}
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  if (startOn) { S.t += dt; drawEraPreview(); return; }   // 플레이 창이 떠 있으면 잠깐 멈춤
  step(dt);
  if (lastPay) { lastPay.life -= dt; if (lastPay.life <= 0) lastPay = null; }
  if (sunkMsg) { sunkMsg.life -= dt; if (sunkMsg.life <= 0) sunkMsg = null; }
  if (view === 'map') drawMap(); else drawSail();
  // 뱃고동 표시
  if (S.t - hornAt < 1.2 && view === 'sail') {
    ctx.save(); ctx.textAlign = 'center'; ctx.font = 'bold 40px 맑은 고딕';
    ctx.globalAlpha = 1 - (S.t - hornAt) / 1.2;
    ctx.fillStyle = '#ffe27a'; ctx.fillText('🎺 뿌우~~', cvW / 2, cvH * 0.28);
    ctx.restore();
  }
  if (toastMsg) {
    toastMsg.life -= dt;
    if (toastMsg.life <= 0) toastMsg = null;
    else {
      ctx.save(); ctx.globalAlpha = Math.min(1, toastMsg.life);
      ctx.textAlign = 'center'; ctx.font = 'bold 22px 맑은 고딕';
      const w = ctx.measureText(toastMsg.t).width + 40;
      ctx.fillStyle = '#0b3a58ee'; ctx.fillRect(cvW / 2 - w / 2, cvH - 96, w, 44);
      ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 2;
      ctx.strokeRect(cvW / 2 - w / 2, cvH - 96, w, 44);
      ctx.fillStyle = '#ffe27a'; ctx.fillText(toastMsg.t, cvW / 2, cvH - 66);
      ctx.restore();
    }
  }
  drawUI();
  if (builderOn) drawPreview();            // 만드는 중인 배도 살아 움직인다
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
}
requestAnimationFrame(loop);
</script>
