<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>바다 회사 - 유람선 조종 게임</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
    background:#06283d; color:#eaf6ff;
    font-family:"맑은 고딕","Malgun Gothic",sans-serif; user-select:none; }
  #wrap { display:flex; width:100%; height:100%; }
  #left { flex:1; position:relative; min-width:0; }
  #cv { display:block; width:100%; height:100%; }

  #right { width:330px; background:#08304b; border-left:3px solid #14587f;
    display:flex; flex-direction:column; }
  #rtop { padding:10px 12px; border-bottom:2px solid #14587f; }
  .money { font-size:25px; color:#ffe27a; font-weight:bold; }
  .sub { font-size:13px; color:#9fd0ee; margin-top:3px; }
  #btns { display:flex; gap:6px; padding:8px 10px; flex-wrap:wrap; }
  button { font-family:inherit; font-size:14px; padding:8px 10px; border-radius:9px;
    border:2px solid #2b83b8; background:#0e4a70; color:#eaf6ff; cursor:pointer; }
  button:hover { background:#16638f; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .big { flex:1; font-weight:bold; font-size:15px; }
  .buy { background:#146b3a; border-color:#2ecc71; }
  .buy:hover { background:#1c8d4d; }
  #list { flex:1; overflow-y:auto; padding:6px 10px 14px; }
  .card { background:#0c3f61; border:2px solid #1d6d9c; border-radius:11px;
    padding:8px 10px; margin-bottom:8px; }
  .card.drive { border-color:#ffe27a; box-shadow:0 0 0 2px #ffe27a44; }
  .cname { font-size:16px; font-weight:bold; }
  .cname small { font-size:12px; color:#9fd0ee; font-weight:normal; }
  .croute { font-size:13px; color:#c8e8ff; margin:3px 0; }
  .bar { height:9px; background:#062a41; border-radius:5px; overflow:hidden; margin:5px 0; }
  .bar i { display:block; height:100%; background:#41c9ff; width:0%; }
  .bar i.load { background:#ffd75e; }
  .crow { display:flex; gap:5px; margin-top:5px; }
  .crow button { flex:1; padding:5px 2px; font-size:12px; }
  #hint { padding:6px 12px; font-size:12px; color:#8fc3e4; border-top:1px solid #14587f; }

  #modal { position:fixed; inset:0; background:#02141fdd; display:none;
    align-items:center; justify-content:center; z-index:50; }
  #mbox { background:#0a3a58; border:3px solid #2b83b8; border-radius:16px;
    padding:16px 18px; max-width:920px; max-height:88%; overflow-y:auto; min-width:430px; }
  #mbox h2 { margin:0 0 10px; font-size:24px; color:#ffe27a; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
  .item { background:#0c3f61; border:2px solid #1d6d9c; border-radius:12px; padding:10px; }
  .item h3 { margin:0 0 4px; font-size:17px; }
  .item p { margin:2px 0; font-size:13px; color:#c8e8ff; }
  .price { color:#ffe27a; font-weight:bold; font-size:15px; }
  .closex { float:right; }

  /* ---------- 배 만들기 ---------- */
  .brow { display:flex; align-items:center; gap:6px; margin:8px 0; flex-wrap:wrap; font-size:15px; }
  .brow > b { min-width:56px; color:#9fd0ee; }
  .chip { padding:6px 10px; font-size:14px; opacity:.5; }
  .chip.on { opacity:1; background:#146b3a; border-color:#2ecc71; font-weight:bold; }
  .sw { width:30px; height:30px; border-radius:8px; border:3px solid #2b83b8; cursor:pointer; padding:0; }
  .sw.on { border-color:#ffe27a; box-shadow:0 0 0 3px #ffe27a55; }
  .val { display:inline-block; min-width:28px; text-align:center; font-size:20px;
         font-weight:bold; color:#ffe27a; }
  .bstat { background:#0c3f61; border:2px solid #1d6d9c; border-radius:10px;
           padding:8px 10px; margin:8px 0; font-size:16px; }
  #bname { font-family:inherit; font-size:16px; padding:6px 10px; border-radius:8px;
           border:2px solid #2b83b8; background:#0c3f61; color:#eaf6ff; width:220px; }
  #pv { width:100%; border-radius:12px; display:block; }

  /* ---------- 플레이 창 (시작 화면) ---------- */
  #start { position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 35%, #0d5c8a, #041d2e 70%); }
  #sbox { text-align:center; max-width:760px; padding:20px; }
  #sbox h1 { font-size:52px; margin:0 0 4px; color:#ffe27a; text-shadow:0 4px 0 #04202f; }
  #sbox .sub2 { font-size:18px; color:#bfe8ff; margin-bottom:20px; }
  .modes { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
  .mbtn { width:290px; padding:14px; border-radius:16px; border:3px solid #2b83b8;
    background:#0c3f61; color:#eaf6ff; cursor:pointer; font-size:15px; line-height:1.5; }
  .mbtn b { font-size:21px; color:#fff; }
  .mbtn small { color:#9fd0ee; }
  .mbtn.on { border-color:#ffe27a; background:#15577f; box-shadow:0 0 0 4px #ffe27a44; }
  .mbtn canvas { width:100%; height:96px; display:block; margin:8px 0 4px; border-radius:10px; }
  .winfo { margin-top:8px; padding:6px; border-radius:8px; background:#06283d;
    font-size:13px; color:#ffe27a; }
  #sbox .go { font-size:24px; padding:14px 40px; font-weight:bold; }
  #sbox .small2 { font-size:13px; color:#8fc3e4; margin-top:14px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="left"><canvas id="cv"></canvas></div>

  <div id="right">
    <div id="rtop">
      <div class="money" id="pMoney">0원</div>
      <div class="sub" id="pSub"></div>
    </div>
    <div id="btns">
      <button class="big buy" id="bYard" onclick="openYard()">🚢 조선소</button>
      <button class="big" id="bMake" onclick="openBuilder()">🔨 배 만들기</button>
      <button class="big" onclick="openPorts()">🗺️ 항구</button>
      <button onclick="toggleMap()">🧭 지도</button>
      <button class="buy" onclick="saveNow()">💾 저장</button>
      <button onclick="openStart()">🏠 플레이 창</button>
      <button onclick="openHelp()">❓ 도움말</button>
    </div>
    <div id="list"></div>
    <div id="hint">← → 로 배를 몰고, <b>스페이스</b>는 뱃고동! 파도가 크면 천천히 가야 손님이 안 어지러워.</div>
  </div>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()"><div id="mbox"></div></div>

<div id="start"><div id="sbox">
  <h1>🚢 바다 회사</h1>
  <div class="sub2">손님을 태우고 바다를 건너 돈을 버는 게임</div>
  <div class="modes">
    <button class="mbtn" id="mNow" onclick="pickEra('now')">
      <b>🛳️ 현대 배</b><canvas id="pvNow" width="380" height="150"></canvas>
      <small>지금 다니는 크루즈 · 컨테이너선<br>수영장 · 미끄럼틀 · 레이더</small>
      <div class="winfo" id="winow"></div></button>
    <button class="mbtn" id="mOld" onclick="pickEra('old')">
      <b>🕰️ 옛날배 (1900년대)</b><canvas id="pvOld" width="380" height="150"></canvas>
      <small>굴뚝 여러 개 · 높은 돛대 · 석탄 보일러<br>나무 구명정 · 갑판 의자</small>
      <div class="winfo" id="wiold"></div></button>
  </div>
  <div class="sub2" style="font-size:15px">두 세계는 <b>따로따로 저장</b>돼 — 돈도 배도 각각!</div>
  <button class="buy go" onclick="startPlay()">▶ 새로 시작!</button>
  <button class="go" id="btnCont" onclick="continueGame()">⏩ 이어하기</button>
  <div class="small2">← → 로 배를 몰고 · M 지도 · 스페이스 뱃고동</div>
</div></div>

<script>
"use strict";
/* =========================================================================
   바다 회사 — 옆에서 보며 직접 모는 유람선 게임
   · 내가 탄 배: ← → 로 조종, 손님이 배 안에서 돌아다니는 게 보인다
   · 번 돈으로 새 배를 사면 그 배들은 알아서 다니며 돈을 벌어 준다
   ========================================================================= */

/* ---------------- 배 종류 ---------------- */
const SHIPS = [
  {id:'p1', kind:'pax',   name:'통통배 유람선',   cap:12,   speed:26, price:3e7,   fuel:0.25, decks:1, len:2,  hull:'#f2f6fa'},
  {id:'p2', kind:'pax',   name:'작은 유람선',     cap:40,   speed:30, price:1.2e8, fuel:0.8,  decks:2, len:4,  hull:'#f2f6fa'},
  {id:'p3', kind:'pax',   name:'여객선(페리)',    cap:120,  speed:34, price:4.5e8, fuel:2,    decks:3, len:6,  hull:'#eef4fb'},
  {id:'p4', kind:'pax',   name:'크루즈',          cap:400,  speed:38, price:1.8e9, fuel:6,    decks:4, len:10, hull:'#ffffff'},
  {id:'p5', kind:'pax',   name:'대형 크루즈',     cap:1200, speed:42, price:8e9,   fuel:16,   decks:5, len:15, hull:'#ffffff'},
  {id:'p6', kind:'pax',   name:'초호화 크루즈',   cap:3000, speed:46, price:4e10,  fuel:36,   decks:6, len:20, hull:'#fffdf3'},
  {id:'c1', kind:'cargo', name:'작은 화물선',       cap:20,   speed:24, price:8e7,   fuel:0.5,  decks:1, len:2,  hull:'#d95f4a'},
  {id:'c2', kind:'cargo', name:'화물선',            cap:80,   speed:28, price:3e8,   fuel:1.6,  decks:2, len:5,  hull:'#3f7fbf'},
  {id:'c3', kind:'cargo', name:'컨테이너선',        cap:300,  speed:32, price:1.2e9, fuel:5,    decks:3, len:9,  hull:'#2e9e6b'},
  {id:'c4', kind:'cargo', name:'대형 컨테이너선',   cap:900,  speed:36, price:5e9,   fuel:13,   decks:4, len:14, hull:'#9b59b6'},
  {id:'c5', kind:'cargo', name:'초대형 컨테이너선', cap:2500, speed:40, price:2.5e10,fuel:30,   decks:5, len:19, hull:'#e08b16'},
];
const shipType = id => SHIPS.find(s => s.id === id) || SHIPS[0];

/* 내가 만든 배의 성능 계산 */
function customSpec(c) {
  const rooms = (c.rooms && c.rooms.length) ? c.rooms.length : 1;
  const extra = (c.pool ? 0.06 : 0) + (c.slide ? 0.05 : 0) + (c.heli ? 0.09 : 0);
  const cap = (c.kind === 'pax')
    ? Math.round(c.len * c.decks * 12 * (1 + rooms * 0.04))
    : Math.round(c.len * c.decks * 20);
  const per = (c.kind === 'pax') ? (2e6 + cap * 3e3) : (2.5e6 + cap * 3.5e3);
  return {
    id: 'custom', kind: c.kind, name: '내가 만든 배',
    cap: cap,
    speed: Math.max(18, (c.kind === 'pax' ? 22 : 20)
      + Math.min(c.len, 20) * 1.1 + Math.max(0, c.len - 20) * 0.25 - c.decks * 0.6),
    price: Math.round(cap * per * (1 + rooms * 0.02 + extra)),
    fuel: Math.max(0.15, cap * 0.012),
    decks: c.decks, len: c.len, hull: c.hull,
    fare: 1 + (c.kind === 'pax' ? rooms * 0.03 + extra : 0),
  };
}
const spec = s => s.custom ? customSpec(s.custom) : shipType(s.type);
/* 배 크기 — 길이는 1~20, 진짜 배는 길고 낮다 */
/* 배 길이 — 20까지는 쭉쭉, 그 위(옛날배 전용 21~50)는 조금 완만하게 */
const hullW = t => 660 + Math.min(t.len, 20) * 52 + Math.max(0, t.len - 20) * 40;
const maxLen = () => (S && S.era === 'old') ? 50 : 20;   // 옛날 세계는 50까지!
const hullF = t => 34 + t.len * 1.4;                 // 물 위로 나온 선체 높이
const hullD = t => 56 + t.len * 2.4;                 // 물속 깊이
const topScale = t => Math.min(1, 0.5 + t.len * 0.06);  // 작은 배는 굴뚝·마스트·조타실도 작다
/* 4층부터는 아래 2개 층을 선체 안에 넣는다 (탑처럼 안 보이게) */
const deckInHull = t => (t.kind === 'pax' && t.decks >= 4) ? 2 : 0;
/* 뱃머리(앞의 뾰족한 부분) 길이 — 0~70, 배 길이의 몇 %만큼 앞으로 나오나 */
const BOWLEN = [0, 0.035, 0.1, 0.19];                 // 예전 저장(1~4) 이어받기용
const bowOf = s => {
  const c = s.custom;
  if (!c) return 0;                      // 조선소에서 파는 배는 원래 뱃머리 그대로
  if (c.bowN != null) return c.bowN / 100;
  return BOWLEN[(c.bow || 2) - 1];
};
/* 손님이 타는 곳(상부구조) 길이 — 배 길이와 같은 눈금(1~50). 배 길이와 같으면 끝에서 끝까지 */
const OLDDECK = [0.35, 0.55, 0.7, 0.82, 0.93];        // 예전 저장(1~5) 이어받기용
function deckFrac(s) {
  const c = s.custom;
  if (!c) return S.era === 'old' ? 0.62 : 0.93;
  const L = Math.max(1, c.len);
  if (c.dlen != null) return Math.max(0.12, Math.min(1, c.dlen / L));
  return OLDDECK[(c.deck || 2) - 1];
}
const hullDeep = t => Math.max(hullD(t), deckInHull(t) * DH - hullF(t) + 62);
const DH = 52;                                       // 한 층 높이
const shipH = t => hullDeep(t) + hullF(t) + (deckInHull(t) ? 42 : 10) +
                   DH * (t.decks - deckInHull(t) + 1) + 70;        // 배 전체 높이

/* ---------------- 항구 ---------------- */
const PORTS = [
  {id:'incheon',name:'인천',       x:292, y:178, size:3, cost:0,      bonus:1},
  {id:'busan',  name:'부산',       x:360, y:296, size:3, cost:0,      bonus:1},
  {id:'jeju',   name:'제주',       x:326, y:392, size:2, cost:0,      bonus:1.1},
  {id:'tokyo',  name:'도쿄',       x:524, y:250, size:4, cost:5e7,    bonus:1.1},
  {id:'shang',  name:'상하이',     x:262, y:472, size:4, cost:1.5e8,  bonus:1},
  {id:'hk',     name:'홍콩',       x:240, y:562, size:3, cost:4e8,    bonus:1.2},
  {id:'sing',   name:'싱가포르',   x:186, y:664, size:4, cost:1e9,    bonus:1.2},
  {id:'sydney', name:'시드니',     x:664, y:716, size:3, cost:2.5e9,  bonus:1.3},
  {id:'hawaii', name:'하와이',     x:864, y:418, size:2, cost:6e9,    bonus:1.8},
  {id:'alaska', name:'알래스카',   x:936, y:104, size:2, cost:2e10,   bonus:1.6},
  {id:'la',     name:'로스앤젤레스',x:1176,y:344, size:5, cost:1.5e10, bonus:1.2},
  {id:'panama', name:'파나마',     x:1266,y:452, size:3, cost:4e10,   bonus:1.4},
  {id:'pole',   name:'남극 기지',  x:700, y:824, size:1, cost:1e11,   bonus:3.5},
];
const portOf = id => PORTS.find(p => p.id === id) || PORTS[0];

const LANDS = [
  {name:'아시아', pts:[[0,-40],[300,-40],[322,90],[300,160],[258,208],[286,300],[228,352],[206,436],[150,478],[126,566],[58,626],[0,660]]},
  {name:'일본',   pts:[[398,222],[438,206],[476,246],[462,300],[424,304],[396,262]]},
  {name:'호주',   pts:[[352,660],[520,634],[604,700],[592,792],[470,834],[368,802],[330,722]]},
  {name:'북아메리카', pts:[[1640,-40],[1030,58],[962,140],[1104,196],[1176,300],[1292,384],[1420,424],[1640,392]]},
  {name:'남아메리카', pts:[[1332,470],[1452,472],[1522,604],[1470,782],[1402,890],[1330,940],[1298,700],[1310,560]]},
  {name:'남극',   pts:[[-40,940],[1640,940],[1640,878],[900,846],[520,880],[-40,884]]},
  {name:'하와이섬', pts:[[848,406],[880,402],[888,424],[862,436],[842,424]]},
];

/* ---------------- 상태 ---------------- */
/* 세계가 두 개 — 현대 배 세계와 옛날배 세계는 따로 저장된다 */
const SAVE_BASE = 'cruise_world_';
const saveKey = era => SAVE_BASE + (era === 'old' ? 'old' : 'now');
const SAVE_KEY = 'cruise_game_v2';                 // 예전 저장(현대 세계로 이어받음)
let S = null;
function newGame() {
  return {
    era: 'now',                       // 'now' 현대 배 / 'old' 1900년대 옛날배
    money: 1e8, totalEarn: 0, totalPax: 0, totalCrg: 0,
    ships: [], nextId: 1, drive: null,
    ports: PORTS.map(p => ({id: p.id, lv: 0, open: p.cost === 0,
      pax: p.cost === 0 ? 20 : 0, crg: p.cost === 0 ? 10 : 0})),
    storm: null, stormWait: 40, t: 0,
  };
}
const pState = id => S.ports.find(p => p.id === id);
const paxRate = p => portOf(p.id).size * 1.4 * (1 + pState(p.id).lv * 0.6);
const paxMax  = p => Math.round(portOf(p.id).size * 40 * (1 + pState(p.id).lv));
const crgRate = p => portOf(p.id).size * 1.1 * (1 + pState(p.id).lv * 0.6);
const crgMax  = p => Math.round(portOf(p.id).size * 30 * (1 + pState(p.id).lv));
const portUpCost = id => Math.round(1e8 * portOf(id).size * Math.pow(3.2, pState(id).lv));

function won(n) {
  n = Math.floor(n); const s = n < 0 ? '-' : ''; n = Math.abs(n);
  if (n >= 1e12) { const j = Math.floor(n / 1e12), e = Math.floor((n % 1e12) / 1e8);
    return s + j + '조' + (e ? ' ' + e + '억' : '') + '원'; }
  if (n >= 1e8) { const e = Math.floor(n / 1e8), m = Math.floor((n % 1e8) / 1e4);
    return s + e + '억' + (m ? ' ' + m + '만' : '') + '원'; }
  if (n >= 1e4) return s + Math.floor(n / 1e4).toLocaleString() + '만원';
  return s + n.toLocaleString() + '원';
}
const num = n => Math.floor(n).toLocaleString();
const RANKS = [[0,'뱃사공'],[3e8,'선장'],[2e9,'선단장'],[2e10,'해운 사장'],
  [2e11,'해운 회장'],[2e12,'해운왕'],[2e13,'바다의 왕']];
function rank() { let r = RANKS[0][1]; for (const [m, n] of RANKS) if (S.totalEarn >= m) r = n; return r; }

const shipCap   = s => Math.round(spec(s).cap * (1 + s.up.room * 0.12));
const shipSpeed = s => spec(s).speed * (1 + s.up.eng * 0.1);
const shipFare  = s => (spec(s).kind === 'pax' ? 250000 : 300000) * (1 + s.up.serv * 0.14);
const upCost = (s, k) => Math.round(spec(s).price * 0.28 * Math.pow(1.7, s.up[k]));
const UPK = {eng: '엔진(속도)', room: '객실/짐칸(정원)', serv: '서비스(요금)'};
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const units = (a, b) => dist(a, b) / 60;
const routeLen = (a, b) => dist(a, b) * 22;          // 옆에서 볼 때의 바닷길 길이 (길수록 오래 걸린다)
const boatCount = t => Math.max(2, Math.min(10, t.decks * 2));   // 구명정 개수

/* =========================================================================
   배 사기
   ========================================================================= */
function buyShip(typeId) {
  const t = shipType(typeId);
  if (S.money < t.price) { toast('돈이 모자라!'); return; }
  let nm = null;
  try { nm = window.prompt('배 이름을 지어줘!', t.name + ' ' + S.nextId + '호'); } catch (e) {}
  if (nm === null) return;
  nm = (nm || '').trim() || (t.name + ' ' + S.nextId + '호');
  S.money -= t.price;
  const home = S.ports.find(p => p.open);
  const sh = {
    id: S.nextId++, type: t.id, name: nm.slice(0, 14),

    x: portOf(home.id).x, y: portOf(home.id).y, ang: 0,
    up: {eng: 0, room: 0, serv: 0}, trips: 0, earn: 0,
    pos: 0, v: 0, mood: 100,

function driven() { return S.ships.find(s => s.id === S.drive) || null; }
function setDrive(id) {
  const s = S.ships.find(v => v.id === id); if (!s) return;
  const old = driven();                       // 타고 있던 배는 자동 운항으로 넘긴다
  if (old && old !== s && old.stage === 'sail' && old.to)

/* =========================================================================
   계산 (1초에 60번)
   ========================================================================= */
let floats = [], shake = 0;
function step(dt) {
  S.t += dt;
  for (const st of S.ports) {
    if (!st.open) continue;
    const p = portOf(st.id);
    st.pax = Math.min(paxMax(p), st.pax + paxRate(p) * dt);
    st.crg = Math.min(crgMax(p), st.crg + crgRate(p) * dt);
  }
  // 태풍
  if (S.storm) {
    S.storm.x += S.storm.vx * dt; S.storm.y += S.storm.vy * dt; S.storm.life -= dt;
    if (S.storm.life <= 0 || S.storm.x < -200) S.storm = null;
  } else {
    S.stormWait -= dt;
    if (S.stormWait <= 0) {
      S.stormWait = 50 + Math.random() * 60;
      S.storm = {x: 1750, y: 200 + Math.random() * 500, r: 170 + Math.random() * 90,
        vx: -(24 + Math.random() * 22), vy: (Math.random() - .5) * 10, life: 50};
    }
  }
  for (const s of S.ships) (s.id === S.drive) ? stepDrive(s, dt) : stepAuto(s, dt);
  for (const f of floats) { f.y -= 26 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 2);
}

/* ---- 내가 모는 배 ---- */
const keys = {};
function stepDrive(s, dt) {
  const t = spec(s);
  const A = portOf(s.from);
  const stA = pState(s.from);

  if (s.sink !== undefined) { s.sink += dt; if (s.sink > 7) finishSink(s); return; }  // 침몰 중

  if (s.stage !== 'sail' || !s.to) {        // 항구에 서서 손님 태우기 (항로 없는 배도 여기)
    s.stage = 'dock'; s.tilt = 0;
    s.v = 0; s.pos = 0;
    const cap = shipCap(s);
    const rate = Math.max(4, cap / 3.5);
    const pool = t.kind === 'pax' ? stA.pax : stA.crg;
    const take = Math.min(rate * dt, cap - s.load, pool);
    if (take > 0) { s.load += take; if (t.kind === 'pax') stA.pax -= take; else stA.crg -= take; }
    s.mood = Math.min(100, s.mood + 20 * dt);
    return;
  }

  if (s.stage === 'sail') {
    const B = portOf(s.to), L = routeLen(A, B);
    const maxV = shipSpeed(s) * 4;
    if (keys.right) s.v += maxV * 1.1 * dt;
    else if (keys.left) s.v -= maxV * 1.4 * dt;
    else s.v -= s.v * 0.7 * dt;                       // 저절로 천천히
    s.v = Math.max(-maxV * 0.35, Math.min(maxV, s.v));
    s.pos = Math.max(0, s.pos + s.v * dt);

    // 파도 — 빠르면 손님이 어지러워한다
    const w = waveHi(s);
    const fast = Math.abs(s.v) / maxV;
    if (w > 22 && fast > 0.55) { s.mood -= (w - 20) * fast * 0.09 * dt * 10; shake = Math.max(shake, 0.5); }
    else s.mood += 4 * dt;
    s.mood = Math.max(10, Math.min(100, s.mood));

    // ── 대폭풍! 빠르게 가면 배가 기울어져 뒤집힌다
    if (s.tilt === undefined) s.tilt = 0;
    if (inBigStorm(s)) {
      s.mood -= 10 * dt;
      shake = Math.max(shake, 0.8);
      s.braved = true;                                       // 폭풍을 겪었다는 표시
      if (fast > 0.4) s.tilt += (fast - 0.4) * 50 * dt;      // 빠를수록 확 기운다
      else s.tilt -= 22 * dt;
      if (s.tilt > 55 && Math.random() < dt * 2) toast('⚠️ 배가 기울고 있어! ← 를 눌러!');
      s.big.life = (s.big.life === undefined ? 26 : s.big.life) - dt;   // 폭풍도 지나간다
      if (s.big.life <= 0) { s.big.gone = true; toast('🌤️ 폭풍우가 지나갔다! 살았다~'); }
    } else s.tilt -= 45 * dt;

    // 지도 위 자리도 같이 옮겨 준다
    const k = s.pos / L;

function arrive(s) {

  const brave = s.braved ? 1.6 : 1;                         // 대폭풍을 이겨내면 보너스!
  const money = Math.floor(s.load) * u * shipFare(s) * B.bonus * moodMul * brave;
  const fuel = u * t.fuel * 1e6;
  const net = Math.max(0, money - fuel);
  S.money += net; S.totalEarn += net; s.earn += net; s.trips++;
  if (t.kind === 'pax') S.totalPax += Math.floor(s.load); else S.totalCrg += Math.floor(s.load);
  lastPay = {net: net, pax: Math.floor(s.load), mood: s.mood, port: B.name, life: 6, brave: !!s.braved};
  s.load = 0; s.pos = 0; s.v = 0; s.mood = 100; s.tilt = 0; s.big = null; s.braved = false;
  const back = s.from; s.from = s.to; s.to = back;           // 다음엔 왔던 곳으로 (바꿔도 됨)
  s.stage = 'dock'; s.x = B.x; s.y = B.y;

}
let lastPay = null, sunkMsg = null;

/* ---- 대폭풍 · 침몰 · 구조 ---- */
function inBigStorm(s) {

}
function startSink(s) {

  s.boats = boatCount(t);
  toast('🆘 배가 뒤집혔다! 구명정으로 탈출!');
  try {                                                     // 사이렌 소리
    const ac = actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(600, ac.currentTime);
    o.frequency.linearRampToValueAtTime(300, ac.currentTime + 1.4);

  S.money += back;
  sunkMsg = {name: s.name, pax: s.savedPax || 0, boats: s.boats || 4, money: back, life: 10};
  S.ships = S.ships.filter(v => v.id !== s.id);

  if (!S.ships.length) {                                    // 배가 하나도 없으면 보험으로 한 척
    const home = S.ports.find(p => p.open);
    S.ships.push({
      id: S.nextId++, type: 'p1', name: '보험 통통배',
      from: home.id, to: null, stage: 'dock', load: 0, prog: 0, wait: 0,
      x: portOf(home.id).x, y: portOf(home.id).y, ang: 0,
      up: {eng: 0, room: 0, serv: 0}, trips: 0, earn: 0, pos: 0, v: 0, mood: 100, tilt: 0,

/* ---- 알아서 다니는 배 ---- */
function stepAuto(s, dt) {
  if (!s.from || !s.to) { s.stage = 'idle'; return; }
  const t = spec(s), A = portOf(s.from), B = portOf(s.to);
  const stA = pState(s.from), stB = pState(s.to);
  if (!stA.open || !stB.open) { s.to = null; return; }

  if (s.stage !== 'sail') {
    s.stage = 'load'; s.x = A.x; s.y = A.y;
    const cap = shipCap(s), rate = Math.max(3, cap / 4);
    const pool = t.kind === 'pax' ? stA.pax : stA.crg;
    const take = Math.min(rate * dt, cap - s.load, pool);
    if (take > 0) { s.load += take; if (t.kind === 'pax') stA.pax -= take; else stA.crg -= take; }
    s.wait += dt;                                  // 항구에 서 있던 시간
    // 다 찼거나 · 손님이 안 오거나 · 너무 오래 기다렸으면 출발
    if (s.load >= cap - 0.5 || (s.wait > 14 && s.load >= 1) || (take <= 0 && s.wait > 3 && s.load >= 1)) {
      s.load = Math.floor(s.load); s.stage = 'sail'; s.prog = 0; s.wait = 0;
    }
    return;
  }
  const d = dist(A, B);
  let sp = shipSpeed(s);
  if (S.storm) {
    const px = A.x + (B.x - A.x) * s.prog, py = A.y + (B.y - A.y) * s.prog;
    if (Math.hypot(px - S.storm.x, py - S.storm.y) < S.storm.r) sp *= 0.45;

    const u = units(A, B), t2 = spec(s);
    const money = s.load * u * shipFare(s) * B.bonus * 0.85;   // 자동은 조금 덜 번다
    const net = Math.max(0, money - u * t2.fuel * 1e6);
    S.money += net; S.totalEarn += net; s.earn += net; s.trips++;
    if (t.kind === 'pax') S.totalPax += s.load; else S.totalCrg += s.load;
    floats.push({x: B.x, y: B.y - 18, txt: '+' + won(net), life: 2.2, col: '#8dffb0'});
    s.load = 0; const f = s.from; s.from = s.to; s.to = f;
    s.stage = 'load'; s.prog = 0;
  }
  s.x = A.x + (B.x - A.x) * s.prog; s.y = A.y + (B.y - A.y) * s.prog;
  s.ang = Math.atan2(B.y - A.y, B.x - A.x);
}

/* =========================================================================
   화면
   ========================================================================= */
const cv = document.getElementById('cv');

  const dpr = Math.min(2, window.devicePixelRatio || 1);

/* 마우스 휠로 배 옆을 구경한다 */
let camX = 0, shipHalfPx = 0;

function camScroll(dx) {
  const lim = camLimit();

}
/* 파도 높이 (태풍이면 커진다) */
function waveHi(s) {

  const L = routeLen(A, B), k = Math.min(1, s.pos / L);
  const x = A.x + (B.x - A.x) * k, y = A.y + (B.y - A.y) * k;
  let w = 8 + Math.sin(S.t * 0.4) * 3;
  if (S.storm) {
    const d = Math.hypot(x - S.storm.x, y - S.storm.y);
    if (d < S.storm.r) w += (1 - d / S.storm.r) * 42;
  }
  if (s.big && !s.big.gone && k > s.big.a - 0.05 && k < s.big.b + 0.05) {   // 대폭풍은 파도가 어마어마하다
    const edge = Math.min(k - (s.big.a - 0.05), (s.big.b + 0.05) - k) / 0.07;

/* ---------------- 옆에서 보는 바다 화면 ---------------- */
function drawSail() {
  const s = driven();
  if (!s) { drawNoShip(); return; }
  const t = spec(s);
  const A = portOf(s.from), B = s.to ? portOf(s.to) : null;
  const L = B ? routeLen(A, B) : 1000;
  const pos = s.pos;
  const hor = cvH * 0.60;
  const w = waveHi(s), stormy = w > 20, huge = w > 50;      // huge = 대폭풍

  ctx.save();
  ctx.translate(camX, 0);                 // 마우스 휠로 좌우 구경
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 14, (Math.random() - .5) * shake * 10);

  // 하늘
  const g = ctx.createLinearGradient(0, 0, 0, hor);
  if (huge) { g.addColorStop(0, '#15202b'); g.addColorStop(1, '#4a5561'); }
  else if (stormy) { g.addColorStop(0, '#3d4b5c'); g.addColorStop(1, '#7d8a96'); }
  else { g.addColorStop(0, '#4fb3e8'); g.addColorStop(1, '#bfe8ff'); }

    ctx.fillStyle = 'rgba(255,243,176,.3)'; ctx.beginPath(); ctx.arc(cvW - 110, 80, 62, 0, 7); ctx.fill();
  }
  // 구름
  for (let i = 0; i < 7; i++) {
    const cx = mod(i * 330 - pos * 0.06 - S.t * 6, cvW + 400) - 200;
    const cy = 40 + (i % 3) * 46;
    ctx.fillStyle = stormy ? 'rgba(90,100,112,.85)' : 'rgba(255,255,255,.85)';
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(cx + k * 30, cy + (k === 1 ? -12 : 0), 24, 0, 7); ctx.fill(); }
  }

  else { sg.addColorStop(0, '#2aa3d6'); sg.addColorStop(1, '#08466b'); }
  ctx.fillStyle = sg; ctx.fillRect(-FAR, hor, cvW + FAR * 2, cvH - hor);

  // 물고기
  for (let i = 0; i < 7; i++) {
    const fx = mod(i * 260 - pos * 0.5 - S.t * 22, cvW + 300) - 150;
    const fy = hor + 70 + (i * 53 % (cvH - hor - 90));
    ctx.fillStyle = ['#ffd166','#ff8fab','#8ecae6'][i % 3];
    ctx.beginPath(); ctx.ellipse(fx, fy + Math.sin(S.t * 2 + i) * 5, 13, 7, 0, 0, 7); ctx.fill();

function drawWaveLayer(y, amp, off, col, alpha, foam) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = col;
  const top = [], X0 = -4000, X1 = cvW + 4000;      // 휠로 옆을 봐도 물이 이어지게
  for (let x = X0; x <= X1; x += 10)
    top.push([x, y + Math.sin((x + off) / 70) * (amp * 0.5) + Math.sin((x + off) / 23) * (amp * 0.22)]);
  ctx.beginPath(); ctx.moveTo(X0, cvH);
  for (const p of top) ctx.lineTo(p[0], p[1]);
  ctx.lineTo(X1, cvH); ctx.closePath(); ctx.fill();
  if (foam) {                                   // 하얀 물마루
    ctx.beginPath();
    top.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();
}

/* 옆에서 본 항구 */
function drawDockSide(p, x, hor, isFrom) {
  if (x < -620 || x > cvW + 620) return;
  const st = pState(p.id);
  ctx.save();
  // 출발 항구는 왼쪽에, 도착 항구는 오른쪽에 땅이 있다
  const sgn = isFrom ? 1 : -1;
  ctx.translate(x, 0); ctx.scale(sgn, 1); ctx.translate(-x, 0);
  // 땅 (바다 쪽으로 비스듬히 들어간다)
  ctx.fillStyle = '#6b8f5f';
  ctx.beginPath();
  ctx.moveTo(x - 470, hor - 6); ctx.lineTo(x - 34, hor - 6);
  ctx.lineTo(x - 8, hor + 80); ctx.lineTo(x - 60, cvH); ctx.lineTo(x - 470, cvH);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8a6f4b'; ctx.fillRect(x - 470, hor - 6, 436, 16);
  // 부두
  ctx.fillStyle = '#9c7b52'; ctx.fillRect(x - 60, hor - 12, 60, 14);
  for (let i = 0; i < 3; i++) ctx.fillRect(x - 54 + i * 20, hor, 8, 40);
  // 건물
  const cols = ['#e9eef4', '#dfe7ef', '#f3f6fa'];
  for (let i = 0; i < p.size + 1; i++) {
    const bw = 54 + (i % 2) * 18, bh = 70 + ((i * 37) % 90) + st.lv * 22;
    const bx = x - 316 + i * 70;
    ctx.fillStyle = cols[i % 3]; ctx.fillRect(bx, hor - 6 - bh, bw, bh);
    ctx.fillStyle = '#5d7f9c';
    for (let a = 0; a < Math.floor(bh / 24); a++)
      for (let b = 0; b < Math.floor(bw / 22); b++)
        ctx.fillRect(bx + 8 + b * 22, hor - 6 - bh + 10 + a * 24, 12, 12);
  }
  // 크레인
  ctx.strokeStyle = '#e2b93b'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(x - 120, hor - 6); ctx.lineTo(x - 120, hor - 150);
  ctx.lineTo(x - 30, hor - 150); ctx.stroke();
  // 기다리는 사람들
  const waiting = Math.min(11, Math.floor(st.pax / 8));
  for (let i = 0; i < waiting; i++)
    drawPerson(x - 250 + i * 20, hor - 8, 26, ['#e74c3c','#3498db','#f1c40f','#2ecc71','#9b59b6'][i % 5], S.t * 3 + i);
  ctx.restore();
  // 이름표 (글씨는 뒤집히면 안 되니까 원래대로 돌린 뒤에 그린다)
  if (x < -260 || x > cvW + 260) return;            // 항구가 화면 밖이면 이름도 안 보인다
  const tx = Math.max(100, Math.min(cvW - 100, x + (isFrom ? -250 : 250)));
  ctx.save(); ctx.textAlign = 'center'; ctx.font = 'bold 26px 맑은 고딕';
  ctx.fillStyle = '#04202f'; ctx.fillText(p.name, tx + 2, hor - 252);
  ctx.fillStyle = '#ffffff'; ctx.fillText(p.name, tx, hor - 254);
  ctx.font = '17px 맑은 고딕'; ctx.fillStyle = '#0b3550';
  ctx.fillText(isFrom ? '출발 항구' : '도착 항구', tx, hor - 228);
  ctx.restore();
}

/* ═══════════ 진짜 배 모양 ═══════════
   F = 물 위로 나온 선체 높이, D = 물속 깊이. 뱃머리는 오른쪽. */
let curBow = 0;                                    // 지금 그리는 배의 뱃머리 길이
function hullPath(W, F, D) {
  const b = curBow;
  ctx.beginPath();
  ctx.moveTo(-W / 2, -F);
  if (S.era === 'old') {          // 🕰️ 옛날배 — 뱃머리가 수직이라 옆에서 보면 네모
    ctx.quadraticCurveTo(-W / 4, -F - 14, W / 2 - 20, -F - 18);
    ctx.lineTo(W / 2 + b, -F - 18);                       // 갑판이 앞으로 쭉 (윗변)
    ctx.lineTo(W / 2 + b, D - 40);                        // 수직 뱃머리 (직각!)
    ctx.quadraticCurveTo(W / 2 + b, D, W / 2 + b - 46, D);// 바닥 모서리만 살짝 둥글게
    ctx.lineTo(-W / 2 + 54, D);
    ctx.quadraticCurveTo(-W / 2 - 6, D - 4, -W / 2 - 6, -F + 22);
    ctx.closePath();
    return;
  }
  ctx.quadraticCurveTo(-W / 4, -F - 16, W / 2 - 26, -F - 18 - b * 0.05);   // 갑판 (앞이 살짝 높다)
  ctx.quadraticCurveTo(W / 2 + 14 + b * 0.7, -F - 18 - b * 0.06,
                       W / 2 + 10 + b, -F + 26);                            // 뱃머리 (앞으로 쭉!)
  ctx.quadraticCurveTo(W / 2 + 6 + b * 0.25, D - 46, W / 2 - 24, D - 20);   // 선수 경사
  ctx.quadraticCurveTo(W / 2 + 8, D - 4, W / 2 - 34, D + 2);       // 구상선수 (물속 혹)
  ctx.lineTo(-W / 2 + 54, D);                                      // 배 밑바닥
  ctx.quadraticCurveTo(-W / 2 - 6, D - 4, -W / 2 - 6, -F + 22);    // 선미 곡선
  ctx.closePath();
}
function deckPath(rear, front, y, h) {      // 앞 모서리가 비스듬한 갑판 한 층
  ctx.beginPath();
  ctx.moveTo(rear, y);
  ctx.lineTo(front - 18, y);
  ctx.lineTo(front, y + 18);
  ctx.lineTo(front, y + h);
  ctx.lineTo(rear, y + h);
  ctx.closePath();
}
/* 선체 · 프로펠러 · 방향타 · 물속 빨간 페인트 */
function drawHullBase(s, t, W, F, D) {
  const run = s.stage === 'sail';
  ctx.fillStyle = '#46586a';                                       // 방향타
  ctx.beginPath();
  ctx.moveTo(-W / 2 - 4, D - 52); ctx.lineTo(-W / 2 - 36, D - 38);
  ctx.lineTo(-W / 2 - 36, D - 8); ctx.lineTo(-W / 2 - 4, D - 16);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(-W / 2 + 18, D - 22);                   // 프로펠러
  ctx.rotate(run ? S.t * (5 + Math.abs(s.v) / 18) : 0);
  ctx.fillStyle = '#c9a227';
  for (let i = 0; i < 4; i++) {
    ctx.save(); ctx.rotate(i * 1.57);
    ctx.beginPath(); ctx.ellipse(13, 0, 13, 5, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  ctx.fillStyle = '#8a7317'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
  ctx.restore();
  const old = S.era === 'old';
  hullPath(W, F, D); ctx.fillStyle = old ? '#23292f' : t.hull; ctx.fill();
  ctx.save(); hullPath(W, F, D); ctx.clip();
  ctx.fillStyle = '#b03a2e'; ctx.fillRect(-W, 5, W * 2, D + 60);    // 물속 페인트
  ctx.fillStyle = old ? '#0f1418' : '#1c2833';
  ctx.fillRect(-W, -4, W * 2, 10);                                  // 흘수선 띠
  if (old) {                                                        // 옛날배는 금색 줄무늬
    ctx.fillStyle = '#d9a441'; ctx.fillRect(-W, -F * 0.72, W * 2, 5);
  }
  ctx.restore();
}
/* 선체 겉모습 마무리 — 창문 · 닻 · 배 이름 */
function drawHullSkin(s, t, W, F, D, noPort) {
  ctx.save(); hullPath(W, F, D); ctx.clip();
  const py = -F * 0.55;
  ctx.font = 'bold 17px 맑은 고딕';
  const nameEnd = W / 2 - 80 - ctx.measureText(s.name || '').width;  // 이름 자리는 비워 둔다
  if (!noPort) {
    ctx.fillStyle = 'rgba(30,60,90,.85)';                           // 둥근 창문
    for (let x = -W / 2 + 80; x < nameEnd; x += 52) {
      ctx.beginPath(); ctx.arc(x, py, 6, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
  hullPath(W, F, D); ctx.strokeStyle = '#22313f'; ctx.lineWidth = 3; ctx.stroke();
  if (noPort) return;                      // 아래층이 객실이면 이름·닻은 위(산책 갑판)에 그린다
  const ink = S.era === 'old' ? '#f0e6c8' : '#2c3e50';   // 검은 선체엔 밝은 글씨
  // 닻
  ctx.strokeStyle = ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W / 2 - 40, py - 12); ctx.lineTo(W / 2 - 40, py + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2 - 48, py - 6); ctx.lineTo(W / 2 - 32, py - 6); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2 - 40, py + 8, 8, 0.2, Math.PI - 0.2); ctx.stroke();
  // 뱃머리에 배 이름
  ctx.save();
  ctx.fillStyle = ink; ctx.font = 'bold 17px 맑은 고딕'; ctx.textAlign = 'right';
  ctx.fillText(s.name || '', W / 2 - 66, py + 6);
  ctx.restore();
}
/* 구명정 — 커다랗게, 진짜 배처럼 (옛날배는 나무 보트) */
function drawLifeboat(x, y, sc) {
  const k = sc || 1;
  if (S.era === 'old') {                             // 1900년대: 뚜껑 없는 나무 보트
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
    ctx.strokeStyle = '#6b6b6b'; ctx.lineWidth = 4;  // 다빗
    ctx.beginPath();
    ctx.moveTo(-26, -18); ctx.lineTo(-26, 4); ctx.moveTo(26, -18); ctx.lineTo(26, 4);
    ctx.moveTo(-28, -18); ctx.quadraticCurveTo(-26, -28, -16, -26);
    ctx.moveTo(28, -18); ctx.quadraticCurveTo(26, -28, 16, -26); ctx.stroke();
    ctx.fillStyle = '#c9a227'; ctx.beginPath();      // 보트 몸통(나무색)
    ctx.moveTo(-32, -6); ctx.lineTo(32, -6);
    ctx.quadraticCurveTo(26, 18, -24, 16);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#8a6d1f'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#f4f1e6'; ctx.fillRect(-32, -9, 64, 4);
    ctx.strokeStyle = '#8a6d1f'; ctx.lineWidth = 2;  // 노 걸이
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i * 11, -6); ctx.lineTo(i * 11, 8); ctx.stroke();
    }
    ctx.restore(); return;
  }
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 4;                   // 매다는 팔(다빗)
  ctx.beginPath();
  ctx.moveTo(-26, -22); ctx.lineTo(-26, 4);
  ctx.moveTo(26, -22); ctx.lineTo(26, 4);
  ctx.moveTo(-28, -22); ctx.lineTo(-19, -28);
  ctx.moveTo(28, -22); ctx.lineTo(19, -28); ctx.stroke();
  ctx.fillStyle = '#f7f9fa'; ctx.beginPath();                       // 보트 몸통
  ctx.moveTo(-32, -2); ctx.lineTo(32, -2);
  ctx.quadraticCurveTo(26, 19, -24, 17);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#e67e22'; ctx.beginPath();                       // 주황 지붕
  ctx.moveTo(-32, -2); ctx.lineTo(32, -2);
  ctx.quadraticCurveTo(28, -19, 0, -21);
  ctx.quadraticCurveTo(-28, -19, -32, -2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c0560c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ffffff';                                        // 창문
  ctx.fillRect(-25, -13, 9, 7); ctx.fillRect(-6, -15, 9, 7); ctx.fillRect(13, -13, 9, 7);
  ctx.fillStyle = '#c0392b'; ctx.fillRect(-32, -5, 64, 4);
  ctx.restore();
}
/* 물에 떠서 사람을 태운 구명정 (침몰할 때) — 사람들이 안에 앉아 있다 */
function drawRescueBoat(x, y, n, ph) {
  ctx.save();
  ctx.translate(x, y + Math.sin(ph) * 5); ctx.rotate(Math.sin(ph * 0.8) * 0.13);
  const col = ['#e74c3c','#3498db','#f1c40f','#2ecc71'];
  for (let i = 0; i < Math.min(4, n); i++)                 // 사람 먼저 (배에 가려 앉은 모습)
    drawPerson(-24 + i * 16, 2, 26, col[i % 4], ph * 2 + i, 100);
  ctx.fillStyle = '#f7f9fa'; ctx.beginPath();              // 보트 몸통
  ctx.moveTo(-36, -4); ctx.lineTo(36, -4);
  ctx.quadraticCurveTo(30, 22, -28, 20);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#e67e22'; ctx.beginPath();              // 주황 테두리
  ctx.moveTo(-38, -9); ctx.lineTo(38, -9); ctx.lineTo(36, -3); ctx.lineTo(-36, -3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8a5a3b'; ctx.lineWidth = 4;          // 노
  ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-52, 12 + Math.sin(ph * 3) * 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(52, 12 + Math.cos(ph * 3) * 6); ctx.stroke();

/* 난간 */
function railing(x1, x2, y) {
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1, y - 12); ctx.lineTo(x2, y - 12);

/* ═══════════════ 1900년대 여객선 — 현대 크루즈와 완전히 다른 그림 ═══════════════
   낮고 긴 검은 선체 · 앞뒤에 짐 싣는 웰데크 · 가운데만 우뚝한 상부구조 ·
   높은 굴뚝과 돛대 · 석탄 보일러실 · 선수루/선미루                            */
let lastTop = null;                      // 굴뚝을 마우스로 끌 때 쓰는 좌표
const SUPSPAN = [[0.40,0.62],[0.32,0.70],[0.26,0.76],[0.20,0.81],[0.14,0.85]];
function evenFx(n, pos) {
  const spread = Math.min(0.66, 0.16 * (n - 1));
  const a = pos === 1 ? 0.07 : pos === 3 ? (0.93 - spread) : (1 - spread) / 2;
  const out = [];
  for (let i = 0; i < n; i++) out.push(a + (n > 1 ? i * spread / (n - 1) : 0));
  return out;
}
function funnelXs(s, t) {
  const c = s.custom || {};
  const n = c.funnels || (t.decks >= 5 ? 4 : t.decks >= 3 ? 3 : 2);
  if (c.fx && c.fx.length === n) return c.fx.slice();
  return evenFx(n, c.fpos || 2);
}

function drawOldLiner(s) {
  const t = spec(s), W = hullW(t), F = hullF(t) + 8, D = hullDeep(t);
  const c = s.custom || {};
  curBow = W * bowOf(s);
  const run = s.stage === 'sail';
  const cap = shipCap(s), ratio = Math.min(1, s.load / Math.max(1, cap));
  const rooms = (c.rooms && c.rooms.length) ? c.rooms : ROOMS_OLD;
  const decks = Math.max(1, Math.min(5, t.decks));
  const dh = 46, ds = topScale(t);
  const PCOL = ['#7b4a3a','#3b5a72','#6b6136','#4b6b4a','#6b4a6b','#8a6d3b'];

  /* ── 선체 */
  drawHullBase(s, t, W, F, D);

  /* ── 선체 속: 화물칸 · 기관실 · 보일러실 · 석탄창고 */
  ctx.save(); hullPath(W, F, D); ctx.clip();

  // 기관실 — 커다란 피스톤 기관

    ctx.fillStyle = '#8fa6bb'; ctx.fillRect(ex2, iy + 6 + ph, 22, 26);
    ctx.fillStyle = '#c8d4de'; ctx.fillRect(ex2 + 7, iy + 30 + ph, 8, 16);
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(ex2 - 4, iy + 44, 30, 12);
    ctx.strokeStyle = '#9fb0c0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ex2 + 11, iy + 62, 12, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = '#ffd75e'; ctx.fillText('기관실', q(0.18) + 8, iy + ih - 6);
  // 보일러실 — 아궁이 세 개에 불
  for (let i = 0; i < 3; i++) {
    const bx2 = q(0.44) + i * LW * 0.07;
    ctx.fillStyle = '#5b5049'; ctx.fillRect(bx2, iy + 8, LW * 0.055, ih - 22);
    const ccx = bx2 + LW * 0.028, ccy = iy + ih / 2 - 2;
    ctx.fillStyle = '#241f1b'; ctx.beginPath(); ctx.arc(ccx, ccy, 13, 0, 7); ctx.fill();
    if (run) {
      ctx.fillStyle = 'rgba(255,140,40,.95)';
      ctx.beginPath(); ctx.arc(ccx, ccy, 8 + Math.sin(S.t * 8 + i) * 3, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,225,130,.9)';
      ctx.beginPath(); ctx.arc(ccx, ccy, 4 + Math.cos(S.t * 9 + i) * 2, 0, 7); ctx.fill();
    }
  }
  drawPerson(q(0.63), iy + ih - 6, 26, '#4b3832', S.t * 6, 100);      // 화부
  ctx.fillStyle = '#ffd75e'; ctx.fillText('석탄 보일러실', q(0.43) + 6, iy + ih - 6);
  // 석탄창고
  ctx.fillStyle = '#0d0c0a';

  }
  ctx.fillStyle = '#c8b48a'; ctx.fillText('석탄', q(0.665) + 6, iy + 18);
  ctx.restore();
  drawHullSkin(s, t, W, F, D, false);

  /* ── 선수루 · 선미루 (뱃머리와 배꼬리의 높은 부분) */
  const deckY = -F - 2;
  const foreA = q(0.84), poopB = q(0.12);
  ctx.fillStyle = '#23292f';
  ctx.fillRect(foreA, deckY - 26, W / 2 + curBow * 0.5 - foreA, 28);   // 선수루
  ctx.fillRect(-W / 2 + 10, deckY - 22, poopB + W / 2 - 10, 24);       // 선미루
  ctx.fillStyle = '#d9a441';
  ctx.fillRect(foreA, deckY - 26, W / 2 + curBow * 0.5 - foreA, 4);
  ctx.fillRect(-W / 2 + 10, deckY - 22, poopB + W / 2 - 10, 4);
  // 닻 감는 기계
  ctx.fillStyle = '#6b6b6b'; ctx.fillRect(foreA + 24, deckY - 44, 30, 18);
  ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(foreA + 39, deckY - 44, 9, Math.PI, 0); ctx.stroke();
  // 깃대 (배꼬리)
  ctx.strokeStyle = '#8a5a3b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-W / 2 + 22, deckY - 22); ctx.lineTo(-W / 2 + 22, deckY - 78); ctx.stroke();
  ctx.fillStyle = '#c0392b'; ctx.beginPath();
  ctx.moveTo(-W / 2 + 22, deckY - 78);
  ctx.lineTo(-W / 2 + 22 + 40 + Math.sin(S.t * 5) * 5, deckY - 70);
  ctx.lineTo(-W / 2 + 22, deckY - 62); ctx.fill();

  /* ── 웰데크 (앞뒤로 짐 싣는 낮은 갑판) — 화물 해치와 데릭 */
  const f = deckFrac(s) * 0.94;                  // 손님 타는 곳이 차지하는 만큼
  const sA = q(0.5 - f / 2), sB = q(0.5 + f / 2);
  const wells = [[poopB + 8, sA - 8], [sB + 8, foreA - 8]];
  wells.forEach(([wa, wb]) => {
    if (wb - wa < 40) return;
    ctx.fillStyle = '#7a5c3a'; ctx.fillRect(wa, deckY - 16, wb - wa, 16);   // 해치
    ctx.strokeStyle = '#4e3a22'; ctx.lineWidth = 2;
    for (let x = wa + 12; x < wb; x += 24) {
      ctx.beginPath(); ctx.moveTo(x, deckY - 16); ctx.lineTo(x, deckY); ctx.stroke();
    }

    for (let i = 0; i < n2; i++)                                            // 갑판 손님
      drawPerson(wa + 30 + i * 70 + ((S.t * 14 + i * 40) % 40), deckY - 16, 24,
        PCOL[i % 6], S.t * 5 + i, s.mood);
  });

  /* ── 가운데 상부구조 (객실 층) */
  const base = deckY - 4;
  let shown = 0;
  const totalShow = Math.round(ratio * (decks * 6 + 4));
  for (let d = 0; d < decks; d++) {
    const y = base - dh * (d + 1);
    const a = sA + d * 12, b = sB - d * 16, w = b - a;
    if (w < 60) break;
    ctx.fillStyle = (d % 2) ? '#fbf7ee' : '#f2ede1';
    ctx.fillRect(a, y, w, dh);
    ctx.save(); ctx.beginPath(); ctx.rect(a, y, w, dh); ctx.clip();
    const n = Math.max(2, Math.round(w / (dh * 2.3))), rw = w / n;
    for (let r = 0; r < n; r++) drawRoom(rooms[(r + d * 3) % rooms.length], a + r * rw, y, rw, dh);
    ctx.restore();
    ctx.strokeStyle = '#a99878'; ctx.lineWidth = 2; ctx.strokeRect(a, y, w, dh);
    const cnt = Math.min(6, Math.max(0, totalShow - shown)); shown += cnt;
    for (let i = 0; i < cnt; i++) {
      const seed = i * 137 + d * 61, sp2 = 22 + (i % 5) * 9;
      const px = ((S.t * sp2 + seed) % (w - 30)) + a + 15;
      drawPerson(px, y + dh - 5, 22, PCOL[i % 6], S.t * 6 + i, s.mood);

  const promY = base - dh * decks - 22;
  ctx.fillStyle = '#f7f2e6'; ctx.fillRect(sA + 6, promY, sB - sA - 12, 22);
  ctx.strokeStyle = '#a99878'; ctx.lineWidth = 2; ctx.strokeRect(sA + 6, promY, sB - sA - 12, 22);
  ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 2;                     // 아치 창문
  for (let x = sA + 20; x < sB - 24; x += 34) {
    ctx.beginPath(); ctx.arc(x + 10, promY + 16, 10, Math.PI, 0); ctx.stroke();
  }
  /* ── 보트 갑판 (구명정 · 굴뚝 · 조타실 · 돛대) */
  const boatY = promY - 30;
  const bA = sA + 20, bB = sB - 26;
  ctx.fillStyle = '#f7f2e6'; ctx.fillRect(bA, boatY, bB - bA, 30);
  ctx.strokeStyle = '#a99878'; ctx.lineWidth = 2; ctx.strokeRect(bA, boatY, bB - bA, 30);
  lastTop = {tr: bA, tw: bB - bA, topY: boatY};                       // 마우스로 굴뚝 끌기용
  // 구명정
  const nb = boatCount(t);
  for (let i = 0; i < nb; i++) {
    const x = bA + 40 + (bB - bA - 80) * (nb > 1 ? i / (nb - 1) : 0.5);
    drawLifeboat(x, boatY + 12, 1.05);
  }
  // 굴뚝
  const fxs = funnelXs(s, t), fw2 = 25 * ds, fh2 = 112 * ds;
  fxs.forEach((fr, i) => {
    const fx2 = bA + (bB - bA) * Math.max(0.02, Math.min(0.98, fr));
    ctx.fillStyle = '#d9a441'; ctx.beginPath();
    ctx.moveTo(fx2 - fw2, boatY + 4); ctx.lineTo(fx2 + fw2, boatY + 4);
    ctx.lineTo(fx2 + fw2 + 11 * ds, boatY - fh2); ctx.lineTo(fx2 - fw2 + 13 * ds, boatY - fh2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#a97c22'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#1c1c1c'; ctx.beginPath();
    ctx.moveTo(fx2 - fw2 + 9 * ds, boatY - fh2 * 0.8); ctx.lineTo(fx2 + fw2 + 2 * ds, boatY - fh2 * 0.8);
    ctx.lineTo(fx2 + fw2 + 11 * ds, boatY - fh2); ctx.lineTo(fx2 - fw2 + 13 * ds, boatY - fh2);
    ctx.closePath(); ctx.fill();
    if (run) {
      ctx.fillStyle = 'rgba(70,70,76,.5)';
      for (let j = 0; j < 3; j++) {
        const p = (S.t * 0.5 + j * 0.33 + i * 0.2) % 1;
        ctx.beginPath();
        ctx.arc(fx2 + 14 + p * 100, boatY - fh2 - 14 - p * 80, (11 + p * 22) * ds, 0, 7); ctx.fill();
      }
    }
  });
  // 조타실 — 상부구조 맨 앞 위
  const bh3 = 34 * ds, by3 = boatY - bh3, bw3 = Math.min(130, (bB - bA) * 0.26);
  const bx3 = bB - bw3 - 4;
  ctx.fillStyle = '#f7f2e6'; ctx.fillRect(bx3, by3, bw3, bh3);
  ctx.strokeStyle = '#8a6d1f'; ctx.lineWidth = 2; ctx.strokeRect(bx3, by3, bw3, bh3);
  ctx.fillStyle = '#3b3b3b'; ctx.fillRect(bx3 + 7, by3 + bh3 * 0.18, bw3 - 14, bh3 * 0.44);
  ctx.fillStyle = '#7fc9ff'; ctx.fillRect(bx3 + 10, by3 + bh3 * 0.24, bw3 - 20, bh3 * 0.32);
  drawPerson(bx3 + 22, by3 + bh3 * 0.96, 22 * ds, '#3b2f2f', S.t * 2, 100);
  ctx.strokeStyle = '#8a5a3b'; ctx.lineWidth = 3;                    // 열린 함교 날개
  ctx.beginPath();
  ctx.moveTo(bx3 - 26, by3 + bh3); ctx.lineTo(bx3, by3 + bh3);
  ctx.moveTo(bx3 - 26, by3 + bh3 - 10); ctx.lineTo(bx3 - 26, by3 + bh3); ctx.stroke();
  ctx.fillStyle = '#04384f'; ctx.font = 'bold 14px 맑은 고딕'; ctx.textAlign = 'left';
  ctx.fillText('조타실 (나)', bx3 - 6, by3 - 6);
  // 돛대 두 개 (웰데크에 서 있다) + 화물 붐 + 망대
  const mh = 190 * ds;
  [[sB + 26, 1], [sA - 26, 0]].forEach(([mmx, isFore]) => {
    ctx.strokeStyle = '#8a5a3b'; ctx.lineWidth = 7 * ds;
    ctx.beginPath(); ctx.moveTo(mmx, deckY); ctx.lineTo(mmx, deckY - mh); ctx.stroke();
    ctx.lineWidth = 5 * ds;                                          // 화물 붐

    ctx.lineTo(mmx + (isFore ? 66 : -66) * ds, deckY - mh * 0.1); ctx.stroke();
    ctx.lineWidth = 4 * ds;                                          // 가로 활대
    ctx.beginPath();
    ctx.moveTo(mmx - 38 * ds, deckY - mh * 0.72); ctx.lineTo(mmx + 38 * ds, deckY - mh * 0.72); ctx.stroke();
    if (isFore) {                                                    // 망대
      ctx.fillStyle = '#a1683a'; ctx.fillRect(mmx - 15 * ds, deckY - mh * 0.82, 30 * ds, 19 * ds);
      drawPerson(mmx, deckY - mh * 0.82 + 5 * ds, 20 * ds, '#2c3e50', S.t * 2, 100);
    }
  });
  // 밧줄 (돛대 ↔ 굴뚝 꼭대기)
  ctx.strokeStyle = 'rgba(60,50,40,.5)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sB + 26, deckY - mh); ctx.lineTo(bB - 40, boatY - fh2 * 0.9);
  ctx.moveTo(sA - 26, deckY - mh); ctx.lineTo(bA + 40, boatY - fh2 * 0.9);
  ctx.stroke();
}

function drawCruiseCut(s) {
  if (S.era === 'old') { drawOldLiner(s); return; }    // 옛날배는 아예 다른 그림
  const t = spec(s), decks = t.decks, dh = DH, F = hullF(t);
  const inHull = deckInHull(t);                  // 4층부터는 아래 2개 층이 선체 안으로
  const D = hullDeep(t);
  const W = hullW(t);
  const cap = shipCap(s), ratio = Math.min(1, s.load / Math.max(1, cap));
  const run = s.stage === 'sail';
  const old = S.era === 'old';                   // 🕰️ 1900년대 옛날배 모드
  curBow = W * bowOf(s);                         // 뱃머리 길이
  const rooms = (s.custom && s.custom.rooms && s.custom.rooms.length) ? s.custom.rooms
              : (old ? ROOMS_OLD : ROOMS);
  const opt = s.custom || {pool: !old, slide: !old, heli: false};

  drawHullBase(s, t, W, F, D);

  let shown = 0;
  const totalShow = Math.round(ratio * (decks * 7 + 5));
  const PCOL = ['#e74c3c','#3498db','#f1c40f','#2ecc71','#9b59b6','#e67e22'];
  // 층 하나에 방과 손님을 채운다
  const fillDeck = (y, rear, front, idx) => {
    const w = front - rear;
    const n = Math.max(2, Math.round(w / (dh * 2.3))), rw = w / n;
    for (let r = 0; r < n; r++)
      drawRoom(rooms[(r + idx * 3) % rooms.length], rear + r * rw, y, rw, dh);
    const cnt = Math.min(8, Math.max(0, totalShow - shown)); shown += cnt;
    for (let i = 0; i < cnt; i++) {
      const seed = i * 137 + idx * 61, sp = 24 + (i % 5) * 10;
      const px = ((S.t * sp + seed) % (w - 30)) + rear + 15;
      drawPerson(px, y + dh - 5, 23, PCOL[i % 6], S.t * 6 + i, s.mood);
    }
  };

  // ── 선체 속: (아래층 객실) + 엔진실 · 짐칸
  ctx.save(); hullPath(W, F, D); ctx.clip();
  for (let i = 0; i < inHull; i++) {              // 물에 잠긴 아래 층들
    const y = -F + i * dh, rear = -W / 2 + 26, front = W / 2 - 30;
    ctx.fillStyle = (i % 2) ? '#f7fbff' : '#eaf3fb';
    ctx.fillRect(rear, y, front - rear, dh);
    fillDeck(y, rear, front, i);
    ctx.strokeStyle = '#9fb6c9'; ctx.lineWidth = 2;
    ctx.strokeRect(rear, y, front - rear, dh);
  }
  const iy = inHull ? (-F + inHull * dh + 2) : (-F * 0.15), ih = D - iy - 4;
  const ex = -W / 2 + 34, ew = Math.max(150, W * 0.3);
  if (old) {                                     // ── 석탄 보일러실
    ctx.fillStyle = '#332b26'; ctx.fillRect(ex, iy, ew, ih);
    for (let i = 0; i < 2; i++) {
      const bx2 = ex + 16 + i * (ew - 40) / 2, bh2 = ih - 22;
      ctx.fillStyle = '#5b5049'; ctx.fillRect(bx2, iy + 8, (ew - 60) / 2, bh2);
      const cx2 = bx2 + (ew - 60) / 4, cy2 = iy + 8 + bh2 / 2;
      ctx.fillStyle = '#241f1b'; ctx.beginPath(); ctx.arc(cx2, cy2, 15, 0, 7); ctx.fill();
      if (run) {
        ctx.fillStyle = 'rgba(255,140,40,.95)';
        ctx.beginPath(); ctx.arc(cx2, cy2, 9 + Math.sin(S.t * 8 + i) * 3, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,220,120,.9)';
        ctx.beginPath(); ctx.arc(cx2, cy2, 4 + Math.cos(S.t * 9 + i) * 2, 0, 7); ctx.fill();
      }
    }
    ctx.fillStyle = '#15130f';                   // 석탄 더미
    for (let i = 0; i < 10; i++) {
      ctx.beginPath();
      ctx.arc(ex + ew - 46 + (i % 5) * 9, iy + ih - 8 - Math.floor(i / 5) * 9, 6, 0, 7);
      ctx.fill();
    }
    drawPerson(ex + ew - 66, iy + ih - 4, 26, '#4b3832', S.t * 6, 100);   // 화부
    ctx.fillStyle = '#ffd75e'; ctx.font = 'bold 16px 맑은 고딕'; ctx.textAlign = 'left';
    ctx.fillText('석탄 보일러실', ex + 8, iy + ih - 4);
  } else {
  ctx.fillStyle = '#3d4c5c'; ctx.fillRect(ex, iy, ew, ih);
  ctx.fillStyle = '#5b6b7c'; ctx.fillRect(ex + 14, iy + 20, ew - 28, ih - 30);
  for (let i = 0; i < 3; i++) {
    const px = ex + 24 + i * (ew - 60) / 3, ph = run ? Math.sin(S.t * 9 + i * 2) * 6 : 0;
    ctx.fillStyle = '#9fb0c0'; ctx.fillRect(px, iy + 4 + ph, 18, 20);
    ctx.fillStyle = '#c8d4de'; ctx.fillRect(px + 6, iy + 22 + ph, 6, 12);
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(px - 2, iy + 34, 22, 8);
    if (run) { ctx.fillStyle = 'rgba(255,150,60,.7)'; ctx.fillRect(px + 2, iy + 44, 14, 6); }
  }
  ctx.fillStyle = '#ffd75e'; ctx.font = 'bold 16px 맑은 고딕'; ctx.textAlign = 'left';
  ctx.fillText('엔진실', ex + 8, iy + ih - 4);
  }
  const lx = ex + ew + 4, lw = W / 2 - 40 - lx;
  ctx.fillStyle = '#5c4a34'; ctx.fillRect(lx, iy, lw, ih);
  const bagc = ['#c0392b','#2980b9','#27ae60','#8e44ad','#d35400','#16a085'];
  for (let i = 0; i * 46 < lw - 30; i++) {
    const bx = lx + 12 + i * 46;
    ctx.fillStyle = bagc[i % 6]; ctx.fillRect(bx, iy + 26, 32, 22);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx + 16, iy + 26, 7, Math.PI, 0); ctx.stroke();
  }
  for (let i = 0; i * 88 < lw - 50; i++) {
    const bx = lx + 18 + i * 88;
    ctx.fillStyle = '#a1683a'; ctx.fillRect(bx, iy + 2, 38, 20);
    ctx.strokeStyle = '#6b4426'; ctx.lineWidth = 2; ctx.strokeRect(bx, iy + 2, 38, 20);
    ctx.beginPath(); ctx.moveTo(bx, iy + 2); ctx.lineTo(bx + 38, iy + 22);
    ctx.moveTo(bx + 38, iy + 2); ctx.lineTo(bx, iy + 22); ctx.stroke();
  }
  ctx.fillStyle = '#ffe6b0'; ctx.fillText('짐칸', lx + 8, iy + ih - 4);
  ctx.restore();

  drawHullSkin(s, t, W, F, D, inHull > 0);

  // ── 선체 위 층 (선체 안으로 들어간 층은 빼고)
  const prom = inHull ? 42 : 10;                 // 구명정이 걸리는 산책 갑판
  const base = -F - prom, up = decks - inHull;
  if (inHull) {
    ctx.fillStyle = '#f2f7fb'; ctx.fillRect(-W / 2 + 30, base, W - 66, prom);
    ctx.strokeStyle = '#9fb6c9'; ctx.lineWidth = 2;
    ctx.strokeRect(-W / 2 + 30, base, W - 66, prom);
    // 배 이름과 닻 (산책 갑판에)
    const ny = base + 28;
    ctx.fillStyle = '#22313f'; ctx.font = 'bold 17px 맑은 고딕'; ctx.textAlign = 'right';
    ctx.fillText(s.name || '', W / 2 - 76, ny);
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W / 2 - 52, ny - 20); ctx.lineTo(W / 2 - 52, ny - 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W / 2 - 60, ny - 15); ctx.lineTo(W / 2 - 44, ny - 15); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2 - 52, ny - 4, 8, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  const half = deckFrac(s) * (W / 2 - 16);       // 손님 타는 곳 반쪽 길이
  for (let d = 0; d < up; d++) {
    const y = base - dh * (d + 1);
    const front = half - d * 10, rear = -half + d * 7;
    deckPath(rear, front, y, dh);
    ctx.fillStyle = (d % 2) ? '#f7fbff' : '#eaf3fb'; ctx.fill();
    ctx.save(); deckPath(rear, front, y, dh); ctx.clip();
    fillDeck(y, rear, front, inHull + d);
    ctx.restore();
    deckPath(rear, front, y, dh);
    ctx.strokeStyle = '#9fb6c9'; ctx.lineWidth = 2; ctx.stroke();
  }
  // ── 구명보트 (2층부터)
  if (decks >= 2) {
    const nb = boatCount(t);
    const lr = -W / 2 + 110, lf = W / 2 - 250, gap = (lf - lr) / Math.max(1, nb - 1);
    const ly = inHull ? base + 26 : base + 12;
    for (let i = 0; i < nb; i++) drawLifeboat(lr + i * gap, ly, inHull ? 1.15 : 1.25);
  }
  // ── 맨 위 야외 갑판
  const topY = base - dh * (up + 1);
  const tf = half - up * 10, tr = -half + up * 7, tw = tf - tr;
  deckPath(tr, tf, topY, dh);
  ctx.fillStyle = '#e8f6ff'; ctx.fill();
  ctx.strokeStyle = '#9fb6c9'; ctx.lineWidth = 2; ctx.stroke();
  railing(tr + 4, tf - 6, topY);
  if (opt.pool) {                                     // 수영장
    const pw = Math.min(150, tw * 0.32), px = tr + 46;
    ctx.fillStyle = '#2fa8e0'; ctx.fillRect(px, topY + 18, pw, dh - 26);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(px, topY + 18, pw, dh - 26);
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    for (let i = 0; i < 4; i++)
      ctx.fillRect(px + 6 + i * (pw / 4), topY + 26 + Math.sin(S.t * 4 + i) * 3, pw / 6, 3);
    ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px - 4, topY + 14); ctx.lineTo(px - 4, topY + 34);
    ctx.moveTo(px + 6, topY + 14); ctx.lineTo(px + 6, topY + 34);
    ctx.moveTo(px - 4, topY + 22); ctx.lineTo(px + 6, topY + 22); ctx.stroke();
    const swim = Math.max(0, Math.min(4, Math.round(ratio * 4)));
    for (let i = 0; i < swim; i++)
      drawPerson(px + 14 + i * (pw / 4), topY + 36, 18, '#ffe27a', S.t * 8 + i, s.mood);
    ctx.strokeStyle = '#8a5a3b'; ctx.lineWidth = 3;                 // 파라솔
    ctx.beginPath(); ctx.moveTo(px + pw + 16, topY + dh - 4); ctx.lineTo(px + pw + 16, topY + 14); ctx.stroke();
    ctx.fillStyle = '#e74c3c'; ctx.beginPath();
    ctx.moveTo(px + pw - 6, topY + 18);
    ctx.quadraticCurveTo(px + pw + 16, topY + 2, px + pw + 38, topY + 18);
    ctx.closePath(); ctx.fill();
  }
  if (opt.slide) {                                    // 미끄럼틀
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 9; ctx.beginPath();
    ctx.moveTo(tf - 150, topY + dh);
    ctx.quadraticCurveTo(tf - 66, topY - 40, tf - 40, topY + dh);
    ctx.stroke();
  }
  const ds = topScale(t);                             // 작은 배는 위쪽 구조물도 작게
  if (opt.heli) {                                     // 헬기장
    const hw = Math.min(96, tw * 0.3);
    ctx.fillStyle = '#37474f'; ctx.fillRect(tr + 6, topY - 16, hw, 16);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(tr + 6 + hw / 2, topY - 8, hw * 0.23, Math.PI, 0); ctx.stroke();
    ctx.font = 'bold 15px 맑은 고딕'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText('H', tr + 6 + hw / 2, topY - 3);
  }
  if (old) {
    // ── 갑판 의자
    if (!opt.pool) {
      for (let i = 0; i < 6; i++) {
        const cx3 = tr + 34 + i * 52;
        if (cx3 > tf - 80) break;
        ctx.fillStyle = '#e8e0cf'; ctx.beginPath();
        ctx.moveTo(cx3, topY + dh - 6); ctx.lineTo(cx3 + 26, topY + dh - 6);
        ctx.lineTo(cx3 + 26, topY + dh - 15); ctx.lineTo(cx3 + 5, topY + dh - 28);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#b9a97f'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
    // ── 굴뚝 여러 개 (버프색 몸통 + 검은 꼭대기)
    const nf = (s.custom && s.custom.funnels) || (decks >= 5 ? 4 : decks >= 3 ? 3 : 2);
    const fp = (s.custom && s.custom.fpos) || 2;          // 1 뒤쪽 · 2 가운데 · 3 앞쪽
    const spread = Math.min(0.55, 0.14 * (nf - 1));
    const fa = fp === 1 ? 0.06 : fp === 3 ? (0.68 - spread) : (0.7 - spread) / 2 + 0.02;
    const fw2 = 26 * ds, fh2 = 104 * ds;
    for (let i = 0; i < nf; i++) {
      const fx2 = tr + tw * (fa + (nf > 1 ? i * spread / (nf - 1) : 0));
      ctx.fillStyle = '#d9a441'; ctx.beginPath();
      ctx.moveTo(fx2 - fw2, topY + 4); ctx.lineTo(fx2 + fw2, topY + 4);
      ctx.lineTo(fx2 + fw2 + 10 * ds, topY - fh2); ctx.lineTo(fx2 - fw2 + 12 * ds, topY - fh2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#a97c22'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#1c1c1c'; ctx.beginPath();
      ctx.moveTo(fx2 - fw2 + 9 * ds, topY - fh2 * 0.78);
      ctx.lineTo(fx2 + fw2 + 2 * ds, topY - fh2 * 0.78);
      ctx.lineTo(fx2 + fw2 + 10 * ds, topY - fh2);
      ctx.lineTo(fx2 - fw2 + 12 * ds, topY - fh2);
      ctx.closePath(); ctx.fill();
      if (run) {
        ctx.fillStyle = 'rgba(74,74,80,.55)';
        for (let j = 0; j < 3; j++) {
          const q = (S.t * 0.55 + j * 0.33 + i * 0.2) % 1;
          ctx.beginPath();
          ctx.arc(fx2 + 12 + q * 90, topY - fh2 - 12 - q * 80, (11 + q * 20) * ds, 0, 7);
          ctx.fill();
        }
      }
    }
    // ── 돛대 두 개 + 망대 + 밧줄
    const mh2 = 150 * ds, m1 = tf - 46, m2 = tr + 30;
    [m1, m2].forEach((mmx, i) => {
      ctx.strokeStyle = '#8a5a3b'; ctx.lineWidth = 6 * ds;
      ctx.beginPath(); ctx.moveTo(mmx, topY + dh); ctx.lineTo(mmx, topY - mh2); ctx.stroke();
      ctx.lineWidth = 4 * ds;
      ctx.beginPath();
      ctx.moveTo(mmx - 34 * ds, topY - mh2 * 0.62);
      ctx.lineTo(mmx + 34 * ds, topY - mh2 * 0.62); ctx.stroke();
      if (i === 0) {                                   // 망대(까마귀 둥지)
        ctx.fillStyle = '#a1683a';
        ctx.fillRect(mmx - 14 * ds, topY - mh2 * 0.74, 28 * ds, 18 * ds);
        drawPerson(mmx, topY - mh2 * 0.74 + 4 * ds, 20 * ds, '#2c3e50', S.t * 2, 100);
      }
    });
    ctx.strokeStyle = 'rgba(60,50,40,.5)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(m2, topY - mh2); ctx.lineTo(tr + tw * 0.3, topY - fh2 * 0.92);
    ctx.moveTo(m1, topY - mh2); ctx.lineTo(tr + tw * 0.66, topY - fh2 * 0.92);
    ctx.stroke();
    // ── 조타실 (나무 · 레이더 없음)
    const bh3 = 40 * ds, by3 = topY - bh3;
    const bw3 = Math.min(140, tw * 0.3), bx3 = tf - bw3 - 8;
    ctx.fillStyle = '#f4f1e6'; ctx.fillRect(bx3, by3, bw3, bh3);
    ctx.strokeStyle = '#8a6d1f'; ctx.lineWidth = 2; ctx.strokeRect(bx3, by3, bw3, bh3);
    ctx.fillStyle = '#3b3b3b'; ctx.fillRect(bx3 + 8, by3 + bh3 * 0.18, bw3 - 16, bh3 * 0.42);
    ctx.fillStyle = '#7fc9ff'; ctx.fillRect(bx3 + 11, by3 + bh3 * 0.24, bw3 - 22, bh3 * 0.3);
    drawPerson(bx3 + 26, by3 + bh3 * 0.96, 24 * ds, '#3b2f2f', S.t * 2, 100);
    ctx.save(); ctx.translate(bx3 + bw3 - 26, by3 + bh3 * 0.75);
    ctx.rotate(Math.sin(S.t * 1.2) * 0.5);
    ctx.strokeStyle = '#8a5a3b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 9 * ds, 0, 7); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate(i * 0.785);
      ctx.beginPath(); ctx.moveTo(-12 * ds, 0); ctx.lineTo(12 * ds, 0); ctx.stroke(); ctx.restore();
    }
    ctx.restore();
    ctx.fillStyle = '#04384f'; ctx.font = 'bold 14px 맑은 고딕'; ctx.textAlign = 'left';
    ctx.fillText('조타실 (나)', bx3 - 4, by3 - 6);
    return;
  }
  // 굴뚝 (살짝 기울어진 진짜 모양)
  const fx = tr + tw * 0.56, fh = 54 * ds, fw = 26 * (0.72 + 0.28 * ds);
  ctx.fillStyle = '#e8eef4'; ctx.beginPath();
  ctx.moveTo(fx - fw, topY + 4); ctx.lineTo(fx + fw, topY + 4);
  ctx.lineTo(fx + fw + 8 * ds, topY - fh); ctx.lineTo(fx - fw + 22 * ds, topY - fh);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#9fb6c9'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#e74c3c'; ctx.beginPath();
  ctx.moveTo(fx - fw + 12 * ds, topY - fh * 0.48); ctx.lineTo(fx + fw + 4 * ds, topY - fh * 0.48);
  ctx.lineTo(fx + fw + 8 * ds, topY - fh * 0.93); ctx.lineTo(fx - fw + 21 * ds, topY - fh * 0.93);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(fx - fw + 18 * ds, topY - fh - 6, fw * 1.6, 8);
  if (run) {
    ctx.fillStyle = 'rgba(220,230,240,.7)';
    for (let i = 0; i < 4; i++) {
      const q = (S.t * 0.7 + i * 0.25) % 1;
      ctx.beginPath();
      ctx.arc(fx + 16 + q * 70, topY - fh - 10 - q * 90, (12 + q * 20) * (0.6 + 0.4 * ds), 0, 7);
      ctx.fill();
    }
  }
  // 조타실 — 진짜 배처럼 맨 앞 위쪽
  const bh = 44 * ds, by = topY - bh;
  const bw = Math.min(150, tw * 0.34), bx = tf - bw - 8;
  ctx.fillStyle = '#eef4fa'; ctx.beginPath();
  ctx.moveTo(bx, by + bh); ctx.lineTo(bx, by + bh * 0.14);
  ctx.lineTo(bx + 14, by); ctx.lineTo(bx + bw, by);
  ctx.lineTo(bx + bw + 10, by + bh);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#9fb6c9'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#2c3e50'; ctx.beginPath();                        // 앞으로 기운 창문
  ctx.moveTo(bx + 8, by + bh * 0.68); ctx.lineTo(bx + 16, by + bh * 0.18);
  ctx.lineTo(bx + bw - 4, by + bh * 0.18); ctx.lineTo(bx + bw + 2, by + bh * 0.68);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5dade2'; ctx.beginPath();
  ctx.moveTo(bx + 13, by + bh * 0.61); ctx.lineTo(bx + 19, by + bh * 0.25);
  ctx.lineTo(bx + bw - 7, by + bh * 0.25); ctx.lineTo(bx + bw - 2, by + bh * 0.61);
  ctx.closePath(); ctx.fill();
  drawPerson(bx + 30, by + bh * 0.96, 26 * ds, '#1a3d5c', S.t * 2, 100);
  ctx.save(); ctx.translate(bx + bw - 24, by + bh * 0.77);           // 조타륜
  ctx.rotate(Math.sin(S.t * 1.3) * 0.5);
  ctx.strokeStyle = '#8a5a3b'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 8 * ds, 0, 7); ctx.stroke();
  for (let i = 0; i < 4; i++) {
    ctx.save(); ctx.rotate(i * 0.785);
    ctx.beginPath(); ctx.moveTo(-11 * ds, 0); ctx.lineTo(11 * ds, 0); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  ctx.fillStyle = '#04384f'; ctx.font = 'bold 14px 맑은 고딕'; ctx.textAlign = 'left';
  ctx.fillText('조타실 (나)', bx - 4, by - 6);
  // 마스트 + 레이더 + 깃발
  const mx = bx + bw - 40, mh = 66 * ds;
  ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(mx, by); ctx.lineTo(mx, by - mh); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(mx - 20 * ds, by - mh * 0.6); ctx.lineTo(mx + 20 * ds, by - mh * 0.6); ctx.stroke();
  ctx.save(); ctx.translate(mx, by - mh); ctx.scale(Math.cos(S.t * 2), 1);
  ctx.fillStyle = '#bdc3c7'; ctx.fillRect(-16 * ds, -6, 32 * ds, 8); ctx.restore();
  ctx.fillStyle = '#e74c3c'; ctx.beginPath();
  ctx.moveTo(mx, by - mh * 0.55);
  ctx.lineTo(mx - (34 + Math.sin(S.t * 6) * 5) * ds, by - mh * 0.42);
  ctx.lineTo(mx, by - mh * 0.3); ctx.fill();
}

function drawCargoCut(s) {
  const t = spec(s), rows = 1 + t.decks, F = hullF(t), D = hullD(t);
  const W = hullW(t);
  const ratio = Math.min(1, s.load / Math.max(1, shipCap(s)));
  const run = s.stage === 'sail';
  const old = S.era === 'old';
  curBow = W * bowOf(s);                         // 뱃머리 길이 (선체 그리기 전에!)
  drawHullBase(s, t, W, F, D);

  const cols = old ? ['#a1683a','#8a5a3b','#b98a52','#96602f','#7d4f2a']
                   : ['#e74c3c','#f1c40f','#2ecc71','#3498db','#e67e22'];
  const houseW = Math.min(170, Math.max(110, W * 0.13));
  const bayX = -W / 2 + 44 + houseW + 30, bayW = W / 2 - 70 - bayX;
  const per = Math.max(2, Math.floor(bayW / 84));
  const total = rows * per, filled = Math.round(total * ratio);
  const box = (x, y, c) => {
    ctx.fillStyle = c; ctx.fillRect(x, y, 74, 32);
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 2; ctx.strokeRect(x, y, 74, 32);
    if (old) {                                   // 나무 상자 (1900년대)
      ctx.strokeStyle = 'rgba(60,35,15,.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 74, y + 32);
      ctx.moveTo(x + 74, y); ctx.lineTo(x, y + 32); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + 4, y + 4, 66, 3);
      return;
    }
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + 6, y + 6, 62, 4);
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
    for (let g = 1; g < 5; g++) {
      ctx.beginPath(); ctx.moveTo(x + g * 14, y + 12); ctx.lineTo(x + g * 14, y + 30); ctx.stroke();
    }
  };
  // ── 선체 속: 엔진실 + 짐칸 한 줄
  ctx.save(); hullPath(W, F, D); ctx.clip();
  const iy = -F + 40, ih = D - iy - 4;
  const ex = -W / 2 + 34, ew = Math.max(130, W * 0.24);
  ctx.fillStyle = old ? '#332b26' : '#3d4c5c'; ctx.fillRect(ex, iy, ew, ih);
  for (let i = 0; i < 3; i++) {
    const px = ex + 20 + i * (ew - 50) / 3, ph = run ? Math.sin(S.t * 9 + i * 2) * 6 : 0;
    if (old) {                                   // 석탄 보일러
      ctx.fillStyle = '#5b5049'; ctx.fillRect(px - 4, iy + 6, 34, ih - 18);
      ctx.fillStyle = '#241f1b'; ctx.beginPath(); ctx.arc(px + 13, iy + ih / 2, 11, 0, 7); ctx.fill();
      if (run) {
        ctx.fillStyle = 'rgba(255,140,40,.95)';
        ctx.beginPath(); ctx.arc(px + 13, iy + ih / 2, 6 + Math.sin(S.t * 8 + i) * 2, 0, 7); ctx.fill();
      }
      continue;
    }
    ctx.fillStyle = '#9fb0c0'; ctx.fillRect(px, iy + 4 + ph, 16, 20);
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(px - 2, iy + 34, 20, 8);
    if (run) { ctx.fillStyle = 'rgba(255,150,60,.7)'; ctx.fillRect(px + 1, iy + 44, 13, 6); }
  }
  ctx.fillStyle = '#ffd75e'; ctx.font = 'bold 16px 맑은 고딕'; ctx.textAlign = 'left';
  ctx.fillText(old ? '석탄 보일러실' : '엔진실', ex + 8, iy + ih - 4);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(bayX - 10, iy - 4, bayW + 20, ih + 4);
  let n = 0;
  for (let c = 0; c < per; c++) { n++; if (n <= filled) box(bayX + c * 84, iy + 6, cols[c % 5]); }
  ctx.restore();
  drawHullSkin(s, t, W, F, D);

  // ── 갑판 위에 쌓인 컨테이너
  const deckY = -F - 14;
  for (let r = 1; r < rows; r++) for (let c = 0; c < per; c++) {
    n++; if (n > filled) continue;
    box(bayX + c * 84, deckY - (r - 1) * 36 - 32, cols[(r + c) % 5]);
  }
  // 컨테이너 고정 기둥 (쌓인 높이만큼만)
  const stack = Math.max(0, Math.ceil((filled - per) / per));
  if (stack > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
    for (let c = 0; c <= per; c++) {
      ctx.beginPath(); ctx.moveTo(bayX + c * 84 - 5, deckY);
      ctx.lineTo(bayX + c * 84 - 5, deckY - stack * 36 - 10); ctx.stroke();
    }
  }
  // ── 선원이 사는 집 + 굴뚝 (배 뒤쪽)
  const th = Math.min(200, 56 + rows * 26), tx = -W / 2 + 44, tw2 = houseW;
  ctx.fillStyle = '#eef4fa'; ctx.fillRect(tx, deckY - th, tw2, th);
  ctx.strokeStyle = '#9fb6c9'; ctx.lineWidth = 2; ctx.strokeRect(tx, deckY - th, tw2, th);
  ctx.fillStyle = '#2c3e50'; ctx.fillRect(tx + 8, deckY - th + 8, tw2 - 16, 20);
  ctx.fillStyle = '#5dade2'; ctx.fillRect(tx + 11, deckY - th + 11, tw2 - 22, 14);
  drawPerson(tx + 30, deckY - th + 30, 24, '#1a3d5c', S.t * 2, 100);
  for (let i = 0; i * 26 < th - 44; i++)
    for (let j = 0; j < 4; j++) {
      ctx.fillStyle = '#7fc9ff';
      ctx.fillRect(tx + 12 + j * 30, deckY - th + 40 + i * 26, 18, 14);
    }
  ctx.fillStyle = old ? '#d9a441' : '#e0e6ec';
  ctx.fillRect(tx + 44, deckY - th - (old ? 78 : 48), 36, old ? 80 : 50);
  if (!old) { ctx.fillStyle = '#c0392b'; ctx.fillRect(tx + 44, deckY - th - 34, 36, 12); }
  ctx.fillStyle = old ? '#1c1c1c' : '#333';
  ctx.fillRect(tx + 42, deckY - th - (old ? 84 : 54), 40, old ? 22 : 8);
  if (run) {
    ctx.fillStyle = 'rgba(90,100,110,.55)';
    for (let i = 0; i < 4; i++) {
      const q = (S.t * 0.6 + i * 0.25) % 1;
      ctx.beginPath(); ctx.arc(tx + 62 + q * 40, deckY - th - 58 - q * 90, 11 + q * 18, 0, 7); ctx.fill();
    }
  }
  // ── 크레인
  const cy = deckY - (rows - 1) * 36 - 76;
  ctx.strokeStyle = old ? '#8a5a3b' : '#f1c40f'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(bayX - 24, deckY); ctx.lineTo(bayX - 24, cy);
  ctx.lineTo(bayX + 200, cy); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(bayX - 24, cy + 50); ctx.lineTo(bayX + 20, cy); ctx.stroke();
  const hx = bayX + 20 + ((S.t * 60) % 160);
  ctx.lineWidth = 3; ctx.strokeStyle = '#bbb';
  ctx.beginPath(); ctx.moveTo(hx, cy); ctx.lineTo(hx, cy + 34); ctx.stroke();
  ctx.fillStyle = '#e67e22'; ctx.fillRect(hx - 24, cy + 34, 48, 22);
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2; ctx.strokeRect(hx - 24, cy + 34, 48, 22);
  ctx.fillStyle = '#04384f'; ctx.font = '15px 맑은 고딕'; ctx.textAlign = 'left';
  ctx.fillText('크레인', bayX - 18, cy - 8);
  // ── 뱃머리 마스트
  ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(W / 2 - 76, deckY); ctx.lineTo(W / 2 - 76, deckY - 60); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W / 2 - 94, deckY - 40); ctx.lineTo(W / 2 - 58, deckY - 40); ctx.stroke();
  ctx.fillStyle = '#e74c3c'; ctx.beginPath();
  ctx.moveTo(W / 2 - 76, deckY - 60);
  ctx.lineTo(W / 2 - 108 - Math.sin(S.t * 6) * 5, deckY - 52);
  ctx.lineTo(W / 2 - 76, deckY - 44); ctx.fill();
}

/* 사람 그리기 — 기분이 나쁘면 초록 얼굴 */
function drawPerson(x, y, h, col, ph, mood) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col;
  ctx.fillRect(-h * 0.13, -h * 0.72, h * 0.26, h * 0.44);
  ctx.beginPath(); ctx.arc(0, -h * 0.8, h * 0.16, 0, 7);
  ctx.fillStyle = (mood !== undefined && mood < 45) ? '#a9d18e' : '#ffdcb0'; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, h * 0.07);
  const sw = Math.sin(ph) * h * 0.13;
  ctx.beginPath(); ctx.moveTo(0, -h * 0.28); ctx.lineTo(sw, 0);
  ctx.moveTo(0, -h * 0.28); ctx.lineTo(-sw, 0); ctx.stroke();
  ctx.restore();
}

    else if (blink) { ctx.fillStyle = '#8dffb0'; ctx.fillText('▶ 스페이스 또는 → 를 누르면 출발!', cvW / 2, cvH - 58); }

    } else if (s.big && !s.big.gone && pos / L < s.big.a) {

    ctx.fillText(camX > 0 ? '◀ 배꼬리 쪽을 보는 중 (휠로 돌아가기)' : '뱃머리 쪽을 보는 중 ▶ (휠로 돌아가기)',

  // 도착 정산
